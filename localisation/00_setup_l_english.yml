 mandate_advisor: "Grand Secretary"
 mandate_advisor_desc: ""
 magistrate: "Magistrate"
 magistrate_desc: "Magistrates overlook the political authorities of our state and actively work against any types of bribery or embezzlement."
 visionary: "Visionary"
 visionary_desc: "Visionaries are educated people who wish to make our country prosperous by embracing new ideas."
 architect: "Architect"
 architect_desc: "Architects are in charge of the construction projects in our country."
 colonist: "Colonist"
 colonist_desc: "Colonist governs our colonies and overlooks their development and growth."
 siegeengineer: "Siege Engineer"
 siegeengineer_desc: "Siege Engineers are professionals in the construction of siege equipment. Their skills might allow us to breach the walls of enemy cities with ease."
 dockmaster: "Dockmaster"
 dockmaster_desc: "Dockmaster is a person in charge of a dock used for freight, logistics, and repair or maintenance of ships."
 planner: "Planner"
 planner_desc: "Planner controls and plans development of our municipalities."
 drillmaster: "Drillmaster"
 drillmaster_desc: "Drillmaster ensures preparation of soldiers for performance of their duties in peace and war through the practice and rehearsal of prescribed movements."
 dragoon: "Dragoon"
 dragoon_desc: "Armed with a sabre and a firearm, the Dragoons are an essential part of our cavalry units."
 councilor: "Imperial Councilor"
 councilor_desc: "Imperial Councilor protects our interests at the Imperial Court of the Holy Roman Empire."
 missionary: "Missionary"
 missionary_desc: "Missionary is a member of a religious group who travels around our country and performs ministries of service, such as education, literacy and promotion of religious values."
 scholar: "Scholar"
 scholar_desc: "Scholar is a person who devotes time to scholarly pursuits, particularly to the development of expertise in one area of study. Their work helps us to embrace new ideas from abroad."

### IMPERIAL IDEA GROUP ###
 imperial_ideas: "Imperial Ideas"
 imperial_first: "Justified Expansion"
 imperial_first_desc: "Our kinship ties and family history can be used to great effect in claiming knightly and ducal titles. As the centuries have passed, even the lowliest of noble houses can claim descent from one emperor or another, and we are no exception."
 imperial_second: "Trained Representatives"
 imperial_second_desc: "We have found that diplomatic mishaps are all too frequent when our relations are handled by proud noblemen and the members of our house. In order to solve this embarrassing and occasionally costly problem, we have replaced our traditional representatives with professional diplomats trained in both etiquette and policy."
 imperial_third: "Imperial Connections"
 imperial_third_desc: "Let us foster close alliances with those princes whose interests align with our own and mutually support each other in Imperial legal matters. This will give us an edge in the Colleges of the Imperial Diet as well as other institutions, allowing us to play a larger role in shaping the structures of the Empire."
 imperial_fourth: "Secured Succession"
 imperial_fourth_desc: "Many dukes and nobles foolishly turn up their noses at the less-esteemed branches of their family. Unlike them, we seek to maintain a close relationship with all the branches of our family so that we might always have an heir in line for succession."
 imperial_fifth: "The Pen is Mightier than the Sword"
 imperial_fifth_desc: "Warfare is not the only method of expansion - through forming alliances and eventually vassalizing our more vulnerable neighbours, we can slowly incorporate various counties and towns into our realm."
 imperial_sixth: "Political Adaptation"
 imperial_sixth_desc: "Until recently, the towns and lands under our rule were left to their own devices and were merely a source of revenue for our state. We must change this state of affairs. Let us cultivate ties with the guilds, burghers, and noblemen of our country and leverage those ties into involving ourselves with the everyday governance of the realm."
 imperial_seventh: "Ministry of Imperial Affairs"
 imperial_seventh_desc: "Due to our prominence among the princes and our frequent communications with the Emperor and the Electorate, we have seen fit to create a ministry wholly devoted to managing our position within the empire. This ministry will allow us to conduct diplomacy more efficiently within and without the empire."
 imperial_ideas_bonus: "Imperial Ideas"

### PROFESSIONAL IDEA GROUP ###
 professional_ideas: "Professional Ideas"
 professional_first: "Standardised Drilling"
 professional_first_desc: "Instead of giving each officer the ability to drill his troops as he sees fit, let us create a standardised set of drills and tactics to teach our soldiers. This will make drilling our regiments more efficient and will even out the quality between various regiments."
 professional_second: "Military Academies"
 professional_second_desc: "Until now, our officers and generals have been drawn almost at random from various nobles, relatives, and even lowly commoners from the ranks. It is time for us to found military academies which will provide a much steadier - and more uniform - class of men to draw on for leadership in our armies."
 professional_third: "Junior Officers"
 professional_third_desc: "While generals fill the history books, the lower officers are just as important. We must develop a large cadre of junior and noncommissioned officers which we can depend on in battle."
 professional_fourth: "Local Armories"
 professional_fourth_desc: "In order to ensure that our armies are always ready to face a threat, we must create armouries for each municipality within our realm. This will ensure that when reinforcements must be sent to the front on short notice, we will be able to quickly arm them."
 professional_fifth: "Retired Advisors"
 professional_fifth_desc: "Even though our older, retired generals may not be fit to lead our armies even from the back, their advice on strategy and military affairs can still be invaluable."
 professional_sixth: "General Staff"
 professional_sixth_desc: "To better organise our campaigns and armies, let us create an office for the General staff that can coordinate strategies, manoeuvres, and logistics."
 professional_seventh: "Optimistic Soldiery"
 professional_seventh_desc: "Our soldiers know that our armies outsrip most others, making them confident and unwavering in battle."
 professional_ideas_bonus: "Professional Ideas"

### STATE GOVERNANCE IDEA GROUP ###
 state_governance_ideas: "State Governance Ideas"
 state_governance_first: "Municipal Administration"
 state_governance_first_desc: "One of the greatest challenges to governing our provinces are long distances which prevent effective communication with local officials. By establishing administrative offices which can reasonably govern without our frequent intervention in the farther-flung municipalities, our realm will become more manageable."
 state_governance_second: "Bureaucratic Oversight"
 state_governance_second_desc: "Bureaucrats everywhere are known for their graft and schemes to profit from their positions. By assigning officers to oversee the bureaucracy and punishing corruption harshly, we can seriously limit what our officials can get away with."
 state_governance_third: "Local Elites"
 state_governance_third_desc: "Convincing local elites to work for us rather than installing our own governors in a conquered territory can be very helpful for preventing unrest."
 state_governance_fourth: "Administrative Nobility"
 state_governance_fourth_desc: "The old nobility is becoming a serious nuisance. It would be prudent to replace them with a new class of landowners who owe their position to the state."
 state_governance_fifth: "Accountability to the State"
 state_governance_fifth_desc: "It is time to finally reign in those officials and leaders who previously paid us no mind. We must require each official and major landowner to submit reports about the state of their lands and revenues and, based on such information, force them to act as we see fit."
 state_governance_sixth: "State Architects"
 state_governance_sixth_desc: "The cities and towns in our realm are a complete mess of archaic streets, old buildings, and useless walls. This must be rectified. Let us appoint architects with the power to rebuild towns and infrastructure so as to make them more conducive to trade, expansion, and life in general."
 state_governance_seventh: "Military Governors"
 state_governance_seventh_desc: "The officers and generals of our army are well-versed in inspiring obedience among their men through various means. Making our more capable military officials governors may help us subdue the people under our rule more effectively.\n§GUnlocks§! Modernised Local Administration Edict"
 state_governance_ideas_bonus: "State Governance Ideas"

### MERCENARY IDEA GROUP ###
 mercenary_ideas: "Mercenary Ideas"
 mercenary_second: "Expeditionary Forces"
 mercenary_second_desc: "To gain more battle experience, we shall create an expeditionary force that shall engage in the conflicts of foreign powers."
 mercenary_fourth: "Efficient War Taxing"
 mercenary_fourth_desc: "Our dependence on mercenaries costs the state a lot of money, and in order to be able to sufficiently fund our soldiers, we must come up with a more efficient way of collecting taxes during the war."
 mercenary_sixth: "Manpower Planning"
 mercenary_sixth_desc: "The fact that our nation utilises mercenaries to a large degree helps us to preserve our population and better manage acquisition, utilisation, improvement, and organisation of our human resources."
 mercenary_seventh: "Elite Mercenaries"
 mercenary_seventh_desc: "In order to be able to effectively combat the standing armies of our rival nations, we must considerably invest into the training and better equipment of mercenary companies serving the interests of our nation.\nRecruiting a mercenary company now costs §G0.00%§! Army Professionalism."
 mercenary_ideas_bonus: "Mercenary Ideas"

### CELESTIAL IDEA GROUP ###
 celestial_ideas: "Celestial Ideas"
 celestial_first: "Imperial Examination"
 celestial_first_desc: "Although selecting nobles for the most prestigious and important positions in our bureaucracy seems obvious, they are often little more than babbling buffoons. Selecting future bureaucrats based on scores in state examinations will allow us to retain only the best candidates, and open up these positions to a larger number of people."
 celestial_second: "Expand the Sphere of Influence"
 celestial_second_desc: "Our many tributaries provide us with much in the way of gold and cannon fodder. However, around us there are still weak and petty states waiting to serve. Expanding our sphere of influence will give us even more resources."
 celestial_third: "Strengthen the Mandate"
 celestial_third_desc: "Heaven has chosen us to rule China because of our wisdom and virtue. Although there is no doubt that our dynasty is perfectly legitimate, we will lose nothing by ensuring the Mandate is secure."
 celestial_fourth: "Reform the Cefeng System"
 celestial_fourth_desc: "The Cefeng system is a network of states which enable trade and military assistance throughout Asia. Since we are highly dependent on our tributaries to maintain this system, we must make them feel more like our partners than tools for our empire."
 celestial_fifth: "Grand Secretariat of the Six Ministries"
 celestial_fifth_desc: "Our empire is so vast that only a highly efficient administration can help us govern it. Fortunately, our six Grand Secretaries are chosen, for their administrative skills, from amongst the best candidates in China. Through them, we can govern from the largest cities to the remotest mountains."
 celestial_sixth: "Splendor of the Court"
 celestial_sixth_desc: "The court is a symbol of our prestige, as well as a means for us to control the nobility. Efforts to make it as splendid as possible ensure the loyalty of the aristocracy, and display our tremendous wealth and power to the world."
 celestial_seventh: "The Son of Heaven"
 celestial_seventh_desc: "We were chosen to rule not only the most powerful empire of the world, but Tianxia; all under Heaven. For this reason, as holder of the Mandate, the Emperor is not just a man, but a living god: the Son of Heaven."
 celestial_ideas_bonus: "Celestial Ideas"

### ADMINISTRATIVE IDEA GROUP ###
 admin_first: "Streamlined Bureaucracy"
 admin_first_desc: "It is important in matters of the state to ensure the utmost efficiency when introducing new government offices to avoid creating a top-heavy administration. To this end we will ensure that our bureaucracy contains no redundant positions."
 admin_third: "Delegation of Governance"
 admin_third_desc: "No King can rule alone. Without loyal and hardworking representatives, a sovereign is but a man in a large house, and a throne nothing more than a large chair."
 admin_fifth: "Local Garrisons"
 admin_fifth_desc: "The people of our state must understand who they owe loyalty to at all times. By conscripting the locals to man garrisons in their own regions, we can ensure that a sense of patriotism and duty is instilled throughout all regions in our domain."

### DOMINATION IDEA GROUP ###
 globaldomination_ideas: "Global Domination Ideas"
 globaldomination_ideas_bonus: "Global Domination Ideas"
 domination_first: "Enlightened Absolutism"
 domination_first_desc: "It is, all of a sudden, undeniable to the world that our nation is supreme above all others. It is furthermore undeniable that our ruler and his counsel's will is above all - for our ruler is in agreement with Heaven itself."
 domination_second: "Scramble for Africa"
 domination_second_desc: "The continent of Africa begs for absolute, defined rulership. For too long, its wastes have been squabbled over by savages, zealots and greedy colonisers. A horrid crime - for it is evident, above all, that we are Africa's true master.\n§GUnlocks§! early colonisation of Inland African Provinces"
 domination_third: "Imperial Power Projection"
 domination_third_desc: "Some would say that our Empire's power begins at the lips of our ruler and ends at the borders of our holdings. This could not be more wrong. Via the unending scope of our generals, the fearsome scream of our armies and the impenetrable will of our people, our imperial will acts upon the world itself without us commanding it to.\nPower Projection on War Won: §G+10.0§!"
 domination_fourth: "Global Trade Empire"
 domination_fourth_desc: "By virtue of our name alone, our merchants brush aside all competition. Cities tremble and quiver before their bargains - not simply because of their practices, but because of the might lurking behind their shoulders. Namely, our might."
 domination_fifth: "The Future of Warfare"
 domination_fifth_desc: "Warfare has changed. Honour is dead and buried - relegated to a foolish past that we have learned from. Our enemies are lessers - our enemies are not worthy of respect. Ashes to ashes, dust to dust - such will our enemies turn to in the face of modernised, unstoppable, unrelenting artillery."
 domination_sixth: "Modern Administration"
 domination_sixth_desc: "Evident as our supremacy is, it has become furthermore evident that, given our status as the most powerful, most worthy, most paramount force in this world, our administration must become infallible and incorruptible. No loose end may remain untied - no rock unturned. Our will is paramount."
 domination_seventh: "Industrialised Society"
 domination_seventh_desc: "Fell every tree in the forest. Flatten every mountain. Level every hill. Only then will Heaven's will be done."

 ab_domination.1.t: "Global Domination Ideas Unlocked"
 ab_domination.1.d: "Great Powers of the world will now be able to select the new §YGlobal Domination§! ideas. This is an unconventional high-risk, high-reward idea group with no policies but very strong modifiers.\n\nLosing a war or losing the great power status while having Global Domination ideas will §Rpermanently remove§! them. Removing them manually will also prevent you from accessing them ever again."
 AB_DOMINATION_ENABLED: "Great Powers of the world will now be able to select the new §YGlobal Domination§! ideas. This is an unconventional high-risk, high-reward idea group with no policies but very strong modifiers.\n\nLosing a war or losing the great power status while having Global Domination ideas will §Rpermanently remove§! them. Removing them manually will also prevent you from accessing them ever again."
 ab_domination.1.a: "The world is ours!"

 ab_domination.2.t: "Global Domination Ideas Removed"
 ab_domination.2.d: "Due to either losing a war or the great power status, we will no longer be able to access the Global Domination ideas. The idea group will be removed without any refund, and we will not be able to choose it again."
 ab_domination.2.a: "Unfortunate"

 ab_domination.3.t: "Global Domination Ideas Removed"
 ab_domination.3.d: "Due to either losing a war or the great power status, we will no longer be able to access the Global Domination ideas. The idea group will be removed without any refund, and we will not be able to choose it again."
 ab_domination.3.a: "Unfortunate"

