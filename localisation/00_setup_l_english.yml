### INSTITUTIONS ###
 nacionalizmus: "Nationalism"
 nacionalizmus_date: "1800"
 desc_nacionalizmus: "Nationalism, as it has been dubbed, encompasses numerous ideologies which extol the desire of a people to attain self-determination and sovereignty over their homeland. The resulting concepts of nationhood and national pride, closely woven around a group’s common language, religion, and culture, spawns a territorial irredentism associated with ancestral or historical claims."
 institution_events.100.t: "The Nationalism"
 institution_events.100.d: "The imperialism and colonialism of past centuries spurred the conceptualisation of a new doctrine of thought in Europe which gained traction in the 19th Century. Nationalism, as it is known, encompasses numerous ideologies which extol the desire of a people to attain self-determination and sovereignty over their homeland. The resulting concepts of nationhood and national pride, closely woven around a group’s common language, religion, and culture, spawn territorial irredentism associated with ancestral or historical claims. The distinct national identities established within the cultural zeitgeist encourage greater national unity and preferential treatment towards countrymen, but consequently the same ideas entrench themselves in separatist movements and revanchist rhetoric."
 institution_events.100.a: "This changes everything..."
 institution_events.100.a.tt: "Countries that have not yet fully §YEmbraced§! the §YNationalism§! Institution will receive an increasing technology cost penalty of §R1%§! per year up to at most §R50%§!." 
 institution_events.101.t: "The Nationalism"
 institution_events.101.d: "The imperialism and colonialism of past centuries spurred the conceptualisation of a new doctrine of thought in Europe which gained traction in the 19th Century. Nationalism, as it is known, encompasses numerous ideologies which extol the desire of a people to attain self-determination and sovereignty over their homeland. The resulting concepts of nationhood and national pride, closely woven around a group’s common language, religion, and culture, spawn territorial irredentism associated with ancestral or historical claims. The distinct national identities established within the cultural zeitgeist encourage greater national unity and preferential treatment towards countrymen, but consequently the same ideas entrench themselves in separatist movements and revanchist rhetoric."
 institution_events.101.a: "This changes everything..."

### SCRAMBLE FOR AFRICA ###
 ab_scramble.1.t: "Scramble for Africa"
 ab_scramble.1.d: "The rising imperialistic ambitions of the world's great powers and rapid technological progress has begun a new era of colonization. Centuries ignored inland Africa has become a point of interest for the Empires who are seeking to expand their Empires and enrich themselves through the exploitation of the Black continent. We must claim the riches of Africa before our rivals do!"
 ab_scramble.1.a: "First come, first served!"
 SCRAMBLE_FOR_AFRICA_PROVINCE: "In order to colonize this province, you need to unlock §YScramble for Africa§!, diplomatic technology §Y33§!."
 scramble_for_africa: "Inland African Province"
 scramble_for_africa_desc: "This province is way too difficult and costly to colonize with our current technology. Most nations are only able to colonize the inland African provinces once they have unlocked the §YScramble for Africa§!, diplomatic technology §Y33§!, or §YGlobal Dominance§! ideas."
 africa_scramble: "Scramble for Africa"

