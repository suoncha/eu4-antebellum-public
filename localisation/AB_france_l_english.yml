# Imperial Incident #
 ab_france.100.t: "The Republic of France"
 ab_france.100.d: "A monumental event has occurred in the kingdom of France! As Lothair III has thrown his crown down, the peasantry have erupted into a hostile takeover of the realm, dispersing the Carolingian lineage and putting the power of governance into the hands of the commoner. This is not completely without precedent - Charlemagne bestowed the exemption of feudalism upon the Frisians, who have since rebuked any efforts to bring them under rule of nobility. Likewise are the merchant republics of northern Italy. However, the situation here is different, and vastly more dangerous.\n\nThe peasantry have no desire to be ruled by the Holy Roman Empire, and would rather rule themselves, fully independent on the stage of Europe. This state of matters is unacceptable to vast swathes of nobility across the Empire, and the Emperor must act!"
 ab_france.100.a: "Invoke the Imperial Diet to deliberate on intervention in [FRA.GetName]"
 incident_republican_france: "A Peasant on the Frankish Throne"
 incident_republican_france_member_alert: "The legacy of the Carolingians is gone! The kingdom of France is now a peasant-led republic, an event that has shaken up the legitimacy of the ruling noble class in the Holy Roman Empire, many of whom are baying for decisive action against this threat to power."
 incident_republican_france_emperor_alert: "The legacy of the Carolingians is gone! At our doorstep now lies the peasant-led republic of France, a radical change from the eminence of kings that had led France for so long. As rumors spread quickly, our own peasantry may begin getting ideas about 'freedom' from our rule. Whatever our decision is, it must be fast and decisive!"
 ab_france.101.t: "A Peasant on the Frankish Throne"
 ab_france.101.d: "France has reorganized itself into a republic, overthrowing the old order and creating an immediate threat on our border. The Emperor must decide if he will pursue aggressive action and put the peasants in their place, or leave them be at a significant cost to his prestige."
 ab_france.101.a: "Crush the upstart republic."
 ab_france.101.b: "Recognize their legitimacy."
 ab_france.102.t: "One Throne or Many?"
 ab_france.102.d: "To let this republic be is completely unacceptable, and so the Emperor has accepted the demands of their subjects - nothing but the complete annihilation of this project will suffice. The only thing left is to decide which path to walk. The first option is to demand a restoration of the monarchy, for it is the peasant's lot in life to obey his king as a subject of the crown. There is a possibility that they understand this universal truth and abandon their republican posts, but many believe that they are far too zealous of their newly-gained freedom to consider going back to what was before.\n\nThe second is more ambitious, and would permanently shatter the French into constituent princedoms that would rejoin the Empire as rightful subjects, dividing them up into local noble families, weakening the once-hegemonic Franks. However, war would be a guarantee. In either case, the Imperial Diet waits with baited breath for the Emperor's final decision."
 ab_france.102.a: "A request sent to the doorstep of the republic - the return of the crown!"
 ab_france.102.b: "Let us once and for all destroy the dream of France."
 ab_france.103.t: "Letter of Tyranny"
 ab_france.103.d: "Messengers from the Holy Roman Emperor have arrived, and with it their ironclad demands. An inevitable ultimatum: at once, the ancien régime is to be returned to its so-called rightful throne, and our pitiful attempt at earning our freedom will be forgiven in the eyes of God, for having gone against the old order. News of this has spread like wildfire; merchants to craftsmen to peasants, many have begun sharpening their spears and firing up their forges for swords and shields as they see the inevitability of war: a rising tide from the west to swallow whole the project they had just started. They look to us for an answer. The most obvious choice is to prepare for war, but some frightened voices speak of the swathes of blood that will inevitably fill the fields of fair France, and that peace under oppressors is better than ruination for the cause of freedom. "
 ab_france.103.a: "Perhaps this was a bad idea after all..."
 ab_france.103.b: "Show the bastards our élan and send them howling back to the Emperor!"
 ab_france.104.t: "A Peasant's Life"
 ab_france.104.d: "Cheer fills the palace of the Emperor as we have received a response. In the tense standoff between the republic and the Empire, the peasants have stood down and returned to their posts, reinstating the throne as things return to normal. To honor this, the kingdom of France has been allowed back into the Empire, though naturally without its appanages. There will be harsh retribution on the peasants for their folly and insanity, but things will return to how they were before, as God has willed it."
 ab_france.104.a: "The natural order is maintained."
 ab_france.105.t: "Heavy is The Crown"
 ab_france.105.d: "In their delusions of grandeur, the peasantry of France have refused our demand for the return of the monarchy! Already, our nobility prepare to march for war, for peace is impossible while this threat remains on our borders. They shall descend upon the fields and hills of France, and any peasant that stands in their way will be cut down like the chaff they are. Unfortunately, this will throw the realm into chaos, and there is no telling who among our princedoms will take this opportunity to try and go against our power, or who will ride out with us against this tempest."
 ab_france.105.a: "God wills it that our rule remains unquestioned."
 ab_france.105.b: "No, we can't do this. Send a messenger immediately!"
 ab_france.106.t: "Crossing of The Rhine"
 ab_france.106.d: "Though conflicts between the Franks and the Holy Roman Empire are nothing new, today it has taken a far more violent form than anyone could ever have anticipated. The French peasants have overthrown the empty throne left behind by Lothair III's abdication, and the Emperor has entered into a war with them, opting to dismantle their nascent republic before it can gain any real momentum. We have several options to consider. The simplest option is to sit this conflict out and let it resolve itself, sparing our men the violence and destruction that might arise. Alternatively, we could reinforce the Emperor and potentially earn rewards for our loyalty, while some whisper that in the wake of this conflict is our only opportunity to destroy the Holy Roman Empire, in case our ambitions run counter to the hallowed institution."
 ab_france.106.a: "We will gain nothing from this bloody war."
 ab_france.106.b: "Rally to the Emperor!"
 ab_france.106.c: "It is time for a new future."
 ab_france.107.t: "From Humble Beginnings"
 ab_france.107.d: "The fate of our republic now hangs in the balance as the perfidious Emperor has declared war upon us! Our eyes look east over the Rhine river, the noblemen riding upon their cavalry, sword in hand, ready and willing to cut us down to the last if it meant preserving their wicked peace, and the spirit of French peasants is lit ablaze as able-bodied men leave tearful wives with spears and shields in hand. A fair lady has emerged in this time, a firebrand of our cause named Jeanne d'Arc. Pious and noble, her voice rings like thunder as she describes her visits from God's angels, heralding her purpose as a torchbearer of the republic, to defend it against cruel kings and petty tyrants. She has donned a suit of armor and been given role of commander, to lead our people to ultimate victory and to achieve everlasting peace! With God on our side, we cannot lose!"
 ab_france.107.a: "We shall strike down the false Romans and destroy their unholy empire!"
 ab_france.108.t: "The Birth of Hope"
 ab_france.108.d: "France lies in ruins, her men lay dead and their widows grieving, villages burned and lands scorched black with the ashes of war, but we have done it. We have triumphed over impossible odds. For centuries, the Holy Roman Empire has had a stranglehold on Europe, enforcing the will of monarchs and refusing the peasantry the liberties and freedoms that they have always deserved. Now, we have snapped the double-headed necks of the eagle, and the authority of the Emperor has crumbled into dust. The princedoms are scattered, and even with their combined might could not overcome the truth that led us forward - the truth that a man must be free, that a man must be in control of his own destiny, and not beheld to the whims of ancient bloodlines."
 ab_france.108.a: "The path forward is clear. We do not stop here."
 ab_france.109.t: "Decimation of France"
 ab_france.109.d1: "France lays in ruin, and our own economy has been battered by this holy war. Yet, the peasantry has been pacified, and we have come out victorious this day against the forces that would have besieged our righteousness. Though the Carolingian line is now extinguished, another French dynasty will take their place on the throne, and continue the existence of the kingdom as it was in the status quo ante bellum. Their loyalty will be rewarded by their reentry into the Holy Roman Empire, though with the added caveat that their former appanages will remain as independent princedoms, weakening the kingdom and binding them more strongly to us. Having weathered this storm, our subjects see us in a more glorious light, and we can bask in the prestige of a grand victory."
 ab_france.109.d2: "France lays in ruin, and our own economy has been battered by this holy war. Yet, the peasantry has been pacified, and we have come out victorious this day against the forces that would have besieged our righteousness. At last, the Franks have lost their hegemony as we carve up their lands into subjects more easily ruled and controlled. All of the Empire looks upon us as the iron hand of the realm, our legitimacy unquestioned and our rule divine, and our splendor majestic."
 ab_france.109.a: "The Empire endures."
 ab_france.110.t: "Peace of Aachen"
 ab_france.110.d: "In the devastating war that has ensued between the republic of France and the Holy Roman Emperor, neither side has come out victorious. The clash between these two titanic forces has left only the dead in its wake, with both the French and Germans reeling in the aftermath. Reluctantly, both sides approached each other in the city of Aachen - a compromise between Paris and §Y[Emperor.Capital.GetName]§! - to sign a treaty which would have the Emperor accept the legitimacy of the republic, which must now lick its wounds and tend to its broken before it can consider striking against the Empire in the future. Both sides now return to their realms, but this is likely a fragile peace at best, and conflict is almost certain to erupt once more in the future."
 ab_france.110.a: "So much death, and for what... ?"
