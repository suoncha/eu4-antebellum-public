 AB_FATE_OF_FRANCE_CALL_THE_PRINCES: "Over the next few weeks every Sovereign Prince of the §YHoly Roman Empire§! will receive the option of siding with the §YHoly Roman Emperor§! or staying neutral."
 fate_of_france.106.inconclusive_war_tooltip: "The war ending inconclusively with neither side using '§YAssert Imperial Authority§!' or '§YAssert Republican Sovereignty§!' peace options will result in a white peace."
 AB_FRA_REPUBLICAN_INCIDENT_BALKANIZED_ENFORCED: "The Kingdom of France will be forcefully §Rdissolved§! into §YImperial Princedoms§!"
 AB_FRA_REPUBLIC_INCIDENT_WHITE_PEACE: "The Great War of the West ends in a §Ywhite peace§!, with both sides burying their dead in an uneasy truce that most believe cannot last."
 ab_france.112.t: "A Desperate Appeal"
 ab_france.112.d: "The fires of revolution rage across France, and the contagion of republicanism threatens to spill beyond its borders. While the imperial armies are numerous and mighty, many of our advisors believe that mere numerical advantage will not be sufficient to suppress the revolution. Some of them have come forth with an idea that could give us a major advantage in the war, but it could also greatly endanger our position in the empire. They suggest offering a seat in the Electoral College to the King of Lotharingia, should he commit his armies to the suppression of the French revolution."
 ab_france.112.a: "The Empire must be saved at any cost."
 ab_france.112.b: "The Empire will face the revolution alone."
 ab_france.113.t: "The Emperor's Offer"
 ab_france.113.d: "An Imperial delegation has arrived at our court bearing an offer as unprecedented as it is tempting. The Holy Roman Emperor, beset by the revolutionary turmoil in France, seeks our aid in crushing the uprising before it spreads further across Europe. In exchange for our banners, the Emperor promises Lotharingia a seat in the Electoral College."
 ab_france.113.a: "An offer we can't refuse..."
 ab_france.113.b: "Our crown bows to no Emperor."