 # Ideas #
 FRA_monarchy_ideas: "French Monarchist Ideas"
 FRA_monarchy_ideas_start: "French Monarchist Traditions"
 FRA_monarchy_ideas_bonus: "French Monarchist Ambition"
 FRA_monarchy_ideas_first: "The Taille"
 FRA_monarchy_ideas_first_desc: "Following the collapse of the Frankish empire, we have found ourselves in dire straits. Fortunately, there is a solution - a direct land tax on the peasantry and all else who do not belong to the nobility. It will be harsh, but they are the subjects of the crown, and will pay for their protection."
 FRA_monarchy_ideas_second: "Growth of French Vineyards"
 FRA_monarchy_ideas_second_desc: "There is no better wine than French wine. It is the envy of the world! With the reunification of French lands also comes the massive expansion of vineyards, so that our nobility can glut themselves on it and that it can be sold to merchants from Andalusia to the shores of Constantinople."
 FRA_monarchy_ideas_third: "All Roads to Paris"
 FRA_monarchy_ideas_third_desc: "Since the fall of the Roman Empire, we have remained the eminent force of Europe. This is a tradition that will never be extinguished, and while the Anglo-Saxons claw each other apart and the Germans squabble over petty fiefdoms, we reassert our dominance over the continent. It is the destiny of France to be king of kings."
 FRA_monarchy_ideas_fourth: "Estates General"
 FRA_monarchy_ideas_fourth_desc: "No monarch is able to work alone, despite his best wishes. Due to this, we will create the Estates General, an assembly for all three strata of our country that can convene at the king's will to list their grievances and requests. Though not necessarily obligated to listen to them, helping them on occasion can greatly help us."
 FRA_monarchy_ideas_fifth: "New People, New Trade routes"
 FRA_monarchy_ideas_fifth_desc: "The vast lands of the Americas are a hotbed of countless native people who can offer us much for what we can give them. They may lack our guns and horses and other innovations, and are even godless heathens, but the crown is flexible in its demands. We are satisfied so long as we can barter and trade."
 FRA_monarchy_ideas_sixth: "Lingua Franca"
 FRA_monarchy_ideas_sixth_desc: "As we expand across the world and reach our influence from continent to continent, we should maintain French as the prestige language of Europe, and train a diplomatic corps to effectively secure alliance and trade networks around the globe. A true empire, worthy to the monarch, can often gain far more through the pen than the sword."
 FRA_monarchy_ideas_seventh: "Natural Borders of France"
 FRA_monarchy_ideas_seventh_desc: "The fact that the rest of Europe sees us as a danger can never truly change. What is left is to make certain that if we are ever punitively invaded, we can force them to path through our hills and forests, taking battles where we like, while our loyal soldiers will demolish all enemy forts that stand between them and victory."
 FRA_republic_ideas: "French Republican Ideas"
 FRA_republic_ideas_start: "French Republican Traditions"
 FRA_republic_ideas_bonus: "French Republican Ambition"
 FRA_republic_ideas_first: "Rally Against Oppression"
 FRA_republic_ideas_first_desc: "The ancien régime has perished, and along with it the collapse of feudal institutions. It is only natural that the enemies of the peasantry, the bloodthirsty kings of Europe, see us with fear and terror, for we represent a stain on their divine rule! The forges must be fired up, and every able-bodied man given a spear and shield to skewer the invading tyrant; France will brook the heavy crown no longer."
 FRA_republic_ideas_second: "Freedom of Flowing Goods"
 FRA_republic_ideas_second_desc: "The peasant, though he must still toil the field and take care of his family, can now much more easily sell any excess of product he creates, not chained by the demands of a king or the archaic law of centuries past. This has strengthened the domestic market of our republic, lighting the spark of wealth in the process."
 FRA_republic_ideas_third: "Birth of Communal Workshops"
 FRA_republic_ideas_third_desc: "When no longer subjected to strenuous and unreasonable demands of the nobility, the common guildsman will work together with his fellows for the benefit of all. Lone craftsmen become collectives, and thus arrives the birth of cities dotting the beautiful landscape of France."
 FRA_republic_ideas_fourth: "Drag Towards the Future"
 FRA_republic_ideas_fourth_desc: "We must better expand and streamline our governance so we may more directly allow every man a say in the republic he resides in; the bureaucracy is to be expanded, and all households must be registered and accounted for and every coin spent wisely. For what is the measure of freedom if a man does not live to reap its benefits?"
 FRA_republic_ideas_fifth: "A Republic of Ingenuity"
 FRA_republic_ideas_fifth_desc: "In this age of new continents and global trade and travel from Ireland to Cathay, the republic will stop at nothing to be at the forefront of advancement. No compromise must be made for progress. So follows the construction of schools and universities in our cities, that all of France's people be educated in the sciences of the world."
 FRA_republic_ideas_sixth: "Liberté, Égalité, Fraternité"
 FRA_republic_ideas_sixth_desc: "Slowly but surely, we come to realize that our brothers from across borders are much alike us, though they may speak a different language and perhaps even follow a different faith. The Englishman, Italian, German - do they not all yearn for freedom much like us? Do they not struggle against their overlords much as we did? It is our imperative duty to free them from the yoke of their oppressor. "
 FRA_republic_ideas_seventh: "System of Départment"
 FRA_republic_ideas_seventh_desc: "A radical concept has entered the French consciousness. The administrative regions of France are the last holdover of feudal kings, but the idea of départments - to carve up our bureaucracy into many equal and homogenous areas, to wipe away cultural privileges and hostilities, all united under one republic and one ideal - this will be the path forward."

# Government Reforms #
 fraelective: "French Elective Monarchy"
 fraelective_desc: "Following the demise of the Carolingians, the noble houses of Francia have decided that the Crown will not be inherited, but contested by the great houses who shall gather to elect a king from among their numbers. Rooted in feudal custom, this system tempers royal authority with noble rivalry and ancient privilege."
 frarepublic: "French Republic"
 frarepublic_desc: "Born from revolt and rural assemblies, the French Republic rests upon the will of citizens rather than crown or lineage. Its strength the political awakening of the common people."
 fragrandrepublic: "French Peasant Republic"
 fragrandrepublic_desc: "A republic founded upon village assemblies and popular councils, where political power rests in the hands of those who till the land and labor for France rather than nobles, generals, or bureaucrats."
 fradictatorialconsulship: "French Consulship"
 fradictatorialconsulship_desc: "Amid chaos and factional decay, supreme authority is entrusted to a single Consul to restore order and purpose to the Republic. Guided by discipline and vision, France is to be led toward stability and greatness."
 unlock_fragrandrepublic_tt: "§GUnlocks§! the §YFrench Peasant Republic§! §MTier 1§! Government Reform, giving the following effects:\n\nNational Unrest: §G-2§!.\nGlobal Autonomy: §R+0.05§!.\nGlobal Manpower Modifier: §G+20.00%§!.\nProduction Efficiency: §G+20.00%§!.\nMax Absolutism: §R-10.0§!.\n\nThis reform also includes the following government mechanics:\nTerm duration: §Y4§!.\nAllows §YPlutocratic§! Idea Group.\nDisallows §YAristocratic§! Idea Group.\nDisables §YNobility§! estate.\nIs a §YPeasants Republic§!."
 unlock_fradictatorialconsulship_tt: "§GUnlocks§! the §YFrench Consulship§! §MTier 1§! Government Reform, giving the following effects:\n\nGoverning Capacity: §G+150§!\nGlobal Autonomy: §G-0.075§!.\nMorale: §G+10.0%§!.\nYearly Republican Tradition: §R-0.10§!.\nMax Absolutism: §G+10.0§!.\nMax Absolutism Effect: §G+10.0§!.\nMorale Damage Received: §G-5.0%§!\nAll Estate Loyalty Equilibrium: §R-10.0%§!\nReduced Liberty Desire From Subjects On the Same Continent: §G-50.0%§!."

