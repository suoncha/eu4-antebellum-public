# Government Mechanics #
 mechanic_fra_election_on_monarch_death_yes: "Select a §YFrench Noblemen§! as your ruler on monarch death. They will provide your nation with a special modifier upon ascension."
 ability_royalists_vs_peasants_french_mechanic: "§RPeasantry§! vs §GReactionaries§!"
 royalistsvpeasants: "§RPeasantry§! vs §GReactionaries§!"
 royalistsvpeasants_desc: "The Republic is besieged on all sides by reactionary forces threatening the very nature of our experiment.\n\nThere are two factions vying for power: The Reactionaries, seeking a more structured and orderly society that protects and enforces the rights of the bourgeoisie. Meanwhile, the Peasantry seeks to preserve the freedom and liberty granted to them under our new government.\n\nWe can increase the influence of each sphere by:\n- Having Republican tradition above §Y50§! (§R-0.5§!/month at maximum) or below §Y50§! (§G+0.5§!/month at maximum)\n- Raising or Lowering §YAutonomy§! (§R-0.05§!/§G0.05§!/month per province)\n- Enacting §RHarsh Treatment§! (§G+1§!)\n- Having §GPositive§! or §RNegative§! Stability (§R-0.25§!/§G+0.25§!/month per point)"
 royalistsvpeasants_gain_modifier: "§RPeasantry§! vs §GReactionaries§! Gain"
 monthly_royalistsvpeasants: "Monthly §RPeasantry§! vs §GReactionaries§! Gain"

