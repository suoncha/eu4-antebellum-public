# Events #
 ab_frc_disaster_event.3.g: "Let us decide the fate of the nation..."
 ab_fra_flavor.109.d: "With control over Milan, one of the greatest cities in Italy secured, our presence is now known. We can utilize our influence there to infiltrate the courts of Italy and begin to layout a cutthroat diplomatic campaign, dividing and conquering. Though we could simply make our ambitions clear, it is not like we can be stopped, Italy will be ours!" 

 ab_france.1.t: "The Estates-General Meet"
 ab_france.1.d: "The French court bustles with activity, as petty lords and grand nobles alike vie for influence and power. The time has come to choose a new ruler, and the decision rests in the hands of the electors. Each house presents its case, highlighting their lineage, accomplishments, and vision for France's future. The air is thick with anticipation as alliances are forged and promises are made. After all, the choice will decide the fate of the nation."
 ab_france.1.a: "The house of §Yde Bourbon§! emerges victorious!"
 ab_france.1.b: "The house of §Yde Toulouse§! sweeps the election!"
 ab_france.1.c: "The §Yde Bourgogne§! charms the electors!"
 ab_france.1.e: "The house of §Yde Rouergue§! strong-arms their way to victory!"
 ab_france.1.f: "Our current [Root.Monarch.GetTitle] should rule"
 FRA_release_appanages: "§RAll §YAppanages§! will be released.§!"
 FRA_TOOLTIP_BBON: "A member of §Yde Bourbon§! dynasty will become our ruler."
 FRA_TOOLTIP_ROUERGUE: "A member of §Yde Rouergue§! dynasty will become our ruler."
 FRA_TOOLTIP_TOULOUSE: "A member of §Yde Toulouse§! dynasty will become our ruler."
 FRA_TOOLTIP_BOURGOGNE: "A member of §Yde Bourgogne§! dynasty will become our ruler."

 ab_france.2.t: "Lingua Franca"
 ab_france.2.d: "Our effort to cement a singular French identity by centralizing the realm and promoting the usage of the French language in administration has paid off. Owing to our strong hold over Mediterranean trade and our far-reaching influence, French has been codified as the lingua franca among traders, facilitating easier commerce and boosting our merchants' confidence. Yet, the prominence of our language is not relegated to trade alone, for it has come to be synonymous with courtly splendor. In a pathetic attempt to imitate our manners and prestige, foreign courts have begun adopting French in diplomacy, literature and high society. Though we laugh as barbarians strive to disguise themselves as refined, our people are beyond flattered that our language holds such great influence over Europe as a whole."
 ab_france.2.a: "Sometimes the word is mightier than the sword."
 ab_france.3.t: "Empire Français"
 ab_france.3.d: "What began as a risky venture undertaken by a few enterprising individuals has resulted in the creation of an overseas empire larger than any the world has seen. From the marshes of Louisiana to the jungles of Indochina, the banners of France stand tall and mighty. Our rapid conquests across the globe have all but ensured our monopoly over exotic goods from all corners of the world, bringing us wealth beyond imagination. Our grand fleet and hardened soldiers can enforce the authority of Paris across the planet, and any opposition to our authority, within or without, has been crushed. As our enemies cower in fear and the world bears witness to our triumph, we may now proclaim the creation of an Empire upon which the sun shall never set!"
 ab_france.3.a: "Vive l'Empire!"
 ab_france.4.t: "Baillages Reform"
 ab_france.4.d: "The chaos following the abdication of the last Carolingian King tested all limits of our - clearly antiquated - administrative system. As our authority waned, petty crime and banditry rocked the countryside, and the apparatus of state was forced into inaction by its own Byzantine nature.\n\nThough years have passed and our state has stabilized immensely, it has become abundantly clear that administrative reform is in order. Thankfully, members of our newly formed cabinet have devised a plan to restore central authority and exact the laws of Paris all across our far-flung realm. Among these reforms is the codification of the Baillages. These divisions earlier possessed only nominal authority over ambiguously defined territories. Though this meant that the Crown couldn't be challenged in any meaningful way, the infighting among the bailiffs caused great delays and burdens on an already strained system. No longer shall this be the case. Our new reforms will establish clearly defined boundaries for the baillages and grant them appellate jurisdiction over any minor court which may lie within their borders, thereby ensuring the smooth operation of the state and bringing comfort to our subjects, who shall rest easy knowing that their grievances no longer land on deaf ears. Let us hope that these reforms bring everlasting stability to our domain."
 ab_france.4.a: "A modern state requires modern administration."
 ab_france.5.t: "Rise of the Consulship"
 ab_france.5.d: "The Republic was born to act as a safeguard against further encroachment upon the liberties of man by the nobility and Crown, yet, in doing so it has acquiesced to disorder and corruption. While our soldiers and militia fought costly wars to defend the very foundations of our freedom, the Council found it prudent to instead debate the construction of aqueducts and turnpikes. These toga-clad deputes are nothing more than farmers with influence yet they act akin to the lords of the Old Regime, indulging in all the excesses and luxuries which brought its undoing. To distract the people from their innumerable scandals, they call upon their followers to attack their favorite scapegoats, usually merchants, hampering the trust of the bourgeoisie in the government.\n\nAgainst this backdrop, the coup seemed almost inevitable. Under the pretext of a royalist reaction, deputes from all across France were invited by [Root.Monarch.GetTitle] to Paris to 'discuss the security of the Republic'. They were led by an armed convoy to a Chateau in the outskirts of the city, where [Root.Monarch.GetName] had been waiting for them. For thirty minutes he spoke of how the incessant corruption within the legislature had weakened the state, how the constitution was being violated by those who swore to uphold its values, and how the greatest act of patriotism the deputies could show was to unanimously surrender their powers to the executive. Protests within the assembly erupted almost immediately, forcing the commander of the convoy to intervene. By the tip of the pike, representatives voted. Come evening, the session concluded, the reins of France now lie in the hands of one man, First Consul [Root.Monarch.GetName] who has sworn by his sword to bring all enemies of French liberty to their knees. Let us hope he stays true to his promise."
 ab_france.5.a: "Citizens, you have been dissolved!"
 ab_france.6.t: "The Republic of the People"
 ab_france.6.d: "We forged the Republic to free ourselves from kings, yet we watched as its councils grew distant from the fields and workshops that sustained it. Corruption, ambition, and endless appeals to necessity revealed a truth we could no longer ignore: left unchecked, the republicans would one day trade liberty for order, and call it salvation.\n\nWe therefore claim power in our own name. By asserting the direct rule of the people, we shall cast aside the illusion that tyranny changes its nature when it sheds a crown, and proclaim that France shall be governed by those who labor for it, not by those who merely speak for it."
 ab_france.6.a: "Liberty has no master."

