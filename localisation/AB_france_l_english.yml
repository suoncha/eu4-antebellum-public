 fra_crusade_jerusalem_title: "[Root.GetPreviewColorFRA1_BRANCHING]Crusade for Jerusalem[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_crusade_jerusalem_desc: "For centuries, forefathers and the rivals of said forefathers alike have vied in vain for control of the Holy Land. What has history to show for it? Rump states, unruly satellites, wanton violence. Surely, in our enlightening time, with our graceful ways, we can set things right, and take Jerusalem forever."
 fra_shield_outremer_title: "[Root.GetPreviewColorFRA1_BRANCHING]Shield of Outremer[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_shield_outremer_desc: "Having established a rightful foothold in the Levant, voices within our military have clamoured for more. Egypt should fall with ease, so they say. Even as this matter is discussed, well-ranking men and administrators in wait scheme vividly, eager to forge a state to blossom from the length of the Nile." 
 fra_musketeer_title: "[Root.GetPreviewColorFRA1_BRANCHING]The Royal Musketeers[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_musketeer_desc: "No force of this world can exist without an elite class of warriors. The Royal Musketeers, we propose, are to be the most proficient and versatile of our upper-ranking soldiers, escorting and protecting the administration's upper echelon in times of peace and dispensing righteous cruelty in times of war."
 fra_im_the_state_title: "[Root.GetPreviewColorFRA1_BRANCHING]L'État, c'est moi[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_im_the_state_desc: "A country that is divided surely cannot stand. The more voices of authority exist within our sprawling administration, the greater the voice of reason is drowned out. There exists an imperative within nature that those with a god-given right and talent to rule must do so."
 fra_revolution_title: "[Root.GetPreviewColorFRA1_BRANCHING]The French Revolution[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_revolution_desc: "For too long, the French people, the true face of our country, have suffered under the heel of history's iron stride. Chief among the propagators of history, the Holy Romans - squabbling Germans, the lot of them, adjacent and attached to our business for far too long. Let us remind them of their place." 
 fra_commune_title: "[Root.GetPreviewColorFRA1_BRANCHING]The First Commune[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_commune_desc: "We have announced to the world our intentions to overturn the great weight of the class system and do away with it once and for all. Now, we must do well by our word and begin to spread our enlightened form of governance, even to those beyond our culture."
 fra_spread_title: "[Root.GetPreviewColorFRA1_BRANCHING]Spread the Revolution[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_spread_desc: "Powerful as we are, newfound revolutionaries emboldened by the liberated spirit of our people, we are unfortunately alone on Europe's stage. Even titans need friends. We must forge alliances with like-minded nations and create for the world a community of revolutionary fervour."
 fra_stabilize_title: "Stabilize France"
 fra_stabilize_desc: "Countrysides lay tarnished, rivers run red and crops wither and wilt. Even after the end of the fighting, merchants both local and foreign hesitate to commence commerce within our borders, fearing more chaos. We must prove to them, and to the world, that our country can be a haven of peace and prosperity."
 fra_normandy_title: "Norman Demise"
 fra_normandy_desc: "Like a thorn in our side, the Normans pester us. They've even had the audacity to lunge at peoples beyond our reach. Lest they grow unmanageable, we must permanently assimilate them."

 fra_brittany_title: "Armorican Peninsula"
 fra_brittany_desc: "Deep within the reaches of the Armorican Peninsula, the Bretons stubbornly cling to sovereignty, deluding themselves with the notion that their fate is anything but French. It is best they are integrated into our realm proper, for the maritime value of their holdings cannot be understated."
 fra_lotharingia_title: "Push Back Lotharingia"
 fra_lotharingia_desc: "Lotharingia stands a troublesome burden leering down our neck. Their lands are ripe and prosperous, and so long as their borders are but a stone's throw from Paris, they will continue to pose an existential threat to our very existence. We must deal them a killing blow."
 fra_wars_religion_title: "French Wars of Religion"
 fra_wars_religion_desc: "Though we have endured the worst of the troubles brought by the Protestant reformation, there are still a great many potentially treasonous heretics residing in France. We should institute a policy of intimidation and discriminations against these heretics to drive them from our borders."
 fra_answer_reformation_title: "Answer the Reformation"
 fra_answer_reformation_desc: "The ideas of the Protestant Reformation are spreading across the continent like a plague. We must make a stance; either support their ideals or totally condemn them."
 fra_dukes_title: "Subjugate the Dukes" 
 fra_dukes_desc: "Vast and rich as our land is, it is yet untapped. Due to the decentralized nature of our realm, little do we truly reign over it - here and there, middlemen crop up, touting themselves as the 'Duke of This' and the 'Lord of That', pompous little nobles without value. Let us do away with them."
 fra_unitefrance_title: "Unite the French"
 fra_unitefrance_desc: "At last, we are in a position to rule over our birthright lands utterly. For centuries, Germans, Norse, and even Saracens have infringed upon our cultural sphere. With our newfound resurgence, however, that chapter can come to a close. The era of French hegemony, and thus dominance, has begun."
 fra_brest_title: "Port of Brest"
 fra_brest_desc: "Brest has rich potential as a strategic maritime port overlooking the Atlantic. Now that the city lies in our hands, the content of our coffers may flow into its urban veins proper. A great dockyard must come to life."
 fra_navy_title: "Build the Navy"
 fra_navy_desc: "For a country with a number of vulnerable coastlines - beaches to the north perennially nagged by the Norse, villages to the south continuously battered by the Berbers - we lack a navy to show for it. Our navy must grow in immensity, fast, if we are to stand respected as a maritime power."
 fra_invalides_title: "[Root.GetPreviewColorFRA2_BRANCHING]Les Invalides[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_invalides_desc: "By establishing military hospitals for our brave veterans we can reduce the time it takes to put them back on the front lines. It will also be an excellent opportunity for medical research that will be useful for the general citizenry."
 fra_warfare_title: "[Root.GetPreviewColorFRA2_BRANCHING]The Future of Warfare[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_warfare_desc: "Many centuries ago, our ancestors were beaten into submission by the unruly legions of Caesar - proud, heroic Gauls, betrodden as a result of their disunited tactical inferiority. We cannot let ourselves make the same mistake. Warfare is changing, rapidly, and artillery is becoming a staple of the standing army."
 fra_crown_seat_paris_title: "City of Light"
 fra_crown_seat_paris_desc: "Paris, over the years, has become a towering pillar of Christian civilization proper, a beating heart of commerce, intellectualism and political dynamism alike, standing on par with the likes of Rome, Venice, Milan and Vienna. We would be fools to let it stagnate and fall behind."
 fra_move_to_versailles_title: "Chateaux de Versailles" 
 fra_move_to_versailles_desc: "With Paris booming, hailed for its riches, prosperity and opportunity across Europe, it has become evident that the will, as well as the coin, exists for grandiose architecture. Let the Chateaux de Versailles rise to prominence!"
 fra_protector_christendom_title: "[Root.GetPreviewColorFRA1_BRANCHING]Protector of Christendom[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_protector_christendom_desc: "Descendants of many a righteous crusader, it is only right that the warriors of our country embrace piety and become defenders of Christendom. The word of Christ must echo in the minds of all soldiers of the realm, from the most humble of infantry to the most senior of generals. France must be Christendom's mightiest defender."
 fra_liberate_sicily_title: "[Root.GetPreviewColorFRA1_BRANCHING]Liberate Sicily[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_liberate_sicily_desc: "Sicily has festered, rotted, decayed, beneath the Saracen yoke for far too long. The old masters of Italy, petty and disunited as they were, made the mistake of turning their back on the Barbary menace, and have thus suffered the consequences. We must correct this grievous state of being."
 fra_state_naples_title: "[Root.GetPreviewColorFRA1_BRANCHING]State of Naples[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_state_naples_desc: "With our power encroaching upon Sicily proper, and Christendom again shining bright in the peninsula's south, it is only right that the Neapolitans proper - those who are most appreciative, and therefore loyal to us, that is - rule themselves."
 fra_battle_france_title: "[Root.GetPreviewColorFRA1_BRANCHING]Battle for France[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_battle_france_desc: "Having severed ourselves from the burgeoning dung heap of an empire quite lacking in imperial and Roman charm, we find ourselves standing alone - a wonderful development. However, the Germans stubbornly cling to vestiges of control in the French region. We must rid ourselves of their influence once and for all."
 fra_dismantle_the_empire_title: "[Root.GetPreviewColorFRA1_BRANCHING]Dismantle the Empire[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_dismantle_the_empire_desc: "So long as the Empire endures, it will continue to antagonize our interests. All things must come to an end - especially this hideous beast. Down with the Empire!"
 fra_mercure_title: "[Root.GetPreviewColorFRA1_BRANCHING]Mercure de France[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_mercure_desc: "What better way than to promote literacy among the populace - and spread the good deeds of our administration - than to sponsor and bolster the Mercure de France, our own fine home-grown literary magazine?"
 fra_people_army_title: "[Root.GetPreviewColorFRA1_BRANCHING]The People's Army[Root.GetPreviewColorFRA1_BRANCHING_end]"
 fra_people_army_desc: "Our republic has become a thorn in everyone's side, and European powers are gathering resources to put an end to our 'experiment'. We must ensure the survival of the republic and the revolution by building an army capable of protection our people."
 fra_wallonia_title: "Into Wallonia"
 fra_wallonia_desc: "Beyond our core, the fertile lands of the Flemish await. Unfamiliar as they are in their lowland ways, they speak our tongue and cannot stand alone. We had best absorb them, lest the Dutch, or worse, the Angles, take them first."
 fra_batavia_title: "Establish Batavia"
 fra_batavia_desc: "The Low Countries, proud and industrious, cannot be allowed to stand alone. The Dutch have the potential to become an insidious regional rival, in more ways than simply commercial. We must render them a vassal."
 fra_signoria_genoa_title: "Signoria of Genoa"
 fra_signoria_genoa_desc: "One of the most vital port cities of Italy, Genoa stands as a glimmering jewel of the Mediterranean. It would do well as an Italian stepping stone under our control, lest a rival power takes it under their wing."
 fra_brazil_title: "French Antarctique"
 fra_brazil_desc: "Across the vast Atlantic, untapped, untamed and unclaimed lands await. A vast and splendid colonial possession in the south of the New World would do us well, not only as a heart of commerce and trade, but also as a powerful bulwark against rival colonizers."
 fra_frankish_acadia_title: "Colonize Acadia"
 fra_frankish_acadia_desc: "In the frigid northeast of the New World, vast and grandiose forests await our eager settlers. Commercial benefits alone entice us to establish a foothold - the prospect of beating our rivals to the punch makes the venture so much more tempting."
 fra_conquer_burgundy_title: "Conquer Burgundy"
 fra_conquer_burgundy_desc: "Burgundy, once a jewel of the Arelat crown, now sits ready for conquest. We hear rumours of upstarts in the splintered realm vying to restore their regional dominance. Worst yet, various Germans have purportedly considered throwing their hats in the ring. We must absorb Burgundy before it is too late."
 fra_regarding_caliphate_title: "Fate of the Caliphate"
 fra_regarding_caliphate_desc: "The Saracen Caliphate to the south delivered the Frankish order many a bloody nose. We would be fools to ignore them now. We must pacify the Iberian threat - be it by pen, or by sword."
 fra_expand_domain_title: "Expand the French Domain"
 fra_expand_domain_desc: "With a foothold established in Italy, we must venture further to dominate the peninsula. It is a land of rich potential - with ease, a local lord could rise up and carve out a sizeable realm for himself, one which could cause us no end of trouble. We must claim Italy proper before it falls into another's hands."
 fra_religious_absolutism_title: "Religious Absolutism"
 fra_religious_absolutism_desc: "With Europe engulfed in religious turmoil, it is time we answer the difficult questions affronting us - and benefit from them utterly. We must justify, and achieve, administrative hegemony within our realm, having dealt with our religious issues, lest they rise up to pester us again."
 fra_bank_france_title: "Institute the Bank of France"
 fra_bank_france_desc: "With unbridled economic dominance over the French region, we must found a Bank of France proper. Until we do so, our finances will forever be beholden to the whims of the Swiss, or worse, the Angles."
 fra_seats_power_title: "Seats of Power"
 fra_seats_power_desc: "It would be unwise to neglect the urban centres of our realm in favour of Parisian dominance. Across our realm, cities must rise like blossoming flowers, and draw the envy of the world."
 fra_france_discovers_north_america_title: "Discover North America"
 fra_france_discovers_north_america_desc: "Across the wild Atlantic, tales abound of a landmass immense. We must jump forth, carve out an understanding of this New World, lest our rivals beat us to it."
 fra_claim_the_caribbean_title: "Claim the Caribbean"
 fra_claim_the_caribbean_desc: "Islands, sunny and fertile, await us in the heart of the New World. Our merchants promise us all manner of opportunities await, so long as we establish self-sustaining colonies within the region. They just so happen to know of a great source of free, inexhaustible labour in Africa to assist with the endeavour!"
 fra_found_louisiana_title: "Found Louisiana"
 fra_found_louisiana_desc: "The rich marshlands and ample rivers of the land increasingly known as Louisiana offer bountiful potential. Should we establish a foothold and found a colony, our settlers could penetrate the interior of North America with ease."
 fra_alpine_pass_title: "Secure the Alpine Pass"
 fra_alpine_pass_desc: "For centuries, the Swiss have been a thorn in not only our side, but just about anyone who's had the misfortune of dealing with them. They squirrel themselves away in their mountain fortresses, pay others to fight for them and hoard gold. Let us put an end to this troublesome neighbor and secure a powerful defensive frontier."
 fra_cross_the_rhine_title: "Cross the Rhine"
 fra_cross_the_rhine_desc: "The equivalent of our Rubicon lies in wait - it is the Rhine, and once we cross it, we will have infringed upon the world of the Germans, and begun our long overdue revenge against their transgressions. No longer shall they impose themselves upon us - we shall impose upon them."
 fra_rhineland_title: "Dominion of Rhineland"
 fra_rhineland_desc: "With the Rhineland falling increasingly under our control, it is only a matter of time until German hegemony, disunited as it is, collapses utterly in the region. We must consume the rest of this land, lest the Dutch, the Danes or the Slavs beat us to it."
 fra_hegemon_europe_title: "Hegemon of Europe"
 fra_hegemon_europe_desc: "It is becoming increasingly evident that our efforts to unify our people and cement ourselves as a European power has gifted us the unique opportunity to dominate Europe proper. In time, few will dare to oppose us, due to the sheer might of our military and economy."
 fra_latinize_title: "Latinize the Bretons"
 fra_latinize_desc: "With the Bretons within our fold, it is only a matter of time until they accept the superiority of our ways. So long as they persist in their local traditions and tongue, they will always harbour disloyalty to the government. We must correct these seditious inclinations."
 fra_lingua_franca_title: "Lingua Franca"
 fra_lingua_franca_desc: "Since time immemorial, France has been a disunited lot - hundreds of local tongues are said to persist in modernity, stubbornly clinging to life. Though the effort may be gargantuan, we may soon amalgamate our many identities into one - and France shall never splinter again."
 fra_helvetic_conquest_title: "Subjugate Austria"
 fra_helvetic_conquest_desc: "The ferocious mountains of Austria and the black, brooding forests of Bavaria are yet to know our might - that will change soon, however. With sufficient effort, we may conquer this region outright yet, and establish a new frontier by which to fend off the barbarians of the east."
 fra_fortify_title: "Fortify the Coastline"
 fra_fortify_desc: "Threats are not simply limited to bandits, military incursions, land-based invasions. On all sides, we are infringed upon by maritime marauders, some more professional than others. We must fortify our coastlines to defend against these dangers."
 fra_arsenal_galeres_title: "[Root.GetPreviewColorFRA2_BRANCHING]Arsenal des Galères[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_arsenal_galeres_desc: "The warm waters of the Mediterranean are like a road between the differing worlds of Europe, Asia and, as of late, the Americas. While this sea is often a vivid and prosperous affair, it is not without its dangers - many an empire has lost its fleet to its rivals within its perimeter. To rise to dominance, we must master the Mediterranean."
 fra_iles_manche_title: "[Root.GetPreviewColorFRA2_BRANCHING]Iles de la Manche[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_iles_manche_desc: "Across La Manche, our old enemies leer upon us - worse yet, manning a proliferation of naval bases and port cities from which they wield naval might with ease. We are unfortunately outperformed in this regard - we must create a bulwark of maritime strength in the area to stand on equal footing."
 fra_coastal_infrastructure_title: "[Root.GetPreviewColorFRA2_BRANCHING]Coastal Infrastructure[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_coastal_infrastructure_desc: "Without due investment into our port cities, they cannot hope to satisfy the growing demands of our burgeoning navy. Cities will always have their own private needs and developments and will unfortunately not be able to prioritize rapid militarization if they lack the infrastructure. They are in need of major investment."
 fra_french_channel_title: "[Root.GetPreviewColorFRA2_BRANCHING]The French Channel[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_french_channel_desc: "To dominate La Manche proper - that is the aspiration that is not simply lofty, but ideal, a goal so pragmatic that it is imperative. Due to its proximity to our capital and its surrounding urban core, it is our most vulnerable coastline. We must seize dominance of the channel from our old enemy."
 fra_grande_marine_title: "[Root.GetPreviewColorFRA2_BRANCHING]La Grande Marine[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_grande_marine_desc: "It is said that he who rules the waves rules the coffers of the world. By dominating shipping lanes, protecting merchants near and far, familiar and foreign, we can assert ourselves as the world's guarantor of maritime prosperity, and, in times of treacherous warfare, a titan not to be trifled with."
 fra_dear_most_enemy_title: "[Root.GetPreviewColorFRA2_BRANCHING]Our Most Dear Enemy[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_dear_most_enemy_desc: "The Anglo-Saxons have persisted as an independent threat for far too long. So long as they reign independent, but a mere channel away, they will pose a continuous threat to not only our interests, but the very continent at large. We must establish a foothold in the Isles and begin to tame this lion."
 fra_integration_britain_title: "[Root.GetPreviewColorFRA2_BRANCHING]Integration of Britain[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_integration_britain_desc: "The Anglo-Saxons are broken - their backs breaking beneath the weight of our presence. With but a killing blow, we could rob them of their volition and render them an ineffectual puppet, once and for all."
 fra_reform_guard_title: "[Root.GetPreviewColorFRA2_BRANCHING]Reform the Guard[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_reform_guard_desc: "It is only right that the finest soldiers of our dear country receive the finest training. The command structure must be streamlined and clarified, and excesses must be trimmed like fat from a meal. New standards must replace the old, for they, like many other vestiges of the past, continue to drag us down. Reform the Guard!"
 fra_born_die_title: "[Root.GetPreviewColorFRA2_BRANCHING]Born to Die[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_born_die_desc: "What good is an army without good men to lead it? The finest of soldiers can fail miserably on the battlefield without brutal and concise direction. The art of warfare cannot simply be hoped upon to appear in the finest stock of men - it must be instilled. The leaders of our forces must be of the finest fibre, iron hammered into impeccable form."
 fra_serie_forts_title: "[Root.GetPreviewColorFRA2_BRANCHING]La Serie de Forts[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_serie_forts_desc: "Boastful as our holdings are, it also means we share many a border with many a land. To our east, the Germans leer on. To the southeast, Italy remains a squabbling hive, ready to set itself upon whatever catches its fleeting attentions. To the southwest, the Saracens of Iberia coil and twist like serpents. At any moment, we could face yet another invasion. We must fortify!"
 fra_military_code_title: "[Root.GetPreviewColorFRA2_BRANCHING]Military Code[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_military_code_desc: "What good is a man without values? No good man at all, surely - for his whims, his fancies, his drives and his emotions can possess him and drive him to foolhardy misdeeds. Without rationality to guide him, he is but a creature. This rule is true for collectives - especially armies of a massive scale. No longer can our men sack and pilfer, raze and rage, laze and haze."
 fra_grande_army_title: "[Root.GetPreviewColorFRA2_BRANCHING]La Grande Armée[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_grande_army_desc: "We are in a unique position, as a European power of immensity, both in terms of land and labour, to establish an army of unprecedented size. A fist not unlike that of the titans - one to rival Atlas, he who carries the world on his back; that is what we may wield, and perhaps with the threat of its might, win wars without ever landing a blow."
 fra_cent_suisses_title: "[Root.GetPreviewColorFRA2_BRANCHING]Cent-Suisses[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_cent_suisses_desc: "It has unfortunately been the case, and continues to be so, that coin can get you anything in this wretched world. It is best, then, that it be used to command the soldiers of fortune for the best possible pursuits and causes - namely, ours, in our goal of making this world our own."
 fra_grandes_ecoles_title: "Condorcet's Grandes Écoles"
 fra_grandes_ecoles_desc: "Since time immemorial, education and learned ways have remained out of reach of most folk - having failed to be born into sufficient stock, educating them could hardly be worth the effort. No longer - by removing barriers to higher forms of education and investing tremendous coin, we could source even greater intellectual talent from our growing pockets of manpower."
 fra_scramble_for_africa_title: "Scramble for Africa"
 fra_scramble_for_africa_desc: "The great and vast reaches of Africa lay in a state of vulnerable dormancy. Should we neglect its treacherous shorelines further and choose not to claim it for ourselves, lesser and more malevolent powers will beat us to the punch. Seize Africa!"
 fra_control_east_coast_title: "Control the East Coast"
 fra_control_east_coast_desc: "While less lucrative than other colonial ventures, the east coast offers bountiful pastures, rivers, coastlines and ports, all ideal for long-term investment and permanent settlement. Should we foster an encompassing colony in the region, it could provide an ample pool of manpower and taxation."
 fra_empire_francais_title: "Empire Français"
 fra_empire_francais_desc: "From sea to sea, shoreline to shoreline, our nation shall stand as an empire upon which the sun never dares set. Regardless of where day may reign, so too shall our banner - the world will soon tremble beneath us."
 fra_invasion_maghreb_title: "Invasion of Maghreb"
 fra_invasion_maghreb_desc: "For too long, the treacherous Berbers have terrorized the Mediterranean with their barbaric naval harassment. Little can be done, save brace, for the yearly raids. This can be rectified, fortunately - forcefully, and permanently."
 fra_french_algeria_title: "French Algeria"
 fra_french_algeria_desc: "It is time we put an end to the Barbary menace once and for all. By pacifying the peoples of the Maghreb - be it by the blade, or the pen - we may spare countless generations to come of their ruthlessness."
 fra_landing_india_title: "Landing in India"
 fra_landing_india_desc: "India, vast and fertile, awaits our conquest. All manner of luxury goods, exquisite spices and priceless commodities flow from the depths of India, into the furthest reaches of the globe - it is only right that we be the ones to handle this generous outpouring, first and foremost."
 fra_indian_dominance_title: "Indian Dominance"
 fra_indian_dominance_desc: "With a foothold established in India, it is time we proclaim and assert our dominance. Be it by the barrel of a gun or the strength of our word alone, all of India must bow to the French banner."
 fra_baillages_reform_title: "Baillages Reform"
 fra_baillages_reform_desc: "Burgeoning as we are, both by rightful reclamation and overseas conquest alike, it is nigh time we streamline, improve and trim the fat from our administration, burdened as it is with a plethora of outdated customs and sluggish bureaus."
 fra_journey_eastward_title: "A Journey Eastward"
 fra_journey_eastward_desc: "Trickling across the reaches of Asia Minor, soaring across the southerly waves of the Atlantic, pouring from the Silk Road's sprawl across Tartary, come all manner of exquisite and fantastical goods, ranging from dazzling gems to sizzling spices. Wily merchants mutter tales of their origin - India. We must have it for ourselves!"
 fra_cape_town_title: "Found the Cape Colony"
 fra_cape_town_desc: "Straddling two oceans, bridging two worlds, the far southern tip of the great continent of Africa awaits assertion. If we were to found a colony in this seemingly desolate landscape, we could create for ourselves an exclusive stepping stone into Asia and all that lies beyond."
 fra_east_indies_title: "French East Indies"
 fra_east_indies_desc: "A sprawling chain of archipelagos and islands dot the uncharted blue expanse. The East Indies, as they call them, are an origin of all manner of lucrative spices, tropical timbers and precious minerals. Their scattered and disparate inhabitants would surely adore our overlordship."
 fra_french_indochina_title: "French Indochina"
 fra_french_indochina_desc: "South of the depths of China, rich and feverish jungles dwell ready for conquest. Our merchants insist that a power base within this region would serve as an excellent headquarters for Asia itself, from which all manner of conquests could be launched - including into China itself."
 fra_toulon_dockyard_title: "[Root.GetPreviewColorFRA2_BRANCHING]Toulon Dockyards[Root.GetPreviewColorFRA2_BRANCHING_end]"
 fra_toulon_dockyard_desc: "Toulon, a pearl of the Mediterranean, sits without a port - a lonesome urban sprawl if it ever were one. We see fit to adorn the splendid city with dockyards, as to create of it a naval base fit for our Mediterranean operations."
 fra_mare_nostrum_title: "Notre Mer"
 fra_mare_nostrum_desc: "France must command the waves of the Mediterranean. We shall build a fleet unmatched by any rival to secure our shores, protect our commerce, and assert our rightful dominance over the sea."

