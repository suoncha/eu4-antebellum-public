 faction_otr_haute: "Haute Cour"
 faction_otr_haute_FACTION_DESC: "Representing the interests of the royal family and the Latin Patriarchate, the Haute Cour seeks to centralize the realm and maintain favorable ties with the Papacy.\n§YGain influence by hiring administrative advisors (3).\nGain influence by forming royal marriages with Catholic countries (3).\nGain influence by forming alliances with Catholic countries (5).§!\n§RLose influence by hiring mercenaries (-5).§!"
 faction_otr_levantine: "Levantines"
 faction_otr_levantine_FACTION_DESC: "Representing the interests of Near Eastern Christians and nobles deeply involved in the region's local affairs, the Levantines seek more pragmatic ties with the Saracens and greater involvement in Eurasian trade routes.\n§YGain influence by forming royal marriages with non-Catholic countries (3).\nGain influence by forming alliances with non-Catholic countries (5).§!\n§RLose influence by coring Christian provinces (-1).§!"
 faction_otr_frankish: "Frankish Seigneurs"
 faction_otr_frankish_FACTION_DESC: "Representing the interests of feudal lords on the realm's peripheries, the Frankish Seigneurs seek a prosperous status quo and support for the charitable activities of the realm's military orders.\n§YGain influence by developing Base Tax and Base Production (2).\nGain influence by establishing Holy Orders (3).§!"


