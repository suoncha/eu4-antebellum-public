# Reforms #
 bedouin_monarchy: "Bedouin Monarchy"
 bedouin_monarchy_desc: "ph"
 camel_cavalry_upgrade: "Embrace the Camel Cavalry"
 camel_cavalry_upgrade_desc: "ph"
 unlock_camel_cavalry_upgrade_tt: "§GUpgrades§! the §YEmbrace the Camel Cavalry§! §MTier 4§! Government Reform."
 bedouin_tribal_monarchy: "Bedouin Tribal Monarchy"
 bedouin_tribal_monarchy_desc: "Government organization native to Bedouin tribes of Arabian Peninsula where a group of merchants and livestock herders is organized in a community led by tribal chief. This community practises nomadic lifestyle and is bound together by a shared feeling of common ancestry. More powerful Bedouin chiefs extort power over multiple communes from larger oases, forming the base of this tribal state."
 camel_cavalry: "Embrace the Camel Cavalry"
 camel_cavalry_desc: "The benevolence of Allah has given us the animal so fine-tuned to serve man in desert landscape. Our people saw camels as superior mode of transportation for millennia. Though they are not so fast and agile as horses, they offer much greater resilience and endurance in arid environment."
 desert_corps: "Desert Corps"
 desert_corps_desc: "Arab tribes inhabited hostile deserts for ages and as such had plenty of time to become masters of the harsh environments it offers. Instead of betting that our cavalry can defeat modernizing armies, we should instead make the terrain fight for us! With enough preparation, we can have the roughness of our homeland be our greatest ally."
 modernized_bedouin_federation: "Modernized Bedouin Federation"
 modernized_bedouin_federation_desc: "Life on a desert is vastly different than that of settled people. We simply cannot abandon the lifestyle that our ancestors have been mastering for centuries. Instead, we should only adapt those technological advancements that make our nomadic lifestyle easier."
 contact_with_westerners: "Trade Contact with Westerners"
 contact_with_westerners_desc: "There is no better way to modernize our pastoral tribal society than embracing lucrative trade of goods and ideas with westerners. We could make great use off our trade caravans and sell them all sort of exotic goods. In exchange, we will not only gain access to foreign markets but our people will gain access to new ideas and technological advancements."
 travelling_scholars: "Travelling Scholars"
 travelling_scholars_desc: "Religious matters are very important to our nomadic society and as such, we shall make Islam our official faith. Following the teachings of Muhammad will strengthen our societal ties and standardize cultural norms. In order to enforce that, each nomadic commune shall have their dedicated scholarly figure who will maintain spiritual needs of its members. Those scholars will then travel along with tribes and periodically gather together at our court to discuss important issues."
 tribal_chief_authority: "Consolidate the Tribal Chief's Authority"
 tribal_chief_authority_desc: "In order for our disorganized Bedouin tribe to survive, we must increase the cultural and political authority of chiefs possess over their tribes. We must also formalize and strengthen dependency between local chieftains and the highest leadership. This will bring cohesion within our loose state."
 pastoral_society: "Pastoral Society"
 pastoral_society_desc: "Feelings of shared ancestry are what binds our pastoral society together. Rather than authority of the chief, we should focus on cultivating familial bonds and our heritage as nomadic herders. Our Bedouin people shall never forget about this heritage."

