#Outremer
 otr_settlement_title: "Invite the Christians"
 otr_settlement_desc: "With the Holy Land fully under our control and the naval routes relatively safe, we should let the Christians of Europe know that the borders of our Kingdom are open and eagerly await their arrival!"
 otr_request_money_title: "Request Financial Aid"
 otr_request_money_desc: "This decision allows you to exchange your papal influence for financial aid."
 otr_request_manpower_title: "Request Military Reinforcements"
 otr_request_manpower_desc: "This decision allows you to exchange your papal influence for military reinforcements."


#Jerusalem
 koj_interfaith_unity_title: "Interfaith Unity" 
 koj_interfaith_unity_desc: "It would be impossible for us to truly remove the stain of the Saracens from our lands. They are just too stubborn to ever give in. Perhaps it would be better to accept these differences and bring all peoples of our Kingdom together to strengthen our realm against invaders. After all, we are all sons of Abraham"

#Italiyya
ITL: "Italiyya"
ITL_ADJ: "Italiyyan"

ITL_ideas: "Italiyyan Ideas"
 ITL_ideas_start: "Italiyyan Traditions"
 ITL_ideas_bonus: "Italiyyan Ambition"
 itl_first: "Triumph of the Crescent"
 itl_first_desc: "Our victories against the Papal State and Italian cities have shown that Islam is truly victorious against the Christians. This has led to a renewed faith in Allah and Islamic values amongst our people."
 itl_second: "Increase the Jizya Tax"
 itl_second_desc: "Although we are quite lenient towards other religions in our nation, it has become apparent that the tax on well-off Infidels is quite low. To fill our treasury, we ought to implement a tax hike."
 itl_third: "Domination of the Mediterranean"
 itl_third_desc: "Our hold on Southern Italy meant that we had huge sway over the Adriatic and Tyrrhenian, but soon the entire Mediterranean shall know our might. Following the consolidation of the Italian peninsula, the navy has only grown in size and expertise, with our expansion across the region signalling Italiyya’s dominion."
 itl_fourth: "Reform the Mubarizun"
 itl_fourth_desc: "The Mubarizun is the name given to our most elite champions, those who fight duels with the enemy’s leaders for honour. They are our bravest, and often stand at the head of the army to fight alone. By recognizing and reforming the Mubarizun as a proper branch of the army, we are sure to inspire our forces to achieve victory in every battle."
 itl_fifth: "Conquest of Rum"
 itl_fifth_desc: "Rome, the former heart of the Roman Empire and Christendom has fallen into our hands. This was, and still is, among the greatest events in the history of the Italiyyan realm. The Eternal City’s capture bestows upon us great legitimacy and a truly prestigious accolade. Now, none can deny that we now stand upon the world stage."
 itl_sixth: "Army of the Faithful"
 itl_sixth_desc: "Our army are true warriors of Islam, seeking to spread our faith to all corners of the world. Many flock to Italiyyan recruitment stations to help achieve this goal, for there is no greater honour than dying in battle in the name of Allah."
 itl_seventh: "Invade Europe"
 itl_seventh_desc: "We have taken Italy and brought Islam to its people, but we mustn’t stop there! The Papacy escaped our clutches and still plot to end our nation from the continent of infidels that is Europe. The time that the faithful march has come once more! Allah Akbar!"