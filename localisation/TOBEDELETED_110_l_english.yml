# Events #
 AB_qarmatian_events.1.t: "Election in the Jannabi State"
 AB_qarmatian_events.1.d: "The Qarmatian Imammate is not an authoritarian state; it does indeed have an election system by which members of the Jannabi family decide who is best fit to rule them. They decide on this matter before the death of the current Imam, as to make sure that there is no infighting during perilous periods of time for the state. In the centuries since the start of the revolution, these elections take place within their palace in Bahrain, and have crystalized around three major factions - the Traditionalists, the Mercantilists, and the Millenarians. Each of these factions have different goals and ambitions, and they hope to use their vast influence to elect a leader to advance their interests. This influence goes both ways however - as the current ruler has enough power to influence members of the Jannabi to vote in certain ways."
 AB_qarmatian_events.1.a: "Push electors for a Traditionalist candidate to be chosen."
 AB_qarmatian_events.1.b: "Request electors for a Reformist Candidate to be chosen."
 AB_qarmatian_events.1.c: "Coerce electors for a Millinerian Candidate to be chosen."
 AB_qarmatian_events.1.e: "We shall leave it up to God to decide..."
 AB_QRM_taking_the_cube: "We will begin the process of moving the §YKaaba§! to al-Ahsa\n\nThis will give us §R+10§! §YAggressive Expansion§! with all §YMuslim§! Countries."
 QRM_every_heretic_country_AE: "We will gain §G-10§! §YAggressive Expansion§! with all §YMuslim§! Countries."
 QRM_damage_kaaba_tt: "The Kaaba has been damaged by §R1§! Level!"
 AB_qrm_rebuilt_pyramid: "The Pyramid has been stolen from Cairo!"
 AB_qarmatian_events.2.t: "The Second Sack of Mecca"
 AB_qarmatian_events.2.d: "Dhu al-Qidah 316 was the last time that the Qarmatians had breached the sacred walls of Mecca. The most holy city in all of Islam, where the Prophet Muhammad, praise be upon his name, first spoke the message of God to us, had been the target for Abu Tahir al-Jannabi’s raid. He believed that he had found the Mahdi, curiously enough, and wanted to control the city in order to usher in the end of days.\n\nWe now stand over the breached walls of the city, banners in hand, not for some false savior or for some persian warlord, but instead for our own dominance over the heretic and the liar. The Hasimites are no true stewards of the holy cities - they acquiesce to the whims of the Nizzarids and their Puppet Caliph. They cannot be trusted. The holy city shall be safe in our care, away from those that would lead the Ummah astray.\n\nThere is another matter at hand, however.\n\nDuring the last sack, Abu Tahir made it a point to steal away the Black Stone, seizing it and taking it with him back to al-Ahsa. His reasoning for doing so is debated, some citing the desire to redirect pilgrim traffic, but we believe his motive was to break with the past, to create a new era of knowledge and understanding. There have been…talks, to retrieve the black stone, and place it in al-Ahsa as our ancestors did before. The option lies with us - what do we wish to do?"
 AB_qarmatian_events.2.a: "Take the city, leave the stone."
 AB_qarmatian_events.2.b: "This house does not belong to God, for God never chooses a house for Himself."
 AB_qarmatian_events.3.t: "The Flight of the Rock - The Journey Begins"
 AB_qarmatian_events.3.d: "We are currently in the process of carting off the stone, and we have run into some…complications. The stone is massive, large, and even with a dozen camels, it still takes us ages to march it back through the sand. Worse still, we have heard reports of bandits being hired across the desert to retrieve the stone, paid by rival powers who are shocked by our decision. We have a host of soldiers guarding the stone, but even then, we cannot ensure its safety if we choose to take the main route back to al-Ahsa. We might be forced to take a backroad near the Tuwaiq mountains to survive, but this will delay our arrival by several weeks. Worse still, this rarely taken route will more than likely face complications from the trip…"
 AB_qarmatian_events.3.a: "Take the faster route - they would not dare to attack us!"
 AB_qarmatian_events.3.b: "Take the faster route - but ensign another retinue of guards!"
 AB_qarmatian_events.3.c: "Take the faster route - but pay off some of the bandits to stay away!"
 AB_qarmatian_events.3.e: "Take the slower route - towards the mountains!"
 AB_qarmatian_events.4.t: "The Flight of the Rock - Arriving in Hajr"
 AB_qarmatian_events.4.d: "As we passed by the ancient city of Hajr, we noticed several of the citizens gathered at the entrance. They witness our caravan, a mess of soldiers and scholars alike, and many begin to bow, praying and chanting in Arabic as we pass. They were pilgrims, originally on their way to Mecca, but news must have reached the town before we did, of the sack, of the taking of the holy city. Impossible as it might seem, they aren’t furious at our actions. Instead they see our arrival as a sign that they are blessed and they have been righteous. Many wish to approach, to pay homage to the rock."
 AB_qarmatian_events.4.a: "Let them - collect a tax, and allow them to perform their sacred duties."
 AB_qarmatian_events.4.b: "We shall stay some time, let our camels rest as we tax them."
 AB_qarmatian_events.4.c: "Deny them - we must move quickly!"
 AB_qarmatian_events.5.t: "The Flight of the Rock - Bandits attack!"
 AB_qarmatian_events.5.d: "In the desert, it is paradoxically easy to spot an attack yet very easy to be caught off guard. They came at night when we could barely see past the dim light of the campfire. Men atop horseback, armed with spears, swords, and bows that rained down upon us with intense furocity. We managed to fend them off, but the damage was done. Our retinue was hit, and the Kaaba was damaged in the fighting."
 AB_qarmatian_events.5.a: "Continue on. That is all we can do now…"
 AB_qarmatian_events.6.t: "The Flight of the Rock - Passing through ad-Dahna Desert"
 AB_qarmatian_events.6.d: "The desert can be rough and difficult. The lands of ad-Dahna divide the peninsula in two, and the sands will slow down any traveller trying to reach either side, let alone us with our massive prize in hand. Many of our men take moments to rest in the midst of this vicious heat, drinking whatever scraps of water we have left. Worse still, a guide has informed us of an incoming sandstorm - we could avoid it if we waited, but it would slow us down. If we try to outrun it, it could hit us and potentially damage the Kaaba."
 AB_qarmatian_events.6.a: "We cannot stop at all, we must keep moving!"
 AB_qarmatian_events.6.b: "Wait out the sandstorm, then keep moving."
 AB_qarmatian_events.7.t: "The Flight of the Rock - Camels Rebel!"
 AB_qarmatian_events.7.d: "Oh those poor beasts. Almost as foul smelling as they are tempered, they worked with us, carrying our supplies as we moved the rock across the desert sand, but it seems that our endless drive has pushed them beyond the edge. Some collapsed, others slow, and a few have even decided to bite and spit at their masters in response to the commands to push them further. It seems we are forced to take a prolonged rest…"
 AB_qarmatian_events.7.a: "Get comfy. We’ll get moving eventually…"
 AB_qarmatian_events.8.t: "The Flight of the Rock - Arrival."
 AB_qarmatian_events.8.d: "After a long journey, we have finally arrived at our destination! The Kaaba is placed at the center of the town square, with [Root.Monarch.GetName] being the first to actually pray towards the Rock, thanking God for granting him the strength to complete this great task."
 AB_qarmatian_events.8.a: "All is good."
 AB_qarmatian_events.9.t: "The Flight of the Rock - Heat Strikes!"
 AB_qarmatian_events.9.d: "The temperature is simply too much. Our soldiers strip any armor off their bodies, our merchants leave with them gold and fancy rings in the sand, and many a man has emptied their water flasks. We must take a moment to rest, recover, lest all of us will meet God much sooner than anticipated."
 AB_qarmatian_events.9.a: "Rest, then we go."
 AB_qarmatian_events.10.t: "The Flight of the Rock - Sandstorm Inbound!"
 AB_qarmatian_events.10.d: "A sandstorm has engulfed us fully. Our vision has been nearly completely eliminated, many can’t see beyond their own hand. Fewer still are willing to try, worried for the razor sharp winds that can blind their eyes with grain of sand. As the storm whips around them with its deafening roar and endless torrent of dust, we have no choice but to stop and rest in the cover of our tents. When we emerged, the Kaaba was dirtied and laden with sand. Nothing major but enough to make us have to clean it off when we land in al-Ahsa."
 AB_qarmatian_events.10.a: "I hate sand."
 AB_qarmatian_events.11.t: "The Flight of the Rock - Tuwaiq Mountains"
 AB_qarmatian_events.11.d: "We stuck close to the mountains, hiding amongst the stone and rock in the south. The Dawasir lands, recently conquered, have many caves and hills that we can traverse through to hide our tracks. However, it has begun to drag on. It took us nearly double the time, between hiding out and going incognito, and we nearly got caught as well. At least now we can say we have safely passed through the most dangerous section of Arabia, and now can make our way through the desert."
 AB_qarmatian_events.11.a: "We shall continue on through towards the town of Hajr, safely."
 AB_qarmatian_events.11.b: "We must make up for lost time! Head right for the desert!"
 AB_qarmatian_events.12.t: "The End of the Tamil"
 AB_qarmatian_events.12.d: "ph"
 AB_qarmatian_events.12.a: "We have put an end to their rule, that is enough."
 AB_qarmatian_events.12.b: "Despite all their heathenry, their buildings are quite impressive..."
 AB_qarmatian_events.13.t: "The Fall of Jerusalem"
 AB_qarmatian_events.13.d: "ph"
 AB_qarmatian_events.13.a: "We shall be leniant towards the Christians."
 AB_qarmatian_events.13.b: "They must convert - it is that simple."
 AB_qarmatian_events.13.c: "If they do not convert, force them to work!"
 QRM_enforced_servitude: "Enforced Religious Laws"
 QRM_leniant_policy: "A Policy of Leniancy"
 AB_qarmatian_events.14.t: "The Fall of the Abbassid"
 AB_qarmatian_events.14.d: "ph"
 AB_qarmatian_events.14.a: "We shall follow the Qarmata Path"
 AB_qarmatian_events.14.b: "Never! Those upstarts demand too much."
 AB_qarmatian_events.15.t: "The Remaking of Qahirah"
 AB_qarmatian_events.15.d: "‘Crop yields are good. We have the grain shipments flowing regularly to the Andalusians, while the Sicilians barter for lower prices as usual. There was a brief Copt riot in Iskandirya, but it was quickly suppressed.’ The Wizier did not normally hesitate or stutter as he spoke to his [Root.Monarch.GetTitle], and yet, [Root.Monarch.GetName] couldn’t help but notice that the man was slow with his words. He was holding his tongue, and with a sigh, gestured for the poor boy to continue.\n\n“And…as for your…special project…well, there was a…uh..” [Root.Monarch.GetName] sighed, shaking his head.\n“Spit it out boy! I do not wish to die of old age waiting for my morning report.”\n\n “My [Root.Monarch.GetTitle], there has been a problem. A small one, but…well, when your men started stripping stones from those heathen monuments, we assumed it would take a year at most. But in the last eight months, they have barely made a dent, sire.”\n\nAh, yes. The project to completely remodel the land of Qahirah, starting with those blasted Pyramids. He had ordered them to be destroyed, hadn’t he? “What do the engineers think of it? How long will it take?”\n\n“A long time, sire.”\n\n“How long?” \n\n“A LONG time, sire” [Root.Monarch.GetName] Pinched his brow, sighing to himself.\n\n“And of course, the workers would be paid the whole time, I assume. How wonderful. Can we not just…blast it with those damned cannons? Reduce them to rubble as we did the walls of Antioch!”\n\n”Sire, these are far larger, and despite your wisdom, I do not think it would be prudent to use our arti-”\n\n”Bah, I know, I jest. So it’s either abandon my project…or be prepared to spend all of my money. What a lovely compromise.”\n\nAnd the morning was going so well."
 AB_qarmatian_events.15.a: "Just let it go. Get out money back, show our skills as a ruler."
 AB_qarmatian_events.15.b: "BRICK BY BRICK, AND DO IT QUICK."
 AB_qarmatian_events.16.t: "The Amhara and the Faithful"
 AB_qarmatian_events.16.a: "Conversion or the Jizya, as is written."
 AB_qarmatian_events.16.b: "We shall grant them some...leniancy. For the best deals!"
 AB_qarmatian_events.16.c: "Their churches should be removed, reformed into houses of God!"
 every_owned_coptic_province_TT: "Every owned §YCoptic§! province will receive:"
 QRM_coptic_tolerance: "Coptic Tolerance"
 rebuild_stone_mosque_tt: "We shall rebuild a mosque just like the stone churches in Al-Ahsa!"
 AB_qarmatian_events.17.t: "The Heathen Relics of Dagon"
 AB_qarmatian_events.17.d: "ph"
 AB_qarmatian_events.17.a: "Let them remain, we shall use them to get more to join the faith!"
 AB_qarmatian_events.17.b: "Grab the relics, grab a monk, and let's build another mosque!"
 AB_qarmatian_events.18.t: "The Mighty Warriors of the Zanj"
 AB_qarmatian_events.18.d: "ph"
 AB_qarmatian_events.18.a: "Use them for Local Militias Only."
 AB_qarmatian_events.18.b: "They have proven their worth! Elavate them to Mamluks."

