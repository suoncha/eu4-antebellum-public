# Events #
 nizzarid_event.22.t: "Urban Planning of Cairo"
 nizzarid_event.22.d: "[Root.Monarch.GetName] was known to be very concerned about urban planning, particularly in [361.GetName]. In [GetYear], the [Root.Monarch.GetTitle] gave the order to construct two new public baths and a large communal residence in the Bayn al-Qasrayn District. During that time, he decided to widen the road that originated out of it, the main thoroughfare of [361.GetName], known as the Qasaba. This demolished several older structures, but in the end traffic was much quicker and according to important historians, this greatly benefited the general public."
 nizzarid_event.22.a: "Allah is Great!"

 nizzarid_event.23.t: "The Grain Trade in Egypt"
 nizzarid_event.23.d: "In our time, the grain trade played a pivotal role in sustaining our prosperity. We recognized the significance of efficient grain production and distribution, ensuring a stable food supply for our people. Our well-organized granaries and trade networks facilitated the movement of grains across our territories, fostering economic growth and social stability. By prioritizing the development of this trade, we demonstrated our dedication to the welfare of our subjects and the enduring strength of our realm."
 nizzarid_event.23.a: "Let us focus on spreading our wealth"
 nizzarid_event.23.b: "We should look to further increase production"

 nizzarid_event.24.t: "The Waqf of [Root.Monarch.GetName]"
 nizzarid_event.24.d: "In a demonstration of our commitment to the betterment of our society, we have chosen to establish a waqf. Through this act, we dedicate a significant portion of our wealth and resources to create a lasting charitable endowment, aimed at supporting education, healthcare, and social welfare initiatives for our people. This waqf stands as a testament to our enduring legacy of benevolence, aiming to provide essential services and opportunities for generations to come, showcasing our dedication to the well-being and progress of our realm."
 nizzarid_event.24.a: "Sponsor scholarly madrasas"
 nizzarid_event.24.b: "Let us fund places of worship, instead"

 nizzarid_event.25.t: "Recruit the Osmans"
 nizzarid_event.25.d: "ph"
 nizzarid_event.25.a: "Their people will prosper in our new empire..."

 nizzarid_event.26.t: "The Dar al-Makhzen"
 nizzarid_event.26.d: "In the heart of [343.GetName], amidst the bustling lanes and vibrant markets of the old medina, lies the resplendent Royal Palace of [343.GetName], known as Dar al-Makhzen. A bastion of regal authority, where our dynasty will etch its legacy into the very walls. Approaching the grand entrance, the Bab El Makhzen gate stands adorned with mesmerizing zellige tilework, each intricate piece reflecting the artistry of the era.\n\nInside, a tapestry of history unfolds within the palace's chambers, where rulers orchestrate affairs of state and host illustrious gatherings. The palace is a living embodiment of local Moroccan craftsmanship, every detail from the intricate patterns to the towering walls whispers tales of a resplendent past.\n\nThe conquest of such an illustrious monument is a clear sign of our superior might it the face of adversity and against all our enemies."
 nizzarid_event.26.a: "Let us commence the reconstruction"

 nizzarid_event.27.t: "Coffea Arabica"
 nizzarid_event.27.d: "Under the administration of the [Root.GetName], the cultivation of Coffea Arabica saw notable development. Recognizing the potential of this exotic plant, we initiated efforts to cultivate and refine its growth techniques. Our agricultural experts meticulously studied optimal growing conditions, leading to improved yields and quality. The resulting coffee production became not only a source of pride but also a valuable trade commodity, enhancing our economic strength. Our dedication to fostering the growth of Coffea Arabica played a role in its eventual global significance as a cherished beverage."
 nizzarid_event.27.a: "Soon everyone will seek for our coffee"

 nizzarid_event.28.t: "Monopoly on Coffee Extension"
 nizzarid_event.28.d: "The [Root.Monarch.GetTitle]'s permit on Coffee Plant plantations has now expired. Many [Root.GetBurghersName] wonder if we will extend it or if this benevolent policy is to come to an end for the years to come."

 nizzarid_event.29.t: "The Abbasid Power"
 nizzarid_event.29.d: "abbasid become the grand vizier, ruling the caliphate de facto while nizzarid de jure"
 nizzarid_event.29.a: "ph"

 nizzarid_event.30.t: "The Co-Caliph System"
 nizzarid_event.30.d: "status quo: abbasid is the de jure, nizzarid is the de facto caliph"
 nizzarid_event.30.a: "ph"

 nizzarid_event.31.t: "The Hashshashin Strikes Again"
 nizzarid_event.31.d: "our ruler is assassinated"
 nizzarid_event.31.a: "ph"

 nizzarid_event.32.t: "The Hashshashin Strikes Again"
 nizzarid_event.32.d: "the hashshashin has assassinated the enemy ruler for us"
 nizzarid_event.32.a: "ph"

 nizzarid_event.33.t: "Timed Mission Unlocked"
 nizzarid_event.33.d: "We have unlocked 'Lead the Ummah' timed mission. If we complete this mission before the year 1455, we will unlock a powerful bonus. Should we fail, the mission will be §Rpermanently removed§! from our mission tree."

 nizzarid_event.34.t: "Timed Mission Failed"
 nizzarid_event.34.d: "We have failed to complete 'Lead the Ummah' timed mission, therefore the mission will be permanently removed from our mission tree."

