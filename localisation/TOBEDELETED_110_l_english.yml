 ab_estate_church_persian_influence: "Promote Persian Studies"
 ab_estate_church_persian_influence_desc: "Persia is a land of scholars and riches. We can learn from their art, literature, and scientific innovations, but unfortunately, their people are currently in the clutches of heathenry. We will promote studying their history and grant land and resources to start schools and universities dedicated to the topic."
 unlock_ab_estate_church_persian_influences: "§GUnlocks§! the '§YPromote Persian Studies§!' [Root.GetBurghersName] Estate Privilege, giving the following effects:\nGain §G-5.0%§! Province War Score Cost when at war with Heathens and §G-5.0%§! Technology Cost when at peace."
