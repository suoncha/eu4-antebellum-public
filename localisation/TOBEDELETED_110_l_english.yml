# Events #
 ab_seljuk.17.t: "Dismantle the Gilded Cage"
 ab_seljuk.17.d: "Strangled serpents of flame twist into the blackened skies above Cairo. Many a banner lays trampled beneath the hooves of our embittered men, whom have endured a blistering campaign into the heart of Egypt. Our efforts have paid off however - the old government has collapsed in but a matter of hours. At the heart of the whirlwind however, perched within the gilded halls of a palace set apart from it all, a remnant of the old ways - the last vestiges of an era before, but a sad old man and his harem."
 ab_seljuk.17.a: "Into history, he shall pass."

 ab_seljuk.18.t: "Conquests of Arslan"
 ab_seljuk.18.d: "From a young age, Arslan V displayed fierce aptitude. Competitive, confident, a lion among men, he had the tongue of a serpent and the eye of an eagle. Leading men came to him as easy as flight to a bird of prey. As he showed greater and greater potential with his burgeoning years, learning by heart the tactics of his forefathers and the names of the lands on which we today tread, it became readily apparent to all his advisors and family that a conqueror was being forged before their very eyes. Today, he stands as a legend in wait - a comet set to obliterate the old order."
 ab_seljuk.18.a: "He shall lead us to greatness!"

 ab_seljuk.19.t: "Growth of [151.GetName]"
 ab_seljuk.19.d: "'To defend everything is to defend nothing' - so say many a wise man in his ruminations on military management. Such words are applicable in a myriad of other matters however. We have found, through our arduous years, that to take a temporary, concerted focus to one arm of the government, ironing out its flaws, trimming out its fat and spearheading new ideas, is the fastest and surest way to encourage growth. Be it our administration, diplomatic corp or proud armed forces, we must choose on which to focus for a time."
 ab_seljuk.19.a: "Our papers must be tended to."
 ab_seljuk.19.b: "Our tongue must be cultivated."
 ab_seljuk.19.c: "The ground must tremble beneath our feet."

 ab_seljuk.27.t: "Reconquest of Persia"
 ab_seljuk.27.d: "Many a moon ago, our ancestors swept like a divine storm through the lands of Persia. The petty squabbling stood no chance before our virile fathers, whom cast them down, smashed them to oblivion, reigned steady and true. Those days have come and gone - but since, newer days have arisen, and as the sun illuminates Persia today, it beholds a land weeping. Shattered beneath our machines of war, Persia is submitting anew to the Seljuk yoke, remembering its place beneath our banners. We hope in time it will remember nothing else and know only our benevolent rulership."
 ab_seljuk.27.a: "The land of shahs - ours, once more."

 ab_seljuk.28.t: "The Imperial School of Military Engineering"
 ab_seljuk.28.d: "The lifeblood of our nation has always been our military virility. Upon a strong, impermeable foundation of the old ways, we have built a fortress of tactics accumulated over the centuries, incorporating firearms, artillery, advanced movements, formations and more to our repertoire to combat our ever-increasing list of enemies. To our astonishment, among these enemies are the Franks of old - an entire civilisation burgeoning behind their folds of civilised fat, creating an admittedly impressive host of military developments. We would be fools not to steal some of their wisdom."
 ab_seljuk.28.a: "Into the books!"

 ab_seljuk.29.t: "The Three Court System"
 ab_seljuk.29.d: "Once upon a time, so say the eldest among us, law was a simple affair - a wise man acted as the judge and the unwise men were whipped soundly. These are not simple times however - law is an abstract of the highest order and must be upheld at all costs, invincible to scrutiny. This requires codification, distribution, oversight - as well as delegation of more simple matters to lower courts, whilst the gravest tribulations be brought before the highest in all the land. Our administrators and learned-men, long having bemoaned the lack of organisation, have finally constructed a worthy system."
 ab_seljuk.29.a: "All is just before the eyes of God." 

 ab_seljuk.30.t: "Timed Mission Unlocked"
 ab_seljuk.30.d: "We have unlocked 'Arslan the Conqueror' timed mission. If we complete this mission while Arslan V is still alive, we will unlock a powerful bonus. Should we fail, the mission will be §Rpermanently removed§! from our mission tree."

 ab_seljuk.31.t: "Timed Mission Failed"
 ab_seljuk.31.d: "We have failed to complete 'Arslan the Conqueror' timed mission, therefore the mission will be permanently removed from our mission tree."

