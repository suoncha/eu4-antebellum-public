 naz_granary_title:0 "Granary of the World"
 naz_sword_islam_desc:0 "Since our humiliating defeat at Sidon, where the sultan Al-Husayn was brutally cut down by the treacherous infidel, we have been plotting our revenge. The crusader kings think themselves to be the shield of christianity. Let us martial the largest army in our Sultanate's history and prove once and for all that no shield may parry the sword of Islam!"
 naz_liberate_jerusalem_desc:0 "The primary goal of our war against the christians is to recapture the holy city of Jerusalem from which muslim pilgrims have been turned away for too long. We cannot delay our attack further, knowing the desecration that the holy monuments of the city have no doubt faced under the rule of the crusader scum."
 naz_purge_crusaders_desc:0 "The crusading nobility of the holy land must be rooted out from every castle they have built and every location which they have turned into one their blasphemous principalities. The settlers they brought with them are a different story. We could allow them to continue their worship in peace, knowing that they will not disturb our state, or send missionaries to supplicate them to Allah's light with a little...force."
 naz_seize_antioch_desc:0 "Antioch and Alexandretta are two of the world's most well-fortified cities. The citadel the crusaders have built at Antioch is undeniably impressive, but its walls will fall if their prince dares come to the aid of his cousins in Jerusalem when we attempt to retake the holy city once more."
 naz_conquer_cyprus_desc:0 "The crusader isle of Cyprus will prove difficult to occupy. The fortified island is notoriously difficult to invade; perhaps if we blockade the surrounding waters for long enough, we can stage a quick siege that will break their spirit enough for them to surrender."
 naz_purge_secure_desc:0 "We have wrought destruction upon the crusaders and uprooted them from the levant, but our merchants continue to complain of the harassment they face by the last catholic holdouts in the Aegean. The Knights of Rhodes are a naval nuisance that will be destroyed, just as their so-called 'brothers of the sword' were."
 naz_cilicia_desc:0 "The Armenian Kingdom of Cilicia is a thorn in our side. Having been allowed to fester like a wound for far too long, the kingdom has become bold, aligning itself with other christian powers in the region. We cannot allow this foreign occupation of Tarsus to perpetuate any longer. We would sooner the damned Greeks rule over that land than its current overlords! Of course, we will be the ones ruling it soon enough."
 naz_follow_nile_desc:0 "The various kingdoms of Nubia seem to believe that we are unaware of their existence. They squabble amongst themselves as if we are not capable of destroying the whole of them in a single war. Now that we have the might, we should have a force martialed in upper Egypt to cross into Nubia and seize their lands - rich in ebony, ivory, and gold."
 naz_oases_desc:0 "Deep in the Egyptian desert, there are several oases, some already partially settled with tribal towns. They could be prime locations to develop to house our growing population. Alexandria should only have so many residents, after all."
 naz_copts_desc:0 "The Miaphysite Christians of Abyssinia are nothing like the crusaders. Many of them are amiable to our sultan, and they have made excellent advisors in the martial and administrative fields. It is not within our interest to suppress their culture, but rather to accept them as they are. Their well-disciplined Cawa warriors will be made officers in our army, as they fare better on the battlefield than many of our own native force."
 naz_nubia_desc:0 "The remainder of Nubia continues to elude us despite our conquest of the interior. In order to assert our control over the Red Sea and inland trade routes, we must secure Nubia in its entirety."
 naz_ethiopia_desc:0 "Having subjugated the Nubians to our rule, we are face to face with the highly-mythicized kingdom of Abyssinia, or Ethiopia, as its own inhabitants call it. The emperor of this state claims to be the last bastion of christianity in Africa, and to be in possession of the Ark of the Covenant. The unstoppable tide of Islam cannot be allowed to cease in the face of such arrogance. Ethiopia and all its riches shall be ours!"
 naz_indian_desc:0  "From the far east silk and spices, among other riches, are flowing into our lands. However, despite the volume of exchange that occurs with the kingdoms of India and the east, we know little about our lucrative trading partners. We should charter an expedition to these lands so that we may expand our opportunities."
 naz_seljuks_desc:0 "The Seljuk Turkish State continues to be a nuisance. Its decadent Sultan holes up in his harem, surrounded by sin and temptation, casually commanding his armies to amass at our border. Does he take the house of Nizzar for a joke? When Sivas is abluted by fire and our riders are at the gates of his extravagant palace, we shall have the last laugh!"
 naz_tradition_desc:0 "Among the Turks, those already converted to Islam are remarkably pious, though they know not the language of the prophet, nor the traditional islamic methods of administration. Under our rule, the same pashas will manage the Anatolian provinces as under the Seljuks, but they shall now write and speak in terms we can understand. This could be the beginning of a beautiful blending of cultures not dissimilar to the adoption of Arabic traditions by our Egyptian ancestors so long ago."
 naz_holy_cities_desc:0 "Makkah and Madinah are exposed to threat on all sides, from the ambitious desert tribes that currently rule over them to the many others that would wish to, as well as the christian powers of the African Horn and the heretics of Yemen. Naturally, since we already protect the Caliph, our Sultan should seize the two holy mosques so that they might be safe from desecration."
 naz_aden_desc:0 "Beyond the Hijaz is the most profitable stretch of land bordering the red sea; Yemen, with all its coffee fields and trading ports. If we can control the strait at the mouth of the Red Sea, known as the Gate of Grief, we can permanently monopolize trade in the Red Sea."
 naz_baghdad_desc:0 "Baghdad was once the city that the Abbasid Caliphs named as their capital. Now, after years of exchange between Arabs, Mongols, Turkoman tribes, and other various intermediary states, the round city is far from the global hub it once served as. In our possession, however, Baghdad would prosper as in eras past."
 naz_wisdom_desc:0 "Centuries ago, Baghdad was home to a combination library-university known as the House of Wisdom. Here, the great scholars of the Islamic world would gather to discuss natural philosophy, compose literature, and debate theology. This once great center of learning is now gone, but our status as patrons of art and science would be greatly elevated if we were to construct a new House of Wisdom, even grander than the original!"
 naz_extinguish_desc:0 "Persia remains an enigma. Despite centuries of incursion, no Muslim state has ever managed a campaign into the heart of Iran and remained intact long enough to integrate the region into Dar al-Islam. To change this, in the name of Nizzar, we shall embark upon a journey of conquest that will mirror that of Iskandar himself, sweeping into Persia with a force never before seen!"
 naz_iran_desc:0 "What is Iran now, but a plateau populated by the same arrogant heathens that Iskandar himself once subjugated in the Hellenic age? It is the destiny of the House of Nizzar to put the entire region to the sword, and prove once and for all that the unrelenting tide of Islam is truly unstoppable!"
 naz_khorasan_desc:0 "The natural extension of our conquest in Iran is the subjugation of Khorasan, whose multiethnic polities are divided between nomadic and settled people, all of whom will make easy targets for our forces as we secure the logical borders of our empire."
 naz_anatolian_desc:0 "With the Seljuks defeated, it follows that we should take advantage of the Anatolian power vacuum by bringing the various remaining Turkish states into the fold, along with the Greek kingdom of Nicaea, the last holdout of that culture on the anatolian peninsula."
 naz_presence_in_india_desc:0 "How insulting it was for our sailors to arrive in an Indian port they frequented, only to find that the dock and adjacent town were adorned with the banner of the Caliph of Cordoba! They reported that the port had not been conquered; rather, its trading rights were purchased by the Caliph. How dare other powers encroach on the Indian ocean trade from which we are the primary beneficiary! We must buy our own port, and fast!"
 naz_constantinople_desc:0 "Constantinople, known as the City of the World's Desire, is not necessarily reflective of its epithet anymore. Although it has been eclipsed in grandeur by various cities throughout the world, the Bosphorus Strait remains a critical chokepoint for our naval and trading operations in the mediterranean. Surely the Osmanoglu trading family will appreciate a more theologically sympathetic overlord."
 naz_caucasian_desc:0 "The Christian Kingdom of Georgia is not necessarily a threat, but securing the strategic Caucasus mountain range within our borders could prove to be an advantageous defense against the hordes beyond the peaks."
 naz_persia_desc:0 "The Sassanids, similarly to the Romans, boast that they are the last bastion of an empire that, in some shape or form, has lasted two thousand years. The time has come to show these arrogant fools that no flame can protect them. The Shahanshah should know by now that his ancient cataphract tactics are showing their age."
 naz_fareast_desc:0 "The further reaches of the Indian Ocean are home to the mysterious spice islands. From these rich and densely jungled lands flow some of the most desired spices and materials in the world. With just one city in the region in our control, we can funnel riches untold into our homeland!"
 naz_spice_desc:0 "It has become clear that the merchants of Indonesia are far too tough a sell for us to continue trading with. It would be much easier to use our overwhelming military might to wrest control of the spice trade."
 naz_trade_hegemony_desc:0 "We are within a hair's breadth of total east-west trade hegemony, in both the indian ocean and over the silk road. If we can just maintain a hold over the strait of Malacca, the gateway to China, no other power will dare contest our merchants."
 naz_african_expedition_desc:0 "Beyond Benghazi lie the open deserts of the Maghreb, a wild land of pirates and tribes whose pacification is a primary concern of the coastal egyptians who are subject to constant raids at the hands of these brutes. With a small army, we should take control of some areas of the vast Maghrebi Desert as a preliminary act before committing to more aggressive operations."
 naz_tunis_desc:0 "The barbary pirates of Tunis are perhaps the greatest threat to our interests in the mediterranean. To put a permanent end to their hostility, we shall slaughter them where they stand and strike at the heart of the tunisian sultanate that permits them to raid us!"
 naz_sicily_desc:0 "Having stemmed from the Tunisians, the Sicilian sultanate is a piratical threat that we anticipated. This, however, doesn't mean that their actions are acceptable. Just like their unruly cousin to the south, the heretical Tunisian Sultan shall face retribution for his constant incursions into our waters."
 naz_maghreb_desc:0 "With the pirates of the central Mediterranean eradicated, we find our borders enticingly extended deep into the Maghreb. Perhaps conquering deeper into the region could be advantageous in combating further piracy and disrupting the interests of our greatest rivals, the Andalusian Caliphate of Cordoba."
 naz_andalusia_desc:0 "The Maghreb is now fully under the control of our state, and across the pillars of Hercules, the Andalusian garrison at Jabal-Tariq practically taunts us! With friction building up at the gate of the Mediterranean, the so-called Caliph in Cordoba must know what comes next. We shall launch an all-out assault, defeating our rival once and for all, dethroning the illegitimate Caliph and uniting Dar al-Islam under one banner!"
 naz_caliphate_desc:0 "With all other pretenders deposed, the Sultan is faced with a dilemma regarding the succession of the Caliphate. The Abbasid puppet we have paraded around our realm for so long now seems more like a humorous showman when compared to our mighty Sultan. For this reason, it only follows that we should allow the 'Caliph' to retire to an estate where he can live out his days, having been relieved of his ceremonial duties. The title of Caliph will be transferred to the Nizzarid Sultan, uniting the secular and religious leadership of our realm."
 naz_dockyard_desc:0 "From Venetian smugglers and zealous naval Knights to Barbary Pirates and every maritime threat in between, our Mediterranean waters face constant threat. To protect our coastline, we must construct a grand fleet, and to do so, we must create a grand dockyard in the capital. From there, we will launch a thousand ships and more so that we are no longer navally challenged."
 naz_sponsor_desc:0 "Perhaps our conquest of North Africa has been too harsh. The Barbary Pirates of the region are not so nationalistic that they would turn down a good opportunity. Despite our brutal subjugation of their homeland, many of their bands are willing to sail under a different black banner, our very own. With these raiders now loyal to us, we will be able to share in the loot of the Mediterranean's great cities."
 naz_reform_cavalry_desc:0 "The shock cavalry that Nizzar utilized to dethrone the Ayyubids centuries ago remains the core of our armies. These noble cataphracts are drafted from the highest strata of our society and their discipline and valor is unmatched by any European knight. To ensure that the prevalence of firearms on modern battlefields does not render our cavalry irrelevant, we must reform the units and train them in the usage of firearms, as well as in new tactics that will allow them to disrupt and disarm modern infantry formations."
 naz_empower_stratocracy_desc:0 "The most senior administrators of our state are the Sultan's loyal generals, among whose ranks are the most seasoned and innovative military men in Dar al-Islam, nay, the world. Without their leadership, our Sultan must admit, he would be nobody at all. To ensure their future loyalty, we will promote them to official governmental positions beyond the military, altering our state so that it may better serve our army, rather than vice versa."
 naz_nizzar_academy_desc:0 "Nizzar the Great was known for the unmatched discipline of his fighters. It is said that he personally trained his men, performing strength training and combat drills alongside them, not unlike his greatest inspiration, al-Iskandar al-Akbar. To continue the legacy of the discipline in which our state was forged, the Sultan should order the construction of a grand military academy in the capital, which will both honor his forefather and serve as a training ground for thousands of future conscripts and volunteers."
 naz_military_infrastructure_desc:0 "The army that powers our Sultanate requires men to sustain its size. The casualties of war and retirement of veterans periodically result in manpower shortages. To rectify this, we should construct military training fields throughout the realm, along with free housing in barracks for any who volunteer into our service. Surely this will ensure a steady flow of fresh blood for our growing war machine."
 naz_islam_sword_desc:0 "Without our presence, the chroniclers tell us, the safety of the Islamic world would not be nearly as secured as it is now. The increasing confidence of our subjects and those abroad in our ability to defend the faithful from harm and launch incursions into heathen territory has imbued our soldiers with unprecedented levels of morale. United, they are truly fit to be called the Sword of Islam!"
 naz_protect_hajj_desc:0 "Our state is steadily growing to encompass an increasingly more vast swath of the Islamic world. For this reason, we must ensure that our road system is protected and developed so that the faithful may travel from far and wide to Mecca to complete their Hajj."
 naz_alexandria_desc:0 "Alexandria is one of the grandest cities in the world already, but to challenge the power of the European states and prove our status to other Muslim powers, we must make sure that it is a metropolis on par with its own classical iteration, home to untold riches and the greatest monuments to be seen anywhere."
 naz_library_desc:0 "In the Hellenistic period, after Iskandar's conquest of Egypt, a massive library was constructed in Alexandria which housed the world's largest collection of books, scrolls, and other recorded knowledge. Sadly, this palace of learning was destroyed sometime during Roman Rule in Egypt. To reverse the barbarous actions of its destroyers, we must erect a new library and invite scholars from across the world to contribute works new and old to populate its shelves."
 naz_advisor_desc:0 "No state can function without effective administrators. Accordingly, our Sultan must surround himself with trustworthy and intelligent advisors, loyal enough not to plot his downfall, but independent enough to challenge the Sultan when he is wrong, so that he may be a just and disciplined ruler."
 naz_suez_desc:0 "Since time Immemorial, the Levant and Africa have been united only by an infinitesimal stretch of land between Egypt and the Sinai peninsula. Our engineers and sailors have recently suggested that modern technology is advanced enough to create a grand canal that will connect the Mediterranean Sea to the Indian Ocean, reducing travel distance by thousands of miles. Imagine the profit that could be generated not just by the trade that would flow through this canal, but also by taxing foreign fleets seeking to pass through the new tollgate of world trade! We must immediately begin construction!"
 naz_trade_desc:0 "Despite all the profit there is to seek in India, the Far East, and Africa, there truly is no place like home. The loyal merchants of Syria and Egypt maintain a millennia-old exchange based around grain and cotton that continues to this day. We should capitalize on the volume of trade within the homeland."
 naz_delta_desc:0 "The Nile Delta is home to grain fields that fed the entire Mediterranean and beyond at the Roman Empire's height. We are certain that with enough expansion of the existing irrigation systems, we will be able to recreate the fields that once earned the Nile Delta the title of Breadbasket."
 naz_textile_desc:0 "The conversion of raw silk and cloth from the east into textiles and clothing is fast becoming one of the most profitable industries in the world. We should take advantage of the vast supply of raw cotton and silk we produce and import to manufacture textiles that can be sold to Europe at extravagant prices."
 naz_industrialize_desc:0 "Across the world, the fires of industry are roaring, and we will not be left behind. The massive grain, textile, and mining industries we already facilitate must be modernized and expanded. We will charter state corporations to oversee the creation of new factories across the Sultanate so that we may continue to have a dominant and competitive economy, not reliant on anyone else's imports."
 naz_granary_desc:0 "In the Nile Delta, we already produce some of the highest yields of grain in the world, but with modern irrigation and advancements in agricultural technology, we can expand the fields to produce more grain in less time and with less human labor. We will flood foreign markets with such high volumes of grain that they will find it pointless to grow their own, making the Nile Delta the granary of the entire world and giving the Sultanate powerful leverage in future trade deals."
 
 #Italiyya
 itl_gather_title:0 "Gather the Faithful"
 itl_gather_desc:0 "Despite our glorious conquest of Southern Italy, the infidels to the north continue to resist us. Gather the faithful, and let the Christians tremble before us!"
 itl_rome_title:0 "The Eternal City"
 itl_rome_desc:0 "We must unseat the vile infidel who would dare claim the throne of St. Peter, the first Imam. Conquer the city of Rome and its environs, and strike fear into the heart of Christendom."
 itl_thrust_title:0 "Thrust into Italy"
 itl_thrust_desc:0 "With Rome fallen, it is only natural that we push deeper into the peninsula. With their sad parody of a Caliph uprooted, how can any Christian hope to stand against us?"
 itl_crown_title:0 "Break the Iron Crown"
 itl_crown_desc:0 "The Iron Crown of Lombardy, a symbol of not only Italian dominance but of Christian strength in general, must be shattered. Supposedly forged from a nail of the One True Cross of the prophet Jesus, our Sultan shall don this holy relic, and then smash it along with any hope of Infidel resurgance in our new kingdom!"
 itl_dream_title:0 "The Dream of Italiyya"
 itl_dream_desc:0 "Since our first failed conquest of Italy we have dreamed of a peninsula united under our rule. As we push the infidel further from the bounds of Italiyya this dream becomes continually more solid, and soon our nation will have reason to claim the name of the peninsula itself, and be known as its one true master. Hail the Sultanate of Italiyya, hail the Sultan, hail Allah!"
 itl_pearl_title:0 "Pearl of the Mediterranean"
 itl_pearl_desc:0 "Balarm has been a center of commerce and culture since even before our liberation of Sicily. Further developing the city and promoting it as a center of trade shall both strengthen our economy and spread the word of Allah across the Mediterranean."
 itl_palace_title:0 "Sultan's Palace"
 itl_palace_desc:0 "Our policies have resulted in wealth pouring into the island of Sicily, and the grand city of Balarm in particular. It is only fitting that the Sultan of such a great realm receive a palace worthy of his stature."
 itl_patronize_title:0 "Patronize Art and Religion"
 itl_patronize_desc:0 "The wealth flowing into our coffers should go towards a worthy cause, perhaps embracing this idea of 'Renaissance' will endear us towards our future Christian subjects?"
 itl_reform_title:0 "Reform the Government"
 itl_reform_desc:0 "Our realm is expanding, both culturally and militarily, and our government has yet to catch up with these changes. We must reform our administration to fit with the Renaissance ideology our subjects have come to expect."
 itl_tax_title:0 "Increase Jizya Tax"
 itl_tax_desc:0 "The financial burden of our newly advanced administration must be shouldered by someone. It seems only fitting that our Christian subjects pay the price of their own integration. Surely they won't mind..."
 itl_amir_title:0 "Empower the Amirs"
 itl_amir_desc:0 "Granting greater privileges to the Amirs will allow us to maximize the efficiency of any new lands we conquer, though it will require sharing a significant amount of power with them."
 itl_mubarizun_title:0 "Modernize the Mubarizun"
 itl_mubarizun_desc:0 "The Mubarizun were a cadre of champions attached to the great Rashidun armies that first spread Islam to the far corners of the world. In these conquests the champions would engage in single-combat with the enemy before the general advance. This practice has become outdated with the advent of gunpowder warfare, and it is time we reform this cadre to serve as an elite fighting force within our armies."
 itl_construct_title:0 "Construct a Fleet"
 itl_construct_desc:0 "The Italian Peninsula is overflowing with naval prowess. If we are to gain control of Italiyya or its periphery we must build a fleet capable of competing with the likes of Genoa."
 itl_tunisia_title:0 "Land in Africa"
 itl_tunisia_desc:0 "The lesser Hafsid dynasty of Tunis brings nothing but shame to our mighty Sultan. We must remove this stain on the Hafsid's prestige, and take back the homeland for ourselves."
 itl_rival_title:0 "Rival Tunis"
 itl_rival_desc:0 "Our kinsmen in Tunisia have fallen on hard times, and we are now the leading branch of the Hafsid dynasty. Perhaps our inferiors should kneel before the mighty Sultan?"
 itl_mitidja_title:0 "Seize Mitidja"
 itl_mitidja_desc:0 "We require more naval bases from which to raid the various infidels of the Mediterranean. The port of Mitidja is the perfect place to gather wealth for our great Sultanate, as it doubles as an important trade city, and it's ties to the lesser Hafsid dynasty gives us the perfect claim."
 itl_tripoli_title:0 "Control Tripolitania"
 itl_tripoli_desc:0 "It is only fitting that we acquire everything once held by the lesser branch of the Hafsid dynasty."
 itl_baleares_title:0 "Conquer Baleares"
 itl_baleares_desc:0 "Control of the Mediterranean hinges upon the various isles that dot its great expanse. Our ownership of Sicily is an excellent start to a commercial empire, but we must acquire more of these island trading posts to ensure our finances."
 itl_strait_title:0 "Control the Strait"
 itl_strait_desc:0 "The Strait of Gibraltar has long been the gateway to trade and naval dominance in the Mediterranean. It seems only right that as the growing naval hegemon we should make a bid for this strategic asset."
 itl_isles_title:0 "Take the Isles"
 itl_isles_desc:0 "In order to project the power of our growing navy across the Western Mediterranean, we need more naval bases from which to launch raids and sorties on our enemies. The islands of Sardinia and Corsica would be ideal for this, and liberating them from the naval powerhouses that oft control them will give our sailors a strong sense of pride and accomplishment."
 itl_valencia_title:0 "Raid on Balansiyah"
 itl_valencia_desc:0 "Balansiyah, known as Valencia to the Christians, is a rapidly growing trading city that has come to be a center of commerce in the Western Mediterranean and the first stop for trade ships coming through the Strait. It'd be quite fitting if European traders, after paying our toll at the Strait, were then met with our tarrifs at Balansiyah..."
 itl_canaries_title:0 "Claim the Canaries"
 itl_canaries_desc:0 " We've heard rumors of a land across the great ocean, far to the west. Our Andalusian bretheren are hardly suited for the task of bringing the light of Islam to this 'New World,' and we must pick up their slack. Otherwise we doom the natives to a life of heathenry under the Christian explorers."
 itl_unknown_title:0 "Into the Unknown"
 itl_unknown_desc:0 "The establishment of a burgeoning colonial empire is a hallmark of any great European power, and the wealth generated here will only be funneled back to us through the Strait. Our realm's wealth will soon know no bounds."
 itl_balkan_title:0 "Land in Albania"
 itl_balkan_desc:0 "Despite the constant decline of the Roman Empire, our Turkish bretheren have yet to break into Europe and spread Islam to the Balkans. It once again falls to us to pick up our brothers' slack, establish a foothold in the Balkans and show them light."
 itl_greece_title:0 "Conquer Greece"
 itl_greece_desc:0 "Greece has been under firm Roman rule for over 1,500 years. Today, that has ended. The precious heartland of the Romans has fallen, and with our flank secure the path to Constantinople lays open before us..."
 itl_thrace_title:0 "Fall of Constantinople"
 itl_thrace_desc:0 "The Roman Empire has been a joke for centuries. Some argue it died when Rome itself fell, some argue Justinian was the last 'Roman' Emperor, and some attest that it still lives, and will rise like a Purple Phoenix from the ashes. Put this idea to rest, and snuff it out with the dying gasp of the Greek Emperor."
 itl_cyprus_title:0 "Take Cyprus"
 itl_cyprus_desc:0 "The Nizzarid dynasty embarrassed all of Islam when they allowed the Crusader States to wrest back control of the Holy Land. Regardless of the status of these lands now, it is clear they would be better protected under our great Sultan. Seize Cyprus for a base of operations in the Holy Land."
 itl_alexandria_title:0 "Control Alexandria"
 itl_alexandria_desc:0 "Iskandariyya is the principle trading port of the Eastern Mediterranean, second only to Constantinople itself. If we seek to dominate Eastern trade we must seize this city and its wealth for ourselves."
 itl_palestine_title:0 "Protect the Holy Land"
 itl_palestine_desc:0 "Nizzarid incompetence shall never again bismirch the name of Islam. We must seize Jerusalem for ourselves, and our custodianship of this holy city shall ensure it never falls to the infidel again."
 itl_dalmatia_title:0 "Capture Dalmatia"
 itl_dalmatia_desc:0 "We have extended our domain far beyond Siqilliya and the centre of the [Root.GovernmentName] at [Root.GetCapitalName]. Dalmatia, the land which the Venetians call Dalmàssia, is a tempting target for our next conquests: its subjugation will give us great influence in the Adriatic Sea, both economic and military."
 itl_delta_title:0 "Grip over the Delta"
 itl_delta_desc:0 "Despite our control of al-Iskandariyya, the pearl of the Mediterranean and one of the most prosperous cities in the world, there is much of the Nile delta that remains outside our lands. That cannot remain so: we will seize the heart of the Nile and secure its myriad rivers for our cause."
 itl_egypt_title:0 "Egyptian Authority"
 itl_egypt_desc:0 "With a rich and stable foothold in the Delta, we must seek to continue our push up the Nile River. Let us march south, and in doing so, acquire the riches of Egypt for ourselves!"
 itl_turk_title:0 "Push against the Turk"
 itl_turk_desc:0 "We may have seized the delta, the most historically important part of Egypt, but the rest of Egypt is still held by other powers. To solidify our control over the Nile, we must conquer the lands around it as a safeguard."
 itl_balkans_title:0 "Thrust into the Balkans"
 itl_balkans_desc:0 "The Balkans are a land that has yet eluded us: despite our small foothold in Albania, the rest of these lands remain not only heathen, but outside of our reach. The great Danube is an excellent defensive position against possible Christian incursion, and thus will strengthen our position in the East significantly if we can reach its banks."
 itl_expand_maghreb_title:0 "Expand in the Maghreb"
 itl_expand_maghreb_desc:0 "al-Maghrib, 'the west', was partially under Hafisid control under the weak and unworthy Tunisian branch of our great dynasty. Now that they have been brought into the fold, further expansion in the Maghreb is an obvious route to wealth due to the Saharan trade."
 itl_control_maghreb_title:0 "Control North Africa"
 itl_control_maghreb_desc:0 "We have grown stronger than ever imagined. We shall spread our wings, and bring Mediterranean Africa under our control, for there is no one more apt to wield such power than the [Root.Monarch.GetTitle] [Root.Monarch.GetHerselfHimself]! Alhamdulillah!"
 
# Missing 1.9.5 Locs #
 form_caliphate_title:0 "Proclaim the Caliphate"
 form_caliphate_desc:0 "Having unified Islam, we must fulfil the prophecy of Muhammad and formally unite the Muslim world under a black banner!"

 #Sicilian Ideas
 SIC_ideas:0 "Sicilian Ideas"
 SIC_ideas_start:0 "Sicilian Traditions"
 SIC_ideas_bonus:0 "Sicilian Ambition"
 sic_first:0 "Jizya Tax"
 sic_first_desc:0 "Jizya is a special per-capita yearly tax on our non-Muslim subjects residing in our lands."
 sic_second:0 "Qadi"
 sic_second_desc:0 "Qadis are the magistrates and judges of a Sharia court, also exercising extrajudicial functions, such as meditation, guardianship over orphans and minors or supervision and auditing of public works."
 sic_third:0 "Sicilian Fleet"
 sic_third_desc:0 "Our capital lies on an island of Sicily and could fall prey to stronger naval powers of the Mediterranean. For that, we must make sure that our navies are unmatched."
 sic_fourth:0 "Mubarizun Infantry"
 sic_fourth_desc:0 "Fearless Mubarizuns are an important part of our armed units. Roots of these elite champions can be traced back to the times of Rashidun Caliphate."
 sic_fifth:0 "Agricultural Revolution"
 sic_fifth_desc:0 "When our ancestors conquered Sicily, they initiated land reforms, which in turn increased productivity and encouraged the growth of smallholdings, a dent to the dominance of the landed estates."
 sic_sixth:0 "Pearl of the Mediterranean"
 sic_sixth_desc:0 "Palermo is one of the largest cities lying on the shores of the Mediterranean sea, overshadowed only by the Byzantine Constantinople and Nizzarid Alexandria. The suburbs of Al-Khalisa contain the Sultan's palace, baths, government offices and mosques. The city is the greatest pride of our nation."
 sic_seventh:0 "Dreams of Italiyya"
 sic_seventh_desc:0 "When our ancestors invaded Sicily and Italy, their goal was to bring down the capital of the Christian world and conquer it for the glory of Allah. Unfortunately, they were unsuccessful. We will succeed where they failed!"

 #Sicily Events
 ab_sicily.1.t:0 "Fall of Rome"
 ab_sicily.1.d:0 "Rome, the so called 'Eternal City', has fallen. The seat of the First Imam has been liberated, and the Papal pretender has fled the city before our holy armies. This abandonment has struck the population of Rome deeply - many have embraced Allah to spite their abandoner, and many others have turned to Him in despair as Christendom crumbles around them. The city, and its people, belong to Allah now, and Allah favors his faithful!"
 ab_sicily.1.a:0 "Praise Allah"
 ab_sicily.2.t:0 "Fate of the Iron Crown"
 ab_sicily.2.d:0 "In a ceremony reminiscent of the coronations of Holy Roman Emperors as Kings of Italy, so too was our Sultan bequethed the Iron Crown in Milan. Prior to the ceremony, the Sultan's smith had tempered the gold and iron of the crown to a state of extreme fragility. After being crowned according to Christian tradition before a crowd of Milanese citizens and nobles, the Sultan rose and, removing the crown from his head, dashed it upon the ground. The crown lay shattered at the Sultan's feet, and the message was clear: As the crown has shattered, so too shall Christendom."
 ab_sicily.2.a:0 "So too shatters the infidel spirit"

 #Sicily Gov Reforms
 sicsultanate:0 "Sultanate of Sicily"
 sicsultanate_desc:0 "The Sulatanate of Sicily maintains a rather absolute system of rule under Sharia law with the emir in charge of many state duties, but it is notable for its tolerance among Muslim realms with its many Christians and Jews populating Eastern Sicily and South Italy."
 sicitaliyya:0 "Sublime State of Italiyya"
 sicitaliyya_desc:0 "Through a long and hard fought campaign spanning several centuries, the original invaders of Sicily have managed to proclaim an empire in Italiyya. As a new courtly culture coalesces and the Islamization of one of the hearts of Christendom is felt more every day, the Italiyyan Sultanate indisuputably reigns supreme over her surroundings."
 sicqadi:0 "Empower the Qadi"
 sicqadi_desc:0 "The Sultan carries the very important duty of appointing Qadi, or judges, for the various provinces of the state. These Islamic judges often solved local disputes and religious matters, allowing residents to sort things out peacefully with a mediator, and letting the Sultan not need to worry as much about direct administration."
 siccurrency:0 "Standardize the Currency"
 siccurrency_desc:0 "In the past, the Sultanate of Sicily used a single currency; the dinar which was introduced by the Arabic conquerors of the island. However, over time, many more new currencies such as Dirhems or Kharrubas, leading to unnecessary confusion and troubles with exchange rates. In order to get rid of this problem once for all, we shall introduce a single currency that shall be used throughout the entire Sultanate."
 sicreform:0 "The Land Reform"
 sicreform_desc:0 "Following the Islamic conquest of Sicily, land reforms were initiated to transform the island into a more Arabic system of governance. This resulted in many new and exotic crops being introduced to Sicily during the agricultural revolution, and smallholding farms being encouraged to increase productivity."
 sicrecruits:0 "Berber Recruits"
 sicrecruits_desc:0 "Though the Sultanate now rules over a largely Roman populace, the battle hardened armies of the Sultan are often recruited from across the Mediterranean in North Africa. While these armies tend to fight for gold and glory rather than the Sultanate, they are always loyal to the Sultan with little interest for local politics, caring more for fighting Christians in North Italy."
 sicfleet:0 "Expand the Fleet"
 sicfleet_desc:0 "Our position in the middle of the Mediterranean gives us the perfect chance to become a true ruler of the waves, controlling the naval routes from Balansiyah to Iskandariyya. The state shall fund the great expansion of our naval forces."
 sicitalo:0 "Italo-Arabic Governance"
 sicitalo_desc:0 "As our Arab and Islamic origins become more intertwined with local Italian customs, a distinct culture has coalesced in the ruling class of many of our cities. Through combining Italian and Arabic language, and adopting many of the traditional practices of each, this culture is sure to be of use in efficient communication among the ruling classes of the Sultanate. This is now also reflected in the upper class and administration of our country where many important positions are occupied by persons of Latin or Christian origins."
 sicgiama:0 "Giama'a Assembly"
 sicgiama_desc:0 "Though the Sultan performs many of the important state duties, there has always been an administrative council supporting his decisions, made up of the most notable figures in court. With the Giama'a supporting the state, policies can often pass without major opposition."
 sicabsolutism:0 "Islamic Absolutism"
 sicabsolutism_desc:0 "The Sultan is in charge of many key aspects of state, such as the army, administration, and justice. By institutionalizing these powers as part of the office of Sultan we can further legitimize the strong centralized rule of the state."
 sicambition:0 "Italiyyan Ambition"
 sicambition_desc:0 "In our ruthless campaign to conquer the heart of the Mediterranean for Islam, our state has faced many a foe and adapted many reforms. However, throughout this relentless push we have remained stable and prosperous, and the countless victories have showered us in glory, allowing our rulers to call truly themselves the Sultans of Italiyya."

 #Sicily Modifiers
 sic_colony:0 "Beyond the Known World"
 sic_triumph:0 "Triumph for Italy"
 sic_epirus:0 "March of Epirus"
 sic_navy:0 "Maritime Empire"
 sic_balkans:0 "Balkan Conquest"
 sic_isles:0 "Rule the Isles"
 sic_berber:0 "Privateer Fleet"
 itl_rivalry:0 "Tunisian Rivalry"
 tunisian_ambition:0 "Tunisian Ambition"

 #Andalusia
 ADU2_ideas:0 "Andalusian Ideas"
 ADU2_ideas_start:0 "Andalusian Traditions"
 ADU2_ideas_bonus:0 "Andalusian Ambition"
 adu_first:0 "Farfanes"
 adu_first_desc:0 "Since the early middle ages, various Muslim dynasties of the Mediterranean have been employing Christian mercenaries in their armies. Over time, the Farfanes, fighting in European fashion in dense formations of heavily armed men on horseback became an integral part of the Caliph's army."
 adu_third:0 "Legacy of Balansiyah"
 adu_third_desc:0 "The Iberian Crusade of 1443 was a grim reminder of Christian brutality and savagery. We must not forget our brave soldiers who sacrificed their lives on the battlefields of Al-Andalus, protecting their homeland from our arch enemy. May Allah bring peace upon them."
 adu_sixth:0 "Expeditionary Sentiment"
 adu_sixth_desc:0 "We have heard tales from captured European sailors about a New World to the west, abundant with gold and silver. We should organise our own expeditions across the ocean and see for ourselves whether these rumours are true."
 adu_sixth2:0 "Expeditionary Sentiment"
 adu_sixth2_desc:0 "We have heard tales from captured European sailors about a New World to the west, abundant with gold and silver. We should organise our own expeditions across the ocean and see for ourselves whether these rumours are true."
 adu_seventh:0 "Caliph's Authority"
 adu_seventh_desc:0 "The Sultan of Al-Andalus also claims the title of Caliph. He is a political and spiritual successor of the Prophet Muhammad and a leader of the entire ummah. This title grants us exceptional prestige and respected status amongst the Muslims."

 adu_flee_to_brasiliyya_title:0 "Flee to Brasiliyya"
 adu_flee_to_brasiliyya_desc:0 "Andalusia is in ruins! The Caliph and the court must make haste across the sea before our enemies descend upon us once more. Though it will be painful to leave Andalusia behind, we shall surely create a glorious new Empire in Brasiliyya."
 brasiliyya_consolidation_tooltip:0 "All our subjects in the §YColonial Brazil§! region will be annexed."
 brasiliyya_provinces_tooltip:0 "A colonial subject in the §YColonial Brazil§! region with at least §Y20§! fully colonised provinces."
 brasiliyya_move_capital_tooltip:0 "The capital will move to [763.GetName] if owned, or else to a random province in the Brazil colonial region."
 brasiliyya_andalusia_tooltip:0 "Andalusia will be released as a march in our last European holdings."
 ADU_START_DISASTER:0 "Starts the §RAndalusian Civil War§! disaster."

 # Andalusia Modifiers
 adu_new_world_discoveries:0 "The New World?"
 desc_adu_new_world_discoveries:0 "The Portuguese have made some startling discoveries, it seems. Entire continents exist beyond the mists of the sea - this information is kindling quite the sense of adventure amongst our citizenry."
 adu_trade_hub:0 "Port of Interest"
 desc_adu_trade_hub:0 "This is an ideally located port to siphon off valuable income from our less compromising neighbors."
 adu_native_concord:0 "Native Concord"
 desc_adu_native_concord:0 "The violent behavior of the first Portuguese and Castilian explorers to reach the new world has not gone unnoticed by the indigenous peoples who reside there. We have come to see this as an opportunity for a different approach - one that might see us prosper together, rather than foment war and discord."
 sicily_in_safe_hands:0 "Administrative Investments"
 desc_sicily_in_safe_hands:0 "Sicily serves us better in our direct control - as such, we are able to invest more resources in coaxing the island to prosperity."
 adu_popular_appeal:0 "Influx of Believers"
 desc_adu_popular_appeal:0 "Our recent embracement of their faith has caused many oppressed minorities to seek refuge within our borders. Let us treat them with the respect they deserve."
 adu_conservative_backlash:0 "Conservative Approval"
 desc_adu_conservative_backlash:0 "Our people greatly appreciate our efforts to stand with them, despite the wave of rediscovery touring our nation."
 adu_righteous_conquest:0 "Sword of Islam"
 desc_adu_righteous_conquest:0 "We have defied all odds, and followed in the footsteps our forefathers. Let us now look to the horizon, and show our oppressors that their days are numbered."
 adu_white_phoenix:0 "The White Phoenix Rises"
 desc_adu_white_phoenix:0 "At last we have exceeded that which our ancestors achieved. The centuries of decline are forgotten, and our nation stands proud at the borders of the Pyrenees. Our final step however, is yet to be taken."
 adu_summer_capital:0 "Great Mosque of Damascus"
 desc_adu_summer_capital:0 "This architectural wonder stands, despite nearly a thousand years of war. Added to over the centuries, we feel it is our duty to preserve, maintain, and continue this great work."
 adu_tolerance_heretics_mod:0 "Shahada, Salah, Zakat"
 desc_adu_tolerance_heretics_mod:0 "The possession of the Holy City requires a certain tolerance towards believers, regardless of their personal inclinations. With such great responsibility as the care of Mecca, we must care equally for fellow men."
 adu_greater_than_alexander:0 "Imperial Administration"
 desc_adu_greater_than_alexander:0 "Much of what was once lost to us has been restored. There is still much to reclaim. The Umayyads installed a system of diverse governorates to oversee the extents of their empire, and so should we."
 adu_trade_company_founded:0 "Naval Investment Policy"
 desc_adu_trade_company_founded:0 "In order to defend our burgeoning shipping lines, great care must be paid to our navies."

#Andalusia Gov Reforms
 adutolerance:0 " Alh Ulh Dhimma"
 adutolerance_desc:0 "As much of our country is populated by the Christians, we will demonstrate our benevolence by extending to them the tolerance and respect that is often denied to Muslims under Christian rule."
 andalusian_caliphate:0 "Andalusian Caliphate"
 andalusian_caliphate_desc:0 "Since the disintegration of the Umayyad Caliphate, Andalusia has proudly stood as the spiritual leader of the Islamic world. Even though there are many who claim the Caliphate, only our claim to it is a legitimate one."
 aduceremonial:0 "Ceremonial Nobility"
 aduceremonial_desc:0 "After our victory at Balansiyah, treasonous emirs attempted to overthrow the Caliph, having grown far too powerful to handle with subtlety. Although ultimately defeated, such traitors would be likely to cause trouble later if permitted to maintain their power and influence. By stripping these powerful magnates of their titles and lands and granting them to persons who are still loyal, the position of emir will be henceforth ceremonial."
 aducolonial:0 "Reform the Overseas Administration"
 aducolonial_desc:0 "Our growing colonial empire requires an administrative reform which will strengthen our grip over the oversea territories and attract new settlers to move to the New World."
 aduprovincial:0 "Reform the Provincial System"
 aduprovincial_desc:0 "Under the Ummayad Caliphate, lands were granted to generals and other such influential persons as hereditary titles. This caused disloyalty later as the nobles expanded their provincial dominance. The creation of a meritocratic system in our provinces whereby loyal and competent men can rise through the ranks in lieu of indulgent wastrels may accomplish this goal."
 aduawasim:0 "New Thughur and Awasim"
 aduawasim_desc:0 "The Thughur were a series of marches, comprised of fortified strongholds on the Byzantine frontier. The Awasim were then emplaced in Syria as a secondary line of defence. During the 8th and 9th centuries, more Thughur and Awasim were created on the northern border to protect against the Franks and other Christian kingdoms. By effectively reviving this system, newly conquered territories ought to be more easily-defended, ensuring the security of Andalusia’s core lands."
 aduforeignscholar:0 "Invite Foreign Scholars"
 aduforeignscholar_desc:0 "During the Andalusian Golden Age in the 10th and 11th, centuries many scholars flocked from across Europe and the Islamic World to visit the Umayyad Caliphate’s famous universities and libraries. By enacting a programme of systematic renovation and use of excess tax revenue to fund the founding of new Universities, the Caliphate may handily entice learned men to once more study in Al-Andalus."
 adulegalsystem:0 "Reform the Legal System"
 adulegalsystem_desc:0 "For most of its history Al-Andalus had a very advanced legal system for its time. However due to centuries of neglect this system has grown old and somewhat corrupt. By changing the system of choosing Qadis (judges) and creating a proper judicial authority we can create a modernised legal system."
 aduconstitution:0 "Andalusian Constitution"
 aduconstitution_desc:0 "Across Europe movements of revolution are spreading, some advocate for reform, and some even want the end of hereditary rule! Although, some of their ideas are way too radical, one of them is the establishment of a constitution clarifying the powers of the ruler. Instead of denying all of their ideas we should hear them out and implement some of them. This has the benefit of satisfying their demands and reducing the number of radicals in these revolutionary groups."


#Jalayrids Missions
 jlr_anatolia_title:0 "Invade Anatolia"
 jlr_anatolia_desc:0 "Constant clashes between Greeks and Turks, religious strife, and Mongol incursions have reduced this once prosperous land to a wasteland, making the Anatolian Peninsula a place of many possibilities that our troops are ready to exploit."
 jlr_turks_title:0 "Subjugate the Turks"
 jlr_turks_desc:0 "The Turkic populations of Anatolia share much with our Central Asian past, their position midway between Europe and the Middle East presents a great opportunity for easy expansion of the borders of our domain and the Ummah."
 jlr_secure_north_title:0 "Secure the North"
 jlr_secure_north_desc:0 "To our north lies the last remnants of the Middle East's past, the lands of the Christian Assyrians and the last domain of the Ayyubid dynasty. As the new Mesopotamian power it is our job to cleanse the land of the relics of the past."
 jlr_rival_sultanates_title:0 "Rival the Sultanates"
 jlr_rival_sultanates_desc:0 "The Middle East has many forces on its chessboard, the largest armies in the region belong to our enemies, the Nizzarids and the Seljuks. To protect our territories and the real Caliph we must create an army capable of fighting for our faith."
 jlr_ilkhanate_title:0 "Reunite with the Ilkhanate"
 jlr_ilkhanate_desc:0 "The Ilkhanate was formerly the ruling power of Persia but its collapse offered us and many other dominions a chance to break free. Today our strength has managed to surpass that of our past overlord and the time has come to unite the lands of the former Mongol Empire in the region under our banner."
 jlr_caucasia_title:0 "Safeguard Caucasia"
 jlr_caucasia_desc:0 "Ciscaucasia is controlled by the powerful Christian kingdom of Georgia. The threat they pose to the Ummah must not be overshadowed and despite the formidable defence provided by their mountains they too will fall as our troops advance."
 jlr_jerusalem_title:0 "Liberate Al-Quds"
 jlr_jerusalem_desc:0 "Al-Quds, Yerushalayim, Ierusalem are many names of the holy city that our ancestors of the Caliphate tried to defend and reconquer from the threat of the Crusaders and failed. Now our time has come to fight to free the holy land from the yoke of Christians and bring it back to the faith of Mohammed."
 jlr_syria_title:0 "Syrian Incursion"
 jlr_syria_desc:0 "Here in these lands our Mongolian ancestors were blocked by the future founder of the Nizzarid dynasty but now is our chance to redeem the honour of our predecessors by avenging them. These raids will only be the beginning of the westward expansion."
 jlr_cyprus_title:0 "Conquer Cyprus"
 jlr_cyprus_desc:0 "The island of Cyprus has been a key hub in Mediterranean trade since ancient times, but is now a base for Crusader dominance in the region. We must exploit the conflict between the inhabitants of the island and its rulers in our favour, the Jalayirids will be the first Islamic dynasty to permanently rule this island."
 jlr_nizzarids_title:0 "Dethrone the Nizzarids"
 jlr_nizzarids_desc:0 "We have reached the final battle against the greatest enemy that has stood in our way, we are at the gates of Egypt ready to challenge all the might of the Nizzardis. This confrontation will not only decide the fate of the Middle East but also that of millions of Muslim believers. For these very reasons we will triumph."
 jlr_cage_title:0 "Break the Gilded Cage"
 jlr_cage_desc:0 "We have finally reached the heart of Islamic Egypt, Cairo, where the legitimate head of the entire Ummah, the Abbasid Caliph, is held prisoner. As faithful servants of him it is our purpose to release him from his confinement and to punish his jailers."
 jlr_antakiya_title:0 "Fate of the Christians"
 jlr_antakiya_desc:0 "With the conquest of the holy land we found ourselves governing a large and unexpected minority of Christians, to avoid administrative problems in the region we reached an agreement with the local authorities. We will grant locals greater autonomy and dhimmi status in exchange for their oath of allegiance and payment of tributes."
 jlr_delta_title:0 "Cultivate the Delta"
 jlr_delta_desc:0 "With the conquest of Egypt we gained control of an important resource for our economy, namely the Nile delta. We must invest in the agriculture of the region in order to be independent of foreign resources, transforming Egypt into the granary of a new empire."
 jlr_mecca_title:0 "Secure the Holy Cities"
 jlr_mecca_desc:0 "As representatives of the Abbasid Caliph's power and protectors of the Islamic faith it is our duty and right to protect the sacred cities Makka al-mukarrama and al-Madinah al-munawwara by claiming the title of Sharifate of Hejaz, granting us greater authority in the eyes of the faithful and bringing the 'Ummah to ever greater unity."
 jlr_zagros_title:0 "The Zagros Frontier"
 jlr_zagros_desc:0 "The Zagros Mountains represent the real border between Persia and the Mashriq lands. Currently they are inhabited by very different populations who are unlikely to pose a threat to the armies of the sultanate. Occupying these mountain passes will enable us to penetrate easily into the heart of Persia."
 jlr_coastline_title:0 "Advance Along the Coastline"
 jlr_coastline_desc:0 "The coast of southern Persia is a land of rich and ancient civilization which is currently suffering from religious wars between Muslims, Christians and Zoroastrians. Under our administration these lands will be able to shine again."
 jlr_sugar_title:0 "Khuzestani Sugar Fields"
 jlr_sugar_desc:0 "The Khuzestan region presents an excellent investment opportunity for our country's agriculture. The lands of the region, decayed due to the continuous conflicts of the region, are perfectly suited to the cultivation of sugar cane, a luxury good in great demand on the local and European markets."
 jlr_extinguish_title:0 "Extinguish the Eternal Flame"
 jlr_extinguish_desc:0 "The very heart of the Persian state is now only one step away from our forces, their constant internal conflicts have made them weak and our hand is ready to reap the fruits of their decadence."
 jlr_princes_title:0 "Princes of Persia"
 jlr_princes_desc:0 "The Persian princes have fallen, some have knelt some have fallen in battle. Now without opponents the title of sole Shahanshah rests with the true conqueror and unifier of the region."
 jlr_triumph_title:0 "Triumph of the Crescent"
 jlr_triumph_desc:0 "With our victory over all the forces struggling to unite the Eranshahr, we have brought the Abbasid homeland back under their lordship. It will now be our task to maintain the positions obtained and also win the hearts and faith of the new subjects."
 jlr_heart_empire_title:0 "Heart of the Empire"
 jlr_heart_empire_desc:0 "With the fall of the Nizzarids, Egypt is at our feet. Now this land that brought so much to the power of the caliphate will be able to continue to serve him for centuries to come."
 jlr_aden_title:0 "Monopolise Aden"
 jlr_aden_desc:0 "The city of Aden represents the heart of Southern Arabia and its infrastructures are essential for maintaining stable trade passing through the Red Sea and building contacts with the faithful present in East Africa."
 jlr_africa_title:0 "North African Incursion"
 jlr_africa_desc:0 "Even before the Romans, North Africa found its major development centers in Egypt and Ifriqiya. Between them are the lands of Tripolitania, Cyrenaica and Fezzan; not of great strategic importance in the Mediterranean scenario, they would still allow us to have a closer base of operation to the city of Tunis and the coasts of the Italian peninsula."
 jlr_khorasan_title:0 "Pacify Khorasan"
 jlr_khorasan_desc:0 "Khorasan is a symbolic land dear to the Abbasid dynasty, in fact their lineage arose from these lands, driving out the inept Umayyads from the Caliph's throne. Despite the impervious territory of the region and its aggressive and often heretical populations, this will be the final act of our campaign in Persia."
 jlr_berbers_title:0 "Tame the Berbers"
 jlr_berbers_desc:0 "The Berber tribes have been both a great asset and a major obstacle to Islam. The current dominant force among the Berbers are the Hafsid dynasty of Tunis, their destruction would allow us to assert our power over the Berbers and our subjugated Arab brothers in the region, while also securing the important port of Tunis."
 jlr_sicily_title:0 "Italian Intervention"
 jlr_sicily_desc:0  "Beyond the Mediterranean Sea lies a threat not only political but also religious. A branch of the Hafsid dynasty rules this land practicing the heresy of Shiism, to prevent them from expanding this corrupt faith in the European continent or in North Africa we must wipe them off the map of Italy."
 jlr_crescent_title:0 "The Fertile Crescent"
 jlr_crescent_desc:0 "Before starting our expansion policy, we need to strengthen and support our economy which depends on the territories between the two main rivers of the region, the Tigris and the Euphrates."
 jlr_caravanserai_title:0 "Adopt the Caravanserai"
 jlr_caravanserai_desc:0 "At the heart of every great power in the history of the Middle East is commerce, and in order to revive it we must expand and repair the caravanserai road system."
 jlr_restore_baghdad_title:0 "Restore Baghdad"
 jlr_restore_baghdad_desc:0 "The city of Baghdad, once the heart of the Islamic empire, has suffered enormous damage of all kinds due to the invasion carried out by the Mongol forces. As descendants of those hordes and new masters of the city it is our job to make amends, rebuilding Baghdad and to bring it back to the greatness it deserves."
 jlr_paradise_title:0 "Paradise Gardens"
 jlr_paradise_desc:0 "The city of Baghdad arose on the lands of many other capitals of mighty civilizations, among them the most ancient was the glorious Babylon. It is our aim to raise Baghdad to a beauty that can rival that of its ancient predecessor, going so far as to challenge the ancient Hanging Gardens by creating a new version that will leave the world amazed."
 jlr_nahrawan_title:0 "The Nahrawan Canal"
 jlr_nahrawan_desc:0 "Having taken on the task of restoring Baghdad's glory to its former glory, it will be crucial to re-establish the Nahrawan Canal system. The Nahrawan Canal was a large irrigation system of Sassanid origin that supplied agriculture throughout the region and which reached its peak in the Abbasid era, our aim is to surpass these peaks of efficiency."
 jlr_industrialize_title:0 "Industrialise the Sultanate"
 jlr_industrialize_desc:0 "The sultanate is facing new and ever greater challenges, we must try to keep up with technological innovations otherwise we will fall behind the European powers. Therefore we must start a solid industrialization program both economically and militarily thanks to the best experts that our riches can buy."
 jlr_golden_age_title:0 "Rekindle the Golden Age"
 jlr_golden_age_desc:0 "The golden age of Islam ended with the arrival of the Crusaders and the Mongols. As these threats recede and the stability and wealth of the region increases, the chances of rekindling the golden age are within the reach of the entire Ummah."
 jlr_sultans_court_title:0 "Sultan's Court"
 jlr_sultans_court_desc:0 "Behind every great government there are many nobles and advisors, they form the sultan's court which over the decades has been filled with the greatest experts of human and theological knowledge who gain power thanks to their merits and their skills."
 jlr_merchant_title:0 "Construct a Merchant Fleet"
 jlr_merchant_desc:0 "Our main access to trade with the Indies is represented by the Persian Gulf, through the city of Basra. The merchants of the city therefore required the protection of the Sultan on the seas."
 jlr_hormuz_title:0 "Seize Hormuz"
 jlr_hormuz_desc:0 "The island of Hormuz is located at the end of the Persian Gulf and its control would allow us an easy connection with the Arabian Sea and the Indian Ocean, guaranteeing us the dominance of the Arab and Persian maritime trade in the area."
 jlr_gulf_title:0 "Gulf Trade Monopoly"
 jlr_gulf_desc:0 "Our merchant fleets have secured great influence in the region but some forces still oppose our monopoly of the region. Allah has granted us the seas and it is our duty to reclaim them."
 jlr_bahrain_title:0 "Control the Coastline"
 jlr_bahrain_desc:0 "To the south of our domains lie the diverse and divided emirates and sultanates of eastern Arabia. Gaining control of this coastline will be important in asserting our power over the seas and boosting trade in the region. Their weakness will be our strength."

#Iberia
 IBE_ideas:0 "Iberian Ideas"
 IBE_ideas_start:0 "Iberian Traditions"
 IBE_ideas_bonus:0 "Iberian Ambition"
 ibe_first:0 "The Reconquista"
 ibe_first_desc:0 "Those blasted Andalusians have oppressed our fellow Christians long enough! Brave countrymen, free your brothers and sisters, tortured, in shackles, by the evil Sultan for centuries. Their chains will hold the righteous light of God no longer! All heathens will burn in His light! ¡Vamonos!"
 ibe_second:0 "Iberian Inquisition"
 ibe_second_desc:0 "The best thing about the Iberian Inquisition is that nobody expects the Iberian Inquisition!"
 ibe_fourth:0 "Armada"
 ibe_fourth_desc:0 "The Angelcynn navy is a joke, the Frankish navy is a joke -  they act tough, but crumble at the smallest problem. The Iberian Armada makes the Sailor proud, the Builder proud, and most of all, it makes God himself proud to have such great men on the lands He made!"
 ibe_fifth:0 "Build a Colonial Empire"
 ibe_fifth_desc:0 "We must spread the Catholic Faith far and wide, so that God's light can save others and help them in their hardships, just as He helped us in our troubled times. Everyone will discover our generous God, by force if we have to."
 ibe_sixth:0 "Casa de Contratación"
 ibe_sixth_desc:0 "The Casa de Contratación or Casa de la Contratación de las Indias was established by the Kingdom of Iberia, in 1543 in the port of Seville as a crown agency for the Iberian Empire. It would help our blessed rulers manage our great colonial holdings."
 ibe_seventh:0 "Tercios Ibéricos"
 ibe_seventh_desc:0 "The Iberian tercio is an administrative unit nominally composed of up to 3,000 soldiers subdivided into 10 compañías, composed of pikemen and arquebusiers or musketeers. These companies are deployed in battle and are further subdivided into units of 30 soldiers. These smaller units can be deployed individually or brought together to form "Iberian squares". This allows our armies to be highly flexible and easily managed - just what we need when controlling an empire as large as ours."

