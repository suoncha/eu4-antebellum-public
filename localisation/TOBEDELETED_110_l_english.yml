# Events #
 ab_xbh_events.1.t: "Negotiating with the Makrami Family"
 ab_xbh_events.1.d: "ph"
 ab_xbh_events.1.a: "They should take control of administration"
 ab_xbh_events.1.b: "No one can beat them in commerce"
 ab_xbh_events.1.c: "The military could benefit from them"

 ab_xbh_events.3.t: "The Exilarch Returns"
 ab_xbh_events.3.d: "Finally, we have located the Exilarch, leader of Judaism in the Near East, in the city of Hamadan after having conquered their way through the Persian Heartland. Due to Exilarch being a direct descendant of the House of David, liberating his seat of power in Persia would have the potential to legitimize us as the rightful heirs of the Kingdom of Israel. With his support among the Persian Jewish community and great familiarity with the political idiosyncrasies of the region, however, also present the potential for finally establishing a sovereign Exilarchate as attempted by Mar-Zutra II many centuries ago."
 ab_xbh_events.3.a: "He shall serve as a ceremonial figure"
 ab_xbh_events.3.b: "We have no interest in Persia. Grant him control over the region"

 ab_xbh_events.4.t: "The Nagid of Egypt"
 ab_xbh_events.4.d: "ph"
 ab_xbh_events.4.a: "His skills shall serve the state well"
 ab_xbh_events.4.b: "He is more useful in Egypt"
 ab_xbh_events.4.c: "A prince needs a kingdom"

 ab_xbh_events.5.t: "Return to [379.GetName]"
 ab_xbh_events.5.d: "ph"
 ab_xbh_events.5.a: "[379.GetName] will be the capital of Jews once more"
 ab_xbh_events.5.b: "The seat of power stays in [Root.Capital.GetName]"

 ab_xbh_events.6.t: "Abandon the Tribal Ways"
 ab_xbh_events.6.d: "ph"
 ab_xbh_events.6.a: "From now on, Arabian Jews will be united under our banner"

