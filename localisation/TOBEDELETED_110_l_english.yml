 xbh_intolerance_tolerance_title: "[GetPreviewColorXBH_BRANCHING]Enforce the Covenant[GetPreviewColorXBH_BRANCHING_end]"
 xbh_intolerance_tolerance_desc: "ph"
 xbh_jewish_state_title: "[GetPreviewColorXBH_BRANCHING]A Jewish State[GetPreviewColorXBH_BRANCHING_end]"
 xbh_jewish_state_desc: "ph"
 xbh_revenge_moses_title: "[GetPreviewColorXBH_BRANCHING]Revenge of Moses[GetPreviewColorXBH_BRANCHING_end]"
 xbh_revenge_moses_desc: "ph"
 xbh_geonim_academy_title: "[GetPreviewColorXBH_BRANCHING]Geonim Academy[GetPreviewColorXBH_BRANCHING_end]"
 xbh_geonim_academy_desc: "The Geonim were the two presidents of the Talmudic academies of Babylonia under the Sassanian Empire. The academies were the most prominent centers of Jewish theological debate and Talmudic study for centuries, holding significant political and religious influence in the Near Eastern Jewish community for centuries. While the academies were left without leadership following the withdrawal of the Sassanids from Mesopotamia, we would be able to reopen the academies and utilize the reinstated office of the Geonim to serve a wide variety of political, religious, and academic functions."
 xbh_return_exilarch_title: "[GetPreviewColorXBH_BRANCHING]Return of the Exilarch[GetPreviewColorXBH_BRANCHING_end]"
 xbh_return_exilarch_desc: "The fragmentation of the Sassanid Empire has led to the Exilarch, the traditional leader of the Near East's Jewish community, being uprooted from his traditional homeland in Mesopotamia to the city of Hamadan in the Sassanian heartland. Due to Exilarch being a direct descendant of the House of David, liberating his seat of power in Persia would have the potential to legitimize us as the rightful heirs of the Kingdom of Israel."
 xbh_sharif_title: "[GetPreviewColorXBH_BRANCHING]The Jewish Sharif[GetPreviewColorXBH_BRANCHING_end]"
 xbh_sharif_desc: "The Quraysh would be eager to collaborate in our administration of Mecca and Medina if their autonomy was to be guaranteed."
 xbh_syncretism_title: "[GetPreviewColorXBH_BRANCHING]Abrahamic Syncretism[GetPreviewColorXBH_BRANCHING_end]"
 xbh_syncretism_desc: "The Jewish and Muslim faiths share significant similarities, sharing traditions of daily prayer, fasting, and charity in the name of Yahweh. If we allows Jewish and Muslim Arabs to live together in harmony, then the social distinction between these faiths shall gradually fade."
 xbh_sons_abraham_title: "[GetPreviewColorXBH_BRANCHING]Sons of Abraham[GetPreviewColorXBH_BRANCHING_end]"
 xbh_sons_abraham_desc: "A cosmopolitan Arabian state requires all peoples of the peninsula to be accepted with open arms. Only then may the tribalism and religious strife that has dominated the region for millenia be united as one people."
 xbh_muslim_court_title: "[GetPreviewColorXBH_BRANCHING]A Muslim Court[GetPreviewColorXBH_BRANCHING_end]"
 xbh_muslim_court_desc: "ph"
 xbh_reconcile_saracens_title: "[GetPreviewColorXBH_BRANCHING]Reconcile with the Saracens[GetPreviewColorXBH_BRANCHING_end]"
 xbh_reconcile_saracens_desc: "ph" 
 xbh_convert_bishah_title: "Convert Bishah"
 xbh_convert_bishah_desc: "Though the lands of Bishah remain nominally under the rule of Chorath, most of the tribes that roam its mountains remain outside of Chorathi governance and practice their own faith. To assert the sovereignty of the tribe, it is necessary to proselytize these wayward clans."
 xbh_revenge_hawazan_title: "Hawazani Payback"
 xbh_revenge_hawazan_desc: "ph"
 xbh_seize_madina_title: "Seize Madina"
 xbh_seize_madina_desc: "ph"
 xbh_defeat_sharif_title: "Defeat the Hashimids"
 xbh_defeat_sharif_desc: "ph"
 xbh_weaponsmithing_title: "Bladesmiths of Arabia"
 xbh_weaponsmithing_desc: "ph"
 xbh_kingdom_chorath_title: "Kingdom of Chorath"
 xbh_kingdom_chorath_desc: "ph"
 xbh_revise_madina_title: "Revise Madina Constitution"
 xbh_revise_madina_desc: "ph"
 xbh_northern_frontier_title: "The Northern Frontier"
 xbh_northern_frontier_desc: "As we gain prominence in Hejaz, the Nizzarid sultan looks upon the lands of Arabia with greedy eyes. While the Chorathi will one day need to raise their swords against these Egyptians to reclaim Yehuda, for now we must focus on securing the routes into Arabia to deter a potential invasion."
 xbh_children_east_title: "Children of the East"
 xbh_children_east_desc: "The Mosaic people can no longer claim to be the majority in the territory they rule, now a melting pot of Hejazi, Bedouin, Mahri and Yemeni clans. Representing all manner of peoples from Arabia, the Bnei Chorath shall be known as Bnei Kedem. Meaning 'Children of the East', such was the name given to the Arabians by our Hebrew ancestors."
 xbh_towards_arabia_title: "Towards a Mosaic Arabia"
 xbh_towards_arabia_desc: "ph"
 xbh_jerusalem_title: "Hear, O Israel"
 xbh_jerusalem_desc: "From the Bnei Chorath's struggle for independence to the Bnei Kedem's unification of Arabia, the dream of Mosaic people has always been to one day reclaim Yehuda. The city has seen nothing but war in the past centuries, with the Christians and Muslims fighting in vain to shape the city in their own image instead of seeing it for its true ancient glory. Hear, O Israel, so that you may prosper and multiply greatly in a land flowing with milk and honey, just as the Lord has promised you."
 xbh_regain_independence_title: "Regain Independence"
 xbh_regain_independence_desc: "ph"
 xbh_recover_capital_title: "Recover the Old Capital"
 xbh_recover_capital_desc: "The Bnei Chorath were not always forced to subsist in the harsh mountains of Bishah. We once ruling from our stronghold in Najran and ushering the city into a period of prosperity. After becoming free from the Muslim shackle, the Chorathi tribesmen must take the fight to Najran and reclaim the ancient capital of our forefathers."
 xbh_makrami_title: "Makrami Negotiations"
 xbh_makrami_desc: "Little remains of the capital once known to the Bnei Chorath since Saracens claimed it as their own. The siege of the city has only left the city further damaged. Restoring the old capital to its former glory would be time-consuming, but less so with the help of the influential Makrami family who had served us in the past. Their control over the city's clans, finances, and administration can be used for a wide variety of purposes."
 xbh_tihama_title: "Across the Tihama"
 xbh_tihama_desc: "While the Bnei Chorath have traditionally stayed within the mountainous inland regions of Yemen, occupying the coastline along Bab el Mandeb offers an opportunity for us to benefit from the Gulf's prosperous coastal trade."
 xbh_yemeni_heartland_title: "Yemeni Heartland"
 xbh_yemeni_heartland_desc: "ph"
 xbh_himyarite_legacy_title: "Legacy of the Himyarites"
 xbh_himyarite_legacy_desc: "The Bnei Chorath once dreamed of forging a Mosaic state as mighty as the Himyarite Empire of old. With Yemen under Chorathi control and our people more powerful that ever, few can deny us claiming the legacy of the Himyarites."
 xbh_revive_najran_cloth_title: "Revive Silk Industry"
 xbh_revive_najran_cloth_desc: "ph"
 xbh_goldsmithing_title: "Goldsmiths of Chorath"
 xbh_goldsmithing_desc: "Goldsmithing has long been the profession of choice for the Chorathi, with the artisans drawing from centuries of metalworking tradition. Though the lands of Asir have never been bountiful in gold deposits, the Bnei Chorath have long made do with what was found. Over the decades, however, the conflict that has marred the region has left these deposits consumed by the lands and lost to our artisans. If Bishah was to experience a new age of prosperity and production, however, new gold deposits may be found and the ornaments of Mosaic master goldsmiths may be found throughout Arabia once more."
 xbh_legacy_of_benjamin_title: "Adventures of Benjamin"
 xbh_legacy_of_benjamin_desc: "Benjamin of Tudela was a Jewish explorer who traveled far and wide, having long ago regaled Arabia with tales of other Jewish communities living in the far reaches of the world. Many still remember these old tales, and desire to emulate his travels while documenting those sons of Moses who make their home far from Arabia."
 xbh_kochin_title: "Tales of Kochinim"
 xbh_kochin_desc: "Our explorers' travels in India have revealed the existence of a longstanding Jewish community in the city of Kochin. According to them their religious community is ancient, perhaps even older than that of the Chorathi, dating back to the days of King Solomon. Their culture displays a significant degree of syncretism with Hindu traditions, likely due to their centuries of gradual integration into Cochinite society. While they would do well to be brought into the fold, we could benefit deeply from their syncretic traditions."
 xbh_aksumites_title: "Advance on the Aksumites"
 xbh_aksumites_desc: "ph"
