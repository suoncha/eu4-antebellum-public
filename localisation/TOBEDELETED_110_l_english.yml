# Missions #
 naz_unify_islam_locked_title: "Timed Mission"
 naz_unify_islam_locked_desc: "You can unlock this mission by completing the '§YLiberate Al-Quds§!' mission before the year §Y1455§!."
 naz_unify_islam_mission_title: "Lead the Ummah"
 naz_unify_islam_mission_desc: "Since the Mongol invasion, we were holders of the Abbasid Caliphate. As the bane of the Crusaders, the protectors of the Hajj Pilgrims and defenders of the faithful, it is clear our future lies as the Caliphs of Islam. The Ummayads in Quturbah have long strayed from the faithful path, and their humiliation at our hands has demonstrated them unfit to lead the Muslim world."
 naz_puppet_caliph_mission_title: "The Puppet Caliph"
 naz_puppet_caliph_mission_desc: "The Gilded Cage holding the puppet Caliph in Qahirah has always brough religious believers to the area. Without intervention, the growth of Cairo will inevitably lead to our puppet gaining political power that will break the chains that hold him. We must ensure our own capital does not loose to the splendour of Qahirah!"
 naz_change_in_legitimacy_title: "A Change in Legitimacy"
 naz_change_in_legitimacy_desc: "Despite the Nizzarid legacy brought about by a military coup, our Islamic brethren have never felt our strength to be capable of protecting pilgrims and the like. With sufficient focus on strengthening the administrative and military capabilities of our nation, perhaps they will have as much faith in God as they will in us."
 naz_return_abbasids_title: "Return of the Abbasids"
 naz_return_abbasids_desc: "The Caliph has and will remain the guiding light of Islam, and will be forever under our protection. Those flocking to his name have ensured Qahirah has exploded in growth in recent decades, and it would be remiss of us not to accept this gracious opportunity."
 naz_second_islamic_age_title: "Second Islamic Golden Age"
 naz_second_islamic_age_desc: "The first Islamic Golden Age was like a candle that burnt twice as bright, but only half as long. The incredible leaps Islam made during that time ensured an unrivalled sense of prosperity. The ruination of the Golden Age thus destroyed the Caliphal authority in Baghdad, which we have restored in Qahirah. It is time for us to bring a second Islamic Golden Age - unbidden, illustrious, eternal."
 naz_abbasid_caliphate_title: "The One True Caliphate"
 naz_abbasid_caliphate_desc: "Our prestige and might, ingenuity and golden opulence in the eyes of the world, will surely lead to our great nation being dubbed the dominator of our era and the most illustrious of this time. For centuries the world of Islam has remained shattered and in pieces. Our weakness has been exploited by external powers and divided we shall fall. It is up to our great armies to unite the Islamic world under the banner of the One True Caliph!"
 naz_claim_pirate_coast_title: "Claim the Pirate Coast"
 naz_claim_pirate_coast_desc: "The Hormuz Strait holds incredible strategic value for those with interests in travelling east. A natural choke point and staging point, Hormuz itself is also home to one of Asia's few sources of precious gems. There are very few reasons for us not to claim the Pirate Coast."
 naz_continential_blockade_title: "Control Indian Ports"
 naz_continential_blockade_desc: "The Silk Road launched centuries ago first introduced the knowledge of India to the Islamic world. An enormous landmass and amalgamation of cultures, the number of unique exports is a lucrative market with little cost for us. We should blockade the continent from other prying hands and keep this market to ourselves!"
 naz_saracen_fleet_title: "Nizzarid Warfleet"
 naz_saracen_fleet_desc: "The swift conquest of the Egypt and the Syrian Mashriq has ensured that our military focus has always been on ground troops. As a result, the malignant crusaders with their puppet masters in Italy have reigned terror on our shores. We must swiftly rectify this!"
 naz_integrate_bedouins_title: "Nomadic Brothers"
 naz_integrate_bedouins_desc: "Our nomadic brothers in the Arabian peninsula have worked with us countless times in the past. Without their desert warfare expertise, we would not have grown to this extent in such a short time. With the growing threat of the Mongol remnants and Persian expansionism, it may be high time for our Bedouin brothers to be integrated into our cadre."
 naz_hashshashin_title: "The Hashashin Order"
 naz_hashshashin_desc: "The ancient Hashashin Order has been around since the first Christian crusades, taking advantage of the political and religious strife in Mesopotamia to swell both numbers and coffers. To this day, they reside somewhere along the Syrian coast, shrouded in mystique. If we take the effort to contact them, they may be willing to come under our employ... for a price, of course."
 naz_saharan_expedition_title: "Saharan Expedition"
 naz_saharan_expedition_desc: "The narrow routes from the Maghreb have been used by the regional tribes for centuries in order to travel south towards central Africa. Without these routes, our people may be forever lost to the sands of time. The oases along these routes will provide safe harbour and travel. As such, it is imperative we gain footholds in the gateways through the Saharan desert."
 naz_unite_archipelago_title: "Unite the Archipelago"
 naz_unite_archipelago_desc: "After successfully establishing several bases of operations on the islands in the archipelago, our diplomats have been able to begin peaceful communications with the locals. They have realised that these lands are a scattering of hundreds of different interests that can we can manipulate off each other, in order to provide the best opportunities for us to take over with superior administrative control."
 naz_east_egypt_ocean_title: "Hegemon of the Waves"
 naz_east_egypt_ocean_desc: "From humble beginnings as an inspiring military general, the empire built by the Nizzarid dynasty spans from one side of the ocean to the other, filled with an armada of merchant and war ships alike. This ocean is ours, and all the world belong to us. We are hegemon, and we are unrivalled in the world!"
 naz_madagascar_title: "Slave Trade Monopoly"
 naz_madagascar_desc: "The eastern coastline of Africa is notorious for the slave trade, but thus dominated by the Malagasay native population. With our unrelenting growth of population and industry alike, we will need all the hands we can get to support our cause. If this help comes from less than savoury sources, then so be it."
 naz_australia_title: "Dominion of Jabalqaf"
 naz_australia_desc: "Prayers and scholars alike have long spoke of the Jabal-Qaf, a mysterious emerald mountain on the far edges of the world. While there are few mountains to be seen, but small deposits of emeralds scattered across the red sands indeed, this dominion, far from all else in the world, may be the land that was once only myth."
 naz_father_rivers_title: "Father of African Rivers"
 naz_father_rivers_desc: "The Nile river has been the lifeblood of every Egyptian dynasty for an unbroken chain of millennia. Despite all the hardships, the people of this land have always survived as long as they remained along the father of African rivers. Nizzar's adopting of pan-Egyptian Pharaonic policies was a masterstroke and has allowed our population to swell. We must support this new population in order to bring the best benefits!"
 naz_coptic_question_title: "The Coptic Question"
 naz_coptic_question_desc: "The founder of our nation, Nizzar the Great himself, was of Masri and Coptic descent. Thus, the Coptic population in our lands have always been given as much respect as our Islamic brothers. As tensions rise within the clerical ranks over ideology, their autonomy will need to be brought up for discussion once more."
 naz_goods_arabia_title: "Goods of Arabia"
 naz_goods_arabia_desc: "The Arabian peninsula's unique coastal desert environment has allowed several unique goods to be monopolised, namely coffee and incense. With our firm control over the market for these goods, even a slight investment will provide permanent gains for the foreseeable future."
 naz_subjugate_horn_title: "Rule the Horn"
 naz_subjugate_horn_desc: "The Horn of Africa is home to many of our brothers, if not in faith, then in Nizzar's Coptic legacy. The Nile tributaries snaking along the spine of the Horn is another reason we must subjugate the region - complete control of the Nile will be an unprecedented achievement that will never be overcome!"
 naz_thousand_minarets_title: "A Thousand Minarets"
 naz_thousand_minarets_desc: "Qahirah, if not the spiritual heart of Islam, is certainly its geographical heart. Most Islamic people have passed through the land of a thousand minarets and witnessed our unending faith. The brilliance of Islamic architecture likely can only be matched by the finest garments."
 naz_kashifs_egypt_title: "Kashifs of Egypt"
 naz_kashifs_egypt_desc: "The Nizzarid realm is an expansive range of lands, from the desert oases in our homeland, to the bustling dryland cities of the Mashriq and the Levant. Without proper administration to oversee the furthest reaches, the kingdom will be susceptible to corruption and strife. Our Kashifs, directly reporting to the Nizzarid sovereign, will affirm our rule and ensure everything is developing according to plan."
 naz_ivory_trade_title: "White Gold of Africa"
 naz_ivory_trade_desc: "The south-eastern coastline of Africa is home to one of the largest concentration of elephants on Earth. While they make for excellent war mounts, their ivory tusks are also worth their weight in gold. Their intrinsic white colour means it is widely used for artistic carvings and recreation. Historical ivory trade only ended because elephants were hunted to extinction. Let us restart the ivory trade and reap the profits..."
 naz_university_cairo_title: "Dar al-Hadith Turba"
 naz_university_cairo_desc: "Education is a vital endeavour for any state who seek to enlighten their people. It is our responsibility to ensure we provide the highest quality of education available to any who seek it!"
 naz_waqf_assignment_title: "Assign a Waqf"
 naz_waqf_assignment_desc: "While we are fortunate to have amassed an innumerable wealth from profitable ventures and successful administration, we should never leave behind those less fortunate. The assignment of waqfs "
 naz_caliphate_title: "Nizzarid Caliphate"
 naz_caliphate_desc: "In ages past, our predecessors trapped the Caliph in Qahirah, never to leave its confines. The damage to the authority of the caliphs, much like our reputation with the Islamic world, was already done. In that situation, it was only natural that the Umayyads would claim the mantle. With the capture of the Quturba, we brought into the question the legitimacy of this Andalusian Caliph. The true caliph in our Gilded Cage can no longer deny our claim as the defender and leader of Islam; its future is in our hands." #TODO: can lead to 3 outcomes: 1. disband the Abbasids, 2. legitimize the status of Abbasids, 3. status quo
 naz_baghdad_title: "The Last of the Mongols"
 naz_baghdad_desc: "The vestiges of the Mongol usurpers reigns over Baghdad. A symbol of Islamic humiliation at the hands of the steppe terrors, the Jalayirid have the gall to join the ranks of the faithful and call us their brethren. We cannot stand for this insult! We must extinguish their hope, torch their castles and plunder their wealth! Return the favour twice over!"
 naz_wisdom_title: "Rebuild Bayt Al-Hikmah"
 naz_wisdom_desc: "The lifeblood of Islamic enlightenment in Baghdad, the Bayt Al-Hikmah was once a glorious hallmark of the accumulation of several centuries of knowledge. The torching of Baghdad in the madness of Mongol fratricide paralysed Islamic innovation and forward thinking even to this day. If we are to be successful in leading Islam to a better future, we will need to invest in restoring its status."
 naz_defeat_arslan_title: "Defeat the Seljuks"
 naz_defeat_arslan_desc: "Surrounded by rotting empires standing, the Exarchate of Nicaea has been reluctant to shed its defensive inclinations. Already disillusioned by the Byzantine internal rot, the fracture of Anatolian rule has ensured two powers hold power east of the Hellespont. Of the two northern threats, the Arslan kingdom is of a much more aggressive nature. Let us eradicate them, and put down these rebel scum!"
 naz_khaldunids_title: "Khaldunid Intervention"
 naz_khaldunids_desc: "The Khaldunid kingdom has been engaged in a relentless deadlock with the Tunisian Sultanate, with the Sicilians focused on their northern flank. Their border raids have wrough havoc on our desert caravans. We need to intervene in this matter before they can do any further harm!"
 naz_tunis_title: "Subjugate the Hafsids"
 naz_tunis_desc: "The Hafsid realm has remained stagnant, ever since the split of the realm just a century prior. Without the wealth brought from Italian trade, nor the visitors at caravanserai from the east, the Tunisian lands are easy pickings for subjugation."
 naz_almohads_title: "Almohad Conquest"
 naz_almohads_desc: "The Almohad state is a rotting carcass of a once impressive empire of North Africa. Without sagacious advisory nor prudent diplomacy, they now lie sandwiched between our emerging empire, and their rival Umayyads. Before we finally finish off the false Caliphs, we should ensure these remnants do not dare press the claims their respectable ancestors once did."
 naz_sulayhids_title: "Destroy the Sulayhids"
 naz_sulayhids_desc: "The Sulayhid menace is a threat to all Sunnis. Nestled in the mountainous coastline of the Red Sea, their relentless zealotry has ensured an influx of Sunni faithful into our lands. Their incredible intolerance for heresy will ensure permanent hostilities between our peoples. We must destroy them, and ensure the protection of our brethren!"
 naz_presence_in_india_title: "Presence in Al-Hind"
 naz_presence_in_india_desc: "Islam has made little impact on the Indian subcontinent. One could imagine if the Rashidun expanse successfully penetrated the Zagreb mountains, there could have been a much larger Muslim presence. We must first introduce our wares, and spark their curiosity. With a little enticement, our presence could grow immensely."
 naz_spice_title: "Reach the Spice Isles"
 naz_spice_desc: "The dominance of coffee and incense in our markets have motivated our local traders to venture further out, across the seas in search of similar goods. The prevalence of herbs and spices along the Indonesian archipelago has alerted them to a potential new market monopoly. The local population in Indonesia will likely be reluctant to simply hand over such lucrative goods, so we may need to use a little... force."
 naz_hashimids_title: "Children of the Prophet"
 naz_hashimids_desc: "The Hashimid dynasty are the only nation in the Islamic world that can truly claim to be children of the Prophet. Descendants of Caliph Husan, they are the last legitimate claimant to Caliphal rule. We must ensure they are kept under heel and follow our wishes."
 naz_employ_sicilians_title: "Employ the Sicilians"
 naz_employ_sicilians_desc: "The Sicilians have wrought insoluble fear and terror  into the Italian hearts, so much so that the statelets have all refused to leave the Holy Roman Empire, despite their avowed hatred of the Emperor. It would be an ingenious move to hire the Sicilians we recently fought, both to reconcile our differences, but also to weaken those who we may conquer next."

