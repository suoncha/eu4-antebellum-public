# Ideas #
 XBH_ideas: "Chorathi Ideas"
 XBH_ideas_start: "Chorathi Traditions"
 XBH_ideas_bonus: "Chorathi Ambition"
 XBH1: "Shrewd Diplomacy"
 XBH1_desc: "ph"
 XBH2: "Mosaic Artisans"
 XBH2_desc: "ph"
 XBH3: "Epistle to Yemen"
 XBH3_desc: "When facing religious strife and persecution resulting from a heretical self-proclaimed messiah, the Jews of Yemen sent a letter to Maimonides, a famed Egyptian Torah scholar beloved Arabia's Jewish tribes. The response of Maimonides' spoke against the heretic but nonetheless advocated for respect and tolerance, shaping the tolerant attitude of the Bnei Chorath ever since."
 XBH4: "Memories of the Bnei Qurayza"
 XBH4_desc: "The Chorathi have long been the last of the sovereign Jewish tribes of Arabia, with most of the original families being exiled from their seats of power after conflicts with the Muslim tribes. The Bnei Qurayza faced the worst fate of them all, with their surrender leading to every Qurayza man beheaded and the rest enslaved. The Bnei Chorath know that to surrender means death, and are resolute in fighting their wars to the very end."
 XBH5: "Chorathi Goldsmiths"
 XBH5_desc: "Goldsmithing and metalworking has long been the profession of choice for the Chorathi, with the artisans drawing from centuries of tradition. With gold rarely being found in large amounts in Arabia, Chorathi goldsmiths have learned to hone their craft preserving as much of the metal as possible."
 XBH6: "Heritage of the Ten Tribes"
 XBH6_desc: "Unlike the other Jewish tribes of Arabia, the Bnei Chorath claim direct heritage from the ten lost tribes of Israel and place great value on this birthright."
 XBH7: "Benjamin of Tudela"
 XBH7_desc: "Benjamin of Tudela was a Jewish explorer who traveled far and wide, having long ago regaled the $COUNTRY$ with tales of other Jewish communities living in the far reaches of the world. Many still remember these old tales, and desire to emulate his travels while documenting those sons of Moses who make their home far from Arabia."

