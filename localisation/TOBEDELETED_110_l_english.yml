# Ideas #
 QRM_ideas: "Qarmatian ideas"
 QRM_ideas_start: "Qarmatian Traditions"
 QRM_ideas_bonus: "Qarmatian Ambition"
 qrm_first: "The Qarmatian Revolution"
 qrm_first_desc: "In the 10th Century, during the rise of the Ismaili Shiite groups, our faction of true believers split off from the mainstream group and chose to follow a militant, millenarian faction called the Qarmati. We were truly feared in those days; we razed Mecca, sacked Baghdad, and was a scourge of the heretics and unbelievers alike. We tried to show them the true path to paradise in the past, but we were rejected. They chose to continue in their path towards debauchery and false truths. We have learned from our mistakes; we will not give them the opportunity to refuse our path."
 qrm_second: "First Among Equals"
 qrm_second_desc: "Our revolution preached for equality among the free men, and thus we shall practice it as such. Our ruler is not a dictator, he is not an autocrat. He guides with our blessing, as an equal partner among the Jannabi peoples. While he might command the army, and while he might command respect, he does not command our hearts and our minds. We are a fair and balanced state, with all having equal rights underneath the law."
 qrm_third: "A Peculiar Economy"
 qrm_third_desc: "We are a society of equity, ruled by a family of equals. Our economy, however, is completely reliant on enslaved labor. The Zanj, taken from the Swahili coast and India, work and toil in our fields and serve and support in the palaces. Through them, we have managed to eliminate taxes entirely within our realm, relying purely on their labor for state finances. Without their labor, we would not be nearly as powerful as we are today."
 qrm_fourth: "Legacy of Abu Sa'id al-Jannabi"
 qrm_fourth_desc: "Our history is defined by a series of raids and attacks on our rivals. We are raiders - that is our primary method of warfare. Abu Sa’id knew this, and utilized it to great advantage when he sacked and burnt much of the Abbasid realms in Iraq and Egypt. We shall continue in that trend, defending our lands and attacking foreign forts with our mighty cavalry!"
 qrm_fifth: "The Bedouin Conflicts"
 qrm_fifth_desc: "The Bedouin nomads of inner Arabia have long since fought with us over control of the dunes and oases settlements. If we are to break into not only the pilgrimage routes but also secure our domination over the trade routes of Arabia, we cannot allow them to dominate the interior. We shall marshal our fiercest cavalry men to break their camps and force them to submit to our will."
 qrm_sixth: "The Search for the Mahdi"
 qrm_sixth_desc: "Upon the death of Isfahani Mahdi, many had a crisis of faith. He was supposed to be the herald of the end of days, of the dawn of a glorious new era and time of peace. But when he met his end at the sharp end of a blade, we knew him to be nothing more than a conman. Some doubted that the Mahdi would ever appear, and a small few even abandoned the revolution over such disappointment. But we still believe him to be coming. Those that remain loyal, those that remain true to their faith, they know the Mahdi will arrive, and when he does, we shall be his herald, leading the world into a new and beautiful age."
 qrm_seventh: "The Slave Ships"
 qrm_seventh_desc: "As our influence grows to combat that of Oman, Yemen, and the Iranian Kuffars, we have the need for a mighty navy. Our slave galleys sail alongside our trade vessels, guarding them from pirate attacks and the like. From Aceh to Zanzibar, we shall rule the entirety of the Indian Ocean!"

# Estates #
 ab_estate_burghers_qarmatian_missions: "Qarmatian Trade Missions"
 ab_estate_burghers_qarmatian_missions_desc: "Our merchants often spread Islam more directly than other colonial enterprises."
