# Decisions #
 rename_andalusia_to_umayyads_title: "Restore the Umayyad Glory"
 rename_andalusia_to_umayyads_desc: "As most of the lands that were historically controlled by our dynasty are back in under our suzerainty, we shall abandon the name of Al-Andalus and march forward under the banner of the Umayyads!"

# Events #
 ab_andalusia.1.t: "Iberia Secured"
 ab_andalusia.1.d: "For too long the petty Christian kingdoms in the north resisted our rule, but now that we have crushed their armies and melted their crowns, our grip on these lands is tighter than ever. With the Andalusian region consolidated, it is time to avenge our fallen brothers-in-arms in the several wars we have fought by taking the fight to the Franks. Furthermore, the opportunity to restore our rule in the Maghreb has opened itself. We shall not let this go to waste!"
 ab_andalusia.1.a: "The crescent rules over Iberia!"
 ab_andalusia.2.t: "Reconquest of Maghreb"
 ab_andalusia.2.d: "In the 7th and early 8th centuries the Maghreb was conquered by the Ummayad Caliphate, although after the collapse of the dynasty in Damascus the region was split between many Emirates. That ends now, for we have reclaimed these lands and the road to Egypt lies clear!"
 ab_andalusia.2.a: "Nothing shall stand in our way!"
 ab_andalusia.3.t: "Reclamation of Egypt"
 ab_andalusia.3.d: "The ancient land of Egypt is one of the most prosperous and important regions in the Islamic world. Conquered by the Rashidun Caliphate by 646, it switched hands between many different realms throughout the years after their collapse. The latest of these was the perfidious Nizzarid Sultanate, but now we have crushed their armies and forced any meaningful resistance into the Levant. Egypt has been secured again, and the road to the Fertile Crescent and its Holy Cities lies clear!"
 ab_andalusia.3.a: "Nothing will stop us now!"
 ab_andalusia.4.t: "The Holy Cities"
 ab_andalusia.4.d: "After our victories in the Sinai peninsula we have restored our Custodianship over the Great cities of Mecca, Medina and Jerusalem. The Nizzarid pretenders are all but destroyed!"
 ab_andalusia.4.a: "None shall question our legitimacy!"
 ab_andalusia.5.t: "Fall of Alexandria"
 ab_andalusia.5.d: "The capital of the Nizzarid Sultanate is often considered to be one of the pearls of the Islamic world, though a city built by Greek pagans and maintained by the infidels infesting that corrupt Nizzarid court is hardly deserving of such accolades. While the prosperity of Alexandria is undeniable, the entire system propping it up is morally corrupt; little can be observed beyond blatant idolatry and worship of foreign customs. The most noteworthy sights, worshipped by the Grecophilic sultans, are of course the Great Lighthouse - damaged extensively by earthquakes - and the tomb of the legendary conqueror Alexander. While not inherently wrong to honour feats as great as his, the unmasked worship of a mere man’s remains is grossly out of line, no matter their legacy. The most hardline among the Umayyad ranks are calling for the total destruction of this so-called “Soma”, as well as the tearing down of the decaying lighthouse. They argue that, as well as destroying the heart of decadence in the Near East, the salvaged masonry can be used in far grander projects elsewhere in the realm. Of course, opposition has flared up. While agreeing that idolatry and the cult of Alexander are unacceptable, they believe that the mausoleum can simply be sealed up, ideally with iconography masked through renovations. They also make a case that, while expensive to repair, the Lighthouse of Alexandria could maintain an air of prestige and culture among the court whilst also protecting sea routes."
 ab_andalusia.5.a: "This decadence has no place in the Caliphate!"
 ab_andalusia.5.b: "Calmer heads have once more prevailed"
 ab_andalusia.6.t: "Fall of Constantinople"
 ab_andalusia.6.d: "Constantinople; the City of the World’s Desire. One of the most prosperous and sprawling cities in the world, and also one of the most well-fortified. For a thousand years the mighty jewel of the East stood proudly, for the most part unscathed by enemy invasion. That was, at least, until our forces overwhelmed the city’s defences and breached the Theodosian Walls. Following a desperate last stand by the Palace Guard, in which the garrison commander reportedly fell in combat, the few remaining defenders have been isolated into small pockets or otherwise dispersed. Though some looting has already occurred - mostly in the residential districts - the palace and merchant districts are still mostly untouched. The question posed to us now is how the occupation of the former Byzantine capital should proceed. While sacking the city for all it’s worth can certainly provide a significant portion of loot and marble, any damage to the Hagia Sophia or imperial tombs will undoubtedly make us many perpetual enemies, not to mention greatly infuriate the already-upset population. On the other hand, though the army certainly won’t be happy about this, we can try and forge a merciful image by merely repurposing the great wonders of this city - at a price, of course."
 ab_andalusia.6.a: "The Caliph wept at the sight..."
 ab_andalusia.6.b: "No, let this madness stop here!"
 ab_andalusia.7.t: "Fall of Paris"
 ab_andalusia.7.d: "Superstitiously considered the source of most woes in the Umayyad Caliphate, the realm of Francia was the longest-lasting rival within the Christian sphere, matched in longevity by solely the Abbasid puppet-Caliphs, but in tenacity by none. The French Menace is a threat no more, having been driven out of even its own capital. Paris’ fall came as a shock to only those aloof aristocrats in Central Europe, for the writing was on the wall that the time of the dastardly Frenchmen had come to an end the moment they lost Aquitaine. As jubilant Muslim soldiers parade around the cobbled streets, clergymen and nobles alike hurriedly prepare their flight to safety elsewhere in the world. The commoners aren’t as lucky, instead being forced to scrape together as much wealth as they can in order to pay for safe passage outside the city walls, only to be turned back around and marched home, for a fully depopulated city is the last thing the Caliphate needs. While no open hostilities had occurred in large scale after the defenders’ surrender, and conduct between forces was largely cordial, there is talk among the occupation force that small bands of militiamen are raiding Muslim caravans and ambushing small guard patrols. Whether these rumours are true or not, it is safe to assume that the people of Paris will be unreceptive to more than basic cooperation for the foreseeable future. The now-dethroned King of Francia has also sworn to avenge these losses, although it is unlikely that such a dream could ever become a reality. Dissent aside, though, the Caliphate rejoices at the greatest blow that could ever be dealt to Western Europe, short of sacking the city of Rome. It has become clear to the greatest extent that Francia will be buried beneath the sands of time, like the Romans they had so desperately tried to emulate, by a superior foe."
 ab_andalusia.7.a: "Francia has fallen, so remember me!"
 ab_andalusia.8.t: "Fate of the Abassid Caliph"
 ab_andalusia.8.d: "With the fall of Cairo to the Umayyad Caliphate, the last major threat against Islamic stability has been rooted out and destroyed. Although it is widely accepted that the Umayyads are the rightful, sole Caliphs, the treasonous vipers in the Nizzarid Sultanate thought otherwise. Whether attempting to usurp or subvert Andalusian legitimacy and power, the Abbasid charlatans - rescued from Mongol destruction - were propped up as puppet-Caliphs in the city of Cairo. From this gilded cage, at the behest of their wicked masters, innumerable instances of foul rumours and intrigue spilled outwards and across the Near East and Africa to defame the true Caliph’s standing. After what seems like an eternity of degradation at the hands of upstart pretenders, it is only fitting that the Abbasid scion - now in Umayyad custody, having been abandoned by his own kin - shall face punishment for his crimes and those of his forebears."
 ab_andalusia.8.a: "May this fate befall all traitors!"
 ab_andalusia.9.t: "Fall of Rome"
 ab_andalusia.9.d: "The Eternal City, Rome, has fallen to the overwhelming might of the Umayyad Caliphate. A beacon of hope for Catholicism amidst a sea of heathens and feudal squabbles, there are few honours greater than being in control of the Papal heartland. Now, though, all is lost. The Holy See has been decisively and efficiently crushed in battle, and was unable to save its seat. With only the city garrison and Papal guards still standing watch, the walls were easily overwhelmed and only small skirmishes could be maintained in the streets. Unlike the militias, the Swiss Guard fought bravely and to the last man, holding the Vatican’s chokepoints so the Pope could make his escape, and will likely be seen as martyrs - even earning the respect of their Muslim foes. With the population either fleeing or seeking refuge atop the Capitoline Hill, it is only a matter of time until the city is pacified. As no serious threat remains, there is one major issue which will directly impact the city’s fate. That is, what is to be done with the Vatican - the nucleus of Catholicism? A strong call has been made to destroy Saint Peter’s Basilica and the bones of the eponymous Apostle which lay within; a message that resistance shall not be tolerated. Others would argue that the marvels of the Holy See should be preserved, as a show of good will to the ever-crumbling Catholic faithful. Surely the former would strike fear into the ailing heart that is Western Christendom, though the latter will undoubtedly make the infidel more compliant to Umayyad rule in the future."
 ab_andalusia.9.a: "Suffer not the infidel scum!"
 ab_andalusia.9.b: "Let this madness end!"
 ab_andalusia.10.t: "The Valencian Centenary"
 ab_andalusia.10.d: "It seems so strange that an event as widely remembered as the Battle of Valencia occurred so long ago. 100 years have passed since the decisive battle, in which Caliph Muhammed VII led his forces to battle so they could relieve the besieged garrison, ultimately bringing the Andalusian Crusade to an abrupt halt. Victory was not expected, despite the Christians being outnumbered and in a poor position relative to the Umayyads - the clash itself was proof of this. Putting up fierce resistance for many hours, it was only when the cunning garrison commander within the City of Valencia sallied forth - catching the Catholics off guard - that the tide turned. When our valiant forces isolated much of the army into pockets, even cutting down the crusading Emperor and Crown Prince amidst the chaos, it was as if Allah himself had witnessed the righteousness of the Umayyad cause. Though begrudgingly, even the Christians had to admit the Caliph was magnanimous enough to prevent a pursuit of the fleeing infidel, but the scars run deep. Addressing the crowds within Valencia, the current Caliph and the victorious commanders’ descendants commemorate those who fell in the battle, praising their sacrifice. Swearing that the Centenaries of this bloody day shall forever be occasions of mourning and remembrance, the occasion is ended with the firing of a bombard and a victory parade through the city’s streets and out to the memorial monument. The promises that such needless bloodshed shall never happen again on Umayyad soil are well-received by those assembled, though time will tell if the Caliph can keep his word."
 ab_andalusia.10.a: "May this day usher in peace"
 ab_andalusia.11.t: "The Valencian Centenary"
 ab_andalusia.11.d: "While much of the Umayyad realm is subject to rapid change, and conflict continues to strike across the borderlands as the Caliphate grows, the Centenary of the Battle of Valencia is a day which unites the people of Andalusia. Although the commemorative monument is weather-worn and the road to it well-trod, the memory of an event which hasn’t affected anybody alive at this time is burning as brightly as ever. The remembrance ceremony is held in the same manner as the first Centenary, even finishing with a bombard salute and victory parade to the memorial, but the crowds are nonetheless captivated as their forefathers were. Promises of an end to conflict are absorbed and applauded - even if not likely to come true - and as the next day begins, everything returns to the status quo."
 ab_andalusia.11.a: "A fleeting peace..."
 ab_andalusia.12.t: "The New World Awaits"
 ab_andalusia.12.d: "As commerce from the Silk Road has been cut off by the perfidious Nizzarid dynasty in the Near East, and those infidels in Europe refuse to do business with our merchants, it has been made clear that sooner or later our great Caliphate’s economy will begin to fail once again. While many would have liked to believe the civil war’s ramifications have been largely put behind us, rumours of a shortened route to the Orient have been swirling around the Caliph’s court in recent weeks. A large majority of the entrenched nobility and intellectuals reject such notions as pure folly, but there are a daring few who think there is a kernel of truth to such tall tales. One such individual has recently approached the Grand Vizier, seeking an audience with the Caliph himself in an effort to accrue funds for an expedition into the great unknown. It is a very risky endeavour, with no promise of success or reward, but in the off chance that his hunches are proven correct, the endeavours of this intrepid explorer shall certainly prove a great boon to our stagnating economy. The choice of whether or not we shall expand beyond our current horizons now lies in the hands of the Caliph. Whatever the decision, we hope it proves to be the wise one…"
 ab_andalusia.12.a: "Our future lies across the sea!"
 ab_andalusia.12.b: "This is nothing but folly and fraud!"
 ab_andalusia.13.t: "The Brothers War"
 ab_andalusia.13.d: "'Your Majesty, we are stabilizing the country and beating back the traitors, in a few weeks we will be able to rid our minds of the civil war.' - The briefing and reports he received were boring, the Caliph thought, he knew he was going to win just by strength of will alone. He didn't need or want to listen to his advisors rabble over petty issues each day, but it was his duty and destiny to do so. He continued listening: 'Other pretender army marches from the North, in hopes of capturing Majrit, our generals say that we are ready to intercept and destroy them. Should we do it or wait until we know they are alone?' Just as the Caliph was about to answer, the door of the room opened, a messenger who looked around with wary eyes, searching for the Caliph in the crowd of advisors and generals - he finally saw him and  bowed down in front of his ruler, then gave him the letter and left the room. The Caliph opened the letter and was shocked. 'Well?' one advisor said, 'What's the matter?' The Caliph started reading: 'Dear Brother, it is hard for me to do this. My heart won't bear to see you go down. But it is my duty! You have made more blunders than I can count! The people are sick of you, the nobility  hates you - you can't keep going like this. I do what I do with the best interests of the people in mind. Know this, dear brother, for when we meet again, be it on the battlefield or in your throne room.'  The Caliph was overwhelmed with emotion, but quickly composed himself  -  'More vermin are springing up from the woodwork.' - his final words before putting his brother's letter to the fire."
 ab_andalusia.13.a: "Your blood will be spilled, brother..."
 ab_andalusia.14.t: "Emir of Batalyaws Declares Independence"
 ab_andalusia.14.d: "Our war against the traitorous nobility has gone on longer than expected, raising concerns amongst the local governors and other notables still loyal to us. The destruction of state infrastructure has greatly affected their profit margins and sown further dissent throughout Andalusia’s lands. The Emir of Batalyaws has taken advantage of the chaos and become a turncoat to the Umayyad cause. Citing the indecisiveness of the Caliph in dealing with the rebellion, the treasonous whelp has established his own Taifa in the conflict. To make matters worse, the Emirs neighbouring Batalyaws have joined the Taifa – undoubtedly a sign of prior conspiracy against the Caliphate. Although a tremendous setback, with the blessing of Allah we will surely find victory, and see to it that these mongrels are put in their place."
 ab_andalusia.14.a: "Blighted traitors!"
 ab_andalusia.14.b: "Right now, there is nothing we can do..."
 ab_andalusia.15.t: "Balansiyah Declares Independence!"
 ab_andalusia.15.d: "Despite our best efforts, numerous rebellions still rock the country. The lengthy conflict has greatly devastated the lands of Andalusia, leading to concerns that the Caliphate may never fully recover if her enemies seize upon our moment of vulnerability. Perhaps a sign of further things to come, we have received unwelcome news that the governor of Balansiyah has formally seceded from the Umayyad Caliphate. A betrayal most cruel, this great hero of the war against the European Infidels was honoured throughout the realm. Bestowed accolades from monuments and coinage minted in his visage, to poems and plays, he dares spit in the face of the Caliph. Claiming grievances going as far back as lack of decisive action against the fleeing Christians at Balansiyah, the list is exhaustive yet laden with falsehoods. Amidst the turmoil already gripping the state, it seems now was merely the opportune time for the ingrate to twist his dagger. There is no doubt he has mustered an army in anticipation of our response, and our retribution will be all the bloodier because of it."
 ab_andalusia.15.a: "He will pay for his betrayal!"
 ab_andalusia.15.b: "Right now, there is nothing we can do..."
 ADU_DESTROY: "\nThe Soma and the Lighthouse of Alexandra will be §Rdestroyed§!."

 ab_andalusian_event.0.t: "On the Eve of Disaster"
 ab_andalusian_event.0.d: "The crippling defeat of the Crusaders at the Battle of Balansiyah should have firmly legitimised the Caliph’s rule in the eyes of those under him. The Holy Roman Empire was forced to come to the peace table and Andalusia was spared from foreign invasion once again. Unfortunately, the decision to allow the Imperial forces to flee in the aftermath of Balansiyah - and also to repatriate the vanquished Emperor’s and Crown Prince’s remains to Francia - proved grossly divisive. Atop the political grumblings, much of the northern countryside lies devastated. Massacred villages, sacked religious sites, and scorched farmlands have left the region impoverished and its people displaced. Furthermore, organised raids from the last Christian holdout realms into Andalusia have inflicted a vastly detrimental psychological effect on those both in and outside of city walls. Of course, the Caliph has done nothing to assist in the situation. He delegates and watches, but never intervenes. Disloyal elements within the realm have been long-entrenched, as with all states, and in these desperate times, they have begun to make their move. Reports from court agents have made it clear that the battle lines are being drawn, and the Iberian Peninsula shall soon find itself descending into anarchy unseen in years."
 ab_andalusian_event.0.a: "Only ruin lies ahead"
 ab_andalusian_event.1.t: "Andalusian Civil War"
 ab_andalusian_event.1.d: "Several factions, or tawa’if, have risen up in discontent against the Caliph, claiming to be the rightful succesors of the prophet, and that the coward Muhammad VII, who hides in Madinat az-Zahra, is clearly not of his blood, for no true caliph would let the people suffer in these ways. No doubt, christians in the frontiers will take advantage of this turmoil, try to break off and perhaps unite with their northern brothers in faith. The question is not only if the Caliph will withstand these tribulations, but in case he is defeated, will his succesors manage to keep the unity of the Caliphate? Will they surpass the might of the 700 years long standing might of the Umayyads?"
 ab_andalusian_event.1.a: "Alfitnat alkabira"
 ab_andalusian_event.2.t: "End of the Civil War"
 ab_andalusian_event.2.d: "In the dark times since Andalusia’s collapse, war had ravaged Iberia with little chance of subsiding. That is, of course, until recent offensives against the hostile splinter-states provided the final kick to the foundations which were so sorely needed. With much rebuilding to be done, it is clear now that further squabbles will ultimately undo all which had been built up before the Civil War. The north has been utterly ravaged by ceaseless raids and scorched earth, and the south also looks to be in its worst state in many a century. There is no point in allowing such wanton destruction now, thus Andalusia shall strive to rebuild itself and its seat of continental power while the Christians tear themselves asunder. Only then will Islam pounce once more, but until the nation has restored prosperity and security, that will be a long way off. There may be some benefit, of course, in looking out to distant shores while Europe burns itself to ashes. Regardless of what is to come, Andalusia has endured what may well have been the greatest existential threat directed towards it."
 ab_andalusian_event.2.a: "We have prevailed!"
 ab_andalusian_event.3.t: "Halil ibn Nusayr flees Andalusia"
 ab_andalusian_event.3.d: "News have reached the capital that Halil ibn Nusayr, a venerated veteran of the Andalusian Civil War and hero of the Battle of Balansiyah had assembled his loyal followers and fled the country from the port in Jabal Tariq. During the Crusade, Halil was very vocal about the incompetence of Andalusian military command and even Caliph himself, blaming them for the initial success of Imperial forces who swiftly occupied and devastated much of northern Iberia. Our spies report that Halil landed in Sebtah and possibly even sworn loyalty to Marinids of Morocco."
 ab_andalusian_event.3.a: "Blighted traitor!"
 ab_andalusian_event.4.t: "Castillian Famine"
 ab_andalusian_event.4.d: "The northern territories of the Iberian Peninsula have been hit hard by the recent Andalusian Crusade, as well as by raids from the Iberian Christian kingdoms under Frankish protection. Of all the areas reduced to ruin, none have been dealt as cruel a hand as the Castile region, which the Infidel thoroughly pillaged during their short-lived invasion. With the inaction of the Umayyad Caliph and subsequent outbreak of the Andalusian Civil War, the strain put on Castile’s food supply and production has proven too great for the farmers and merchants to bear. The surviving fields have been rendered non-arable due to overfarming and looting troops moving towards enemy lands. To make matters worse, trade has ground to a halt - in no small part due to the opportunistic warbands lurking near roadsides, thus provisions are no longer reaching the most heavily-affected areas. As a result of Castile’s inability to provide for its population, a region-wide famine has broken out and threatens to further harm the war effort. Those who can have already begun to flee elsewhere, but reports are coming in which describe untold horrors and atrocities perpetrated by the stragglers desperate enough to survive. It will take much time and effort to rectify this problem, by which point the economy may already be in tatters. To some, it appears that Castile has been forsaken; if not by Allah, then certainly by the Caliph."
 ab_andalusian_event.4.a: "We must try to help them!"
 ab_andalusian_event.4.b: "There is nothing we can do..."
 ab_andalusian_event.5.t: "Aragonese Rebellion"
 ab_andalusian_event.5.d: "Aragon has long been a centre of resistance against Andalusia’s rule over the Iberian Peninsula, despite it being an integral part of the Caliphate. The Aragonese had supported the Imperial forces during the Andalusian Crusade in the hopes that they would be able to become independent, but with the Christian defeat, they were forced to step back in line. Resentment continued to accumulate until those perfidious war hawks, ever the opportunists, recently turned their backs on Andalusia once more! With the Civil War raging on and threatening to tear Andalusia apart at the seams, a number of prominent Christian sympathisers have raised the banner of rebellion. This act of betrayal mustn’t be tolerated, for Andalusia needs as much support as possible in this hour of need. Aragon’s situation may be dire, but a cornered wolf will fight tooth and claw to free itself. If the armies of Andalusia fail to properly contain this threat, Aragon may pry itself from its rightful masters once and for all."
 ab_andalusian_event.5.a: "Crush them!"
 ab_andalusian_event.5.b: "We must try to stop them!"

