 hsn_depose_nizzarids_desc: "ph"
 hsn_timed1_title: "Timed Mission"
 hsn_timed1_desc: "This mission can be unlocked by completing '§YPrepare for War§!' mission before the year §Y1455§!."
 hsn_restore_port_yanbu_title: "Restore the Port of Yanbu"
 hsn_restore_port_yanbu_desc: "The port of Yanbu was an influential center of trade during the height of the Ayyubid Empire, serving as an important base of power in Arabia. Though Jeddah has since overtaken Yanbu as the primary port of trade in the Hejaz, it remains an important caravan route that can be further developed into a new seat of Ayyubid power in Arabia."
 hsn_greek_alliance_title: "Greek Rapprochement"
 hsn_greek_alliance_desc: "Though the Ayyubids and Greeks have had misgivings in the past, their mutual grievances with the Latin crusaders had often aligned the interests of both peoples. Such ties have even been borne of matrimony, with the arrangement of political marriages to further strengthen cooperation. Though the Greeks are no longer as they once were, they may prove powerful allies if we were to reaffirm our relationship with them."
 hsn_titans_crusades_title: "Titans of the Crusades"
 hsn_titans_crusades_desc: "During the crusades of old, the Ayyubid navy was able to exert control over the seas of the Mediterranean through its fleet of al-Basta, large warships capable of transporting hundreds of soldiers. Rebuilding this formidable naval force will allow the Ayyubids to once more defend the Levantine coast from European invasion."
 hsn_mend_house_title: "Mend the House Divided"
 hsn_mend_house_desc: "The Ayyubid dynasty has long been divided between its Levantine and Masri branches. The Levantine Ayyubids believe that their holdings have become the new heart of the caliphate, while the Masri Ayyubids believe that their time spent suffering under Nizzarid occupation has only further legitimized their claim to the realm. Through careful diplomacy, the rift between these two branches can be mended and their rivalry directed towards the betterment of the caliphate."
 hsn_assimilationism_mission_title: "Collective Sovereignty"
 hsn_assimilationism_mission_desc: "Ayyubid governance is characterized by its willingness to offer de facto autonomy in exchange for compliance. Further cultivating loyalty among these communities will allow the caliphate to fully benefit from its egalitarian rule, drawing from the capabilities of its vast array of cultures."
 hsn_restore_caliphate_title: "Restore the Caliphate"
 hsn_restore_caliphate_desc: "Though the Ayyubids' caliphal authority has been theologically affirmed by its Shura Council and appears legitimate among their own subjects, the authority of a prospective caliphate must be acknowledged throughout the Muslim world. The Ayyubid Caliphate must assert its status not only as a religious authority but also the dominant political power among the Muslim realms."
 hsn_secure_succession_title: "Secure the Succession"
 hsn_secure_succession_desc: "Decades of infighting among the Ayyubid emirs of Hisn Kayfa have left what remains of the former caliphate in disarray. What remained of our once loyal Mamluks fled to Egypt, while much of the former Ayyubid bureacracy lies empty. Securing the realm’s succession will allow Hisn Kayfa to once more maintain a military and state worthy of a caliphate."
 hsn_expand_mamluks_title: "Expand the Mamluks"
 hsn_expand_mamluks_desc: "The slave armies of the Mamluks once served as the primary military force of the Ayyubid Caliphate, allowing the Kurdish royal family to avoid granting too much military influence to their vast Arab population. Their martial prowess was unrivaled, while their loyalty also made them effective administrators and security forces. Though many of the former Mamluk factions have been integrated or dissolved under the Nizzarids, many of the most prominent cadres are eager to once more serve under the sons of Saladin."
 hsn_jamdariyya_enforcers_title: "Jamdariyya Enforcers"
 hsn_jamdariyya_enforcers_desc: "The Jamdariyya once served as formidable enforcers in the Ayyubid Caliphate, suppressing rebellions in the realm’s frontiers while enforcing law and order. Restoring these elite forces would greatly assist in the Ayyubids’ integration of new lands."
 hsn_salihiyya_bodyguards_title: "Salihiyya Bodyguards"
 hsn_salihiyya_bodyguards_desc: "The Salihiyya were the elite cadre of Mamluks used by the Ayyubid caliphs and important amirs as bodyguards. Establishing a powerful military apparatus devoted to the protection of officials would greatly benefit from these loyal and capable forces." 
 hsn_bahriyya_garrisons_title: "Bahriyya Garrisons"
 hsn_bahriyya_garrisons_desc: "The Bahriyya originated from slaves purchased from coastal regions, serving a formative role in their duties as elite marine and river corps. Many of their forts still remain along the Nile. Recruiting new Bahriyya forces and reestablishing their strongholds will allow the Ayyubids to regain access to these powerful military forces."
 hsn_assign_waqf_title: "Distribute Waqf"
 hsn_assign_waqf_desc: "As the Ayyubids reclaim their former lands and conquer new territories, it will prove useful to distribute religious charitable endowments known as Waqf. Doing so will allow the Ayyubid royal family to convey their piety to the realm’s ulema."
 hsn_hire_atabeg_mentors_title: "Hire Atabeg Mentors"
 hsn_hire_atabeg_mentors_desc: "Atabegs, nobles of Turkish origin, have often been entrusted with responsibilities of local governance. They were often also responsible for the education of princes, educating them in statecraft and warfare. Appointing an atabeg to turn the heirs of the Ayyubid dynasty into capable rulers would ensure that its rulers are capable and righteous."
 hsn_takiyya_murid_title: "Takiyya for the Murid"
 hsn_takiyya_murid_desc: "The Ayyubid realm is one of tolerance and scholarship. We can learn much from the Turuq, Sufi religious orders, have much to offer us with their unique scholarly perspectives. Their contributions to the Ayyubid realm nonetheless remain minimal since their Murid, initiates seeking guidance from Sufi masters, prefer to pursue enlightenment far away from the urban centers of the caliphate. Building takiyya, chambers within mosques dedicated to Sufi gatherings, would allow these individuals to play a more direct part in the religous culture of the Ayyubids."
 hsn_settle_mashriq_title: "Settle the Mashriq"
 hsn_settle_mashriq_desc: "Beyond the fertile rivers of Mesopotamia and the coasts of the Levant, much of the Mashriq remains uninhabited. Though much of this territory is barren, the tribes of the Syrian desert excel at thriving under such conditions and may be willing to settle in the lands of the Ayyubids. With their assistance, the settlements of the Mashriq shall grow vast and prosperous."
 hsn_empower_diwan_title: "Empower the Diwan"
 hsn_empower_diwan_desc: "A Diwan serves a vast variety of purposes within a caliphate, ranging from finances to statecraft and military affairs. While the role of Diwan in the realm has focused on the supervision of the military, it is time to ensure that all areas of the caliphate’s governance is given proper oversight."
 hsn_debate_madhahib_title: "Debate Among the Madhahib"
 hsn_debate_madhahib_desc: "An Islamic ummah cannot be cultivated without unity among the Islamic schools of jurisprudence. Inviting scholars from other Madhahib and fostering consensus would greatly advance the Ayyubids’ pursuit of an undivided caliphate."
 hsn_patronize_poetry_title: "Patronize Arabic Poetry"
 hsn_patronize_poetry_desc: "Though the Ayyubid elite still prefer to speak the Kurdish tongue, Arabic remains an important language for the arts and literature. Supporting its role in these fields will gain the support of Arabs who remain unconvinced by the benign reign of the Ayyubids."
 hsn_saladin_citidel_title: "Rebuild Saladin Citadel"
 hsn_saladin_citidel_desc: "The Citadel of Saladin once served as the Ayyubid Caliphate’s seat of power in Egypt. Once its mighty walls are restored and members of the Ayyubid dynasty once more call the citadel home, it shall once more serve a central role in the affairs of Egypt."
 hsn_invite_venetians_title: "Invite the Venetians"
 hsn_invite_venetians_desc: "Alexandria once served as a prominent entrepôt for European goods, build upon a foundation of strong economic ties with Venetian traders. Though such an arrangement has faltered under the Nizzarids, largely because of their attempts to retake Jerusalem, it can be restored under prosperous and tolerant Ayyubid rule."
 hsn_purge_stratocrats_title: "Purge the Stratocrats"
 hsn_purge_stratocrats_desc: "The remnants of the Nizzarid stratocracy intend to preserve their authority in Egyptian affairs, taking advantage of our decentralized military organization to carve our spheres of influence within local levies. We must convince these relics of the past of their obsolescence and purge their influence from Egypt."
 hsn_restore_cairo_title: "Restore the Old Capital"
 hsn_restore_cairo_desc: "Qahire has fallen into disrepair since the Nizzarids' relocation to Eskenderiye. The city will need comprehensive repairs and renovations to once more overshadow the former Nizzarid capital and be considered a true seat of regional power for the Ayyubids."
 hsn_assimilate_copts_title: "Assimilate the Copts"
 hsn_assimilate_copts_desc: "The Abbasids tried in vain to repress the Copts, while the Nizzarids’ policy of benign neglect allowed them to form a powerful yet fiercely independent intelligentsia. It is under the rule of the Ayyubids that they shall enjoy their autonomy but do so in exchange for their unquestionable loyalty to the caliphate."
 hsn_expand_sugar_title: "Expand Sugar Plantations"
 hsn_expand_sugar_desc: "Sugar is a valuable commodity in Europe, a resource that we are able to cultivate in vast quantities along the Nile. The merchants of Alexandria assure us that expanding the plantations along the river would greatly enrich our realm."
 hsn_subdue_petty_sultans_title: "Subdue the Petty Sultans"
 hsn_subdue_petty_sultans_desc: "The excessive autonomy afforded to the tribes of the Mashriq has proven invaluable in securing the loyalty of the Ayyubid heartland, but has also led to local leaders being heavily opposed to the prospect of being properly integrated into the caliphate. Reestablishing control over these petty sultans would not only restore our access to their lands but also ensure our access to its formidable warriors."
 hsn_renovate_damascus_title: "Renovate the New Capital"
 hsn_renovate_damascus_desc: "Dimashq has been restored to its former glory, but these are no longer the days of Saladin. The capital should be renovated to not only express our past glories but embody the architecture, commerce, and fine arts of the modern era."
 hsn_empower_kurds_title: "Empower the Kurds"
 hsn_empower_kurds_desc: "Though the Ayyubid dynasty itself and numerous prominent families within the realm are Kurds, the local politics of the Levant remain dominated by all manner of Turks, Arabs, and Druze. These groups vie to dominate the region’s local balance of power, preventing the caliphate from fully exerting its authority. To fully transcend the Levant’s ethnosectarian divides, it is necessary for the Kurds to take their rightful place as the just yet firm arbiters of the region’s affairs."
 hsn_appoint_qadi_title: "Appoint a Qadi"
 hsn_appoint_qadi_desc: "The office of Qadi, or chief justice, serves an important role in mediating disputes among nobles. Though the Abbasids have historically appointed Ayyubid qadis in the Levant while we controlled the city in the past, it is now time to restore our control over the office and appoint a qadi chosen by the Ayyubids."
 hsn_resettle_bedouins_title: "Resettle the Bedouin Tribes"
 hsn_resettle_bedouins_desc: "Much of the Mashriq once constituted Al-Awasim, the frontier between Byzantines and the caliphates of the past. Much of the territory remains covered in chains of fortified strongholds, though many of the Bedouin tribes that once inhabited them have since settled elsewhere. By offering to once more resettle the tribes of Arabia in the Mashriq, the frontier can once more remain guarded."
 hsn_end_assyrian_church_title: "End Assyrian Church"
 hsn_end_assyrian_church_desc: "The Assyrian Church has long resisted the forces of Islam, with their strategic position along the Mesopotamian highlands shielding them from external influence. Dissolving the institution and converting the Syriac Christians is necessary for the Ayyubids to cultivate religious unity in the Mashriq."
 hsn_reconsecrate_dome_title: "Reconsecrate the Dome"
 hsn_reconsecrate_dome_desc: "The Dome of the Rock is one of the most significant Islamic holy sites in the city of Al Quds. Much to the dismay of the Muslim world, centuries of crusades have significantly damaged the structure. Restoring the Dome to its former glory would greatly improve our standing among other Muslims."

