# Missions #
 jlr_turkish_tradition_title: "Islamise Anatolia"
 jlr_turkish_tradition_desc: "Under the rule of the Seljuk Hashim the Pious, Anatolia was converted to Islam. Yet, vast swathes of Turkish territory still remain firmly in the hands of the heathen and the persistence of an Oghuz identity has widened the divide among our Arab and Turkish subjects. Perhaps by cultivating a tradition of interfaith dialogue, we can forge a novel Turco-Arabic culture, one which stands as a testament to our tolerance."
 jlr_build_mosques_title: "Build Mosques"
 jlr_build_mosques_desc: "Many threats loom over the horizon, while uncertainty plagues the minds of the thoughtful in our realm. As we stray further away from the light of Allah, our Ulema warns us about the consequences of our transgressions. To prove that we are the loyal servants of God we always were, we must erect new mosques and madrasas, and repent for our trespasses against His will."
 jlr_sword_islam_title: "Sword of Islam"
 jlr_sword_islam_desc: "Our rapid conquest has had the unintended consequence of uniting the enemies of our state, heathen or heretic into an alliance of circumstance. As the infidels muster their forces, we must not cower, for we are the Zulfiqar, the blade of Islam that shall tear through their hordes while remaining unscathed. Let our enemies tremble before the harbingers of their reckoning."
 jlr_mongol_tactics_title: "Mongol Tactics"
 jlr_mongol_tactics_desc: "Decades of stagnation coupled with conforming to the populace forced us to change our nomadic ways and adopt feudalistic structures. This not only changed our society, but also our army, which has conformed to conventional methods of warfare. Yet, the legacy of Mongol tactics remain unmatched. By integrating the mobile tactics of our ancestors with contemporary combat strategies, we may be able to form a force capable of inviting ruination upon our enemies."
 jlr_mobile_siege_title: "Mobile Siege"
 jlr_mobile_siege_desc: "As fortresses become larger and more defensible, attacking the garrison head-on is considered by many tacticians to be equivalent to a suicidal charge. We must adopt the tactics of siege employed by our Mongol ancestors, by using our superior mobility to encircle their fortress, compromising its impact on the war, while bleeding the demoralised garrison dry and forcing them to surrender."
 jlr_sulayhids_title: "Destroy the Sulayhids"
 jlr_sulayhids_desc: "The heretic Sulayhids guard one of the most lucrative trade routes of the world. Connecting Egypt and the Western World to the markets of the Orient, the Gulf of Aden has emerged as a vital nexus of commerce and influence. Our merchants demand action, let us cast down the pretenders and claim the harbours of the south in the name of the Sultan."
 jlr_goods_arabia_title: "Goods of Arabia"
 jlr_goods_arabia_desc: "The coffee bean, cultivated extensively in the Arabian peninsula, has become one of the most sought after goods in the world. The Islamic ban on alcohol and spread of enlightened ideas across Europe has prompted the growth of coffee houses, and so long as we can guard the secret of brewing the black elixir, we can ensure a continued monopoly over its distribution."
 jlr_constantinople_title: "Sack Qustantiniyah"
 jlr_constantinople_desc: "The Shield of Christendom, the terminus of the Silk Road, and the city which bridges the gap between Europe and Asia now lays in ruins, shattered by the might of our cannons. Though its political power has waned, the city remains a beacon of human achievement, home to some of the greatest works of art ever crafted. These belong not in a burning city but instead the grand palaces of Baghdad. Let us sack this living husk of a city and appoint the Osman merchants to rule in our stead."
 jlr_presence_in_india_title: "Presence in Al-Hind"
 jlr_presence_in_india_desc: "The allure of silk, spices and other exotic wares encouraged our traders to venture east, towards Al-Hind. While the local rulers promised proper accommodation for our merchants, many of them complain about mistreatment and disrespect. To treat the great Jalayirid Sultan's envoys with such indignity warrants punishment! We shall seize their coastal towns for ourselves and ensure an uninterrupted supply of these luxurious goods."
 jlr_fareast_title: "Reach the Far East"
 jlr_fareast_desc: "Innovations in shipbuilding have emboldened our merchants to make the treacherous journey through the Indian Ocean, allowing greater connectivity with the markets of the Far East. However, our traders often find themselves at the mercy of the whims of the local Lords, many of whom have attempted to weaken our position by interrupting supply of spices and cloves. To ensure a swift end to such disturbances, we must sail East and bring the Indies under our benevolent oversight."
 jlr_hashshashin_title: "The Hashshashin Order"
 jlr_hashshashin_desc: "Though our Mongol ancestors often found themselves at odds with the Nizari Order of the Assassins, many within the Sultan's inner circle find wisdom in employing the services of their descendants. By allowing the remnants of the Hashshashins to practice their faith freely, and awarding them old Crusader castles in Tripoli to use as strongholds, we can mend the wounds between our people and make ghosts of our enemies without firing a single volley."
 jlr_library_title: "Restore the Library"
 jlr_library_desc: "The fire which consumed Alexandria burnt with it the Great Library which housed some of the most expansive works on human understanding. While many wept for its loss, none had the calibre to restore its glory before our great Sultan! Under his guiding hand, we shall raise a new sanctuary of knowledge, a haven for every treatise and wisdom yet known. Let the world bear witness to the revival of Islamic intellectualism and enlightenment!"
 jlr_imperial_fabrics_title: "Imperial Fabrics"
 jlr_imperial_fabrics_desc: "The fabrics spun in our grand manufactories, bearing the seal of the Jalayirid Sultan have been spread far and wide. Their supreme quality has become synonymous with the prosperity of our state, adorning nobles from Baghdad to Jerusalem and turning the looms into instruments for the Empire."
 jlr_almohads_title: "Overthrow the Almohads"
 jlr_almohads_desc: "The Almohad state which controls the Maghreb follows a school which can only be defined as a gross misinterpretation of God's ideals. Tensions between the scholars of our nation and those of the Almohads has reached a record high and war has become all but an inevitability. Our campaign in the Atlas Mountains shall conclude when their Ulema conforms to the ways of the Jalayirid interpretation."
 jlr_textile_title: "Expand the Textile Industry"
 jlr_textile_desc: "Though the Mongol invasion ravaged the once prosperous textile industry of Mesopotamia, under our patronage and investments, our manufactories have emerged more productive than ever. It is only a matter of time before the Muslin cloth once again dominates the markets of the Orient and the West, bringing us immense wealth and grandeur!"
 jlr_andalusia_title: "The Sole Caliph"
 jlr_andalusia_desc: "The dual Caliph arrangement has been extremely detrimental to the authority of the legitimate caliph who resides in Cairo. We must cross the Straits of Gibraltar and put an end to this farcical arrangement, imprisoning the false Caliph and declaring ourselves as the only rightful and supreme authority of Islam!"
 jlr_unfaithful_title: "Fate of the Unfaithful"
 jlr_unfaithful_desc: "Within the borders of our Empire reside many 'people of the Book'. While we long upheld their right to worship in exchange for the jizyah, many scholars suggest that the conversion of these heathens to Islam may further the stability of our realm and elevate our prestige across the Islamic world. The fate of the Dhimmi, conversion or tolerance now rests in the hands of the Sultan."

