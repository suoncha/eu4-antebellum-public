 release_lendia_title: "Release Lendia"
 release_lendia_desc: "This decision allows us to create the Kingdom of Lendia as a junior partner in the personal union in our Polish provinces."
 release_poland_title: "Release Poland"
 release_poland_desc: "This decision allows us to create the Kingdom of Poland as a junior partner in the personal union in our Polish provinces."
 LTV_RELEASE_LENDIA: "Releases @POL §YLendia§! in the §YPolish§! region as a junior partner in the personal union."
