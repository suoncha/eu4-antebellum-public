# Insults #
 insult_against_magyars: "I've heard that you people really like vast plains. Perhaps, you should go touch some grass."
 insult_against_magyars2: "Huns gone, Avars gone, you're next."
 insult_abdefault11: "Your people look submissive and rulable."
 insult_against_francia: "The Andalusian Crusade was still more successful than your emperorship."
 insult_against_angelids: "If I had one ducat for every competent Angelid emperor, I would have zero ducats."
 insult_against_slovenes: "Your country is truly wonderful. Nitra has to be my favorite Slovene town."
 insult_against_slovaks: "Your country is truly wonderful. Ljubljana has to be my favorite Slovak town."
 insult_brasiliyya: "You should start behaving, else we'll send you to Brasiliyya."
 insult_against_arles: "I love Arles so much I'm glad there are two of them."
 insult_against_capua: "The bell tolls for your sham of a nation."
 insult_against_nestorians: "Your religion is as lame as your saint."
 insult_from_mongols: "SCOREBOARD!"
 insult_against_prydain: "Your claim to Rome is as incoherent as your language."
 insult_against_heir: "Maidenless?"

# Ideas #
 VLT_ideas: "Veleti Ideas"
 VLT_ideas_start: "Veleti Traditions"
 VLT_ideas_bonus: "Veleti Ambition"
 vlt_first: "Unite the Wendish Tribes"
 vlt_first_desc: "The Wendish people is not a singular culture, but more a name given to us and other tribes by the Germans that border us. The ancestors of Velvet originate from tribes of Slavs called the Lechtics although this technicality does not concern the German's since they see all Slavs as potential enemies. Disregarding the origin of the term Wends, the idea of a united people against the encroaching Germans has become popular in recent years and many support the idea of uniting the fractured tribes of Slavs that settled these areas for so many centuries ago. Most of these tribes now live in other Slavic kingdoms that don't share our vision of unity, but some may be under the cruel boot of foreign oppressors. Nevertheless, vast lands need to be conquered by us to unite our people under one realm."
 vlt_second: "Repel the Germans"
 vlt_second_desc: "Ever since the Slavic migration caused by the Huns, there have been countless conflicts between the Germanic and Slavic peoples. Our realm is at the edge of the Germanic world, meaning that if the Germans seek to expand their settlements, we will be one of their first targets. We cannot allow our people to be pushed around and removed from rightful Slavic lands that have been ours for centuries. Our soldiers are fighting for their own homes and families and will fight with the strength of ten men to repel any attacker from our lands."
 vlt_third: "High Priest of Svetovid"
 vlt_third_desc: "Svetovid is a Slavic deity of war and fertility that is primarily venerated on the island of Rujana. The worship of this deity reached its peak during the 12th century which spread into the mainland. Now the worship of Svetovid is at the centre of our theocracy and it's our duty as true worshipers to spread his name as far as possible."
 vlt_fourth: "Slavic Temper"
 vlt_fourth_desc: "Due to our many conflicts with the Germanic peoples, us Slavs are seen as barbaric and uncivilised. This is untrue of course, but we would be lying if we didn't portray our German enemies with the same savagery. However, as the delicate balance of power is constantly shifting in Europe, we can no longer remain diplomatically isolated except for our Slavic brothers. Our diplomats will disprove these foul prejudices and show that Veleti is a reasonable and civil Kingdom that can be trusted as an ally. With this tempering of relations, we will no longer be alone in our struggle."
 vlt_fifth: "Baltic Trade"
 vlt_fifth_desc: "The Baltic sea is one of the biggest centres of trade in Europe, connecting us to Scandinavia, the Baltic countries, and most notably our Easter Slavic brethren. Defying the Germans in the Hanseatic League and pushing some of the profits from the large network of trade will greatly boost our economy."
 vlt_sixth: "Gordy"
 vlt_sixth_desc: "Gordy is the name given to the great fortifications built to defend against foreign aggressors. These wonders of architecture are designed to resist most sieges even though the forts themselves are smaller compared to other castles in Europe, making up for their size with walls that are difficult to scale and traps planted both outside and inside the fortification."
 vlt_seventh: "Perun's Thunder"
 vlt_seventh_desc: "The arrows of Perun drive enemies away,\n enforce justice, and grant fertility.\n God with flaming hair, with burning face,\n I watch you come with the clouds\n to perform your mighty deeds."

 OBD_ideas: "Obotrite Ideas"
 OBD_ideas_start: "Obotrite Traditions"
 OBD_ideas_bonus: "Obotrite Ambition"
 obd_first: "People of the Sea"
 obd_first_desc: "Few can replicate the strong bond that exists between an Oborite and the Baltic sea. Our children grow up sailing the Baltic waters and no boy can call himself a man before he can confidently steer a ship all by himself. We have no shortage of able-bodied sailors to recruit to our fleet."
 obd_second: "Intercept Hanseatic Shipping"
 obd_second_desc: "The Hanseatic league has for ages tried to undermine and challenge our rule over Wendia with the aid of their large trade network that spans the Baltic sea. However, their greatest strength can also be turned into a weakness. By blockading the ports of the Hanseatic cities we will cut them off from their German brothers, making them a vulnerable target for our armies to finish the fight."
 obd_third: "Dominate the Baltics"
 obd_third_desc: "The Baltic is the centre of some of the most lucrative trade in Northern Europe, connecting the Wendish kingdoms to the Scandinavian kingdoms, the Finnic chiefdoms, and the Novgorod Merchant republic. Something that our competition with the Hanseatic league has taught us is how to turn trade between different realms into wealth that can be used to help our realm prosper."
 obd_fourth: "Obotrite War Fleet"
 obd_fourth_desc: "Countless years of warfare have turned our relatively small Oborite war fleet into one of the most experienced fleets in the region. Our admirals know the sea like the back of their hand and our smaller galley sail in circles around larger ships, tearing them and their crew apart with ruthless ferocity."
 obd_fifth: "Preserve the Polabian Language"
 obd_fifth_desc: "The Polabian language is the language used by all the Wendish tribes and can be summarised as a Slavic language with a strong German influence. Nevertheless, the approaching presence of the German kingdoms has led to the status of the language being threatened and replaced by German. Thanks to the recent efforts of our scholars to promote Plobian literature and create a universal Polabian language, Polabian has started to resurface among both common peasants and intellectuals. With our help, the Polabian language and its unique history will be preserved for future generations."
 obd_sixth: "Forest Warfare"
 obd_sixth_desc: "When facing an enemy that is numerically and technologically superior to you, more creative solutions are required. Our long-standing familiarity with our homeland has made us aware of multiple points where invading enemy armies can be trapped, harassed, and surrounded without them even knowing where the enemy is. Let's see how well our enemies can distinguish the trees from an Obotrite."
 obd_seventh: "Voyage to the New World"
 obd_seventh_desc: "While we undoubtedly share a strong connection to our homeland, where would we be if our ancestors didn't dare to adventure west in the hope of finding new and rich lands to settle in. Now we are faced with the same opportunity but in a much stronger position. We shall send brave men and women to the legendary lands beyond the great Atlantic with the purpose of claiming more rich land in the name of the Oborite people. Wealth and adventure await, what fool wouldn't seize this golden opportunity in front of them?"

 POM_ideas: "Pomeranian Ideas"
 POM_ideas_start: "Pomeranian Traditions"
 POM_ideas_bonus: "Pomeranian Ambition"
 pom_idea_1: "Legacy of Pirates"
 pom_idea_1_desc: "Being a busy network of lucrative trade, the Baltic Sea, and thus the Pomeranian coast has always been a very good place for piracy. So much so that privateering and piracy became state-sanctioned, and among the Gryf rulers of Pomerania even operations of state. There is nothing like stealing lots of gold from your rivals, especially the hated Hanseatic League."
 pom_idea_2: "Pomeranian Merchants"
 pom_idea_2_desc: "We have a long tradition of sailing across the Baltic Sea in search of safe havens for our ships and merchandise, heathen and heretic lands proving little barriers to our commercial interests. Many foreigners have heard of us - from Paris to Novgorod."
 pom_idea_3: "Northern Ports"
 pom_idea_3_desc: "With some of the best natural harbours in all of Europe, our ports are situated at excellent strategic locations, giving us a natural advantage when expanding our influence over the trade within the Baltic Sea, both through legitimate commerce and more coercive means."
 pom_idea_4: "Religious Freedom"
 pom_idea_4_desc: "Being mostly interested in trade and distant business opportunities, we have no time or desire to get into petty religious squabbles with our fellow Pagans, lest our division become our common ruin."
 pom_idea_5: "Mercenary Contracts"
 pom_idea_5_desc: "Our numerous trading contacts have allowed us to establish excellent relations with a multitude of foreigners, all recognising the power of the Pomeranian purse. Our good name and reputation will allow us to hire their mercenaries at better rates than usual, as they can trust in our ability to pay."
 pom_idea_6: "Dominate the Baltic"
 pom_idea_6_desc: "As Pomeranian power and influence grows, so does our grip over the Baltic Sea. Soon it will be Mare Nostrum, little more than Pomeranian pond. A highway for our trade, connecting us to the Amber Road and the growing colonial trade."
 pom_idea_7: "Grand Baltic Fleet"
 pom_idea_7_desc: "We shall attempt the construction of a new, modern navy, the largest and grandest the Baltic seas have ever seen. The Vikings and Germans alike shall be put to shame by our magnificent new fleet!"

 WEE_ideas: "Wendish Ideas"
 WEE_ideas_start: "Wendish Traditions"
 WEE_ideas_bonus: "Wendish Ambition"
 wee_first: "Bane of the Teutons"
 wee_first_desc: "In the harrowing battlefield consumed by the endless dark fog of the Wendia, the Teutonic knight tries to crawl back to the petty city of Danzig. Consumed by the horror that us, the Wends sent them through he screams for help, but the only thing he hears is the loud hums of Slavic war hymns. Let it be known, Wendia will punish any Teuton that dares to challenge her!"
 wee_second: "Obotrite Seafaring Legacy"
 wee_second_desc: "The Obotrites, a Wendish clan that borders the Hansa near Lubeck, is known for their excellence in trading and manoeuvre around the Baltic sea. Raiding the Germanic peasants and disrupting Hanseatic trade routes, the Obotrites have left us a foundation to build on."
 wee_third: "Slavic Temper"
 wee_third_desc: "As the Teutons keep harassing our borders and try to exterminate our peoples, us Slavs need to stand together and channel our raw aggression against the Christian invaders. The tribes may have feuds, but they will stand in solidarity as the Teuton arrives!"
 wee_fourth: "Wendish Union"
 wee_fourth_desc: "Lusatia, Pomerania, Obotrites and Veleti. Even though these tribes make up our Wendish motherland, we expand into different reaches all around the continent, thus we need to tolerate and govern the foreign cultures that we conquer."
 wee_fifth: "Dominate the Baltic Trade"
 wee_fifth_desc: "The Hanseatic trade-cities of the Baltic Sea dominate the trade in the region. If we want to compete with the Teuton merchants, us, the Wends need to match up with their standards of trade and commerce."
 wee_sixth: "Perun's Thunder"
 wee_sixth_desc: "The arrows of Perun drive enemies away,\n enforce justice, and grant fertility.\n God with flaming hair, with burning face,\n I watch you come with the clouds\n to perform your mighty deeds."
 wee_seventh: "Wrath of the Old Gods"
 wee_seventh_desc: "We have collected the blessings of all our gods from Perun to Zhiva. Our axes are sharp, our army's bellies are full and our right to conquest against the Christians and other non-believers are in full force. Who is the heathen now, Rome?"
 WEE2_ideas: "Wendish Ideas"
 WEE2_ideas_start: "Wendish Traditions"
 WEE2_ideas_bonus: "Wendish Ambition"
 wee2_first: "Bane of the Teutons"
 wee2_first_desc: "In the harrowing battlefield consumed by the endless dark fog of the Wendia, the Teutonic knight tries to crawl back to the petty city of Danzig. Consumed by the horror that us, the Wends sent them through he screams for help, but the only thing he hears is the loud hums of Slavic war hymns. Let it be known, Wendia will punish any Teuton that dares to challenge her!"

