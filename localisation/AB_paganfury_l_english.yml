 mgy_first: "Complete the Honfoglalás"
 mgy_first_desc: "The Hungarian tribes fled their ancestral homelands to find a new land which they would call home. When they crossed the Carpathian mountains, they found a vast land on which they settled and resided to this time."
 mgy_second: "Unite the Seven Tribes"
 mgy_second_desc: "The confederation of Hungarian tribes bound by the blood oath was and still is an important part of our society."
 mgy_third: "Magyar Lancers"
 mgy_third_desc: "Our nomadic lifestyle made us master the use of mounted warriors which form the most important and the most powerful units of our armies."
 mgy_fourth: "Horde on a Horseback"
 mgy_fourth_desc: "The Magyars once swept across Europe like a storm, striking fear into the hearts of kings and peasants alike. Our forefathers were warriors born in the saddle, their strength in their horses and bows. Now, with enemies on every side, it is time to revive the power of our mounted warriors. Let all of Europe remember the might of the Magyar horde!"
 mgy_fifth: "Dynamic Warfare"
 mgy_fifth_desc: "As most of our armies consist of cavalry, we must know how to effectively use them in battle and manoeuvring around the battlefield is perhaps the most important factor for us in order to succeed."
 mgy_sixth: "Osmagyar Vallás"
 mgy_sixth_desc: "Over 500 years have passed since our arrival to the Carpathian basin, 500 hundred years being surrounded by the Christian faiths, both the Catholic and the Orthodox and still, we managed to preserve our native faith."
 mgy_seventh: "Bloodline of Koppány"
 mgy_seventh_desc: "When the pretender Vajk sought to impose foreign gods upon the Magyars, it was Koppány who rose to defend the true spirit of our people. Though the Christian invaders thought they had crushed our sacred traditions, the bloodline of Koppány endures."

# Government Names #
 GRAND_PRINCE: "Grand Prince"
 GRAND_PRINCESS: "Grand Princess"
 GYULA: "Gyula"

# Reforms #
 magyar_tribal_union: "Magyar Tribal Union"
 magyar_tribal_union_desc: "Magyars are organized into a decentralized confederation of tribes that is officially ruled from Szeged, the seat of the Árpád dynasty. However, the central rule is very weak, which paralyzes the Magyar's ability to do anything but fight among themselves for the seat of the Grand Prince."
 mgygyula: "Revive Gyula and Kende"
 mgygyula_desc: "Magyar kingship was once divided between the sacred king, or Kende, and the military leader, or Gyula. This unique form of split governance allowed us to better adapt to military circumstance, while maintaining legitimacy. Let us revive this ancient tradition."
 mechanic_mgy_coruler_yes: "Select a §YCo-Ruler§! on monarch death. They will provide your ruler with the fourth personality trait at half efficiency."
 mgytaltos: "Empower the Táltos"
 mgytaltos_desc: "Similar to Shamans of other faiths, the Magyar Táltos are humans of supernatural abilities. Known for their spiritual powers of révülés they often serve as a bridge of communication between the gods and spirits and the Hungarian people, warning of impending doom. Granting them more privileges should inspire a certain amount of confidence amongst our armies."
 mgygreek: "Greek Liturgical Language"
 mgygreek_desc: "Our conversion to Orthodoxy has allowed us to tap into the vast Greek literary culture of our southern neighbors. This allows us to maintain a pace of rapid modernization."
 mgyslavic: "Slavic Auxiliaries"
 mgyslavic_desc: "While us Magyars are superb horseman, there are many more demeaning jobs in the army that need to be filled. Just as the Avars before us, or as our forefather Attila did with the Germans, we must recruit Slavs to fill ranks."
 mgyispan: "Ispán Marches"
 mgyispan_desc: "As one of the last pagan realms in Europe, our Christian neighbors are always looking to invade us if given the chance. Assigning border lands and their respective fortresses to court officials known as Ispán will allow us to maintain a strong defensive position against all our would be enemies."

# Decisions #
 form_magyars_title: "Reunite the Magyar Tribes"
 form_magyars_desc: "Ever since our entry into the Carpathian Basin, the Magyar people have been ruled by the Árpád dynasty. However, while they promised conquest and glory, all they have broguht us was defeat and dishonor. It is time the Magyar people are united under the leadership of the [Root.Monarch.Dynasty.GetName], who shall lead our nation to greatness." 

# Events #
 magyar_events.1.t: "The Question of Faith"
 magyar_events.1.d: "Now that we have established a hegemony over the Carpathian basin, we became a subject of interest to many foreign powers. His Holiness the Pope demanded that the diplomatic envoy is sent to meet with our rulers and offer them conversion to the Christian Catholic faith. Perhaps the time has come to abandon our nomadic life, settle down and become a real European Christian nation. We have to make decision."
 magyar_events.1.a: "We will convert to Catholicism"
 magyar_events.1.b: "We will convert to Orthodox instead"
 magyar_events.1.c: "We will never abandon our faith!"
 magyar_events.4.t: "Uprising of the Magyar Tribes"
 magyar_events.4.d: "Not everyone is happy with our conversion to Christian faith. Lesser leaders of some Hungarian tribes have plotted a rebellion in order to overthrow our ruler and remove the 'Christian filth' that he brough into our nation."
 magyar_events.4.a: "We will crush them!"
 magyar_events.5.t: "Settling Transdanubia"
 magyar_events.5.d: "When our ancestors entered Pannonia centuries ago, they sought to unite it all under the Magyar rule. Although they came close to achieving that goal, the defeat at the Battle of Pozsony forced our ancestors back behind the Danube, where we have stayed ever since. After centuries of internal struggle, we have finally managed to achieve a great victory over the Slavs of Pannonia, and have secured Transdanubia for ourselves. Now, we must decide the fate of the area."
 magyar_events.5.a: "We shall move the tribes across the Danube."
 magyar_events.5.b: "Let us integrate and protect the locals instead."
 magyar_events.6.t: "Gyula and Kende"
 magyar_events.6.d: "Our old ruler has passed, and while the Magyar tribes mourn his passing, the time has come for the new Grand Prince to select his new co-ruler. As we have reestablished the ancient tradition of the Gyula and Kende - a dual leadership that once guided our people in times of both war and peace, the choice must be made to elect the one who will step forward to claim this title."
 magyar_events.6.a: "Select someone skilled in administration."
 magyar_events.6.b: "We could use a diplomat."
 magyar_events.6.c: "Only the strong should rule!"
 magyar_events.7.t: "A New Capital"
 magyar_events.7.d: "Now that we control the Carpathian Basin, many voices within our realm have suggested that the seat of power should be moved to a more central location. In order to better project our influence over these lands, we must consider relocating the capital. The settlement of Buda, located near the ancient Roman camp of Aquincum, seems to be the most promising candidate for the new capital of our expanding domain."
 magyar_events.7.a: "Let us move our capital to Buda!"
 magyar_events.7.b: "Our capital is fine where it is"

