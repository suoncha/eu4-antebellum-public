# Decisions #
 wendish_empire_title: "Form Wendia"
 wendish_empire_desc: "Polabian Slavs are divided into three countries that are constantly fighting each other. The threat of German invasion is rising and if we do not unite, we stand no chance."

# Events #
 ab_wendia.1.t: "The Destruction of Aachen"
 ab_wendia.1.d: "Aachen, the once proud capital of the Frankish Empire, has fallen into our hands. The mighty Franks could not protect their empire, and their rulers cower in fear behind the walls of Paris. Through blood and steel we conquered the city, putting any who dared stand against our forces to the torch. Their people wept as they saw us approach, crying out to their false god. They begged and pleaded for angels to come down from above, for their savior to rescue them, but they must have been of little faith as none came to stop our advance. \n \nAs we approached the mighty cathedral of Aachen, a monument toward the Christian God, one of our men murmured something to himself; burn it down. The man beside him began to nod his head, believing the same. Burn it down. The murmurs became chants, which then became a rousing cheer from across our entire ranks. The general grabbed a nearby torch, chucking it into a patch of dry wood nearby the mighty structure. \n \nThat night, in the smoldering ruins of a once great cathedral, we dined on meat and mead as our songs of glory howled into the night through the open roof."
 ab_wendia.1.a: "Burn it down!"
 ab_wendia.2.t: "The Balto-Slavic Union"
 ab_wendia.2.d: "The Balts and Slavs are among some of the last remaining non-christians in Europe. We did not forget the old ways, nor did we let the Christians destroy and bastardize our culture. We stood firm against the Franks, Germans, and even the Rus. In this era of empire and conquest, we stand united. Even if the people of the Baltic do not realize it yet, we are of one blood and faith. Together we shall ride until the end of days!"
 ab_wendia.2.a: "Strength in unity"

