# Ideas #
 SCA3_ideas: "Scandinavian Ideas"
 SCA3_ideas_start: "Scandinavian Traditions"
 SCA3_ideas_bonus: "Scandinavian Ambition"
 sca_fourth3: "Stormaktstiden"
 sca_fourth3_desc: "The Era of Scandinavia has begun; our poets write great songs and works about our achievements; our artists draw on canvas of the defeat of the heathen armies and promote the beauty of our homeland. This period of pride and prestige brings with us a sense of honour and duty; we must not rest on our laurels, we must work to maintain this golden age, no matter the cost!"
 swe_first: "The King and the Church"
 swe_first_desc: "Sweden's monarchy relies upon close ties to the Catholic Church to maintain its legitimacy, as well as to curb the influence of the aristocracy and mercantile class. This relationship has proven fruitful in fostering loyalty and compromise between the two arms of state, with the church offering up its vast resources to the king in exchange for royal favour in court politics." 
 swe_third: "The Holy Mission"
 swe_third_desc: "When the first Swedish kings converted to the Christian faith, they promised His Holiness the Pope that all of the north shall be converted to one true faith by word or by sword. This pledge gave Sweden extraordinary status within the Catholic world and made our ties with the Papal States extraordinary as well."
 swe_seventh: "Gud Vill Det"
 swe_seventh_desc: "The presence of Pagan faiths will not be tolerated. They must be removed from Scandinavia at once, and our holy crusade will make sure of that."

 SCA_ideas: "Scandinavian Ideas"
 SCA_ideas_start: "Scandinavian Traditions"
 SCA_ideas_bonus: "Scandinavian Ambition"
 SCA2_ideas: "Scandinavian Ideas"
 SCA2_ideas_start: "Scandinavian Traditions"
 SCA2_ideas_bonus: "Scandinavian Ambition"
 sca_first: "Three Crowns, One Faith"
 sca_first_desc: "Our new realm expands across all Nordic lands: in the fjords of Norway, in the isles of Denmark, and in the forests of Sweden, all acknowledge the rightful rule of the Scandinavian Crown. Of course, our realm is unified not just in politics, but also in faith. The Swedish crusade was a long one, filled with bloodshed and heartbreak, but we have finally brought the words of Christ to our brothers in arms, saving their souls from eternal damnation. Our union is blessed by God, and our realm protected by his grace."
 sca_second: "Baltic Arsenal"
 sca_second_desc: "The Baltic Sea is the economic lifeline of our empire. Trade from across the world flows through our warm water ports, and as such, it must be maintained through the use of a powerful fleet. Our navy shall scour these waters, protecting it from pirates and invaders alike."
 sca_third: "Swedish Steel"
 sca_third_desc: "The core of our armies remain the same as it ever was; the mighty Swedish infantry. This highly trained professional army remains just as fierce as when they first launched their mighty crusade into the heartland of Scandinavia, fighting on in even the direst situation. Be it rain or snow, many or few a foe, these brave soldiers put their lives on the line for faith and country, never surrendering until the mission is complete."
 sca_fourth: "Stormaktstiden"
 sca_fourth_desc: "The Era of Scandinavia has begun; our poets write great songs and works about our achievements; our artists draw on canvas of the defeat of the heathen armies and promote the beauty of our homeland. This period of pride and prestige brings with us a sense of honour and duty; we must not rest on our laurels, we must work to maintain this golden age, no matter the cost!"
 sca2_fourth: "Stormaktstiden"
 sca2_fourth_desc: "The Era of Scandinavia has begun; our poets write great songs and works about our achievements; our artists draw on canvas of the defeat of the heathen armies and promote the beauty of our homeland. This period of pride and prestige brings with us a sense of honour and duty; we must not rest on our laurels, we must work to maintain this golden age, no matter the cost!"
 sca_fifth: "Produktplakatet"
 sca_fifth_desc: "The decree forbidding foreign ships arriving in Sweden to bring goods from countries other than their own or colonies was implemented in order to promote mercantilism across the state. While other empires struggle to gain influence in our trade, we shall focus on increasing production and goods production across our realm!"
 sca_sixth: "Triumph of the Cross"
 sca_sixth_desc: "Across the realm, we see more and more of our citizens abandoning the heathen faith and joining us in the light. They flock to our great crusade, proclaiming the strength of God and Christ is with them as they fight on foes across the realm; be their enemy heretic or heathen, our people are willing to die for the faith, uncompromising in their beliefs."
 sca_seventh: "New World Enterprise"
 sca_seventh_desc: "The Americas are a vast land of opportunity and riches. While we might be entering the race later than most, we have to secure territory in the new world quickly. With the establishment of enterprises in Vinland, Earningland, and Juzur Al-Antil, we can combat our rival colonial powers and truly dominate the era of trade and empire."

# Holy Orders #
 sweden_order: "Caroleans"
 sweden_order_desc: "Founded by the King of Sweden in the late 12th Century AD, the Caroleans are a fearsome military order who serve as the vanguard of the Holy Cross in Scandinavia."

# Reforms #
 swekingdom: "Kingdom of Sweden"
 swekingdom_desc: "Swedish kings of the past have accepted the true faith and sworn to fight against the heathens who refuse to accept Christianity. Since the adoption of Christianity, we have effectively managed to convert the Swedes who are now willing to follow our kings into the northern crusades."
 swenobles: "Crusader Nobility"
 swenobles_desc: "If we truly wish to embark upon a crusade, we will need a full support of our nobility. They shall be given increased rights, new lands and fair share of loot in return for their full military support."
 swewesternize: "Integration of the Heathens"
 swewesternize_desc: "Our wars against the great heathen armies of Denmark, Norway, and Finland have brought under us many pagan subjects who still are very much like us. As we integrate these new territories, we must ensure our state is properly equipped to bring these heathens into the fold. By rewarding those who convert with bureaucratic integration, we may expedite the process of assimilation and administration."
 swemission: "Support the Missionaries"
 swemission_desc: "As the only Christian country in the north of Europe, we must put an emphasis on the importance of missionary work and religious conversion. The church must have a full support of the crown."
 sweleidang: "Leidang"
 sweleidang_desc: "Leidang is a form of conscription organising a coastal fleet with the aim of defence, coerced trade, plunderings, and aggressive wars. This system forms one of the pillars of our naval power and defense of our coastlines and should be further reinforced so that our naval borders are always safe."
 sweriksdag: "Riksdag of the Estates"
 sweriksdag_desc: "Riksdag is the assembly of the Swedish estates - the institution itself is the highest authority in Sweden next to the King. Ensuring that all of our estates have their representantives in the Riksdag will considerably increase the effectivenness of our government."
 mechanic_swe_papal_war_yes: "Gain §G5§! Papal Authority for winning wars against §YHeretics§! and §YHeathens§!."
 sweabsolutism: "Crusader Absolutism"
 sweabsolutism_desc: "The King of Sweden has the final say in matters of state, for he is the leader of our great Northern Crusades. His word is the highest of law that is backed by both the secular authority of the realm and the divine authority of the Church."
 swecouncil: "Council of the Realm"
 swecouncil_desc: "Since the foundation of the Kingdom of Sweden, there has been a somewhat irregular privy council consisting of the most powerful chiefs within the realm. These magnates were to advise the King, though he always had final say. Over time, as Sweden evolved, this council came to consist of appointed courtiers rather than powerful warlords. By making this council a permanent institution, we can assure the most effective administration possible from this special cabinet. The King of Sweden would be free to appoint whoever he wishes to this council, as long as they are of Swedish birth."
 sweholyfury: "Holy Fury"
 sweholyfury_desc: "The Kingdom of Sweden has worked tirelessly to cultivate a religious fervor in its soldiers. These great Northern Crusaders will follow our leaders with holy fury, furthering our expansion and sacred mission to Christianize Scandinavia."
 mechanic_gain_trad_on_heretic_heathen_yes: "Winning battles against §YHeretics§! and §YHeathens§! grants §G+0.1§! bonus Army Tradition."

