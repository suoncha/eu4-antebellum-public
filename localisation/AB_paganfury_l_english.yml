### PRUTHENIA ###
# Countries #
 PRR: "Pruthenia"
 PRR_ADJ: "Pruthenian"

# Cultures #
 Balto-Wendish: "Vendaian"
 Balto-Lechitic: "Lenkian"
 Balto-German: "Vokietian"

# Ideas #
 PRR_ideas: "Pruthenian Ideas"
 PRR_ideas_start: "Pruthenian Traditions"
 PRR_ideas_bonus: "Pruthenian Ambition"
 prr_first: "The Amber Road"
 prr_first_desc: "The ancient trade route from the Baltic to the Mediterranean starts on our coastline, and merchants from both near and far stop in Tvanske before making the arduous overland journey along the Amber Road. Our position as a trading hub facilitating the transfers between overland and maritime travel has seen the growth of great entrepots in Pruthenia, all to the benefit of our state."
 prr_second: "Laukas"
 prr_second_desc: "The Pruthenian Laukas are small farms that act as collectives, ensuring mutual prosperity and safety for all farms within. Grouping more settlements together and placing them under single governance has ensured stability within farming communities, resulting in higher-quality crops and reducing the likelihood of crop failures."
 prr_third: "The Old Ways"
 prr_third_desc: "Even though the invasive practices of the Germans have established a foothold in our lands, by and large our people have stayed loyal to the old ways. Adherence to tradition has kept our people united, but now it is time to expand our faith to our wayward subjects. We shall bring them back from foreign creeds, and correct our subjects' misguided ideas."
 prr_fourth: "Repel the Germans"
 prr_fourth_desc: "Time and time again the Germans invade us, but every time we have repelled them from the greater parts of our lands. Still, they have set up a colony in Gdanskas, and from there may strike out again. But when they try to invade us again, the Germans shall find Pruthenia a fortress, an uncrackable barrier upon which their crusades will shatter like glass into the dust."
 prr_fifth: "Coastal Lagoons"
 prr_fifth_desc: "Unlike the rest of the Baltic coast, our coastline is protected by great sandspits, behind which great lagoons lie. These controlled waters allow for rapid transit of goods across our coasts without the fear of pirates and hostile fleets interrupting them, acting as extensions of the sea but under our complete control. As a result, merchants are significantly safer in our lands than elsewhere in the Baltic, giving them more incentive to trade with us."
 prr_sixth: "Ten Pruthenian Tribes"
 prr_sixth_desc: "When the crusaders first appeared on our shores we were disunified, ten separate tribes that squabbled more than cooperated. But with the repeated attempts at subjugation and conversion we have united into one strong state. Tribal identies like Paguddi, Warmi, Notangi, and others have been cast aside, and from this union we have emerged as one Pruthenian people."
 prr_seventh: "Crusader Wars"
 prr_seventh_desc: "Our military tradition has its roots in the long and arduous wars against the German Crusaders. From every defeat, every tactical retreat into the woods, we learned their tactics, and soon adapted them. Small raids on crusader caravans led to larger ambushes in the forests, till eventually we engaded them in open combat, and one. With every defeat there is a lesson, and we have mastered the art of quick adaptation to new tactics."

# Casus Bellis #
 teutonic_crusade: "Teutonic Crusade"
 teutonic_crusade_desc: "It is high time we avenge the Teutonic invasion of our lands and unleash the wrath of the Old Gods upon them."

# Decisions #
 form_baltic_title: "Form Baltia"
 form_baltic_desc: "Under the threat of German invasion, we must rally the Baltic tribes under a single leadership so that we may stand a chance against our common enemies."

# Modifiers #
 thunderer_personality: "Thunderer"
 thunderer_personality_desc: "This ruler is a Thunderer, chosen by the Old Gods to lead their armies. With thunder roaring and lightning striking down their foes, they march as a living storm upon the battlefield." 
