 GMA3_ideas_start: "Great Moravian Traditions"
 GMA3_ideas_bonus: "Great Moravian Ambition"
 gma_first: "Reform the Druzhina"
 gma_first_desc: "The core of our army is formed by Druzhina - a military unit consisting mostly of the members of the aristocracy, representing the elite and the most loyal units of our military. However, the organisation of the unit is based on a centuries old and outdated system, which is in a dire need of a reform. We must reform the organisation of the group to ensure their effectiveness on the battlefield."
 gma_second: "Carpathian Ore Mountains"
 gma_second_desc: "The Principality of Nitra possesses one of the largest deposits of gold and other precious metals in all of Europe. In order to be able to capitalise on it, we shall invite miners from abroad, and grant our towns special privileges, turning them into the Royal Mining Towns."
 gma_third: "Cities of Moravia"
 gma_third_desc: "Moravia is a rich land on the crossroads of multiple cultures and religions. This has allowed our burghers to thrive and both Veligrad and Nitra have become influential trading centres in their own right. We must do what we can to make the most of this strategic position, and to strengthen the interests of our burghers and artisans."
 gma3_third: "Cities of Moravia"
 gma3_third_desc: "Moravia is a rich land on the crossroads of multiple cultures and religions. This has allowed our burghers to thrive and both Veligrad and Nitra have become influential trading centres in their own right. We must do what we can to make the most of this strategic position, and to strengthen the interests of our burghers and artisans."
 gma2_fourth: "Rex Sclavorum"
 gma2_fourth_desc: "In 885, Pope Adrian V sent a letter to our ruler, Svatopluk I in which he granted him the title of Rex Sclavorum, the King of Slavs. This title gave Great Moravia permission and legitimacy to subjugate neighbouring Slavic nations and bring them under Moravian rule, which resulted in rapid expansion. Svatopluk almost tripled the size of Great Moravia in just a few years. The realm stretched from Lusatia all the way behind the river Tisa into Transylvania."
 gma_fourth: "Rex Sclavorum"
 gma_fourth_desc: "In 885, Pope Adrian V sent a letter to our ruler, Svatopluk I in which he granted him the title of Rex Sclavorum, the King of Slavs. This title gave Great Moravia permission and legitimacy to subjugate neighbouring Slavic nations and bring them under Moravian rule, which resulted in rapid expansion. Svatopluk almost tripled the size of Great Moravia in just a few years. The realm stretched from Lusatia all the way behind the river Tisa into Transylvania."
 gma_fifth: "Legacy of Svatopluk"
 gma_fifth_desc: "Centuries ago, long before the current powers that now dominate Europe, this region was all subdued by Great Moravia. We must cherish this legacy and build a new empire for our people."
 gma_sixth: "Princes of Nitra, Kings of Moravia"
 gma_sixth_desc: "Since the times of Rostislav, heirs to the Moravian throne were assigned to rule over the Principality of Nitra in order to gain skill and learn how to govern a nation. We must uphold this ancient tradition, as it ensures that each ruler who ascends the throne in Veligrad is already well-versed in terms of administration and governance."
 gma_seventh: "Apostle to the Slavs"
 gma_seventh_desc: "Moravia was the birthplace of the Slavic Christianity and the Glagolitic script, and served as the centre of the Slavic culture during the reign of Rostislav. The turmoil that followed after his death deprived Moravia of this status, and we have been unable to recover it ever since. However, now as no Slavic country is able to rival the might of Moravia, we shall become the heart of the Slavic world once again!"

# Reforms #
 great_moravia_reform: "Moravian Realm"
 mvanitra: "Empower the Prince of Nitra"
 mvanitra_desc: "Principality of Nitra is one of the core regions of Moravia. The Slovak lands are administered separately by a member of our dynasty, usually a heir to the Moravian throne. If we gave Nitra even more freedom, we could ensure that the future king of Moravia gains enough experience while governing the duchy so that once he ascends the throne, he will already know how to rule and govern the realm."
 mvafort: "Reinforce the Fort System"
 mvafort_desc: "Since the times of Mojmír and Rastislav, our country was well known for having very advanced fort systems. Our defense lines were very important and were also the key in our victories against the Magyar hordes. We must further reinforce and renovate the fort system, ensuring the safety of our country and its inhabitants."
 mvapohotovost: "Pohotovost"
 mvapohotovost_desc: "Pohotovost is a military force which consists mainly of lower class citizens who are usually not trained or professional warriors. However, thanks to their numbers and knowledge of the prevalent types of weapons, they represent a serious military force."
 mvasphere: "Restore the Sphere of Influence"
 mvasphere_desc: "Moravia was once the hegemon of the Slavic world. As we are slowly reclaming our status as a regional great power, we must reform our bureaucracy and prepare it for the governance of vast territories that are about to come under our sovereignty."
 mvareform: "Westernize the Administration"
 mvareform_desc: "Our current administration is centuries outdated and traces back to the times when Moravia was more of a tribal federation than an organized kingdom. It should be in our best interest to reform it based on the western example."
 mvapatriarch: "Empower the Patriarchs"
 mvapatriarch_desc: "The Moravian Patriarchate which traces its roots back to the times of Cyril & Methodius has always been the backbone of our civilization. Empowering the clergy and forming an even stronger bond with the state will benefit everyone."
 mechanic_consecrating_gives_patriarch_authority_yes: "Consecrating a Metropolitan grants §G3%§! bonus §YPatriarch Authority§!."

# Decisions #
 ab_great_moravia_title: "Form the Great Moravian Empire"
 ab_great_moravia_desc: "Since the death of Svatopluk, Moravia has been just a shade of its former glory. The Empire he built had quickly disintegrated and all the lands and nations subjugated were freed. Now that we have reclaimed the lands that once belonged to Moravia, we can finally witness the birth of a new Great Moravian Empire!"
 UNITE_SLOVIEN_CULTURE: "The culture in all §YMoravian§!, §YSlovak§! and §YPannonian§! provinces will be changed to §YSlovien§!."
 slovien_culture_title: "Unite the Slovien Nation"
 slovien_culture_desc: "When Great Moravia was formed centuries ago, the Slavic tribes which had been living in its core territory had so few differences that they could be easily considered a single tribe. Over time, this sense of cultural unity has disappeared, as the nations have started developing their distinct cultures and languages. If our country is to be a powerful player on the map of Europe, it should be in our best interest to revive the cultural unity among the Slavic tribes living in the heartland of our rising empire."

# Events #
 ab_moravia.1.t: "Rising Threat"
 ab_moravia.1.d: "Ever since their defeat in the Battle of Preslava, the Magyar tribes have lived in relative isolation, occupying the eastern plains of the Carpathian basin from where they conducted regular raids into the neighbouring countries. However, in the past months, there were no reports of such raids and so many suspect that the Magyar tribes under the leadership of the Árpád clan have been rallying their troops in a preparation of a large scale invasion. It has been suggested that we increase our military expenditures and prepare for a potential war."
 ab_moravia.1.a: "We must be ready for whatever is to come"
 ab_moravia.1.b: "We can't afford any further expenditures"
 ab_moravia.2.t: "Canonization of Rostislav I"
 ab_moravia.2.d: "The archbishopric of Moravia with its seat in Nitra has recently decided to proclaim Rostislav I a saint. He was one of the most important rulers of Moravia, initially starting his reign as a vassal of the East Frankish Emperor Louis the German, Rostislav managed to break free of the Frankish influence and consolidate his power in Moravia. Upon his initiative, the Byzantine Emperor Michael III sent Constantine and Methodius to Great Moravia, starting a religious mission which would see the birth of the Church Slavonic language and the Glagolitic script. Thanks to his hard work, Moravia was consolidated both culturally and spiritually, allowing his successors to turn this stabilized realm into a regional great power."
 ab_moravia.2.a: "A wise decision"
 ab_moravia.3.t: "Nitran Uprising"
 ab_moravia.3.d: "Believing that the throne in Veligrad is occupied by a weak and incompetent king, the Prince of Nitra with the support of the local nobles has started an uprising. The rebels have already seized the seat of the Principality of Nitra where many joined their cause. Their army is surely preparing to march on our capital. We must stop them, no matter the cost!"
 ab_moravia.3.a: "Traitors must be crushed!"
 ab_moravia.4.t: "Settlement of Zemplín"
 ab_moravia.4.d: "Our victories against the Magyar tribes have forced many of them to flee deeper into the Pannonian basin. This large movement left vast territories previously occupied by the tribes almost completely empty, which in turn led to the migration of the Slovaks who now took over much of the former Hungarian settlements in the region of Zemplín."
 ab_moravia.4.a: "Soon, they shall be completely driven out of Carpathia!"
 ab_moravia.5.t: "Restoration of the Great Moravian Empire"
 ab_moravia.5.d: "Great Moravia was a powerful union of the Slavic nations which existed in the late 9th century. From their seat in Veligrad, the great rulers of Moravia governed and expanded their vast realm, transforming it from a Frankish vassal into an independent regional power in less than 30 years. Unfortunately, after the death of Svatopluk I, the country disintegrated due to internal struggle, succession war and the invasion of the Magyar tribes. Our people greatly suffered ever since, but now, after many centuries, we have finally reclaimed what once belonged to our ancestors. Under the leadership of [Root.Monarch.GetName], who is now called [Root.Monarch.GetName] the Conqueror, the Great Moravia shall be reborn!"
 ab_moravia.5.a: "Long live the Emperor!"
 ab_moravia.7.t: "Prince of Nitra takes over Moravia"
 ab_moravia.7.d: "Following the loss of the Moravian heartland and the capital of Veligrad, the Prince of Nitra has declared independence, proclaiming that the remainder of the Moravian-controlled territories now fall under the suzerainty of the Principality of Nitra."
 ab_moravia.7.a: "Very well..."
 ab_moravia.15.t: "The Third Rome"
 ab_moravia.15.d: "With the decline of the Empire in the east, many would claim the title of Roman Emperor throughout the centuries. Greeks, Franks, Germans, Italians, Arabs, however none could restore the Empire to the place in the sun she once rested. While this might not have been the path we originally intended to follow, it seems fate has decided to bestow upon us, the Slavs, the duty to carry on this ancient institution. Indeed, the rest of the civilized world awaits our next course of action with bated breath..."
 ab_moravia.15.a: "Forevermore Rome"
 ab_moravia.16.t: "Tsar of the Romans"
 ab_moravia.16.d: "The Greek state that clung onto the mantle of Roman Emperor has long since been discarded to the dustbin of history, and with our capture of Constantinople, that fate is ever more certain. While the Moravian state may be a far cry from the glory of Rome, at least in its current form, it seems that we may be destined to inherit a great and ancient legacy."
 ab_moravia.16.a: "Their legacy is ours to claim!"
 ab_moravia.17.t: "The Birth of Pan-Slavism"
 ab_moravia.17.d: "Ever since their inception, the Slavic tribes have been disunited and quarreled with each other for the most terribly insignificant purposes. This has led to the rest of the civilized world treating us with nothing but contempt, seeing us as nothing more than barbarians beyond their borders. Well, no more! No more shall the great Slavic peoples be bent to do the will of our neighbors! We now hold it as our solemn duty to lead the Slavs on a path to become on-par, if not eclipse the powers of the west. This entails a need for unification, for if we lay divided and vulnerable, we will soon fall."
 ab_moravia.17.a: "Slava Rodu"

