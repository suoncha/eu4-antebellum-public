 rmn_united_principalities: "\n§GUnlocks§! a decision allowing you to form the §YUnited Principalities§!.\n"
 romania_fleet_crimea: "Have larger fleet than any country with its capital in the §YPontic Steppe§! region."

# Missions #
 rmn_border_title: "Border on Tisa"
 rmn_border_desc: "The damn Magyar raiders don't want to stop pestering our great nation's borders. We will have to teach them yet again just who holds the reins in Carpathia! We will take a note from the great lessons Rome has bestowed on us - A border on a river or mountain is better than any other."
 rmn_bulgaria_title: "Defeat Bulgaria"
 rmn_bulgaria_desc: "Bulgarians treated us like peasants under their rule, even though we helped in everything! It's time we pay them back for their arrogance! \n \n 'He who withstands the blows but doesn't hit back is as good as the one who falls on the first hit.'"
 rmn_convert_title: "Spread the Faith"
 rmn_convert_desc: "Orthodoxy is the kindest and warmest faith of all! The Magyars know it, Ruthenia knows it, and now everyone at home will be sure of it!"
 rmn_countryside_title: "Develop the Countryside"
 rmn_countryside_desc: "The people of the Romanian countryside deserve some love from the Government as well! We shall try to build up their towns and local institutions the best we can so that we can repay them for their gracious work!"
 rmn_crimea_title: "Conquer Crimea"
 rmn_crimea_desc: "Crimea, being the peninsular trade haven that it is, should, of course, be under our control, we wouldn't want someone to guide the merchants now, would we?"
 rmn_dobrogea_title: "Claim Dobrogea"
 rmn_dobrogea_desc: "The Bulgarians selfishly guard a huge slice of the Black Sea coast. It's time we take them down a notch and secure more beautiful ports for ourselves!"
 rmn_dominate_blacksea_title: "Dominate the Black Sea"
 rmn_dominate_blacksea_desc: "Our original plans to tighten our grip on the Black Sea through a good fleet have come to yield great rewards! Our control on maritime trade only grows, and no one seems to notice..."
 rmn_fleet_title: "Romanian Fleet"
 rmn_fleet_desc: "As we have said before - a good fleet is something we need to dominate our enemies and influence our neighbors. Not something of Albionic or Andalusian proportions, of course, just something to send a message..."
 rmn_hometrade_title: "Control Home Trade"
 rmn_hometrade_desc: "We need to be able to control our trade and markets. Any foreign influence or control on our economy should be removed! So we shall start by reforming our trade system and regulations."
 rmn_mare_title: "Romania Mare"
 rmn_mare_desc: "Romania has truly become a formidable power on the European stage. And while some pompous idiots still refuse to believe it, we have put ourselves in a very important position! We have crushed many enemies and will continue to do so as long as there is blood coursing through our veins!"
 rmn_mining_title: "Establish the Mining Towns"
 rmn_mining_desc: "The new towns we have conquered have some great resources! We need to take advantage of the riches stored within the Earth. We can use the ores found there for trade or for anything we should need. Now the only problem is that we aren't too sure how to motivate the miners to work there... Maybe we should invite them and their families to some good land and an already built house. Yes, that should be motivation enough."
 rmn_orthodox_title: "Romanian Patriarchate"
 rmn_orthodox_desc: "The people in our country are very devoted to the Lord, we should incentivize them to practice their faith by building up great churches!"
 rmn_ports_title: "Black Sea Ports"
 rmn_ports_desc: "We need to build some ports so that we can exert influence further than just our borders. A good-sized navy should be able to place us in a greater position in the Black Sea and maybe even the Mediterranean."
 rmn_principalities_title: "Principatele Unite"
 rmn_principalities_desc: "The powers outside of Wallachia and Moldavia seek to destroy both of us, in the hopes of putting us under a harsh foreign boot again. We shall not let this happen! We need the Romanian brothers and sisters to stand united against all aggression!"
 rmn_romanize_title: "Romanize Transylvania"
 rmn_romanize_desc: "Now that we have the damn land, it seems as though or informants were wholly incorrect on how many Romanians lived here - we are the minority there. We suppose we will have to 'kindly' invite the Hungarians to join us. It shouldn't prove too difficult, right?"
 rmn_romans_title: "Heir of Rome"
 rmn_romans_desc: "It's in our name for Godsake! We have removed the Bulgars from the equation, and Byzantium being long gone, it's only right that we claim the birthright that comes with our state's name! We are the true heir of Rome!"
 rmn_transylvania_title: "Conquer Transylvania"
 rmn_transylvania_desc: "True Romanians have to cower beneath the foreigner invaders that are the Magyars! We say enough is enough! Time to put an end to a great injustice..."

### NIZZARIDS ###
# Countries #
 NAZ: "Nizzarids"
 NAZ_ADJ: "Nizzarid"
 ABS: "Abbasids"
 ABS_ADJ: "Abbasid"
 TCL: "Caliphate"
 TCL_ADJ: "Caliphate"

# Ideas #
 NAZ_ideas: "Nizzarid Ideas"
 NAZ_ideas_start: "Nizzarid Traditions"
 NAZ_ideas_bonus: "Nizzarid Ambition"
 NAZ2_ideas: "Nizzarid Ideas"
 NAZ2_ideas_start: "Nizzarid Traditions"
 NAZ2_ideas_bonus: "Nizzarid Ambition"
 naz_first: "Modernised Cataphracts"
 naz_second: "Academy of Nizzar the Great"
 naz_second2: "Academy of Nizzar the Great"
 naz_third: "The Second Islamic Golden Age"
 naz_fourth: "Mediterranean Trade Monopoly"
 naz_fifth: "Nizzarid High Command"
 naz_sixth: "The Sword of Islam"
 naz_seventh: "The Right of Conquest"
 naz_first_desc: "The cavalry units that make up the backbone of our army are in visible need of modernising. We should reorganise their formation and have their armour redesigned to ensure that our Cataphracts continue to be relevant for the foreseeable future."
 naz_second_desc: "Discipline and professionalism trump all other factors in a clash of armies. No matter how much Elan an attacking force is imbued with, calm, calculated, and organised regiments will hold their own and dismantle the less professional force. The Nizzarid Sultanate's military academy, named for our founder, exists to ensure that no soldier of ours steps onto the battlefield unprepared for war."
 naz_second2_desc: "Discipline and professionalism trump all other factors in a clash of armies. No matter how much Elan an attacking force is imbued with, calm, calculated, and organised regiments will hold their own and dismantle the less professional force. The Nizzarid Sultanate's military academy, named for our founder, exists to ensure that no soldier of ours steps onto the battlefield unprepared for war."
 naz_third_desc: "The remarkable might and stability of our state is facilitating an explosion of art, culture, and economic growth not seen in this region since the Islamic golden age some centuries ago. We must make a concerted effort to sustain this unprecedented prosperity by building up our urban centres."
 naz_fourth_desc: "Mediterranean trade has always been at the heart of any Egyptian state's economy, and we are no different. In order to protect our waters from pirates and ambitious Europeans, we must charter a strong merchant navy that can protect our shores while raking in profits."
 naz_fifth_desc: "Our government and military are practically synonymous, so it is no surprise that the Sultan's most trusted advisors are veteran generals. These great military men come together to form the Nizzarid High command, a council summoned by the Sultan that manages matters of army and state during both wartime and peacetime."
 naz_sixth_desc: "The justification for the scope of our conquests has always been the unification of Dar al-Islam and the expansion of its borders. Thus, we should take no precautions when enforcing brutal demands upon the heretics and heathens whose armies we defeat and whose lands we subjugate."
 naz_seventh_desc: "War is the avenue through which our Sultan has seized the titles of Custodian, Malik, Shahanshah, and even Caliph. It is the destiny of the House of Nizzar to unite the world under its black banner in the only way we know how: by Right of Conquest!"

 ABS_ideas: "Abbasid Ideas"
 ABS_ideas_start: "Abbasid Traditions"
 ABS_ideas_bonus: "Abbasid Ambition"
 abs_first: "Abbasid Restoration"
 abs_first_desc: "After the devastating sacking of Baghdad the remnants of the Abbasid Caliphate were forced to flee to the Nizzarids in Egypt, who merely kept the Caliph as a puppet to further their own goals. No longer! With the Nizzarids gone and the Caliphate restored, it's time we reclaim our former lands, and put down all these upstarts in their place!"
 abs_second: "Reuniting the Islamic World"
 abs_second_desc: "The Islamic world has been lying in splinters for centuries, struggling against the swirling rapids around it, and with little to show. We, the true Caliphs of Islam, can change that. Under the Abbasid banner, the Muslims of the world can rejoice, as we pick up the pieces and restore out former glory."
 abs_third: "Muhammad's Bloodline"
 abs_third_desc: "The Abbasid Caliphs are descended from Abbas, the uncle of the Prophet Muhammad, thus meaning that we have a rightful claim to the Caliphate. Not only did we crush the decadent Umayyad dynasty, forcing them to flee to Iberia, but our rule marked the height of Islamic power. What more could convince the people that we are the true Caliphs?"
 abs_fourth: "Patrons of Art and Science"
 abs_fourth_desc: "Abbasid rule in Baghdad was known for its patronage of the arts and sciences, having been regarded as a golden age for Islam by many. With our restoration in Cairo, many scholars, philosophers, and more have come to seek our patronage like others did long ago. Soon we shall see the flourishing of a second golden age."
 abs_fifth: "Bureau of Confiscation"
 abs_fifth_desc: "By looking back to some of the old Persian traditions, we must revive the “Bureau of Confiscation” as a legitimate section of the Abbasid government. This bureau shall serve to punish and deter corruption within the state apparatus, seizing assets from the lowest city official to the Grand Vizier himself, if they are found to have done wrong by the Caliph."
 abs_sixth: "Islamic Literature"
 abs_sixth_desc: "Literature of the first Abbasid Caliphate had a profound impact on the court. Poetry and prose were major ways of expression culture during those times. We should make it easier for up-and-coming poets to publish their works by funding and promoting scholars who show potential"
 abs_seventh: "Martial Resurgence"
 abs_seventh_desc: "During the reign of the Nizzarids, the military was turned into an arm of the state with unrivalled power. With them out of the picture, we could easily refine the forces of Egypt from an incohesive patchwork of different religions and cultures into the fist of the Caliph; an unmatched army of fearless warriors unified for one purpose – to bring glory to Allah!"

# Reforms #
 nizzarid_coup: "Military Coup"
 nizzarid_dynasty: "Nizzarid Stratocracy"
 nizzarid_dynasty_desc: "The Nizzarid Sultanate is truly an anomaly in the world; a state built to sustain an army, which in and of itself exists solely to serve its dynastic sovereign. Indeed, while the position of Sultan is an inherited one, the Crown Prince must serve with distinction and earn the army's respect, lest they lose a significant amount of internal support."
 ability_nizzarid_interaction_mechanic: "Nizzarid Interactions"
 nazcavalry: "New Hetairoi Cavalry"
 nazcavalry_desc: "Alexander the Great, the renowned Greek warrior-king from Antiquity, has been the focal point of a Nizzarid cult of personality since the dynasty's founding. Through imitating history's greatest conqueror and his father Philip II, whilst also appeasing the abundant population of Copts in Egypt by offering high ranking military employment, the establishing of an elite cavalry force based directly upon the Argead Hetairoi cavalry is deemed a necessary investment."
 nazcoptic: "Coptic Intelligentsia"
 nazcoptic_desc: "The Coptic people are among the last remaining descendants of the Old Egyptians and their Greco-Roman overlords, and thus maintain an important position within the Nizzarid hierarchy. In no small part due to their significant population within Egypt's borders, the Coptic leadership must be placated with extravagant titles and a place in high society. By composing the bureaucratic and learned classes, the Copts' legacy will truly be honoured to its fullest."
 nazsecularism: "Premodern Secularism"
 nazsecularism_desc: "The Nizzarid state is one which functions - in no small part - due to the high tolerance towards the various religions and cultures under its rule. Some have gone so far as to accuse the Sultanate of heresy for effectively separating clerical and governing bodies, but they pulled fleece over their own eyes. The Nizzarids shall not risk denying Egypt's pre-Islamic heritage and people, instead weaving them into the fabric of the new state as equals."
 nazcaliph: "Puppet Caliph"
 nazcaliph_desc: "The Nizzarid Sultanate is on paper be ruled by a Muslim dynasty, with a sizeable Muslim population ekeing out a slim majority over the Copts. Contrary to what may otherwise be assumed, though, Nizzar's Egypt is one of unprecedented cultural and religious tolerance and syncretism. Despite this, their ongoing diplomatic and trade rivalry with neighbouring Islamic powers has necessitated a certain... compromise. Lo and behold, the Abbasid dynasty, having fled Baghdad in the wake of the Mongol invasions, have made Cairo their home. Ultimately puppets of the Sultan residing in a gilded cage, the mere presence of the Abbasids nonetheless affords the House of Nizzar much prestige in both a political and spiritual sense."
 naznomarchy: "Restored Nomarchy"
 naznomarchy_desc: "The Egyptian kingdom has for most of its history been viewed as a union of two lands; Upper and Lower Egypt. After the Ptolemaic period the lands were further divided into administrative districts referred to as Nomes, which were governed by a Nomarch. With the Nizzarid state's need to further improve state function and their dogged syncretism of pre and post-Arab customs, an overhauled system based on the Nomarchy of old may be just what we need."
 nazarab: "Arab Trade Caravans"
 nazarab_desc: "As shrewd traders and rugged travelers, Arabs perform the lion's share of commerce work in the Nizzarid state. With their unrivalled knowledge of desert traversal and a variety of exotic goods to exchange, the economy of Egypt will once more become peerless; the Pearl of the Near East. May our coffers never go empty again!"
 nazmamluks: "Mamluks under Heel"
 nazmamluks_desc: "The Mamluks, the warrior-slave caste, have been none too cooperative - even with the luxuries afforded to them by a tolerant administration. While the Copts, Arabs, and other 'free' groups have caused no trouble thusfar, the new generations of Mamluks are a magazine ready to detonate. The corvee system of old must be reworked and the role of the Mamluks in Egyptian harshly curbed, lest we end up weak like the Ayyubids. Through the gradual Egyptification and immediate disarmament of these slaves, they may yet learn their place in a Nizzarid world. They would evidently serve a better purpose improving infrastructure and agriculture while not at war, being granted permanent wages when called to act as fodder in our battles."
 nazmaat: "Ma'at and Kenbet"
 nazmaat_desc: "In New Kingdom Egypt, the concepts of justice, order, right, and wrong were encompassed by the concept of Ma'at. Though named after an Infidel 'goddess', the idea itself may bear some weight in the reformed Nizzarid legal code. By implementing morality and common sense-based laws adapted from Ma'at, we can then arbitrate legal issues under Kenbets; courts run by village elders and - in extreme cases - the Vizier, or His Majesty himself. This would permit a decentralised justice system which would nonetheless be under the Sultan's thumb."
 nizzarid_dip_interaction: "Rattle the Gilded Cage"
 nizzarid_dip_interaction_desc: " "
 NAZ_ABILITY_TRUST: "Gain §G10§! trust with every known non-rival §YMuslim§! nation in the world."
 naz_abbasid_caliph: "Caliph's Authority"
 nizzarid_mil_interaction: "Conscript a General"
 nizzarid_mil_interaction_desc: " "
 naz_general: "Empower the Stratocracy"
 NAZ_ABILITY_NATIONALISM: "Every owned §YHeathen§! province gains §G-10.0§! Years of Separatism."
