### MORAVIA ###
# Countries #
 GMA: "Great Moravia"
 GMA_ADJ: "Great Moravian"
 RENAME_SLOVAKIA: "Slovakia"
 RENAME_SLOVAKIA_ADJ: "Slovak"

# Cultures #
 Moravian: "Moravian"

# Casus Bellis #
 cb_mva_fate_empire: "Imperial Orthodoxy"
 cb_mva_fate_empire_desc: "The princes of the Holy Roman Empire must follow the Orthodox faith!"
 cb_religious_conformance_desc: "Purge the heretics!"

# Ideas #
 mva_first: "Druzhina"
 mva_first_desc: "The army group known as Druzhina consists of members of aristocracy and members of princely military groups. Some of its members form a permanent armed guard for the prince, while the rest are garrisoned at the forts in the castle system or at other strategic points. The druzhina is a loyal unit and provides stable support for the ruler."
 mva_second: "Triumph at Brezalauspurc"
 mva_second_desc: "In 907 AD, Moravians with their Bavarian allies managed to defeat the Hungarian armies and stop their conquest of the Carpathian basin. Eventually, this victory saved Great Moravia which was already having internal problems and in the end, made the Hungarians retreat all the way back behind the Danube which they never dared to cross again."
 mva_fifth: "The Amber Road"
 mva_fifth_desc: "The core of our country lies on the important Amer Road which was used to transfer amber from the Baltic to the Mediterranean sea."
 mva_sixth: "Rex Sclavorum"
 mva_sixth_desc: "In 885, Pope Adrian V sent a letter to our ruler, Svatopluk I in which he granted him the title of Rex Sclavorum, the King of Slavs. This title gave Great Moravia permission and legitimacy to subjugate neighbouring Slavic nations and bring them under Moravian rule, which resulted in rapid expansion. Svatopluk almost tripled the size of Great Moravia in just a few years. The realm stretched from Lusatia all the way behind the river Tisa into Transylvania."

 GMA_ideas: "Great Moravian Ideas"
 GMA_ideas_start: "Great Moravian Traditions"
