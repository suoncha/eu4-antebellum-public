# Decisions #
 bulgaria_ruthenia_title: "Restore Ruthenia"
 bulgaria_ruthenia_desc: "This decision allows us to release Ruthenia as a junior partner in the personal union."
 bulgaria_moravia_title: "Restore Great Moravia"
 bulgaria_moravia_desc: "This decision allows us to release Great Moravia as a junior partner in the personal union."
 proclaim_bulgarian_empire_title: "Embrace the Imperial Title"
 proclaim_bulgarian_empire_desc: "We have proclaimed the Third Bulgarian Empire and it is now up to us whether we want to fully embrace the imperial titles and rename our realm to Bulgarian Empire."
 form_illyria_title: "Form Illyria"
 form_illyria_desc: "The Illyrian movement has ignited a desire to unite all of South Slavs under a single crown. We must enter a union with our Slavic brethren of the Balkans and forge a brighter future for our nations."

# Events #
 ab_bulgaria.1.t: "Fall of Constantinople"
 ab_bulgaria.1.d: "The stench of death fills the air and the Golden Horn runs red with blood. As the walls of Constantinople shattered beneath the blows of our war machines, our men poured forth, engulfing the desperate garrisons. The ensuing bloodshed soon consumed the entire city. At some point, our Shtitonostzi broke free from their ranks to pursue a burgeoning melee in the Sacred Palace, the abandoned home of Constantine I himself. The decrepit building soon found itself alight, be it by sabotage or circumstance and the resulting flames consumed half of the city, as if Constantine's sadness and subsequent malice had rained down from the heavens to punish his decadent descendants. Miraculously, the Hagia Sophia was unharmed, despite its adjacency to the Sacred Palace. Not only has the garrison been wholly annihilated, but so has the city's approximate population of 50,000 assorted Greeks. Thousands have fled and many more have been slain. With the city's administrative and noble population thoroughly destroyed, Boyar men and scores of Bulgar peasants have swept through the streets, claiming property and new governmental positions alike, thoroughly and irreversibly changing the city's demographics. Given the newfound proliferation of the Bulgar tongue in and around the city, as well as along the freshly-secured trade routes, Constantinople has been unofficially and colloquially branded with a new name, far-removed from the language prior - Tsarigrad."
 ab_bulgaria.1.a: "Long live the Tsar!"
 ab_bulgaria.2.t: "Unification of the Southern Slavs"
 ab_bulgaria.2.d: "For centuries, the Slavic world, especially its southernmost extent, has been at the behest of foreign powers, particularly the Byzantines. Outsiders have historically run diplomatic and technological circles around our humble kingdoms, picking at our traditions, native faiths and ways of life until we were mere cannibalized shells of peoples; bullied diplomatically and economically in order to ward off our 'primitive wrath' and gradually changed into new cultures and countries entirely, swallowed up and integrated into the Orthodox world. This need not be grim, however. We were always a mighty and cunning people. We might have been behind the times and outmatched technologically, but this is true no longer. The Southern Slavs now find themselves united beneath a common banner. Free from the oppressive outsiders, our burgeoning empire finds newfound respect in the eyes of its neighbors. At long last, from the most humble of peasants to the most divine of kings, all recognise the united cultural hegemony we have pursued."
 ab_bulgaria.2.a: "Slava Rodu!"
 ab_bulgaria.3.t: "The Third Rome"
 ab_bulgaria.3.d: "The Roman Empire has faded into the past. Sorry kingdoms, bumbling rump states and charlatan conquerors have tried and failed to claim the title of Rome for themselves. All over Europe, one never ceases to encounter claimants. To one's horror, the number of claimants seems to correspond well with the justification and quality of the claims themselves; never has it been more true that the more there is of something, the less value it holds. However - one claim shines in a sea of the lost and embittered. One claim stands tall, towering over the ancient forests of Eastern Europe, looming over every petty lord's palace and humble hillfort. From our bustling and proud capital, a song is sung - that of a new Rome, a Third Rome, a Rome triumphant and reborn. A Rome of Christ, an Orthodox and true Christ at that, seeking to unify, envelop and protect the Orthodox world in its totality. In the name of all Bulgars, all Slavs and all true and tried Christians, we proclaim Rome reborn - with us at its helm."
 ab_bulgaria.3.a: "Forevermore Rome"
 ab_bulgaria.4.t: "Appointment of a Kavkhan"
 ab_bulgaria.4.d: "Dating back to the days of Kubrat Khan and the founding of Old Great Bulgaria, our [Root.Monarch.GetTitle] is never without a Kavkhan as his right hand. From the old illustrious families of the Kavkhan Kin, to dynamic appointees of their own merit, our Kavkhan have always been the foremost advisors of our great ruler; even co-rulers when necessary. Yet, with historical duties ranging from judge, to diplomat, to commander-in-chief of our army, we need to choose the focus of the Kavkhan’s role for [Root.Monarch.GetName]’s reign."
 ab_bulgaria.4.a: "In the mould of Isbul, an administrator and builder of great works."
 ab_bulgaria.4.b: "We shall follow the example of Peter, sending diplomatic missions far and wide."
 ab_bulgaria.4.c: "A new Georgi shall lead our armies!"

