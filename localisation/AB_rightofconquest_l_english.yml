# Ideas #
 OTR_ideas: "Outremer Ideas"
 OTR_ideas_start: "Outremer Traditions"
 OTR_ideas_bonus: "Outremer Ambition"
 otr_first: "Legacy of the Crusades"
 otr_first_desc: "The Crusades were some of the most hard-fought conflicts between Christian and Muslim interests in the Near East, but in the end there can be only one victor. Our Empire is proof that God was with Christendom, and we celebrate the victories He brought us."
 otr_second: "Melting Pot"
 otr_second_desc: "Despite Christian hegemony in the Holy Land, there has been much cross-cultural exchange in the region between the Latins and locals. It is becoming apparent that we and the Saracens are alike in more ways than initially thought, but this might not be such a bad thing."
 otr_third: "Integration of Knightly Orders"
 otr_third_desc: "A vast multitude of Chivalric Orders have set their roots in the Holy Land, protecting the faithful and spreading the word of God by prayer and swordpoint. The old Crusader States’ heavy reliance upon them as elite, mobile shock troops has made them yet another arm of the military in all but name. It is time to formally integrate these brave warriors of God into our ranks."
 otr_fourth: "Market of Tyre"
 otr_fourth_desc: "One of the most important trading cities in the Near East, the venerable city of Tyre is well and truly a key asset to continued Outremer success. A producer of some of the world’s finest silks, dyes, and other luxury goods, the bustling markets rake in enough wealth to field an army with gold to spare."
 otr_fifth: "The Latin Patriarchates"
 otr_fifth_desc: "Truly symbolic of the Catholic Church’s legitimacy, the Latin Patriarchates of the Holy Land oversee Levantine ecclesiastical matters, often holding sway over secular affairs to boot. Their continued existence grants the Outremer closer ties to Rome than most, ensuring that we have the ear of at least somebody in the Holy See."
 otr_sixth: "Outremer Fortress Cities"
 otr_sixth_desc: "In regards to the constant warfare against the unspeakable Saracen, the Crusader States began a tradition of turning their most crucial cities into mighty bastions against which none but the mighty (and expensive) bombard could hope to breach. As the Outremer continues to expand and face new enemies, we must be prepared to fortify our strategic assets as if they were Constantinople herself!"
 otr_seventh: "Why do the Heathen Rage?"
 otr_seventh_desc: "Why do the heathen rage, and the people imagine a vain thing?\n The kings of the earth set themselves, and the rulers take counsel together, against the Lord, and against his anointed, saying,\n Let us break their bands asunder, and cast away their cords from us.\n He that sitteth in the heavens shall laugh: the Lord shall have them in derision."
 OTR2_ideas: "Outremer Ideas"
 OTR2_ideas_start: "Outremer Traditions"
 OTR2_ideas_bonus: "Outremer Ambition"
