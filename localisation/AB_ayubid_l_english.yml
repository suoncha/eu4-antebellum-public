### AYYUBIDS ###
# Ideas #
 hsn_rise_of_the_eagle: "Rise of the Eagle"
 hsn_rise_of_the_eagle_desc: "The time has come to reclaim what was once lost by our ancestors. Let us act now to reclaim the empire that once was, and to create a strong Sunni bulwark against Infidel, Shia, and traitors alike in the Middle East."

# Reforms #
 hsnscholars: "Invite Western Scholars"
 hsnscholars_desc: "The western scholars of Europe follow a religion that disgraces the word of Allah which is very unfortunate, and to most it would be enough of a reason to keep them as far from their lands as humanly possible, thankfully we are much more wise than that. They may spew heresy but among those words are those of wisdom, ever since the Mongols sacked the Middle East, the Islamic Golden age has ended, and Christian Europe has been slowly but surely surpassing us in terms of engineering, medicine and math, in times like these we should seek the wisdom of these people."
 hsnatabegs: "Assign Atabegs"
 hsnatabegs_desc: "When the Seljuks rolled through the region they needed a way to govern those they conquered, Atabegs were their answer, nobles of Turkic blood that would govern an entire region, by Seljuk law they would even start their own dynasties in those regions which connected their family's destiny to regions of governance, this reduced any ambition which might have hurt the ruler otherwise. By employing a similar system in our conquered territories our administrative pressure would decrease significantly."
 hsnwaqf: "Waqf Donations"
 hsnwaqf_desc: "Waqf is a donation of money or property for religious reasons, as the Abbasids we are the true representatives of the Sword of Islam and thus have the right to encourage and exploit these donations in our favor, let's do just that!"
 hsntolerate: "Tolerate Religious Minorities"
 hsntolerate_desc: "Anatolia is not Arabia, unlike Arabia this place is not almost solely dominated by the servants of Allah, instead the region is packed to the brim with Orthodox Christians, Coptic Christians, Zoroastrians and many even smaller regional beliefs, instead of slamming our head against a wall by trying to convert each and every religious minority, destabilizing our country in the process, we should instead encourage those communities to preach whatever they want without state oppression."
 hsnmadrasa: "Madrasa and Madhab Schools"
 hsnmadrasa_desc: "Both Madrasa and Madhab schools have very similar purposes, to not only teach the children of Allah how to be better believers by making them learn the Quaran and Islamic law, but also educating them in science and in the Arabic language, we should focus our finances and efforts into the construction and expansion of such schools across our nation so that our citizens are the smartest they could be." 

# Events #
 ab_ayyubids.2.t: "Execution of the Nizzarids"
 ab_ayyubids.2.d: "Once, long ago, we were the masters of Egypt and Syria, the keepers of the Holy Cities, and the scourge of the Christian invaders. We were the sword of Allah, and enacted his will upon the heathens of the land; until the betrayal of Nizzar the Pretender. His betrayal, his conquest of our lands, had us reduced to nothing but a fortified city, forced to lick our wounds for the next hundreds of years; but now, our armies descended upon the city of Iskandariyya, the capital of these traitors, with no intention of sparing any life, no intention of quarter. The bloodshed left by our armies in the streets left a clear message, that the true rulers of the land returned. Years of warfare, all with the goal of retaking the lands of our kingdom from these traitors, it all culminates here. Once more, we are the masters of Egypt and Syria. Once more, we are the sword of Allah."
 ab_ayyubids.2.a: "The traitor's bloodline has been broken." 

# Modifiers #
 hsn_islam: "Sword of Islam"
 hsn_traitors_defeated: "Defeated the Traitors"
 hsn_convert_assyrians: "Convert the Assyrians"
 hsn_seljuk_janissaries: "Seljuk Janissaries"
 hsn_mongol_reinforcements: "Mongolic Reinforcements"

# Missions #
 hsn_branching1_title: "Branching Mission"
 hsn_branching1_desc: "This mission can be unlocked by completing the '§YFate of Anatolia§!' mission."
 HSN_UNLOCK_BRANCH1_TRIGGER: "This mission can be unlocked by completing the '§YFate of Anatolia§!' mission."
 hsn_branching2_title: "Branching Mission"
 hsn_branching2_desc: "This mission can be unlocked by completing the '§YThe Sultan and the Shah§!' mission."
 HSN_UNLOCK_BRANCH2_TRIGGER: "This mission can be unlocked by completing the '§YThe Sultan and the Shah§!' mission."
 hsn_ab_sublime_alliance_title: "[Root.GetPreviewColorHSN]A Sublime Alliance[Root.GetPreviewColorHSN_end]"
 hsn_ab_sublime_alliance_desc: "Turks who control much of Anatolia would certainly be a valuable ally, securing our northern borders so that we could concentrate on reclaiming our ancestral lands in the Levant."
 hsn_ab_overthrow_the_ottomans_title: "[Root.GetPreviewColorHSN]Anatolian Domination[Root.GetPreviewColorHSN_end]"
 hsn_ab_overthrow_the_ottomans_desc: "The Turks seem to be one of the most powerful nations in the entire Islamic world, but they should be aware of the fact that their era of domination is about to abruptly end. The Ayyubid armies shall march into Anatolia and bring this region under the rule of the eagle." 
 hsn_conquer_syria_title: "Reclaim Syria"
 hsn_conquer_syria_desc: "The bed of Ayuubid power has fallen out of our hands ever since the Nizzarid coup. As our realm has managed to grow in the last few decades grander there are dreams in our court of returning to our home of power - the place where most of our power lied in. Syria must return to Ayuubid, and with it Damascus.\n\nSaladin, your descendants are coming home.\n Saladin, Ayuubids are coming home.\n Saladin, we are coming home."
 hsn_destroy_title: "End Nizzar's Bloodline"
 hsn_destroy_desc: "Some would say our sultan might be too harsh, but those 'some' are no longer with us as they were persecuted for being Nizzarid spies. The Nizzarids are vile revolters that took from us our rightful Sultanate. Now that we are returning to Egypt there is only one type of fate that is suitable for traitors and rebels: Extinction of an entire family."
 hsn_jalayirids_title: "Fall of the House of Jalayir"
 hsn_jalayirids_desc: "The Jalayirids are one of the strongest powers in the region, aspiring to take over both Iran and the Mashriq in the aftermath of the Ilkhanid collapse. We must overcome this formidable foe to assert our dominance over the region and unlock a pathway to Persia."
 hsn_control_nineveh_title: "Control Nineveh"
 hsn_control_nineveh_desc: "The Assyrians are one of the weakest nations in our neighbourhood. They are an easy prey and Nineveh would make a valuable addition to our rising empire."

