# Ideas #
 YUC_ideas: "Great Yuan Ideas"
 YUC_ideas_start: "Great Yuan Traditions"
 YUC_ideas_bonus: "Great Yuan Ambition"
 YUC2_ideas: "Great Yuan Ideas"
 YUC2_ideas_start: "Great Yuan Traditions"
 YUC2_ideas_bonus: "Great Yuan Ambition"
 yuc_first: "Reclaim the Southern Empire"
 yuc_first_desc: "By nature, the further subjects are from their imperial overlord, the more likely they are to feel disconnected or even rebellious. Subsequently, the southernmost provinces of our empire have largely broken off into independent princedoms, which we must vanquish if we are to restore our legitimacy as emperors of China."
 yuc_second: "The Mandate of Heaven"
 yuc_second_desc: "Though many in the Confuncian bureaucracy first viewed us as foreign pretenders to the Dragon's Throne, after centuries of rule, we are largely recognized as the legitimate suzerains of the Middle Kingdom, increasing the level of cooperation between ourselves, our tributaries, and our domestic subjects."
 yuc_third: "Protect the Imperial Borders"
 yuc_third_desc: "Though we were grateful for the weakened state of the Chinese border when we first invaded this land, in order to ensure that we do not suffer the same fate, we must maintain the strength of the great wall, and enlist a strong border patrol to guard it."
 yuc_fourth: "A Harmonious Society"
 yuc_fourth_desc: "The culture of Great Yuan is a synthesis of Mongol and Chinese traditions, blending Confucianist and traditional Tengri teachings into a new philosophy that has allowed us to maintain order in the realm."
 yuc_fifth: "Sino-Mongol Military"
 yuc_fifth_desc: "Our state will create a strong military tradition by blending the ideas of Mongol meritocratic recruitment with Chinese bureaucratic military institutions."
 yuc2_fifth: "Sino-Mongol Military"
 yuc2_fifth_desc: "Our state will create a strong military tradition by blending the ideas of Mongol meritocratic recruitment with Chinese bureaucratic military institutions."
 yuc_sixth: "Reform the Tributary System"
 yuc_sixth_desc: "Historically, the tributaries of Chinese Empires have been independent states whose only allegiance to the Emperor is their yearly tribute, in exchange for military protection. This is not a fair deal. We will demand fealty from the tributaries and force them to work for us, rather than the opposite."
 yuc_seventh: "The Waking Giant"
 yuc_seventh_desc: "For generations, China has been the world's most populous region. This, however, has not been conducive to a large base of soldiers. Most men never fight, but under our rule, this shall change."
 YUA2_ideas: "Great Yuan Ideas"
 YUA2_ideas_start: "Great Yuan Traditions"
 YUA2_ideas_bonus: "Great Yuan Ambition"
 yua2_keshik_and_weijun: "Keshik and Weijun"
 yua2_keshik_and_weijun_desc: "As the One Khagan of all Hordes our ruler should be accompanied by his Keshiktens, and as the Son of Heaven over the Middle Kingdom he is to be defended by Weijun, the Imperial Guards. They are the two wings of our leader, and will balance each other's power as factions in our state.\n"
 YUN_ideas: "Great Yuan Ideas"
 YUN_ideas_start: "Great Yuan Traditions"
 YUN_ideas_bonus: "Great Yuan Ambition"
 YUN2_ideas: "Great Yuan Ideas"
 YUN2_ideas_start: "Great Yuan Traditions"
 YUN2_ideas_bonus: "Great Yuan Ambition"
 yun_first: "The Apostolic Mission"
 yun_first_desc: "Despite embracing the Nestorian Church as the state religion, a significant amount of the rural population still clings onto the false idols of Tengri shamanism. Our missionaries are now tasked with converting the heathenry, and shall be granted the necessary authority to carry out their mission without interruption."
 yun_second: "Redefine the Mandate of Heaven"
 yun_second_desc: "The traditional doctrine concerning the Mandate of Heaven is that the emperor is a demi-god; the Son of Heaven.  While this dogma is blatantly heretical, we need only redefine his role into God’s messenger on Earth, thus securing the best of both worlds."
 yun_third: "Protect the Imperial Borders"
 yun_third_desc: "As sovereigns of China, our primary duty is to ensure the security of our people against threats – both internal and external. With the southern warlords and steppe nomads making moves against our state, securing the borders is absolutely critical."
 yun2_third: "Protect the Imperial Borders"
 yun2_third_desc: "As sovereigns of China, our primary duty is to ensure the security of our people against threats – both internal and external. With the southern warlords and steppe nomads making moves against our state, securing the borders is absolutely critical."
 yun_fourth: "The Sword of Christendom"
 yun_fourth_desc: "Nestorianism has never been the most widely accepted faith in the Far East, nor will it be, unless we are willing to take on the role as champions of Saint Nestorius. As the orient’s last bastion of the true faith, we must take up the Sword of Christendom!"
 yun_fifth: "Sino-Mongol Military"
 yun_fifth_desc: "As both Emperor of China and Khagan of the Mongol Empire, we are in the perfect position to foster a united identity. Though Prince Nayan would have shuddered at the thought of creating a Sino-Mongolic state, it is - at the very least - a prudent way of securing the loyalty of our armies without abandoning our heritage entirely."
 yun_sixth: "Reform the Tributary System"
 yun_sixth_desc: "The tributary system of the old Mongol Empire is archaic, and often gives too much autonomy to those under our yoke. We should know, given our role in Nayan’s Rebellion, that the very possibility of rising in revolt cannot be permitted. Gold shall continue to flow, yes, but the contract between overlord and tributary will be revised extensively so as to ensure total obedience."
 yun_seventh: "Warriors of the Cross"
 yun_seventh_desc: "Already the wielders of the Sword of Christendom, our mighty armies march towards the enemy in unwavering faith, knowing full well that the Lord is watching. With tales of their deeds spreading like wildfire each time campaign season ends, more fresh volunteers take to the recruiting stations, wishing to fight under the Cross like good and honourable Christians. God is good, and so is manpower."

# Reforms #
 yuainward: "Inward Perfection"
 yuainward_desc: "Confucian teachings stipulate that the ideal man should have superior ethics and morals compared to their peers, thus gaining inner peace by keeping the peace externally. This philosophy is demonstrated by the term 'inward perfection': focusing solely on the self and the nation."
 mechanic_inward_mechanics_yes: "§GUnlocks§! Inward Perfection Missions\nDeveloping a province has a §G10%§! chance of granting §G1§! additional development\nGain §R+50%§! land maintenance modifier, §R5§! global unrest and §R+0.05§! monthly war exhaustion while at war\n\nCompleting the entire §YInward Perfection§! mission tree branch §Gunlocks§! a §Ydecision§! to abandon the government reform."
 yuakurultai: "Reform the Kurultai"
 yuakurultai_desc: "The Kurultai council is a core aspect of the Mongol culture, especially its function as an election of the Khans. If we wish to keep our mighty Empire intact, we are bound to reform this election, ensuring that the most competent person is always elected to rule."
 yuatolerance: "Decree of Religious Tolerance"
 yuatolerance_desc: "Our vast Empire is home to people of many faiths; Nestorians, Buddhists, Confucians and many more. Since religion can cause a lot of trouble, we should make an effort to minimize the chances of religious turmoil by passing a decree which would guarantee the rights of our religious minorities."
 yuachinese: "Sino-Mongol Coexistence"
 yuachinese_desc: "Although the Great Yuan has turned back to its roots following the passing of Emperor Shaozong, we are still in control of vast lands inhabited by the Chinese population; the lands which will only grow in size as our leaders prepare for their reconquest of the Middle Kingdom. In order to prevent ethnic tensions, we must strive to find a way to live side by side in peace."
 yuasaddle: "Life in the Saddle"
 yuasaddle_desc: "Since the dawn of history, the horses were an integral part of Mongol society. Our nomadic ancestors traveled on their backs with their flocks of sheep, goats and cattle over the immense plains of Mongolia and Central Asia. In times of war, the horses carried our men to numerous victories and even the greatest Khagans of the past ruled their vast empires on the horseback. We must further emphasize this tradition and make the cavalry even more important and deadly part of our military."
 yuasemu: "Reorganize the Semu"
 yuasemu_desc: "The Semu are a diverse group of peoples originating mainly from Western and Central Asia. They are loyal followers of the great Mongol Empire ever since our first days of conquest of China. With a new reorganization of the Semu class, we would gain a group of reliable administrators and government officials to govern over Han Chinese lands."
 yuatradition: "Mongol Military Traditions"
 yuatradition_desc: "Even though we have mostly turned away from the Tribal lifestyle, the old military ways have proven their worth when we first conquered large swathes of land. Instead of reforming our military based on the Chinese model, we shall keep the core of our military formed around the Mongol cavalry."
 yuaclasses: "Abolish the Four Classes"
 yuaclasses_desc: "During the rule of the mighty Khan Kublai, a hierarchy of reliability was introduced in China which divided the society into four classes; The ruling Mongols, non-Mongol foreigners of various ethnic and religious backgrounds, Han Chinese and Southerners who represented all subjects of the former Song dynasty. This system caused a lot of tension and raised distrust amongst the non-Mongol inhabitants of the empire. If we wish to rebuild the mighty empire of our ancestors, we must ensure that the state is strong and unified, and such class system has no place in it."
 yuamovable: "Introduce the Movable Type"
 yuamovable_desc: "The printing press is a useful invention, especially for a nation as large as ours in terms of population. We shall embrace it if we are to print imperial degrees at a quicker pace and be more adaptable to the situations we may face."
 yuatianming: "Reinforce the Tianming"
 yuatianming_desc: "Heaven – which embodies the natural order and will of the universe – bestows the mandate on a just ruler of China, the 'Son of Heaven'. It is what gives us legitimacy to rule over the Chinese population. We ought to reinforce the Tianming to help keep our rule solidified."
 yuaxanadu: "The Xanadu Gun"
 yuaxanadu_desc: "The Xanadu Gun is the oldest form of gun that the Chinese have invented. It is a beautiful, powerful but heavy tool. We ought to employ shocktroops in our army that will be fielded with Xanadu guns. Their production shall be streamlined and made less heavy to make them more practical to give us an edge over our foes."

# Decisions #
 yua_move_capital_title: "Move the Capital to Qaraqorum"
 yua_move_capital_desc: "A decision allowing us to relocate our capital city."

# Events #
 ab_yuandisaster.1.t: "Dongdin's Supporters Rise in Revolt"
 ab_yuandisaster.1.d: "Declaring their eternal support for Prince Dongdin, a clique of upset nobles has raised the flag of rebellion from their primary stronghold in Xuzhou. This comes as little surprise to our administration, as rival claimants to the Dragon Throne have been greatly disgruntled ever since we held the disastrous Kurultai. While it was intended to solidify a line of succession, all it did was reduce the clans to a bickering mess. Unfortunately, with the imperial administration's hands tied with red tape and prior domestic troubles, these treasonous worms have been able to quickly seize control of the provincial capital and muster a sizeable host. Even with everything collapsing around us, and the army in disarray, it would be most prudent to throw whatever we can at these pretenders, lest they spread across the region and popular support swings to their favour."
 ab_yuandisaster.1.a: "They will pay for their treachery!"
 ab_yuandisaster.2.t: "Mongol Tribes Come to Aid"
 ab_yuandisaster.2.d: "With men deserting the army every day, leaving the Great Yuan with a paper force of ghost soldiers, every scrap of manpower we can scrounge together counts. With our desperate plight finally sinking in for the few loyal subjects left, they have finally banded together to take action. A number of Mongol clans, who have backed our regime ever since the pretender dispute blew up, recently offered to dispatch a large force of their own troops as reinforcements. Their hope is that, with an influx of fresh soldiers, morale within our army's ranks can begin to recover. Time will only tell if this proves effective, but at the very least we can put these volunteers to good use."
 ab_yuandisaster.2.a: "Very good!"
 ab_yuandisaster.3.t: "Bureaucratic Protest"
 ab_yuandisaster.3.d: "Our bloated and oftentimes labyrinthine government is no stranger to treason and conspiracy, but in crises such as this, where every man must do his part with diligence, it is always the learned who prove a nuisance. Despite previous emperors allowing government officials' blatant skimming money off the top of revenue - and their colleagues' salaries - many of the Great Yuan's bureaucrats have taken to protesting our rule. Even though these overpaid ingrates earn more than our most elite cavalry forces, they dare to complain about long work hours, and of less pay than usual! As if we weren't in the middle of a gruelling civil war! What's worse, the ringleaders of this mutiny have banded together with one of the rebel factions, meaning we must now face off against pretenders who know our state inside and out."
 ab_yuandisaster.3.a: "Well then"
 ab_yuandisaster.4.t: "Jurchens and Mongols Recognize Temur"
 ab_yuandisaster.4.d: "In light of the heavy resistance against our great emperor Temur's rightful claim to the Dragon Throne, many of the Jurchen and Mongolic clans have been forced to make a stand in the conflict within Great Yuan's borders. Far too many have joined the side of our foes, actively trying to oppose Yuan's hegemony, however more still come clamouring to our faction. In particular, Mongol chiefs and civilised Jurchens have proclaimed their recognition - in perpetuity - of Temur's legitimacy as the Son of Heaven, and as the rightful holder of the Mandate of Heaven. Whether this is merely due to our proximity to their own territory, or perhaps stems from shared ideals of a traditional Mongol Empire, we cannot say. At the very least, this affirmation of our sovereignty over most of the tribes is surely a sign from above that we bear the sole right to rule!"
 ab_yuandisaster.4.a: "Well chosen"
 ab_yuandisaster.5.t: "Revolt of the Duke of Shun"
 ab_yuandisaster.5.d: "The Duke of Shun is a consistent thorn in our side; questionable loyalties aside, he is an utter drain on resources just to keep in check. With the Han warlords attempting to provoke our subjects in the south into rebelling, it appears that the Duke has finally made his move, and intends to secede entirely from the Great Yuan's sphere of influence. Having revealed his true allegiance, it is now imperative that we destroy his forces, pacify the region, and ensure the traitor's head is mounted on a pike in Khanbaliq. Should we fail, the precedent of Shun's victory could prove catastrophic across all territories of the Great Mongol State."
 ab_yuandisaster.5.a: "Off with his head!"
 ab_yuandisaster.6.t: "Peasant Uprising"
 ab_yuandisaster.6.d: "In order to maintain a standing army which is sufficiently equipped and trained, it has proven necessary to raise taxes by a particularly unpopular amount. While it was expected that the army could maintain security throughout our territories, it has become clear that most of the funding had been siphoned off by officers, with the countryside's stability being neglected entirely. Now that the domestic situation has turned into an unmitigated disaster, with rebellions springing up across numerous provinces, it would appear that the peasantry have grown tired of frequent overtaxation - especially with no results to show for it. As much as it pains us to crack the whip and bring down the fist, we must make an example of the seditious rabble which has sprung up. The message shall be made vivid enough for all to comprehend: dissent shall be swiftly, and brutally, crushed. After, and only after, the present crisis has been resolved, shall the administration consider cutting back taxes."
 ab_yuandisaster.6.a: "Would you bite the hand that feeds you?"
 ab_yuandisaster.7.t: "The Great Mongol Revolt"
 ab_yuandisaster.7.d: "While many of our Mongol subjects have remained loyal, there are those who would see the Great Yuan destroyed and purged from living memory. Such a faction has recently spread like wildfire amongst the Mongolian uluses, and has presented itself as one of the most significant threats to the empire's integrity which we have faced thus far. This so-called 'Great Mongol Revolt', while utterly unjust in its demands and unlawful in its cause, has sadly managed to unite a vast host of disgruntled clans under its banner, and intends to reforge the legacy of the Great Khan on its own terms. If we, the true successors to Kublai and Genghis, are to survive the storm raging above our heads, we must react quickly and with utmost ruthlessness."
 ab_yuandisaster.7.a: "We will crush any opposition!"
 ab_yuandisaster.8.t: "The Nestorians Rise in Revolt"
 ab_yuandisaster.8.d: "Prince Nayan's revolt had failed to establish the traditionalist faction as sole rulers of the then-sprawling Mongol Empire, however the treacherous runt nonetheless succeeded in felling the great Kublai Khan. As a consequence of the Temugid prince's partial victory, the Nestorian faith which Nayan so fervently subscribed to had firmly entrenched itself within his little appanage ulus of Kwan-ning, even after his assassination and official condemnation as a traitor. Evidently hoping to capitalise on the strong anti-Yuan sentiments of recent times, Nestorians under the wing of a minor Temugid noble have taken to championing their Christian, anti-Sinophilic cause in a radical manner. Refusing to budge from their stance when offered the olive branch by our negotiators, their stated aim is to purge the Great Yuan's current regime and ruling class in favour of their own, having declared a Great Eastern Crusade which shall see a Heavenly Kingdom rise from the ashes. These neurotic zealots must be put down, or we will have a most dreadful bloodbath on our hands."
 ab_yuandisaster.8.a: "They can start praying to their 'God'"
 ab_yuandisaster.9.t: "Temur loyalists capture Qaraqorum"
 ab_yuandisaster.9.d: "The brutish mongrel, Temur, is a walking fossil, having demanded a full-blown return to the 'old ways' for years. His backwardsness is unrivalled in all the world, but the dream of returning to the steppe appears to have seduced numerous Mongol clans to the traditionalist cause. Unfortunately for us, paired with the strong alienation these nomads feel, such ephemeral desires have culminated in open revolt. As their first move, evidently an attempt to dislodge Yuan rule in the western provinces, Temur's loyalists have successfully seized control of the administrative heart of the Mongol uluses. Indeed, Qaraqorum fell with little resistance, as it would appear the garrison, too, believed treason to be a rewarding avenue. With the loss of our grip over the region, forces must be dispatched immediately, lest our mandate be further questioned - and thus usurped. Qaraqorum must be reclaimed, and the rebels driven deep into Siberia's boundless wastes."
 ab_yuandisaster.9.a: "Crush the seperatist dogs!"
 ab_yuandisaster.10.t: "The Chinese refuse to recognise a Christian Emperor"
 ab_yuandisaster.10.d: "As to be expected from our effeminate, and ever-scheming subjects in China-proper, the malcontents have refused to even acknowledge their rightful liege - Essen Temugid - as emperor! This outrageous and petulant act of high treason comes not only as an insult to the sovereign, but also to the Lord Tengri himself! Spitting on the One True God's holy icon, within Khanbaliq's chapel, disloyal Chinese noblemen proceeded to violate the hallowed ground, cursing Essen Khagan's name all the while. While the Christian faith would have inevitably alienated a significant portion of the Chinese, and to a lesser extent Mongol, populace, such indignation was wholly unanticipated by the compromise faction. If Yuan is to survive the coming waves of unrest and bloodshed, amidst this already-costly civil war, the Nestorian Church of the East must quickly prove itself capable of securing the empire. Should Christendom fail in this feat, they will be the first on the chopping block once the dust settles."
 ab_yuandisaster.10.a: "Unacceptable!"
 ab_yuan.1.t: "The Ailing Emperor and His Empire"
 ab_yuan.1.d: "Emperor Shaozong, born Sorqaqder, has ruled China for the last thirty four years. As if the dynasty was a reflection of its sickly sovereign, the Great Yuan has just barely held onto parts of Northern China, while the warlords of the south have found generations to become proper states of their own. Externally there is much dissension over how the Yuan should continue to function, as it has been divided into two distinct factions who are nearly ready to wage war against each other. One, a mix of traditionalist Mongols that wish to keep their own power, backed by a Christian and Manichaean Semu whose privileges lend much influence over the Chinese. The Second faction is one which believes the Yuan’s ultimate destiny is that of a proper Chinese state, garnering much support by aiming to end the Yuan’s caste system in full. Like a roof propped up by rotting beams, once Emperor Shaozong dies there shall be no way to prevent things from coming to a head."
 ab_yuan.1.a: "May the Emperor Live Ten Thousand Years!"
 ab_yuan.2.t: "The Death of Emperor Shaozong"
 ab_yuan.2.d: "The inevitable has finally happened; Emperor Shaozong is dead. A Kurultai has been called to discuss who shall succeed the late emperor. The squabbling factions have coalesced around three candidates who each see their way as the only path forward. The primary candidate is Prince Temur, Emperor Shaozong’s son, who sees the Yuan as a proper Mongol successor state. On the other extreme is his rival Prince Dongdin, son of the Jingzong Emperor and a staunch opponent of the caste system, who wishes to transform the Great Yuan into a traditional Chinese dynasty. Separate from the others but preferred by those who believe the state must not face radical change is a Temugid noble by the name of Essen, who traces his lineage back to Temuge, a brother of Genghis Khan. The Kurultai’s decision will shape the future of the Great Yuan, but regardless of whom they choose, a bloody conflict is unavoidable; armed partisans belonging to the three camps have already begun to mobilise, likely fearing the least favourable outcomes for their preferred emperor."
 ab_yuan.2.a: "Prince Dongdin pushes the Yuan to Sinification!"
 ab_yuan.2.b: "Prince Temur brings the Yuan back to tradition!"
 ab_yuan.2.c: "Essen Temugid’s compromise faction wins out!"
 ab_yuan.3.t: "New Mandate of Heaven for a New Yuan"
 ab_yuan.3.d: "Emperor Xianzu’s triumph has convinced many that perhaps more extreme measures must be taken to secure the Yuan. While the dynasty cannot part from the Mandate of Heaven perhaps it should be changed to better suit the dynasty’s needs. No longer shall the we adhere to a Mandate that offers challenge, at the slightest of misfortunes, but instead create a Mandate of Heaven that centre’s upon the strength of our royal house."
 ab_yuan.3.a: "To a New Era!"
 ab_yuan.4.t: "The Fate of the Mandate of Heaven"
 ab_yuan.4.d: "Word has spread since the Yuan’ succession struggle has resulted in the triumph of the Xianzu Emperor, and the reports are disturbing. The Yuan have made revisions to the Mandate of Heaven that claim to rest upon their royal house alone, regardless of what may happen to the people. Their monarch’s cruel insanity is clear, perhaps we should claim the Mandate?"
 ab_yuan.4.a: "Claim the Mandate!"
 ab_yuan.4.b: "We cannot bear this burden"
 ab_yuan.5.t: "The Fate of the Mandate of Heaven"
 ab_yuan.5.d: "Word has spread since the Yuan’ succession struggle has resulted in the triumph of the Xianzu Emperor, and the reports are disturbing. The Yuan have made revisions to the Mandate of Heaven that claim to rest upon their royal house alone, regardless of what may happen to the people. Their monarch’s cruel insanity is clear, perhaps we should claim the Mandate?"
 ab_yuan.5.a: "Claim the Mandate!"
 ab_yuan.5.b: "We cannot bear this burden"
 ab_yuan.6.t: "End of the Crisis"
 ab_yuan.6.d: "Following one of the most turbulent periods in Chinese history, the dust has finally settled, though not before countless factions from across the Great Yuan raised arms against it. Whether it was to topple Mongol rule, or seize the most glorious mantle of leadership for themselves, it matters little now. After a long and brutal campaign, we have cemented our dominion over the Empire, and destroyed all opposition. Whether or not we can maintain our firm grip on the Dragon Throne remains to be seen, but at least we may begin to rebuild, and restore order to our wartorn realm."
 ab_yuan.6.a: "May we know peace"
 ab_yuan.7.t: "Sinification of the Great Yuan"
 ab_yuan.7.d: "The Emperor Shaozong is dead, and Prince Dongdin has emerged out of the Kurultai as the sole leader of the Yuan Dynasty. His goal is clear: bring the Yuan in line with the Chinese traditions that have been maintained for millenia by the empires of old. In his eyes, the Yuan are just as Chinese as they are Mongol, and must cultivate this new Chinese culture if it is to thrive into the future. This concept has many detractors across the steppes, and the Khalkha and Korchin Mongols will be ruing this decision for years yet, but one thing is certain: the path is paved for the Yuan, and there is no more turning back."
 ab_yuan.7.a: "A new dawn for China"
 ab_yuan.8.t: "Naadam Festival of [GetYear]"
 ab_yuan.8.d: "Naadam Festival is the most popular festival amongst the Mongol tribes. By the decision of the Emperor himself, the grand version of the festival is now organized each 10 years. It is a perfect opportunity for the Mongol tribes to gather and forget all of their feuds for the time being. As always, the tree main disciplines of the games consist of wrestling, horse racing and archery. It is a tradition that the imperial treasury funds one of these disciplines. Which one shall we pick?"
 ab_yuan.8.a: "We will fund the wrestling"
 ab_yuan.8.b: "We will fund the horse racing"
 ab_yuan.8.c: "We will fund the archery"
 ab_yuan.8.de: "We can't afford it"
 ab_yuan.9.t: "Fall of Kyoto"
 ab_yuan.9.d: "Over a century and a half has passed since the first conquest of Kyoto by Kublai Khan and his loyal prince Tohgon. Since then, the power of the Touyouji Shogunate has waned, and much of Japan had stopped obeying the authority of the Yuan or the Shogun by the time of the Red Turban Rebellion. Now, with our armies once again occupying the Imperial Palace, all of Japan will surely bow to us once more!"
 ab_yuan.9.a: "Long live the [Root.GovernmentName]! Long live [YUA.Monarch.GetTitle] [YUA.Monarch.GetName]!"
 ab_yuan.10.t: "Reunification of the Celestial Empire"
 ab_yuan.10.d: "For many years, China has been divided along the Huai River between the rebel princedoms of the south and our mighty Yuan in the north. However, our temporary weakness and instability that led to these happenings was just that: temporary, and now the Yuan banners fly from Khanbaliq to Nanjing to Guangzhou once more, as they did in the time of our forebearers. All of China lies under our control for the first time in decades, and [YUA.Monarch.GetName] has reclaimed [Root.GetHerHis] primacy as the sole Emperor of China. Now, we shall rule with a wise hand, following the great emperors who came before us."
 ab_yuan.10.a: "Benevolence is the characteristic element of humanity"
 ab_yuan.11.t: "Exotic Animal Gifts"
 ab_yuan.11.d: "Diplomacy is often about the exchange of gifts between rulers or delegations. It is a custom to give expensive cloth, jewelry, weapons or other things made of precious metals. Often, the gifts were animals - those used in hunting or warfare. However, our dynasty has estblished a tradition of gifting exotic animals, especially caracals and tigers which were often bought from Indian merchants. The value and preciousness of these 'living gifts' was measured through the strength, symbolic value or rarity of the animals which were a key part of diplomatic gift giving. The presence of animals in court ceremonies, royal processions, and later in ruler insignia through different heraldic markings, was, from ancient times, a key part of the manifestations of power and standing of rulers. The inclusion of animals in diplomatic protocol gained a certain political and cultural dimension of mediation between different states and cultures. Since our defeat in the Red Turban Rebellion, there were rarely any delegations coming to the Imperial capital and this tradition was somewhat discontinued. Should we bring it back?"
 ab_yuan.11.a: "Of course!"
 ab_yuan.11.b: "What the flop?!"
 YUA_FLOP1: "The tradition of gifting exotic animals will be restored."
 YUA_FLOP2: "The tradition of gifting exotic animals will be discontinued."
 ab_yuan.12.t: "The Second Sack of Baghdad"
 ab_yuan.12.d: "At last, the walls of Baghdad have fallen before our might, our flag flying high above the city. Our warriors are now eager to enjoy the wealth and women that the city has to offer, and have pleaded for us to raze it much like the last time. However, one of our advisors suggests that we spare the city, much to the horde’s unfathomable ire. He explains that by doing so, the people would not see us as their oppressors, but rather as their benign masters, saving us much effort in maintaining order. Of course, this would not only infuriate our soldiers, but may set a precedent for our enemies to see us as weak-willed and impotent."
 ab_yuan.12.a: "Oops!...I Did It Again"
 ab_yuan.12.b: "Spare the city, we can loot elsewhere"
 ab_yuan.13.t: "The City of the Great Khagan"
 ab_yuan.13.d: "As we enter the city of Qaraqorum, memories of our last battles - our horses galloping across the steppes - come flooding back. Alas, the city is a mere shadow of its former self. The old palaces are dilapidated, and even the gigantic turtle statues are cracked; but the spirit of the Great Mongol Empire, as we can feel, is still alive. We are now certain: this is our capital, and always shall be. As we turn to our faithful warriors, we see a white goose flying in the eternal blue sky, as if Tengri himself was welcoming us back to the steppe."
 ab_yuan.13.a: "Genghis smiles upon us"
 ab_yuan.14.t: "The Maragheh Observatory"
 ab_yuan.14.d: "The Maragheh Observatory was once among the most advanced scientific institutions in the world. However, after the death of Hulagu Khan, funding ceased and the observatory was left to decay into ruin. Now that the city is back under our control, our scientists are expressing their desire to see the observatory rebuilt. While reconstruction would be expensive, a heavy investment would show that we are a beacon of knowledge in this world, not just its overlord."
 ab_yuan.14.a: "Someday we shall conquer the sea of stars!"
 ab_yuan.14.b: "This 'science' won’t conquer the world for us"
 ab_yuan.15.t: "The Destruction of Rus’"
 ab_yuan.15.d: "Two centuries ago, the whole of Rus' burned as our armies passed through. The mighty city of [280.GetName] was utterly razed, and to this day has yet to recover. Only Novgorod was spared, for its rulers, unlike the others, had the wisdom to surrender. However, due to decades of internal conflicts weakening our grip, the Russians were deluded enough to think they might regain their freedom. Or so they thought. Now, the Rus’ is desolate; the ghosts of its fallen carried on the howling winds. Only ashes linger in this wasteland, and years will pass before any life may re-emerge. With the east under heel once more, the Mongol hordes now stand at the gates of Europe."
 ab_yuan.15.a: "They have seen the end of days"
 ab_yuan.16.t: "Converting China"
 ab_yuan.16.d: "Our Nestorian roots stem from our retreat to Jetysuu centuries ago, when the leaders of our people accepted God into our hearts and in doing so secured that we will dwell in the house of the Lord forever, in Heaven. Since that fateful moment, our goal has always been to convert as many people as possible, to give the unbelievers of Asia a chance of entering eternal paradise. Despite how unlikely it had seemed at the time, we have achieved our goal, along with so much more: not only have we brought the word of God to the masses, but we have reestablished our empire in China, something that was thought impossible just a few decades ago. Our nation and our people are servants of God and Christ alone: we look for the resurrection of the dead, and the life of the world to come."
 ab_yuan.16.a: "Amen"
 ab_yuan.17.t: "Eastern Patriarchates"
 ab_yuan.17.d: "We have long admired the administrative system of the Eastern Orthodox Church to the far west, particularly how centralised and hierarchical the church bodies in the area were. As we have actively converted and proselytized in our formerly pagan holdings, the idea of establishing our own ecclesiastical provinces seems to be a simple way to secure our position as the leading Christian power in the east. This would also come with added benefit of establishing our Patriarchate as a mostly uncontested head of the Nestorian church, one among many but still being the preeminent authority on religious questions."
 ab_yuan.17.a: "Thy will be done!"
 ab_yuanhorde.1.t: "Execution of Essen Temugid"
 ab_yuanhorde.1.d: "Essen Temugid, that spineless diplomat who thought he could force Christianity and an un-Mongol way of life upon our great state, has at last faced justice. After the destruction of his power base within Yuan lands, and the scattering of his supporters to the remote corners of the world, the Temugid prince fled back to his family in the appanage princedom of Kwan-ning. They, too, felt the Wrath of the Khan in light of their harbouring a known traitor. May the end of Temuge's perfidious bloodline close this dark chapter in the Mongol Empire's otherwise glorious history."
 ab_yuanhorde.1.a: "Death to traitors!"
 ab_yuanhorde.2.t: "Reconquest of the Middle Kingdom"
 ab_yuanhorde.2.d: "At long last, Mongol rule has been restored across all of China! Ever since the southern provinces fell to Han warlords in the Red Turban Rebellion, numerous emperors had feebly called for equally impotent measures at reclamation, only to never follow through, due to a worsening domestic situation. While a bloody wakeup call, the recent crisis within Yuan has nonetheless kickstarted the war machine of Kublai's day, allowing us to utterly steamroll the disunited and frail Han states. We shall ensure it never falls out of our hands again."
 ab_yuanhorde.2.a: "China shall be but a memory"
 ab_yuanhorde.3.t: "Japan under the Mongol Rule"
 ab_yuanhorde.3.d: "Kublai Khan's dream of a Mongol-ruled Japanese archipelago has finally become a reality, with the last of the opposition forces being swept aside as though a Divine Wind had come to our aid. The end of an independent Japan had almost come to fruition long ago, only for the offensive to stall upon Kyoto's fall, but this time we had prepared for a protracted campaign. With their emperor in our custody and the Shogunate under Mongol rule, the remaining daimyo came crumbling apart like a breached wall, evidently suffering from a lack of united resistance. Shamans will speak of this final victory against the Japanese for a thousand years, knowing full well that we have surpassed the rising sun itself!"
 ab_yuanhorde.3.a: "May the sun never set!"
 ab_yuanhorde.4.t: "Execution of Prince Dongdin"
 ab_yuanhorde.4.d: "The seditious worm known as Prince Dongdin now adorns a pike outside the perimetre of Khanbaliq, having attempted to flee to the court of his Han benefactors. He sought to completely destroy the Mongol way of life; eroding our traditions, subverting our core values and beliefs - all for his Sinophilic delusion, and a large payout from his attending eunuchs. Dongdin's sycophants, now buried up to their necks on the border of the Tocharian desert, have no more legitimate backing within Great Yuan, and thus the dream of Chinese dominion over the Far East has set alongside the sun. Glory to the Great Khan!"
 ab_yuanhorde.4.a: "We have beheaded the snake!"
 ab_yuanhorde.5.t: "India under the Mongol Rule"
 ab_yuanhorde.5.d: "While neither the most obvious, nor the easiest region to conquer, the Indian subcontinent has fallen to our glorious horde regardless. Their complete inability to unite against our rapid advance saw most of the rajas become overrun, further isolating the rest to be picked off individually. Khanbaliq is now bursting at the seams with mountains of plunder from this most venerable land, while India itself is facing a sudden influx of our loyal Buddhist subjects, obviously eager to study at the ancient academies in the northeast. The Empire's economy shall surely also benefit from our new conquest, as foreign markets have a most curious obsession with the exotic spices and teas which these bountiful lands have to offer. Truly, India is the gem in the Khagan's crown!"
 ab_yuanhorde.5.a: "Onwards, to the west!"
 ab_yuanhorde.6.t: "Restoration of the Mongol Empire"
 ab_yuanhorde.6.d: "'Mongol' was a word which, once upon a time, struck dead the feeble hearts of men. Our empire, spanning from the Orient to Eastern Europe, was the largest and most fearsome to have ever existed; all knelt before the Great Khan, and we were respected. Through a century of corruption, our people and realm succumbed to disease of the heart; brothers turning on one another for gold and titles; chiefs murdering and usurping their overlords. When everything had come crashing down, we almost didn't realise what had happened, but through the crucible of bloody battle were the Mongol people born anew! Our unmatched horselords have swept through countless lands, bringing more and more foreign subjects into the fold. We, the Mongols, are the scourge of the steppes; the wolves of the plains, and our Empire has risen once more. All hail the Khagan, may he ride onwards to immortal triumph; to glory, and to the ends of the Earth!"
 ab_yuanhorde.6.a: "Genghis smiles upon us"

# Modifiers #
 yua_expand_sinosphere: "Expand the Sinosphere"
 yua_army_imperial: "Imperial Army"
 china_middle_control: "Control the Middle Kingdom"

# Missions (Horde) #
 yua_horde_maharajas_title: "Defeat the Maharajas"
 yua_horde_maharajas_desc: "Maharajas were once the rulers of powerful empires in India and were respected by all. However, nowadays, every little Indian king thinks he deserves this title. We will show them that they are nothing before our Khan."
 yuan_horde_anatolia_title: "Invade Syria and Anatolia"
 yuan_horde_anatolia_desc: "The collapsing Ilkhanate allowed the Muslim hordes to advance the frontier and start penetrating into the lands that were once rightfully ours. Instead of building up defenses, we shall gather the army and strike a preventive blow to weaken and hopefully, even overthrow the Muslim rule in Anatolia and the Levant."
 yuan_horde_arabia_title: "Break the Crescent"
 yuan_horde_arabia_desc: "As our armies wreak havoc across the Middle East, our generals are preparing to strike the Muslims where it will hurt them the most - the Arabian peninsula. The birthplace of Islam shall be conquered and their holy places shall be burned to ash."
 yuan_horde_central_asia_title: "Restore Rule on the Steppe"
 yuan_horde_central_asia_desc: "The Central Asian steppe has become an unruly place since the collapse of the Mongol Empire. We must bring its people under our rule and restore order."
 yuan_horde_control_japan_title: "Control Japan"
 yuan_horde_control_japan_desc: "Having made landfall in Japan and reunited with the house of Toyouji, we will strike a killing blow into the heart of the independent Daimyos by marching northwards, bringing the entire region under our rule once for all."
 yuan_horde_crisis_title: "Crisis of the Yuan Dynasty"
 yuan_horde_crisis_desc: "With the death of Khagan Shaozong, the Great Yuan finds itself face to face with a crisis. Conflict concerning the future of the empire has wrought destruction accross the land. What the future holds, nobody can say for sure."
 yuan_horde_dread_title: "Mounted Dread"
 yuan_horde_dread_desc: "Nothing is more frightening that the vision of our thousands of horses ready for the battle. Nothing is more beautiful than the ashes of a city after our passage. Our enemies know it well: where our horses have passed, the grass will never grow again."
 yuan_horde_europe_title: "Invade Europe"
 yuan_horde_europe_desc: "Two centuries ago, they feared our hordes as their cities were burnt to the ground. Now that their churches and temples have been rebuilt, they seem to consider themselves the centre of the world. Let us remind them of their weakness and seize their lands."
 yuan_horde_festival_title: "Nadaam Festival"
 yuan_horde_festival_desc: "The Naadam festival is the decannual festival of the mongol people in which young men participate in wrestling, archery, and horsemanship. It not only brings our people together, but also encourages young men to practice the military arts."
 yuan_horde_gateway_title: "Gateway to India"
 yuan_horde_gateway_desc: "Tibet was not an easy region to conquer and even if it can serve as a good border it is not the end of the Himalayas. Further south of Tibet lies Nepal and Kashmir - only parts of the mountainrange we do not control. It will be a costly campaign, but once we control all of Himalayas we can open up a new front that could allow us to surpass even Genghis Khan and succeed in invading a land that he failed three centuries ago: India. To make our nation's ancestral founder proud we ought to open the northern gates to India."
 yuan_horde_guard_title: "Restore the Kheshig Guard"
 yuan_horde_guard_desc: "The symbol of our powerful horde, our khan is feared throughout the world. However, his power is the envy of many and some would not hesitate to kill him to take his place. For this reason, the khan needs a loyal guard, ready to protect him at all costs, day and night. Genghis Khan had given us an example: the Kheshig guard must be restored!"
 yuan_horde_ilkhanate_title: "Restore the Ilkhanate"
 yuan_horde_ilkhanate_desc: "Similarly to the Golden Horde, the internal troubles and constat infighting caused the downfall of the Ilkhanate, which is now only limited to a weak rump state in Transcaucasia. The restoration of our rule over the Great Iran shall see the restoration of the Ilkhanate in its former glory!"
 yuan_horde_invasion_title: "Prepare the Invasion Fleet"
 yuan_horde_invasion_desc: "The Mongol-founded Touyoji shogunate is like a lost cousin to the empire. No matter; by constructing a great fleet we can defy the divine wind and seize the Japanese islands for ourselves."
 yuan_horde_japan_title: "Unite with Toyouji"
 yuan_horde_japan_desc: "Even the greatest generals of the old Khaganate failed to bring all of Japan under their suzerainty. The isles are now partially controlled by Toyouji; a Mongol Shogunate descended from Prince Toghon. However, their authority is threatened by the free clans of the north who seek to purge Japan of any Mongol influence. We must step in, reunite our houses and rein in the rebellious Lords of Japan."
 yuan_horde_khitan_title: "Defeat Qara Khitai"
 yuan_horde_khitan_desc: "The kingdom of Qara Khitai is a shadow of its former glory. Like the mighty Genghis Khan, it is our duty to demand their loyalty and incorporate their lands into our own."
 yuan_horde_korea_title: "Subjugate Korea"
 yuan_horde_korea_desc: "Möngke Khan forced the Koreans to submit to Mongol rule. They have since ceased to bow to us, and must be reminded of their true masters."
 yuan_horde_manchuria_title: "Manchurian Incursion"
 yuan_horde_manchuria_desc: "Once rivals, the Manchus are no longer a threat to us. They will be more than happy to kneel before us as they feel the earth tremble under our horses' feet."
 yuan_horde_manpower_title: "Regain Strength"
 yuan_horde_manpower_desc: "Following countless rebellions, our armies' reserves are depleted. Before any further action, we must rebuild our base of conscriptable men."
 yuan_horde_mongols_title: "Unite the Mongols"
 yuan_horde_mongols_desc: "The Mongols, our people, have fallen into petty infighting during the absence of centralized rule. We must integrate their tribes into our state so that we may show them the way forward."
 yuan_horde_nchina_title: "Reclaim North China"
 yuan_horde_nchina_desc: "Northern China, while partially held by the Khaganate, must be fully reclaimed by our dynasty! The illegitimate warlords shall be deposed!"
 yuan_horde_nizzarids_title: "Dismantle the Nizzarids"
 yuan_horde_nizzarids_desc: "The triumph in the Middle East has now pushed our border to the mighty Nizzarid Sultanate; a powerful Sultanate founded by Nizzard the Great who is said to never have been defeated in battle. The Mongol Horde shall show his successors that there is no such thing as invincibility. The waters of the Nile shall soon turn red."
 yuan_horde_oirats_title: "Merge with the Oirats"
 yuan_horde_oirats_desc: "The Four Oirat Khanates, sometimes called the Western Mongols, are our former subjects. It will not stand for them to remain as tributaries. They must be absorbed into the Khaganate."
 yuan_horde_pax_mongolica_title: "Pax Mongolica"
 yuan_horde_pax_mongolica_desc: "It is said that under the rule of the great Khans of the past, a woman could walk from one end of the Empire to the other with a nugget of gold on her head and travel with no fear. We shall restore this peace throughout our lands."
 yuan_horde_persia_title: "Grip over Persia"
 yuan_horde_persia_desc: "Due to its geography and diversity in terms of both ethnicity and religion, Persia is a difficult region to control. It is important that we make peace with the locals while also keeping a tight grip on the region."
 yuan_horde_privy_title: "Establish the Shumi Yuan"
 yuan_horde_privy_desc: "By establishing a great military council to manage wartime affairs, we can ensure our victory in future battles and the sufficient organization of our forces."
 yuan_horde_qaraqorum_title: "Restore Qaraqorum"
 yuan_horde_qaraqorum_desc: "Qaraqorum, great capital of Temujin Borjigin Chinggis Khagan, our ancestor, is a shadow of its former self. Despite having moved our capital long ago, we will restore the grandeur of the first Great Khan's city."
 yuan_horde_riches_title: "Riches of the Silk Road"
 yuan_horde_riches_desc: "In the days of the Mongol Empire, the silk routes were a symbol of prosperity for our civilisation. We must make them safe again for all merchants who would like to come and fill our coffers."
 yuan_horde_russia_title: "Raze Rus' to the Ground"
 yuan_horde_russia_desc: "The internal trouble within the Golden Horde created a power vacuum which was swiftly abused by the rebellious princedoms of Rus' who defied the Mongol rule. The time has come to put them in their place and inflict devastation so massive that even the destruction of Kievan Rus' will pale in comparision to it."
 yuan_horde_southern_title: "The Southern Campaign"
 yuan_horde_southern_desc: "Now that the whole of China is under our rule again, our desire is turned to the south. Their lands are nothing like our native steppes, but they trade in valuable goods and we have much to learn about their art of war. A campaign there could only benefit us."
 yuan_horde_stability_title: "Internal Stability"
 yuan_horde_stability_desc: "The crisis is over, but the many of our people still worry. By making administrative measures to display stability, we can ensure our people feel safe."
 yuan_horde_tarim_title: "Claim the Tarim Basin"
 yuan_horde_tarim_desc: "Despite his hostile geography, the Tarim Basin is a historic trading place on the Silk Road. By claiming this territory, we would be able to raise taxes on incoming goods and secure our economy."
 yuan_horde_tatars_title: "Reforge the Golden Horde"
 yuan_horde_tatars_desc: "It was clearly a mistake to allow the so-called Golden Horde to rule autonomously. With their Khanate on the knees, it is up to us to reunite the Tatars and bring them back into the fold."
 yuan_horde_temugids_title: "Capture Essen Temugid"
 yuan_horde_temugids_desc: "Essen Temugid thought he could be our khan, but when his hopes were dashed, he turned out to be a traitor. Even after the defeat of his armies, he refused to kneel before us and fled to his native lands. If we wish to punish him as he deserves, we need only crush those who protected him until he is totally isolated. He will then regret his felony, but in vain."
 yuan_horde_tibet_title: "Rule Tibet"
 yuan_horde_tibet_desc: "Tibet was a territory that once lay under our control while under the Sakya Dynasty; however, due to the failings of our forefathers, the territory was lost to the Phagmodrupa rebels while we stood idly by and watched it happen. We must return to this treacherous land and reclaim our lost territory and defeat all those who stand in our way!"
 yuan_horde_trade_title: "Control the Trading Cities"
 yuan_horde_trade_desc: "Although our people are mainly nomads, the stability within our borders has always attracted foreign traders to our cities. If we want to increase this financial windfall, we must conquer as many cities as possible."
 yuan_horde_vassals_title: "The Trust of the Tributaries"
 yuan_horde_vassals_desc: "Our period of weakness has resulted in some rebellious sentiment amongst the tributary states. Restoring their trust in our right to rule as the Khans will be essential moving forward."
 yuan_horde_warlords_title: "The Celestial Empire"
 yuan_horde_warlords_desc: "We are the Celestial Empire, and yet the Chinese resist. South of China is filled with warlords that have fought against our rule for centuries and harm our legitimacy. This cannot do. We need to show the Chinese that resistance is futile and it is their eternal fate to serve under the Mongol Yoke as servants of the one true Celestial Empire."
 yuan_horde_yam_title: "Rebuild the Yam"
 yuan_horde_yam_desc: "The Yam was a postal system and supply point route messenger system extensively used and expanded by Ögedei Khan and also used by subsequent Great Khans. Following the collapsed of the Mongol Empire, the entire system collapsed with it. In order to bring prosperity to our lands, this vast network shall be reconstructed."
 yuan_horde_yasa_title: "Reform the Yasa Code"
 yuan_horde_yasa_desc: "Yasa Code is the oral law code that Genghis Khan declared in Public in Bukhara and has served as a de facto law in our empire. However, besides the public announcement in Bukhara we haven't proclaimed it active in other regions of our realm. There is three clear things we must do with Yasa Code: 1. Codify it into text so we won't have to rely on spoken word with the law. 2. Make it publicly known in rest of the corners of Yuan. 3. Expand the once wartime decree into something that controls accepted cultural and lifestyle conventions."
 yuan_mongol_empire_title: "Restore the Mongol Empire"
 yuan_mongol_empire_desc: "The empire of Genghis Khan has fallen, broken into many parts. We must restore his legacy by replicating the Great Khan's conquests. We will reconquer the Mongol Empire!"

# Missions (Chinese) #
 yua_china_canals_title: "The Grand Canal"
 yua_china_canals_desc: "Between the rivers, there is a vast inland area in which the benefits of maritime trade are absent. We can change this by undertaking the construction of a grand canal to connect Khanbaliq to Huangzhou"
 yua_china_capital_title: "Expand Khanbaliq"
 yua_china_capital_desc: "Khanbaliq, the great Khan's city, shall be a grander capital than any before it. By combining traditional chinese urban planning with modern sensibilites, we can construct a worthy capital for our prosperous new age."
 yua_china_expedition_title: "Expeditionary Sentiment"
 yua_china_expedition_desc: "Our explorers know there are numerous unsettled islands in and beyond the southern sea. This untamed land seems perfect for settlement by those citizens of our empire wishing for a new life away from the dense cities and vast farmlands of China."
 yua_china_indonesia_title: "Invade Indonesia"
 yua_china_indonesia_desc: "Thought the riches of the spice islands have always been at China's doorstep, no emperor or admiral has ever made taken the obvious step of conquering Indonesia itself for the benefit of the nation. This will change under the Yuan."
 yua_china_industry_title: "The Industrial Revolution"
 yua_china_industry_desc: "Industry is sweeping accross the world at rates never before seen. Through new methods, production is booming in Europe and now India. We cannot afford to lag behind in any way. By expanding our manufactories, we can ensure the continuing modernization of our economy."
 yua_china_malacca_title: "Dominate Malacca"
 yua_china_malacca_desc: "The strait of Malacca has served as the chokepoint for international trade in Asia for milennia. Whoever controls it holds the keys to the world's most profitable toll gate, and who could be more worthy to wield that key than us?"
 yua_china_moluccas_title: "Land in the Moluccas"
 yua_china_moluccas_desc: "The Moluccas, though similarly rich in spices and other goods to the more famous 'spice islands' in malacca, are largely unexploited and not as competed over by local kingdoms. Perhaps we should found a few settlements to test the trade waters."
 yua_china_naval_silk_road_title: "The Naval Silk Road"
 yua_china_naval_silk_road_desc: "Silk has always been the most profitable export from China, especially to european merchants. For ages untold, the harsh land route through central Asia and Persia was the premier way to transport silk and other goods to Europe from China. With our control over sea routes and grand navy, we can create a safer and more navigable silk road over the ocean."
 yua_china_taiwan_title: "Settle Taiwan"
 yua_china_taiwan_desc: "The island of Taiwan, despite its closeness to China, has never been populated by anyone civilized. The indigenous tribes there are small in number and the land seems ripe for settement. Perhaps we can encourage some of our subjects to migrate."
 yua_china_tiger_title: "Waking the Tiger"
 yua_china_tiger_desc: "Despite our disinterest in conquest, our enemies must make no mistake; we will not hesitate to use force to enforce our demands, and when it comes to force, no nation may match our overwhelming armies."
 yua_china_unknown_title: "Into the Beyond"
 yua_china_unknown_desc: "The land that Europeans call 'the New World', has been discovered to be more easily reachable by us than previously known. Should we create settlements in this mysterious land, perhaps we could beat the Europeans at their own game."
 yua_china_world_title: "Workshop of the World"
 yua_china_world_desc: "With our vast lands, abundant resources, and staggering population, [Root.GetName] will transform China into the industrial center not just of asia, but the entire world, outproducing our european competitors."
 yua_china_yellow_sea_title: "Protect the Yellow Sea"
 yua_china_yellow_sea_desc: "The Yellow Sea between mainland China and the Korean peninsula is the beating heart of maritime activity in the region. In order to strengthen our grip on incoming trade, we must monopolize these waters for our merchants."
 yua_rival_europe_title: "Rival the Europeans"
 yua_rival_europe_desc: "While European nations, with their colonies and squabbles, love to refer to themselves as the 'great powers of the world', they live in ignorance of the true Power, the middle kingdom. Perhaps it is time to outdo them once and for all, even if it means engaging in their petty rivalry games."
 yuan_agriculture_title: "Invest in Agriculture"
 yuan_agriculture_desc: "Our growing population requires more food to continue its upward trajectory. We can provide them with this need by expanding farmlands in the rich soil of the Yellow and Yangtze river valleys."
 yuan_mongols_title: "Unite the Mongols"
 yuan_mongols_desc: "The Mongols, our people, have fallen into petty infighting during the absence of centralized rule. We must integrate their tribes into our state so that we may show them the way forward."
 yuan_privy_title: "Establish the Shumi Yuan"
 yuan_privy_desc: "By establishing a great military council to manage wartime affairs, we can ensure our victory in future battles and the sufficient organization of our forces."
 yuan_qaraqorum_title: "Restore Qaraqorum"
 yuan_qaraqorum_desc: "Qaraqorum, great capital of Temujin Borjigin Chinggis Khagan, our ancestor, is a shadow of its former self. Despite having moved our capital long ago, we will restore the grandeur of the first Great Khan's city."
 yua_pure_land_title: "Pure Land"
 yua_pure_land_desc: "Despite our successes in internal and external matters, we must not forget to tend to the garden of our soul and erect proper places of worship that reflect our affluence and attention to the teachings through which we grew prosperous."
 yua_tame_china_sorrow_title: "Tame China's Sorrow"
 yua_tame_china_sorrow_desc: "Rivers are the lifeblood of our civilization as they provide our people with valuable land and the basic necessities. However, various floods that may take place every few decades are a threat of the highest authority not only towards our subjects' livelihoods but also to our stable rule."
 yua_trading_centers_title: "Control the Trade Centers"
 yua_trading_centers_desc: "Trade is a great weapon. It works both as a leverage at times and also as a stimulant for domestic economy. We should expand the trade centers we currently hold while at the same time aiming to take control of more trade centers around China."
 yua_reform_the_censorate_title: "Reform the Censorate"
 yua_reform_the_censorate_desc: "A highly efficient branch of our government, we must present our utmost efforts to ensure the continued process of centralization and bureaucratic efficiency so as to match the size of our enormous domain."
 yua_promote_grand_coordinators_title: "Grand Coordinators"
 yua_promote_grand_coordinators_desc: "The eastern equivalent of a viceroy, commonly known within our country as Xunfu is a key office that plays an important role within our administration. We must tend to promoting able coordinators and ensure their loyalty to the Emperor."
 yua_porcelain_silk_title: "Monopoly on Luxury Goods"
 yua_porcelain_silk_desc: "China is a land known for many luxury goods such as silk and porcelain. Not only are they well beloved by the Chinese people, the recently arrived Europeans also showed interests in these items. Therefore it is in our best inerest to achieve and maintain a monopoly on these luxury goods to ensure our trade standing against both domestic competitors and European intruders."
 yuan_china_rule_indochina_title: "Rule Indochina"
 yuan_china_rule_indochina_desc: "Having secured Vietnam, we have opened the route for the subjugation of entire Indochina. We shall take over this wealthy region and bring it into our sphere of influence."
 yuan_china_rule_burma_title: "Rule Burma"
 yuan_china_rule_burma_desc: "Although we have successfully established a fortified frontier between us and the wild Burmese kingdoms, some of our military officers are suggesting that the only way to truly protect ourselves from them is by taking over the region entire."
 yuan_china_bureaucracy_title: "Expand the Bureaucracy"
 yuan_china_bureaucracy_desc: "Ruling such a vast empire isn't something we can do alone. If we employ a large class of bureaucrats, despite the expense, we can avoid the long-term costs of instability."
 yuan_china_burma_title: "Burmese Frontier"
 yuan_china_burma_desc: "Beyond the lands of the Yun-Gui frontier is Burma, a wild, tropical land of squabbling kingdoms. In order to protect our border from these unpredictable people, we must establish a significant buffer zone between us."
 yuan_china_crisis_title: "Crisis of the Yuan Dynasty"
 yuan_china_crisis_desc: "With the death of Khagan Shaozong, the Great Yuan finds itself face to face with a crisis. Conflict concerning the future of the empire has wrought destruction accross the land. What the future holds, nobody can say for sure."
 yuan_china_great_wall_title: "The Great Wall"
 yuan_china_great_wall_desc: "Although our ancestors originally conquered China by bypassing the great wall, we must strengthen the structure to resist new weapons so that any future attemtps at foreign conquest can be halted."
 yuan_china_gun_title: "Modernize the Xanadu Gun"
 yuan_china_gun_desc: "The Xanadu Gun has, for a long time, been at the heart of our great armies. This rudimentary artillery, however, is showing its age. It would behoove us to employ the latest in gunpowder technology to modernize these guns."
 yuan_china_hermit_title: "The Hermit Kingdom"
 yuan_china_hermit_desc: "We have heard that other powers have taken to calling us the 'hermit kingdom'. While intended to be a perjorative, we take no shame in this title. They do not understand the virtues of inwards perfection, and their subjects will suffer under conquest while ours prosper in isolation."
 yuan_china_imperial_title: "Expand the Imperial Army"
 yuan_china_imperial_desc: "Our focus on internal peace must not lead to a sedentary, weak population. By expanding the army and creating incentives for military service, we can maintain a strong force to defend the empire and keep our subjects in check."
 yuan_china_invasion_fleet_title: "Prepare the Invasion Fleet"
 yuan_china_invasion_fleet_desc: "The Mongol-founded Touyoji shogunate is like a lost cousin to the empire. No matter; by constructing a great fleet we can defy the divine wind and seize the Japanese islands for ourselves."
 yuan_china_inward_title: "Inward Perfection"
 yuan_china_inward_desc: "Having re-established the empire in all of China, it is time for us to turn inwards and focus on prosperity, stability, and the defense of our border."
 yuan_china_japan_title: "Fall of Kyoto"
 yuan_china_japan_desc: "Having made landfall in Japan, we will strike a killing blow into the heart of the Touyoji by marching on the ancient capital of Kyoto, just as our Mongol ancestors did centuries ago."
 yuan_china_korea_title: "Control the Two Kingdoms"
 yuan_china_korea_desc: "The rival kingdoms of Joeson and Goreyo have battled over Korea for too long. It follows that we must end their conflict by force and restore harmony to their land."
 yuan_china_manchuria_title: "Manchurian Authority"
 yuan_china_manchuria_desc: "The Jurchens, or more contemporarily, the Manchurians, have always been culturally connected to the Mongols. It is only natural that they are integrated into the domain of the son of heaven."
 yuan_china_manpower_title: "Regain Strength"
 yuan_china_manpower_desc: "Following countless rebellions, our armies' reserves are depleted. Before any further action, we must rebuild our base of conscriptable men."
 yuan_china_metropolis_title: "Economic Heart of China"
 yuan_china_metropolis_desc: "In the past, the farmer and tax collector held up the economy of the nation. No longer. Now, the great cities of central China are bustling centers of commerce and production that form the economic heart of our nation. By bolstering these already established cities, we can ensure continuous prosperity."
 yuan_china_mongolia_title: "Subjugate the Oirats"
 yuan_china_mongolia_desc: "The Mongols, our people, have fallen into petty infighting during the absence of centralized rule. We must integrate their tribes into our state so that we may show them the way forward."
 yuan_china_north_title: "Reclaim North China"
 yuan_china_north_desc: "Northern China, while partially held by the Khaganate, must be fully reclaimed by our dynasty! The illegitimate warlords shall be deposed!"
 yuan_china_oirats_desc: "The Four Oirat Khanates, sometimes called the Western Mongols, are our former subjects. It will not stand for them to remain as tributaries. They must be absorbed into the Khaganate."
 yuan_china_reunite_title: "Reunite the Empire"
 yuan_china_reunite_desc: "In order for our authority as emperors of China to be respected, the whole of the region must be reclaimed. It is our destiny to rule for ten thousand years."
 yuan_china_river_title: "Cross the Yangtze"
 yuan_china_river_desc: "Accross the Yangtze, the further reconquest of China awaits! the remaining warlords will never suspect our resurgence!"
 yuan_china_schools_title: "Four Great Schools"
 yuan_china_schools_desc: "The Four Great schools shall be integrated into our administration for the benefit of our governance and the continuation of confucian bureaucratic traditon."
 yuan_china_sinicization_title: "Cultural Sinicization"
 yuan_china_sinicization_desc: "As emperors of China, it is only natural that we settle our differences with the culture of our subjects. It is time to dismount from the horse and sit instead upon the Dragon's Throne."
 yuan_china_stability_title: "Internal Stability"
 yuan_china_stability_desc: "The crisis is over, but the many of our people still worry. By making administrative measures to display stability, we can ensure our people feel safe."
 yuan_china_steel_title: "Expand the Steel Industry"
 yuan_china_steel_desc: "Steel, an alloy of iron and carbon, is the premier metal for both industrial and military use. By developing a strong steel industry, we can bolster both our military and other sectors of our economy."
 yuan_china_temples_title: "Confucian Temples"
 yuan_china_temples_desc: "The continuance of Confucian teachings is dependent on the veneration of our ancestors. In order to ensure there are venues for this, we must construct shrines throughout the land."
 yuan_china_tibet_title: "Conquer Tibet"
 yuan_china_tibet_desc: "Tibet, while never formally held by a chinese emperor, has always been in proximity of and influenced by them. We will end their nominal independence."
 yuan_china_urban_title: "Encourage Urbanization"
 yuan_china_urban_desc: "Our economc advisors tell us that the future of China lies in the crafstman and the manufactory worker. By encouraging the increased settlement of existant cities and the construction of entirely new ones, we can strengthen our industry and foster a more efficient, hardworking population."
 yuan_china_vassals_title: "The Trust of the Tributaries"
 yuan_china_vassals_desc: "Our period of weakness has resulted in some rebellious sentiment amongst the tributary states. Restoring their trust in our right to the mandate will be essential moving forward."
 yuan_china_vietnam_title: "Vietnamese Campaign"
 yuan_china_vietnam_desc: "Vietnam has always been part of China in culture and spirit. Now, we must do what no emperor has done before us, and integrate it militarily."
 yuan_china_war_prepare_title: "Assemble the Forces"
 yuan_china_war_prepare_desc: "The crisis is over. It is time for the Great Yuan to reclaim our lost terriory and restore the mandate of heaven!"
 yuan_china_workshop_title: "Increase the Production"
 yuan_china_workshop_desc: "The production of all kinds of goods fuels China's economy in a much more significant way than before, when it was depenendent on tax collection. By creating infrastructure to encourage the further production of artisan crafts and industrial goods, we can expand our economy beyond its previous horizons."
 yuan_china_yam_title: "Sino-Mongol Yam"
 yuan_china_yam_desc: "A yam is a system of supply points established accross a large region to create ease of travel, commerce, and information spread. By establishing these routes accross China, we can make our vast empire seem much smaller and more navigable."
 yuan_festival_title: "Naadam Festival"
 yuan_festival_desc: "The Naadam festival is the decannual festival of the mongol people in which young men participate in wrestling, archery, and horsemanship. It not only brings our people together, but also encourages young men to practice the military arts."

# Missions (Nestiorian) #
 yua_nest_canals_title: "The Grand Canal"
 yua_nest_canals_desc: "Between the rivers, there is a vast inland area in which the benefits of maritime trade are absent. We can change this by undertaking the construction of a grand canal to connect Khanbaliq to Huangzhou"
 yua_nest_capital_title: "Expand the Capital"
 yua_nest_capital_desc: "Khanbaliq, the great Khan's city, shall be a grander capital than any before it. By combining traditional chinese urban planning with modern sensibilites, we can construct a worthy capital for our prosperous new age."
 yua_nest_europe_title: "Rival the Europeans"
 yua_nest_europe_desc: "While European nations, with their colonies and squabbles, love to refer to themselves as the 'great powers of the world', they live in ignorance of the true Power, the middle kingdom. Perhaps it is time to outdo them once and for all, even if it means engaging in their petty rivalry games."
 yua_nest_expedition_title: "Expeditionary Sentiment"
 yua_nest_expedition_desc: "Our explorers know there are numerous unsettled islands in and beyond the southern sea. This untamed land seems perfect for settlement by those citizens of our empire wishing for a new life away from the dense cities and vast farmlands of China."
 yua_nest_indonesia_title: "Invade Indonesia"
 yua_nest_indonesia_desc: "Thought the riches of the spice islands have always been at China's doorstep, no emperor or admiral has ever made taken the obvious step of conquering Indonesia itself for the benefit of the nation. This will change under the Yuan."
 yua_nest_industry_title: "The Industrial Revolution"
 yua_nest_industry_desc: "Industry is sweeping accross the world at rates never before seen. Through new methods, production is booming in Europe and now India. We cannot afford to lag behind in any way. By expanding our manufactories, we can ensure the continuing modernization of our economy."
 yua_nest_malacca_title: "Dominate Malacca"
 yua_nest_malacca_desc: "The strait of Malacca has served as the chokepoint for international trade in Asia for milennia. Whoever controls it holds the keys to the world's most profitable toll gate, and who could be more worthy to wield that key than us?"
 yua_nest_moluccas_title: "Land in the Moluccas"
 yua_nest_moluccas_desc: "The Moluccas, though similarly rich in spices and other goods to the more famous 'spice islands' in malacca, are largely unexploited and not as competed over by local kingdoms. Perhaps we should found a few settlements to test the trade waters."
 yua_nest_naval_silk_road_title: "The Naval Silk Road"
 yua_nest_naval_silk_road_desc: "Silk has always been the most profitable export from China, especially to european merchants. For ages untold, the harsh land route through central Asia and Persia was the premier way to transport silk and other goods to Europe from China. With our control over sea routes and grand navy, we can create a safer and more navigable silk road over the ocean."
 yua_nest_taiwan_title: "Settle Taiwan"
 yua_nest_taiwan_desc: "The island of Taiwan, despite its closeness to China, has never been populated by anyone civilized. The indigenous tribes there are small in number and the land seems ripe for settement. Perhaps we can encourage some of our subjects to migrate."
 yua_nest_tiger_title: "Waking the Tiger"
 yua_nest_tiger_desc: "Despite our disinterest in conquest, our enemies must make no mistake; we will not hesitate to use force to enforce our demands, and when it comes to force, no nation may match our overwhelming armies."
 yua_nest_unknown_title: "Into the Beyond"
 yua_nest_unknown_desc: "The land that Europeans call 'the New World', has been discovered to be more easily reachable by us than previously known. Should we create settlements in this mysterious land, perhaps we could beat the Europeans at their own game."
 yua_nest_world_title: "Workshop of the World"
 yua_nest_world_desc: "With our vast lands, abundant resources, and staggering population, [Root.GetName] will transform China into the industrial center not just of asia, but the entire world, outproducing our european competitors."
 yua_nest_yellow_sea_title: "Protect the Yellow Sea"
 yua_nest_yellow_sea_desc: "The Yellow Sea between mainland China and the Korean peninsula is the beating heart of maritime activity in the region. In order to strengthen our grip on incoming trade, we must monopolize these waters for our merchants."
 yuan_nest_agriculture_title: "Invest in Agriculture"
 yuan_nest_agriculture_desc: "Our growing population requires more food to continue its upward trajectory. We can provide them with this need by expanding farmlands in the rich soil of the Yellow and Yangtze river valleys."
 yua_nest_trading_centers_title: "Control the Trade Centers"
 yua_nest_trading_centers_desc: "Trade is a great weapon. It works both as a leverage at times and also as a stimulant for domestic economy. We should expand the trade centers we currently hold while at the same time aiming to take control of more trade centers around China."
