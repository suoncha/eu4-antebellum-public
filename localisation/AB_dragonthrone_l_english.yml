 cb_china_unification: "Unification of China"
 cb_china_unification_desc: "Unify lands of the Chinese subcontinent."
 cb_chinese_unification_desc: "Unify lands of the Chinese Subcontinent."

# Ideas #
 CDL2_ideas: "Dali Ideas"
 CDL2_ideas_start: "Dali Traditions"
 CDL2_ideas_bonus: "Dali Ambition"
 cdl2_rice_terraces: "Rice Terraces"
 cdl2_rice_terraces_desc: "Our land is fertile, but unfortunately, also rugged. To build a great nation, we must overcome the mountainous terrain around us. We should encourage terracing so that more lands can be cultivated and more people can be fed."

 YUE_ideas: "Great Chu Ideas"
 YUE_ideas_start: "Great Chu Traditions"
 YUE_ideas_bonus: "Great Chu Ambition"
 yue_first: "Pearl of the South"
 yue_first_desc: "Guangzhou has managed to remain a key centre of trade despite the chaos engulfing China. However, this has not been an easy feat. Only by securing our capital’s position can the wealth continue to flow."
 YUE2_ideas: "Great Chu Ideas"
 YUE2_ideas_start: "Great Chu Traditions"
 YUE2_ideas_bonus: "Great Chu Ambition"
 yue2_first: "Pearl of the South"
 yue2_first_desc: "Guangzhou has managed to remain a key centre of trade despite the chaos engulfing China. However, this has not been an easy feat. Only by securing our capital’s position can the wealth continue to flow."
 yue_second: "Southern Fleet"
 yue_second_desc: "Unlike most states in China. one of our greatest assets has been our navy, which has the capability to protect our trade, and deter hostile landings."
 yue_third: "The House of He"
 yue_third_desc: "The House of He has survived on more than just trade; it's about family. Be they brothers or cousins, they have served as capable administrators to keep Chu strong."
 yue_fourth: "Terminus of South China Trade"
 yue_fourth_desc: "Trade from all corners of China and beyond ensures vast quantities of exotic goods, people, and the coin which follows, may flow freely through our prosperous lands."
 yue_fifth: "Anti-Piracy Tactics"
 yue_fifth_desc: "Over long years of service, our sailors have accrued much experience in anti-piracy activities. The sea lanes our merchants and fishermen used to avoid like the plague are now safe, under the watchful eye of our coastal fleet."
 yue_sixth: "Benign Rule"
 yue_sixth_desc: "Southern China contains many ethnic groups, including the Mao, Yao, and Chuang people. By granting them greater autonomy and permitting local customs, we can ensure they will not rebel against us nearly as frequently."
 yue_seventh: "Tusi Regiments"
 yue_seventh_desc: "Our many subjects provide a large manpower pool, though the cost of maintaining a centralised army can prove expensive. By letting local magnates called Tusi take responsibility for the upkeep and training of the  troops in their domains, it will reduce the central government's burden significantly."

 MIN_ideas: "Great Min Ideas"
 MIN_ideas_start: "Great Min Traditions"
 MIN_ideas_bonus: "Great Min Ambition"
 min_idea_first: "Trading Hub of Quanzhou"
 min_idea_first_desc: "Quanzhou is a major trading hub along the Chinese coastline, one that is a vital stopping point for all merchants.  Our port of Quanzhou might very well be the largest port in the world, and the foreigners who come call it “Tiger’s Claw”. Be they Japanese, Malay, Indian, or Thai, hundreds of thousands come into our ports to trade fine goods with one another, and the wealth and power it brings us is simply one of the benefits of controlling the jewel of the maritime silk road."
 MIN2_ideas: "Great Min Ideas"
 MIN2_ideas_start: "Great Min Traditions"
 MIN2_ideas_bonus: "Great Min Ambition"
 min2_idea_first: "Trading Hub of Quanzhou"
 min2_idea_first_desc: "Quanzhou is a major trading hub along the Chinese coastline, one that is a vital stopping point for all merchants.  Our port of Quanzhou might very well be the largest port in the world, and the foreigners who come call it “Tiger’s Claw”. Be they Japanese, Malay, Indian, or Thai, hundreds of thousands come into our ports to trade fine goods with one another, and the wealth and power it brings us is simply one of the benefits of controlling the jewel of the maritime silk road."
 min_idea_second: "Chen Youding"
 min_idea_second_desc: "Born in 1330, Chen Youding was a prolific commander in the Yuan general army. Serving alongside the legendary conqueror Toghon Khan, they quelled and subdued the Ispah Rebellion within Xinghua. Furthermore, he joined the rebellion against the Yuan, and pushed them back beyond the Yellow River. While other states continued to squabble and bicker and even wage war on one another, he gathered local support and shored up defensives. Min would become a powerhouse both in trade and in military might."
 min_idea_third: "Legacy of the Ispah Rebellion."
 min_idea_third_desc: "In 1357, a mass revolt by the Persian trading class within the city of Quanzhou spread out fast and quickly, gaining support from mercenaries and merchant families on their march to Fujian. However, Chen Youding put down this revolt, crushing them effortlessly. This caused a mass exodus and execution of the various religious minorities in the region, which eventually resettled during the following decades. Our kingdom is known for housing religions ranging from Zoroastrianism, Christianity, local hybrid faiths, and many others. To keep the peace is something our rulers identified as one of the key failures of the previous Yuan administration that led to the rebellion. As such, they have created a division within the government dedicated to calming this religious tension before it flares up into further rebellions."
 min_idea_fourth: "International Relations"
 min_idea_fourth_desc: "Our presence is known across Asia. In Vietnam, we have officials from our province serving as officials and leaders. Similarly, in surrounding states from the Zhou to the Chu, individuals coming out of our examination circuits will often find themselves in positions of power."
 min_idea_fifth: "Reintegration of the Semu Families"
 min_idea_fifth_desc: "The Semu people from Arabia to Persia have always held dominance in our city. However, after the Ispah Rebellion, our people have formulated a strong distaste for foreigners and have consistently viewed them as troublemakers. We must make peace with them, keeping them loyal to our government, while also making sure they are not in a position to potentially attack us again."
 min_idea_sixth: "Coastal Defences"
 min_idea_sixth_desc: "Our coastline has been the site of raids from Malay and Taiwanese pirates, who would come in with their junks and cause havoc while they ransacked our wealth. We must create a large navy, capable of not only fighting back against these navies, but also so omnipresent that they wouldn’t even dare attempt a raid!"
 min_idea_seventh: "Ispah Militias"
 min_idea_seventh_desc: "The Persians during the rebellion used militias and mercenaries to threaten the security of the realm. In our time during the Red Turban Rebellion, we saw the havoc a well-organised militia can create on even the strongest army, especially on their home turf. We shall create a series of militias, funded by local guardsmen and mercenaries, that can be used for hit and run tactics in the case of a long and protracted foreign invasion. If Min shall fall, it shall go down kicking and screaming!"

 SNG_ideas: "Great Song Ideas"
 SNG_ideas_start: "Great Song Traditions"
 SNG_ideas_bonus: "Great Song Ambition"
 SNG2_ideas: "Great Song Ideas"
 SNG2_ideas_start: "Great Song Traditions"
 SNG2_ideas_bonus: "Great Song Ambition"
 sng_first: "Capture of Kaifeng"
 sng_first_desc: "With our victory against the Han warlords, the ancient imperial capital of Kaifeng is once more in our hands! Its acquisition has granted us much legitimacy in the eyes of our rivals. Be they the faltering Yuan or lesser warlords, all shall come to acknowledge us as the true heirs of the Dragon Throne."
 sng_second: "Integrate Gunpowder into the Army"
 sng_second_desc: "Gunpowder weaponry was utilised to great effect by our forces, against both the Mongols and Han pretenders to the south. The total integration of this modern arsenal into our armies has been a long time coming."
 sng_third: "Reinstate Imperial Examinations"
 sng_third_desc: "It was only a matter of time before the Yuan court stagnated into a den of nepotism, having foolishly ceased the Imperial Examinations. Now that we rule a vast state of our own once more, it is our duty to right the wrongs of those Mongol oppressors. The Imperial Examinations shall be reinstated, and the court will once again flourish!"
 sng_fourth: "Dominate Indian Ocean Trade"
 sng_fourth_desc: "Even in our dynasty’s Autumn years, our goods dominated foreign markets as far away as Mongadishu and Malacca. Alas, with overland trade stagnating, it is imperative that we gain control of Indian Ocean commerce. To accomplish such a feat, we must ensure that our ships are up to the task of travelling such long distances."
 sng_fifth: "Celestial Wisdom"
 sng_fifth_desc: "Many innovations were made during the golden years of our rule; the first real implementation of gunpowder, the use of mass printing, and advances in nautical pathfinding, to name a few. All of these, we managed to achieve because of the greatness of our dynasty, and our divine right to rule! As long as this continues to be true, so too will our innovations continue to marvel the world."
 sng2_fifth: "Celestial Wisdom"
 sng2_fifth_desc: "Many innovations were made during the golden years of our rule; the first real implementation of gunpowder, the use of mass printing, and advances in nautical pathfinding, to name a few. All of these, we managed to achieve because of the greatness of our dynasty, and our divine right to rule! As long as this continues to be true, so too will our innovations continue to marvel the world."
 sng_sixth: "Population Boom"
 sng_sixth_desc: "Now that the dust has finally settled, and sweeping agricultural reforms have taken root, the population is booming beyond our wildest expectations. While it means we will have to drastically overhaul infrastructure and logistics, the immediate benefit of this is obvious: more soldiers!"
 sng_seventh: "Connection to Families Great and Far"
 sng_seventh_desc: "Our dynasty's brief period of captivity under the Yuan, and our subsequent struggles for lordship over China, have borne at least some fruit. This most illustrious dynasty of ours is related - by blood - to countless noble families of great prestige. With ties to former adversaries like the Han, and even the Yuan themselves, we have extra flexibility in conducting diplomacy."

 ZHH_ideas: "Great Zhou Ideas"
 ZHH_ideas_start: "Great Zhou Traditions"
 ZHH_ideas_bonus: "Great Zhou Ambition"
 ZHH2_ideas: "Great Zhou Ideas"
 ZHH2_ideas_start: "Great Zhou Traditions"
 ZHH2_ideas_bonus: "Great Zhou Ambition"
 zhh_first: "Yangtze Agriculture"
 zhh_first_desc: "Since the first conquest of the Baiyue tribes two thousand years ago, the lands next to the Yangtze River have transformed into some of the most productive lands in all of China due to the vast irrigation systems established by the Han and Sima Jin dynasties. These systems have made our lands a very stable region for growing crops, where farmers can produce as much as possible without the fear of floods."
 zhh_second: "Zongmingguan"
 zhh_second_desc: "The Imperial Central University was founded almost a millennium ago in Nanjing; since its creation, it has grown into China's most prominent centre of learning and research. The thousands of students in the complex grant us a sizable advantage in terms of literary studies, one that our neighbours cannot hope to match."
 zhh_third: "Jiankang History"
 zhh_third_desc: "Jiankang, now called Nanjing, is one of the four great capitals of China, along with Beijing, Xi'an, and Luoyang. Ownership of the city and the countless cultural artefacts within it helps to strengthen our standing with other kingdoms, connecting the Zhou with the great empires that came before us."
 zhh_fourth: "The Grand Canal of China"
 zhh_fourth_desc: "The Grand Canal connects the Yellow River in the north to the Yangtze River in the south, a massive feat of engineering unparalleled in the world. These connections significantly improve ease of trade within China and have brought great prosperity to many cities along its route."
 zhh_fifth: "Riverine Warfare"
 zhh_fifth_desc: "Our young kingdom straddles the Huai and Yangtze Rivers, the sites of many prominent naval battles across several centuries. The history of these encounters, passed down in great detail through military texts, have added significantly to our brave admirals' skills."
 zhh_sixth: "Heart of China"
 zhh_sixth_desc: "The Jiangnan region makes up most of our lands and has long been renowned as one of the densest parts of China in terms of population. This high density, along with a very urbanised populace, allows recruits to be conscripted and trained for a fraction of the cost of other nations."
 zhh_seventh: "Legacy of Conquest"
 zhh_seventh_desc: "The Zhou were born out of a desire to expand: first against the Red Turban revolts, then our former overlords in the Yuan Dynasty. Out of the single city of Gaoyou, we have carved out a kingdom: now, let the Son of Heaven carve out an empire!"

 HNN_ideas: "Great Han Ideas"
 HNN_ideas_start: "Great Han Traditions"
 HNN_ideas_bonus: "Great Han Ambition"
 HNN2_ideas: "Great Han Ideas"
 HNN2_ideas_start: "Great Han Traditions"
 HNN2_ideas_bonus: "Great Han Ambition"
 hnn_first: "Eight Views of Xiaoxiang"
 hnn_first_desc: "The Eight Views are a historical set of the most beautiful landscapes in the Xiaoxiang region. Various prominent artists from the Song era have created paintings on this theme after being exiled to Xiaoxiang, showing their discontent and isolation through beautiful art. To this day, skilled painters all across China travel to Xiaoxiang to refine their art, giving us a wide network of people that may be invited to our court."
 hnn_second: "The Last of the Red Turbans"
 hnn_second_desc: "The Han Dynasty stands alone in China as the last remnant of the Red Turban Rebellions. Although weakened by inter-Chinese warfare in the past years, our state is one of the most powerful in the south: the dream of fully evicting the barbarians from China remains fully possible still. This idea of liberation strengthens our soldiers' morale and allows them to keep fighting even when defeat seems certain."
 hnn_third: "Yichang Depots"
 hnn_third_desc: "Since ancient times the city of Yichang has served as a supply hub for several empires. The city's positioning on the Yangtze makes transport of weapons and ammunition to the front line extremely easy, ensuring that fresh soldiers and weapons can be brought to our armies with incredible speed."
 hnn_fourth: "Jingdezhen Porcelain Kilns"
 hnn_fourth_desc: "Porcelain has been produced in China for centuries, but the Jingdezhen porcelain is still unparalleled in its quality and demand. Vaunted as the porcelain capital of China for hundreds of years, our control of the Jingdezhen kilns brings us great trade opportunities in distant shores."
 hnn2_fourth: "Jingdezhen Porcelain Kilns"
 hnn2_fourth_desc: "Porcelain has been produced in China for centuries, but the Jingdezhen porcelain is still unparalleled in its quality and demand. Vaunted as the porcelain capital of China for hundreds of years, our control of the Jingdezhen kilns brings us great trade opportunities in distant shores."
 hnn_fifth: "Diplomatic Pragmatism"
 hnn_fifth_desc: "We have often been required to ally with surrounding Chinese states to survive, even if they are our direct rivals in securing hegemony over China. First allying with the Zhou to fight the Song, to becoming fierce rivals just to ally again in face of Yuan invasion, our nation is in a constant flux of making and breaking alliances. This has led our diplomats to become very good at convincing other states that we are trustworthy, regardless of previous conflicts."
 hnn_sixth: "Enemies On All Sides"
 hnn_sixth_desc: "We have fought hard against almost every state in China, winning and losing battles in a state of near constant war for a century. The fighting has drained our troops, but has led to great advances in creating fortifications able to defend against modern gunpowder weaponry: few states can match the grandeur of our fortresses."
 hnn_seventh: "Civilise the Interior"
 hnn_seventh_desc: "Much of our nation consists of rolling hills or mountains, sparsely inhabited and pagan in worship. These lands must be populated by learned men, where they will have two roles to play: labourers to civilise the land, and sages to civilise the barbarians."

 CLE_ideas: "Celestial Ideas"
 CLE_ideas_start: "Celestial Traditions"
 CLE_ideas_bonus: "Celestial Ambition"
 cle_first: "Legacy of Tianhuang"
 cle_first_desc: "In the distant past, as the Earth and the Heavens came forth from the vast nothingness that preceded it, the Heavenly Sovereign, Tianhuang, came to this world. In this time, there was great chaos, as the tribes of men fought and quarrelled. Tianhuang, who brought water to the earth, who lived for 18,000 years, who raised twelve children, brought these tribes together under his rule, driving back the chaos, and united all under heaven. Our emperor carries that same weight upon his shoulders, and even though this time is as different as can be as that time so long ago, he too shall unite all the world under his wise guidance."
 cle_second: "Wrath of the Jade Serpent"
 cle_second_desc: "Our state is like that of a mighty serpent. Should one give it the honour and respect it deserves, then it shall be a great benefactor in times to come. However, should one attempt to trick or attack the great dragon of the Middle Kingdom, they shall find us with flashing fangs and the strength to destroy all who stand in our way!"
 cle_third: "Inward Perfection"
 cle_third_desc: "Years of patience and hard work have given birth to the masterpiece that is our state. Every member of our society, from the most powerful administrator in Beijing to the most rural farmer in Shanxi knows their place, working through day and night to make sure that our nation runs as smoothly as possible."
 cle_fourth: "Heaven's Will"
 cle_fourth_desc: "The emperor and their line have maintained the Mandate of Heaven for as long as anyone can remember and have not let it slip from their grasp even once. It is through them the harvests are bountiful, it is through them disease remains at bay, and through them our warriors remain strong and powerful. The emperor guides us through this new era - let us hope they continue until the end of time!"
 cle_fifth: "The Dragon Navy"
 cle_fifth_desc: "As mighty conquerors of the sea, our ships sail to all the corners of the globe uncontested. None would dare challenge our might, lest they wish to see their wretched junks at the bottom of the ocean. Nay, they would not even think of it, as they would be too blinded by their splendour and opulence, glimmering with gold and cannons alike."
 cle_sixth: "Imperial Guard"
 cle_sixth_desc: "When the soldiers of the empire march, the ground shakes and stirs. When they line up to fire upon our enemies, their cries echo into the heavens themselves. When they let loose a volley, the sun is blotted out by smoke and ash. They are the most fearsome force to ever grace this world, and they shall live and die for the emperor!"
 cle_seventh: "Emperor's Divinity"
 cle_seventh_desc: "The emperors that came before were weak; while they claimed to have the wisdom of heaven and the divine authority to rule, only our emperor truly knows what that burden and honour means. The emperor has the wisdom to govern this land, the might to enforce his judgement, the will to see his plains bear fruit, and also, much like the Five Emperors of legend and the Three Sovereigns prior, the emperor has the power to make miracles happen…"

 ROC_ideas: "Chinese Ideas"
 ROC_ideas_start: "Chinese Traditions"
 ROC_ideas_bonus: "Chinese Ambition"
 roc_first: "Stabilise the Republic"
 roc_first_desc: "With the Imperial system in China abolished, we must now focus our efforts towards building the Republic's legitimacy, and ensuring the new state can be viewed by the people as distinctly Chinese. We must not let our founders' dreams be in vain."
 roc_second: "The Art of War"
 roc_second_desc: "The Art of War, amongst many other Chinese great works of military tactics, such as the famous Romance of the Three Kingdoms, are renowned for their military genius. Yet after the chaotic decades following the Red Turban Rebellion the battle tactics taught in these books have been forgotten. We must study such great works to boost our own military tactics. A Renaissance of the East! As such we can call it."
 roc_third: "Zhongyuan Zhidi"
 roc_third_desc: "Our homeland, Zhongyuan Zhidi, or the lands of the Middle Kingdom, is perhaps one of the best geographic locations rich with various natural resources and vast flatlands perfect for agricultural development. Even in today’s eras of Industrialization such facts remain true, with great farmland terrain and resourceful mountains to develop. With organised effort and investment our cities will surely grow and prosper, and shake the possibilities of urbanisation via industrialization beyond imagination!"
 roc_fourth: "The Dragon Navy"
 roc_fourth_desc: "The Republic of China Navy is in reality a scrap fleet inherited from the Imperial Navy of old, with most ships barely able to stay afloat due to decades of neglect. If we are to protect our coastlines from foreign blockades and piracy, the entire navy requires a sweeping reform and modernisation effort, lest we fall behind further."
 roc_fifth: "Three Principles of the People"
 roc_fifth_desc: "A republic must be for the people! Thus, we must strictly follow Sanmin Zhuyi, or Three Principles of the People, which were delicately written nationalistic democratic-republican civil values set forth by our founding fathers. The principles centred around the Nation, the Rights of the Citizens, and the Welfare of the People will surely guide us to have a nation that is truly for all."
 roc_sixth: "Five Races Under One Union"
 roc_sixth_desc: "The Han Chinese make up the majority of the Republic's population, however they are by no means the only people under our rule. China is also home to significant numbers of Manchus, Tibetans, Mongols, and Tocharians - all of whom play an integral role in every facet of the state and its functions. Our constitution must reflect as such, thus all five races must be united and equal to stave off imperialist overtures."
 roc_seventh: "Made in China"
 roc_seventh_desc: "It is clear that, in the industrial world, China has a natural advantage over other nations, from manpower, to industrial capacity and resource abundance. With a little investment and a few trade deals, we can leverage this over our trade partners, making them dependent upon our exports."

# Decrees #
 Establish_Wei-suo_decision_title: "Establish Wei-Suo"
 Establish_Wei-suo_decision_desc: "Establishing Wei-Suo, the Guard Battalions will improve defense of our fortifications, and help our army."
 Establish_Wei-suo_decision_emperor: "Establish Wei-Suo"
 Introduce_Shoushi_decision_title: "Introduce Shoushi"
 Introduce_Shoushi_decision_emperor: "Introduce Shoushi"
 Introduce_Shoushi_decision_desc: "The Yuan dynasty Shòushí calendar used spherical trigonometry to find the length of the tropical year. The calendar had a 365.2425-day year, identical to the Gregorian calendar."

# Reforms #
 white_lotus: "White Lotus Advisory"
 white_lotus_desc: "The White Lotus is an incredibly influential religious cult that has sprung up in our state. By granting them privileges and authority over certain spiritual matters, we have gained their trust and their connections, allowing us to better organize and manage our state."
 maitreya_admin: "Maitreyan Administration"
 maitreya_admin_desc: "The Maitreya teachings tell us of an egalitarian society, one that promotes the true Dharma across all the Middle Kingdom. These ideas resonate with our entire society, as we work together to spread the good news of the coming of the King of Light."
 red_turban_legacy: "Red Turban Fighters"
 red_turban_legacy_desc: "The legacy of the Red Turban Rebellion remains strong in our culture, and many young men in the nation train to fight in local militias and the grand army. The fighting in the great war against the Yuan lasted for hours or days, with our brave fighters standing strong throughout combat; our soldiers have the tenacity and strength to continue that fight as they unite China and go beyond."
 min_persian_admin: "Persian Administration"
 min_persian_admin_desc: "The wealthy Persian merchant families have taken over in certain aspects of the state, especially in keeping the armies and institutions of the state well-funded and powerful. While following the foreign Zoroastrian Faith, they do not seem to be causing any problems for now."
 min_persian_admin_republic: "Semu Republic"
 min_persian_admin_republic_desc: "A plutocratic administration led by the Persian families in Quanzhou. Formed in a coup, this republic holds much of the power within the foreign and Zoroastrian groups that exist within the Kingdom."
 WARLORD: "Warlord"
 chinawall: "Reinforce the Nine Garrisons"
 chinawall_desc: "Our greatest failing was not reinforcing our most important defence against the northern nomads. We should learn from our mistakes and ensure our northern border will never again be understaffed."
 chinafire: "Attack by Fire"
 chinafire_desc: "The Polearms with a rocket attached to them were some of the first successful gunpowder weapons we've had. As is custom we ought to upgrade upon our old technology to help keep it on par with newer inventions with adjustments to its length, material and explosive substance."
 chintreasure: "The Treasure Voyages"
 chintreasure_desc: "The Chinese expeditionary fleet was heavily militarized and carried great amounts of treasures, which served to project Chinese power and wealth to the known world. They brought back many foreign ambassadors whose kings and rulers were willing to declare themselves tributaries of China. In the aftermath of the Red Turban Rebellion, these voyages were largely discontinued as there was no one who would be either interested or being able to fund them. We must once again reestablish the treasure fleet and show our power and wealth to the entire world."
 chinawarlord: "Chinese Warlord State"
 chinawarlord_desc: "Warlord states in China are nations that owe their existence, one way or another, to the Red Turban Rebellions in 1351. As they vy for supremacy over all of China, inter-state wars often end with massive gains on the victorious side leading to unified opposing coalitions forming."
 mechanic_unification_of_china_cb_yes: "Has access to the '§YUnification of China§!' casus belli"
 minnaval: "Quanzhou Naval Core"
 minnaval_desc: "The city of Quanzhou has survived many a naval invasion thanks to a strong core of sailors, marines, and admirals. The expansion of the admiralty into a proper institution within the government and military must be maintained as more enemies approach from beyond the horizon."
 daliministers: "Azhali Ministers"
 daliministers_desc: "The Kingdom of Dali is known for their specific branch of Buddhism, Azhaliism, which is a merging of traditional folk religions and popular Theravada Buddhist teachings. With the rise of the Dali Kingdom in the aftermath of the Red Turban Rebellion, the faith and its followers have seen a resurgence and growth in power in the Empire."
 chinasecretariat: "Zhongshu Sheng"
 chinasecretariat_desc: "The Zhongshu Sheng is one of the highest divisions of the departments, responsible for the distribution of imperial decrees and reviewing of incoming messages as well as the general administration of the other departments. It's importance grows larger as our empire grows larger due to the ever increasing needs of governance. The bureaucrats of this departments are needed to ensure our realm's functionality."
 chinamongols: "Assimilate the Mongols"
 chinamongols_desc: "The Mongols invaded and took over our homeland for more than a century and now they are finally defeated. In order to pacify the Mongol threat and prevent them from being a problem in the future, we need to assimilate the Mongols into the Han Chinese culture as outright deportation of all Mongol subjects is impractible."
 chinese_republic: "Chinese Republic"

# Decisions #
 great_eoc_rename_title: "Proclaim Great Dynasty"
 great_eoc_rename_desc: "Having secured the coveted Dragon Throne for our people, the Mandate of Heaven now falls upon us. The time has come to let the world know the greatness of its rightful sovereigns. Glory to the emperor!"
 rename_heavenly_empire_title: "Rename the Country to Heavenly Empire"
 rename_heavenly_empire_desc: "This is a cosmetic decision allowing us to change the name of our country."
 destroy_city_walls_title: "Destroy the Walls of the Capital"
 destroy_city_walls_desc: "The technological progress made the medieval walls of our capital obsolete. We should tear them down in order to gain more room for the urbanisation and expansion of our capital city."
 AB_DESTROY_WALLS: "Passed a decision to tear down the city walls of the capital."
 abandon_inward_title: "Abandon the Inward Perfection"
 abandon_inward_desc: "Our decision to wilfully wall ourselves off might have been reasonable in the past, though time has shown that the ideology is in conflict with our ambitions. However, abandoning the path which shaped our country for so long will come at a price."
 has_yuainward_govref_tt: "Has enacted the §YInward Perfection§! government reform"
 form_celestial_empire_title: "Proclaim the Celestial Empire"
 form_celestial_empire_desc: "We have proven ourselves worthy of the Mandate of Heaven. The reforms and expansions to our state shows how we are those destined to govern the Middle Kingdom for all eternity. We have established the Celestial Empire, which shall reign in an era of prosperity and authority over all that resides under Heaven."
 chinese_revolution_title: "Overthrow the [Root.Monarch.Dynasty.GetName] Dynasty"
 chinese_revolution_desc: "This decision allows us to overthrow the [Root.Monarch.Dynasty.GetName] and form @ROC §Y[ROC.GetName]§!."
 hong_kong_title: "Turn Hong Kong into a Trading Port"
 hong_kong_desc: "The strategic location of Hong Kong makes it a very attractive place for all kinds of activities ranging from trade to piracy. We should tighten our grip over the town, invest in its infrastructure and turn it into a major entrepot."
 move_capital_beijing_title: "Move the Capital to Beijing"
 move_capital_beijing_desc: "As befits a new ruler of China it is now time to select the new seat of our dynasty. The location of our capital is likely to influence [Root.GetName] politics for years to come. Many suggest that we move the capital to Khanbaliq - the former seat of power of the Great Yuan dynasty. This would surely be a sign of our triumphant victory over the Mongols."

# Events #
 # Min
 ab_min.1.t: "Persian Trader Rises to Prominence"
 ab_min.1.d: "Quanzhou is a city home to hundreds of merchants from across the world. While the Ispah Rebellion certainly lowered their strength, in recent years [Root.Monarch.GetName] has been opening up the ports to let these communities back in. Their connections to outside markets and resources are staggering, and to not use them would be foolish. A prolific Persian trader has risen above the ranks and has come to dominate the merchant families in the city. They recently offered us their services and are willing to work for the court as the master of trade. However, they have also made many enemies within the guilds, and hiring them could push us out of their good graces."
 ab_min.1.a: "This opportunity is too good to pass up! You’re hired!"
 ab_min.1.b: "We don’t want to get caught in a feud with the Merchants"
 ab_min.2.t: "Merchants offer Assistance"
 ab_min.2.d: "The situation in our state is turning dire. Rebels have begun to spring up across the Kingdom, and our nobles and merchants are getting restless. [Root.Monarch.GetName] had been nervous, so [Root.Monarch.GetSheHe] summoned [Root.Monarch.GetHerHis] court to help address these issues. Argument after argument continued to break apart the council, as interest groups and factions continued to claim they were being left out of some piece of the crumbling pie. Then, just as the meeting was about to collapse to a fist fight, [Root.Dip_Advisor.GetName] rose up. Claiming their solution, [Root.Dip_Advisor.GetName] claimed what was needed was the merchants and other powerful families to start funding the military and aspects of the government. They would be repaid with certain privileges, but that could be negotiated later. Right now, the state was collapsing! They needed to act quickly if they wanted to survive. Many of the merchant families, and even some of the nobles nodded their head, cheering in agreement. [Root.Monarch.GetName] was skeptical of this plan, and [Root.Monarch.GetSheHe] was sure that the trader was planning something nefarious. However, they were right. The state needed a solution, and [Root.Monarch.GetSheHe] was just not capable of dealing with the solution. However, giving this much leverage to these families was asking for trouble. [Root.Monarch.GetSheHeCap] nodded [Root.Monarch.GetHerHis] head, and stood up to deliver the decision."
 ab_min.2.a: "We shall support [Root.Dip_Advisor.GetName] in this plan"
 ab_min.2.b: "No thank you, we can handle this on our own!"
 ab_min.3.t: "The Persian Candidate"
 ab_min.3.d: "It was late at night. Our court halls echoed with the stomping of boots and the rattling of armor as men marched toward our Imperial Chambers. The doors burst open, and in came over 50 armed mercenaries, surrounding a group of Persian men who marched directly in front of our lord. They stood directly in front of them, offering them a scroll to read. Pouring through it, our lord gasped in shock. They were demanding [Root.Monarch.GetSheHe] step down from ruler of the kingdom, and to allow the Persian Families and the other Merchant Guilds take complete control. [Root.Monarch.GetSheHeCap] would get an estate in the countryside and a stipend, of course, but [Root.Monarch.GetSheHe] would have no more political power. A Coup D’état. [Root.Monarch.GetSheHeCap] carefully looked to the nearby guards, and [Root.Monarch.GetSheHe] could tell that some of them were disloyal just from the way sweat began to drip off their foreheads. [Root.Monarch.GetSheHeCap] had to act extremely carefully. This was a life-or-death situation here..."
 ab_min.3.a: "...I submit"
 ab_min.3.b: "...Never surrender!"
 ab_maitreya.1.t: "Status of the White Lotus"
 ab_maitreya.1.d: "At the dawn of the Red Turban Rebellion, the White Lotus were at the heart of the movement. Subversive activities against the Yuan mixed with a religious fervor helped fuel their revolution along the Yellow River, leading to the eventually collapse of imperial control over the south. Many of the great and powerful warlord states, from Zhou to Song, all give thanks to the White Lotus revolutionaries for weakening and pushing back the Yuan authority. However, their Maitreya teachings were quite radical. Not only did it have heterodoxic elements to its practices and ideology, but it also had a history of violent purges and attacks to bring about the new era promised to them by Maitreyan teachings. Xu Souhui, founder of the Han, brought with him many Maitreya followers, claiming to be the Boddhisatva himself, and that when he died the world would be changed forever. \n \nOf course, when Chen Youliang assassinated him, the world did not transition into a new era, and many of his followers became disillusioned. They instead pivoted to more traditional folk religions, taking over local practices and rituals for themselves. They still remained in power in the Han, but their influence has waned considerably. The current warlord of the Han, [Root.Monarch.GetName], has expressed interest in the group. While their practices are still quite strange and they still have the propensity for violence, their influence is substantial, and their organization is powerful. He needs support in the court, especially as he is surrounded on all fronts by enemies, but to side with the Maitreyans could be risky, as it could court chaos and millenary violence. Still, he makes his choice…"
 # Maitreya
 ab_maitreya.1.a: "We shall patronize them, grant them support."
 ab_maitreya.1.b: "Teach me about the coming of the King of Light."
 ab_maitreya.2.t: "Era of the Lost Dharma"
 ab_maitreya.2.d: "As the true path is forgotten, and the people live in sin and anarchy, members of the White Lotus have begun to take matters into their own hands. They clamor for our [Root.Monarch.GetName]’s head, placing the blame upon [Root.Monarch.GetHerHim] and her failure to cultivate a society of peace and prosperity. Mobs, made up of warriors and peasants alike, flood the streets, preparing themselves for a revolution. Our [Root.Monarch.GetTitle] meets with advisors, and comes up with the best plan to try and dissuade these radicals."
 ab_maitreya.2.a: "Promise to furnish a monastery, that should calm them down!"
 ab_maitreya.2.b: "Toss an advisor, satiate their bloodlust."
 ab_maitreya.2.c: "Disperse these rebels by force if you must!"
 ab_maitreya.3.t: "Plot by the Lotus"
 ab_maitreya.3.d: "The situation has deteriorated even further. The White Lotus is in open revolt against our [Root.Monarch.GetTitle]’s failures as a leader and member of the Maitreyan faith. Whispers abound throughout the palace; there is a plot to remove [Root.Monarch.GetHerHim], that’s what the spies said. Gritting [Root.Monarch.GetHerHis] teeth, [Root.Monarch.GetSheHe] began to plan for the best possible outcome. Just as that finished, soldiers burst through the doors, asking [Root.Monarch.GetHerHim] to abdicate and go into the monastic life or be cut down."
 ab_maitreya.3.a: "I attempt to persuade them. If I fail, I leave willingly."
 ab_maitreya.3.b: "I draw my saber! I am the [Root.Monarch.GetTitle]. I do not surrender!"
 ab_maitreya.4.t: "Millenary Violence"
 ab_maitreya.4.d: "The Maitreya faith is one that attempts to anticipate the coming of the bodhisattva Maitreya, and upon his death will bring about the beginning of a new era. However, sometimes these followers are extremely zealous and will lash out, attacking people and places in large scale riots and massacres, all in the hopes of bringing about this new era or believing they are already in it. Recently, there has been violence in the province of [Root.GetAreaName] from such rebels, and we have been asked by the governor to send aid as the violence continues to spread."
 ab_maitreya.4.a: "Let it run its course, it shall burn out soon enough."
 ab_maitreya.4.b: "Send troops to quell this purge!"
 ab_maitreya.5.t: "Warriors in Red"
 ab_maitreya.5.d: "The Maitreya faith has its roots within the White Lotus and the Red Turban Rebellions. As such, martial ability and willingness to fight for the faith has been a key aspect engrained into the youth of our culture. Since our state continues to propagate these morals, peasant villages have offered their sons as trained warriors for our state, as peacekeepers and guardians of this land."
 ab_maitreya.5.a: "Send these men into the military immediately!"
 ab_maitreya.5.b: "Have them safeguard their hometowns, as a favor to the peasants."
 ab_maitreya.6.t: "Maitreya is found!"
 ab_maitreya.6.d: "A monk from the rural provinces has risen through the ranks of the Sangha with his wonderous writing and beautiful seminars. Many in our kingdom now believe that he is, in fact, the great King of Light, Maitreya, that we have been waiting for. After decades of praying, he has come to usher in a new era! Or so some say. Others merely admit he is a wise and talented monk, that could be a great service to our realm should we listen to his wise words."
 ab_maitreya.6.a: "The once and future Buddha has been found!"
 ab_maitreya.6.b: "A wise monk indeed."
 ab_maitreya.7.t: "Maitreya has died!"
 ab_maitreya.7.d: "The great Maitreya has been dead for a year now…and nothing has changed. As it turns out, our prediction was wrong, and the monk we thought was our millenary savior was just a mortal man. With our reputation in shambles and many disillusioned, all we can do is wait and for the real Maitreya to appear."
 ab_maitreya.7.a: "My disappointment is immeasurable, and my day is ruined."
 ab_maitreya.8.t: "Worshippers of Wusheng Laomu"
 ab_maitreya.8.d: "The festivals for the Great Queen Mother of the West is one of the traditional festivals that we have incorporated into our Maitreyan practice. Every year we hold a mighty festival in her name, praying for her blessings and protections. To celebrate, there is often a banquet with peaches, plums, and other fruits that remind us of our Wusheng Laomu. This year, celebrations were quite extensive, and some property was even damaged in the wild fun that both man and woman had in the streets of our capital. While some are miffed about the vandalism, most are still overjoyed about the event and are excited for next year’s celebration."
 ab_maitreya.8.a: "It was a festival! Some damages are to be expected."
 ab_maitreya.8.b: "While it was fun, remind everyone to still be respectful."
 maitreya_violence: "Millenary Purges"
 ab_maitreya_soldier: "Red Turban Volunteers"
 ab_maitreya_diplomacy: "Closer ties with the Peasants"
 ab_maitreya_mother: "Worship of the Mother"
 # China
 ab_china.1.t: "Ascendant [Root.GetName]"
 ab_china.1.d: "As the Yuan’s Mandate fades, many warlord states have emerged to fill the power vacuum left behind after the Mongol collapse, all vying to claim the Dragon Throne. Through diplomacy, war, and intrigue the [Root.GetName] have been able to subjugate neighbouring warlord states, and establish themselves as the hegemon of the region. Many expect [Root.GetName] shall be the ones to ascend to the emperorship, and claim the title “Son of Heaven”. Many have already pledged their loyalty and allegiance to our dynasty, hoping to earn glory and fame, alongside reaping the benefits of siding with the victors."
 ab_china.1.a: "The Dragon Throne shall be ours!"
 ab_china.2.t: "Harmony in the Empire"
 ab_china.2.d: "Our empire is rife with different ideas and faiths. From the Pure Land to those of the many schools of Chen, the Esoteric Buddhists and the Shamans they argue with, to the traditional faith and those that still pray to their gods, to even the new Christians, our land is known for being a cultural melting pot. Under our rule, they co-exist peacefully, in no small part thanks to the intensive work done by our scholars and administrators. Our legal system, reformed through Confucian thought, has worked in tandem with our education system with the examinations and universities now dotting the countryside. This new effort to bring understanding to the masses has led to a greater understanding and unity in our people, creating a harmonious society unlike any other. We have fulfilled the Mandate of Heaven, and we shall continue to do so under the wise words of our forefathers and the new ideas of our children."
 ab_china.2.a: "We will continue to lead the people down a righteous path."
 ab_china.3.t: "The Great Northern Campaign"
 ab_china.3.d: "In the aftermath of the Red Turban Rebellion, the Chinese states that rose up against the Yuan tyrants collapsed into smaller, warring states. In this chaos and bloodshed, we have arisen as the sole dominant power in the south. We now stand at the precipice, staring down the abyss that is the Mongols and their hordes, and we raise our swords; we shall reclaim the north, and drive the barbarian out!"
 ab_china.3.a: "To War!"
 ab_china.4.t: "Dawn of a New Era"
 ab_china.4.d: "[Root.Monarch.GetName] rouses from a deep slumber; resting on the windowsill of [Root.Monarch.GetHerHis] inner chamber, a pair of sparrows land and begin to chirp at the Emperor and each other. [Root.Monarch.GetSheHeCap] smiles at the sight, and rises from [Root.Monarch.GetHerHis] bed and moves to the window. Looking out over the imperial capital, [Root.Monarch.GetSheHe] see the smoke rise from homes and the first of the city’s early workers going to their jobs. There is no famine, there is no war, there is no chaos. \n \nChina has faced severe hardships over the past several centuries. With Genghis Khan’s invasion, the Red Turban Rebellion, and with our mighty reconquering of the continent, peace has been few and far between. Peasants were often caught in the middle of the fighting and the bloodshed or have felt the consequences through famine and plague. However, at long last, the people live in an era of peace and prosperity. Our administration has worked tirelessly to ensure this; we strove for one language spoken throughout the land, for a unified faith under the [Root.Monarch.GetTitle], and for a stable realm. Their efforts paid off, as a change began to occur across the land. People began to think of themselves less as individuals under a king or lord, but as citizens of a realm. This is an era for those people, not divided by language or religion, but those who are willing and ready to serve their country, their nation, as one people. As [Root.Monarch.GetName] watches the sun rise over [Root.Capital.GetName], [Root.Monarch.GetSheHe] is seeing something else as well. [Root.Monarch.GetSheHeCap] is witnessing the dawn of the Chinese Era."
 ab_china.4.a: "...and long may it last!"
 ab_china.5.t: "Pick the Imperial Color"
 ab_china.5.d: "As a new dynasty on the Dragon Throne, we are able to pick a new imperial color. We shall:"
 ab_china.5.a: "Pick Dark Red"
 ab_china.5.b: "Pick Bright Red"
 ab_china.5.c: "Pick Amber"
 ab_china.5.de: "Pick Royal Yellow"
 ab_china.5.e: "Pick Jade"
 ab_china.5.f: "Pick Light Purple"
 ab_china.5.g: "Keep Our Current Color"
 AB_CHINA_DARK_RED: "Country color will change to Dark Red £cndarkred£"
 AB_CHINA_BRIGHT_RED: "Country color will change to Bright Red £cnbrightred£"
 AB_CHINA_AMBER: "Country color will change to Amber £cnamber£"
 AB_CHINA_ROYAL_YELLOW: "Country color will change to Royal Yellow £cnroyalyellow£"
 AB_CHINA_JADE: "Country color will change to Jade £cnjade£"
 AB_CHINA_LIGHT_PURPLE: "Country color wilIl change to Light Purple £cnlightpurple£" 
 ab_china.6.t: "Harmonization of Reformed Pagan faiths"
 ab_china.6.d: "Our efforts to integrate our [reformed_pagan_province.Religion.GetName] subjects have now finally started to pay off. Our reformed pagan subjects have begun to accept the ideals of Confucianism and our local officials have also integrated elements of the local religion and culture in our wider Confucian corpus of ideals. As local bureaucrats enter our administration the pagan customs have to some extent began to filter upwards. Even among prominent officials in [Root.Capital.GetCapitalName] a small altar can sometimes be found to a [reformed_pagan_province.Religion.GetName] pantheon.\nReformed Paganism has become one of the many religions of our Confucian [Root.GovernmentName]."
 ab_china.7.t: "Harmonization of Maitreya"
 ab_china.7.d: "Our efforts to integrate our Maitreya subjects have now finally started to pay off. Our Maitreya subjects have begun to accept the ideals of Confucianism and our local officials have also integrated elements of the local religion and culture in our wider Confucian corpus of ideals. As local bureaucrats enter our administration the pagan customs have to some extent began to filter upwards. Even among prominent officials in [Root.Capital.GetCapitalName] a small altar can sometimes be found to a Maitreya pantheon.\nMaitreya has become one of the many religions of our Confucian [Root.GovernmentName]."

 ab_roc.1.t: "The Chinese Revolution"
 ab_roc.1.d: "The Empire of China is a failed state to many, known more for its grotesque levels of government and military corruption than anything else. The Mandate of Heaven is the weakest it has ever been, and the Chinese people growing weary of a disturbingly long string of spineless emperors. Far too many have proven themselves incapable of holding off invaders, curbing factionalism, or even carrying out reform. They do all this, despite drowning themselves in orgies of vice and extravagance unbefitting of a Son of Heaven. The Imperial system has thus been running on borrowed time, ready to completely collapse in on itself at the drop of a pin. Indeed, this is exactly what has just occurred, as vast numbers of armed militia – both from the peasantry and army deserters – have taken to the streets. They call for a Revolution against the archaic and bloated corpse that China as a political entity has become. Every day, more of the desperate and discontent draw to the Republican banner, seeking to replace the old ways."
 ab_roc.1.a: "The Empire’s days may soon be numbered"
 ab_roc.2.t: "End of the Revolution"
 ab_roc.2.d: "Though we had to make many sacrifices, and lost many of our people in the great struggle, it all has finally paid off. China has finally been liberated from the hands of foreigners and tyrants. The republican flag flies in all cities, from Beijing in the north to Kunming and Guangzhou in the south. The enemy threat is destroyed; all subversives have been either removed from the country, or forced to pledge loyalty to the new constitution. It has become abundantly clear that the people now understand, and even embrace, the core principles of the republic. As such, we can finally demobilise, and step into a new age. The Chinese people are at last ready to rule themselves, without the incessant meddling of an autocrat. China shall henceforth be a bulwark against tyranny and foreign ambitions!"
 ab_roc.2.a: "A Great China; A New China!"
 ab_roc.3.t: "Storming of the Imperial Palace"
 ab_roc.3.d: "Despite initial assumptions that the Imperial family and their loyalists would attempt a last stand at their grand palace, there was minimal resistance as Republican forces battered down the gates and stormed into the courtyard. In fact, the Emperor, his consort, and the extended entourage complied with authorities to the letter, short of signing the instrument of abdication. However, following reports of their arrest and detainment within the palace, nobody has received any status updates on the wellbeing of the imperial family. Whether or not the Emperor and his companions are safe, the public outcry to lynch them has certainly amplified the deafening silence which shrouds the Forbidden City. Fearing for the worst, especially given the Republicans’ reputation amongst monarchist circles, a cabal of loyalist officers, aristocrats, and even peasants have banded together to mount a desperate rescue mission. Announcing their intent to rescue the Son of Heaven from certain death, only time will tell if this minor uprising can accomplish its mission, or die with the Mandate."
 ab_roc.3.a: "A sign of imminent defeat"
 ab_roc.4.t: "Army Deserters"
 ab_roc.4.d: "The army is an unfortunate victim of the rampant corruption, poor morale, and lack of equipment which many nations beset by war are afflicted with. Pairing this with a lack of ideological cohesion, and conflicting sentiments towards Republican doctrine, the armed forces can be described as a paper military on a good day. Indeed, the undisciplined rabble and cannon fodder who supposedly pass for soldiers have taken to skimming their commission pay before deserting. While some may board merchant ships for lands unknown, others have the gall to defect to the enemy, whether out of spite or due to alluring promises which shall remain unfulfilled, none can say. Alas, this shameful display has turned into an epidemic of mass-routing and a wave of mutinies, with word of each incident spreading at alarming rate. This does have a silver lining, though, for the remaining soldiery will no doubt prove themselves to be loyal and capable vanguards of the new China. In the meantime, though, we must continue to weed out the weak, and suffer the short-term defeats, so that the war may be won in the long run."
 ab_roc.4.a: "Damnable traitors!"
 ab_roc.5.t: "Depletion of the Imperial Treasury"
 ab_roc.5.d: "The Imperial Treasury was once an illustrious mountain of gold and other luxuries; a vault of the entire world’s envy. Alas, with the current crisis in full swing, what little was left to begin with has been greatly squandered in recent months. It would appear that, rather than wisely spending the gold reserves to further the war effort, many members of the bureaucracy decided instead to pocket it! Even though those responsible have since been dealt with accordingly, what money they stole will never be reclaimed, and the precedent which it has set will have a long-lasting impact upon the state and its finances."
 ab_roc.5.a: "They robbed us blind!"
 ab_roc.6.t: "Noble Revolt"
 ab_roc.6.d: "The former aristocracy, having been subjected to the seizure of most assets and estates, as well as a deprivation of political representation and authority, have been in a simmering state for some time. Ever since their deposition and loss of status, rumours began circulating of a plot to forcibly reinstate the nobility to their former positions, though such talk was hastily dismissed. The government thought the nobles powerless and impotent, but given recent happenings, it’s clear that they thought wrong. Beginning at dawn, the old nobility rose up in revolt, claiming that they only wished to restore what they perceived as rightfully theirs, regardless of what the new regime decreed. While they will be unlikely to cause long-term devastation, this is nonetheless a wakeup call for the state to not neglect a conciliatory approach towards survivors of the old order."
 ab_roc.6.a: "We cant afford to anger the nobility"
 ab_roc.6.b: "Oh, they will get their due!"

