 GOR2_ideas: "Goryeo Ideas"
 GOR2_ideas_start: "Goryeo Traditions"
 GOR2_ideas_bonus: "Goryeo Ambition"
 gor_first: "Korean Buddhism"
 gor_first_desc: "Under Goryeo, Korean schools of Buddhism would grow in popularity and influence, with the Seon school gradually becoming a de facto religion of the state. Through receiving favours from the Goryeo court, it would eventually produce the lion's share of scholarly work."
 gor_second: "Rockets of Choe Mu-seon"
 gor_second_desc: "The Korean inventor Choe Mu-seon brought gunpowder to the Goryeo kingdom after obtaining knowledge of it from a Chinese merchant. Among his great works include infantry cannons, Singijeon fire arrows, as well as Juwha and Hwacha rocket launchers. These feats of martial engineering will undoubtedly be a great boon to Goryeo's forces."
 gor_third: "Dynastic Ties"
 gor_third_desc: "Following the restoration of the monarchy in Goryeo, the dynasty would eventually forge close marital ties with the Mongol-dominated Yuan Dynasty of China. Derided as a 'son-in-law state' by her enemies, Goryeo could use these connections to their advantage."
 gor_fourth: "Goryeo Celadon"
 gor_fourth_desc: "Goryeo pottery, porcelain, and greenware are highly valued artefacts. Widely renowned and highly praised both at home and abroad, the celadon produced in Goryeo is almost to die for."
 gor_fifth: "Tripitaka Koreana"
 gor_fifth_desc: "The Tripitaka Koreana is an extensive collection of Buddhist scriptures translated into the Korean language. It is so comprehensive and bears so few errors, if any, that it may as well become the basis for other translations of the Tripitaka in the Far East."
 gor_sixth: "Goryeo Moveable Type"
 gor_sixth_desc: "Under the Goryeo dynasty, a metal moveable type was invented in the 13th Century to aid in the printing and production of religious and cultural texts. By further refining the type's design and accessibility, printing can expand quickly into other forms of literature."
 gor_seventh: "Pioneers of Naval Artillery"
 gor_seventh_desc: "The late 14th Century saw great advancements by Goryeo inventors in the field of naval artillery. The experimental ship-mounted gunpowder weapons and fire tubes which were developed granted the realm a cutting edge in maritime affairs."

