# Ideas #
 NLL_ideas: "Nara Ula Ideas"
 NLL_ideas_start: "Nara Ula Traditions"
 NLL_ideas_bonus: "Nara Ula Ambition"
 nll_first: "Ula Castle"
 nll_first_desc: "The Nara chief Buyan built our great Ula Castle on the Hulan river and founded the Nara Ula clan. This great castle has stood the test of time and defended us well as a reminder of our strength and resilience."
 nll_second: "Trading Between Worlds"
 nll_second_desc: "Nara Ula has, for centuries, been the economic link between the Mongol Steppes and the heartland of Manchuria. From Mongolian horses and livestock to grains and crops of Manchuria, it is no doubt we are masters of our trade."
 nll_third: "Mongolian Horse Trade"
 nll_third_desc: "One of our finest commodities we trade in is Mongol bred horses, which are undisputed champions on the battlefield. By leveraging our position and spending a little of our own resources, we can keep some stock ourselves for use against our rivals."
 nll_fourth: "Wanggiyan Descent"
 nll_fourth_desc: "Along with our cousins, the Nara Hada, we share ancestry with the Wanggiyan clan of Southern Manchuria, famous for founding the Jin dynasty. We can utilise these family ties to promote our place in Manchuria."
 nll_fifth: "Ula Diplomacy"
 nll_fifth_desc: "By making numerous key political marriages and alliances, we have managed to preserve our influential position within Manchuria. Even if the alliances of Manchuria shift, our networks will remain strong."
 nll_sixth: "Manchurian Breadbasket"
 nll_sixth_desc: "As we control some of Manchuria's richest farmland and economic centres, we are more than capable of supplying our war efforts. We can ensure that brave warriors do not fail simply due to a lack of supplies."
 nll_seventh: "Plain White Banner"
 nll_seventh_desc: "The Nara Ula clan is renowned throughout Manchuria for producing some of the finest banner armies of any clan. Our horses bred from Mongol steeds and conditioned for harsh terrain are a feared force to any who oppose us."

 ODL_ideas: "Wanggiyan Ideas"
 ODL_ideas_start: "Wanggiyan Traditions"
 ODL_ideas_bonus: "Wanggiyan Ambition"
 odl_first: "Enforced Nomadism"
 odl_first_desc: "The Mongols regularly invaded our lands sowing fear, hunger and death, forcing us to retreat further and further north, abandoning our old possessions. To ensure that we could keep moving without fatal losses, Prince Wengge 'the Kind' recruited our nation's most promising engineers to develop a system that would allow for quick, cheap, and efficient infrastructure construction."
 odl_second: "Proud Jin Successors"
 odl_second_desc: "Even though the Great Jin State has fallen, its royal bloodline has survived, clinging to the untamed wastes of Manchuria. We, the Wanggiyan Clan, are the direct descendants and only true successors to the Emperors of Jin. It is only a matter of time before our Mandate is restored, and we rise to claim our rightful place as the sovereigns of China once again!"
 odl_third: "Lingdan’s Chosen"
 odl_third_desc: "There is a legend about a hideous, pestilence-ridden creature with the head of a rat and the body of a toad called Šumuri. Following its defeat at the hands of the benevolent deity Lingdan, the victorious god vowed to protect the health of our people. Although many have abandoned the old ways, it gives courage to our soldiers, who trust that Lingdan is protecting them!"
 odl_fourth: "Chinese Administration"
 odl_fourth_desc: "In times of strife and war in China, we often find ourselves overwhelmed with refugees seeking safety. It seemed like a problem at first, but the learned among them have given us a functioning bureaucracy for the first time since our reign as the Great Jin."
 odl_fifth: "Freedom From Tribute"
 odl_fifth_desc: "The Temugids reigned over Manchuria with an iron fist to provide tribute for their overlords in Yuan for many years. Over this period, however, they gradually began to crumble and recede until we no longer had to pay them any heed. The relief brought by the loss of tribute demands has allowed us to expand merchandise tactics to the point where we can become a new hub for trade in the Orient."
 odl_sixth: "Soldiers Eat First"
 odl_sixth_desc: "In the late 14th century a series of particularly harsh winters led to a devastating wave of famine. To remedy this, a court advisor called Sholontu 'the Starved' proposed a controversial system whereby most of the food produced would be confiscated and sent first to the soldiers, thereby remedying the issue of starvation in the army."
 odl_seventh: "Reject Culture Shift"
 odl_seventh_desc: "Even during the era of the Great Jin, it was obvious that we were beginning to be influenced by Chinese culture. Although it has brought us many benefits, we nonetheless must not allow our identity or traditions – our own way – to be lost, lest the proud Wanggiyan clan find itself on the edge of extinction!"

 ASG_ideas: "Aisin Gioro Ideas"
 ASG_ideas_start: "Aisin Gioro Traditions"
 ASG_ideas_bonus: "Aisin Gioro Ambition"
 asg_first: "Win Political Supremacy"
 asg_first_desc: "As a cadet branch of the Wanggiyan dynasty, we have been living in their shadow for years. However, our ambitions are far greater than those of a vassal state. Through warfare and diplomacy, Aisin Gioro shall become the dominant force of Manchuria."
 asg_second: "Reform the Hunting Parties"
 asg_second_desc: "Our tribal military mostly consists of armed hunting parties with poor training and outdated equipment. While still effective against the other Jurchen tribes, our forces are no match for Mongol or Chinese troops. The hunting parties shall receive proper training and be reformed into permanent civil-military units called banners."
 asg_third: "Horse Supplies"
 asg_third_desc: "War is harder on horses than it is on men. We need to ensure that our fearsome cavalry units are well maintained and always have enough horses at their disposal."
 asg_fourth: "Legacy of Great Jin"
 asg_fourth_desc: "Ever since the fall of Great Jin, our people have been unsuccessfully attempting to reclaim its long lost glory. Now that we have won political supremacy in our home region, we can focus on much greater goals; the restoration of the Jurchen Imperial dynasty."
 asg_fifth: "Employ the Chinese and Mongol Frontier Generals"
 asg_fifth_desc: "The Chinese and Mongol military units stationed at the borders of the Empire have long mingled with the Jurchen people, adopting Manchu names and tribal customs. By offering them high ranks in our army, we would not only gain military skills and technical knowledge, but also make it easier for us to adopt institutional models of their more advanced societies."
 asg_sixth: "Steppe Leaders"
 asg_sixth_desc: "Even though our country's ultimate goal is to restore the Imperial dynasty which would rule the Middle Kingdom, we must not forget the legacy of our ancestors. By preserving our ancient traditions of the hunt, we ensure that our armies are always led by men who understand the use of the horse in combat."
 asg_seventh: "Claim the Mandate of Heaven"
 asg_seventh_desc: "Proclaiming ourselves the Great Khans might gain us the loyalty of the tribesmen, but if we wish to become the legitimate rulers of China, we are bound to adopt their political language of the Tianming; the Mandate of Heaven."

 JIN_ideas: "Great Jin Ideas"
 JIN_ideas_start: "Great Jin Traditions"
 JIN_ideas_bonus: "Great Jin Ambition"
 JIN2_ideas: "Great Jin Ideas"
 JIN2_ideas_start: "Great Jin Traditions"
 JIN2_ideas_bonus: "Great Jin Ambition"
 QNG2_ideas: "Great Jin Ideas"
 QNG2_ideas_start: "Great Jin Traditions"
 QNG2_ideas_bonus: "Great Jin Ambition"
 jin_first: "Expand the Banners"
 jin_first_desc: " There are many peoples within the former Yuan territories such the Khalkha and the Koshuuds and the Han that are flocking to our banners. By allowing these peoples into our Banners, a large and powerful multi-ethnic force available at the whim of the Jin Emperor is established."
 jin_second: "A New Standard Army"
 jin_second_desc: "The armies of the Yuan and the southern warlords have turned to ravaging the countryside as their states collapse in the fires of war and chaos. Should we bring these warriors into our army, while we would need to ensure loyalty to the Jin Emperor, we could create a military that is highly trained and disciplined."
 jin_third: "Pigtail or Death"
 jin_third_desc: "By executing the people who refuse to shave their hair on the front of the head and braid the rest hair into a pigtail, the Manchu superiority and dominance over all conquered people is continually shown and reminded even during the peacetime, thus no one would dare to rebel against us."
 jin_fourth: "Legacy of the Jin"
 jin_fourth_desc: "In the 13th Century, the Jin emperors fell to the ferocity and might of the Mongols as they swept into the Jurchen lands. Now, in our moment of triumph, as we defeat their successors in the fields of battle, we push forward to unite the old lands of the Jin. We shall reclaim Zhongdu and Kaifeng, the ancient capitals of the Jin, and proclaim their rule restored over all the middle kingdom!"
 jin_fifth: "Chinese Laws"
 jin_fifth_desc: "The Chinese way to administrate a nation is effective and worthy of study. By adopting Chinese laws and integrating the Manchu into Chinese systems, we can rule our empire more easily."
 jin_sixth: "Establish Southern Viceroys"
 jin_sixth_desc: "The southern states of China have developed something of a rebellious streak; their rebellion against the Yuan in the past has led them to resist foreign control. To simply conquer them will not work. We must employ the nobles of the realm, those that are loyal to our Emperor, to rule in our stead, to ensure peace in the south for years to come."
 jin_seventh: "The Great Campaigns"
 jin_seventh_desc: "To our south, the states near Siam and Angkor refuse tribute. To the west, those in the isles of Japan lay claim to our land. In the east, the tribes and monasteries of the steppe and Tibet remain independent. We are surrounded on all sides by enemies and threats. We must lead campaigns to bring the frontier into the fold, to defeat all those that dare stand to the Great Jin, and assert our dominance to the entire world."

# Reforms #
 faith_noble_reform: "Secure Nobility by Faith"
 faith_noble_reform_desc: "We need to tie our nobility to our regime as loyal lapdogs. Best way to do this is to promote and reward nobility that belong to Nestorian faith. Religious alignment goes a long way in securing loyalists."
 affairs_movement_reform: "The Self-Strengthening Movement"
 affairs_movement_reform_desc: "The center of technological progress has begun to shift westward during the Yuan reign. If we are to fix this we need to take what the foreigners have learned and improve upon it. We need foreign advisors."
 banner_upgrade_reform: "The Banner Army"
 banner_upgrade_reform_desc: "The open steppe, fleet horse, falcons at wrist, and the wind in hair. These are but a few things our Manchu culture has come to embrace with love. We should not abandon our beautiful traditions of horseback riding. Instead we should modernize it."
 future_of_war_reform: "The Future of War"
 future_of_war_reform_desc: "War changes, and which it we should aswell. Our traditional horses have become very cumbersome and outdated way to fight wars. We should move on from our furry companions and embrace the fire and steel as our new companions in war."
 cultural_enrichment_reform: "Cultural Enrichment"
 cultural_enrichment_reform_desc: "The Chinese are our subjects. If we are to rule over them with a velvet glove we ought to satisfy the cultural needs that they have and learn more of it. "
 cultural_reinforcement_reform: "Cultural Reinforcement"
 cultural_reinforcement_reform_desc: "The Chinese are our subjects, not our masters. Last previous times when the foreigners tried to invade and rule over China their cultures begun to  get wiped out - their traditions fading. Both Yuan and Jin experienced this. We should not repeat the same mistake. We need to actively put effort towards reinforcing our own culture to avoid assimilating to the Chinese."
 great_legal_code_reform: "The Great Legal Code"
 great_legal_code_reform_desc: "We should base our legal code upon previous empire's own, but make it more fitting for our regimes. The 700 statutes shall be expanded to 1900 statutes to take into context the changed circumstances that China finds itself in so we may govern it more smoothly."
 queue_order_reform: "The Queue Order"
 queue_order_reform_desc: "To break the Chinese into long-term submission we need to enforce humiliation upon them, and what better way than to take from them the one thing the confucean philosophy deems as vital: Hair. We shall mandate the Han men to shave their foreheads and braid the rest of their hair into a queue identical to ones the emperor and we the manchus wear."
 perfect_mandate_reform: "The Perfect Mandate"
 perfect_mandate_reform_desc: "Time moves on and China moves on, but the Mandate remains the same. It is an immutable object and we shall sustain it in its perfect form. It has existed since the early times of China and is something we will keep 'til the end of China."
 mch_clansociety: "Clan Society"
 mch_clansociety_desc: "The Jurchen tribes often organize via various levels of clan affiliation, ranging from the Muku sub-clans to ancient and extensive Hala clans, or even the companies or squadrons formed for local affairs. Family, war, and even daily activities involve some level of clan formation, not even necessarily by blood. We must ensure the role of these clan divisions are not forgotten in our society so that we may rule with efficiency."
 mch_tengri: "Jurchen Shamanism"
 mch_tengri_desc: "Jurchen shamanistic traditions typically revolve around ancestor worship and veneration of nature spirits via altars called Tangse. Not all altars were permanent, but in many settled communities, the Tangse were permanent fixtures where offerings were made. Ancestors also play a major role in shamanic tradition, as they are believed to be the protective spirits of a village who are contacted by shamans via totem poles, or Somo. By ensuring these practices continue and our shamans are respected, society will remain strong and cohesive."
 mch_nestorian: "Nestorian Syncretism"
 mch_nestorian_desc: "With the arrival of the Temugids came an influx of Nestorian scholars, bureaucrats, and clergymen to Manchuria. A majority of these foreigners remained settled in Liaoning where they serve the Temugid court, but some moved north and settled within our communities looking for missionary work or a new life. While they may practice a foreign religion that preaches radically different ideas, these are learned men who bring their knowledge from the Silk Road with them, and our people could benefit greatly from allowing the Nestorians a special status in society."
 mch_buddhist: "Eastern Syncretism"
 mch_buddhist_desc: "Our people have had centuries of experience with the religious practices of Buddhism and Confucian ideals from China. It has served us well to treat these faiths as equals among our shamanistic traditions, as they bring connections from across China and the steppes, and it would be wise to protect the status of these faiths in our government alongside our own beliefs."
 mch_admin: "Jin Administration"
 mch_admin_desc: "One of the most successful reforms of our Jin predecessors was the implementation of separate government structures for all its subjects. Every culture and ethnic group had a recognized status and dealt with the Jin via their own local government, and often even had a regional Jin capital. We must adopt this tradition once again in order to rule all manner of peoples effectively as we begin our ascenscion."
 mch_jin: "Legacy of our Ancestors"
 mch_jin_desc: "Arguably the height of our people was the establishment of the Jurchen Jin dynasty in China. Though the Dynasty collapsed with the rise of the Mongols, our conquests and continued survival has given us the chance to reclaim what the Jin once held. As we lay the groundwork for our great state, let us remember what is possible from the accomplishments our ancestors."

# Decisions #
 form_jin_dynasty_title: "Restore Jin Dynasty"
 form_jin_dynasty_desc: "The Jin dynasty was founded 300 years ago and used to rule the North of China but has been swept away by the Mongol Empire. Now that we have dethroned their descendants, the Yuan, we can proclaim the restoration of our dynasty."

