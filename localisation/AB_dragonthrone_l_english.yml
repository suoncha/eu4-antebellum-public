# Ideas #
 JOO_ideas: "Ezoshi Ideas"
 JOO_ideas_start: "Ezoshi Traditions"
 JOO_ideas_bonus: "Ezoshi Ambition"
 JOO_first: "Riders of Emishi"
 JOO_first_desc: "In the past, the Emishi kingdoms held back the house of Yamato as they tried to conquer the north, using their cavalry to their advantage in waging brutal war with the invaders. The Japanese were no match for our ancestors, as their stiff and stagnant strategy that they stole from the Chinese could not match our quick and elegant manoeuvres. While the Emishi did eventually fall, the Ezo people shall ride once more in their names, destroying the armies of the Daimyo and Shogun alike!"
 JOO_second: "Reclamation of Jomon"
 JOO_second_desc: "In ages gone by, the Jomon people inhabited these lands uncontested. The different tribes and peoples lived on the islands, practising our ancient traditions alongside nature. However, the invaders now known as the Japanese came and settled on these islands, driving our people back into the mountains. Soon, all that remained of our traditions and cultures were the disparate Ainu tribes of the far north. We must reclaim the isles for our own, pushing them back as we retake the land that is rightfully ours!"
 JOO_third: "Sea of Ezo Trade"
 JOO_third_desc: "The great sea connects us to the mainland as well as the tribes in the northern lands of Sakhalin. We must establish trade links across the Sea of Ezo, to not only gather the riches we need to fuel our empire, but also to connect with our long-lost brothers in the frozen north."
 JOO_fourth: "The Modern Itaomacip"
 JOO_fourth_desc: "For our people, fishing was crucial in surviving the harsh conditions of Hokkaido. We settled our villages along the coasts in order to hunt for salmon and huchen, the lifeline of many of our communities. In the modern era, we instead sail our ships out to the mainland, to sell the goods and wares of our homeland to foreigners from across the globe."
 JOO_fifth: "Dominate the Fur Trade"
 JOO_fifth_desc: "The fur trade that has begun in the east has begun to spread to our people. Lucky for us, the Ezo are masters of the craft, as we have been hunting and skinning the pelts of animals for centuries, even the mighty bear is no match for our hunters. We shall dominate this new economic opportunity and spread our ways across the seas!"
 JOO_sixth: "Legacy of the Thirty-Eight Years' War"
 JOO_sixth_desc: "In the year 773, the Japanese launched a final invasion attempt into our ancestor’s lands. While the fighting was touch and go, the Emishi fell, and the last stand of the Ezo people in the isle of Honshu fell with it. We shall never fall again as we did back then; even if it means resorting to the hit-and-run tactics that our ancestors used, we shall drive fear into the hearts of invaders and make sure they may never rest so long as they occupy Ezo territory."
 JOO_seventh: "Ko-Shinto Traditions"
 JOO_seventh_desc: "Our traditions are pure and true – unlike the Japanese to the south, they were never muddled and confused with the foreign practices of Taoism and Buddhism. We still follow the path set forth for us by the great kamuy, we know of the great tales of our forefathers and the truth that they espoused to us. Just like Kamuy-huci, we guard the hearth that is our tradition, and we shall never let it burn out."

# Reforms #
 ezochi_empire: "Ezochi Empire"
 ezochi_empire_desc: "We have dethroned our enemy and taken our rightful place as rulers of the archipelago and all its inhabitants. As we take over the remains of old Shogutate, we seek to establish a new domain, one more powerful and dominant than the ones that came before."
 integration_of_wa: "Integration of the Wa"
 integration_of_wa_desc: "For centuries, the Wa pushed our people back into the far north, even toppling the mighty Emishi Kingdoms in their drive to dominate and control the islands. However, we cannot afford to criminalize or attack those beneath us now; if we are to maintain a successful state, we must integrate the Wa into our state, and we must adopt elements of their culture and tradition. Even if that means giving power to those we conquered, we must do so if we are to survive."

