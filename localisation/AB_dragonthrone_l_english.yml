# Ideas #
 TGU_ideas: "Li Ideas"
 TGU_ideas_start: "Li Traditions"
 TGU_ideas_bonus: "Li Ambition"
 tgu_first: "Warriors of the Mountains and Steppe"
 tgu_first_desc: "Our people have always lived in harsh terrain, even before we came to this region. Our warriors are trained to survive and thrive in these lands, be it mountain or steppe, or warriors are capable and ready to use all the advantages they can to win a fight."
 tgu_second: "Courting of the Black Headed Tanguts"
 tgu_second_desc: "Our patronage of the priestly caste to support us and bless our leaders with their sage advice has paid off wonderfully. With their wisdom guiding us on the path of the righteous, our lords will always be able to make the fair decision, and, more importantly, be safe from internal squabbling that we faced when we initially arrived."
 tgu_third: "Legacy of the Xia"
 tgu_third_desc: "The Xi Xia were combatted on all sides both politically and militarily, by the Mongol and the Jin, and yet, our soldiers held their own against even the mightiest of foes. We shall continue that tradition of strong warriors, to not only defend ourselves but also to continue on in our conquest of our enemies!"
 tgu_fourth: "Pehar Gyalpo"
 tgu_fourth_desc: "When our people fled back into the Tibetan mountains after the destruction of Xia, once more, our culture once again spread among the local peoples. Pehar Gyalpo subdued and controlled the native spirits of Tibet in our culture, and through our rich literary tradition, it has spread throughout Tibet, spreading our beliefs and ideals throughout the land."
 tgu_fifth: "Rebirth of the Tangut"
 tgu_fifth_desc: "Our people and our culture were hunted down and wiped out by the Mongol invaders, forcing us to flee into the mountains for protection. We must maintain our tradition as otherwise; both our language and people could be lost to time."
 tgu_sixth: "Xia Buddhist Tradition"
 tgu_sixth_desc: "Our Buddhism has always taken influence from both the Chinese and the Tibetans and in our traditionalist faiths; We have more in common with our brothers in the faith than we do against them, and we should work with them to understand the true path to Nirvana more completely."
 tgu_seventh: "Statecraft of Jingzong."
 tgu_seventh_desc: "Emperor Jingzong, one of our mightiest rulers, had created the modern rule of law and state apparatus that we still follow to this day. The 16 Bureaus, the Chancellorship, and the various offices of power were created by him to ease the process of state crafting, and its effects have kept the kingdom alive through its darkest moments."

 XXI_ideas: "Xi Xia Ideas"
 XXI2_ideas: "Xi Xia Ideas"
 XXI3_ideas: "Xi Xia Ideas"
 XXI_ideas_start: "Xi Xia Traditions"
 XXI_ideas_bonus: "Xi Xia Ambition"
 XXI2_ideas_start: "Xi Xia Traditions"
 XXI2_ideas_bonus: "Xi Xia Ambition"
 XXI3_ideas_start: "Xi Xia Traditions"
 XXI3_ideas_bonus: "Xi Xia Ambition"
 xxi_first: "Iron Hawks and Trekker"
 xxi_first_desc: "Our armies carry with them the traditions of both sedentary and nomadic lives. We have read and adopted the Chinese stratagems, as have we begun the utilisation of modern gunpowder weaponry. Our Iron Hawk cavalry will be equipped with powerful rifles to rout our enemies, while our Trekker infantry will hunt and eradicate any oncoming armies if they dare step into our mountains. Just as we have with the Song, the Jin, and the Mongol, we shall stand defiant against all invaders!"
 xxi_second: "A New Literary Culture"
 xxi_second_desc: "Even with our language surviving the journey from the hinterlands of Tibet, it has still become a fringe dialect, rarely spoken outside of our realm and barely within it. We shall subsidise and promote a Buddhist education across our Empire, all to facilitate the spreading of our tongue. Just as our nobility did in the days of old, our administrators and scholars shall all have read the classical Chinese and Buddhist works, in Tangut no less."
 xxi_second2: "A New Literary Culture"
 xxi_second2_desc: "Even with our language surviving the journey from the hinterlands of Tibet, it has still become a fringe dialect, rarely spoken outside of our realm and barely within it. We shall subsidise and promote a Buddhist education across our Empire, all to facilitate the spreading of our tongue. Just as our nobility did in the days of old, our administrators and scholars shall all have read the classical Chinese and Buddhist works, in Tangut no less."
 xxi_third: "Rebirth of the Tangut people"
 xxi_third_desc: "With the birth of the revitalised Empire, we must settle our peoples across our old territories. We were once removed from our homeland and hunted to the brink of extinction by the Mongol Empire, and as such, we cannot let that happen again. We shall unite with our lost brothers and sisters in Hubei, and we shall use the wisdom they gained studying foreign ideas and philosophies in our court. The Tangut shall thrive just as they had done in the 12th and 13th centuries!"
 xxi_third2: "Rebirth of the Tangut people"
 xxi_third2_desc: "With the birth of the revitalised Empire, we must settle our peoples across our old territories. We were once removed from our homeland and hunted to the brink of extinction by the Mongol Empire, and as such, we cannot let that happen again. We shall unite with our lost brothers and sisters in Hubei, and we shall use the wisdom they gained studying foreign ideas and philosophies in our court. The Tangut shall thrive just as they had done in the 12th and 13th centuries!"
 xxi_fourth: "Unified Court and Clans"
 xxi_fourth_desc: "Our government, which has had the court and clans divided since we fled from the steppe and into the mountain, has evolved. Our leaders have been plagued by this issue; working with the major families and clans to gain their support, bribing and imprisoning when necessary. However, their hard work has paid off. The court is now secure, and the clans are now subordinate to the emperor. With that, Xi Xia is entering a new era of stability and prosperity!"
 xxi_fifth: "Outnumbered Forces"
 xxi_fifth_desc: "Our enemies have always outnumbered us: if we are to avoid another tragedy as we saw in the 13th Century, we must raise an army that can match those of the Yuan and the southern pretender states. We shall call upon those whom we have conquered; the Tibetans, the Oirat, the Tocharians of the basin, and anyone else we can find. With the new conscription laws, we shall whip our forces into pristine fighting shape, and we shall dominate this fractured and broken China!"
 xxi_sixth: "Legacy for Emperor Mo"
 xxi_sixth_desc: "Emperor Mo, who led a disastrous campaign against the Mongols in 1226, saw his forces defeated when our capital fell to Genghis Khan. We have since learned that we cannot overextend our armies; that if we are to win our wars, we must control key strategic positions and hold them. We must prevent uprisings behind us, and we cannot chase enemies down a path of no return."
 xxi_seventh: "Syncretistic Tangut Buddhism"
 xxi_seventh_desc: "Our people follow the faith of our homeland, a school of tantric Buddhism, and yet, we take inspiration from all the peoples of our empire. We integrate aspects of Shamanism and Chinese Buddhism; this allows us to better adapt laws that serve not just our faithful, but all citizens of our Empire. We will work to integrate those who follow the sister faiths, including those of foreign beliefs such as the followers of Nestor and Muhammed."

# Reforms #
 ximiniah: "Mi-niah Administration"
 ximiniah_desc: "The Tangut people escaped to the southern provinces of Jianchang, avoiding the total destruction of their culture at the hands of the Mongols. Our state however has issues founded in its roots, with older tribes and groups constantly needing to be appeased and dealt with. Thus, our ruler has pushed to take away power from the tribes and grant it to themselves, centralizing the power in our Kingdom."
 xiscript: "Tangut Script"
 xiscript_desc: "Created by statesman Yeli Renrong in the early 11th Century, the Tangut Script has been the official writing system of our people for generations. While it was primarily used to translate and transcribe Buddhist texts, we should start to use it on official documents and proclamations to promote and expand our culture’s influence."
 xiinfantry: "Reformed Trekkers"
 xiinfantry_desc: "Our Trekkers, or mountain troops, were facing difficulties during the Song Invasions hundreds of years ago. We must modernize and improve our tactics with firearms and new styles of warfare."
 xicavalry: "Tangut Iron Hawks"
 xicavalry_desc: "Our Iron Hawk cavalry, while powerful, were defeated by the superior Mongol riders. We have to improve and update our tactics if we can hope to stand up against not only the Yuan but other foreign powers that seek to conquer our state."

# Events #
 ab_xia.1.t: "The Rebirth of Xi Xia"
 ab_xia.1.d: "Our banners fly high over the walls of Xingqing, as our Iron Hawks enter the city to the cheers of hundreds. We come not as conquerors, but as liberators of our home, of the capital city of the once great Xi Xia Empire. Waving to their people, the elders of the great tribes go first, followed by members of the court, and lastly, our great ruler, who led us on this journey of reconquest. They head into the central palace, closing the heavy doors behind them.As soon as our court settled into their new home, a debate was raging between the courts and the tribes. This wasn’t uncommon, but it was over a matter that from a distance, could seem unimportant. They debated on what to call their new kingdom – while many from the Yuan to the Song called them the Tangut, their new empire ruled over many that were not of their language. They could continue to call themselves the Li, but the dynasty themselves deemed it wouldn’t help capture the momentous occasion that this was.Finally, our lord stepped down from their throne and pointed to the outskirts of the city. “Look at these people celebrating!” they said, “They cheer not because the Tangut or because the Li have returned, nay, they cheer because they believe the Xi Xia have returned, an empire to stand up to the crumbling Yuan and the fractured warring states. As such, that is what we shall be called – the Xi Xia Empire has returned!"
 ab_xia.1.a: "…and never again shall we fall!"
 ab_xia.2.t: "Encounter with the White Lotus"
 ab_xia.2.d: "The White Lotus was a religious order that focused on spreading the word of the Maitreya Buddha and reshaping the society of the Middle Kingdom. While many of the Confucian states tried to distance themselves from this revolutionary sect, their ideas align quite well with ours; not only do we walk a similar path to enlightenment, we both ahve been targeted and attacked by the menace of the Mongols. We should consider working with them to take down all those who attempt to stand against our expanding empire!"
 ab_xia.2.a: "We shall bring them into the fold."
 ab_xia.2.b: "Perhaps the way of the Lotus is the correct one..."

