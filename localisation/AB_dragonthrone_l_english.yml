# Events #
 ab_japan.6.t: "The Location of our Capital"
 ab_japan.6.d: "Now that we have united Japan under our rule, a question arises within our court. The capital of Japan, for centuries, has been in Kyoto, and as such, many of the traditional elite insist that the capital should remain there. However, many of the daimyo in the west still resist our authority. These Daimyo had resisted the Toyouji for centuries, and as such as still hesitant to serve under anyone but themselves. As such, our generals suggest relocating the Shogun’s place of residence to Edo, a small town in the Kanto Region. This would allow us to better assert our dominance out into the countryside. Both options have merit, and as such, it is up to the Shogun to decide on which path is right."
 ab_japan.7.t: "The Fall of Khanbaliq"
 ab_japan.7.d: "The crash of cannon fire – the screams of men. As the gates break down, the soldiers pour into the imperial city, attacking any who dare stand against them. Blood spills on the streets as houses burn around them. However, it is neither horde nor warring dynasty that comes to take the city; the invaders are from the islands of Nippon, a new threat in the Asian political landscape. From a distance, our [Root.Monarch.GetTitle] watches with keen interest as smoke continues to rise from the city. \n \nThe violence came to a slow, quiet end. Soldiers simply ran out of men to fight, houses to plunder, and territory to gain. The city was completely and utterly theirs. [Root.Monarch.GetName] walked through the remains of the imperial city, noting something strange around them [Root.Monarch.GetHerHim]. The buildings of the peasantry and elite fell to the carnage, but the temples filled with icons of the Buddha and various statues to their ancestors remained untouched. [Root.Monarch.GetName] smiled at this, proclaiming to their soldiers that the mandate of heaven is now upon the Japanese; they will be the ones to bring about an era of peace and prosperity for all the peoples of China, should they submit to us, of course."
 ab_japan.7.a: "This is the dawn of a new era"
 ab_japan.8.t: "Supremacy over the Middle Kingdom"
 ab_japan.8.d: "Since as far back as the Asuka Period, when the legendary Tang Dynasty first interfered with Japanese politics, we have based our political model on the idea of China being the center of the universe. Whether it was allied to them or opposed to them, the Chinese Empires were always the strongest power in the world which we had to contend to. However, with the weakening of the Yuan in the 14th Century, a major blow was dealt to their dominance. With our invasion and conquest of the mainland, we have driven our blade right into the heart of the dragon, taking its life. No longer shall China or any of its forces be a threat to us; we shall take our rightful place as the center of culture and power, and continue to spread our reach across the continent!"
 ab_japan.8.a: "From Khanbaliq to Canton, our realm grows!"
 ab_japan.9.t: "An Empire Across Asia"
 ab_japan.9.d: "With the conquest of the Burmese Kingdoms, we now stand as masters of one of the largest empires in the world. Our realm stretches from Tokyo to Rangoon, from tundra to plains, from imperial metropolises to rural rice villages. This new Japanese Sphere of influence rivals even those of Europe and continues to grow by the day, incorporating new provinces and territories of those who acknowledge our power and supremacy. While we organize our new empire, we have received delegations from foreigners speaking French, Arabic, and English, all wanting to learn more about our great Empire, no doubt to try and find a weakness in it. While we allow these foreigners to come and settle in our capitals, their diplomats can sense it. They can feel it when they discuss trade and territory, when they humbly request permission to cross through our waters, when they request access to our goods and materials. They know that should they cross the Japanese Empire; they shall be turned to dust!"
 ab_japan.9.a: "The Empire marches onwards"
 ab_japan.10.t: "The Imperial Restoration"
 ab_japan.10.d: "For centuries, the Shogun has been the real power behind the Japanese Empire. While the emperor himself has always remained something of an important figure, he is at most a figurehead in regard to actual political strength. However, recently, there have been internal shifts in power. The Shogun had come to rely on the Daimyo’s armies for security, and while he attempted to keep them separated and weak so they may never rebel, the cracks in his regime continued to show after the Shogun was powerless to stop a peasant revolt near Edo. Many Daimyo within the Shogunate saw the Shogun for what he was; a weakened ruler with neither an army or support and wanted to take their shot at being the leader. One such Daimyo went to the emperor, promising to enshrine them to their proper spot of political authority and power so long as they listen to what this daimyo said; essentially, the emperor would be a mouthpiece for this daimyo. \n \nHowever, the emperor was no fool. He had ambitions of his own. Turning on this Daimyo, he betrayed him to the Shogun by discretely leaking the information to the ruler. At the same time, he also won the support of this Daimyo’s followers and allies, claiming that the Shogun had unjustly attacked him. In a stunning move, the Shogun now had animosity from the vast majority of the Japanese elite, and the emperor had their support. With the Shogun’s authority ever weakening, they made a plea to the emperor; grant him a stipend and a residency to retire to, and he would abdicate to the emperor. The emperor accepted, and after 500 years, the Shogunate finally collapsed, and the emperor rose to power once more."
 ab_japan.10.a: "Long Live the Emperor!"
 ab_japan.11.t: "The Empire of Japan"
 ab_japan.11.d: "As the realm continues to grow and expand, many have made calls for it to be centralized. Japan for centuries has been dominated by extremely powerful local lords instead of a strong central government, which while effective at maintaining potential enemies within the state, limits the power of the government in dealing with crises and expanding. Thus, many statesmen in the imperial court have been attempting to find a new way to restructure the state. A running theme in this effort to centralize has been to model it around the emperor himself, as it is mostly due to his rule that this attempt is even possible. The emperor of course, agreed with this, and helped in crafting a new structure of the state. By the time they were done, the old model of Japanese governance was gone, and now all that remained was a new and powerful state, one that could state toe to toe with the empires of the west; it was the dawn of the Japanese Empire!"
 ab_japan.11.a: "Long live the Empire!"
 jap_capital1: "We shall keep our capital in our homeland."
 jap_capital2: "We must reign in the west; move my palace to Edo!"
 jap_capital3: "We shall keep the seat of Imperial Power in Heian-kyo."

 encountered_muslims_tooltip: "Any neighbouring country follows Islam."
 incident_spread_of_islam_title: "Spread of Islam"
 incident_spread_of_islam_desc: "Merchants come to us from the far west, carrying with them tales of the wise man Muhammed. While foreign religions are no stranger to Japan, this one is the most radical so far, and its adherents are as fervent with their faith. While initially simply being relegated to the port cities and the merchants that resided within them, recently some Daimyo have begun to adopt the faith for themselves and are now demanding their citizens do so as well."
 shinto_incident_islam_start.tt: "This starts the §YSpread of Islam§! incident."
 ab_halal_japan.1.t: "Muhammad's Men"
 ab_halal_japan.1.d: "Our empire has been host to many a foreign trader. From our ports in Kyushu to [Root.Capital.GetCapitalName], we have seen traders from the far off lands in Europe settle to trade wares and weapons. However, recently, traders from the lands of Egypt and Iberia come baring a new gospel. The followers of Muhammad, Muslims, is what they call themselves. While many of our citizens can barely even understand or comprehend what this faith truly is, they still convert on promises of paradise and salvation. It is spreading slowly in major cities, however, it has the potential to catch on to our population like wildfire, and spread rapidly throughout the land. \n \nWhile we do not fully understand them, recently, more and more missionaries have approached our councilors and even their highness [Root.Monarch.GetName]. Our translators were at a loss for words when they asked them to convert to this foreign faith. Our [Root.Monarch.GetTitle] stared at these men in strange attire and with strange customs, and deliberated on how to deal with the rise of this new faith in the land."
 ab_halal_japan.1.a: "Toss these men and their ridiculous faith out of my sight!"
 ab_halal_japan.1.b: "...I do not have time for this. Escort the men out, please."
 ab_halal_japan.1.c: "I see... tell me more about your faith."
 ab_halal_japan.2.t: "Muslims in Japan"
 ab_halal_japan.2.d: "Ever since they first arrived, the Muslim community has grown and expanded throughout our territory, especially in the south in Kyushu, where the traders make small settlements and spread their faith. While it started off as a fringe belief, recently, a local daimyo has converted to the faith. This could be problematic, as a local lord gaining power through a foreign faith could invite trouble. We must respond immediately!"
 ab_halal_japan.2.a: "Bring the Daimyo to me, I must learn why he did this!"
 ab_halal_japan.2.b: "Summon the Daimyo for a trial!"
 ab_halal_japan.2.c: "Arrest all those who follow the faith!"
 ab_halal_japan.3.t: "The Sunni Daimyo"
 ab_halal_japan.3.d: "The Daimyo that approaches us bears the name Fuyuko Shimazu. As he comes into the courtroom of our [Root.Monarch.GetTitle], he is flanked by his holy advisor, a man by the name of Ibn Faradi. They begin to speak to [Root.Monarch.GetName] about his decision to convert to the faith, about the all-powerful Allah and his path to salvation. Fuyuko also discusses how this has brought him alliances with those of Al-Andalus, a powerful and rich nation across the seas. Ibn Faradi is mostly silent but speaks up to correct Fuyuko whenever he makes a mistake in the theology or when he desires to add to the Daimyo’s tale A silence falls across the courtroom, and its many members turn to [Root.Monarch.GetName] to watch their reaction. What the [Root.Monarch.GetTitle] says here could determine the future of all the faithful of Japan!"
 ab_halal_japan.3.a: "Interesting. Tell me more, Master Faradi"
 ab_halal_japan.3.b: "We shall inspect and judge this new faith as we see fit"
 ab_halal_japan.3.c: "Arrest this man! Execute his priest!"
 ab_halal_japan.4.t: "Violence Against Muslims"
 ab_halal_japan.4.d: "Recently, in areas with large Muslim converts, attacks from local daimyo and civilians have become more common. In one such time, a makeshift Mosque was attacked and put to the torch by a crowd of Buddhists, calling the practice heresy."
 ab_halal_japan.4.a: "Send aid to those attacked."
 ab_halal_japan.4.b: "It is what it is."
 ab_halal_japan.5.t: "Islam Spreads"
 ab_halal_japan.5.d: "Conversions of the faith of Islam continue throughout our land. Many of their faithful travel from province to province, preaching and spreading the word of Muhammad to nearby peasants and Daimyo. While some resist, others follow in tow, and it is becoming quite a problem for our local authorities. More and more daimyo claim their true allegiance is to their god Allah over the [Root.Monarch.GetTitle]."
 ab_halal_japan.5.a: "More and more convert."
 ab_halal_japan.5.b: "Arrest them! Prevent the spread!"
 ab_halal_japan.6.t: "Islamic Uprising"
 ab_halal_japan.6.d: "Our push against the rising tide of Islam has led to the traitor Daimyos and their gullible followers to rise up against our rule! They cite the need to die for Allah, that his holy sword would smite their enemies and all of his foes…what fools they are! We shall cut them down and end this madness once and for all!"
 ab_halal_japan.6.a: "Let us see how well their “God” protects them!"
 ab_halal_japan.7.t: "The Legality of Islam"
 ab_halal_japan.7.d: "While we expected our judges and inspectors to simply reject this new and foreign faith, it seems that they have actually come back to us not only saying that it is legal and safe, but they also wish to convert! With this shocking revelation, we have no choice but to…"
 ab_halal_japan.7.a: "Accept the results. Let us allow this faith."
 ab_halal_japan.7.b: "Interesting! Let us follow this new faith."
 ab_halal_japan.7.c: "Reject the findings of the court!"
 ab_halal_japan.8.t: "Rejection of Allah"
 ab_halal_japan.8.d: "Our courts have returned and found that the faith has no business being in this state. We must arrest all those who have converted and push them out of our country, for the stability of the realm. While this might turn violent, should we do this smoothly, perhaps we can escape a revolt or uprising, and instead move us along out of this crisis in peace."
 ab_halal_japan.8.a: "We shall arrest the daimyo and push for civilians to apostate."
 ab_halal_japan.8.b: "We shall arrest and execute all those who do not apostate!"
 ab_halal_japan.9.t: "Court Converts to Islam"
 ab_halal_japan.9.d: "As cheers go around, another member of the court returns to us as a brother in faith. With the recent acceptance of Sunni Islam in our realm, more and more seek to convert to the true path, both old and new. Especially within the court, from those who heard the initial preaching of Ibn Faradi. Soon, with more and more of the nobility converting, the Empire of Japan shall become Sunni!"
 ab_halal_japan.9.a: "What good news!"
 ab_halal_japan.10.t: "Rebellion of the Shingon"
 ab_halal_japan.10.d: "With our [Root.Monarch.GetTitle]’s acceptance of Islam and allowing its continued spread throughout the realm, some of our more fanatical monks have risen up against us! They claim that we have lost the right to rule the realm as our faith goes against what our ancestors believed and is bringing shame to our entire people.  We must put down this rebellion and end this crisis!"
 ab_halal_japan.10.a: "They hold no power here anymore!"
 ab_halal_japan.11.t: "A Sunni Realm"
 ab_halal_japan.11.d: "With the conversion of our court and country, and the defeat of any potential pretenders, Sunni Islam has risen to dominate our realm. With a cry of Inshallah and a toast to those who died as martyrs, we celebrate the beginning of a new era in Japan, one in the holy light of Allah!"
 ab_halal_japan.11.a: "Allah is great!"
 ab_halal_japan.12.t: "A Shinto Realm"
 ab_halal_japan.12.d: "With the defeat of Islam both legally and militarily, we have ended the crisis of conversion. Our realm shall remain a place for the faithful alone, not those who worship a foreign and false god. We pray to our ancestors and perform rituals for their spirits, Japan remains on its traditional path!"
 ab_halal_japan.12.a: "Thus, the crisis ends."
