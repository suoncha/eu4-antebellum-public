# Ideas #
 JSN_ideas: "Joseon Ideas"
 JSN_ideas_start: "Joseon Traditions"
 JSN_ideas_bonus: "Joseon Ambition"
 JSN2_ideas: "Joseon Ideas"
 JSN2_ideas_start: "Joseon Traditions"
 JSN2_ideas_bonus: "Joseon Ambition"
 jsn_first: "Royal Petitions"
 jsn_first_desc: "Through the written sangeon and aural gyeokjaeng systems, commoners both illiterate and educated were able to directly bring forward their grievances to the King himself, bypassing unnecessary court bureaucracy. By maintaining the system, we can prove that the king has the people's best interests at heart."
 jsn_second: "Yangban"
 jsn_second_desc: "The scholarly elite, known as the Yangban, are bureaucrats and officials who have been appointed to serve as civil and court administrators within the Joseon Kingdom. Though they often take advantage of the system to have family succeed them, it cannot be denied that the scholarly work they conduct is oftentimes essential."
 jsn_third: "Neo-Confucianism"
 jsn_third_desc: "While the Goryeo dynasty had attempted to shift towards Buddhism as the state ideology, Joseon instead favoured the doctrine of Neo-Confucianism, a branch of Confucian philosophy centred around rational thought. With the traction it has gained amongst intellectual circles, this new system may prove beneficial towards the social and cultural development of Joseon."
 jsn_fourth: "Restricted Trade"
 jsn_fourth_desc: "In an effort to stamp out the corruption and Buddhist heresy that drove Goryeo to ruin, economic sacrifices must be made so that Joseon has a future. By ceasing production of Goryeo luxury wares and favouring agricultural development we can cut off foreign wants for the sake of the people, but stay afloat through strict control over the economy."
 jsn_fifth: "Supremacy at Sea"
 jsn_fifth_desc: "With the board-roofed Panokseon and Geobukseon turtle ships, Joseon has an often uncontested advantage in sturdy ship design within the region. Boasting excellent manoeuvrability, as well as enhanced protection in the case of the turtle ships, these vessels make for intimidating artillery platforms when engaged in coastal defence operations."
 jsn_sixth: "Dongeui Bogam"
 jsn_sixth_desc: "The Dongeui Bogam, published by royal physician Heo Jun in 1613, is an extensive compilation of medical texts pertaining to Korean traditional medicine. With such comprehensive and revolutionary knowledge about treating various ailments, many lives can be saved."
 jsn_seventh: "Righteous Armies"
 jsn_seventh_desc: "The Righteous Armies are irregular, civilian militias which band together when Joseon is facing an existential threat. Willing to conduct guerrilla raids and other forms of unconventional warfare, these militias have the capacity to catch invading foes off guard and deal serious damage to their supply lines."
 jsn2_second: "Yangban"
 jsn2_second_desc: "The scholarly elite, known as the Yangban, are bureaucrats and officials who have been appointed to serve as civil and court administrators within the Joseon Kingdom. Though they often take advantage of the system to have family succeed them, it cannot be denied that the scholarly work they conduct is oftentimes essential."

 GGR_ideas: "Goguryeo Ideas"
 GGR_ideas_start: "Goguryeo Traditions"
 GGR_ideas_bonus: "Goguryeo Ambition"
 ggr_first: "The Great Unifier"
 ggr_first_desc: "The Great Unifier, Goguryeo, has been restored, and once more it shall bring all of Korea under a single banner. For the first time since Goryeo's inception, the Korean peninsula has witnessed a true national unification. The spirit of Goguryeo shall propel the Korean people into another golden age, on the crossroads where past and present meet!"
 ggr_second: "Expanding the Cheolli Jangseong"
 ggr_second_desc: "An extensive network of fortifications and garrisons, the Cheolli Jangseong, or Thousand Li Wall, was built to protect Goguryeo's holdings in Manchuria. After Korea's division and subsequent reunification by Goryeo, the Great Wall of Goryeo was constructed to defend the interior of Korea against hostile attacks. With the situation abroad becoming more dire by the day, these defensive lines must be rebuilt and expanded beyond their original limits - even linked up if need be. All of Goguryeo's holdings shall be protected, at any cost!"
 ggr_third: "Haedong"
 ggr_third_desc: "The Korean concept of Haedong, 'East of the Sea', is a metaphysical idea greatly influenced by the Chinese notion of Tianxia. In this state, a realm is appointed to the sovereign; the 'Son of Heaven'. It is by his grace that the barbarians are kept out, and that Goguryeo prospers as it does. One might say that his rule is secured by the Mandate of Heaven! To go against Haedong is to reject the natural order, for the realms divinely bestowed upon His Majesty shall surely withstand even the greatest onslaught, lest the heavens abandon us..."
 ggr_fourth: "Cultural Legacy"
 ggr_fourth_desc: "In reviving Goguryeo and her ambitions, we must also see to ensure the realm's cultural legacy is preserved and perpetuated for all time! From the militarised society which made our ancestors strong, to the great festivals such as Dongmaeng and its ensuing celebrations, the Korean people shall once more enjoy what made old Goguryeo great! Let our forefathers be venerated, erstwhile the beer flows and youths test their strength. If all else fails, even if the heavens smite us, this legacy shall endure - intact and splendid!"
 ggr_fifth: "Rockets of Choe Mu-Seon"
 ggr_fifth_desc: "The Korean inventor Choe Mu-seon brought gunpowder to the peninsula after obtaining knowledge of it from a Chinese merchant. Among his great works include infantry cannons, Singijeon fire arrows, as well as Juwha and Hwacha rocket launchers. These feats of martial engineering will undoubtedly be a great boon to Goguryeo's forces, just as they were to Goryeo and Joseon."
 ggr_sixth: "Supremacy at Sea"
 ggr_sixth_desc: "Using heavily modernised variants of the board-roofed Panokseon and Geobukseon turtle ships, Goguryeo's navy often dominates the Korean coastline. Boasting excellent manoeuvrability, as well as enhanced protection in the case of the turtle ships, these vessels make for intimidating artillery platforms when engaged in coastal defence operations."
 ggr_seventh: "Pioneers of Naval Artillery"
 ggr_seventh_desc: "Goguryeo has inherited the tremendous advances her predecessors made in the field of naval artillery. The refinement and full implementation of ship-mounted gunpowder weapons and fire tubes have given Goguryeo alone the cutting edge in maritime affairs."

