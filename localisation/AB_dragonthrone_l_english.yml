# Ideas #
 UKM_ideas: "Urakami Ideas"
 UKM_ideas_start: "Urakami Traditions"
 UKM_ideas_bonus: "Urakami Ambition"
 ukm_first: "Bizen Shugo"
 ukm_first_desc: "As the Shugo of Bizen ,we stand in a position where lords from all over the Shogunate seek our aid. "
 ukm_second: "Setoguchi Trade"
 ukm_second_desc: "Bizen lays along the coasts of the Setoguchi and with it most of Japan's maritime trade. From this position we can take advantage of this wealth."
 ukm_third: "Defenders of San'yo"
 ukm_third_desc: "Bizen is at the end of the San'yo, or southern mountains of Chugoku. To oppose foes that would dare invade from this direction, we should focus on being faster than them."
 ukm_fourth: "Lesser Clans of Bishu"
 ukm_fourth_desc: "Various clans such as the Akamatsu, Ukita and Mimura serve our  clan, providing us with no end of capable talent."
 ukm_fifth: "An Artistic Lineage"
 ukm_fifth_desc: "Various clans such as the Akamatsu, Ukita and Mimura serve our  clan, providing us with no end of capable talent."
 ukm_sixth: "Allies of the Kanrei"
 ukm_sixth_desc: "We have long enjoyed ties with the Kansai Kanrei to our south, so that we are provided a position of respect within the Shogunate."
 ukm_seventh: "Himeji Castle"
 ukm_seventh_desc: "Built by our Akamatsu vassals, Himeji castle is an imposing fortress that will better allow us to defend the region, and inspire greater works of architecture."

 BSS_ideas: "Bessho Ideas"
 BSS_ideas_start: "Bessho Traditions"
 BSS_ideas_bonus: "Bessho Ambition"
 bss_first: "Tanshu Shugo"
 bss_first_desc: "Our clan has been given the lands Tanba and Tango, known collectively as Tanshu. While they are not the most valuable of lands, we have been forced to improve to survive."
 bss_second: "Protectors of San'in"
 bss_second_desc: "Tamba and its neighbours of Wakasa and Tango sit on the end of the San'in or northern mountains of Chugoku, to best counter any threats we should focus on firing down upon our foes before they can touch us."
 bss_third: "Allies of the Shogun"
 bss_third_desc: "We have played a role as an ally of the Shogun against the Kanrei, in response the Shogun is willing to turn a blind eye to our more aggressive actions."
 bss_fourth: "Yamato Basin Trade"
 bss_fourth_desc: "Ships travelling across Northern Japan must cross the Wakasa bay, which we control. This allows us to understand how to better funnel trade for our benefit."
 bss_fifth: "Against All Odds"
 bss_fifth_desc: "We have managed to survive many incursions, some even backed by the formidable Kansai Kanrei."
 bss_sixth: "Death before Dishonor"
 bss_sixth_desc: "We would rather die than allow our enemies to triumph, any who attack us will pay dearly."
 bss_seventh: "Wakasa Sea Goods"
 bss_seventh_desc: "Wakasa Province has access to many goods from the sea, such as salt and fish. These are products that are desired by the Court in Kyoto."

 NGO_ideas: "Nagao Ideas"
 NGO_ideas_start: "Nagao Traditions"
 NGO_ideas_bonus: "Nagao Ambition"
 ngo_first: "Warriors of Echigo"
 ngo_first_desc: "Moulded in battle against many of our foes, our warriors some of the fiercest in all of Japan."
 ngo_second: "Decentralised Administration"
 ngo_second_desc: "Echigo is a vast land and we cannot afford to upset our subjects. By trusting them to rule in our stead, we can devote more time to ruling larger areas."
 ngo_third: "Experienced Leadership"
 ngo_third_desc: "Our retainers are experienced and eager to face any who would dare challenge us. Be it against the Uesugi, Jinbo, Date, or whoever else."
 ngo_fourth: "Protectors of the East"
 ngo_fourth_desc: "Our strength on the battlefield has also become strength off of it.The Nagao have always been called in as mediators to help ensure that no one clan has an advantage."
 ngo_fifth: "Terminus of Hokurikudo"
 ngo_fifth_desc: "The Hokurikudo, or northern land circuit, provides a pathway of tolls and roads. Echigo, being at the end of this circuit, has only encouraged us to make our lands more welcoming for trade."
 ngo_sixth: "Sado Gold Mine"
 ngo_sixth_desc: "The Island of Sado controlled by the Homna clan houses a rich gold mine. If we can manage its output it is sure to bring us great riches."
 ngo_seventh: "Bounty of the Echigo Plain"
 ngo_seventh_desc: "The lands of Echigo are the most productive in Japan. With proper encouragement they could also be some of the wealthiest in Japan."

 KMK_ideas: "Kamakura Ideas"
 KMK_ideas_start: "Kamakura Traditions"
 KMK_ideas_bonus: "Kamakura Ambition"
 kmk_first: "Lineage of Minamoto"
 kmk_first_desc: "Our clan traces its lineage all the way back to the Minamoto no Yoritomo, the First Shogun of Japan. Even if we have fallen far our name is still one worthy of respect."
 kmk_second: "A Warrior House"
 kmk_second_desc: "It was our clan that was the first Shoguns, and we had only become Shoguns through our victory in the Genpei War. No matter what title we take, we are warriors first and foremost"
 kmk_third: "Rebuilding Authority"
 kmk_third_desc: "We once ruled Japan, and we will do so, but first we must make our word mean something again."
 kmk_fourth: "Tokaido Trade"
 kmk_fourth_desc: "Our coasts sit along the Tokaido trade route. It is imperative that we both protect and utilise them to our full advantage."
 kmk_fifth: "Reformed Administration"
 kmk_fifth_desc: "While our dreams of ruling Japan are distant for now, we must at least reform our administration where we must directly rule."
 kmk_sixth: "Lessons of the Past"
 kmk_sixth_desc: "The Mongols alone were not so fearsome, alone they were buffered by their Chinese and Korean auxiliaries. We must make sure that we are never bested by the strength of infantry."
 kmk_seventh: "The Return of the Hojo"
 kmk_seventh_desc: "For too long have we endured humiliation and betrayal, we return to place as the true power behind Japan, no matter the price we must pay."

 MGM_ideas: "Mogami Ideas"
 MGM_ideas_start: "Mogami Traditions"
 MGM_ideas_bonus: "Mogami Ambition"
 mgm_first: "Distinguished Ties"
 mgm_first_desc: "The Mogami are descended from the Ashikaga, a minor clan, who nonetheless have numerous descendants across the area. This allows us to have more contacts in the region than most other clans."
 mgm_second: "Local Clan Feuds"
 mgm_second_desc: "The Northeast of Japan is divided into countless clans spread across a large area. In order to face such a multitude of smaller foes in quick succession, we must be fast."
 mgm_third: "Mogami River Trade"
 mgm_third_desc: "Goods flow freely across the Mogami River both in land to Dewa and Mutsu and out towards the Northern coast of Japan. Due to our position around the river, we are poised to take advantage of it."
 mgm_fourth: "Lords of Southern Dewa"
 mgm_fourth_desc: "Dewa is a land of many independent clans, which we can draw upon their strength for our campaigns."
 mgm_fifth: "Yamagata Castle"
 mgm_fifth_desc: "Built over the Mogami River, Yamagata Castle takes advantage of natural terrain to allow our fortresses to be maintained for less."
 mgm_sixth: "Hardened Warriors"
 mgm_sixth_desc: "Our warriors have taken part in many wars that they boast of being some of toughest in all of the land."
 mgm_seventh: "River Patrols"
 mgm_seventh_desc: "The Mogami River that gives the clan its name runs near Yamagata Castle, in order to better defend the region, river patrols shall be established."

 UWA_ideas: "Uwa Ideas"
 UWA_ideas_start: "Uwa Traditions"
 UWA_ideas_bonus: "Uwa Ambition"
 UWA_first: "Masters of Seto Naikai"
 UWA_first_desc: "The Seto Inland Sea surrounds us on the Isle of Shikoku, and as such, we must dominate it with the might of our navy. Our ships will crush all those who dare to attempt an invasion!"
 UWA_second: "Iyo Resistance"
 UWA_second_desc: "In the Year 1418, our realm was invaded by the clan of Hata, who sought to expand their reach across Shikoku. Despite the city of Yuzuki falling into enemy hands, our Daimyo Katsumoto Uwa led a brutal guerilla campaign in the province, taking full advantage of the terrain before finally liberating the city and removing the Hata as a threat to our legitimacy."
 UWA_third: "Shingon Adherence"
 UWA_third_desc: "Our royal lineage is not originally from the lands of Japan; they instead originate from the territories of inner Mongolia. However, upon arriving, our leaders quickly took up scholarship and learning in the Shingon school of Buddhism, a native teaching to the lands. This not only secured our position amongst the Sangha, but also with the general populace, as fellow practitioners of the faith."
 UWA_fourth: "Masters of Warfare"
 UWA_fourth_desc: "What we lack in size we make up for in tenacity and courage. Our soldiers are brave and willing to die for our cause; they will stand against foes twice their size and come out with their chin held high."
 UWA_fifth: "Imperial Connections"
 UWA_fifth_desc: "Our clan has often held close ties with the Toyouji in Edo, with many of their advisors and ministers originating from our clan’s homelands. We are known across Japan for our wise diplomats and savvy negotiators."
 UWA_sixth: "Migrants from the Mainland"
 UWA_sixth_desc: "Our capital city of Yuzuki has a relatively large foreign population. Peoples from the Yuan and Joseon will often find themselves within our realm thanks to our connections with the mainland. These people often bring new and innovative ideas into our kingdom, and as such we grant them rights and protections so they do not fall victim to persecution."
 UWA_seventh: "Subjugation of the Peasants"
 UWA_seventh_desc: "The period directly following the rise of the Toyouji Shogunate saw a slew of rebellions in our territory. From peasants to monks, hundreds would take to their towns and local governors for various demands. Our lords prior effectively crushed these revolts, and to this day we still have many a strategy to prevent uprisings and rebellions."

 HTA_ideas: "Hata Ideas"
 HTA_ideas_start: "Hata Traditions"
 HTA_ideas_bonus: "Hata Ambition"
 HTA_first: "Marshalling the Troops"
 HTA_first_desc: "One of the key aspects to warfare is maintaining that your troops are disciplined and ready to follow orders. With our generals constantly leading drills and training exercises, our armies are ready and raring to go into any fight, and will continue to fight as trained under rain, snow, or thunder."
 HTA_second: "Hata Expansionism"
 HTA_second_desc: "The Hata Clan has long since sought to control the entire island of Shikoku. While we have thus far failed to take down our rival Daimyo, we will not rest until we are the sole rulers of our home island!"
 HTA_third: "Siege Warfare"
 HTA_third_desc: "The Hata Clan generals come from a long line of siege engineers. From the initial invasions to their many excursions to the mainland to assist the Yuan, they are known for being some of the best leaders to take a crack at a stalling assault on a fort; they only will need a few siege engines and some hardy soldiers and they will breach any wall."
 HTA_fourth: "Early Urbanisation"
 HTA_fourth_desc: "Our capital city of Nakamura, while small, is slowly growing with a rising population. We must expand our infrastructure and city size if we are to accommodate this new growing urban centre."
 HTA_fifth: "Shimanto River Production"
 HTA_fifth_desc: "Along the banks of the Shimanto, our navy of junks and fishing boats is built. With several hundred craftsmen and labourers working on new ships and repairs, our fleet shall be the pride of the Seto Inland Sea."
 HTA_sixth: "Effective Taxation Administration"
 HTA_sixth_desc: "The taxation system that the old Japanese Daimyo used on these lands was weak and crumbling in comparison to ours. We can effectively gain the revenue our state needs to maintain our steady growth and expansion across the Japanese isles, and it's thanks to the wise guidance of the Hata clan that the system is able to operate as smoothly as it does."
 HTA_seventh: "Hata Arquebusiers"
 HTA_seventh_desc: "The Hata clan have been fervent embracers of new musket and firearm technologies. With the creation of dozens of ashigaru regiments and the increased production of Tanegashima guns, our clan will be able to blow away all those who stand against us."

 KWH_ideas: "Kuwahara Ideas"
 KWH_ideas_start: "Kuwahara Traditions"
 KWH_ideas_bonus: "Kuwahara Ambition"
 KWH_first: "Port of Kagoshima"
 KWH_first_desc: "The port city of Kagoshima is a large commercial and trading hub in the southern island of Kyushu. Sailors from across the land come to congregate in this massive city, from which we can easily recruit and press into the navy."
 KWH_second: "International Trading Hub"
 KWH_second_desc: "The Kuwahara has deep connections to the kingdoms of the mainland and beyond, which allow us to receive new technologies and ideas long before many of the others can in Japan. Be it military weapons or political institutions, we are quick to discover and embrace these new inventions."
 KWH_third: "Subjugation of the Satsuma"
 KWH_third_desc: "Prior to the Mongol Invasion, the Satsuma clan resided over the territory we now control. Instead of eradicating them, we placed them as subservient to our own, forcing political marriages and adoption on their heirs to further integrate the two families. Thanks to this, our two families remain interlocked, and the political influence and military ability that the Satsuma had are now ours as well."
 KWH_fourth: "Hub of Zen Buddhism"
 KWH_fourth_desc: "Zen Buddhism is popular across East Asia, from China to Korea and even Japan, the practice remains popular among both common folk and military generals. We have adopted the tradition for ourselves, and host scholars from across many schools to come discuss religious thought and ideas within our court."
 KWH_fifth: "Raids on the Morokata"
 KWH_fifth_desc: "Our generals have often led raiding parties out into the neighbouring Daimyo, especially the Morokata. Like lightning, we strike in darkness to attack and pillage neighbouring towns and cities, leaving devastation in our wake. This has led our Daimyo to develop a fast and quick form of warfare that relies on brutal shock tactics to win engagements quickly and efficiently."
 KWH_sixth: "Tsurumaru Castle"
 KWH_sixth_desc: "In the Year 1424, Lord Hisanaga Kuwahara was the first Prince to see the great Tsurumaru Castle finished. This grand castle was a masterclass in construction and design, so much so that other daimyo rushed to the Toyouji, warning them that this was a sign that the Kuwahara were planning to build up power and overthrow them. However, thanks to Hisanaga’s diplomats and court relatives, the Toyouji were assured that this was merely a castle for protection against bandits and raiders. The Shogun even sent funds to help the Toyouji, to show their support for stabilising and centralising the realm. Thus, the elegant castle remained beautiful and effective."
 KWH_seventh: "Merchant Fleets"
 KWH_seventh_desc: "Across the seas, in the Moluccas and the South Asian Seas, there lies lands with treasures and riches beyond our wildest dreams. We must send fleets of merchants and traders to make sure that the goods that arrive there can be utilised by those of the Kuwahara clan."

 OIT_ideas: "Oita Ideas"
 OIT_ideas_start: "Oita Traditions"
 OIT_ideas_bonus: "Oita Ambition"
 OIT_first: "Unite Kyushu"
 OIT_first_desc: "The Isle of Kyushu is one of the wealthiest regions in all of Japan. Our rulers have long wished to control the region, and as such, we shall press our claims and expand rapidly, conquering our neighbours and subjugating the other Daimyo."
 OIT_second: "Funai Military Academy"
 OIT_second_desc: "In our capital of Funai, the Fuheng dynasty has created an expansive military training program. Those that attend, local lords and their sons, come out of the academy stronger and smarter than ever, ready to serve their Daimyo to the utmost of their ability."
 OIT_third: "Bolormaa the Great"
 OIT_third_desc: "The founder of the Fuheng dynasty was a woman by the name of Bolormaa Fuheng, the daughter of a Mongol lord and a Korean royal. She joined in the Mongol Invasions, and due to her excellence on the battlefield, claimed the territory of Bungo for herself, and established a mighty dynasty in the isles. As such, many women of the court will often seek to replicate her success, signing up to be generals and leaders themselves."
 OIT_fourth: "Links to Korean Buddhism"
 OIT_fourth_desc: "Our links to the mainland are strong, especially so in the realm of Buddhist thought. Oftentimes, our monks will go to Goryeo to study and understand the true path more completely, and when they return, they speak of new developments from around the world."
 OIT_sixth: "Usa Jingo"
 OIT_sixth_desc: "The Fuheng Clan is a proud patron of the Usa Jingo Shrine. We subsidise and protect the local monks and priests practising within the shrine, and in return they support us whenever a succession crisis emerges or when the population becomes angry or distrustful of the Fuheng."
 OIT_seventh: "Expansion of the Oita Military"
 OIT_seventh_desc: "If we are to dominate not only Kyushu, but all of Japan, we must expand our military to include those of different backgrounds. Conscription of the peasants as well as the samurai might bolster our ranks, but it could simply lead to our military becoming a paper tiger. As such, we must also increase the amount of training each individual conscript receives, so that we will have a mighty and powerful army, ready to take on any daimyo that challenges us."

 NKT_ideas: "Nakata Ideas"
 NKT_ideas_start: "Nakata Traditions"
 NKT_ideas_bonus: "Nakata Ambition"
 NKT_first: "Nakata Absolute"
 NKT_first_desc: "Our clan is small, and as such, if we are to be engaged in warfare, it often is long and costly, as we must gather our forces and siege down much larger rivals. However, our Clan are masters at controlling the court and the populace, and as such, can wage long wars without having to worry about local unrest or weariness."
 NKT_second: "Rally the Ronin"
 NKT_second_desc: "The Ronin often wander throughout Shikoku looking for both work and a good fight. However, they can be fickle; loyal only to coin, if a better price is offered, they could leave our side and join another. Our clan is famous for hiring and marshalling roaming Ronin to our cause, to replace gaps in our military should they appear. We are also great at maintaining their loyalty and trust, keeping them on our side until they are no longer needed."
 NKT_third: "Expand Awa"
 NKT_third_desc: "Our province of Awa is one of the poorest in all of Japan. We must expand the wealth and population of our province if we are to compete with our powerful rivals in both Shikoku and beyond."
 NKT_fourth: "Expansionist Dreams"
 NKT_fourth_desc: "The Nakata Clan have dreams of expanding their control and power over a larger and larger territory. They seek to integrate many nearby states into their powerbase, and to do that, they have a series of administrators and ministers, each one of them prepared for the complicated task of statecraft."
 NKT_fifth: "Awa Odori"
 NKT_fifth_desc: "The Awa Odori is a large dance festival held yearly during the Obon Festival in the Awa Province, and each year we preside over it, bringing both fame and notoriety to our home. While it might cost money to prepare and it is a nightmare should it run amuck into the night, the prestige that it brings is second to none."
 NKT_sixth: "Laws of Mochimasu"
 NKT_sixth_desc: "Having only been in power for a decade or so, Mochimasu Nakata has already crafted many legislation changes within his realm. Primarily, he pushed to enforce the social hierarchy commonplace throughout Japan, separating people into different social strata as to better rule over them. While merchants and some local peasant lords have complained, this brought the nobility and the samurai to his side, furthering his family’s control over the region."
 NKT_seventh: "Tantric Advisors"
 NKT_seventh_desc: "Prior to the loss of Tibet from Mongol command, the Sakya Pandita sent several Tibetan monks to our state as a gift. These monks began a legacy of teaching Tantric Buddhism in the court, and while their religious advice sometimes drove wedges between the mostly Pure Land Buddhist teachings of the Nakata, their advice on how to deal with peasants and fortifications is second to none and has aided the Nakata clan in their fight for dominance for many generations."

 MRT_ideas: "Morokata Ideas"
 MRT_ideas_start: "Morokata Traditions"
 MRT_ideas_bonus: "Morokata Ambition"
 mrt_first: "Story of Kojiki"
 mrt_first_desc: "The ancient manuscripts that tell of the landing of Hononinigi on the peak of Mt. Takachiho are our pride and joy, and the festivities help quell even the most rebellious of peasant."
 mrt_second: "Lineage of Hong Dagu"
 mrt_second_desc: "Our clan has a legacy of being founded by the great Hong Dagu, who, much like the other Yuan Generals, came and invaded Kyushu and eventually settled down in the province of Hyuga, supplanting the old clan and establishing his own."
 mrt_third: "Cadastral of the Forestry"
 mrt_third_desc: "We have comprehensively mapped out the forests surrounding us, including the various spots that spies and others that wish to infiltrate our territory have used to hide from our watchful eyes. With this, we should be able to rout out any spies that dare trespass in our domain."
 mrt_fourth: "The Liaoyang Connection"
 mrt_fourth_desc: "With our clan being directly tied to many of the powerful clans on the mainland, our administration is often filled with those who follow religious beliefs that are quite foreign to us. We shall treat them with respect and dignity and extend that tolerance to those who serve under us as well."
 mrt_fifth: "Unite Kyushu"
 mrt_fifth_desc: "As our influence grows in surrounding provinces, our clan prepares for war once more. We must extend our control to the entire island – and then, if fortune favours us, to the rest of the islands."
 mrt_sixth: "Network of Forty-Eight Fortifications"
 mrt_sixth_desc: "In order to properly defend ourselves we have created a system of fortifications where each castle can always support the next. There is no blind spot in our defensive line!"
 mrt_seventh: "Forest Warriors of Kyushu"
 mrt_seventh_desc: "Our warriors are trained in the forests that surround our lands, and have repeatedly made incursions into neighbouring Shimazu, hidden by the darkness of night and the cover of the trees, to take lives and slink back into the shadows with ease..."

 UDO_ideas: "Uto Ideas"
 UDO_ideas_start: "Uto Traditions"
 UDO_ideas_bonus: "Uto Ambition"
 UDO_first: "Legacy of Wenhu"
 UDO_first_desc: "The Wenhu clan originates from the mainland and came over during the Mongol invasions. They were devout Theravada Buddhists and were said to have originated from the southern Dali Kingdom. While they abandoned most of their old traditions, many of the elite families still perform rituals that are strange at times while also familiar to many of the devout Buddhists in our land."
 UDO_second: "Warriors of Higo"
 UDO_second_desc: "When the Wenhu landed on Kyushu, they had to fight tooth and nail for every province they could. The Japanese resistance was quite strong, and come 1375, there was a local revolt. When the revolt was finally subdued and its leaders executed, the Wenhu had an idea. Instead of imprisoning or killing those who resisted them, they instead conscripted them into the army, granting them certain privileges to prevent them from uprising again. This led to a well-trained fighting force that was knowledgeable about the area and was ready to support the Wenhu in any way they knew how."
 UDO_third: "Tolerance of the Foreign Faiths"
 UDO_third_desc: "Our realm has been integrated into the larger trade networks of the Mongol Empire, and as such, many foreign faiths now reside within our territory. Nestorians, Daoists, and even a few Zoroastrians all live within our land. With special protections, we manage the peace and reap the benefits of a pluralistic society."
 UDO_fourth: "Fury of Mount Aso"
 UDO_fourth_desc: "In our backyard, the gods rage beneath the earth. Fire spews into the sky, and clouds of smoke emerge from the ground in a raging fury. This is, of course, what many artists will draw and depict on woodblock prints as they travel to our land. In actuality, the volcano is active but docile, and more so an attraction to travelling writers and artisans, something which our Daimyo are more than happy to support and patronise."
 UDO_fifth: "Kumamoto City Trade"
 UDO_fifth_desc: "Kumamoto is a large port city, with hundreds of goods travelling in and out of its ports. Spices from Malacca, porcelain from Min, and Gold from Amago all changed between hands and shifted back and forth in international waters. This has brought great wealth and prestige to our humble domain."
 UDO_sixth: "Aso Shrine"
 UDO_sixth_desc: "The Aso Shrine is one of the oldest Shrines in all of Japan. Built over a thousand years ago, we have taken great care to watch over the building as well as patronise the family running it. The renovations and rebuilding that had to occur after the invasion has led to the Aso Shrine becoming a fusion of both ancient Japanese and modern Buddhist design philosophies; a truly wonderful sight to behold."
 UDO_seventh: "Tales of the Wandering Swordsman"
 UDO_seventh_desc: "Tales of Ronin, wandering swordsman with a skill in the blade unmatched by any other, filter through our land. Warriors of might and majesty that leave poets bedazzled, priests praying, and even kings and queens bowing. Those are the men that wander through our lands, and those are the men that we must recruit into our armies. "

 AWG_ideas: "Awaga Ideas"
 AWG_ideas_start: "Awaga Traditions"
 AWG_ideas_bonus: "Awaga Ambitions"
 awg_first: "Kansei Kanrei"
 awg_first_desc: "We are the Kanto Kanrei, the Shogun’s right hand. It is us who must bear the brunt of defending Kyoto, and we do so with zeal."
 awg_second: "Blood of Temuge"
 awg_second_desc: "Our lineage traces itself all the way back to Temuge, half-brother to Genghis Khan. While our new home does not have the horses our ancestors would deem worthy, we have not forgotten the need for flexibility on rough terrain."
 awg_third: "Stewards of the Old Capital"
 awg_third_desc: "Within our lands lies Nara, or Nanto, the old southern capital of Japan. In order to maintain its relevance, we must invest in public works and renovations."
 awg_fourth: "The Merchants of Sakai"
 awg_fourth_desc: "The city of Sakai has stood out as one of the few areas not controlled by nobility, instead being controlled by a council of merchants. By supporting them, we can transform Sakai into a hub of trade."
 awg_fifth: "Renovating our Faith"
 awg_fifth_desc: "Our lands contain many famous shrines and temples, both new and old. If we can renovate them, and pry the priesthood away from politicking, the whole realm shall reap the rewards."
 awg_sixth: "Rough Terrain Experts"
 awg_sixth_desc: "Kansai is a land dotted with mountains and hills which serve as ideal defensive positions. By taking advantage of the terrain, no enemy shall depart our lands alive!"
 awg_seventh: "Grey Eminence No More"
 awg_seventh_desc: "For far too long have the Agawa served as the Shogun’s most powerful allies, but with the Toyouji in sharp decline, the time has come to rid ourselves of the mantle of grey eminence."

 jap_fourth: "Teikoku Kaigun"
 jap_fourth_desc: "The Teikoku Kaigun, or Imperial Navy, is, due to our geography, a crucial part of our offensive and defensive arsenal. Therefore, it has been invested in significantly by many governments in the past, and we will continue to do so in order to make our ships and sailors the finest in the world."
 jap_fifth: "Encourage Construction Trades"
 jap_fifth_desc: "As population flows towards cities in ever increasing amounts, the art of constructing structures has become heavily sought after for both economic and housing reasons. To assist our growing urban labour force, we should sponsor skilled builders and reap the rewards."
 jap_seventh: "Imperialistic Ambition"
 jap_seventh_desc: "Japan has often disregarded the lands beyond our shores, interacting mainly in peaceful ways with our neighbours in China and Korea. However, we are a new nation, united and ready to face any foe: with that in mind, let us advance and claim the wealth and glories we deserve!"
 jap2_fifth: "Encourage Construction Trades"
 jap2_fifth_desc: "As population flows towards cities in ever increasing amounts, the art of constructing structures has become heavily sought after for both economic and housing reasons. To assist our growing urban labour force, we should sponsor skilled builders and reap the rewards."
 jap2_seventh: "Imperialistic Ambition"
 jap2_seventh_desc: "Japan has often disregarded the lands beyond our shores, interacting mainly in peaceful ways with our neighbours in China and Korea. However, we are a new nation, united and ready to face any foe: with that in mind, let us advance and claim the wealth and glories we deserve!"
 JAP2_ideas: "Japanese Ideas"
 JAP2_ideas_start: "Japanese Traditions"
 JAP2_ideas_bonus: "Japanese Ambition"
 JAP3_ideas: "Japanese Ideas"
 JAP3_ideas_start: "Japanese Traditions"
 JAP3_ideas_bonus: "Japanese Ambition"

# Reforms #
 japshogun: "Unification under the Shogun"
 japshogun_desc: "For centuries, the Shogun answered to the Emperor who was also the symbol of his authority. Despite that, many Shoguns tried to limit the influence of the Emperor and turn him into a ceremonial figure. Even if they succeeded, the Emperor was still very influential as many people believed that the Emperors were directly descended from Amaterasu, the Goddess of the Sun. But this is about to change. We shall elevate the Shogun above the Emperor and forever break the Imperial line from the Age of the Gods. Japan shall be placed under the absolute rule of the Shogun. A new era is coming."
 mechanic_can_form_shogunate_yes: "Allows formation of the §YShogunate§!"
 ab_can_form_shogunate_tt: "Can form the §YShogunate§!"
 mechanic_prevents_forming_japan_yes: "Prevents formation of §YJapan§!"
 japanempire: "Empire of Japan"
 japanempire_desc: "The Empire of Japan is now a centralised and modernised empire, different from the old empire under the de facto control of the Shogun. As the only nation in East Asia other than China to have the title of Emperor our empire is a demonstration of our new power and reputation."
 japanshizoku: "Reform the Shizoku Caste"
 japanshizoku_desc: "After our nationalisation and abolishment of daimyo hereditary properties, a new class of Shizoku, meaning, warrior families, was created. A state sponsored reform of this class would be necessary to prevent them from rebelling and to encourage them to work in productive ways for the empire."
 japanzaibatsu: "Reorganize the Shomin"
 japanzaibatsu_desc: "The merchants of Japan are seen as by some as lesser than other social classes due to them not actually producing any goods, only trading goods and wares that others have created. However, with the expansion of global trade and the boom in commodities and production the world over, courting the merchant class and giving them certain rights and privileges under our regime could be extremely beneficial to our growing empire."
 japanscholars: "Invite Foreign Scholars"
 japanscholars_desc: "Japan has a history of learning from the best of the time. With the introduction of Western knowledge we should learn from them by inviting foreign scolars into our court to increase our technological abilities."
 japanships: "Western-Style Shipbuilding"
 japanships_desc: "As an island nation and maritime empire, a strong navy is essential for our survival. This is why we should employ western style shipbuilding techniques to build a modernised navy that is able to rival even the greatest naval powers of Europe such as the Franks or the Anglo-Saxons."
 japanshinto: "State Shintoism"
 japanshinto_desc: "In order to further reinforce the idea that the Emperor is a divine being, we will excercise control of shrine finances and establish training regimes for priests to strongly encourage and emphasize this ideology. Our native religion, now an official faith of the Empire, shall become a powerful tool and everyone following it will have a privileged status in our society."
 japandivinity: "Emperor's Divinity"
 japandivinity_desc: "The Emperor of Japan is a divine entity, being recognised as a living deity on Earth. This divinity of our Emperor enforces even greater loyalty to his imperial majesty as everyone across Japan is united behind our great Emperor."
 japandaij: "Daijokan"
 japandaij_desc: "If we are to manage our growing territories with their foreign peoples and ideas, our government should be able to maintain the stability and structure of our realm. To that extent, we must expand the central government’s capacity, creating new divisions and roles for ministers and statesmen, from the Imperial Army to the Division of the Sciences, we must create a tightly run administration."
 japanshinbutsu: "Shinbutsu"
 japanshinbutsu_desc: "Ever since the 800s, Buddhism has been a key element to the Japanese spiritual identity. Instead of rejecting it, we shall fully embrace the nuanced nature of our beliefs and those of Buddhism. This can help us as we expand into the mostly Buddhist mainland."

# Decisions #
 japanese_empire_title: "Proclaim the Japanese Empire"
 japanese_empire_desc: "Japan is the land of Rising Sun - both in its meaning and in reality. And this reality shall be true in two fashions: Both in the symbolism of how when foreigners look over to Japan it is where the sun comes to them and in symbolism of how Japan itself is a Rising Sun - ever growing and ever flourishing. We will ascend to new heights as we will carry the shining beauty of the sun upon our shoulders and make our enemies jealous and our subjects humble."
 convert_to_islam_japan_desc: "This decision allows us to embrace Islam as the new state religion of Japan."
 convert_to_islam_japan_title: "Convert to Islam"

