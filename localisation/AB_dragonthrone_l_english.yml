 DRB_ADJ: "Dorbet"

# Ideas #
 TRO_ideas: "Tribal Oirat Ideas"
 TRO_ideas_start: "Tribal Oirat Traditions"
 TRO_ideas_bonus: "Tribal Oirat Ambition"
 tro_first: "The Western Mongols"
 tro_first_desc: "We are the westernmost Mongols of the heartland. Tamed by the Altai Mountains, and hardened in the deserts of Kashgaria. Having spent generations in the harsh wilderness of Siberia and the Altai Mountains, it would be foolish for anyone to try and tame us, and it would spell doom were we to ride upon an unsuspecting foe."
 tro_second: "Legacy of the Great Khan"
 tro_second_desc: "There are many who retell epic tales of the Oirat clans' exploits in the Great Khan's horde, wishing to reclaim and surpass this legacy. But this time, the Khagan shall be an Oirat, not one of the Eastern Mongols."
 tro_third: "Borjigin Ties"
 tro_third_desc: "Although the glory days of Genghis Khan's empire are long past, and the Great Yuan of his descents crumbles before our eyes, we still maintain close familial relations to the Borjigin clan. We cannot let these ties go to waste, as the political eminence they bring will ensure our continued importance in steppe politics."
 tro_fourth: "Forest People"
 tro_fourth_desc: "Our cousins in Eastern Mongolia and the Khans beyond the western mountains often call us 'forest people', due to us living away from the open lands of the steppe. However, this has trained us well for extreme or hostile environments, especially in unfamiliar terrain."
 tro_fifth: "Religious Tolerance"
 tro_fifth_desc: "Over the centuries many faiths have come and gone from the lands that surround us from Islamic merchants to Christian Scholars, and even Buddhist monks. Even if we hold true to our shamanistic traditions, it is important to let these strangers keep their ways, for that will ensure their loyalty."
 tro_sixth: "Foreign Expeditions"
 tro_sixth_desc: "When The Great Khan conquered the world and established his vast empire, many of our forefathers rode with him to both partake in the spoils and settle down. While many did not return, those who did imparted upon our homeland many new ideas and a wealth of knowledge from settled peoples. Although we maintain our ways, there is much to be learned from the men of the west."
 tro_seventh: "Qutuqa Beki and the Thunder Stone"
 tro_seventh_desc: "One of the oldest stories of our people originates from before Genghis Khan's rise to power. When he came to our homes demanding subjugation, the great chief Qutuqa Beki used a yada, or thunder stone, to raise a powerful storm against the Khan's armies. Although we ultimately sided with the Great Khan, Qutuqa and the thunder stone is a powerful story that continues to inspire our people to fight for their homeland."

# Events #
 ab_oirat.1.t: "Integration of the Khitan"
 ab_oirat.1.d: "The Khitan people to our west have resided within the Qara Khitan empire for centuries, only recently gaining political independence during the collapse of the Chagatai Khanate. While we have been political rivals for ages now, we do share similar cultural values and traditions and most importantly, we share a common foe; the Yuan. We shall integrate the Khitan people to be equals within our society, granting them rights and protections similar to any of the four Oirat tribes. This should not only strengthen the unity of our realm, but also bolster our ranks. The Khitan are a mighty tribe, and we would be fools to not use that power in our armies."
 ab_oirat.1.a: "Welcome to the tribe, blood brothers!"
 ab_oirat.2.t: "Fall of Khanbaliq"
 ab_oirat.2.d: "With the collapse of Khanbaliq by our hands, we have supplanted the Yuan as the dominant force in the region. While many of our elders clamor to claim a Chinese title, such as the Tangut and Mongols did, we shall instead unite take a different route. Instead of trying to emulate those of the middle kingdom, we shall embrace our heritage of the steppe and the peoples that live within it. We shall create an entity the maintains the traditions and culture of our land, instead of tossing it away as many others have done. Our new polity shall stretch across all of the great plains, from Ordu-Baliq to Samarqand, and shall be one where all nomadic peoples can live in peace and stability. Our military might shall be enough to subjugate any of our foes, to protect the people of our new empire and to go and bring them wealth and riches beyond their wildest dreams!"
 ab_oirat.2.a: "All Hail the Great Khagan!"

