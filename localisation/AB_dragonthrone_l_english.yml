# Ideas #
 AMD_ideas: "Amdo Ideas"
 AMD_ideas_start: "Amdo Traditions"
 AMD_ideas_bonus: "Amdo Ambition"
 amd_first: "Patron-Priests"
 amd_first_desc: "The Cho-Yon system grants our Khans increased legitimacy and control over their realm while also protecting and safeguarding the local religious authorities. It works by the Lamas granting titles and claims to the Khans, who then swear loyalty to the Lama themselves. Which side is more powerful varies on each patron and priest; still, it aids in maintaining the stability of the realm."
 amd_second: "The Makasar Monastery"
 amd_second_desc: "The Mongol control of Amdo saw the construction of several new and unique temples, for both Buddhism and Bon. The Bonpo temple of Makasar in the Rongwo Valley is a major site for the faith, owing its creation in the late 14th Century to Mongol patronage."
 amd_third: "Legacy of Doorta"
 amd_third_desc: "Sent forth by Godan Khan, Dorta Dakhan was a Tangut general who, on our orders, conquered much of Southern Tibet, and placed Sakya Pandita as the ruler of the region. His legacy lives on in our military tradition, as we learned from how he pushed through the mountainous terrain to subjugate the fractured and squabbling states of Tibet."
 amd_fourth: "Mongol Integration"
 amd_fourth_desc: "The Mongol people began to settle in the region in the aftermath of the Tangut departure, and have since integrated well within the Tibetan people. While the lords and rulers made an effort throughout the late 13th Century to appear more traditionally Mongolian as to gain the favour of the Yuan Empire, the people have become almost indistinguishable from those of the Tibetan, adopting the language and culture rather quickly."
 amd_fifth: "'Phags-pa Script"
 amd_fifth_desc: "Invented by a Tibetan monk by the name of Drogön Chögyal Phagpa for Kublai Khan, this language became used across the Mongol Empire. It was used as a translation tool for the various languages in the Pax Mongolica, from Chinese to Uighur to Persian. An incredibly influential tool that we still utilise to this day, the ‘Phags-Pa script is a prime example of the Mongol and Tibetan cultural exchange."
 amd_sixth: "Rangers of Kham"
 amd_sixth_desc: "The Amdo cavalry would often protect monks and rulers travelling back and forth between Beijing and Sakya during the latter’s domination of Tibet. The Kham region was known for raids and attacks on travelling forces, especially those who were against the Mongol rule; our forces fought them off and provided security for our nobility. In the modern day, we have integrated them into our fighting force, as a brutally effective flanking unit, meant for traversing in the mountain region."
 amd_seventh: "The New Tsongkha"
 amd_seventh_desc: "Our kingdom was built on the foundations of the Tsongkha theocracy, and as such, we have adopted many of their customs. From the Kadampa missionary tradition to their tantric texts, we follow the Buddhist faith devoutly. We are beset on all sides by various other schools and heathen religions. We shall use this foundation to bring the peoples of the steppe into the righteous path!"

 XUN_ideas: " Xuanzheng Ideas"
 XUN_ideas_start: " Xuanzheng Traditions"
 XUN_ideas_bonus: " Xuanzheng Ambition"
 XUN_first: "Xuanzheng Yuan"
 XUN_first_desc: "Founded by Kublai Khan in the 13th Century, the Bureau of Buddhist and Tibetan Affairs was originally a government agency created to not only regulate control over Tibet but all Buddhists across China. With our reclamation of Tibet and the re-establishment of this organisation to aid us in control over this vast new territory, we once more find ourselves in an authoritative position on all matters regarding Buddhist traditions. This is a privilege we take pride in, and one that we shall use to better the practice of every monastery, monk, and practitioner in our realm."
 XUN_second: "Reclamation of Tibet"
 XUN_second_desc: "Tibet has been reconquered, but many of our subjects claim that our work is not finished. The old lands of the Tibetan Empire stretch out for thousands of clicks in all directions; we must continue our reconquest, bringing more faithful into the fold of the Administration."
 XUN_third: "Modernise the Dpon-Chen System"
 XUN_third_desc: "The old administration was led by two distinct individuals, the Sakya Lama and the Dpon-Chen. While the Lama spent time either leading religious ceremonies or living in Khanbaliq, the Dpon-Chen would rule the country as a civilian leader. While the great administrator was traditionally chosen by the Yuan Emperor, our current Khan has decided to circumvent this and choose for himself, discussing with the Lama on who best to officiate and watch over the realm. With the diarchy working together in both secular and spiritual matters, our state will be a fine-tuned machine of efficiency and stability."
 XUN_fourth: "Fortress Tibet"
 XUN_fourth_desc: "Our realm covers the Tibetan plateau, a hostile and treacherous land to those living here let alone those attempting to invade. We shall watch them bleed their men dry as they try to assail us, with our walls being the very mountains themselves and our moats being the glaciers and rivers cutting the land in twain."
 XUN_fifth: "Agwang’s Campaign"
 XUN_fifth_desc: "In the late 14th Century, as the old administration collapsed from civil war from all sides, Agwang rode out with his mighty cavalry to prevent the Sakya from falling. His men rode with speed and fury, cutting down any resistance the monasteries put up against them, reaching Sakya to aid them in defence against the Tsang invaders. Despite the collapse of Sakya authority over Tibet in the aftermath of this rebellion, Agwang’s campaign is remembered as the last charge of the Mongols in Tibet. We shall remember his sacrifice and push onwards, defending our realm from all threats, internal and external."
 XUN_sixth: "Legacy of the Dishi"
 XUN_sixth_desc: "Dishi, or Imperial Preceptor, was a position created by Kublai Khan and carried with it great honour and power, dedicated to teaching China the truth around Buddhism. Despite the title becoming defunct after the Xuanzhengyuan’s first collapse, the connections created through the title with nobles, monasteries, and even the imperial court itself still remain, and we shall utilise them in order to secure diplomatic alliances across the Middle Kingdom."
 XUN_seventh: "Support of the Sakya Sect"
 XUN_seventh_desc: "The traditions of the Sakya Pandita and his sect are those that shall lead this state to peace and prosperity. The tantras that came from the Supreme Masters and the Lotsawa that visited the holy lands carry with them centuries of wisdom and understanding. We shall do our due diligence as a state to spread these teachings to the lost and confused peoples of China, spreading the true path to enlightenment that we hold close to our hearts and souls."

# Events #
 ab_amdo.1.t: "Tangut Remnants"
 ab_amdo.1.d: "The Tangut people who settled in the southern Kham region were the previous inhabitants of the region we now call home. Our forefathers drove them out from this land when they refused to submit to the might of the Mongol Horde; and now, we face a similar problem. We have conquered the lands of the Li dynasty, and we find ourselves ruling over the Tanguts once more. They have different traditions and a foreign language, which, no matter how similar, could potentially create a divide between us and them. Should we work to integrate them into Tibetan culture, to try and make them completely indistinguishable from the rest who live in the plateau of Tibet, or do we use their unique strengths for our own?"
 ab_amdo.1.a: "We shall integrate the Tangut, no matter the cost!"
 ab_amdo.1.b: "We shall give them a place in our realm"
 ab_amdo.2.t: "Amdo Resurgent"
 ab_amdo.2.d: "The descendants of Godan Khan have united the Tibetan realm. They lay claim to the territory Ganzu, which they used to own over a century ago. Our predecessors slowly took the land away from the Khans in order to centralize our state, which had the benefit of also weakening the Amdo horde, a powerful force in the region. However, they have grown powerful enough to be considered a threat; it might be worth listening to their demands, even if just to humor them."
 ab_amdo.2.a: "We shall grant them Ganzu"
 ab_amdo.2.b: "Bah, let their Khan moan all he wants!"

