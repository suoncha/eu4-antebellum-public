# Ideas #
 TCR_ideas: "Tocharian Ideas"
 TCR_ideas_start: "Tocharian Traditions"
 TCR_ideas_bonus: "Tocharian Ambition"
 tcr_first: "Ghosts of the Desert"
 tcr_first_desc: "Tocharian warriors have often been described by their foes as the 'pale ghosts of the desert,' and for good reason. These veteran trackers, hunters, and footmen have known the often brutal reality of life in the Taklamakan Desert since their youth, which gives them an overwhelming advantage when the need arises to traverse it. Our soldiers strike fear into the hearts of our enemies, springing traps when they least expect it, before vanishing without a trace."
 tcr_second: "Silk Road Contacts"
 tcr_second_desc: "The merchants of the Tarim Basin are among the most cunning and proficient of their trade. The ever-expanding Tocharian trade network allows these traders to act on our behalf as agents, securing important deals with sought-after clients, and even conducting espionage against enemies of the state."
 tcr_third: "Tocharian Necropoleis"
 tcr_third_desc: "With a growing population and less land than needed for burial, the Tarim cities have commenced construction of vast necropoleis for the deceased. Be they underground, within caves and cliffs, or even left on the surface, the Tocharian people shall find no greater sanctuaries and memorials for the departed."
 tcr_fourth: "March of the Vengeful"
 tcr_fourth_desc: "Many foreign barbarians have wreaked havoc upon the Tocharian people, and for over a millennium we have merely cowered in fear and submission. From the Tang Dynasty to the Turks, and until recently, those gluttonous brutes from the Mongol Steppe; we have seen them all. Having known our oppressors this long, it is time to break the cycle of weakness, and to strike back at those who have done us harm! The Vengeful march onwards - to retribution, or annihilation."
 tcr_fifth: "Flourishing Oases"
 tcr_fifth_desc: "The Tarim Basin's oasis cities were once sparsely populated, relatively minor settlements, which outsiders looked down upon in contempt. With centuries of dedication, good fortune, and an abundance of wealth from the Silk Road trade, however, our oasis towns have grown into marvels of the Far East! Vast irrigation networks, bustling centres of trade, and sprawling populations - by deep desert standards - now dot the Tocharian realm's heartland. New life has been bestowed unto the oases, and we shall make the most of it."
 tcr_sixth: "Monastic Education"
 tcr_sixth_desc: "Faith is one of the pillars of Tocharian civilization, supporting our rugged people in even the most trying of times. With a growing interest in scholarship amongst our society's elites, it would prove useful to integrate learning and the monastic tradition. Much to our good fortune, Thousand Buddha Caves are scattered throughout the desert, while Christian sanctuaries can be found within every city worth its weight in salt. By sending prospective students to study in these hallowed halls, under the supervision of religious officials, we may very well bear witness to a cultural revitalisation."
 tcr_seventh: "Ytarimpoy"
 tcr_seventh_desc: "Ytarimpoy, the Kingdom on the Road, is the name which our people have given to their realm. Although many would refer to it as Tocharia, we must never forget the old name and what it represents: an ancient land of untapped wealth and opportunity, flowing with exotic goods from all corners of the known world!"

 TOC_ideas: "Tocharian Ideas"
 TOC_ideas_start: "Tocharian Traditions"
 TOC_ideas_bonus: "Tocharian Ambition"
 toc_first: "On the Silk Road"
 toc_first_desc: "The Tarim Basin serves as a main highway along the Silk Road, bringing much wealth to the isolated Tocharian kingdoms."
 toc_second: "Resilient People"
 toc_second_desc: "Life in the Tarim Basin is difficult, and only the most resilient can survive such hostile conditions."
 toc_third: "The Tarim River"
 toc_third_desc: "The Tarim River is heaven-sent to the Tocharians, providing a source of life within the driest region of Eurasia."
 toc_fourth: "Oasis Cities"
 toc_fourth_desc: "The Tocharians have taken to inhabiting well-fortified oasis cities, safe from both the desert and their enemies."
 toc_fifth: "Inhospitable Lands"
 toc_fifth_desc: "Of the few foes who dare cross this scorched landscape, most are swallowed by the sands of the Taklamakan."
 toc_sixth: "Thousand Buddha Caves"
 toc_sixth_desc: "The vast Buddhist cave complexes in and around the Tarim Basin serve as beacons of faith for the Tocharian people."
 toc_seventh: "The Tarim Mummies"
 toc_seventh_desc: "Amidst the desert sands and oasis cities lie a number of burial sites and necropoleis, which contain the remarkably well-preserved remains of Tocharians and other early Indo-Europeans from ages past."

 KUS_ideas: "Kushan Ideas"
 KUS_ideas_start: "Kushan Traditions"
 KUS_ideas_bonus: "Kushan Ambition"
 KUS2_ideas: "Kushan Ideas"
 KUS2_ideas_start: "Kushan Traditions"
 KUS2_ideas_bonus: "Kushan Ambition"
 kus_first: "Kushan Dinara"
 kus_first_desc: "The Kushan Empire's dinara is prized and intensely sought after by foreign antiquarians for its frequent depictions of deities and kings, but it holds a far greater materialistic value. The imperial coinage contains high quantities of gold and silver, far more than most other nations, and it is for this reason that the dinara is the envy of the world."
 kus_second: "Yuezhi Legacy"
 kus_second_desc: "The Yuezhi were fearsome and proud nomadic people, whose influence stretched across a large swathe of Asia. Alas, our ancestors would eventually be scattered by the Gupta Empire, and were driven into the Tarim Basin. With the rebirth of the Kushan Empire, however, we shall remind the world of who we once were, and who they will prostrate before."
 kus_third: "Re-establish the Kshatrapas"
 kus_third_desc: "Our great Kushan Empire is too vast in its land and diverse in its peoples for an efficient centralised bureaucracy. Looking back to the First Kushan Empire, it is clear that we must grant a degree of self-governance to the locals, and what better way is there to go about this than by appointing a loyal noble to govern their own people - in our name."
 kus_fourth: "Dominance of the Silk Road"
 kus_fourth_desc: "Euro-Asiatic Trade is heavily centred on the Silk Road, which spans the length of Anatolia to China. Much to our good fortune, all routes lead through Kushan territory, meaning that merchants must pay tolls to travel both ways. Should we increase policing of these trade networks, and establish toll booths near oases and cities, we can dominate the flow of commerce between East and West!"
 kus2_fourth: "Dominance of the Silk Road"
 kus2_fourth_desc: "Euro-Asiatic Trade is heavily centred on the Silk Road, which spans the length of Anatolia to China. Much to our good fortune, all routes lead through Kushan territory, meaning that merchants must pay tolls to travel both ways. Should we increase policing of these trade networks, and establish toll booths near oases and cities, we can dominate the flow of commerce between East and West!"
 kus_fifth: "Syncretic Tolerance"
 kus_fifth_desc: "Much akin to the Kushan Empire of old, we find that securing the loyalty of our countless subjects can be attained readily through the state religion. By granting the various deities of our subjects an important status within the Imperial Cult, even if the official religion of the empire may differ from theirs, we will nonetheless pave the way to a more expedient integration process."
 kus_sixth: "Kushan Arts"
 kus_sixth_desc: "The old Kushan school of art was greatly influenced by pre-existing Greco-Bactrian, Iranic, and Indian schools, culminating in one of the most striking styles of its time. Alas, this revered style was lost to our disillusioned people until recently. Soon, Neo-Kushan relief sculptures shall be adorning the pediments of temples and the sprawling halls of extravagant palaces! Our art will surpass anything in the legendary cities of Constantinople and Alexandria, a thousand times over!"
 kus_seventh: "Devaputra Shaonanoshao"
 kus_seventh_desc: "Meaning 'Son of God, King of Kings' in the old Kushan tongue, these revered titles had been stolen from our forefathers by Samudragupta of the Gupta Empire, though in time even his line would be deprived of such honours. Our return to greatness necessitates the recognition of our sovereigns as the Devaputra Shaonanoshao, but they must prove themselves worthy of such splendour, lest we be stripped of our pride yet again..."

# Government Names #
 WALDOM: "Wäldom"
 WALL: "Wäl"

# Decisions #
 form_kushans_title: "Restore the Kushan Empire"
 form_kushans_desc: "Despite our enemies' attempts to destroy our ancestral legacy, centuries of warfare across Asia have instead hastened the return of the Kushans. Let the world feel the wrath of Kanishka once again!"
 form_tocharia_title: "Form Tocharia"
 form_tocharia_desc: "We Tocharians were once a divided people, squabbling amongst ourselves while vultures from abroad descended upon the oasis kingdoms. The millennia of strife and bickering are over; we are now one!"

# Events #
 ab_tocharia.2.t: "Conquest of Qaraqorum"
 ab_tocharia.2.d: "The empty plains where once stood the city of Qaraqorum are rendered barren, by the salt of tears shed by those who once called it home. All the city’s inhabitants, at least those who survived our conquest, have been sent to Kuci, hauling the stones of the Great Khan’s former capital with them. Someday we will rebuild that ancient city from the stones of their walls and palaces, though many of our captives won’t live to see that glorious day. Once their march of tears is complete, there shall be no rest, until our beloved Pearl of the Tarim is restored! When their penance is complete, only then may they find peace."
 ab_tocharia.2.a: "Woe to the vanquished!"
 ab_tocharia.3.t: "Fall of Xian"
 ab_tocharia.3.d: "Do not weep for the unworthy. Do not weep! Now only lonely ghosts will walk the streets of Xi’an, as it has been in Kroraina for generations, ever since they brought desolation upon our forefathers. A great feast will be held in our homeland to celebrate this great act of revenge! This is an event that shall be recorded forever in the annals of Tocharia’s history. The ghosts of Kroraina are avenged, and finally, they may sleep in the arms of whatever gods rule this world!"
 ab_tocharia.3.a: "The crying has ceased"
 ab_tocharia.4.t: "The Destruction of Luoyang"
 ab_tocharia.4.d: "Turpan was once a beautiful city. It was home to artists, craftsmen, merchants; men, women, and children of all occupations. Alas, their voices have long been silent, ever since the eastern bandits harried them, and their home. Long have its streets been empty, long have the graves been filled with people unavenged. That has all changed as of today, for we have taken yet another step towards vengeance! Towards claiming our rightful hegemony, over all the nations of the earth! One day soon, Turpan will be rebuilt, stronger than ever before; its foundations set on the bones of our enemies. Luoyang may have been a fine city once, but now it is naught but ruins, for we have torn its walls to the ground, and its people shall restore what they once stole from us, and destroyed."
 ab_tocharia.4.a: "All is right in the world"

