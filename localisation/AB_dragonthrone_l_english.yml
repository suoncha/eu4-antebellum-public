# Ideas #
 TJJ_ideas: "Toyouji Ideas"
 TJJ_ideas_start: "Toyouji Traditions"
 TJJ_ideas_bonus: "Toyouji Ambition"
 tjj_first: "Descendants of Kublai"
 tjj_first_desc: "When Prince Tohgon first set out from the mainland to take the Chrysanthemum Throne, he went with the blessing of the Great Khan Kublai. When the Prince and his forces broke through the Japanese defence in Kyushu, he set up a new lordship in the city of Kyoto, with himself and his descendants controlling the imperial capital. We carry the legacy of not only Kublai Khan, but also of Tohgon with us, and we shall live up to the glory of their names!"
 tjj_second: "Siege of Genko Borui"
 tjj_second_desc: "As Toghon landed on the mainland, the Japanese had prepared a large stone fortification, lining it with Samurai in a vain attempt to repel the oncoming soldiers. Through our superior forces and strategy, our ancestors were able to break through the fortifications and rout the Japanese defenders. This let the Yuan forces claim a beachhead for future pushes into the mainland and is a point of pride for our generals, showcasing our ability for siege warfare."
 tjj_third: "Gateway to the West"
 tjj_third_desc: "The holdings we have in Kyushu are vital ports for the entire archipelago, carrying goods from within the isles to the far west. Silver from Izumo, art from Kyoto, and even weapons meant for battle are all funnelled into the port cities and onto ships that will carry our goods into the Middle Kingdom and beyond."
 tjj_fourth: "Pragmatic Administration"
 tjj_fourth_desc: "The previous lords of our realm recognized that in order to maintain our control in this foreign land, the court would need to be flexible with the local lords and population. By granting many of the Daimyo autonomy within their holdings, and allowing the citizenry to have small local councils, we have created a system in which it is far easier to delegate control and maintain vassals within these territories, reducing the risk of an uprising."
 tjj_fifth: "Mongol Cavalry Tactics"
 tjj_fifth_desc: "Our cavalry has been trained in the old Mongol ways, but also with modern tactics tested in the Sengoku Jidai. With waves of archers and musketeers firing on the enemy one after another, even the strongest of opponents will cower before us!"
 tjj_sixth: "Unify the Princes"
 tjj_sixth_desc: "It has long since been a dream of the Emperor to unite the various princes that have broken free from control of the Shogun, and now we have been given an opportunity to do so. We shall be the ones to end this period of war and strife and assert ourselves over the isles as its undisputed master!"
 tjj_seventh: "Connections Across the World"
 tjj_seventh_desc: "From our embassies in Yuan to the distant communities in Siam, we have merchants and people positioned across the known world. It would be prudent of us to utilise these diplomatic connections in order to better facilitate our rise on the world stage…"

 JAPS_ideas: "Shogunate Ideas"
 JAPS_ideas_start: "Shogunate Traditions"
 JAPS_ideas_bonus: "Shogunate Ambition"
 japs_first: "Banish the Ronin"
 japs_first_desc: "The Ronin, or masterless Samurai, are no longer needed in our land. As we unify under the power of the Shogun, these Ronin who once served as a sort of mercenary for the various warring Daimyo are no longer necessary for our army. We shall instead create a powerful standing army built upon conscription and a core of well-trained elite units."
 japs_second: "Unification under the Shogun"
 japs_second_desc: "The Shogun, while not as holy or prestigious as the emperor, is still a unifying figure for all of Japan. Many look to them as a symbol of strength and power, as the one who saved Japan from the bloodshed and chaos of the previous era. In this new world, only the Shogun can lead us into a bright new future."
 japs_third: "Sankin Kotai"
 japs_third_desc: "Even after unification, there are various powerful daimyo across Japan that could be a threat to our rule. To counter this, we have created the Sankin Kotai system. For several months out of the year, we shall have the various lords of the realm come and live in the capital. They, of course, shall maintain and fund their chambers, servants, and groundskeepers. This is not only going to place a major financial burden on them but shall prevent them from forming factions and alliances within their home territories, eliminating the threat of a revolt."
 japs_fourth: "Military Dictatorship"
 japs_fourth_desc: "The military of the Shogunate must be well maintained. We hold our power through military might, through the force of our soldiers and our weaponry. We shall trade with the foreigners, gain the technology and experience forged in battlefields in the west, and put it to practise here in Japan."
 japs_fifth: "The Lord of All Clans"
 japs_fifth_desc: "While the Shogunate is a dictatorship, much of our actual military force comes from the local Daimyo. We conscript their men into our army and train them to be loyal to the Shogun. Many outsiders claim that this process is tyrannical, and question why the Daimyo do not simply rise against the weakened Shogun. However, what they fail to realise is that it is simply the obligation of the Daimyo to supply manpower to the Shogun, as they are the supreme master of all the clans of Japan."
 japs_sixth: "Kamikaze"
 japs_sixth_desc: "The Toyouji were able to take control of the Shogunate centuries ago by avoiding the typhoons and subjugating the old Kamakura Shogunate. Now, as we have united Japan, we shall create a new defensive force, a navy unlike any other, whose sails shall be filled with the divine wind as they protect the home isles from all invasions!"
 japs_seventh: "Shogun's Authority"
 japs_seventh_desc: "The Shogun's reforms have brought peace and stability to all of Japan. The countryside flourishes, while the cities grow and expand. Markets boom and the army is strong. Our realm prospers all under the guiding and absolute hand of the Shogun, who has the authority of the emperor and the might of the military. None shall stand between him and his goals, just as nothing stands between Japan and hers!"

# Government Names #
 SHOGUNATE: "Shogunate"

# Reforms #
 japansakoku: "Strengthen the Sakoku"
 japansakoku_desc: "Although the Shogun is Japan's de facto ruler, the regime is not absolute. The Shogunate must thus ensure that his daimyo do not succumb to forigen influences, which may instigate rebellion. Henceforth, Japan shall be closed off, save for only a few areas directly under our clan's control."
 japantenryotax: "Tax the Tenryo"
 japantenryotax_desc: "In Japan, owned land is seen as the source of one's wealth, with all currency based upon how much rice it can produce. From now on, the Shogunate shall seek to obtain as much land for our clan as possible, and tax it appropriately."
 japanshinsengumi: "Form the Shinsengumi"
 japanshinsengumi_desc: "The Shinsengumi, or New Select Brigade, is the Shogunate's most recent experiment in policing. The recruits have been drawn from many sword schools across the capital, with the mission of protecting Shogunate officials from dissenters. Should these men prove themselves, they will set a new precedent for the Bakufu's military police."
 japanbakuhan: "Establish the Bakuhan System"
 japanbakuhan_desc: "Despite being the hegemon of Japan, the Shogunate must ensure that the Daimyo remain loyal. To this end, the regime shall ensure that the Bakufu's various Han are headed by pliable Daimyo. From making annual trips to the capital, to retaining only a single fort, and even subjecting their own territories to land reforms, the Shogun shall ensure that his feudal vassals are perpetually incapable of revolt."
 japanredseal: "Issue the Red Seal Ships"
 japanredseal_desc: "In the past, we were content to merely let the individual clans engage in trade, oftentimes at their own discretion. In order to cut down on corruption, foreign influence, and seditious trade activities, the Shogun shall regulate all commercial activities through the issuing of Red Seal permits. This policy will finally allow us to both control and centralise Japan's trade."
 reformed_shogunate: "Reformed Shogunate"
 reformed_shogunate_desc: "Having reduced the Emperor to nothing but a ceremonial figure and centralized the entirety of Japan under our rule, the time has come to refom the Shogunate and march towards the glorious future!"
