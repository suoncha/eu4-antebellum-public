# Ideas #
 TMG_ideas: "Temugid Ideas"
 TMG_ideas_start: "Temugid Traditions"
 TMG_ideas_bonus: "Temugid Ambition"
 TMG2_ideas: "Temugid Ideas"
 TMG2_ideas_start: "Temugid Traditions"
 TMG2_ideas_bonus: "Temugid Ambition"
 tmg_first: "Legacy of Temüge"
 tmg_first_desc: "While he may not have shared the same martial glory as his elder half-brother, the great Genghis Khan, Temüge was still known as a shrewd and efficient politician and administrator. Though he was unsuccessful in usurping Ögedei Khan, we can draw many lessons from our great ancestor's deeds."
 tmg_second: "Kublai's Folly"
 tmg_second_desc: "Kublai Khan's persistence in treading the path of Sinification threatened the Mongol way of life, and so Prince Nayan, the most renowned sovereign of our realm, took it upon himself to raise the banner of rebellion. We must remind the world that it was we who felled the Great Khan."
 tmg_third: "Oriental Christianity"
 tmg_third_desc: "The Church of the East, also known as Nestorianism, has been the state religion since Prince Nayan's days. By grace or providence, the Nestorian Church's compatibility with Oriental culture has formed a bridge between the Cross and the Pagans, and in doing so greatly bolstered cooperation and productivity."
 tmg_fourth: "Appanage Princedom"
 tmg_fourth_desc: "One of the last remaining Appanage Princes of the Mongol Empire, the legacy of this system still clings desperately to life. Without the Great Khan in Yuan ruling us as if we're mere bannermen, an astute observer would note the economic exploitation we get away with, and the benefits such endeavours reap."
 tmg_fifth: "Ghostly Horses of the Plain"
 tmg_fifth_desc: "The prowess of the Mongolian horsemen is renowned across the world. Our enemies will tremble with fear at the sight of a dust cloud in the distance; fear that it may signify our cavalry's approach!"
 tmg_sixth: "Adoration of the Cross"
 tmg_sixth_desc: "Our brave soldiers' hearts are captured by adoration towards the Cross, knowing that as they love God, he loves them. This religious fervour will undoubtedly steel them in the face of insurmountable odds, and inspire he who dares to win."
 tmg_seventh: "Populist Tolerance"
 tmg_seventh_desc: "It is obvious that we are outsiders to our own subjects, even after well over a century of ruling them. Whilst we refuse to bow to foreign customs as Kublai did, we can at least form connections with and even offer a helping hand to our countrymen in times of need. All the while, we shall remind them of the cruelty and misery rife outside our domain."
 tmg2_sixth: "Adoration of the Cross"
 tmg2_sixth_desc: "Our brave soldiers' hearts are captured by adoration towards the Cross, knowing that as they love God, he loves them. This religious fervour will undoubtedly steel them in the face of insurmountable odds, and inspire he who dares to win."

# Decisions #
 rename_temugid_empire_title: "Proclaim the Temugid Empire"
 rename_temugid_empire_desc: "Changes the country name to Temugid Empire."
 convert_nestorian_title: "Convert to Nestorianism"
 convert_nestorian_desc: "The Nestorian Christians now form a religious majority in our country. In order to prevent any religious tensions, we should probably accept Nestorianism as our state religion."

# Events #
 ab_temugids.1.t: "Fall of Khanbaliq"
 ab_temugids.1.d: "After a turbulent siege, Khanbaliq has finally succumbed to our strength of arms; its garrison's morale is destroyed, the gates reduced to kindling, and the empire's pride dragged through the mud. While the emperor and his sycophantic entourage may have fled, Yuan's treasury is largely intact, leaving us with a great abundance of plunder for the troops to divide as spoils of war. Alas, chaos is rampant in the streets, with panicking citizens - and even the imperial guard - engaging in widespread looting across affluent districts, while non-combatants desperately scramble to escape, or hurl themselves from the walls. While the line of Temüge never intended to outright destroy Yuan, but rather reform it into a bastion of the True Faith and Mongol people, it is abundantly clear now that the empire of Kublai Khan is in its death throes. From the ashes, we may rebuild the Mongol Empire in Temüge and Prince Nayan's image."
 ab_temugids.1.a: "Temüge is smiling upon us"
 ab_temugids.2.t: "A New Mandate of Heaven for a New Empire"
 ab_temugids.2.d: "The Mandate of Heaven follows an obsolete, pagan, model and is an ill-fit for our new empire. Already, its meaning has been somewhat redefined under the Liao, Jin, and old Yuan's rule. In an effort to preserve Mongol tradition in a Christian model, the Temügid state must remove not only the sinocentrism of prior interpretations, but also its heretical worldview. Henceforth, the Emperor shall be seen as Christ's Messenger on Earth, his rule ordained by the Lord, but no longer be viewed as a false Son of God. Furthermore, the Nestorian Church shall be responsible for taking over from Confucian scholars, with the Patriarch of Mongolia responsible for crowning each successive Khagan. We have, after more than two centuries, finally accomplished what Saint Nayan had sought to bring about. God is good."
 ab_temugids.2.a: "The Mandate will fit our needs!"
 ab_temugids.3.t: "Eastern Patriarchates"
 ab_temugids.3.d: "The Far Eastern Patriarchates have seen steady growth, in both followers and influence, under Temügid rule. Though the Yuan's suppression of Oriental Christendom cast doubt upon the worthiness of the Cross, the situation is now under control. Already, pilgrimages have commenced on a large scale, with many from the distant west risking the extensive Silk Road to visit our holy sites, and vice versa. With more time and a little oversight, the Eastern Patriarchates shall become a beacon of Christian civilisation for all the world to marvel at." 
 ab_temugids.3.a: "Great"
 ab_temugids.4.t: "Holy and Celestial"
 ab_temugids.4.d: "The word of Christ has long had sway in China, with notable minorities dating back centuries into the past, but never has a faith gained such grip in China as Nestorianism has now. Our largescale conversion efforts throughout all of China have borne fruit, and our empire is home to one of the greatest hubs of Christianity the world has ever seen. Despite embracing the one true faith, we have not ignored our ancestors: our traditions have remained a steady rock on which we have built our church, and the Emperor remains the leader of the oldest civilisation on Earth. Glory to our Emperor, the leader of the faithful on Earth, and to Christ in heaven!"
 ab_temugids.4.a: "Amen"

