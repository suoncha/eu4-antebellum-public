# Ideas #
 QQT_ideas: "Khitan Ideas"
 QQT_ideas_start: "Khitan Traditions"
 QQT_ideas_bonus: "Khitan Ambitions"
 QQT2_ideas: "Khitan Ideas"
 QQT2_ideas_start: "Khitan Traditions"
 QQT2_ideas_bonus: "Khitan Ambitions"
 qqt_first: "Reestablish our Statehood"
 qqt_first_desc: "Our country fell victim to the rapid expansion of Mongols under Genghis Khan and his successors. After two hundred years of subjugation, we are finally able to reestablish our statehood as the power of the Great Yuan crumbles."
 qqt_second: "Khitan Heavy Cavalry"
 qqt_second_desc: "Since the times of the Liao dynasty, our armies were mainly based around heavy cavalry. We must make sure that this tradition is the backbone of our military."
 qqt_third: "Church of the East"
 qqt_third_desc: "Before the subjugation of Qara Khitai by the Mongols, our rulers had converted to Nestorian Christianity. Over time, most of our people have embraced this new faith and now it stands as the official religion of our newly reestablished kingdom."
 qqt_fourth: "Preserve Old Traditions"
 qqt_fourth_desc: "Even though we have abandoned our old faith, we have not abandoned our old traditions which are still preserved and greatly respected."
 qqt_fifth: "Religious Tolerance"
 qqt_fifth_desc: "Our state is a tolerant political unit which offers shelter to religious refugees who are persecuted in their home countries."
 qqt_sixth: "Legacy of Yelü Dashi"
 qqt_sixth_desc: "We must preserve the memory of Yelü Dashi - the founder of Qara Khitai who after the fall of the Liao dynasty led the remainder of our nation into exile and found a new homeland for our people."
 qqt_seventh: "Restore Great Liao"
 qqt_seventh_desc: "The traitors who stood behind the fall of Great Liao will answer for their crimes! As our power grows, so does the ambition to dethrone the Mongol cowards and claim the Dragon Throne for ourselves!"

 LIO_ideas: "Great Liao Ideas"
 LIO_ideas_start: "Great Liao Traditions"
 LIO_ideas_bonus: "Great Liao Ambition"
 LIO2_ideas: "Great Liao Ideas"
 LIO2_ideas_start: "Great Liao Traditions"
 LIO2_ideas_bonus: "Great Liao Ambition"
 lio_first: "Imperial Restoration"
 lio_first_desc: "Centuries ago, the Khitan people ruled over much of Northern China and Manchuria. After our crushing defeat by the Jurchens in the 1120s, many thought the Khitans would never again regain their primacy over East Asia: we have proven them wrong, and continue to expand our borders ever further."
 lio_second: "Dethrone the Borjigins"
 lio_second_desc: "The dreaded Borjigin clan of Mongolia had shattered the established order of the world with the great conquests of the 13th century, which resulted in a crushing defeat for our people. The hatred aimed at the Borjigin clan was so strong indeed that our destruction of their Yuan Dynasty has been met not with denouncement and anger, but with acceptance. The people of Asia and the world, for as long as we exist, will not forget our actions to crush the Yuan, and will be more lenient with our warmongering as a result."
 lio_third: "Ordu"
 lio_third_desc: "The ordu is the personal entourage of high ranking nobility in Khitan society. These ordu are the noble's personal retinue, making them some of the best trained and equipped cavalrymen in our entire society. In times of war, we may call upon the nobility to entrust their orda to the state, bringing incredible power to bear down on our foes."
 lio_fourth: "Patriarch of the East"
 lio_fourth_desc: "The old Liao dynasty was always amicable with the Nestorian Christians in the east. Ever since our initial migration to the west to escape the Jurchens, we have embraced God's teachings and accepted the mantle of Patriarch of Eastern Christianity: not only shall we defend our people, we shall also spread the word of Christ so that more immortal souls can be saved."
 lio_fifth: "Legacy of Yelü Dashi"
 lio_fifth_desc: "Yelü Dashi was a governor of many provinces in the late stages of the old Liao and the man that led our people into the Zhetysu region when we were on the verge of annihilation. His courage and dedication to maintaining our people's power even in the darkest times inspires our people in all aspects of life."
 lio_sixth: "Sino-Khitan Coexistence"
 lio_sixth_desc: "Historically, Chinese and Khitan traditions clashed significantly, causing great strife and unrest among our subjects. In learning from past mistakes, we must accept and embrace Chinese traditions, whilst maintaining our culture, if we are to remain strong and stable."
 lio_seventh: "Two Government System"
 lio_seventh_desc: "Conflict between the nomadic Khitan people and the Chinese was a staple feature of the old Liao dynasty. To rectify this, Yelü Abaoji, the empire's founder, set up two different governments within the empire: one in the north, ruling under Khitan laws and customs, and one in the south, using Chinese governmental and cultural practices. Despite this decentralisation, the Emperor was still the sole decider of important affairs and met with the two administrations to discuss affairs. Utilising a similar system of cultural administrations in our conquests will surely result in a more stable nation and a more content populace."
 lio2_seventh: "Two Government System"
 lio2_seventh_desc: "Conflict between the nomadic Khitan people and the Chinese was a staple feature of the old Liao dynasty. To rectify this, Yelü Abaoji, the empire's founder, set up two different governments within the empire: one in the north, ruling under Khitan laws and customs, and one in the south, using Chinese governmental and cultural practices. Despite this decentralisation, the Emperor was still the sole decider of important affairs and met with the two administrations to discuss affairs. Utilising a similar system of cultural administrations in our conquests will surely result in a more stable nation and a more content populace."

# Government Names #
 GURKHAN: "Gurkhan"

# Events #
 ab_khitan.1.t: "The Restoration of Liao"
 ab_khitan.1.d: "As our soldiers march through the great palaces of Khanbaliq, they rip down the banners of the Yuan, they shove and push courtiers and palace attendants, and they grab artifacts and valuables as they go. Our long push into the Yuan had left our men exhausted and filled with anger, as the aging empire had fought with all its might to stand against us. By the time our soldiers reached the capital, their rage was palable; this palace would not be the last place they would ransack throughout the day. With our long campaign into the north finally finished, the emperor proclaimed to [Root.Monarch.GetHerHis] administrators and generals that a new era was upon them. [Root.Monarch.GetSheHeCap] spoke of how they had reconquered the west that they had lost centuries ago during the invasion of the Song; how the mantle of heaven would soon be theirs. This proclamation confused those present who believed this to be a war of conquest, not reclamation. However, those seldom few in the emperor’s audience that had dove into the classics of their past knew what this meant. Some began to cheer, others clapped. As [Root.Monarch.GetHerHis] soldiers secured their new territory, [Root.Monarch.GetName] ordered the production of new banners, granted new titles, and drew up the new royal standards. The Khitan have reclaimed their lost mantle of the Great Liao, and soon all of China shall bow their might!"
 ab_khitan.1.a: "Long live the Liao!"

