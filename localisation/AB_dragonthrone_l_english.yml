 reform_shogunate_title: "Reform the Shogunate"
 reform_shogunate_desc: "Having reduced the Emperor to nothing but a ceremonial figure and centralized the entirety of Japan under our rule, the time has come to refom the Shogunate and march towards the glorious future!"
 the_shogunate_title: "Proclaim the Shogunate"
 the_shogunate_desc: "Having broken the Imperial line and brought the independent Daimyos under our authority, the time has come to unite Japan under the absolute rule of the Shogun."

# Events #
 ab_toyouji.1.t: "The Paper Shogun"
 ab_toyouji.1.d: "In 1274, the Mongol Empire led a massive invasion of the Kamakura Shogunate in order to force them to submit and give tribute to Kublai Khan. Leading the invasion was his son, Toghon Khan, who upon landing in southern Kyushu, eradicated and routed the Japanese forces. He removed the Kamakura Shogun, forcing him and his court to flee to the Kanto region while they established a new Shogunate in Kyoto. Following this event, various generals from across the Empire, from Korea to Canton all settled in the free and open lands that they had conquered to the west of Kyoto, forming a new Mongol base of power in the region. While the east never was properly conquered by Mongol forces, it still paid tribute whilst it fought amongst itself to establish dominance in the post-Kamakura landscape. Toghon himself settled in the capital, creating the Toyouji line of Shoguns, and ruled over all Japan as its undisputed master. \n \nHowever, as time passed, issues became apparent. The Toyouji dynasty found itself unable to keep many of these new Daimyo of theirs under control, as many of them had armies large enough to challenge their own. As such, infighting amongst the Daimyo continued until eventually, it reached a breaking point, and many are now even explicitly preparing to attack the Toyouji. While [Root.Monarch.GetName] claims to have control over the isle, their grip is in fact quite loose, and many powerful foes keep slipping through the cracks to become problematic later on. More concerning still, the independent daimyo in the east have stopped paying tribute and now are making claims to reclaim Japan from the Toyouji. Even the old Kamakura rulers have survived and grown their influence to expand past Edo and into the surrounding Kanto countryside, becoming a major threat once again. If the Toyouji are to survive in the modern day, they must stand strong and be prepared for attacks on all sides. The unification of Japan shall not be an easy task..."
 ab_toyouji.1.a: "May we find strength to face the coming storm..."
 ab_toyouji.2.t: "Foreign Support Collapses"
 ab_toyouji.2.d: "Dire news from the mainland; the Yuan dynasty has been thrown into crisis after the death of the great Shaozong Borjigin. His son, Temur, has succeeded to the throne and his decisions have wrecked the stability of the state. As rebellions and civil war erupt across the fields of China, one of our major allies in the west has now gone silent. The disloyal daimyo look at us greedily; now outnumbered and alone, we are truly in a dangerous situation. However, we must not let this be the end of our dynasty. We shall rise to the occasion, defeat those who threaten us on the isles, and then push to restore order to the mainland!"
 ab_toyouji.2.a: "The Paper Shogun rips and tears against the wind"

