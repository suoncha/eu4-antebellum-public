# Decisions #
 khazaria_rename_title: "Rename the country to Khazaria"
 khazaria_rename_desc: "This is a cosmetic decision allowing us to change the name of our country."
 tartaria_rename_title: "Rename the country to Tartaria"
 tartaria_rename_desc: "This is a cosmetic decision allowing us to change the name of our country."

# Events
 ab_ghorde.1.t: "The Decline of the Golden Horde"
 ab_ghorde.1.d: "Ever since the inception of our wing of the Mongol Empire, the Golden Horde has been subject to a number of problems. Chief among these, the structure of the nomadic army has resulted in countless failures, the central authority of the Horde has waned over time with crisis after crisis, and the court is filled with constant feuds over succession and rulership. If the Golden Horde is to survive, there must be serious reform and renewal within the empire, for it is in no state to continue."
 ab_ghorde.1.a: "Dark times lie ahead"
 ab_ghorde.2.t: "A Rival Contests the Throne"
 ab_ghorde.2.d: "The succession of the Golden Horde has always been a messy affair, with various Khans holding equal if not more power than the Khan of the Golden Horde. As our empire unravels, and $HEIR$ ascends to the throne, one of his Borjigin relatives has challenged his rule, and laid claim to the Golden Horde for himself!"
 ab_ghorde.2.a: "Bah! I shall defeat cut him down with ease!"
 ab_ghorde.3.t: "The Crimean Rebellion"
 ab_ghorde.3.d: "Crimea has never been one of the most loyal areas of the empire. The southernmost reaches remain in the hands of the princes of Gothia, closely allied with the Romans. However, the Tatars that occupy the rest of Crimea chose to permanently tie themselves to the land during our conquests and have since embraced the teaching of Christ, adopting their own trappings. With the apparent decline of our own empire, however, one bold prince has chosen to crown himself Khan of Crimea, effectively declaring independence."
 ab_ghorde.3.a: "This cannot stand. The Crimeans have chosen war!"
 ab_ghorde.3.b: "We cannot afford to make Crimea kneel"
 ab_ghorde.4.t: "The Nogai Khan Defects"
 ab_ghorde.4.d: "The domain once ruled by the infamous kingmaker Nogai Khan remains a very important crossroads in the empire, connecting it to Asia for trade and conquest. While the Tatars here remain largely similar to our own way of life, the people that call this area home have always tended to rally behind descendants of Nogai Khan, as well as the cause of Buddhism. Seeing the power of the Golden Horde eroding, a descendant of Nogai Khan has rallied several ulus under his banner and declared the independence of the Nogai Khanate."
 ab_ghorde.4.a: "We must crush the descendants of Nogai here and now!"
 ab_ghorde.4.b: "The price of failure is too high, we must let Nogai’s ulus go"
 ab_ghorde.5.t: "The Rise of Kazan"
 ab_ghorde.5.d: "When the armies of the Mongol Empire swept through the western steppe, they trampled what remained of the powerful emirs of Volga Bulgaria. Devout followers of Islam well before the invasion, the Turkic Bulgars have remained nominally loyal subjects to the Golden Horde, their identities intertwined with those of the other Tatars as their new identity crystallised. As the Golden Horde begins to unravel, several princes among the Volga Tatars have come to question the wisdom of standing by the Khan. One prince, the ruler of Kazan, has taken a stand with the support of other muslim princes, dubbing himself the Khan of Kazan and raising a sizable army."
 ab_ghorde.5.a: "If the Bulgars wish to be made to kneel again, so be it!"
 ab_ghorde.5.b: "Kazan is simply not worth the trouble"
 ab_ghorde.6.t: "Crimean Rebellion Crushed"
 ab_ghorde.6.d: "The rebellion of the treacherous Crimeans was crushed, and the lands that were seized by the rebels have once again returned under the sovereignty of the Great Khan."
 ab_ghorde.6.a: "Death to traitors!"
 ab_ghorde.7.t: "Nogai Rebellion Crushed"
 ab_ghorde.7.d: "The rebellion of the treacherous Nogai Khan was crushed, and the lands that were seized by the rebels have once again returned under the sovereignty of the Great Khan."
 ab_ghorde.7.a: "Death to traitors!"
 ab_ghorde.8.t: "Kazani Rebellion Crushed"
 ab_ghorde.8.d: "The rebellion of the treacherous Emirs of Kazan was crushed, and the lands that were seized by the rebels have once again returned under the sovereignty of the Great Khan."
 ab_ghorde.8.a: "Death to traitors!"
 ab_ghorde.9.t: "The Future of the Golden Horde"
 ab_ghorde.9.d: "With the worst of our succession troubles finally behind us, the Golden Horde stands at a crossroads. For many in the court of [Root.Monarch.GetName] and those across the realm, the near collapse of the Empire is a clear sign that change must come to our way of life. Many intellectuals at court and emissaries from our remaining subjects point to the various advancements in Europe as an example to follow. For others in court and abroad, however, it is a sign that the Golden Horde must be revitalized and made to ride and conquer like the nomads who established it. Whichever path [Root.Monarch.GetName] decides to walk down, it is sure to define our future for many generations to come."
 ab_ghorde.9.a: "We will always be Mongols!"
 ab_ghorde.9.b: "It is time we settle down"
 ab_ghorde.10.t: "The Conversion of the [Root.GetAdjective]"
 ab_ghorde.10.d: "Even before the we came to rule these lands, many faiths clashed on the steppe, gaining their own followers and challenges. With our recent conquest and generations of rule, the Muslims of the Volga have been allowed to flourish and grow, Christian missions have frequented the ports of the Crimea, and several rulers of the empire have invited Buddhists to settle in our important cities and some of the more eastern regions of our domain. With recent troubles seeming to have finally been put behind us, some within the Khan’s court have begun to discuss formally adopting a more settled faith in order to facilitate better relations with our neighbors moving forward."
 ab_ghorde.10.a: "Send for the Metropolitan of Gothia. I will hear from their missionaries"
 ab_ghorde.10.b: "Bring me scholars from Volga Bulgaria, I would like to learn of Muhammad"
 ab_ghorde.10.c: "Inform the Sarai Lama that I wish to see him. The Dharma is fascinating"
 ab_ghorde.10.de: "We will turn to the church of the East"
 ab_ghorde.10.e: "This is all nonsense, we could never abandon our ways!"
 ab_ghorde.10.f: "We will follow the example of the Khazars" 
 ab_ghorde.10.human: "Understood"

