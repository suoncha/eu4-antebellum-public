### GOTHIA ###
# Countries #
 GTH: "Gothia"
 GTH_ADJ: "Gothic"

# Cultures #
 gothic_new: "Gothic"

# Ideas #
 GTH_ideas: "Gothic Ideas"
 GTH_ideas_start: "Gothic Traditions"
 GTH_ideas_bonus: "Gothic Ambition"
 GTH2_ideas: "Gothic Ideas"
 GTH2_ideas_start: "Gothic Traditions"
 GTH2_ideas_bonus: "Gothic Ambition"
 gth_first: "Black Sea Trading Ports"
 gth_first_desc: "Our isolated position has fostered in us not only tenacity in the face of foreign oppression, but impressive skills in barter and mercantile matters. Learning from the Genoese and Romans, we have made ourselves cunning and stern students in trade on the ripe shores of the Black Sea."
 gth_second: "Bane of the Great Khan"
 gth_second_desc: "With the Mongols breathing down our necks, we have done well to maintain our fierce martial traditions. Both incursions upon our enclave and mercenary ventures alike have resulted in a wealth of formidable garrisons, eager conscripts and masterful generals, now standing as the pride of Gothia and the Black Sea."
 gth_third: "Utilise Foreign Mercenaries"
 gth_third_desc: "Many of our men have fought abroad and amidst our neighbours as mercenaries, seeking coin and honour. Their experience, as well as our masterful diplomacy and courteous friendship with regional powers, have given us the reputation of an honourable employer of prospective mercenaries."
 gth_fourth: "Conquerors of the Roman Empire"
 gth_fourth_desc: "Centuries ago, our ancestors wrought havoc across the Roman strongholds and heartlands. In their time of cowardice and weakness, the once-proud Romans found their holdings carved up and conquered by our forefathers, wisely promising greater autonomy and lowered taxes to newly-acquired subjects in exchange for loyalty. Let us carry on this strategy."
 gth_fifth: "Legacy of Theodoric"
 gth_fifth_desc: "Theodoric the Great, a proud forefather of Germanics everywhere, once ruled the Roman heart that was Italia with an iron fist, essentially a Roman emperor in all regards save name. His exploits ranged from Gaul to the Balkans and he stood as living proof that a Goth born from minor nobility could rule wise and hard across a bountiful realm. We shall embody his legacy."
 gth_sixth: "Restore the Gothic Kingdoms"
 gth_sixth_desc: "Gothic kingdoms, like those of Theodoric, once ruled over great swathes of Europe. Over time, Latins, Slavs and Muslims alike took what was rightfully ours and moulded the hard-gotten lands to their liking. Let us remind the world of the earth-shattering migrations of old with our resurgent strength."
 gth_seventh: "Magna Germania"
 gth_seventh_desc: "The great migrations of old brought with them our beautiful tongue and honourable ways. Hispania, Gaul, Britannia, Italia, Africa- they all saw our people come and masterfully cultivate the lands left devastated and impoverished by Roman incompetence and tyranny. Let us venture forth from our Crimean enclave and reclaim Europe once more."

# Reforms #
 feotitles: "Reclaim the Royal Titles"
 feotitles_desc: "Centuries ago, our Gothic ancestors ruled vast kingoms in the heart of Europe. As our rising empire now stretches from the shores of the Black Sea to the Alpine highlands, it is time we restore the old royal titles and style ourselves as the only and true Kings of the Goths!"
 feoslavic: "Slavic and Hellenic Nobility"
 feoslavic_desc: "Our country has seen an increased influx of Slavic and Hellenic nobles, fleeing the invading Mongol hordes and the corrupt Angelid government respectively. We shall ensure they stay loyal to the crown by guaranteeing their old rights and making them equal with our own nobility."
 feonaval: "Theodorian Naval Reform"
 feonaval_desc: "The Black Sea is an unforgiving and aggresive sea and our sailors are seasoned for its challenges. Even though we are experienced on sailing in the Black Sea, our competition for naval technology and tactics is increasing as the Turkish smugglers attack our ships and navies from the south keep harrasing our sea borders. We will increase our focus on naval developement and reform our navy."
 feourban: "Urbanize the Steppe"
 feourban_desc: "Even if our core region is very developed with cities and blooming trade ports, our scouts have reported that the steppes around us have really small activity because of the nomadic lifestyle of the Tatars. Once we expand into the steppes, we can raise Gothic cities and develop these lands to be the new jewels on our crown that is Gothia."
 feoosmans: "Subsidies to the Osman & Sons"
 feoosmans_desc: "The port of Theodoro is an important trading port and the The Osman & Sons company knows its value. They have helped our economy by propping up offices, buying property and spreading the name of the port around Europe and Asia which attracts new merchants and partners. To increase our cooperation further and keep them happy, we will issue subsidies and protection for their company."
 feoarmy: "Peninsular Army"
 feoarmy_desc: "Our nation is stationed around the Crimean peninsula and the its straits, leading our military to focus on manoeuvring speed and quick mobilization. Surviving the Tatar invasions with our Peninsular doctrine has showed the Khan that we have a great army, we will show the world once again the Gothic army is supreme!"

# Decisions #
 feo_move_capital_title: "Move the Capital to Ravenna"
 feo_move_capital_desc: "This decision allows us to move our capital city to Ravenna."

# Events #
 ab_theodoro.2.t: "Sack of the Second Rome"
 ab_theodoro.2.d: "Over the countless centuries spent in the uncertain East, our people have engaged in both rivalry and alliance with the Romans. Despite Rome proper's collapse and ruin, a rump state persisted in clinging to the Mediterranean's eastern extent and thus we became embroiled as bystanders in its troubled history. They were evidently not made for this world - for they have slowly haemorrhaged power, holdings and wealth until they were reduced to their capital and insignificant remnants scattered across the Aegean. \n\n Constantinople now lays in our hands - the final bastion of Roman civilisation. Our men, tired from the countless months spent besieging the city, have laid waste to its timeless foundations. Palaces lay burning and once-booming markets are alight with wild flames. The stench of death fills the air and the Golden Horn is a bloody quagmire of drowning vessels and unidentifiable bodies. Through the chaos, one truth is clear - the age of Rome has passed, giving way to the age of Gothia." 
 ab_theodoro.2.a: "Sleep forevermore, sons of Rome"
 ab_theodoro.3.t: "Gothic Restoration"
 ab_theodoro.3.d: "We have catapulted ourselves into prestige and wealth not seen since the exploits of our roaming ancestors. The lands of the Pontic Goths stretch from east to west. Our cities are bountiful in number, our harvests plentiful, our coffers deep - and the resolve of our people has never been stronger. With a nation established proper and true, we proclaim anew the land of Gothia - a homeland for all Goths, a kingdom of the Germanic tongue, countless provinces and holdings carved out by honour, sacrifice and glory. Our people, from the most humble of peasantry to the most dignified nobility, are experiencing a surge not only in national pride, but national resolve - for further conquests, greater exploits, surely await us, with our fearsome borders ready to swell to even greater extents, ready to rival and eclipse that of the Gothic empires of old."
 ab_theodoro.3.a: "Gothia rises - and so too rises a new age"
 ab_theodoro.4.t: "Legacy of Theoderic"
 ab_theodoro.4.d: "Not since the days of the Ostrogoths has the Gothic way reigned over Italia. The accursed Byzantines tore to shreds the mighty Theodoric's legacy, routing our sorry ancestors from Italia and the glorious Ravenna. \n\n Today marks a new age for Italia. We have reclaimed the north and with it, the ancient city of Ravenna. Europa balked before at our newfound extent, our resurgent triumph - now, it must accept the Italian peninsula's return to the Gothic fold. Already, nobles, scholars and administrators alike clamour for us to proclaim Ravenna our new capital, to ensure greater ease in consolidating the peninsula and replicating Theodoric's legacy. Regardless of our decision, the riches of Italia and the achievement of our conquest has cemented our prestige even further and brought with it a legitimacy that allows us to govern our burgeoning empire with greater efficiency and ease."
 ab_theodoro.4.a: "Our ancestors surely smile upon us"
 ab_theodoro.5.t: "Avenging the Umayyad Conquest"
 ab_theodoro.5.d: "At last, Iberia has once more accepted Gothic rule. Many centuries ago, the Visigoths of old carved out a mighty kingdom across the peninsula, sparing the humble tribes and settlers within from Roman catastrophe and mismanagement. Decadence and internal struggles, however, allowed calamity to take place - the accursed Umayyads swept through the Maghreb and exploited the troubles of our ancestors, brushing aside the crumbling kingdom in their relentless century of conquest. \n\n With our newfound strength, we have dealt the Muslims a crushing blow in securing Iberia for ourselves once more. Already, the inhabitants of the peninsula are coming out in droves, eager to accept our tried and tested ways, follow our kind laws and heed our wise and ancient culture. Let us make of Iberia a Gothic holding once more and restore the former Roman province's honour."
 ab_theodoro.5.a: "May Hispania rejoice under Gothia's banner"

