# Ideas #
 HTM_ideas: "Cossack Ideas"
 HTM_ideas_start: "Cossack Traditions"
 HTM_ideas_bonus: "Cossack Ambition"
 HTM2_ideas: "Cossack Ideas"
 HTM2_ideas_start: "Cossack Traditions"
 HTM2_ideas_bonus: "Cossack Ambition"
 htm_first: "Empower the Cossack Rada"
 htm_second2: "Roam the Wild Fields"
 htm_second2_desc: "The steppes of Eastern Europe are our homeland, and over generations, our people have mastered life in the saddle and became one with the land."
 htm_first_desc: "Despite being mostly military in nature, the Cossack Rada is in charge of the administration of our territory. To increase the effectiveness of this institution, the rights of the assembly will be greatly expanded and empowered."
 htm_second: "Roam the Wild Fields"
 htm_second_desc: "The steppes of Eastern Europe are our homeland, and over generations, our people have mastered life in the saddle and became one with the land."
 htm_third: "Break the Tatar Yoke"
 htm_third_desc: "Since the dissolution of Rus' during the Mongol invasion, the Principalities have lived under the Tatar Yoke, forced into submission and tributary status. If we wish to restore the glory of the Rus', we have to break the Tatar Yoke and free the steppe of the Mongol influence."
 htm_fourth: "Hetman's Authority"
 htm_fourth_desc: "Elected for life by the council of the elders, the Cossack Hetman is the head of the state of the Cossack Hetmanate. Being responsible for the well-being of the entire country, it should be in our best interest to ensure that the most capable person who is able to protect the Hetmanate is always elected."
 htm_fifth: "Tame the Steppe"
 htm_fifth_desc: "For years, our people have lived a semi-nomadic lifestyle, reminiscent of our Mongol enemies. As the lands of Rus' are returning under our rightful control, and the eastern steppes are being freed from the grasp of the hordes, we must consolidate our rule over this region and settle it with our own people."
 htm_sixth: "Starshyna Council"
 htm_sixth_desc: "Although the Hetman is the undisputed ruler of the Hetmanate, he is advised by a council of officers known as Starshyna, which mostly consists of experienced military commanders and members of the nobility."
 htm_seventh: "Steppe Riders"
 htm_seventh_desc: "The steppe is a peculiar and treacherous place to live and when it comes to dying, the variety of choices is endless when you are horseless. When you enter the endless sea of grass, your horse stops being an animal or piece of property, and truly becomes a part of you. Just as your body cannot survive without a heart or a liver, in the steppes it certainly won't survive without a horse."

# Reforms #
 hetmanate: "Cossack Hetmanate"
 hetmanate_desc: "The free Cossacks of the Wild Fields are ruled by a military council presided over by an elected Hetman."
 htm_council: "Election by Military Council"
 htm_council_desc: "Our Hetman is elected to his post by an Ataman military council known as the Rada. This allows us to ensure that only the most experienced commander can lead our people, and also brings military matters to the forefront."
 htm_autonomous: "Autonomous Kurins"
 htm_autonomous_desc: "Each Kurin is led by an Ataman, a local military leader responsible for its prosperity. By granting the Atamans more decisionmaking authority, they can freely and effectively respond to any crisis that rears its head."
 htm_kurin: "Expand the Kurin"
 htm_kurin_desc: "The Kurin, our most basic division of land, is centered around a barracks where we keep our supplies and its own treasury. By expanding them, we can afford to pay and provision even more soldiers for our armies."
 htm_faith: "One Faith, Many Cultures"
 htm_faith_desc: "Despite the entrenchment of the Orthodox faith within our society, the state is a melting pot of numerous cultures with their own customs and values. It is perhaps all our peoples' devotion to the True Faith which has facilitated the bridging of gaps between them."
 htm_refuge: "Refuge Against Tyrants"
 htm_refuge_desc: "Our society's foundation was laid by those seeking freedom from oppressors; noble and commoner alike who refused to bow to cruel and uncompromising masters. Their desperate plight to break the shackles of tyranny is something that we shall never forget."

# Decisions #
 form_hetmanate_title: "Form the Hetmanate"
 form_hetmanate_desc: "Ever since the fall of Rus', our people have lived in the shadow of the Golden Horde. Now as the Tatar Yoke is weakening, we must reclaim the lands that once belonged to our ancestors, reunite our nation, and claim our vengeance!"
 rename_ukraine_title: "Rename the Country to Ukraine"
 rename_ukraine_desc: "This decision allows you to embrace a more modern name of your country."

