### CUMANIA ###
# Countries #
 CMN: "Cumania"
 CMN_ADJ: "Cuman"
 CMNH: "Cuman Horde"
 CMNH_ADJ: "Cuman"

# Cultures #
 cuman_culture: "Cuman"

# Ideas #
 CMN_ideas: "Cuman Ideas"
 CMN_ideas_start: "Cuman Traditions"
 CMN_ideas_bonus: "Cuman Ambition"
 CMN2_ideas: "Cuman Ideas"
 CMN2_ideas_start: "Cuman Traditions"
 CMN2_ideas_bonus: "Cuman Ambition"
 cmn2_first: "Cuman Heavy Cavalry"
 cmn2_first_desc: "For generations, we have been warriors of mounted dread. We have seen our estranged mercenary brothers employ our powerful light cavalry tactics across the known world to great use. However, the threat of a new age is upon us- an age of men in nigh-indestructible armour. Even their steeds are plated thick with metal. Combining this new world's wonders of metallurgy with our mounted heritage will make Cumania invincible."
 cmn_first: "Cuman Heavy Cavalry"
 cmn_first_desc: "For generations, we have been warriors of mounted dread. We have seen our estranged mercenary brothers employ our powerful light cavalry tactics across the known world to great use. However, the threat of a new age is upon us- an age of men in nigh-indestructible armour. Even their steeds are plated thick with metal. Combining this new world's wonders of metallurgy with our mounted heritage will make Cumania invincible."
 cmn_second: "Repopulate the Pontic Steppe"
 cmn_second_desc: "Cumania once spanned the bountiful steppe, with no end in sight. Mongol devastation has cast death's shadow upon our homeland however, driving us into the foothills of the Caucasus. To preserve our endangered culture, we must reclaim the Pontic Steppe. Our people have always been flexible, choosing to be semi-nomadic as opposed to either extreme, making them an eager force for settlement and development."
 cmn_third: "Qifjaq Entrepot"
 cmn_third_desc: "Our country is host to many a gateway city to the wild world of the steppe, which is plentiful in exquisite goods lusted after by the rich kingdoms of Europe. Among these was the legendary Qifjaq, a once-proud slave port on the Black Sea, which earned us a great mercantile reputation. Thus, our merchants have developed an affinity for the trade of the Silk Road and a trading tradition has flourished among our coastal tribes."
 cmn_fourth: "Autonomous Khans"
 cmn_fourth_desc: "Cuman society is made up of families, consisting of blood relatives. Those families join to form clans. Those clans join to form tribes. Leading those tribes are khans. Those tribes have historically formed entire confederations of their own, deciding their own policies, cultures and destinies. This facet of Cuman society is a proud tradition- and one that will not fade easily."
 cmn_fifth: "Hit and Run Tactics"
 cmn_fifth_desc: "Our most common light cavalry tactic involves cunning and skilled archery. Our ancestors pioneered and perfected it- repeated archery attacks, feigned retreats and brilliant ambushes ranged means or spears. Now, we must combine it with the formidable armour of the modern age- creating fearsome lines of armoured men and horses alike that can decimate enemies with our advanced cavalry tactics."
 cmn_sixth: "Cuman Yoke"
 cmn_sixth_desc: "Historically, we have always taken advantage of tribes and petty kingdoms on the periphery of our holdings. Our autonomous confederations have more often than not decided upon a policy of cooperation with our neighbours. This trend spread from the once-subservient Crimea to adjacent peoples, who too wisely saw the value in paying us respect."
 cmn_seventh: "Restore Cuman-Kipchak Confederation"
 cmn_seventh_desc: "Before the darkness of the Mongols, our holdings stretched from the Crimea to the Irtysh River, forming a long and impressive realm of confederated tribes between us and the long lost Kipchaks. If we were to restore this great confederacy with our newfound centralisation, military might and booming technology, we could forge off the steppe a new empire- a Cuman-Kipchak Confederation resurgent, restored, renewed and eternal."

# Reforms #
 cmnslavic: "Slavicization"
 cmnslavic_desc: "The Slavs make up a large percentage of population and neighbors, and among them have interesting structures and traditions inspired by the empires of antiquity. Many of our own people have already begun adopting Slavic customs and names on their own. If we were to continue this ourselves we could better integrate our population and improve our standing with amongst our neighbors."
 cmntribes: "Reform the Nine Tribes"
 cmntribes_desc: "When the Mongols burned our confederation to the ground, only 9 tribes escaped their wrath. Despite us settling down many of these tribe still stick to the old ways. By organizing them into unique military units with regular training we can create a strong and professional army, ready to prevent the Mongols from coming back again."
 cmncanon: "Employ Slavic Cannons"
 cmncanon_desc: "The tides of warfare have changed. If we do not want to be swept aside, we must seek to improve our hordes. The myriad of Slavic states to our west are experts in these new ways of warfare. For the right price, many could be persuaded to come over and serve as gunners and cannoneers."
 cmnoath: "Reinstitute Sword Oaths"
 cmnoath_desc: "Swords Oaths, the process of swearing ones loyalty with a sword in hand over the body of dog has fallen out of practice in recent times. By reestablishing this ancient system we can invigorate our warriors."
 cmnmongol: "Confederate with the Mongols"
 cmnmongol_desc: "If our dominance over the step is to be lasting, we need to assimilate the Mongols into our tribes, as we have done with the Kipchaks and others before them. By allowing Mongols to be accepted into our clans, we can learn much about conquest from them."

# Events #
 ab_cuman.1.t: "Sack of Sarai"
 ab_cuman.1.d: "Eager to take revenge on the Mongols for the destruction of their state some 200 years ago, the Cuman hordes sought to exterminate all remnants of the former Tartar empire. Khan [Root.Monarch.GetName] had always made it clear, all of the old Mongol tribes are to assimilate or perish, and all of Sarai's treasure is to be brought before the Khan. However, as the siege of the great city began to come to an end, a rumor spread of the Cuman Khan's alleged death. Angered by this, when the Cuman hordes finally broke through the walls, they began to fall upon the city with a ferocity and bloodthirst matched only by the Mongols themselves. All men where said to be put to the sword and churches, palaces, graves, and anything else standing were then plundered and burned. Sarai was left nothing but a smouldering ruin, ready to be swallowed up by the steppe once again."
 ab_cuman.1.a: "The fallen city shall become our new capital"
 ab_cuman.1.b: "Burn the rest of it to ash"
 ab_cuman.2.t: "Fall of Constantinople"
 ab_cuman.2.d: "After resurrecting itself like a pheonix across the steppe, the Cuman hordes have finally reached the great city of Constantinople. However, unlike the great hordes of old, the Cumans have cannons. The great bombards of Cumania made short work of the Theodosian Walls of antiquity, allowing the hordes to sweep through. After several days of fighting, the Cuman hordes have emerged as the victors. With most of the city still intact, the Patriarch and other leading members of the city have come towards the great Khan along with the all the treasure of the Romans."
 ab_cuman.2.a: "The phoenix will never rise again"

