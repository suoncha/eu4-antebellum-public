### ALANIA ###
# Countries #
 ALN: "Alania"
 ALN_ADJ: "Alanian"

# Ideas #
 ALN_ideas: "Alan Ideas"
 ALN_ideas_start: "Alan Traditions"
 ALN_ideas_bonus: "Alan Ambition"
 aln_first: "Warriors of Christ"
 aln_first_desc: "With heathens and barbarians on all sides, our people cling to our most unifying cause- dying for our Lord in Heaven. However red the rivers shall run with our blood, a Kingdom of God we shall remain."
 ALN2_ideas: "Alan Ideas"
 ALN2_ideas_start: "Alan Traditions"
 ALN2_ideas_bonus: "Alan Ambition"
 aln2_first: "Warriors of Christ"
 aln2_first_desc: "With heathens and barbarians on all sides, our people cling to our most unifying cause- dying for our Lord in Heaven. However red the rivers shall run with our blood, a Kingdom of God we shall remain."
 aln_second: "Byzantine Ties"
 aln_second_desc: "For centuries now, noble men of our tongue and blood have been entrenched in the affairs of far-flung courts, even those of the Romans themselves. Not only has this garnered us a certain diplomatic legitimacy, but also a prowess, for maintaining good connections with our neighbours has perennially been a decider between life and death."
 aln_third: "Fortify the Caucasian Gates"
 aln_third_desc: "Our position at the foothills of the great Caucasian Mountains has given us many advantages in the realm of defence. Our people now know the land, the foothills and the rugged peaks like the palm of their hand and recognise the dire importance in preserving Alanian Caucasia."
 aln_fourth: "Break the Mongol Yoke"
 aln_fourth_desc: "Our mere existence in the face of the burgeoning Mongol Horde is an act of defiance worthy of God's recognition. For as long as Alanians remain free, we stand as a beacon in the dark night of this heathen land."
 aln_fifth: "Catholicos-Patriarch of All Alania"
 aln_fifth_desc: "Owing to our isolation, we have appointed a head of our kingdom's religious matters- the Catholicos-Patriarch. Centralising our pious faith will ensure religious oversight remains steadfast. The word of Christ Jesus reigns forevermore."
 aln_sixth: "Legacy of the Steppe"
 aln_sixth_desc: "Across Caucasia and the Roman holdings, our ancestors were hailed as the finest horse breeders, owing to our steppe heritage and Scythian roots. Even the Goths of old were educated in our ways, taken by admiration for our proud mounted forefathers."
 aln_seventh: "Reclaim Greater Alania"
 aln_seventh_desc: "In the old times, our blood and our lands were numerous. Our tongue was uttered on shores as distant as Carthage, among Vandalic halls, while our ancestors peacefully toiled in the mother steppe. We were born to rule a bountiful land- and we shall do so again."

# Reforms #
 alnroman: "Adopt the Roman Bureaucracy"
 alnroman_desc: "Despite having ties to the Roman state for centuries, our government still bears much more resemblance to that of our nomadic forefathers. By replicating what worked in the Roman system, we will be able to rule more effectively."
 alnfortify: "Fortify the Alan Gates"
 alnfortify_desc: "The Caucasian Gates are key to maintaining our sovereignty against any would-be attacker, be they Georgians, Turks or Persians. We must be ready for any and all of these threats by reinforcing our defenses in this crucial chokepoint."
 alnchristianize: "Christianize the Hordes"
 alnchristianize_desc: "The steppe is like a sea of land, and the prayers of heathens can be concealed in its vast expanses. For the Glory of our Father in Heaven, they must be uncovered!"
 alnnomadic: "Nomadic Mercenaries"
 alnnomadic_desc: "We may have settled down long ago, but our recently conquered neighbors still largely live a nomadic lifestyle despite our rule over them. While not an ideal situation, it does give us ample opportunity to buy the blades of some of the finest horsemen in this corner of the world."
 alndiplo: "Alanian Diplomatic Corps"
 alndiplo_desc: "Alania has always been surrounded by enemies; from Georgians to Persians to the Mongols, we are threatened on all sides. Only through savvy diplomacy have we managed to survive this long, by pitting enemy against enemy and making friends with the devils themselves."

# Events #
 ab_alania.1.t: "The Destruction of Sarai"
 ab_alania.1.d: "Eager to take revenge on the Mongols for the subjugation of their people, the Alans sought to exterminate all remnants of the former Tatar empire. King [Root.Monarch.GetName] had always made it clear, all of the old Mongol tribes are to submit or perish, and all of Sarai's treasure is to be brought before the him. However, as the siege of the great city came to an end, a rumour spread of the Alan king's alleged death. Angered by this, when the Alanian besiegers finally broke through the walls, they began to fall upon the city with a ferocity and bloodthirst matched only by the Mongols themselves. All men were said to be put to the sword and churches, palaces, graves, and anything else standing were then plundered and burned. Sarai was left nothing but a smouldering ruin, ready to be swallowed up by the steppe once again."
 ab_alania.1.a: "Kill them all, God knows his own."
 ab_alania.2.t: "Caucasian Hegemony"
 ab_alania.2.d: "Bolstered by valiant volunteers, eager young warriors and recruited Cuman horsemen, we have swept through Caucasia proper. We were wise to establish pre-eminence across the troubled mountain region - for not only have we secured hegemony across the sweeping valleys and winding rivers, but we have also announced to the world surrounding our intent to rule. Already, peasantries and merchant houses abroad eye our rising strength warily and know it could be a matter of time before they see themselves engulfed by our conquests. Thus, they have prepared contingencies, acknowledged our claims and grown familiar with our mercies and courtesies. Alania surely rises - and the world knows it."
 ab_alania.2.a: "In due time, they all shall know our name and tout our banners."

# Modifiers #
 aln_anti: "Counter the Mongol Military Tactics"
 aln_balkan: "Subjugating the Balkans"
 aln_bane: "Bane of the Khan"
 aln_caucasian_hegemony: "Caucasian Hegemony"
 aln_cmn_black: "Dominate the Black Sea Trade"
 aln_conquest: "Triumph for Asia Minor"
 aln_consolidate: "Consolidate Persia"
 aln_hegemony: "Hegemony over the Steppe"
 aln_ilkhan: "Dismantled the Ilkhanate"
 aln_legacy: "Legacy of the Steppe"
 aln_maghas: "Restoration of Maghas"
 aln_magyar_recruit: "Recruit the Magyar Tribesmen"
 aln_patriarchate: "Established the Patriarchate of Alania"
 aln_recruit: "Recruit Cuman Horsemen"
 aln_resettle_steppe: "Resettle the Steppe"
 aln_seljuks: "Dismantled the Seljuk Sultanate"
 aln_steppe: "Christianization of the Steppe"
 aln_turks: "Anatolian Incursion"
 aln_war: "War Preparations"
 aln_wealth: "Claimed the Wealth of Mesopotamia"

# Missions #
 aln_anatolia_title: "Anatolian Incursion"
 aln_anatolia_desc: "Anatolia is another land much like the Caucasus, mountainous, fertile, diverse, but most importantly, seems to have made a habit of switching hands throughout history. We must prevent any power from attempting to subjugate these lands, that power must be us!"
 aln_army_title: "Recover Strength"
 aln_army_desc: "We have been beaten back; our incursions into Europe have proven unsuccessful. This miserable state of affairs however is not without hope, with concise resource management and new military projects, our former strength may yet be attained."
 aln_caucasian_title: "Caucasian Hegemony"
 aln_caucasian_desc: "Persians, Greeks, Romans, Mongols… all have at some point laid claim to the Caucasus, our home. It is only a matter of time until the Caucasus are yet again under the yoke of a foreign power. To prevent this future, the entirety of the Caucasus must come under our protection, for their own good."
 aln_coalition_title: "Anti-Mongol Coalition"
 aln_coalition_desc: "While the Horde may be on the backfoot, they could still muster a force able to counter anything we could possibly hope to throw at them. In order to strike a blow against the Khan we must gather allies, thankfully, the Mongols have made many enemies in their stay on the continent. If we could gather likeminded forces, the Khan would stand no chance!"
 aln_convert_title: "Baptize the Hordes"
 aln_convert_desc: "With our recent expansion comes the need for an expansion of the faith as well. The Alans have never been as entrenched into Christendom as say the Armenians or Georgians, but we must nevertheless honour the lord’s word and make a concentrated attempt to gain new converts in the steppe lands."
 aln_crimea_title: "Control Crimea"
 aln_crimea_desc: "We the Alans have never had a presence on the seas. Never in our history has a navy been necessary, yet now our shortsightedness is beginning to show itself. A mighty Navy must be constructed and the 'ports' of Alania simply wont do, luckily, a land fitting our needs exists just beyond our borders, Crimea. Yet the locals might need some convincing."
 aln_cumans_title: "Defeat the Cumans"
 aln_cumans_desc: "The Cumans to our east have been a thorn in our side for quite some time now, we have put up with them for long enough! Currently the Cumans are undergoing a crisis of their own, and who would we be not to jump on the opportunity?"
 aln_defy_title: "Defy the Golden Horde"
 aln_defy_desc: "The Khans of the Golden Horde have long thought of us as subjects, and out of necessity we have obeyed. We have steadily been growing our power in secret as they fend off external threats for us, now it is finally time to strike back at our old master!"
 aln_dismantle_title: "Bane of the Khan"
 aln_dismantle_desc: "The Khans of Central Asia have always looked upon us as their subjects and playthings, now it is time to show the Khans that once tormented us what true power looks like! No more shall we be slaves!"
 aln_ilkhans_title: "Execute the Ilkhans"
 aln_ilkhans_desc: "The Ilkhans are much like the Golden Horde to our north. We have gained much experience of Mongol battle doctrine being in such close proximity to our northern neighbors. Perhaps we could use this knowledge to our advantage and launch a campaign against the Ilkhanate!"
 aln_legacy_title: "Legacy of the Steppe"
 aln_legacy_desc: "We carry on our shoulders a lofty legacy, the legacy of the steppe. We were born in the steppe, molded by it. In our pursuit of further conquest, we must remember our origins, and indeed, surpass them. We shall make our ancestors proud!"
 aln_maghas_title: "Rebuild Maghas"
 aln_maghas_desc: "Maghas was once our capital, a shining beacon of civilization in the sea of barbarity that surrounded it, now all that is left of our once great city shattered ruins and herds of cattle grazing on what used to be streets. For the sake of all Alania, Maghas must be rebuilt and expanded beyond even what it was in the past, for it shall become the envy of Caucasia once again."
 aln_mesopotamia_title: "Wealth of Mesopotamia"
 aln_mesopotamia_desc: "Mesopotamia has been the envy of civilizations from around the world since time itself, no empire is truly complete without this land. If we wish to build an empire of our own someday then holding Mesopotamia is essential."
 aln_patriarch_title: "Patriarchate of All Alania"
 aln_patriarch_desc: "As our unique branch of Orthodox Christianity expands, so must our Church administration. We shall elevate our Patriarch of Alania to become on par with the Patriarchs of Kiev or Constantinople. Primus inter pares!"
 aln_persia_title: "Invade Persia"
 aln_persia_desc: "Breaching Mesopotamia was relatively simple, large open expanses and little in the way of fortifications, Persia however, is quite the different story. The Persian heartland is protected by the mighty Zagros mountains, hills and deserts make up nearly the entirety of the countryside, and fortifications dot the landscape. Yet the wealthy cities of Persia may prove worth the risk."
 aln_roman_title: "The Roman Resolution"
 aln_roman_desc: "The Greeks seem to have taken on a new title, the Emperor of the Romans, a title that should have been dissolved hundreds of years ago, yet they persist. Their endurance is commendable, yet the Greeks hollowed out husk of an empire must be ended, for their own sake."
 aln_rule_steppe_title: "Rule the Nomads"
 aln_rule_steppe_desc: "Nomadic tribes have always been the bane of settled societies, as we progress further towards a true empire ourselves, now is the time to subjugate these nefarious peoples to make sure they never become our downfall."
 aln_sack_title: "Sack Sarai"
 aln_sack_desc: "The Mongols have been dealt a crushing defeat at the hands of us and our allies, yet they still stand. Their forces have been battered leaving us with a golden opportunity that we must take advantage of before they recuperate. The road to Sarai lies open."
 aln_seljuks_title: "Dismantle the Seljuks"
 aln_seljuks_desc: "One major obstacle remains for our conquest of Anatolia to truly be complete, the Seljuk Turks. The Seljuks are not the mighty empire they once were, yet they must not be underestimated, we should proceed with caution."
 aln_triumph_title: "Triumph for Asia Minor"
 aln_triumph_desc: "The Turks have been expelled! At long last the only power in Anatolia is us and us alone. The petty fighting that once plagued this region is no more. It is now time for the integration of Anatolia to begin, but first our ruler has called for a celebration of our victories!"

# Mission Tooltips #
