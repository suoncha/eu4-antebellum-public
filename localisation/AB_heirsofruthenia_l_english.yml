# Ideas #
 VOL_ideas: "Volhynian Ideas"
 VOL_ideas_start: "Volhynian Traditions"
 VOL_ideas_bonus: "Volhynian Ambition"
 vol_first: "Heir of Rus'"
 vol_first_desc: "As one of the strongest successors to the fragmented kingdom of Ruthenia, we must show other weak princes that the legacy of Ruthenia is only ours to claim!"
 vol_second: "Blessing of the Pope"
 vol_second_desc: "Taking inspiration from the deeds of Danylo, our rulers have turned to Rome, requesting His Holiness to recognize us as the Kings of All Rus. In turn, we turned to the Catholic faith and promised Rome to forge a new mighty Kingdom that would follow the true faith."
 vol_third: "Union of Galicia and Volhynia"
 vol_third_desc: "Formed by Daniel Romanovych in 1221, the union between the two states brought stability, prosperity and also gave us better chances to survive in this chaotic region."
 vol_fourth: "Roman the Great"
 vol_fourth_desc: "Roman the Great was Grand Prince of Kyjev, prince of Novgorod and founder of our country. As he was one of our most beloved and successful rulers, all of his successors look upon him as an idol."
 vol_fifth: "Embrace Catholicism"
 vol_fifth_desc: "Being recognized as the Kings of Ruthenia, we promised the Pope to convert our country to the Catholic faith. We must ensure that our people embrace the new faith and make it an integral part of their everyday lives."
 vol_sixth: "Restore Ruthenia"
 vol_sixth_desc: "Fragmented kingdom of Ruthenia must be restored and there is no other country that can oppose us!"
 vol_seventh: "Galician–Volhynian Chronicle"
 vol_seventh_desc: "Written many centuries ago, this chronicle is a treasure for our nation as it covers the most important events in our history."

 WRR_ideas: "Turovian Ideas"
 WRR_ideas_start: "Turovian Traditions"
 WRR_ideas_bonus: "Turovian Ambition"
 wrr_first: "Pinsk Marshes"
 wrr_first_desc: "The deadly marshes of Pinsk are one of the largest wetlands in Europe. The dense woods and network of rivers makes it extremely difficult for foreign armies to march through our lands."
 wrr_second: "The Trade Center"
 wrr_second_desc: "Since the times of Kievan Rus, the lands that we control have been an important centre of trade between the Ruthenian principalities in the east and the Baltic region in the west."
 wrr_third: "Protect Against the Balts"
 wrr_third_desc: "Many times throughout history, the aggressive Baltic pagans were attempting to invade and sack our cities. In time, we have learned how to properly defend ourselves."
 wrr_fourth: "Forest Warfare"
 wrr_fourth_desc: "Difficult terrain of our country forced us to adapt to forest warfare in which we became masters."
 wrr_fifth: "The True Heir of Rus"
 wrr_fifth_desc: "Unlike other weak princes, Turov is the strongest country to exist in the region since the fragmentation of Kievan Rus. The legacy of Ruthenia is ours to claim."
 wrr_sixth: "Subjugate the Princes"
 wrr_sixth_desc: "Our prominent position and overall strength of our country gives us the opportunity to subjugate Ruthenian princes."
 wrr_seventh: "Infantry Specialization"
 wrr_seventh_desc: "Woods and marshes of White Ruthenia are a terrible terrain for the use of cavalry. Therefore, our ancestors were focusing mainly on the proper use of infantry units which is a military ideology we follow to this day."

 VLD_ideas: "Volodymyr Ideas"
 VLD_ideas_start: "Volodymyr Traditions"
 VLD_ideas_bonus: "Volodymyr Ambitions"
 vld_first: "The Dormition Cathedral"
 vld_first_desc: "Commissioned by Andrew the Pious, the Dormition Cathedral was a mother church of Rus' for over two centuries. The Cathedral later also became a crypt for the rulers of Volodymyr."
 vld_second: "Retake our Lands"
 vld_second_desc: "Over the centuries, our country lost vast territories to the traitorous princes of Rus'. Cities such as Kostroma or Rostov once belonged to us. We must reconquer them!"
 vld_third: "Cities of Volodymyr"
 vld_third_desc: "During the invasion of Rus', most of our people migrated north to escape the wrath of Mongols. During these times, they founded many cities in Russia, such as Pereslav, Kostroma, Dmitrov, Uglich or Tver."
 vld_fourth: "Yuri's Triumph"
 vld_fourth_desc: "Yuri II was a brilliant military commander who decisively defeated dangerous Volga Bulgars. The story of his triumph makes our soldiers proud to this day."
 vld_fifth: "Sack of Ryazan"
 vld_fifth_desc: "During the rule of Vsevolod III, our armies achieved another important victory against Volga Bulgars. During his campaign, he managed to burn Ryazan to the ground and force Bulgars to pay tribute."
 vld_sixth: "Theotokos, the Holy Protectress"
 vld_sixth_desc: "Virgin of Volodymyr, the picture of Virgin and Child was introduced by Prince Andrew, who dedicated to Her many churches and installed in his palace a revered image, known as Theotokos of Volodymyr."
 vld_seventh: "Anti-Mongol Coalition"
 vld_seventh_desc: "The resurgent heirs to the Mongol Empire must be stopped. Rus' have known nothing but chaos since the fall of an united realm. We must rally other Princes and form a coalition to stop this threat for good."

 PDL_ideas: "Podillian Ideas"
 PDL_ideas_start: "Podillian Traditions"
 PDL_ideas_bonus: "Podillian Ambition"
 pdl_first: "Starosta"
 pdl_first_desc: "Starosta of Podolie is a person whose role is to administer the assets of family estates. In terms of municipality, Starosta is a senior administrative official."
 pdl_second: "Repel the Tatars"
 pdl_second_desc: "Due to our geographical position, Tatars had an easy time invading us and plundering our lands. As years passed, we have prepared ourselves for their attacks and are now able to better defend ourselves."
 pdl_third: "Catholic Diocese"
 pdl_third_desc: "The Roman Catholic Diocese of Kamienets is a diocese of Latin Rite of the Catholic Church in Ruthenia. Existence of such an institution in our lands have taught both the Catholics and the Orthodox Christians to tolerate each other."
 pdl_fourth: "Halt the Nomads"
 pdl_fourth_desc: "Over centuries, Nomadic Hordes have repeatedly invaded Podillia and razed and burned countless villages and smaller towns. We must build up defensive infrastructure and make sure that our people are safe from any future Tatar attempts."
 pdl_fifth: "Jewish Community"
 pdl_fifth_desc: "The Jews of Podillia are mainly concentrated in our capital and other bigger towns. Their skills as merchants are helping our cities to grow faster."
 pdl_sixth: "Chernozem"
 pdl_sixth_desc: "Podillian Chernozem is the most fertile piece of land in the whole of Europe. If we manage to secure peace in our lands and prevent invaders from destroying our crops, we can become Europe's largest exporter of grain."
 pdl_seventh: "Support Local Traders"
 pdl_seventh_desc: "By introducing and supporting seasonal markets and fairs in our cities, we aim to develop  a strong and stable network within our country - one that will attract even the foreigners to our lands and expand our access to far away markets."

 VLG_ideas: "Vologdan Ideas"
 VLG_ideas_start: "Vologdan Traditions"
 VLG_ideas_bonus: "Vologdan Ambition"
 vlg_first: "Waterways of Vologda"
 vlg_first_desc: "Our country controls the important waterways connecting cities of central Russia with Novgorod and White Sea. These waterways are of big strategic value as most of the local trade is using them to transport the goods."
 vlg_second: "Compete with the Princes"
 vlg_second_desc: "The downfall of Rus' broke the region into many smaller Principalities, all claiming to be the rightful Heirs of Ruthenia. As we have a bit better position than most of them, we should use this to our advantage and expand our influence beyond the borders of our country."
 vlg_third: "Fortress of Vologda"
 vlg_third_desc: "The prince ordered us to build a huge fortress in the middle of Vologda in order to give better chances in the case of foreign invasion of some of the ambitious Princes."
 vlg_fourth: "Saint Sophia's Cathedral"
 vlg_fourth_desc: "The Saint Sophia's Cathedral is a beautiful structure, one of the most important landmarks of our city. It was also the first stone building to be built in Vologda."
 vlg_fifth: "Vologdan Butter"
 vlg_fifth_desc: "Vologdan butter is a type of butter made in Vologda, known for its sweet, creamy and nutty flavour. It gets its flavour from its particular manufacturing process, which involves an exact set of temperatures and fat content; as well as due to the vegetation and breed of cows found in Vologda."
 vlg_sixth: "Salt and Fur Trade"
 vlg_sixth_desc: "Our town of Galich is a very important local centre of trade as it controls most of the fur and salt trade in all of Russia."
 vlg_seventh: "Between Two Great Powers"
 vlg_seventh_desc: "Our country is bordered by the most powerful Russian country, Novgorod to the West and successors to the Mongol Hordes to the East. This poses a threat to our country and we must adapt to the situation by maintaining an army that could defend us in case any of them invaded us."

 IUKR_ideas: "Rus' Ideas"
 IUKR_ideas_start: "Rus' Traditions"
 IUKR_ideas_bonus: "Rus' Ambition"
 IUKR2_ideas: "Rus' Ideas"
 IUKR2_ideas_start: "Rus' Traditions"
 IUKR2_ideas_bonus: "Rus' Ambition"
 ukr_first: "Defy the Golden Horde"
 ukr_first_desc: "We were once a divided but proud and prosperous people, but in the wake of the Tartar hordes our once great cities and cathedrals have been reduced to ash and dust. The senseless destruction of our homeland demands to be paid for in blood - and we have long been anticipating the day we might put the lessons we learned from our previous defeats to the test."
 ukr_second: "The Rebirth of Rus'"
 ukr_second_desc: "There has long been a sentiment among the various Rus’ princes to re-unify in the wake of Tartar domination. Now that the various hordes that used to exact tribute from us are too busy fighting amongst themselves to stop us, any prince with a strong enough will can unite the whole of the Rus’ once again - and perhaps even go further."
 ukr_fourth: "Varangian Trade Routes"
 ukr_fourth_desc: "The proud Viking forebears of our dynasty knew the value of the great rivers that flow through this region, but ever since the Tartar invasions, these trade routes have fallen into sharp decline. If we could revitalize these ancient trade routes, there is no doubt we could have a firmer grasp on the trade that flows through this region."
 ukr_third: "Siberian Frontier"
 ukr_third_desc: "The distant wastes of Siberia call to us. We must clear a way there and let our cossacks go forth and bring land for the people of Rus'."
 ukr2_third: "Siberian Frontier"
 ukr2_third_desc: "The distant wastes of Siberia call to us. We must clear a way there and let our cossacks go forth and bring land for the people of Rus'."
 ukr_fifth: "Legacy of Saint Volodymyr"
 ukr_fifth_desc: "Long ago, our forebearer Volodymyr of Novgorod saw the light of Christ Jesus and brought all the Rus’ people under His church. With the Romans who historically held control of the Patriarch gone, there is a vacuum which we could easily fill given the size and strength of our state, and our connection by blood to the great Roman emperors of old. We will consecrate a new Patriarch of all the Rus’ to show all other faithful that we are the inheritors of the holy Orthodox Church."
 ukr_seventh: "The Mother of Cities"
 ukr_seventh_desc: "In many ways, [280.GetName] is the root from which all of the other major Rus’ capitals have spawned. Razed and pillaged by the barbarian hordes centuries ago, it is now but a mere shadow of its former self. We must rebuild the city of our ancestors grander and more opulent than ever before, so that all will know the glory of the Rus’ people!" 

