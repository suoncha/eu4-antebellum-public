# Ideas #
 MAZ_ideas: "Mazovian Ideas"
 MAZ_ideas_start: "Mazovian Traditions"
 MAZ_ideas_bonus: "Mazovian Ambition"
 maz_piast_legacy: "Defeat of the Piasts"
 maz_piast_legacy_desc: "Before the Piasts united Poland, we had already nearly done so. They merely stole our accomplishments and claimed them as their own, but their hubris would soon catch up to them. When the Piasts proclaimed the farce of conversion, we rose up against them and beat them back to Polania, freeing the followers of Rod from their oppression. In the centuries since we have not hesitated to remind those who question us: we were the ones who freed Poland from the heathens."
 maz_frontier: "Mazovian Frontier"
 maz_frontier_desc: "Mazovia has long been a fortified frontier, a bulwark against the Christians both East and West. As the bridge between the Slavic and Baltic Pagans, the Christians have long desired our lands in order to split us from our Northern brethren. Our borders must always be guarded with vigilance, our forts well-maintained, and our troops sufficiently equipped. For there is no buffer the enemy will pass through before reaching our fortifications."
 maz_between_monk_eagle_and_purse: "Between Seer, Eagle and Purse"
 maz_between_monk_eagle_and_purse_desc: "If we are to keep our independence, we must continue employ a well-trained diplomatic service, lest our rivals outmaneuver us. Princes of Mazovia have often been mediators between the various Polish principalities and the Baltic Pagans in the North, and we have a tradition of successfully negotiating alliances and keeping our country safe from the ambitions of our neighbours."
 maz_szlachta_zasciankowa: "Szlachta Zasciankowa"
 maz_szlachta_zasciankowa_desc: "While some of the Szlachta may live in peasant backwaters, sometimes not even able to afford a single horse, they are still nobility. The landed gentry have for centuries made up a significant percentage of the Mazovian population. We must accept that the nobility are all equal, and make good use of these men as low ranking officers and dragoons."
 maz_mazovian_lawmaking: "Mazovian Lawmaking"
 maz_mazovian_lawmaking_desc: "As Mazovia adopted codified laws and writing much earlier than the rest of Poland, our laws differ quite a bit from those followed in the rest of the Polish lands. By writing down and reaffirming our own sets of laws we strengthen our state and reinforce our unique traditions."
 maz_sejmy_i_sejmiki: "Sejmy i Sejmiki"
 maz_sejmy_i_sejmiki_desc: "Through long and furious disputes the Pagans of Europe have so far refused to come to agreements on common defence. We shall call a great diet at Warzsawa to rectify these disputes. Even if we cannot resolve them all, we shall create a united front against the Christians for our mutual defence and cooperation, hosted by our great princes."
 maz_emporium: "Central Emporium"
 maz_emporium_desc: "Trade is what fills our coffers and what makes our cities grow. Mazovia's location straddling the Vistula allows it to control much of the trade of our region, as both the Amber Road trade and the northward stream of Grain from the Rus flows through our lands. Truly Mazovia is the prime location for a central emporium, governing the flow of trade through the Slavic lands and beyond."

 LUD_ideas: "Lendian Ideas"
 LUD_ideas_start: "Lendian Traditions"
 LUD_ideas_bonus: "Lendian Ambition"
 lud_first: "Burning Forests"
 lud_first_desc: "Even with the dwindling of our once mighty forests, we are still surrounded by woods, and we have used these to our advantage. In times of peace we have sporadically used controlled fires to clear these lands for farming, but in times of war we shall set the countryside alight, so our enemies have nought but cinders to pillage."
 lud_second: "Rurikovich Connections"
 lud_second_desc: "Since our conversion to Orthodox Christianity centuries ago, we have made a long tradition of dealing with the many Rurikovich Kniazes. From paying tribute to forging alliances, only briefly paused by the occasional squabble, our connections with our brethren in the East are deep. Our long tradition of diplomacy with these Princelings has served us well, and our diplomats are experienced at mollifying the concerns of petty lords."
 lud_third: "Spies of Goraj"
 lud_third_desc: "Alexsander Gorajski was a Lendian nobleman at the time of the Mongol Conquests who had learned from the enemies of the Great Khans. Gorajski implemented a policy of strategic retreat, while placing informants inside of abandoned territories in the hopes of infiltrating the invaders. When Gorajski's Lendian force finally attacked the invaders in Lublin, they were repulsed from Lendia entirely, and his cunning was seared into legend."
 lud_fourth: "Cherven Forts"
 lud_fourth_desc: "The fortified cities of Cherven have long protected us from any hostility from the Rus, but as of late these forts have fallen into disrepair. Our restoration of this bastion line will provide us with exactly the protection we need from the resurgent threats from the East."
 lud_fifth: "Embrace the Orthodox Faith"
 lud_fifth_desc: "Under the influence of Ruthenia, our people have been slowly embracing the Orthodox faith. Long having been the official religion of our country, our subjects now have become true believers, stalwart in the faith, even as the Pagans try desperately to encroach upon our lands."
 lud_sixth: "Black Sea Trade Routes"
 lud_sixth_desc: "In the 14th and 15th centuries, Lendia entered a period of prosperity thanks to the trade routes crisscrossing our lands. Merchants from faraway places like Novgorod, Georgia, Greece, and Pannonia now pass through Lublin frequently, and our influence over the Amber Road trade from the Baltic to the Black Sea has grown."
 lud_seventh: "Tame the Woods"
 lud_seventh_desc: "Even with extensive land clearances, Lendia remains a region of forests and trees. Thus, land reforms and distributions are necessary to ensure our continued productivity. By efficiently using farmlands and forest clearings and expanding access to land ownership for a greater portion of the nobility, we shall tame the once smothering woods, and transform our nation into a productive powerhouse."

 PLN_ideas: "Polan Ideas"
 PLN_ideas_start: "Polan Traditions"
 PLN_ideas_bonus: "Polan Ambition"
 pln_first: "Corona Regni Poloniae"
 pln_first_desc: "We have long believed that the restoration of the Polish Kingdom is not just our duty, but our destiny. With renewed strength in the one true faith, we shall embark on the path to glory, once again taking our place as the greatest power in the region."
 pln_second: "Relics of St. Wojciech"
 pln_second_desc: "Many missionaries came to the Polans to help them spread the Catholic faith amongst the heathens. Most prominent was Adalbert of Prague, whose relics now lie within the Cathedral at Gniezno. St. Adalbert serves as an example to those that came after him to spread good word, and maintain the faith within a sea of heathens."
 pln_third: "The Amber Road"
 pln_third_desc: "For centuries, merchants from all over the world came through Polania, carrying amber from the Baltic coast to the Mediterranean sea. The Amber Road has afforded our merchants connections with our brethren in the faith all across Europe, from Bohemia to Sweden to Croatia."
 pln_fourth: "Shieldmaidens"
 pln_fourth_desc: "For many years, we joined the Vikings in their raids across Europe, and like in Northern lands, becoming a warrior was not restricted to men. Shieldmaidens became ingrained in our culture: their strength in combat was renowned, and they greatly strengthened Polan armies, even after our conversion. Nowadays, as we remain surrounded by heathens, their service is needed more than ever."
 pln_fifth: "Viking Connections"
 pln_fifth_desc: "In addition to our shared traditions of Shieldmaidens, many Northmen were invited to Polan lands, where they served as bodyguards and swords-for-hire. With our continued connection with the Swedish varangians, these mercenary traditions have only been strengthened. Our reliability in payment of these mercenaries has established for us a reputation as an accountable and reliable employer, securing us lower rates as well."
 pln_sixth: "Dagome Iudex"
 pln_sixth_desc: "In the year 991, Mieszko I placed his lands directly under the protection of the Apostolic See. This decision would for years to come result in great influence of the Piast rulers within the court of Popes, and many cardinals would come from our humble country."
 pln_seventh: "Agricultural Traditions"
 pln_seventh_desc: "Polania is a rich and fertile land, some of the most productive agricultural lands in all of Europe. Even our name came from the word “field”. We have been farming the fertile lands of Polania far longer than any can remember, and our expertise in grain farming and cattle grazing is well renowned."

 VIS_ideas: "Vistulan Ideas"
 VIS_ideas_start: "Vistulan Traditions"
 VIS_ideas_bonus: "Vistulan Ambition"
 vis_first: "Bastion of Faith"
 vis_first_desc: "With threat from the Christians rising, our soldiers know that they are defending not only our state, but their very way of life. Surrounded by the Polans, Lendians, Moravians, and Czechs, every Vistulian soldier is keenly aware of the stakes of battle. We must fight on to preserve the faith and the traditions of our ancestors against those who threaten us."
 vis_second: "Market of Krakow"
 vis_second_desc: "The market town of Krakow has grown from a humble village to a thriving city of merchants and commerce. Our bustling capital has done much to attract traders from all over to not just pass through, but settle permanently. Fostering a growing merchant community is vital to our continued prosperity, and perhaps we may even recruit these traders directly into our service."
 vis_third: "Raiding Traditions"
 vis_third_desc: "Krak was a fearsome warrior and raider, a prince who inspired fear and terror near and far. Even as the small cavalry of Krak has grown over the centuries into a fierce retinue, our neighbours have forgotten to fear the Vistulian cavalry. We will once again put our horses first and ride forth, reminding the heathens to fear the raiders of Krak once more."
 vis_fourth: "Hejnal Krakowski"
 vis_fourth_desc: "The Trumpet Call of Krakow is our first line of defence, a call for preparedness and rearmament. The very sound of it bolsters the morale of the troops for they know help is on the way, and in times of peace it serves as an important reminder against complacency."
 vis_fifth: "Power of Wavel Dragon"
 vis_fifth_desc: "The legends says that Dragon was slain by Krak himself, saving the whole of Vistulania from that terrible monster. Krak was said to have taken the power of Dragon's breath, and his descendants have inherited that power. Vistulania shall use this fearsome power to annihilate all who dare stand against us."
 vis_sixth: "Cech Filsakow"
 vis_sixth_desc: "On the Vistula and Dunajec, timber rafting has been the preferred method of transit of goods, but rafting has long suffered from a critical lack of infrastructure and support. Now, with the foundation of the bargemaster's guild and the procurement of new woodlands, we can properly utilise the great rivers, establishing Krakow as the greatest of the riverine trade powers in region."
 vis_seventh: "Legacy of Krak"
 vis_seventh_desc: "Krak's name is found everywhere in our state, with shining Krakow as the pinnacle of his legacy. Every Vistulian ruler since Krak has been descended from the great prince, and the dynasty has done much to play up the exploits of their legendary ancestor in order to shore up their legitimacy in the eyes of the people."

 pol_first: "Reunite Poland"
 pol_first_desc: "Many centuries ago, the Lechitic Lands stood as a united kingdom under the rule of Mieszko of the Piast dynasty. Following his death, the kingdom disintegrated and since then, the Polish tribes were bitter rivals, locked in war against each other. This has to come to an end. The Polish kingdom shall be restored under our rule!"
 pol_second: "United by Faith"
 pol_second_desc: "The tribal allegiance was not the only thing that used to divide the Polish nation; it was religion as well. If we wish to secure Poland as a strong and stable country, we must resolve the religious question as soon as possible."
 pol_fourth: "Control the Amber Road"
 pol_fourth_desc: "The Baltic coastline is known as a deposit of amber, which after being collected is being shipped all over the continent. Since most of the amber trade routes cross our territory, we must hold a tight grip over them."
 pol_sixth: "People of the Fields"
 pol_sixth_desc: "Our flat terrain and countless rivers make Poland a perfect place for agriculture. We shall base our economy on it and prosper greatly!"
 pol_seventh: "Rex Poloniae"
 pol_seventh_desc: "Even though the state of Poland was reunified, we must legitimise our royal family and create a true dynasty which shall rule our nation for centuries to come."

 PLC_ideas: "Intermarine Ideas"
 PLC_ideas_start: "Intermarine Traditions"
 PLC_ideas_bonus: "Intermarine Ambition"
 PLC2_ideas: "Intermarine Ideas"
 PLC2_ideas_start: "Intermarine Traditions"
 PLC2_ideas_bonus: "Intermarine Ambition"
 plc_second: "Concept of Between the Seas"
 plc_second_desc: "Ever since the downfall of the Kievan Rus', eastern Europe was divided between numerous weaker princedoms fighting for power and territory. We shall put this system to an end and establish a huge empire of brotherly nations who shall live together in peace, from the Baltics to the Black Sea!"
 plc_fifth: "Union of Many Nations"
 plc_fifth_desc: "Intermarium is a diverse country, and limiting all power to the Polish people would create great discontent and a risk of civil war. Instead, we shall turn our state into a union where everyone has equal opportunity, no matter the ethnicity."
 plc2_fifth: "Union of Many Nations"
 plc2_fifth_desc: "Intermarium is a diverse country, and limiting all power to the Polish people would create great discontent and a risk of civil war. Instead, we shall turn our state into a union where everyone has equal opportunity, no matter the ethnicity."

