### ARMENIA ###
# Countries #
 CLC: "Cilicia"
 CLC_ADJ: "Cilician"
 AME: "Armenian Empire"
 AME_ADJ: "Armenian"

# Ideas #
 CLC_ideas: "Cilician Ideas"
 CLC_ideas_start: "Cilician Traditions"
 CLC_ideas_bonus: "Cilician Ambition"
 clc_first: "Protect the Gulf of Alexandretta"
 clc_first_desc: "The Gulf of Alexandretta is vital to not only our overseas trade but to our supply lines in the event of a Nizzarid or Seljuk incursion. It is imperative our navy is well disciplined enough to keep this route open, as it will help our garrisons in the homeland hold out for as long as possible."
 clc_second: "Crusader Alliances"
 clc_second_desc: "Since the very foundation of our state, we have had strong ties with Franks of the west. No others, not even the Greeks who first requested their presence, have been so stalwart in support of their conquest of the Holy Land. This devotion of the Crusader cause has made us quite popular in Europe."
 clc_third: "Royal Mint of Tarsus"
 clc_third_desc: "Our Royal Mint in Tarsus has become a backbone of our economy because of the careful minting of gold and silver coins, called dram and tagvorin respectively. The fact that these coins are accepted by much of Europe such as the markets Venice, Pisa, Genoa and even France shows how reliable they are the exchange of foreign currencies for our own continues to be a great help to the economy."
 clc_fourth: "Juncture of the Trade Routes"
 clc_fourth_desc: "Ever since the days of Tigranes the Great, Cilicia has served as an important crossroad between two worlds, the west and east. While the silk road is not what it used to be and trade from it has diminished significantly, we can use the natural strategic position of our land to facilitate as much trade revenue as is still possible."
 clc_fifth: "The Apostolic Church"
 clc_fifth_desc: "Armenia was the first nation to establish Christianity as its state religion in 301. The sense of having the first national church in the world brings immense pride to our nation. Our religious faith has helped us retain our identity and hope, especially with thanks to Saint Meshrop Masdots and his Armenian alphabet, which revolutionised the fate of our people. It was a fundamental step in strengthening Armenian statehood and identity."
 clc_sixth: "Banish the Turks"
 clc_sixth_desc: "Centuries ago, the barbarous Turks spilled out over the Caucasus mountain and ravaged the Armenian homeland. Our people are the descendants of nobles and commoners alike who managed to flee the Turkish onslaught and set up a new homeland for the Armenian people. We have not forgotten our brothers in Armenia however, and our soldiers know that they are not just fighting for themselves and their families, but for the freedom of every Armenian from the Turkish yoke!"
 clc_seventh: "Reunite Armenia"
 clc_seventh_desc: "Our kings have dreamed of ending their exile from their birthright and marching back into the Armenian homeland. We have not as of yet had the strength or means to do so, but the time is now ripe for its reconquest. Even among the areas where Turks have become the majority, there are many capable Armenians in these lands who will help us to reintegrate their local communities back into the true Armenian kingdom."

 ARM2_ideas: "Armenian Ideas"
 ARM2_ideas_start: "Armenian Traditions"
 ARM2_ideas_bonus: "Armenian Ambition"
 arm_first: "Sons of Hayk"
 arm_first_desc: "We, the Armenian people, are descendants of Hayk, the legendary warrior who defended his homeland against the invading Assyrians. Throughout history, we have stood guard against a cavalcade of empires seeking to control our lands; we have learned to be as resilient, valiant, and unwavering as our forefather."
 arm_second: "Land of 1001 Churches"
 arm_second_desc: "Armenia is known as the land of one thousand and one churches, though the actual number of churches may exceed this figure. Regardless, our people have become famous for the speed and efficiency with which we build and rebuild our public works."
 arm_third: "First Children of Christ"
 arm_third_desc: "The Artaxiad Kingdom of Armenia was the first state in the world to adopt christianity as its official religion. We, before any other people, opened our hearts to Christ, and for this, God smiles upon us."
 arm_fourth: "Stand Against the Turk"
 arm_fourth_desc: "The Seljuk menace has terrorised Anatolia for long enough. No more shall we be subject to their raids and invasions! Our armies will stand firm against their mounted archers and slave-infantry!"
 arm_fifth: "Apostolic Patriarchate of Armenia"
 arm_fifth_desc: "The Apostolic Church of Armenia established its independence from other christian authorities early in its history. We are unique in our theology and will stand firm against those who place Rome and Constantinople before God."
 arm_sixth: "Artaxiad Legacy"
 arm_sixth_desc: "More than a millennia ago, the Kingdom of Armenia extended from the Caspian to the Mediterranean. It is our national right to restore the Empire of Tigranes, and return all the caucuses and beyond into the hands of their rightful rulers!"
 arm2_sixth: "Artaxiad Legacy"
 arm2_sixth_desc: "More than a millennia ago, the Kingdom of Armenia extended from the Caspian to the Mediterranean. It is our national right to restore the Empire of Tigranes, and return all the caucuses and beyond into the hands of their rightful rulers!"
 arm_seventh: "End the Armenian Diaspora"
 arm_seventh_desc: "Since the first Muslim incursions into our lands, the Armenian people have been displaced and moved about by force. Now that we have re-established a strong kingdom for our nation, displaced Armenians throughout the world will be encouraged to return to their ancient homeland."

