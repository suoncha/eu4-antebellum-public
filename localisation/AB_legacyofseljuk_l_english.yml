### GEORGIA ###
# Countries #
 KRT: "Kartli"
 KRT_ADJ: "Kartli"
 GEMPIRE: "Georgian Empire"
 GEMPIRE_ADJ: "Georgian"

# Ideas #
 GEO2_ideas: "Georgian Ideas"
 GEO2_ideas_start: "Georgian Traditions"
 GEO2_ideas_bonus: "Georgian Ambition"
 restoration_of_fortresses_and_churches2: "Restoration of Fortresses and Churches"
 restoration_of_fortresses_and_churches2_desc: "To restore the realm from the devastating invasions of the last centuries, we must rebuild major fortresses and churches so our cities and villages can begin to prosper once again. A special tax was imposed to finance such efforts."

# Government Names #
 SAHERTSOGO: "Sahertsogo"
 SAMEPO: "Samepo"
 IMPERIA: "Imperia"
 MEPE: "Mepe"
 MEPET_MEPE: "Mepet Mepe"
 DEDOPALI: "Dedopali"
 DEDOPALTA_DEDOPALI: "Dedopalta Dedopali"
 HERTSOGI: "Hertsogi"
 HERTSOGINIA: "Hertsoginia"

# Reforms #
 geomiaphysite: "Denounce the Miaphysite Heresy"
 geomiaphysite_desc: "The Miaphysites are one of many problematic heretic groups that have arisen in the embittered confusion which plagues the oppressed Christian east. We have come to the opinion that the theocratic hegemony seen in our Orthodox brothers to the far north is worthy of admiration- as well as replication. Let us reject the schisms once and for all- and purge from our land those who seek to mislead our faithful." 
 geodarbazi: "Darbazi Court Officials"
 geodarbazi_desc: "Darbazi, the council of state introduced by the great David the Builder, has long functioned as council of representatives from all over the Georgian aristocracy and clergy. Should we begin heeding the words of these representatives even more closely, involving them in the king's court, efficiency and communication within the administration could be catapulted to new heights, rivalling the complexity and breadth of the west's many sprawling governments."
 geofortify: "Adopt a Defensive Doctrine"
 geofortify_desc: "We would be fools not to exploit the tried and tested peasant garrisons of our mountainous country. Statewide, we must adopt a defensive doctrine, allowing the garrisons and commanders of fortresses, supply chains and passages to work together seamlessly to create a truly unbreakable defensive doctrine covering all of Georgian Caucasia."
 georuisi: "Council of Ruisi-Urbnisi"
 georuisi_desc: "Zealotry is not all good and beneficial. In the past, the David the Builder found an adversary in the most unlikely of places- the clergy itself. Through treachery and opportunism present within the church, greedy traitors claimed great swathes of land within Georgia, effectively dividing the country. To prevent this crisis from repeating, we must heed the late David's wisdom and find the time to tighten the church's bonds, lest they break free."
 geowest: "Establish Ties with the West"
 geowest_desc: "Nestled between the icy peaks and ancient valleys of Caucasia, we are wholly isolated from the Christian world. Following the Lord in a sea of heathen confusion is a colossal undertaking- so the fact that we need allies is no shameful one. We must pursue a policy of recurrent and consistent diplomacy with the faraway Christian west, for despite our might and tenacity, annihilation waits around every corner in this dangerous world." 
 georegulations: "Regulations of the Georgian Court"
 georegulations_desc: "Court, rife as it is with fiery intrigue and figures from every walk of Georgian life, must be regulated and constrained. Should we direct its myriad of energies and talents towards beneficial goals, we could sharpen our aptitude for diplomacy in particular and make of our court a wise and respectable crowd that is the envy of the world, even perhaps the west."

# Decisions #
 rename_georgian_empire_title: "Proclaim the Georgian Empire"
 rename_georgian_empire_desc: "This decision allows you to change the name of your country to Georgian Empire."

# Events #
 ab_georgia.1.t: "Disintegration of Georgia"
 ab_georgia.1.d: "With the isolate Kingdom of Georgia overwhelmed by steppe peoples, Seljuqs and marauding heathens, the Georgian cultural spirit has splintered and crumbled. Much like the Roman Empire of old and the troubled Franks, a good king can prolong the unity of his holdings- but successive ill-gotten rulers will reduce not only a kingdom to ash, but erode the very memory and notion of it over time. Thus, no longer do the hardy Christians of the Caucasus consider themselves broadly Georgian. Disillusioned with the tales of mighty forefathers such as David the Builder, the lonesome faithful now refer to themselves by their tribal and provincial names of old, believing the names and identities of their localities far stronger foundations to cling to under the threat of foreign oppression than any foolhardy Georgian kingdom."
 ab_georgia.1.a: "Such is the fate of those divided"
 ab_georgia.2.t: "Fall of the Ilkhanate"
 ab_georgia.2.d: "The foul Ilkhanate rump has been vanquished. Their banners lay in tatters, their horses scattered and their rulers either driven from their petty castles or slain in battle. These lands cry out for a new order and we have come- but this victory poses us a question. The peoples of the former Ilkhanate are all invariably heathens, followers of Zoroaster and other mystical cults. While our Kingdom integrates these new provinces, the nobility and clergy presiding over the new possessions urge us to pursue a steadfast religious policy. These new peoples sorely long for a liberator and protector. They seem willing and eager to adopt our practices for the time being, namely our faith, but some believe our rule and administration would benefit from a temporary policy of benevolence and tolerance, strange as these heathen beliefs are."
 ab_georgia.2.a: "Christ preaches love - let them live as they please"
 ab_georgia.2.b: "They are lost and eager - show them the way"
 ab_georgia.3.t: "Avenging the Seljuk Invasion"
 ab_georgia.3.d: "Centuries ago, the roaming Seljuqs swept through Persia and encroached upon the heartland of Anatolia, trampling hundreds of thousands of innocent Christians and laying waste to idyllic farmland. The past has passed- all of that cannot be undone and history is history. However, new history can be made- and it has been made, today, as the Seljuq grip over Anatolia has been shattered by our mighty sword. Their ailing peasants and disgruntled subjects have been brought into our fold unanimously, flocking to our rule as their barbaric lords scatter and flee. Our generals and soldiers alike sing songs of victory and praise, drowning themselves in ale and music on this night of victory. Not only have we proved our worth as a military might, a fearsome beast not to be trifled with, but a shining light to cast out the darkness of steppe rule from a once proud Anatolia."
 ab_georgia.3.a: "May Georgia rule for millennia more"
 ab_georgia.4.t: "Sack of Sarai"
 ab_georgia.4.d: "The heart of the Golden Horde lays penetrated. Sarai and its surrounding provinces have fallen to our banners. After a long and weary campaign on the brutal steppe, our brave men have come upon Sarai like a tsunami on a coastline- smashing through its petty defences as if they were twigs on a beach. Watchtowers have been set alight and now lay crumbling. The subjugated populace scream and run amok, aghast at the blood filling the streets and the dens of heathen worship being torn asunder, ripped apart by our righteous faith. Mongol treasure rooms have been looted and ransacked, revealing treasures from other brutalised kingdoms and victims, some so alien that they must have hailed from far eastern Asia, telling of the horrific extent of the barbarian conquests. With the remainders of Sarai's garrison fleeing like cowards into the vast plains, the Horde as a whole has been dealt a crushing blow, falling into humiliated disarray as Georgia extends her protection to the captured city and its vital river system."
 ab_georgia.4.a: "The wind on the lonesome steppe changes direction. Can you feel it? "
 ab_georgia.5.t: "Peasants Demand Control over the Country"
 ab_georgia.5.d: "There are only so many peasants in the world and unfortunately, when you go through damn near all of them for your wars, their kin tend to get upset at their supposedly 'meaningless' deaths. This anger has simmered for many months and finally erupted. Across the kingdom, various churches and noble estates find themselves besieged by enraged crowds, beseeching the entirely fair and honourable taxes imposed upon them and the 'dire labour shortages' in their shanty little villages. Whatever that means. Most prominent is the uprising in Gori, spearheaded by a charismatic and intelligent church scholar, Ioseb Jughashvili. Ioseb has garnered a great deal of populist support and displays an impressive aptitude towards not only guerilla fighting and basic tactics, but also brutal suppression and intimidation of political opponents and other peasant rabble. He has whipped up a disgusting propagandistic cocktail in the process, spreading strange writings and notions of 'a people's kingdom' and 'equality of wealth'. While this poses a great threat to our weakened and depleted forces, it must be confessed that Ioseb has done a marvellous job at mustering a fighting force, defeating rivals and creating a 'people's revolution'. Our kingdom could, admittedly, use more men like that."
 ab_georgia.5.a: "Our revolution is at hand, brother!"
 ab_georgia.5.b: "Their revolution must be crushed!"

