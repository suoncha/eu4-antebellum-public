### RUM (ZORO) ###
# Countries #
 SRK: "Sarukhanids"
 SRK_ADJ: "Sarukhanid"
 REY: "Rey"
 REINA: "Reina" 
 RUMANSHAHR: "Rûmanshahr"
 RUMANSHAHR_ADJ: "Rûmi"

# Ideas #
 SRK_ideas: "Sarukhanid Ideas"
 SRK_ideas_start: "Sarukhanid Traditions"
 SRK_ideas_bonus: "Sarukhanid Ambition"
 srk_first: "March of the Ilkhans"
 srk_first_desc: "Our state first came into existence as a march of the Ilkhanate, with our highland capital at Oltu being an ideal buffer zone against Seljuk raiding into Persia. Our old masters may be long past their prime, but through maintaining the bureaucracy they left us we know how to best find and conscript any able bodied man in our realm."
 srk_second: "Oltu Highlands"
 srk_second_desc: "While it would have seemed alien to our ancestors on horseback, the Oltu highlands our clan calls home are ideal for fending off our larger neighbours. Be they Georgians, Seljuks or even our old Ilkhan masters, our many fortresses that dot the mountains will be ready for them and buy our armies the valuable time they need to win against any aggressor."
 srk_third: "The Sarukhan Plague"
 srk_third_desc: "When our old Mongol masters abandoned us during their collapse, the greedy Seljuks in their arrogance sought to wipe us off the map in one decisive war. Blessed as we were, however, by Ahura Mazda their armies got bogged down in the highlands during winter and suffered a devastating plague. So ingrained in the minds of our enemies their losses were their historians named the plague after our dynasty! While it may not have won the war, the peasants still look fondly upon the event as a sign that our dynasty is blessed by Ahura Mazda and destined for much more than to be pawns of the Seljuks or Mongols."
 srk_fourth: "Persian Court Culture"
 srk_fourth_desc: "When the Mongols arrived in our region, they didn’t just bring with them extra taxes and foreign warriors, they also brought many skilled men from across Iran to oversee and aid in our clan's governance over the Caucuses. Persians, blessed by Ahura Mazda as they were, have always known how to run an empire, and our past rulers were clever enough to replicate their style of governance in just about every aspect. As a result, skilled administrators are easy to find among our courtiers."
 srk_fifth: "The Fire Temple of Oltu"
 srk_fifth_desc: "Our former Ilkhan masters not long after their arrival had embraced the true faith of the Prophet Zarathustra, and we were able to convince them to build a Fire Temple in our lands in the typical Iranian style so as to bolster the faith of our recently converted Beylik. They obliged, and to this day the Fire Temple at Oltu is the only remaining of its kind in Anatolia. We will invariably build more as our dynasty grows in influence, but the legitimacy it continues to bring us  and our missionaries cannot be overstated."
 srk_sixth: "Ilkhanid Connections"
 srk_sixth_desc: "As we got our start as vassals of the Ilkhanate, it is only natural some of our sons were given Mongol princesses to strengthen their ties to them. They are long gone, but their legacy in Iran and even among the other Beyliks  is still  as strong as ever. We can use our blood ties to them to leverage favours that lesser dynasties could never hope to gain. After all, who could say no to relatives of the greatest warrior to ever live?"
 srk_seventh: "Take the Title of Shah"
 srk_seventh_desc: "Our connections to Iran are well known, our court life, our royal customs, and even our faith all originate from Iran, and  it sets us apart from the other Beyliks, past and present. To capitalise on this distinction, we should take the title of Shah and embrace a Persian way of rule. In doing so, we will affirm our imperial destiny and command far greater respect from our non-Turkish subjects."

 RUMZ_ideas: "Rûmi Ideas"
 RUMZ_ideas_start: "Rûmi Traditions"
 RUMZ_ideas_bonus: "Rûmi Ambition"
 rumz_first: "Heirs of the Ilkhanate"
 rumz_first_desc: "When the Ilkhanate was established over our homeland in the heart of Armenia, we submitted to their might and became loyal subjects. We gained from them new and innovative sieging techniques, involving canon fire and the encircling of cities to drive in refugees and starving masses. We integrated this alongside our military tradition, creating a hybrid Mongol-Turkic school of thought that is sure to terrify and subdue all who would oppose us."
 rumz_second: "Reconstruction of the Cities"
 rumz_second_desc: "The cities of Anatolia are our lifeblood, providing much of the wealth and power that drives our empire forward. However, there are problems with relying on these cities; they hold far too much power, and many of the beys and lords that hold sway there are only tenuously loyal. If we were to instead construct new cities, and staff them with loyal subjects and vassals, we could create a network of loyal and worthy subjects that we could entrust parts of our realm towards."
 rumz_third: "Acceptance of the Daivas"
 rumz_third_desc: "While the worship of false gods who perpetuate the cosmic lie is something that a ruler should normally never tolerate, we are in a strange position. Surrounded by other faiths with deep connections to the local population, it would be in our best interest to maintain the peace in our realm, rather than to attempt to enforce our faith onto these heathens. Should they revolt, we shall follow the example of Darius and Xerxes before us and put down these Daivas worshipping fools, but should they retain their loyalty, we shall treat them as equal citizens under the law."
 rumz_fourth: "The Conquest of the Seljuks"
 rumz_fourth_desc: "Despite our most humble origins, we have managed to expand outward at a rapid pace. We defeated the Seljuks in the field of battle and subjugated all the rival Beyliks, fighting gruelling battles in both city and plains alike. Scores of men have fallen, but from mounds of the dead, we stand tall. Our conquest was swift and absolute, as will be our reclamation of both the lands of the Seljuk Empire and the territory of Iran."
 rumz_fifth: "Riders of Manzikert"
 rumz_fifth_desc: "During the Battle of Manzikert, our heavy cavalry utilised the steppe tactics of a retreating offence to break and encircle Byzantine forces, and eventually win us the fight and begin our incursion into Anatolia. Ever since that day, all Turkic armies have had a massive amount of cavalry in them, and with recent innovations to firearms and battle tactics, we have improved our cavalry to be some of the best in the world. From Europe to Asia, all shall know the might of the Rûmi cavalry!"
 rumz_sixth: "Persianate Administration"
 rumz_sixth_desc: "We rule a large and diverse empire. Instead of supplanting the local ruling class of these foreign territories with our sons and daughters, we have chosen to emulate the Ilkhanate once more. By placing Persian and Tajik rulers in seats of governance and power within our realm, we not only can find those most qualified to run our realm but also quell rebellion and uprisings from those foreign peoples."
 rumz_seventh: "Yasna Rituals"
 rumz_seventh_desc: "Before our soldiers would go to war, our rulers would go to the sacred temples and give offerings to Ahura Mazda. We must perpetuate his eternal sacrifice and offer him back what he has given to us. After we have returned to him the sacred objects, the Priests would proclaim that there were few errors in the ritual and that the war would be a success. We have the duty and obligation to drive away from the forces of darkness and destruction, not just on the cosmological scale, but also on the battlefield. We shall expand the Rûmi state, establishing an orderly realm wherever we shall go, and even if our realm is to suffer from a prolonged war, our people shall bear this strain. Just as Ahura Mazda needs our sacrifices and priests to aid them in the battle against evil, so too must we rely on our people to maintain hope in our conflicts, to fight back against invaders and enemies alike."
 RUMZ2_ideas: "Rûmi Ideas"
 RUMZ2_ideas_start: "Rûmi Traditions"
 RUMZ2_ideas_bonus: "Rûmi Ambition"
 rumz2_sixth: "Persianate Administration"
 rumz2_sixth_desc: "We rule a large and diverse empire. Instead of supplanting the local ruling class of these foreign territories with our sons and daughters, we have chosen to emulate the Ilkhanate once more. By placing Persian and Tajik rulers in seats of governance and power within our realm, we not only can find those most qualified to run our realm but also quell rebellion and uprisings from those foreign peoples."

# Reforms #
 zoroastrian_rum: "Shahdom of Rûm"
 zoroastrian_rum_desc: "With influences from Zoroastrianism and the Persian states that came before it, our ruler has officially adopted the title of Shah of Rûm, claiming the legacy of Rome for themselves. Satraps who answer directly to the Shah are appointed to govern and control the enthically diverse states of the Shahdom. Temples dedicated to the eternal flame are built across the state as the once Turkish aristocracy adopts a more Persian culture."

# Decisions #
 turkish_nation_form_title: "Claim the Legacy of Seljuk"
 turkish_nation_form_desc: "Once, the Empire of the Great Seljuks united all the Turkish Beys and Emirs of Anatolia, but it was brought down by jealous and deceitful enemies from afar. The restored Seljuk Sultanate is unworthy of their legacy, and only we can restore the Empire that once was. Let us unite the Beys under our banner and bring destruction upon those that would dream themselves our overlords. The Legacy of Seljuk is one of blood and conquest, and if one wishes to claim it as their own, they must be prepared to pay the price in full."

# Events #
 ab_zrum.1.t: "Annexation of the Ilkhanate"
 ab_zrum.1.d: "They came like lightning, rushing in from the steppe sand pouring over the Iranian highlands. They slaughtered all those who opposed them, be they man, woman, or child. The Mongols were the scourge of the world, punishment from the divine, and a menace to all civilization. Yet now they kneel at our feet, brought low by those who they had conquered and subjugated. We had been subjugated and dominated by the Ilkhanate during the 14th Century fracturing of the Seljuk Empire. It has been a long and arduous road from there, where we had to fight and scrape just to survive. While we grew strong, the Ilkhanate became bloated and arrogant. Their leaders believed themselves to be the true masters of Iran, that no one could oppose them let alone stop them. Their foolishness lost them their empire, and our bravery and fortitude gained us ours. Never again shall we be conquered; never again shall we be subjugated!"
 ab_zrum.1.a: "…In this great game, they were only a pawn"
 ab_zrum.2.t: "A New Capital"
 ab_zrum.2.d: "To the south of Baghdad, the ruins of a city lay amidst the forgotten plains. Buildings ransacked and dilapidated, temples burnt or destroyed, and a pervasive silence hangs in the air. The Tigris is wild and untamed, and the land is devoid of any humans, reclaimed by nature. The ancient city of Ctesiphon, once the capital of the mighty Iranian Empires, is nothing but a ghost town now. However, our great Shah claims that it our destiny to rebuild this place. The city was the seat of power for the Zoroastrian Iranians for centuries, and if we are to claim that legacy, we must showcase it with great works and projects. The rebuilding of this ancient capital and making it our own shall be our magnum opus, our ode to the emperors of the past, to the Sasanians and the Parthians. We shall rebuild what the Muslims had destroyed and make it whole once more."
 ab_zrum.2.a: "We will move the capital to Ctesiphon."
 ab_zrum.2.b: "We will move the capital to Persepolis."
 ab_zrum.2.c: "The seat shall remain in [Root.Capital.GetName]"
 ab_zrum.3.t: "Legacy of Seljuk"
 ab_zrum.3.d: "Once, the rulers of the Seljuk empire were those who we would have sworn our utmost of loyalty towards. Now, we recognize them for what they are; weak and broken. We shall push into the heart of Anatolia and conquer these lands away from the doddering fools still holding on to a crumbling dream and supplant it with our own. From here, the glory and honor that once belonged to the great Seljuk Empire shall instead fall into our hands, as shall all their cities and peoples."
 ab_zrum.3.a: "Onwards, to war!" 
 ab_zrum.4.t: "The Destruction of Mecca and Medina"
 ab_zrum.4.d: "As the high priests tell us, the only path to creating a world of peace and stability is through Ahura Mazda. We offer him our thanks and praise, our sacrifices and worship in exchange for his guidance and power. All other faiths, be it they worship one God or many, are traps, designed by Angra Mainyu and the demons to lure us down the false paths. We must be wary of these gods and remove them from our realm; it is the duty of the Shah to do so. None are more destructive to us than that of Islam, that which had threatened our lively hood and very nearly came close to wiping out the ancient tradition. We must remove all traces of this faith, starting with their most holy of sites, Mecca and Medina. With the destruction of these cities, Islam shall lose all its credibility, and we can showcase the dominance of our own Iranian traditions!"
 ab_zrum.4.a: "Burn it to ash!"
 ab_zrum.5.t: "The Capture of Constantinople"
 ab_zrum.5.d: "As the dark fog left over from the cannon barrage slowly dissapears, [Root.Monarch.GetName] and his army, followed by hundreds of believers and servants of Jesus Christ roam the streets of the great  city  and pay a visit to Hagia Sophia. The church's impeccable design and holy energy manifests into the soldier's hearts, whom fought risking their lives to save Constantinople from it's degenerated, corrupted rules of the Angelos. The [Root.Monarch.GetTitle] of Rum now holds suzerianity over this city and made sure no Christian would get harmed. Their conquest was one of a kind, utilized new technology and tactics while harmonizing them with the legacy of their ancestors in Asia. News of the conquest was quickly served into Europe and the Latins were not happy, now having to deal with a competent foe unlike the decaying Angelos. As the now overthrown Byzantine dynasty's banners are removed from the palace and replaced by the double-headed eagle over cyan fabric. [Root.Monarch.GetTitle] [Root.Monarch.GetName] watches over the Bosphorus from his new home's balcony, just like how Kur Shad watched the rivers from the Chinese palace."
 ab_zrum.5.a: "The City of the World's Desire is ours!"
 ab_zrum.6.t: "The Fall of Rome"
 ab_zrum.6.d: "Rally the believers! Rome, the capital of western civilization and Christendom, is conquered by the Turks! The fires around Latium can be seen from all over region and the ancient city is subjugated to the Muslim armies. [Root.Monarch.GetName] marches into the Papacy with his army as the local Christian population and priests run away in fear while the Mehter plays all over the city and preachers informing the citizens about the conquest and the new order that will reign in the city. From the Colosseum to the Castel Sant’Angelo, the blue banner of the Turks fly high accompanied with double-headed eagle. News of the conquest have reached the other Christian nations which are now preparing their defenses in a hectic manner against the potential invasion of their homelands by the Turks. The Sultan, however, is very proud of his achivement and the fulfilling feeling that he has completed what his ancestors always wanted. Rome is now Turkish, as Turkish Rome marches further into Europe."
 ab_zrum.6.a: "The Crescent triumphs over the Cross!"

