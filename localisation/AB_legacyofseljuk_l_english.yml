# Decisions #
 form_macedonia_title: "Restore the Macedonian Empire"
 form_macedonia_desc: "Having reclaimed the lands ruled by Alexander the Great, it is time we declare ourselves as the rightful heirs of his legacy!"

# Events #
 ab_nicaea.0.t: "Byzantine Refugees"
 ab_nicaea.0.d: "A small merchant vessel makes landfall in the cover of night on the rocky coast of Optimatoi province, its cargo revealed to be and entire family of Roman noblemen, huddled in blankets and making their way onto the beach and preparing to travel to the nearest settlement, Constantinople’s lights still in the distance. This is only one story of hundreds like it happening every day of Roman citizens fleeing the corpse-empire for our prosperous lands. While extra population never hurts, these people bring with them dangerous ideas, some even still loyal to the empire. What is to be done with these misled children of Greece?"
 ab_nicaea.0.a: "Accept them all, these are only folks looking for a better life here"
 ab_nicaea.0.b: "Accept only those who we can trust not to work for the Emperor"
 ab_nicaea.1.t: "Fall of Constantinople"
 ab_nicaea.1.d: "The gates break, their iron casings torn asunder by our siege weapons. Constantinople, the city of the world's desire, has finally fallen. The treasury has been emptied, the relics stolen, and the Roman crown jewels melted down into a new crown befitting of the newly proclaimed King of the Greeks, all brought back to Nicaea where they shall remain, memorials to our liberation of Greece!"
 ab_nicaea.1.a: "We have trampled the legacy of the Romans!"
 ab_nicaea.2.t: "The Birth of the Hellenic Empire"
 ab_nicaea.2.d: "'By the grace of God, Emperor and Autocrat of the Greeks' so said the Patriarch of Constantinople before placing the crown upon our King’s head. Long has this moment been foretold, when Greece would rise above her shackles and claim her place in the sun. Not since Alexander has such glory been graced onto Greece, and we shall carry the light of Hellas even beyond what Alexander could possibly have dreamt of."
 ab_nicaea.2.de: "'By the grace of God, Emperor and Autocrat of the Greeks' so said the High Priest before placing the crown upon our King’s head. Long has this moment been foretold, when Greece would rise above her shackles and claim her place in the sun. Not since Alexander has such glory been graced onto Greece, and we shall carry the light of Hellas even beyond what Alexander could possibly have dreamt of."
 ab_nicaea.2.a: "For the glory of Hellas!"
 ab_nicaea.3.t: "The Destruction of Venice"
 ab_nicaea.3.d: "Eager to avenge the legendary betrayal of the crusaders, our troops spared no-one as they descended upon the once-great city of Venice. The mission of the imperial generals has always been clear, all patrician families must be stripped of their property and honors, and the treasures that were once stolen from the city of the worlds desire must be returned. As the time came for the descent of Greek armies upon the City of Water, things turned more hideous than anyone could have imagined. A lifetime of warfare does not foster kindness in anyone and with commanders eager to see the city burn, our soldiers embarked on a several days long campaign of devastation and plunder of churches, palaces and even the Venetian arsenal."
 ab_nicaea.3.a: "Oderint Dum Metuant"
 ab_nicaea.4.t: "Avenging Manzikert"
 ab_nicaea.4.d: "Nearly three centuries ago, Greece suffered possibly the most devastating defeat in modern times at the hands of the Turkish hordes – The Battle of Manzikert. Greek soldiers led by Roman fools were slain by Seljuk forces, paving the way for the Turkish conquest of Anatolia. As our legions march across the fields where so many of our ancestors lost their lives, they break ranks and erect a monument to those who were lost. May this triumphant victory mark the beginning of a new era - a Greek era!"
 ab_nicaea.4.a: "We remember the fallen"
 ab_nicaea.5.t: "Ptolemaic Restoration"
 ab_nicaea.5.d: "Since the last time Greeks ruled over the sands of Egypt in the 1st century before the Christ, much has changed. Former temples lay in ruins, and the mighty pyramids themselves have lost their limestone shine, for the Romans, and later Arabs, have ruled these lands for centuries, until now. Ruling over an Egypt whose populace is now completely foreign to us will be difficult beyond measure, and there are a few options before us as to how we will restore order to Egypt."
 ab_nicaea.5.a: "Direct rule from Greece, while costly, will be most effective"
 ab_nicaea.5.b: "Reestablish an 'independent' Greco-Egyptian state"
 ab_nicaea.5.c: "The Basileus of Greece shall also be Basileus of Egypt!"
 ab_nicaea.5.de: "We shall become the governors of Egypt"
 ab_nicaea.5.e: "We will rule Egypt in the name of Basileus"
 ab_nicaea.6.t: "A New Capital"
 ab_nicaea.6.d: "Recently, a debate has stirred in the administration over where to place our capital. While it might seem simple at first, the capital of any nation is a difficult issue, being the center of all activity in the realm, and the seat of the administration. Choosing an ample place is of utmost importance, and as our territory expands, Nicaea becomes less and less advantageous. Our advisors have labelled a few cities that could be chosen as the new capital of the Empire."
 ab_nicaea.6.a: "Byzantion already has the needed infrastructure for a large Empire"
 ab_nicaea.6.b: "Thessaloniki has access to the Aegean and is easily defensible"
 ab_nicaea.6.c: "Athens has always been the beating heart of Greek civilization"
 ab_nicaea.6.de: "Keep the capital in Nicaea"
 ab_nicaea.7.t: "The Rebirth of Hellenism"
 ab_nicaea.7.d: "We have torn down their statues, we have stripped them of power and wealth, every single day we do all we can to reverse the Romanization of Greece! Yet, no matter how much we try and how much we spit on the legacy of this horrendous Empire our rage is not satiated. It is impossible to state all the crimes of Rome against Hellas, but the worst of them is how much they indoctrinated Greeks into the idea of Roman identity. As time goes by we find more and more radical solutions to the Latin disease but it never seems to be enough, not enough to make our ancestors truly smile upon a purified Greece. \n \n However, for the last few years there has been a growing radical clique in our court, one whose ideas are considered insane by many; they suggest we completely cut ourselves off from Christianity and restore the Hellenic pantheon of old. And after all, wasn't it Rome that wiped out the Hellenic temples and replaced them with churches and cathedrals? \n \n The clique is very insignificant and struggles to gain support with even the most radical anti Roman parts of society, yet a single word from our King could change all that - we could give them the resources and authority to conduct such a reform of Greek faith. It might be extremely destabilizing and costly, but at the end of the day, our redemption from Rome is surely a priceless goal."
 ab_nicaea.7.a: "Do you really consider eternal damnation to be worth all of this?"
 ab_nicaea.7.b: "We will break with the legacy of the Romans!"

