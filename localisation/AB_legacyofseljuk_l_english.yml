# Ideas #
 SEL_ideas: "Seljuk Ideas"
 SEL_ideas_start: "Seljuk Traditions"
 SEL_ideas_bonus: "Seljuk Ambition"
 sel_first: "Zealotry of the Ghazi Arslan"
 sel_first_desc: "In the past, when our empire stretched from Shirvan to the heartlands of Rum, the faith of our empire ebbed and flowed like a winding river. When the Ayyubids grew in strength, our emperors converted to Sunni Islam. When the Persians allied with the court, they would convert to Mazdayasna. If they came from the Beyliks in the west, they would adhere to the Byzantine Church. However, after the loss of the east, Hashim the Pious maintained our sovereignty and converted to Islam in 1304 at the behest of a Sufi mystic. Since then, our state has been extremely dutiful in our mission to Allah, none more so than the Conquer Arslan, who, after his siege and sack of Trebizond, converted the city to the true faith with great haste. Under his guidance, we follow the words of the Prophet and continue our glorious expansion under the protection and grace of God."
 sel_second: "Reconquest of the Empire"
 sel_second_desc: "In the 13th Century, our great empire fell victim to the expansion of the Mongol Empire. The forces of Hulegu swept through Persia and emerged from the Zagros with a might and fury even our strongest forces could not match. We were pushed back into Anatolia and saved thanks to the assistance of the Ayyubid and their mighty cavalry. The Beyliks to the west and east alike broke from our command, claiming the territory for their own like vultures squabbling over a rotting carcass. But now, we shall reclaim what was lost to us. With the Ilkhans broken and our forces growing, the House of Seljuk shall once more be a name feared by all!"
 sel_third: "Expansion of Khans and Caravanserai"
 sel_third_desc: "Our territory lies at a key crossroads in the vast silk road trade network. Through us, goods flow from Asia into the ports of Italy, Andalus, and Egypt; silk, spices, fabrics, weapons, even stories and legends pass through our great Empire. The Caravanserai we place across our territory act as resting spots for merchants in rural areas, with a Khan acting as its counterpart in major cities and towns. As our empire continues to grow, we must ensure that merchants are to be respected and cared for; that they can travel and sell their wares without fear of both banditry and exhaustion."
 sel_fifth: "The Four-Iwan Mosques"
 sel_fifth_desc: "Our empire is home to a fusion of both Persian and Arabic culture, especially after the conversion to Islam in the 14th Century. This can be seen no clearer than in the design of our great mosques and palaces. A four-iwan mosque is a masterwork of both design and utility, with its large pishtaq decorated with geometric symbols and drawings along with a domed ceiling, as well as large halls for lecture and debate about the nature of the world that Allah has granted us. These holy buildings were often attached to madrassas and caravanserai, making them hubs for learning and studying. This architectural style is renowned worldwide, with great scholars and travellers alike praising their beauty."
 sel_fourth: "Patronage of the Sufis"
 sel_fourth_desc: "Our conversion to Islam was mostly initiated by many of the Sufi mystics that inhabited our realm prior to our conquest. The more personal and individual nature of the practice has been appealing to many of our scholars and nobles, and as such when Hashim converted to the faith and adopted the customs of Sunni Islam, the Sufi mystics were instrumental in the spreading of the faith across the diverse realm. They established lodges and communities in major urban centres, from Erzurum to Iconio, furthering our understanding of God and the soul."
 sel_sixth: "Mamluk and Turkmen Armies"
 sel_sixth_desc: "The many slave soldiers within our empire were often either brought from the Steppe or established during our initial invasion in the 11th Century. Highly trained and efficient, these armies are the backbone of our military, able to switch from sedentary sieges to nomadic raiding tactics."
 sel_seventh: "Da‘wah Missions"
 sel_seventh_desc: "While our realm has been converted, our borders are ripe with heathens and heretics. Miaphysites, Syriacs, Orthodox Christians, Zoroastrians, and even Catholics all live both in and outside our territory, posing a threat to the stability of our realm. The Beyliks that joined the Byzantine Church had done so to supplant our own power, and those that follow the Zoroastrian faith still look to Persia as an ally against us. We must increase our missionary activity if we are to maintain peace within our realm, to prevent the splintering of our empire due to false gods and heathen practices."
 SEL2_ideas: "Seljuk Ideas"
 SEL2_ideas_start: "Seljuk Traditions"
 SEL2_ideas_bonus: "Seljuk Ambition"
 sel_sixth2: "Mamluk and Turkmen Armies"
 sel_sixth2_desc: "The many slave soldiers within our empire were often either brought from the Steppe or established during our initial invasion in the 11th Century. Highly trained and efficient, these armies are the backbone of our military, able to switch from sedentary sieges to nomadic raiding tactics."

# Reforms #
 seltributaries: "Establish the Tributary System"
 seltributaries_desc: "Our ancestors in Central Asia and the Far East once subjugated great emperors of China and nations of the steppe alike. As the Seljuk Empire, we collected  tribute from Smyrna to Khorasan in our golden era but lost our influence after our collapse. The Double-Headed Eagle has awoken from its slumber and will collect its tributes back - or else."
 seldiwan: "Modernize the Diwan"
 seldiwan_desc: "Our great empire looked back to the Göktürks and got inspiration from their institution of the Kurultai. Modernizing and expanding it to meet demands, the Diwan was created. Forming the central government, it hosts exclusive topics in the specified assemblies where the Sultan can organize the government, send executive orders and listen to feedback from the populace and the governors. With trusted and skilled bureaucrats holding positions such as the Vizier that acts as a subordinate to the Sultan, the Diwan is the ideal for a pluralist decision-making and governing system. Rally the mushrif, call the Emirs and the first session of Diwan-i Ala shall commence!"
 selkanun: "Issue the Kanun"
 selkanun_desc: "The Kanun, meaning The Law, will be the scripture of our state's bureaucracy and courts. Acting as a central constitution, it will have the final say in every affair considering things such as crime, war, public safety, government policies and other situations. The Turks were once known for their organization in the steppes and we will continue this expansion of the governance."
 selturkmen: "Turkmen Mercenaries"
 selturkmen_desc: "With their amber horses, battle-hardened steel swords, jammed pistols stolen from the enemy and a loyal Baglama to sing and play folk songs, the Turkmens are a group of Turks who settled in Anatolia. They mostly live a semi-nomadic lifestyle and profit off of animal husbandry, banditry and conscription. With their brave hearts and battle experience, they can serve as excellent mercenaries for the Seljuk Empire." 
 seldeli: "Expand the Deli Units"
 seldeli_desc: "The Delis in our army act as costume-wearing, intimidating mascots to scare the weak heathen forces that cross our way. Expanding their position from morale boosting mascots to frontline marching special units will give a boost in confidence to our troops, intimidating the enemy with their unique costumes while marching, chanting spells and war cries."
 selsecularization: "Secularization of the Legal System"
 selsecularization_desc: "We are a great empire that hosts a lot of different religions and cultures. Our core ethnic group, the Turks, are Sunni Muslim but a sizeable portion of our blood brothers also believe in the Christian faith and the Persian god. In bureucracy, the favoritism of Sunni Islam blocks the state from prospering the heathen population even of our own people. By secularizing the legal system, we will solve the religious divide between our subjects while  creating room for further tolerance and recruitment of non-Sunni citizens of the empire. With no religious favoritism and a tolerant society, expansion of our empire into heathen lands will be much easier."
 selappoint: "Create Autonomous Appanages"
 selappoint_desc: "Our empire is ever expanding and to rule an entity this grand and sublime, we need Appanages to rule certain titles to divide management and put less work on the central government and give  the affairs of taxation, conscription and governence to our appanages to further develop our new titles. The appanages will be the descendents of our dynasty which would make them less leaning to revolt. Genghis Khan has ruled Asia with no effort using this system, so we should take inspiration."

# Decisions #
 seljuk_commemorate_arslan_title: "Rename [Root.Capital.GetName] to Arslankent"
 seljuk_commemorate_arslan_desc: "Let us rename our capital city of [Root.Capital.GetName] to Arslankent in memory of Ghazi Arslan's victory over the Romans in the Battle of Manzikert."
 seljuk_great_seljuks_title: "Proclaim the Great Seljuks"
 seljuk_great_seljuks_desc: "Having dethroned the Nizzarids, we have become the sole great power of the Middle East. The time has come to let the world know the greatness of its rightful sovereigns!"
 seljuk_move_constantinople_title: "Make Constantinople the Capital"
 seljuk_move_constantinople_desc: "The glorious city we have recently conquered will make a splendid capital for our nation. Constantinople is the greatest city on earth, and our government would make it so much stronger."

# Events #
 ab_seljuk.1.t: "Identity of the Seljuk Turks"
 ab_seljuk.1.d: "For centuries, the head of the house of Seljuk has taken the title of Ghazi and Sultan. As the defenders of Sunni orthodox Islam, we have ingratiated ourselves with the arab-speaking majority of the Mashriq, Levant, and most recently, the Hejaz and its two holy cities. Our Turkish, though the language of our people, has been a barrier between us and the true believers over whom we rule. Ages have passed since our emergence from the steppe, and now, it is time for us to reconsider our identity. Should we pursue a return to tradition, once again riding into battle on horseback, embracing the wild steppe, or dismount from our steeds and join the Arabs in prayer?"
 ab_seljuk.1.a: "The Arabs are right! Barakallah fi al-Saljiqa!"
 ab_seljuk.1.b: "We can never abdandon our heritage. The Steppe calls! Turan Calls!"
 ab_seljuk.2.t: "The Unification of Turan"
 ab_seljuk.2.d: "The Turkic people have long since been divided. When our ancestors left the steppes of Asia for the various homelands, they found themselves in, they lost that connection with one another, and became separate and weak. Under the leadership of our glorious [Root.Monarch.GetTitle], we have managed to unite our people under a singular banner. No longer are we merely the Seljuk, a state ruled by a dynasty, nay, we are now a nation, a realm ruled for the people, for the state, and for the will of Allah!" 
 ab_seljuk.2.a: "Glory to Turan!"
 ab_seljuk.3.t: "Great Sultan of Hindustan"
 ab_seljuk.3.d: "The Seljuk Dynasty has done what no Sultan, Khan, or Caliph has done before, connecting Anatolia to India in one continuous Muslim realm. This is a day to rejoice! The people of Hindustan will be grateful to us, for we have brought them salvation. Our arms have shown them the light of Allah! In honor of this great achievement, our Sultan $RULERNAME$ has decided to build a grand tomb for himself, right in the heart of Hindustan. This monument to our glory and prestige shall be the envy of the world, and all shall be awed by its magnificence!"
 ab_seljuk.3.a: "Glorious!"
 ab_seljuk.8.t: "Fate of the Patriarchate"
 ab_seljuk.8.d: "My Sultan, with Constantinople in our hands, we must decide the fate of the Christian Patriarch. There are many Christians still in the city, it might be prudent to show some leniency. This time..."
 ab_seljuk.8.a: "Allow the Patriarchate to exist and keep the current Patriarch"
 ab_seljuk.8.b: "Close down the Patriarchate and confiscate its properties"
 ab_seljuk.9.t: "The Great Seljuk Military Reform"
 ab_seljuk.9.d: "The reign of [Root.Monarch.GetName] saw the Seljuk Sultanate reunified after the crushing defeat it had suffered at the hands of the Ilkhans. The military was expanded and reformed to match any potential threat and ensure further expansion. It was also during this period that the Seljuks started to realize the vital importance of a strong navy"
 ab_seljuk.10.t: "Enderun Academy"
 ab_seljuk.10.d: "Enderun Academy was established by [Root.Monarch.GetName] in Constantinople. Promising devsirmes and sons of prominent [Root.GetAdjectiveCap] officials were trained in literature, theology, engineering, mathematics etc. at Enderun, preparing them for government service as civil servants and janissaries. The janissaries became rivals to the landed Timariot sipahi soldiers that made up the bulk of the [Root.GetAdjectiveCap] army, and tensions were inevitable between the two classes"
 ab_seljuk.13.t: "The Fall of Constantinople"
 ab_seljuk.13.d: "Once a glorious city, Constantinople was for ages the pearl of the world, a jewel that any ruler would be desperate to have on their crown. But now it lays dilapidated and aging, a relic of a broken and weak empire. Even the mighty Theodosian Walls, those mighty fortifications which have never been sieged now lay bare and open before our conquest. \n \nAnd yet, we understand the importance of the city, and why the Byzantines fought so hard to protect it. It is placed at the heart of the Bosporus, where trade and people flow from Asia to Europe, and the monuments built still give even the most downtrodden of souls a feeling of awe and wonder. Should we seek to rebuild it, it would be a fantastic location for a new capital. It could be the center from which our Empire expands, where our people live in glory and splendor underneath the light of Allah and the words of the Prophet. We, the mighty Seljuk, could bring about a rebirth to this ancient capital. All we would have to do is take the first step and begin its reconstruction…"
 ab_seljuk.13.a: "We shall consider it"
 ab_seljuk.14.t: "The Seljuk Caliphate"
 ab_seljuk.14.d: "With our dominance over Egypt complete, we now find ourselves as the new powerhouse in the heart of Islam. We hold the most holy of cities in our influence, and our innovations in both thought and practice of Islam has led many across the world to follow in our example. With that in mind, [Root.Monarch.GetName] has decided that we are now worthy of the title of Caliphate. \n \nThe title carries with it a great weight; it is a symbolic title meant to represent our authority over Islam and all those who practice the faith. However, it can be used in more than one way. Claiming the Caliphate can also make us appear to be the protectors and leaders of the Muslim world in both spiritual and secular matters. We can expand and take Muslim land, bringing it under our realm as a part of the Seljuk Caliphate. We can also rush to the defense of any of our neighbors with this title, protecting them against incursions from heretics and heathens. Our only obstacle now is the Umayyads of Iberia, who also claim the title of Caliph for themselves. We shall wipe them out, proving our dominance and securing our legitimacy over all Muslims."
 ab_seljuk.14.a: "We shall follow in the path of the Prophet"
 ab_seljuk.15.t: "The Rûmi Caliphate"
 ab_seljuk.15.d: "With our dominance over Egypt complete, we now find ourselves as the new powerhouse in the heart of Islam. We hold the most holy of cities in our influence, and our innovations in both thought and practice of Islam has led many across the world to follow in our example. With that in mind, [Root.Monarch.GetName] has decided that we are now worthy of the title of Caliphate. \n \nThe title carries with it a great weight; it is a symbolic title meant to represent our authority over Islam and all those who practice the faith. However, it can be used in more than one way. Claiming the Caliphate can also make us appear to be the protectors and leaders of the Muslim world in both spiritual and secular matters. We can expand and take Muslim land, bringing it under our ownership as a part of the Caliphate. We can also rush to the defense of any of our neighbors with this title, protecting them against incursions from heretics and heathens. Our only obstacle now is the Umayyads of Iberia, who also claim the title of Caliph for themselves. We shall wipe them out, proving our dominance and securing our legitimacy over all Muslims."
 ab_seljuk.15.a: "We shall follow in the path of the Prophet"
 ab_seljuk.16.t: "New Head of Ummah"
 ab_seljuk.16.d: "[Root.Monarch.GetName] has claimed the sword and mantle of Muhammad. Not only is this a great position for our Sultan domestically, but it additionally affords him authority over all Muslims outside our borders, giving us greater opportunity to protect those unlucky enough to be ruled over by non-Muslims. The question remains though what religious and spiritual path our Caliphate shall take. The ways of Legalism and Sufism are both present in our government, yet only one of them can be pursued on a governmental level."
 ab_seljuk.16.a: "We must embrace and protect the laws of the Islam."
 ab_seljuk.16.b: "Only through mysticism can we find Allah's mercy."

