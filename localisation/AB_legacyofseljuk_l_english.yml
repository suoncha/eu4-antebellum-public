# Events #
 ab_ottoman.1.t: "Ottoman Coup" 
 ab_ottoman.1.d: "Although the Osman & Sons Trading Company has secured Byzantium the best deals for the right prices over the past 200 years, it would appear that the envy and avarice of the corrupt Angelid dynasty has pushed even their largest benefactors' loyalty to the limit. Caught attempting to extort additional discounts out of Murad and Mehmet, the current owners, the Basileus' court saw fit to double down on bullying the traditional and proudly Ruman family-owned business by ordering the Grand Bazaar's goods to be seized by the state. Additionally, the Byzantine senate forced through a motion which would impose a 78% state tax on all Osman & Sons sales income, on top of levying a 90% market fee against the Ottomans' trading partners abroad. All this has done, however, is alienate many patrons of the Grand Bazaar, while also whipping up the general populace of crumbling Constantinople into a frenzy. In response to growing resentment, the Angelids' most recent blunder, the order to conduct a massacre of the Merchant Quarter of the Golden Horn, was intercepted by some of mercenary captain Skanderbeg's spies, who then spread the information to the public. With riots now cropping up across the last vestiges of Byzantine land, responsibility for the rebellion has been accepted by the president and proprietor of Osman & Sons, Murad, and his son Mehmet, who now seek to transform the Balkan Peninsula into the Grandest Bazaar of them all; a land where prices are lower than freezing temperature, and the bargains are hotter than a Peloponnesian summer." 
 ab_ottoman.1.a: "This must be a Venetian trick!" #spawn rebels 
 ab_ottoman.1.b: "Let's teach Byzantium the Art of the Deal!" #tagswitch to ottomans, war vs byz, ottomans spawn in edirne and gallipoli (they cant secede in byz capital)
 #Rise of the Ottomans - reward of the first mission/conquering Byzantine thrace, it makes Constantinople the capital & upgrades the monument
 ab_ottoman.2.t: "Rise of the Ottomans" 
 ab_ottoman.2.d: "With the ghastly and treasonous Byzantines put out to pasture, it is high time for a new power to fill the vacuum -  one which respects its clients, and provides honest service to all its patrons. To that end, the new Ottoman merchant state shall take up the mantle of leadership, in no small part due to the high trust rating Osman & Sons has held since its inception. Establishing a republican government, lest a sleazy Angelid or some other claimant tries to ooze their way back into politics, it is expected that the new regime will be run by a council of traders and members of the Osmanoglu lineage; much more Romanesque than the abomination known as Late Byzantium, and more competitive to boot. In overcoming their old masters and forging something far greater, the Ottoman Trade Empire has already leapt over one hurdle, but to achieve the ambitions of the Osmanoglu family and their benefactors from the Greek merchant guilds, plenty of work lies ahead of them. "
 ab_ottoman.2.a: "From a city of brick to one of markets." 
 #Skanderbeg - reward of conquering Albania 
 ab_ottoman.3.t: "Skanderbeg" #you can rename the event if you want to 
 ab_ottoman.3.d: "Gjergj Kastrioti, known to most across Eurasia by his mercenary name Skanderbeg, is a figure of near-legend whose martial prowess and tactical genius have been near-unrivaled throughout his lifetime. For many years a loyal employee of Osman & Sons, Skanderbeg acted as the handler for Murad's wayward nephew Orhan Celebi and liason with the Byzantine court. More importantly, however, he was the supreme commander of the Janissary Corps - an elite band of foreign soldiers and mercenaries who acted as the Osmanoglu family's caravan and bodyguards prior to the creation of the Ottoman state. In the aftermath of his employers' overthrow of the Byzantine Empire, Murad allowed Skanderbeg to resign, while also granting the faithful Albanian safe passage to his homeland, which had been ravaged viciously during the Bulgar Wars some years prior. Now that Albania has been liberated from Slavic oppression, a familiar face has appeared at the Ottoman camp in Kruje - none other than the grizzled veteran himself, offering his services once more as thanks. This is an offer none could refuse." 
 ab_ottoman.3.a: "Skanderbeg, reporting for duty!" 
 #Offer Venice to buy Aegean Islands 
 ab_ottoman.4.t: "The Delian Offer"
 ab_ottoman.4.d: "Venice's half-hearted attempt to seize the Byzantine Empire's wealth for themselves very nearly proved fatal back in 1204, with much of their fleet being reduced to smouldering hulks at the bottom of the Sea of Marmara, and nearly all their soldiers killed or sold to Magyar slavers. While their strength has returned over the past couple of centuries, it is not yet sufficient enough to maintain permanent stability so far away from the Adriatic - nor can they expect to be able to seize the rest of the Greek islands and archipelago. To that end, negotiators under the employ of Osman & Sons have worked tirelessly to draft a document which would present the Venetians with a suitable trade for their Aegean possessions. It may also prove wise to remind them that, sometimes, it's better to quit while they're ahead." 
 #Venice receives the offer 
 ab_ottoman.5.t: "An Ottoman Trade Deal"
 ab_ottoman.5.d: "While it's true that Venice lacks the necessary might to establish total hegemony over the former Byzantine territories in the Aegean and beyond, the republic's forces nonetheless have enough soldiers on the payroll to stave off most attacks. The Ottoman merchants, whose delegation met with the Serene Doge to discuss the status of the Aegean, did however note that Venice would prove utterly humiliated should their response to invasion be sluggish enough, as a blitz into the Greek islands would likely overwhelm any Latin garrison present if even slightly undermanned. To that end, they have offered to take the islands off of Venice's hands in exchange for a handsome sum of gold, and favourable trade rights, which would both spare them the humiliation of potentially losing their grip by force in the future, while also bringing forth short-term gains."
 ab_ottoman.5.a: "The Aegean is Ottoman now." #accept 
 ab_ottoman.5.b: "Greece will be Venetian someday!" #reject 
 #Ottomans - Venice declines 
 ab_ottoman.7.t: "An Offer They Could Refuse" 
 ab_ottoman.7.d: "As it turns out, the Venetians were openly offended at having their hegemony contested and criticised all at once. Upon throwing the Ottoman negotiators out of the city, though only after demanding immediate monetary reparations in the form of their coin purses, Venice has permanently closed off any chance for Osman & Sons to open up branches in the city of Saint Mark. This slight against the Osmanoglu family-run business will not be forgiven easily, however, as it's about family for such noble traders. The pressed claim on the Aegean islands is nice too."
 ab_ottoman.7.a: "Then it's war." 
 #Ottomans - Venice accepts 
 ab_ottoman.6.t: "Venice Knows Its Place" 
 ab_ottoman.6.d: "Many had expected the Venetians to take offence at the Ottomans' insinuation that they wouldn't be able to maintain their grip on the Aegean for much longer, but it seems that today cooler heads have prevailed. Following a grand ceremony at each outpost, the Venetian garrisons boarded their ships along with chests of gold, jewels, and spices of all varieties. It certainly proved to be a beneficial deal, and the integrity of Osman & Sons is assuredly desitined for another wave of praise from across the country. Greece is Ottoman clay now, and may it be so for all time."
 ab_ottoman.6.a: "All according to plan..." 
 #Mehmed - you'll be able to make him the ruler once Murad dies 
 ab_ottoman.9.t: "Mehmed Fatih" 
 ab_ottoman.9.d: "With the passing of esteemed Osmanoglu family scion Murad II, the role of leadership has fallen into the lap of his young and ambitious son Mehmed, also the second of his name to assume the mantle of leadership over Osman & Sons Trading Company. Nicknamed “Fatih”, or “the Conqueror”, for the total acquisition of the Komnenid-owned Ostrogothia Company’s financial assets this past summer, Mehmed Fatih is a shining example to all merchants of the new Ottoman state. By taking the helm of this most splendid vessel, the young Turkish trader could propel it to even greater heights. A master of commerce rises to the occasion, and no doubt holds the future in his hands. Conversely, however, the transitional president of Osman & Sons, whose role was solely to oversee the passing of Murad's torch to Mehmet, could make a gambit to retain his position. Permanently." 
 ab_ottoman.9.a: "Assuming direct control." #make Mehmed the ruler 
 ab_ottoman.9.b: "Not today." #keep the current ruler
 ab_ottoman.4.a: "Offer §Y100§! ¤"
 ab_ottoman.4.b: "Offer §Y250§! ¤"
 ab_ottoman.4.c: "Offer §Y500§! ¤"
 ab_ottoman.4.de: "Out of question!"
 ab_ottoman.8.t: "He Bought?"
 ab_ottoman.8.d: "The Osman & Sons Trading Company has made perhaps the most unexpected yet splendid purchases in the history of commerce: complete acquisition of its greatest competition in Europe. As the most eminent trading empire in Novgorod, the Bogdanoff & Bogdanoff Merchant’s Guild was a titan of unmatched proportions for nearly a century, dominating every English scillinga and Hanseatic mark flowing through the Slavic markets. However, for reasons unbeknownst to even the Osmanoglu family’s agents, they were approached with an offer of acquisition by representatives of Bogdanoff & Bogdanoff’s enigmatic co-owners; rarely-seen twins of noble stock. The power dynamic of Eastern Europe has shifted in favour of the House of Osman’s intrepid merchants for the first time in its history, and previously-untapped markets throughout Europe are now opening up through their newly-integrated trade network. As for the Brothers Bogdanoff, who can say? Perhaps they saw the writing on the wall when Ottoman merchants got their own trade quarter in Great Novgorod, or perhaps they merely saw it in their best interests to bestow the financial burden unto others. In any event, the Bogdanoffs' near-prophetic market speculation, and comprehension of global commerce, is sure to create a nigh-invincible trade hegemony, of which they now own a 50% share. All they ask for in exchange is Paris."
 ab_ottoman.8.a: "Dump it?"
 ab_ottoman.10.t: "Suleiman the Magnificent"
 ab_ottoman.10.d: "None in Europe or beyond can be compared to the latest head of Osman & Sons Trading Company, Suleiman Osmanoglu. Gifted at commerce and administration - not to mention well-read and amicable, even under his father’s tenure Suleiman showed great promise. Furthermore, having served in the Imperial bodyguard, the young Ottoman trade magnate garnered enough military training to confidently lead several caravans across Asia himself. A legendary figure amongst Eurasian traders and mercenaries, Suleiman’s character and accomplishments were described by even the greatest of foreign emperors as “magnificent”. Poet, soldier, and trader; it is time for Suleiman the Magnificent to propel his trade empire and fatherland to heights never before achieved. Be he at its helm or on the deck, his impact is sure to be felt for generations."
 ab_ottoman.10.a: "The people think of wealth and power..."
 ab_ottoman.10.b: "...Sovereignty is a worldly strife..."
 ab_ottoman.16.t: "The Watermelon Magnate of Constantinople"
 ab_ottoman.16.d: "In the bustling markets of Constantinople, one merchant stands above the rest - Recep Tayyip Erdogan. He is a master watermelon seller whose watermelons have become the delight of the city’s people. From the docks of Galata to the Grand Bazaar, his melons are known for their unmatched size, taste, and juiciness.\n\nErdogan seeks to expand his trade empire beyond mere fruit-selling. With grand visions of irrigation networks, improved supply chains, and monopolization of Anatolia’s melon markets, he has petitioned for financial backing."
 ab_ottoman.16.a: "A true visionary! Invest in his trade empire"
 ab_ottoman.16.b: "We have more important matters to attend to" 
 ottoman_election_desc: "Elect a member of the Osmanoglu family instead"

