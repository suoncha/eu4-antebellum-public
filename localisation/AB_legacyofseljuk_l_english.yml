# Ideas #
 TKK_ideas: "Artuqid Ideas"
 TKK_ideas_start: "Artuqid Traditions"
 TKK_ideas_bonus: "Artuqid Ambition"
 TKK_first: "Hidirlik Tower"
 TKK_first_desc: "First created by the Romans in the Antiquity period, both the Byzantines and the Seljuks have worked to maintain this great lighthouse in Antalya. We have continued this tradition, expanding not only the tower but various other parts of the city."
 TKK_second: "Last of the Artuqid"
 TKK_second_desc: "The Artuqid dynasty was primarily located in the heart of the Seljuk empire and were at one point one of the most powerful families in the realm. One branch of the dynasty took control of the city of Antalya from the Byzantines in the early 13th Century, and at that point came to convert to the Orthodox faith. In the following century, the Artuqids of Iraq and Anatolia collapsed, being destroyed by raiders and invaders. We are the last of the Artuqid families, and we bear that honour with pride!"
 TKK_third: "Recruit the Greeks"
 TKK_third_desc: "Our realm is filled with Greeks, as those were the ones who remained after our conquest of the region. We do not discriminate against our brothers in faith, and as such they must serve the state by filling our ranks. They shall take up arms against the enemies of the Artuqids alongside their Turkish allies!"
 TKK_fourth: "The Turkish Raiders"
 TKK_fourth_desc: "Desperate times call for desperate measures. We must take to the seas, sailing along the coasts of Anatolia and Greece, plundering and taking whatever we can if we are to survive in these troubled times of empire and conquest."
 TKK_fifth: "Artuqid Engineers"
 TKK_fifth_desc: "Our ancestors were masters at building large spots of worship for both Christians and Muslims alike. Mosques, Churches, trade posts and various other buildings were all designed and constructed by our forefathers. We must continue this tradition as we expand the great works that have been left for us, proving both our connection to the Artuqids that have passed and the glory of our state and realm."
 TKK_sixth: "Crusader Legacy"
 TKK_sixth_desc: "The Second Crusade briefly brought Antalya back under Byzantine control. Our forces eventually took it back, but their legacy remains. Many of our most trusted advisors are descendants of those of Latin or Greek descent that came to settle in our lands after the battles, and we give them protection in exchange for their services to the state."
 TKK_seventh: "Combating Piracy"
 TKK_seventh_desc: "We are to be the only ones profiting off the wealth and plunder of these great cities. Any would-be raider must be taken out swiftly and ruthlessly, and to do that, we need a specialised core of troops that can manage sailing and invading into foreign and often hostile land. These warriors will be some of our finest infantry, and shall stand tall amongst all the rest!"

 ATG_ideas: "Anushteginid Ideas"
 ATG_ideas_start: "Anushteginid Traditions"
 ATG_ideas_bonus: "Anushteginid Ambition"
 atg_first: "Conversion of the Turks"
 atg_first_desc: "The Anushtenigids converted from the ancient traditions to Christianity in the 13th Century. The Anushtenigids were emblematic of the mass conversions of the Turkic peoples living in the periphery of the Byzantine Empire. With the diplomatic and economic ties to the heart of Orthodox Christianity in Constantinople, many Turks converted in both an honest expression of faith as well as a way to gain power and influence in a post-Seljuk Anatolia. Now the Anushtenigids are devout Orthodox Christians and seek to expand the faith by spreading the word of God to as many as possible!"
 atg_second: "Legacy as Warriors"
 atg_second_desc: "Our people were subjects to the Seljuk Empire during their conquest of the near east and Rum. Our tribe was enslaved by the Seljuks, forced to fight their battles. We served on the front lines, as the first to charge into battle, fearlessly fighting against both Romans and Arab alike. Now when we fight, however, we do so not for the Sultan or the Seljuks, we fight for our own realm, for our own faith!"
 atg_third: "Heirs of Joannina"
 atg_third_desc: "In the year 1289, shortly after our conversion to Orthodox Christianity, our rulers sought to confirm this conversion by gaining an alliance with the Byzantines. This was granted and solidified by the marriage of an Anushtenigid prince to a Byzantine princess by the name of Joannina. This marriage brought our empires closer together, and permanently established our connection with the Empires of Europe."
 atg_fourth: "Under the Cover of Night…"
 atg_fourth_desc: "When we first rebelled against the Seljuks in the 14th Century, the utmost secrecy was needed. In that period, we only controlled the city of Menteshe and little beyond its walls, and as such, we needed to remove all influence that the Seljuks had over the region if our rebellion was to be successful. We removed officials, bribed generals, and swayed lords to our side in order to ensure our rise to power. We have done it before, and we will do it again if it means the protection and continuation of our realm."
 atg_fifth: "Turkic Orthodox Tradition"
 atg_fifth_desc: "Anatolia used to be the heart of Christendom for the Roman Empire, the site of conversions and developments in Christian thought and practice. The Bishopric of Isparta had existed since Antiquity, and while the institution was destroyed in the initial invasions by the Seljuks, we shall rebuild the Christian tradition in Anatolia ourselves, through faith and works!"
 atg_sixth: "Walls of Menteshe"
 atg_sixth_desc: "The walls of Menteshe are our best systems of defence. Guards patrolling the parapets at every possible moment, aqueducts to bring in fresh water, and stone packed so tightly it would take canons the size of houses to break through. The countryside might surrender, and our men might die, but our city shall not fall."
 atg_seventh: "Reclamation of Rum"
 atg_seventh_desc: "The western half of Anatolia is in disarray; Beyliks fight amongst each other, the Romans are fractured and splintered, and there is little keeping the Seljuks from returning to conquer their old provinces. We must stand against the oncoming threat, and all threats that would follow. The Nizzarids, the Persians, and even the Byzantines. We must unite the provinces of Rum under our banner and stand firm against the oncoming storm!"

 ZNG_ideas: "Zangid Ideas"
 ZNG_ideas_start: "Zangid Traditions"
 ZNG_ideas_bonus: "Zangid Ambition"
 zng_first: "Christian Diplomats"
 zng_first_desc: "When dealing in the intricate matters of trade and diplomacy, finding common interests between you and your partners is key. That was what initially brought the Zangid merchants towards Christianity, the promise of wealth and protection from the Byzantine Empire. We established a strong diplomatic corps in the heart of Ankara, where diplomats are trained to recite psalms and passages from the Bible in order to win over the sceptical Europeans, who still think of us as the heathen invaders from the east."
 zng_second: "Riders of Ladik"
 zng_second_desc: "In the early campaigns of the Seljuks, our forefathers took this land on horseback. Their hooves clamoured and thundered as they blazed a trail into Ladik, slaughtering all defences along the way. We carry that tradition with us, and now our primary fighting force resides within our cavalry, utilising both Greek and Turkish armour and weapons to better protect our land."
 zng_third: "Law of Konstantin"
 zng_third_desc: "When Konstantin was elected by the governing council to lead the Zangid republic, he did so with the support of Sunni merchants who funded his campaign and bribed opponents to drop out of the race. Konstantin knew that tensions between the Orthodox Christian populace and the Sunni traders that would often visit his land were getting worse, and so, he enacted special protections and guarantees for the Muslims in the Zangid realm. Instead of persecuting them, they would be protected and safeguarded by the state in civil and judicial matters, which eventually spread to not just Muslims, but Zoroastrians and Greeks and various other faiths and cultures. While Konstantin liked to pretend this came from his own humanist desires, in reality it was simply good business. Establishing protections for merchants of foreign heritages drew more merchants into Zangid, increasing the wealth and prosperity of the realm."
 zng_fourth: "The Zangid Republic"
 zng_fourth_desc: "The Zangid Republic was founded in the 13th Century by a powerful merchant guild. The internal squabbling of the various tribal leaders led to destruction and chaos around the city of Ankara, and in that time of upheaval, the merchant guilds took control of the apparatus of State, as they were the only ones with the wealth to control the military. Initially, the guilds were filled with different families and tribes, but the Zangid family took control over time. They began appointing new electors and leaders that were loyal to the Zangids and the Zangids alone, effectively monopolising the elections of presidents, creating an oligarchy run by this family."
 zng_fifth: "The Merchant Guilds of Ankara"
 zng_fifth_desc: "Ankara is the heart of our republic, and the home to thousands of craftsmen and merchants alike. Their guilds and fraternities populate the ancient city’s buildings, and their connections interlink the east and west. Many would see being trapped between two rivalling empires as a negative, but to us it is simply another opportunity to expand our markets and service new customers."
 zng_sixth: "Zangid Trading Policy"
 zng_sixth_desc: "The world is changing; with the collapse of the Mongol Empire and the deterioration of the Silk Road trade, many empires are looking for new ways to gain goods from across the world. From the Venetian merchants to the Ottoman family of Constantinople, all seek ways to penetrate the trade of the east. This is where we shall find our niche; by dominating important centres of trade and expanding their infrastructure, we can create a new system by which trade shall pass from the east to the west untouched and intact, making us the dominant merchants of this new era."
 zng_seventh: "Greek and Turkish Education"
 zng_seventh_desc: "The heirs to the Zangid political dynasty are put through a gruelling education starting at a young age. During their many years of schooling, they read from both Byzantine and Seljuk texts, learning of the old and the new. This makes our presidents wise and cultured, masters of the classical works of antiquity and the modern wisdoms from Baghdad and Cairo."

 RUMC_ideas: "Rûmi Ideas"
 RUMC_ideas_start: "Rûmi Traditions"
 RUMC_ideas_bonus: "Rûmi Ambition"
 rumc_first: "Warriors of Rûm"
 rumc_first_desc: "The Empire of Rûm. Founded through the conquest of all other Beyliks and the toppling of the ageing Seljuks. Our soldiers, ferocious in battle, mercilessly flanking and crushing all those who might stand in our way. But even if we have united Anatolia under our realm, many threats still abound in this world. The lands of Persia and Egypt stand against us still, and it is up to our brave soldiers to conquer and subjugate these lands in the name of the emperor!"
 rumc_second: "Expansion of the Ahi Guilds"
 rumc_second_desc: "The heart of the Rûm economy comes from our large metropoles. With hundreds of thousands of people in each city, the merchant guilds can recruit and found large organisations to produce textiles, weaponry, and various other goods and services for the empire. We must take a proactive role in the expansion of not only the urbanisation of our Empire but also the growth of guilds and fraternities that can support our state."
 rumc_third: "A Unified Anatolia"
 rumc_third_desc: "Despite our ardent fervour for Christianity and the one true path to god, we shall not persecute those of different faiths. The heartlands of Anatolia are awash with different faiths and sects, and any attempts at mass conversion would be fruitless if not suicidal. We shall instead work to integrate and grant tolerance to these heathens, showing them leniency should they remain loyal subjects of the emperor."
 rumc_fourth: "Riders of Manzikert"
 rumc_fourth_desc: "During the Battle of Manzikert, our heavy cavalry utilised the steppe tactics of a retreating offence to break and encircle Byzantine forces, and eventually win us the fight and begin our incursion into Anatolia. Ever since that day, all Turkic armies have had a massive amount of cavalry in them, and with recent innovations to firearms and battle tactics, we have improved our cavalry to be some of the best in the world. From Europe to Asia, all shall know the might of the Rûmi cavalry!"
 rumc_fifth: "Persian and Greek Influences"
 rumc_fifth_desc: "Our culture takes heavy influence from a variety of traditions and peoples. The Turkish language changed drastically when our people were subjects to the Sassanians, with the Persianate culture of our forefathers lingering to this day. And yet, since our conversion to Christianity, we also have begun to incorporate aspects of the Greek and Roman tradition into our daily lives. We do not persecute foreign cultures in our empire, instead, we support them and foster their growth. This makes for a rich and developing tradition that incorporates the different people within our realm."
 rumc_sixth: "The Rûmi Patriarch"
 rumc_sixth_desc: "We have established our Patriarch in our most holy of cities. We shall turn to them for guidance and support, as many in our realm still do not know the holiest truth of the world. As our empire grows, we shall reclaim the holy cities of Antioch and Alexandria, and we shall establish the Patriarchs there too. Christendom shall return to Asia, and we shall be its stewards!"
 rumc_seventh: "Consolidate the Caravanserai System"
 rumc_seventh_desc: "The trade links of Anatolia have been in disarray since the collapse of the Seljuk empire at the hands of the Mongols. Bandits attack caravans as they travel across the highlands, and cities are inconsistent with their support of these merchants. In this new age of global trade, stability and opportunity are key. We must re-establish our connections with eastern trade, and each province of our empire must have lodgings and services for these merchants."
 RUMC2_ideas: "Rûmi Ideas"
 RUMC2_ideas_start: "Rûmi Traditions"
 RUMC2_ideas_bonus: "Rûmi Ambition"
 rumc2_sixth: "The Rûmi Patriarch"
 rumc2_sixth_desc: "We have established our Patriarch in our most holy of cities. We shall turn to them for guidance and support, as many in our realm still do not know the holiest truth of the world. As our empire grows, we shall reclaim the holy cities of Antioch and Alexandria, and we shall establish the Patriarchs there too. Christendom shall return to Asia, and we shall be its stewards!"

# Government Names #
 BASILEYYUS: "Basileyyus"
 BASILYEN: "Basilyen"
 IMPARATOR: "Imparator"
 IMPARATORICE: "Imparatorice"
 DUK: "Dük"
 DUSES: "Düses"

# Reforms #
 zangid_republic: "Zangid Republic"
 zangid_republic_desc: "The Zangid Republic is centered around the Zangid family, who have internal elections to decide who will rule their state. While there are many guilds within the state that can inform and sway members of the family, the Zangids still hold supreme power within the land, and dominate the elections every four years."
 zangid_republic_election_desc: "Elect a member of the Zangid family instead"
 zangid_virtues: "Rhomanoi Eduction"
 zangid_virtues_desc: "The Byzantine Empire, even in its weakened and broken state, is still a major hub of knowledge and information. Our sons and daughters are all taught Greek, and the understanding of the classical philosophies are tested again and again. As such, our rulers come close to what Plato described as the Philosopher Kings, in that they hold with them the humanist values of ethics and morality as well as knowledge of the natural world."
 zangid_power: "Power to the Fraternities"
 zangid_power_desc: "While the Zangids hold closed elections for the presidency, the merchant guilds have their own assembly of representatives that hold some sway as well. They have the ability to reject laws and decrees put forth by the President, if they can work towards an agreement with one another."
 christian_rum: "Kingdom of Rûm"
 christian_rum_desc: "After the liberation of Anatolia from the heathens and illegitimate successor states, our ruler has crowned himself Otokrat of Rûm, the true successor to the ancient Roman Empire. States are divided into Themats ruled by soldiers and generals who have earned the land in battle. With more influence from the Byzantine and Greek culture, the once Turkish aristocracy has slowly adopted Greek traditions and mannerisms."

# Missions #
 rum_christian_aden_title: "Secure Aden"
 rum_christian_aden_desc: "Aden is a powerhouse of wealth in Arabic peninsula. We need to claim it for ourselves if we wish to divert the trade to the direction of Konstantiniyye."
 rum_christian_anatolia_title: "Secure Anatolia"
 rum_christian_anatolia_desc: "Anatolia must be secured under our grasp, lest the dangerous Nicenes, heathenous Seljuks or Beylik lice takes it and ushers in an age of darkness for all of Anatolia."
 rum_christian_armenia_title: "Liberate Armenia"
 rum_christian_armenia_desc: "The Armenians are our brothers in faith, even if of different intepration of faith. They have suffered for far too long under the Seljuk, Zoroastrian and Mongol yokes. They need to be liberated and placed under fellow Christian rule. No harm shall fall upon our beloved Armenians."
 rum_christian_balance_title: "Balance of Power"
 rum_christian_balance_desc: "Anatolia has no absolute ruler. The mightiest nations of both Islamic and Orthodox presence in Anatolia are unable to wrangle it to submission. There is a fragile balance of power... One we must tip in our own favour through alliances with fellow Christian realms."
 rum_christian_balkans_title: "Control the Balkans"
 rum_christian_balkans_desc: "Balkans are a treacherous and dangerous land, but are a suitable barrier and a natural border against foes. Much like the empire before us we must expand to Balkans and turn it into our safest border."
 rum_christian_beyliks_title: "Defeat the Beyliks"
 rum_christian_beyliks_desc: "The beyliks are tragic foe of ours. They are our brethren, yet they are misguided. We need to put them out of their misery if we are to usher in a Turkish chapter in the history of Anatolia."
 rum_christian_bridging_title: "All Roads lead to Rûm"
 rum_christian_bridging_desc: "We need to build more roads throughout Rûm. All reaches of Anatolia shall be connected with easy to travel roads and allow each of our subjects an access to the capital of Rûm. There is, after all, an ancient saying about the importance of roads: All Roads lead to Rûm."
 rum_christian_bulgaria_title: "Dismantle Bulgaria"
 rum_christian_bulgaria_desc: "Bulgaria is our Orthodox brother, but also an aggressive threat to our existance for they covet after Konstantiniyye and subjugation of Greco-Romans. As the new owners of Konstantiniyye it is our duty to fight against the forces of Evil and subjugate the Bulgarians while liberating the Greco-Romans under our regime."
 rum_christian_capital_title: "Expand [Root.Capital.GetCapitalName]"
 rum_christian_capital_desc: "The Capital is the beating heart and center of our nation, but it is not splendorous. We need to epand the city's borders and increase the urbaniation within its walls. This must be done if we wish to turn it into a fitting sprawling city of our growing nation."
 rum_christian_churches_title: "Turn Mosques into Churches"
 rum_christian_churches_desc: "So many beautiful Mosques have been built in Anatolia and so many of them used to be churches before they were repurposed as Mosques. As it the tradition of Turks we ought to repurpose the places of worship oncemore. Former churches shall be made into churches again."
 rum_christian_cities_title: "Cities of Anatolia"
 rum_christian_cities_desc: "Anatolia has slowly been stagnating in the four hundred years of conflict it has had where it was never fully controlled by one power. With our position as the sole overlords of Anatolia it is time for Anatolia to move on. Let us encourage urbanization and population growth throughout the Anatolian highlands."
 rum_christian_city_title: "City of the World's Desire"
 rum_christian_city_desc: "In the last century of our existance we have risen as a dominant power in Anatolia. We have united it under the Cross of Christ and pushed out both rebellious Niceneans and heathenous Seljuks. We have brought salvation and proven ourselves as Christians...\n\n... And yet there are rumors. Sneering stares and whispers about how Europeans do not perceive us as equals, despite both of us being christians. Some would say they do not believe we are capable of being true Christians simply by existing outside of the borders of Europe. We need to prove them wrong, which requires placing ourselves upon a warpath - a warpath of legitimization.\n\nWith great tears we need to bid Rome its farewell, for they stand in the path of us becoming equal to our Christian brethren. Konstantiniyye will be Turkish and Christian."
 rum_christian_convert_title: "Convert Our Brethren"
 rum_christian_convert_desc: "Our Brethren are not Christian. They are Muslims or worse Zoroastrians. This won't be an easy problem to solve and we need to waste large sums of our material wealth if we are to ensure spiritual salvation for all of Anatolia."
 rum_christian_crimea_title: "Control Crimea"
 rum_christian_crimea_desc: "Crimea is a beautiful peninsula - both due to its natural beauty and its economic power tied to its geography. We need to claim it for our selves so we may better wrestle the Black Sea trade to our control."
 rum_christian_defender_title: "Defender of the Faith"
 rum_christian_defender_desc: "The Christians of Europe know only of Seljuk Turks - of Muslim Turks. If we are to prove ourselves as Christians that have no association with our heathenous brethren we need to become the defender of Orthodox faith and fulfill the duties of such role. We need legitimacy in the eyes of our peers."
 rum_christian_egypt_title: "Triumph for Egypt"
 rum_christian_egypt_desc: "For too long Nizzarids have reigned over Egypt and Levant. For too long have Christians been deprived of Christian rule. It is our duty to be the first rulers of Egypt to be of Christian origins since the times of Roman Egypt. The breadbasket of Mediterranean shall be ours."
 rum_christian_germans_title: "Encroach on the Germans"
 rum_christian_germans_desc: "Balkans is a ravaged land - a land of worthless gain - and yet we must march on upon this dead end road.\n\nThe Violent German Entity exists to the north of us, claiming itself to be a 'Holy Roman Empire' and descendant of Rome while dismissing the legitimacy of the late East Rome. This cannot do. We need to march on and border the Germans so we may be one step closer to legitimization: Legitimization of both East Rome as Rome and of Kingdom of Rûm as a peer to its christian brothers."
 rum_christian_greece_title: "Develop Greece"
 rum_christian_greece_desc: "Greece has fallen into poor times, with it being unable to growing back to what it once was in terms of splendor. This is especially true ever since Bulgaria conquered half of Greece. Let us gift the Greco-Romans with a piece of our mercy and love."
 rum_christian_hre_title: "Holy 'Roman' Resolution"
 rum_christian_hre_desc: "Holy Roman Empire is a forgery. It is a deception that needs to be rid of.\n\nHowever, there are members in our court that are suggesting a less hostile action. Perhaps we could try gaining the crown of Holy Roman Emperor for ourselves. It is, after all, the most powerful position in Europe second only to Papacy's seat of power. This power could allow us to enforce our legitimacy as peers and successors to Rome.\n\nWe stand at a crossroads: Shall we destroy the false empire and leave us standing as the last vestige of Roman heritage or try claim it for ourselves and embrace its power?"
 rum_christian_kaiser_title: "Kayser-i Rum"
 rum_christian_kaiser_desc: "As we put the final nail to the coffin of Rome it is our duty to ensure its death will not be in vain. Konstantiniyye is but the first of our many conquests that lie ahead of us. It shall serve as our capital and we shall usher in camaraderie between the Greco-Romans and Turks unlike anything seen before. Eastern Roman Empire was on its way out, and Kingdom of Rûm has risen to take its position as the new Orthodox powerhouse. We will prove ourselves as equals to our Christian brethren."
 rum_christian_landfall_title: "Landfall in Italy"
 rum_christian_landfall_desc: "Southern Italy is under a solid Muslim rule. This cannot remain as a fact. We need to change this fact and make Southern Italy into a territory of Christian faith once more."
 rum_christian_legacy_title: "Legacy of Seljuk"
 rum_christian_legacy_desc: "The Powerhouse that is Seljuks are a danger to Christendom in Anatolia. We need to push out the turqeoise shade from the mountains if we are to prosper on the path we have chosen."
 rum_christian_levant_title: "Levantine Liberation"
 rum_christian_levant_desc: "Our blood shall be spilt for it is but a small price to pay for liberation of Levant from darkness. The blood of Rûm shall be the fuel to make Levant Christian once more."
 rum_christian_mesopotamia_title: "The Cradle of Civilization"
 rum_christian_mesopotamia_desc: "The Cradle of Civilization never had the strongest Christian influence, but it once boasted a sizable nestorian majority. Those days are gone as most that live in the region are now muslims. Despite the problems that will come from managing over a territory of different religion we need to conquer it for ourselves. It shall serve as a fine source of food and wealth due to its lush rivers and farmlands."
 rum_christian_metropolitans_title: "Consecrate Metropolitans"
 rum_christian_metropolitans_desc: "To ensure the sanctity of our Churches we need to secure specific plots of lands as Metropolitan areas."
 rum_christian_nicaea_title: "Conquer Nicaea"
 rum_christian_nicaea_desc: "Nicaea is a rebelling state that broke free from Byzantium. It is a highly dangerous and unpredictable warriorstate we need to make sure to die in a predictable fashion - in a fashion beneficiary for our cause."
 rum_christian_ottomans_title: "Appease the Ottomans"
 rum_christian_ottomans_desc: "Osmanoglus are a honorable merchant family and a powerful institute in Constantinople. If we are to further cement our power we need to ally with the strongest of all institutions in all of Eastern Europe: Osmans & Sons Co."
 rum_christian_patriarchates_title: "Eastern Patriarchates"
 rum_christian_patriarchates_desc: "The Patriarchal Cities have fallen into disrepair under Muslim control. Not in the literal sense, no, but rather in symbolical sense as the Christian institutions have withered and slowly been drained in the last millennia of being deprived from Christian rule. We need to replenish the faith of the people and give food to their Christian souls. Let us refurnish Antioch, Jerusalem and Alexandria back to their lost splendor."
 rum_christian_pentarchy_title: "Restore the Pentarchy"
 rum_christian_pentarchy_desc: "For far too long the five cities of Christendom have been divided. They must be brought back together so that Christianity may be once more united. The Pentarchy is coming back - back home to Orthodox faith."
 rum_christian_sophia_title: "Renovate Ayasofya"
 rum_christian_sophia_desc: "The holiest of Orthodox sites still in Orthodox hands has fallen into disrepair. If we are going to prove our pious fervour to Orthodox faith we must renovate Ayasofya. Let our renovation turn Ayasofya into a place of worship far more splendorous than what it once was in the times of Justinian."
 rum_christian_state_title: "The Church and the State"
 rum_christian_state_desc: "The Church needs to be integrated as an integral part of the State. We need to ensure the spiritual and religious salvation of all of Anatolia, and for that we need the support of all of Clergy."

