# Ideas #
 BYZ2_ideas: "Byzantine Ideas"
 BYZ2_ideas_start: "Byzantine Traditions"
 BYZ2_ideas_bonus: "Byzantine Ambition"
 byz_state_admin_reform2: "Start Administrative Reform"
 byz_state_admin_reform2_desc: "Our administrative system is a relic of a bygone age. We need to overhaul it and make it ready for this new modern age. We need to start with taxation, replacing the current system with paid government employees promoted on merit, will yield us more money while not actually taxing the peasants any harder."
 byz_one: "Reinstitution of the Pronoia"
 byz_one_desc: "As the Empire continued to lose more land and revenue, the Pronoia system that once helped form the backbone of our army fell into unsustainability. However, with our borders resurgent, we can finally reinstitute the practice of small-scale, taxable land grants. This will grant our army a pool of professional – and more importantly, reliable – self-equipped units to draw from."
 byz_fifth: "Justinian's Ambition"
 byz_fifth_desc: "We are the only true successor to the Roman Empire, not the Franks, not the Germans. With our Empire rising from the ruins like a phoenix, we walk a path towards glorious destiny, the new Roman Empire!"

# Estates #
 estate_burghers_ottoman_loans: "Indebted to the Osmans' Company"
 estate_burghers_ottoman_loans_desc: "The Ottomans are willing to offer loans without interest to the Empire in return for greater political influence. However, this would drain funding away from their company and cause a slowdown in the economy."
 estate_burghers_indebted_to_ottomans: "Take §Y5§! five-year loans at §G0%§! interest. The privilege will be removed automatically when repaid."
 AB_BYZ_buff_burgher_loans: "The '§YIndebted to the [Root.GetBurghersName]§!' and '§YIndebted to the Osmans' Company§!' [Root.GetBurghersName] Estate Privileges now grant §G7§! Loans instead of 5."
 AB_BYZ_buff_burgher_loans_no_mercantilism_loss: "The '§YIndebted to the [Root.GetBurghersName]§!' and '§YIndebted to the Osmans' Company§!' [Root.GetBurghersName] Estate Privileges will no longer take §YMercantilism§!."

# Reforms #
 imperial_autocracy: "Imperial Autocracy"
 imperial_autocracy_desc: "Since the times of ancient Rome, the Emperor of the Romans stood as the undisputed Autocrat and absolute ruler of his country. This tradition persisted to this day and the Byzantine Empire is almost solely ruled by the single person who listens to no one but a few of his most trusted advisors."
 varangian_guard: "Varangian Guard"
 varangian_guard_desc: "Let us re-establish the mighty Varangian Guard - a personal bodyguard unit of the Emperor himself. This elite force, lacking any political loyalties except the loyalty to the Basileus can be always counted upon, unlike our treacherous nobility."
 mechanic_unlocks_varangian_guard_yes: "§GUnlocks§! the §YVarangian Guard§! mercenary company which costs §G0.0%§! Army Professionalism to recruit."
 roman_bureaucracy: "Roman Bureaucracy"
 roman_bureaucracy_desc: "Rome, in its more than two thousands years of history, developed an intricate bureaucracy to rule its expanded territories. As it went from a small city state on the Tiber river to having to govern an empire spanning Europe, West Asia and North Africa, it had adapt and innovate in order to maintain control of its empire."
 byztheme: "The Theme System"
 byzhellenization: "Re-Hellenization of the East"
 byztagmata: "Tagmata Armies"
 byzthemata: "Themata Armies"
 byzconstitution: "Imperial Constitution"
 byzabsolutism: "Roman Absolutism"
 byzabsolutism_desc: "The Emperor and Autocrat of the Romans is the final authority on all matters in our land. The rise of the so called 'national monarchs' throughout Europe has seemed little more than a too-late consolidation of feudal chaos to the eternal and absolute Romans."
 byztheme_desc: "The Theme system is the organizational structure of the Roman Empire, in which the realm is divided into provinces called Themes - each led by a Strategos, a military and political official who is tasked with adjudicating disputes, managing the theme's economy, and most importantly, conscripting troops into the Imperial Army."
 byzhellenization_desc: "The lands of Egypt and the Levant have fallen to the cultural and religious influence of arab-muslim powers since their conquest centuries ago. With these lands coming back into the fold, it follows that we should re-settle the cities of this region with Greeks."
 byztagmata_desc: "The Tagmata armies are the personal troops of the Emperor. These elite troops are conscripted from around the empire and often fight alongside foreign auxillaries like the Varangians, Catalans, or Heruli."
 byzthemata_desc: "The Themata armies are commanded by the Strategoi and conscripted from the Themes. These troops almost entirely consist of native Greeks from the countryside, and are larger and cheaper than the Tagmata."
 byzconstitution_desc: "The Empire, despite its absolute rule by the Basileius, runs on paper. The laws of the Romans have been codified over the centuries in scattered legal books, but now it is time to compile the most important of these laws into a constitution."
 byzsenate: "Delegate to the Synkletos"
 byzsenate_desc: "Historically, the Synkletos, the senate of our proud empire, had a myriad of functions and powers. It passed resolutions which the Emperor could adopt and issue as he pleased, suggested Imperial legislation and has even acted as a consultative body and judicial court. In recent centuries, this proud arm of our mighty government has been eroded and reduced to dust, but if we were to reintroduce it with our restored strength, embraced modernity and resurgent capacities, it could hail a new era of Imperial efficiency and civil fairness."
 ability_byzantine_decadence_mechanic: "Decadence"
 byzantine_decadence: "Decadence"
 byzantine_decadence_desc: "The Roman Empire is but a mere shell of its former self, a shadow of the glorious state that once stretched across the Mediterranean. While there is no one single cause for the collapse of the Empire, there is one family that keeps pushing the empire closer and closer towards total destruction, albeit unintentionally. The Angelos dynasty, which has been ruling over Byzantium since the 12th Century, have showcased the military incompetence, corruption, overspending, and a complete disregard for state maintenance that the Byzantine Empire has come to be known for. If Byzantium is to survive the centuries to come, they must rebuild their broken state, reform their military, and prevent further incursions from rivals, lest they fall just as the west did.\n\nYou can lower your §YDecadence§! level by completing mission in the §YAngelid Crisis§! mission tree branch.\n"
 BYZ_25_DECADENCE: "Gain §G-25.0§! Decadence."

# Decisions #
 rename_eastrome_title: "Rename the Country to East Rome"
 rename_eastrome_desc: "This is a cosmetic decision allowing us to rename our country."
 italy_greek_title: "Settle the Southern Italy with Greeks"
 italy_greek_desc: "Centuries ago, Greeks have colonised the coastline of southern Italy. Following the fall of West Rome, most of them were absorbed into newly established Gothic kingdoms and last of them disappeared following the Muslim invasion of Italy. With these provinces now under our control, we can re-settle southern Italy with Greek population."
 BYZ_UNLOCK_SETTLE_ITALY: "§GUnlocks§! the '§YSettle the Southern Italy with Greeks§!' decision." 
 restore_roman_empire_byz_title: "Restore the Roman Empire"
 restore_roman_empire_byz_desc: "Not since the Romans in the second century has one empire commanded the entirety of the Mediterranean and beyond. If we claim this land, we can scoff at whatever pretenders may claim in Constantinople or the Holy Roman Empire and proclaim ourselves the true successors of Rome."
 BYZ_RESTORED_JUSTINIAN: "Restored Justinian border"
 ROME_CATHOLIC_RESTORED_BORDER: "Restored Roman border"

# Events #
 ab_byzantium.1.t: "Rediscovery of the Classical Works"
 ab_byzantium.1.d: "Having suffered defeats on all fronts, the weakened Byzantine Empire has entered a dark age. During these difficult times, many scholars have begun to explore classical Roman and Greek societies at the peak of their power and influence, reviving many of the forgotten ideas and philosophies. This cultural rebirth has quickly spread across the empire and is gaining more and more recognition amongst the ranks of philosophers, artists and architects. This movement might reshape the empire to better fit the classical ideas, or cause unrest sparked by its opponents, weakening the declining empire even more."
 ab_byzantium.1.a: "Interesting"
 ab_byzantium.2.t: "Church Rejects the Classical Philoshopy"
 ab_byzantium.2.d: "Representatives of the church have visited the imperial court, seeking to speak with the Emperor on behalf of the Patriarch of Constantinople. They have expressed their concerns regarding the new cultural movememnt that is spreading across the empire like a plague. They reminded the emperor that the church and the empire are an inseparable whole, and our support of the movement or our indifference towards it is threatening the position of the Orthodox church, as many of the classical ideas strongly oppose the teachings of the Christian faith."
 ab_byzantium.2.a: "They are right"
 ab_byzantium.2.b: "The church should not meddle in state affairs"
 ab_byzantium_renaissance_away: "The §YRenaissance§! will spawn in §YItaly§!."
 ab_byzantium_renaissance_home: "The §YRenaissance§! will spawn in §Y[151.GetName]§!."
 ab_byzantium.4.t: "The Osman & Sons Trading Company"
 ab_byzantium.4.d: "A Turkish merchant dynasty claiming descent from a little-known Bey by the name of Osman, the Osmanoglu family are nothing short of celebrities to the Greek people of the Near East. Their greatest accomplishment after Osman’s exile into the Byzantine Empire was their creation of the wealthiest and most respected merchant guild in the Balkans and Near East: the Osman & Sons Trading Company. This colossal trade empire has brought in enough wealth and favours over the years to have thus far ensured the Byzantines’ survival, despite the ailing realm’s overwhelmingly sorry state. Headquartered in great Constantinople, Osman & Sons is the primary benefactor of numerous spectacles - such as the esteemed Hippodrome races and ship races in the Bosporus Strait - as well as sole proprietor and founder of the world-renowned Ottoman Grand Bazaar. Headed since the age of 16 by the esteemed Murad Osmanoglu, the second of his name to preside over such a prestigious organisation, the affectionately-dubbed “Sultan of Rum” is preparing his favourite son Mehmed for the future role of leadership. Under Murad and his descendants, Osman & Sons will surely flourish well into the future, as it has for many generations prior."
 ab_byzantium.4.a: "Long live the “Sultan of Rum”!"
 ab_byzantium.5.t: "The Reign of Mehmed Fatih"
 ab_byzantium.5.d: "With the passing of esteemed Osmanoglu family scion Murad II, the role of leadership has fallen into the lap of his young and ambitious son Mehmed, also the second of his name to assume the mantle of leadership over Osman & Sons Trading Company. Nicknamed “Fatih”, or “the Conqueror”, for the total acquisition of the Theodoran Ostrogothia Company’s assets this past summer, Mehmed Fatih is a shining example to all merchants of the Byzantine Empire. By taking the helm of this most splendid vessel, the young Turkish trader has earnt himself the Imperial Court’s favour, and has been offered a seat on the Basileus-Autokrator’s council; a great honour which was first held by his father. A master of commerce rises to the occasion, and no doubt holds the future in his hands."
 ab_byzantium.5.a: "Assuming Direct Control"
 ab_byzantium.6.t: "The “Janissaries”"
 ab_byzantium.6.d: "The Osman & Sons Trading Company has as many enemies as they do friends, both within the cities and along the vast trade routes their caravans dominate. In order to deter attacks against their merchants and assets, the Osmanoglu family under Murad I, its head in the mid-late 14th Century AD, had established a private security group which would be loyal solely to the Family. Nicknamed the “Janissary Corps” due to the sourcing of young recruits from across the Balkans and Near East, this elite force of eager and able-bodied warriors is strong enough to take on any hostile actions against their paymasters in Constantinople. Legendary Albanian mercenary captain and Bulgar War veteran Gjergj “Skanderbeg” Kastrioti, nicknamed thusly for his Alexanderesque martial genius, presently holds command over the force, and is himself no stranger in the Imperial Court. When not presiding over Janissary operations, Skanderbeg is often contracted as either a field commander by the Byzantine Imperial Army, or advisor to military high command. Such a larger-than-life character only appears once, and so Osman & Sons sees fit to utilise his skills as much as possible."
 ab_byzantium.6.a: "All will crumble before him!"
 ab_byzantium.6.b: "Let his advice preserve us"
 ab_byzantium.7.t: "The Magnificent"
 ab_byzantium.7.d: "None in Constantinople or beyond can be compared to the latest head of Osman & Sons Trading Company, Suleiman Osmanoglu. Gifted at commerce and administration - not to mention well-read and amicable, even under his father’s tenure Suleiman showed great promise. Furthermore, having served in the Imperial bodyguard, the young Ottoman trade magnate garnered enough military training to confidently lead several caravans across Asia himself. A legendary figure amongst Eurasian traders and mercenaries, Suleiman’s character and accomplishments were described by even the Basileus-Autokrator as “magnificent”. Poet, soldier, and trader; it is time for Suleiman the Magnificent to propel his trade empire and fatherland to heights never before achieved."
 ab_byzantium.7.a: "The people think of wealth and power..."
 ab_byzantium.7.b: "Sovereignty is a worldly strife..."
 ab_byzantium.8.t: "Dump It?"
 ab_byzantium.8.d: "The Osman & Sons Trading Company has made perhaps the most unexpected yet splendid purchases in the history of commerce: complete acquisition of its greatest competition in Europe. As the most eminent trading empire in Novgorod, the Bogdanoff & Bogdanoff Merchant’s Guild was a titan of unmatched proportions for nearly a century, dominating every English scillinga and Hanseatic mark flowing through the Slavic markets. However, for reasons unbeknownst to even the Osmanoglu family’s agents, they were approached with an offer of acquisition by representatives of Bogdanoff & Bogdanoff’s enigmatic co-owners; rarely-seen twins of noble stock. The power dynamic of Eastern Europe has shifted in favour of the House of Osman’s intrepid merchants for the first time in its history, and previously-untapped markets throughout Europe are now opening up through their newly-integrated trade network. As for the Brothers Bogdanoff, who can say? Perhaps they saw the writing on the wall when Byzantine merchants got their own trade quarter in Great Novgorod, or perhaps they merely saw it in their best interests to bestow the financial burden unto others. In any event, their near-prophetic market speculation and comprehension of global commerce is sure to create a nigh-invincible trade hegemony."
 ab_byzantium.8.a: "He bought?"
 ab_byzantium.9.t: "The Angelid Crisis"
 ab_byzantium.9.d: "The Roman Empire is but a mere shell of its former self, a shadow of the glorious state that once stretched across the Mediterranean. While there is no one single cause for the collapse of the Empire, there is one family that keeps pushing the empire closer and closer towards total destruction, albeit unintentionally. The Angelos dynasty, which has been ruling over Byzantium since the 12th Century, have showcased the military incompetence, corruption, overspending, and a complete disregard for state maintenance that the Byzantine Empire has come to be known for.\n\nWhen they sent the general Leon Gabras to defeat the Turkish invaders, the general betrayed them and established the Nicene kingdom across the Bosporus. Leon was but an example of the nobility acting against the interests of the state; the nobility has fallen into decadence, accepting bribes while hosting lavish parties, all while enemies press their feet harder on the Empire’s throat. And yet, the Angelos have made little attempt to try and curb this rampant corruption. When Emperor Andronikos attempted to push back against the Bulgars with the aid of the Serbs, they never actually joined forces and instead were picked off one by one. Not only did the humiliating peace treaty bisect the empire with the loss of Thessaloniki, but it also enforced the burden of war reparations upon the Angelos. If Byzantium is to survive the centuries to come, they must rebuild their broken state, reform their military, and prevent further incursions from rivals, lest they fall just as the west did."
 ab_byzantium.9.a: "How will we ever recover from this…?"
 ab_byzantium.10.t: "Spoils of War"
 ab_byzantium.10.d: "Recently, the feckless 'Tsar' of Bulgaria has sent a letter to our esteemed Basileus, demanding the court pay an exorbitant fee - or more accurately - bribe, for peace, and have demanded a sum far beyond what we could hope to pay. Most likely they know this, and have demanded such an extravagant amount knowing we could never hope to defend ourselves if they decided to plunder our lands and take it for themselves."
 ab_byzantium.10.a: "Alas, this is simply an offer we cannot refuse..."
 ab_byzantium.10.b: "Then we shall prove them wrong!"
 ab_byzantium.11.t: "Spoils of War"
 ab_byzantium.11.d: "A baggage train arrived this morning, filled to the brim with gold and various other relics of a bygone age, bearing the Roman standard. Ostensibly, this was not done out of their generosity, but to pay for all the damage they did to our countryside during the war. By the looks of it, the Romans had to scrounge up everything of worth from their den in Constantinople to meet our demands."
 ab_byzantium.11.a: "And we are all the richer for it!"
 ab_byzantium.12.t: "Byzantium Refuses to Pay the Reparations"
 ab_byzantium.12.d: "Days passed, and we never received a response for the Romans regarding our rightfully deserved war reparations. Today, however, a letter with the Roman seal arrived at our court with two words inscribed on it. “Molon Labe” (Come and take it)."
 ab_byzantium.12.a: "Then we’ll take our gold, and our fair share of blood!"
 ab_byzantium.12.b: "There is nothing we can do... for now..."
 ab_byzantium.15.t: "The Phoenix Rises"
 ab_byzantium.15.d: "The Empire has come out of the Crisis stronger than ever. We have restructured our court, uprooted the corruption festering in our state, and rebuilt our army to an acceptable standard. The Angelos had managed to avert the nosedive that Byzantium was taking, however, they did not accomplish this on their own. It took the cooperation of multiple noble houses to facilitate this rapid rebirth of the Byzantine state, some of whom aspired to take the crown for themselves.\n \n The house of laskaris, Komnenos, Doukas, and several others all eye the throne for their own and are debating the merits of an overthrowing of the Angelos. Now would be the opportune time; should these factions seek to take down the Angelos, they could do so in the name of reform and progress, and the rest of the ruling elite would accept them as the new Emperors. However, some doubt the plan; the Angelos are now more powerful than they have ever been before. With the reformed army and court behind them, they will not only bring prosperity to the Empire, but they would also be incredibly difficult to overthrow. Back and forth they went, until they settled on a path. And so, as the phoenix rises from the ash…"
 ab_byzantium.15.a: "...The House of [Root.Monarch.Dynasty.GetName] remains strong!"
 ab_byzantium.15.b: "...The House of Laskaris takes control!"
 ab_byzantium.15.c: "...The House of Doukas seizes power!"
 ab_byzantium.15.de: "...The House of Komnenos wins the throne!"
 ab_byzantium.15.e: "...A new dynasty ascends the throne!"
 ab_byzantium.16.t: "Avenging Manzikert"
 ab_byzantium.16.d: "As the dust settled over the battlefield, all that remained was dust and ash. Turkish soldiers lay on the earth, still and unmoving; those who were too foolish to flee. The others raced away on their steeds, only to be intercepted by our cataphracts crashing into them. Their commander did not beg for his life, he merely accepted his fate; his body was tossed in with the rest. As the scout recounted more of the battle, a smile crept across [Root.Monarch.GetName]. It had been centuries since the Battle of Manzikert, where the Seljuk armies humiliated us on the hills of Anatolia. Now, as Byzantine forces drive back the foes that have long since plagued them in the east, [Root.Monarch.GetName] smiles to [Root.Monarch.GetHerselfHimself]. Raising [Root.Monarch.GetHerHis] hand, [Root.Monarch.GetSheHe] calls to the various courtiers around them. There are to be celebrations, for Manzikert has finally been avenged!"
 ab_byzantium.16.a: "Victory for the [Root.Monarch.GetTitle]!"
 ab_byzantium.19.t: "Liberation of the Holy Land"
 ab_byzantium.19.d: "Palestine now sits firmly within Christian control- righteous and true Christian control at that. For centuries, followers of the false Pope have vied to make an independent state based out of Jerusalem, oftentimes vaguely promising us oversight or control in exchange for safe passage and supplies. Despite going back on these promises, even those misguided sons of Christ managed to restore the honour and foundations of the blessed Holy Land each time they succeeded- until their precarious, isolated position gave way to Saracen incursions. Now, Palestine and its heart of Jerusalem fly our banners and no one shall claim it again. Christendom rejoices and already, those persecuted are flocking to the local workforce in droves to help restore the city's name."
 ab_byzantium.19.a: "May all of Christendom be found in the hands of Christ, our King"
 ab_byzantium.20.t: "Fall of Sicily"
 ab_byzantium.20.d: "In times of old, the south of Italia was referred to as Magna Graecia, owing to its substantial Greek populations. Sicily once found itself under near total Greek control outright under the bold Pyrrhus of Epirus. Over the centuries however, foreign powers have exerted their will upon the peninsula's south without opposition, oppressing resident Greeks, making a mockery of Christ's name or even outright rejecting it. The worst blight upon Sicily to date is the existence of the so-called 'Sicilian Sultanate', a foul Islamic cabal which has dared encroach upon not only Sicily, but Italia's very heartlands. No longer, however- the stronghold they have made of the central island has been shattered and their leadership lays in tatters, torn down by our righteous sword. Settlers from Greece proper stand eager to migrate to the restored Magna Graecia and those oppressed now see their old ways flourishing under our benevolent rule."
 ab_byzantium.20.a: "Magna Graecia shall stand forevermore!"
 ab_byzantium.20.b: "We will show them mercy"
 ab_byzantium.21.t: "Reclamation of Rome"
 ab_byzantium.21.d: "For the first time in centuries, Rome sits within the grasp of the Empire proper. The ancestral heart has been squabbled over for far too long by Papists, Germans and the disunited fools of Italia. No more, we say- for at this very moment, the spoken Greek word is flourishing among the so-called Vatican's halls, joining the preserved Latin of our forerunners. The fierce soldiers of Byzantium stand as garrisons within the ancient walls, eager to defend the reclaimed city. The Orthodox world rejoices as a crucial piece of the Pentarchy returns to our fold. All of Europa warily recognises our administration and its leader as they who came, saw and conquered, anew, in the name of Pax Romana."
 ab_byzantium.21.a: "None save God shall doubt us now"
 ab_byzantium.23.t: "Patriarchate of Antioch"
 ab_byzantium.23.d: "Rejoice, the Holy City of Antioch has at last been pried from the grip of Saracen rule at long last! A major center of Christian worship and thought since the 2nd Century AD, the city served as a major hub of Christianity and an early stopping point for missionaries making their long treks west in the Early Church. Converted with the help of St. Peter himself, as well as St. Barnabas and St. Paul, the city was sacked by Muslim armies at the hands of the Rashidun Caliphate, and never truly recovered. Perhaps now, after centuries of neglect, the city will prosper once more under Christian hands."
 ab_byzantium.23.a: "We will make sure of it!"
 ab_byzantium.24.t: "Patriarchate of Alexandria"
 ab_byzantium.24.d: "At long last, the Patriarchate of Alexandria has been brought back into the fold. An early hub of the Church and the home of many prominent Church Fathers, the first translation of the Old Testament to Greek was created within its walls. However, despite its bright beginnings, Alexandria went astray when the vile heresy of Miaphysitism took hold after the council of Chalcedon, taking the rest of Egypt with it in short order. Despite the best efforts of previous Emperors, the heresy remained entrenched up until the Islamic conquest. Perhaps now, with the so-called “Coptic Pope” replaced by a Patriarch in Communion with the one true church, we can finally right the wrongs of the past and make Alexandria the bastion of Orthodoxy it was always meant to be!"
 ab_byzantium.24.a: "St. Mark smiles upon us!"
 ab_byzantium.25.t: "Patriarchate of Jerusalem"
 ab_byzantium.25.d: "Ah, Holy Jerusalem, the cradle of our church! A Christian center since before Christ died on the Cross, Jerusalem has been an integral part of the Church since time immemorial, and thus the faithful across all of Christendom have strived to reclaim it in His name. While all attempts from the Latins have failed or been fleeting at best, God has blessed us with our success in its capture as a signal to all that our Church is the one that has remained true, not the heretic barbarians in the West. Now, with Rome as the last Patriarch out of our control, the Papist heresy stands on weaker ground than ever before!"
 ab_byzantium.25.a: "They shall soon see the Light!"
 ab_byzantium.26.t: "Bulgaria Annuls the Peace Treaty"
 ab_byzantium.26.d: "The treacherous Bulgars have annulled the peace treaty over our refusal to pay the war reparations and have declared war on us."
 ab_byzantium.26.a: "To hell with them!"
 ab_byzantium.27.t: "Quid Pro Quo"
 ab_byzantium.27.d: "A Venetian merchant family today approached our Basileus with a degrading, but nonetheless tempting offer. It's no secret to the outside world that the imperial treasury has been rather empty ever since our wars with the Bulgars. They offer to give us extravagant funds - so long as the islands of the Aegean Sea fall in their, and thus, the Doge’s domain. Normally, such an insult to the Basileus’ character would be met with blinding and exile,  but alas… these are not normal times, and our treasurer concurs we could definitely use their financial support..."
 ab_byzantium.27.a: "We never needed them anyway!"
 ab_byzantium.27.b: "Haven’t they taken enough from us already?!"
 ab_byzantium.28.t: "Quid Pro Quo"
 ab_byzantium.28.d: "Our merchants in Constantinople have approached the Basileus with an offer to purchase the Aegean islands under the control of the Byzantine Empire to our glorious republic in return for financial funds. The Basileus is awaiting our decision. Shall we ratify this deal?"
 ab_byzantium.28.a: "Of course!"
 ab_byzantium.28.b: "We can't afford it!"
 ab_byzantium.29.t: "A Deal with the Devil"
 ab_byzantium.29.d: "While not easy, we have made the pragmatic decision to sell our Aegean possessions to secure the rest of the realm. Our advisors assure us we have made the right decision."
 ab_byzantium.29.a: "Quid Pro Quo"
 ab_byzantium.30.t: "The Doge Refuses the Deal"
 ab_byzantium.30.d: "Even though we have reached an agreement with the Venetian merchants, the Doge himself refused to ratify this deal and therefore, the islands remain under our control."
 ab_byzantium.30.a: "Very well..."
 ab_byzantium.32.t: "Morea Declares Independence"
 ab_byzantium.32.d: "In the wake of the Angelid Crisis, the Morean nobles have broken away from our rule! Already they have seized our fortifications in the area and kicked out our governors, or worse. We mustn’t let such treachery go unpunished! Yet currently it seems our hands are somewhat tied, we could attempt an invasion, however it would likely prove difficult due to their mountainous terrain. Or we could let them be for now until we can restore order at a more opportune time."
 ab_byzantium.32.a: "We mustn’t tolerate such treachery!"
 ab_byzantium.32.b: "Eventually they’ll come crawling back"
 ab_byzantium.33.t: "The Question of Smyrna"
 ab_byzantium.33.d: "Long has the stronghold of Smyrna defied us for decades. Being the Emperors last vestige in Anatolia, Smyrna is undoubtably of great importance to their future schemes to destroy us, securing Smyrna for ourselves is of utmost importance. Unfortunately, we are not yet fully prepared to launch an attack on the heavily defended city, besides, perhaps the Emperor can be reasoned with? If not, we will surely defeat them."
 ab_byzantium.33.a: "Demand the fortress!"
 ab_byzantium.33.b: "This isn’t the time"
 ab_byzantium.34.t: "Nicaea Threatens War over Smyrna"
 ab_byzantium.34.d: "Your Majesty! Dire news! The bastard descendants of that Gabras traitor have cowardly struck at our moment of weakness and sent us a message; surrender Smyrna or prepare for war. How should we respond? Of course, we should rush to defend our rightful territory, but on the other hand, maybe we should let this one go, our situation isn’t exactly geared for war at the moment."
 ab_byzantium.34.a: "We can’t hope to defend the city"
 ab_byzantium.34.b: "We’ve already lost so much, not another inch!"
 ab_byzantium.35.t: "The Byzantine Empire Surrenders Smyrna"
 ab_byzantium.35.d: "As expected, the cowardly Romans have ceded their city. But we shouldn’t rest yet, there is no doubt they are scheming as we speak to return Smyrna to their dominion, we must prepare for conflict in the near future, lest they strike first."
 ab_byzantium.35.a: "No surprises there"
 ab_byzantium.36.t: "The Byzantine Empire Ignores our Threat"
 ab_byzantium.36.d: "Maybe the Corpse-Empire still has some spine after all. It is regrettable to say, but the Emperor has refused our generous offer. Our forces have amassed in the mountains outside the city, and our agents await their orders. All that remains now, is to give the order to advance my liege."
 ab_byzantium.36.a: "To arms!"
 ab_byzantium.36.b: "For now, at least, we have to swallow our pride"
 ab_byzantium.37.t: "Call to Arms"
 ab_byzantium.37.d: "Nicaea calls for our aid! As their allies, it would only be appropriate to receive their call to arms and mobilize our forces against the Romans, but this might not be in our best interest. However, if we do refuse, the Nicene’s certainly won’t appreciate it."
 ab_byzantium.37.a: "They ask, and they shall receive"
 ab_byzantium.37.b: "Let’s sit this one out..."
 ab_byzantium.39.t: "Guns of Urban"
 ab_byzantium.39.d: "Being at a crossroads between civilizations, our ailing empire has always been partial towards stumbling upon strange goods from faraway lands. As of late, a new oddity has swept through the local trade hubs - advanced artillery weapons, some of which can fit within the palm of one's hand, originating from a most distant eastern kingdom of 'Goryeo'. While these foreign treasures mostly consist of childish trinkets and indecipherable designs scrawled in strange characters, the Osman and Sons Trading Company have partnered with a Magyar siege weapon expert, Orbán, to construct for us the most useful of these aberrances. The first are a series of arrow-slinging wagons, 'Hwacha', which utilise the power of gunpowder to propel arrows to lethal, monstrous speeds. Said 'Hwacha' can be made even more fearsome, by loading them with a horror unlike anything seen in Europa - 'divine machine arrows', 'Singijeon', arrows which explode on contact, as if they were cannonballs. In addition, Orban is an expert in cannon warfare and claims he can build for us gigantic cannons that can blast 'the walls of Babylon itself'. Should we pay the daunting sum for their construction, these horrors could give us an unholy edge over our neighbours and make of our fallen empire a resurgent phoenix."
 ab_byzantium.39.a: "We will use it to destroy our enemies!"
 ab_byzantium.39.b: "For Rome's survival, no cost is too great!"
 ab_byzantium.39.c: "We can't afford it"
 ab_byzantium.40.t: "Guns of Urban"
 ab_byzantium.40.d: "A Magyar engineer by the name of Orban has come to us with an interesting proposal. Partnered with the Osman and Sons Trading Company, he has compiled a series of designs for advanced artillery weapons, big and small- including, effectively, the largest cannons Europe has yet seen and bizarre wooden machines, 'Hwacha', capable of launching dozens of exploding arrows, 'Singijeon', at horrific speeds, exploiting the darkest arts of warfare possible via gunpowder. Exactly how they've procured such nefarious ideas, we are not sure, but we hear they hail from the mysterious eastern kingdom of 'Goryeo', where devilish heathen men launch fire from their palms and cannonballs from mere muskets. Our spies and merchants indicate that Orban unsuccessfully offered his services to the Byzantine rump state before coming to us, so perhaps it is best to secure this technology now before it proliferates elsewhere."
 ab_byzantium.40.a: "With these weapons, entire kingdoms will fall at our feet"
 ab_byzantium.40.b: "We shall use them to protect our cities"
 ab_byzantium.40.c: "We can't afford it"
 ab_byzantium.44.t: "Urban's Movable Cannon"
 ab_byzantium.44.d: "Our recent triumphant victory has proven that Orbán is not a charlatan, but a true master of siege weaponry and cannon warfare. While we were waging war on the battlefield, Master Orbán was working on his improved version of the cannon. Recently, he has requested an audience with the [Root.Monarch.GetTitle] himself, offering even more effective and deadly siege weaponry, but to turn his prototype into a weapon, a large investment will be required."
 ab_byzantium.44.a: "He has proven his worth, we will fund his research"
 ab_byzantium.44.b: "We can not afford it"
 ab_byzantium.45.t: "Traitors, One and All"
 ab_byzantium.45.d: "Under Angelid dominion, the Eastern Roman Empire has suffered more in the span of two centuries than could have been thought possible. The former titan of the Near East is now a decrepit, failed state with little prospect for a future. At least, that is what most of Constantinople's subjects believe to be the case. Ever since the rise of the illegitimate Nicene Kingdom, under the treasonous bloodline of Leon Gabras, many so-called Greeks have revealed their true colours to our great state, and are fleeing in droves across the Hellespont. Although these fork-tongued villains claim it is to seek security, stability, and a better life in the more stable half of the Greek world, our infallible Basileus sees through such falsehoods. Evidently, such subversive agents cannot appreciate the safety of Rome's civilised barriers; Bulgaria's illegal foray into Macedonia was a mere fluke, and the Nicene state is surely to fall within a matter of months. So what if the countryside's living conditions are comparable to those of the West after Alaric's rampage through Italy? So what if Constantinople's population has dwindled to a meagre 18,000 in under a century? The situation is completely under control, and these vermin are failing to fathom our sustained prosperity by seeking to betray us for thirty pieces of silver and a farm on the Anatolian coast. And besides, even if they were to leave, we're in control of the ferries. What's the worst that could happen should these serfs be turned back? A disgruntled population? Rome's brave legions will surely be a match for them! Surely..."
 ab_byzantium.45.a: "The situation is not to our advantage"
 ab_byzantium.45.b: "Turn them back. Break a few eggs if you have to"

 purple_phoenix.17.t: "Macedonia reclaimed!"
 purple_phoenix.17.d: "The disastrous defeat of Emperor Andronikos caused the Bulgarians to take over the region of Macedonia, one of the most important centers of our culture. Now, however, the region is ours and so it shall remain forever more!"
 purple_phoenix.17.a: "The Phoenix rises!"
 purple_phoenix.18.t: "Nicaea reclaimed!"
 purple_phoenix.18.d: "In the aftermath of the Fourth Crusade, the Empire was on the brink of disintegration and our enemies were more than eager to capitalize on its instability. During these times, our eastern frontier was protected by an army led by Leon Gabras, a general who would go from one of the most trusted advisors of the Emperor to a filthy traitor who betrayed his homeland. Instead of protecting the Byzantine Empire, he declared an independence and established his pathetic Kingdom of Nicaea. We have finally managed to dismantle this rotten state and all of the Greek inhabited regions on the western coast of Asia Minor are once again part of the Byzantine Empire."
 purple_phoenix.18.a: "The Phoenix rises!"

# The Phoenix Prince #
# Howard: This is Patreon immortalization, the Pheonix is intended
 ab_the_pheonix_prince.1.t: "The Birth of a Pheonix"
 ab_the_pheonix_prince.1.d: "Years ago, the Byzantine Empire and the Serbian principality were unfortunate allies, standing together against the Bulgarian menace. However, Bulgarian forces emerged victorious, shattering the alliance and leaving both Byzantium and Serbia significantly weaker. [Root.Monarch.GetTitle] Ioannes II of Byzantium, burdened by the weight of his crumbling empire and the absence of an heir, recognized the need to reestablish the Serbo-Byzantine alliance. He cast his gaze northward, to the Serbian lands, where Princess  [Root.Consort.GetName] was known for her wisdom and grace. Their marriage was a strategic decision, a pact to mend the frayed ties between their realms. It was a union rooted in diplomacy, but beneath the political calculations, a genuine bond began to form between the royal couple. Despite the years that passed, their hope for an heir remained unfulfilled, casting a shadow over the empire's future.\n\nIt is a clear night, and the stars above shine brilliantly, as if the heavens themselves are watching over the city. But then, an extraordinary event starts to unfold. High above, the sky bursts into a spectacular meteor shower, streaks of light and fire trailing across the celestial canvas. As the meteors continue to streak across the sky, in the great palace of Constantinople, the prayers of  [Root.Monarch.GetTitle] Ioannes and [Root.Consort.GetTitle]  [Root.Consort.GetName] are finally answered. After a gruelling long pregnancy [Root.Consort.GetTitle]  [Root.Consort.GetName], her eyes reflecting the brilliance of the celestial display outside, finally gives birth to a son.\n\nThe palace is filled with joy, and the news spreads through the city like wildfire. Bells ring out in celebration, and the people, under the meteor shower above, rejoice in the birth of their future ruler. The child, born on this blessed night under the light of the falling stars, is named Alexios. It is seen as a sign, a union of destiny and the heavens. Alexios will grow to be a symbol of hope and renewal, the phoenix, a beacon of promise for the Byzantine Empire, which longs for a future bathed in the light of a new era. "
 ab_the_pheonix_prince.1.a: "A ruler to guide us into a new era surely…?"
 ab_the_pheonix_prince.1.b: "Exile him to Serbia!"
 BYZ_PHEONIX_PRINCE_BIRTH: "The child has a great destiny ahead of him... if he survives long enough..."
 ab_the_pheonix_prince.2.t: "Pheonix Ascendant"
 ab_the_pheonix_prince.2.d: "Alexios Angelos of the Byzantine Empire grew up to embody everything his Angelid ancestors had failed to be. He was a young man driven by an insatiable thirst for all matters concerning rulership. While most of his peers were occupied with pursuits of leisure, he was deeply invested in the arts of warfare and statecraft. He could often be found engrossed in discussions with seasoned generals and advisors, meticulously studying historical records of efficient bureaucracies, immersing himself in the art of diplomacy, poring over battle maps, and thoroughly examining military treatises. His days followed a routine of rigorous physical and mental training. He relentlessly drilled alongside his soldiers, pushing his limits in combat exercises. His proficiency with a sword and his ability to lead by example were renowned throughout the empire.\n\nHis true potential shone brightest in the war room, surrounded by maps, scrolls, and tactical diagrams, where he crafted intricate battle plans. Like the great imperial commanders of the past, he possessed a rare gift for visualising the ebb and flow of a battle, anticipating enemy movements, and exploiting weaknesses.\n\nWhile he was a devoted military strategist, he also had a unique bond with his Serbian mother and her homeland. In private, he cherished the traditions and heritage of Serbia, quietly practising customs passed down through his maternal lineage. His mother's stories of Serbia's history and martial traditions, though less refined than Byzantine ones, nevertheless left a lasting imprint on him. However, his strong attachment to Serbian culture occasionally made him appear aloof or distant from his Byzantine peers, contributing to a sense of isolation within the imperial court.\n\nThis familial connection inspired him to experiment with the incorporation of Serbian military tactics into the Byzantine arsenal. Drawing from the rich martial heritage of both cultures, he sought to meld the strengths of Serbian warfare with Byzantine strategies, creating a distinctive blend that set him apart as a forward-thinking commander. This fusion of traditions not only reinforced his deep connection to his Serbian heritage but also enriched the Byzantine military, providing an innovative edge on the battlefield.\n\nAs word of his unparalleled expertise in warfare spread, he earned the reverence and envy of Byzantium's most seasoned generals. However, within the imperial court, he faced a unique challenge. Some among the courtiers harboured lingering distrust toward him, associating him with the memory of the late rebel leader, Leon Gabras."
 ab_the_pheonix_prince.2.a: "Give him command of the army, he shall lead from the front!"
 ab_the_pheonix_prince.2.b: "It is too dangerous, we can't risk losing him."
 ab_the_pheonix_prince.2.c: "Our army already shows improvement."
 BYZ_PHEONIX_PRINCE_GENERAL: "Alexios shall be given direct command of an army, letting him use his skills to the full but also risking his life"
 BYZ_PHEONIX_PRINCE_NO_GENERAL: "For now he shall stay far from the battlefield, commanding the armies from a safe place"

