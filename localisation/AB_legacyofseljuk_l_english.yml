### OTTOMANS ###
# Ideas #
 tur_first: "Ottoman Mercenary Armies"
 tur_first_desc: "While most Turkish clans trace their lineage back to a powerful warlord and raise armies of hardened warriors accordingly, the Osmanoglu family are more than willing to contract the services of mercenary armies, who are reliable in that their only loyalty is to coin.\nRecruiting a mercenary company now costs §G0.00%§! Army Professionalism."
 tur_second: "Sharia-Compliant Finance"
 tur_second_desc: "It is the imperative of any Muslim merchant or tradesman to conduct his business in a way that adheres to Allah's commandments. Thus, the Ottomans have gained a reputation among our trading partners as honest and charitable in comparison to our Christian competitors."
 tur_third: "The House of Osman"
 tur_third_desc: "The Osmanoglu family are the wealthiest trading family in the Mediterranean world, and have built our reputation upon years of successful business negotiations and consistent profits. We never needed the prestige of a warrior lineage to be universally respected."
 tur_fourth: "Bolster the Janissary Ranks"
 tur_fourth_desc: "The Janissaries are the personal soldiers of the Baskan, for whose services he pays out of his own pocket, not with company finances. Although under direct employment of one man, they fight valiantly to enforce deals and expand our holdings, so we should opt to expand the Janissaries into a fully-fledged paramilitary.\nJanissary Maintenance Modifier: §G-20.0%§!"
 tur_fifth: "Attract Foreign Merchants"
 tur_fifth_desc: "It would be an understatement to say that Europeans are obsessed with exotic goods. Our trading partners in the Christian world have developed such a taste for foreign wares that they are willing to pay even the steepest prices for spices, silk, and other finery. Why not bring the foreign merchants within our own borders, so that even more buyers will flock to our lands?"
 tur_sixth: "Expand the Grand Bazaar"
 tur_sixth_desc: "The Grand Bazaar of Konstantiniyye is the ultimate symbol of Ottoman financial prowess and international influence. From humble beginnings it has grown to be a global marketplace, where craftsmen and traders from Beijing to Timbuktu flock to market their wares."
 tur_seventh: "Mediterranean Trade Empire"
 tur_seventh_desc: "When all is said and done, geopolitical control of the Mediterranean will not be held by the nation with the navy capable of intimidating all others, but rather the nation whose trade ships are welcome in every port. The Ottoman trading empire shall extend across this old Roman lake not through brute force, but fair deals."
 TUR2_ideas: "Ottoman Ideas"
 TUR2_ideas_start: "Ottoman Traditions"
 TUR2_ideas_bonus: "Ottoman Ambition"
 tur_seventh2: "Mediterranean Trade Empire"
 tur_seventh2_desc: "When all is said and done, geopolitical control of the Mediterranean will not be held by the nation with the navy capable of intimidating all others, but rather the nation whose trade ships are welcome in every port. The Ottoman trading empire shall extend across this old Roman lake not through brute force, but fair deals."

# Reforms #
 ottoman_corporation: "Osman & Sons Company"
 ottoman_corporation_desc: "The Osmanoglu family are the wealthiest trading family in the Mediterranean world, and have built their reputation upon years of successful business negotiations and consistent profits."
 ability_ottoman_commercialism_mechanic: "Ottoman Commercialism"
 ottoman_millet: "The Millet System"
 ottoman_millet_desc: "In our time, many empires and kingdoms exclude most of their minorities and unwanted demographics from citizenship. Under the crescent, we will distribute citizenship to all people regardless of their origin. When paid Jizya, the People of the Book can enjoy the prosperity of our great domain."
 ab_millet_system_province_modidier: "§YGovernment Mechanics:§!\nAll §YHeretic§! and §YHeathen§! provinces receive §G-50%§! Local Religious Unity Contribution."
 ottoman_nizam: "Nizam-i Cedid"
 ottoman_nizam_desc: "The Osmans have the Jannisaries, the highly-feared elite units that protect Konstantiniyye. Even though they are very effective in combat, their reserves are very low. As a republic that expands and owns bureaus, ports and even cities all around Asia and Europe, we need to create a new, disciplined army made out of citizens. Nizam-i Cedid is born!"
 ottoman_lodge: "The Freeweavers Lodge"
 ottoman_lodge_desc: "Silk is one of the most important trade goods that unite the East and the West. The Christians love the silk imported from the lands of the Jade Emperor, transported via the ships of Arabic traders and sold by the Osman family. To protect the rights of silkweavers all around the world and use this socio-economic monopoly to manipulate diplomatic outcomes to our favor, we will find the Freeweavers Lodge and spread our connections around the world."
 ottoman_eyalets: "Economic Eyalets"
 ottoman_eyalets_desc: "Many nations divide their lands under feudal lords thus limiting the central government's power. In our domain, lands are divided between their economic importances and goods, governed by Valis appointed by Konstantiniyye. With our elections and rightful suzerienity, we are truly heirs to the Rashidun way of governence."
