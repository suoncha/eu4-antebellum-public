### NICAEA ###
# Countries #
 NCI: "Nicaea"
 NCI_ADJ: "Nicene"
 MAC: "Macedonia"
 MAC_ADJ: "Macedonian"
 HLE: "Hellenic Empire"
 HLE_ADJ: "Hellenic"
 AEG: "Egypt"
 AEG_ADJ: "Egyptian"

# Ideas #
 NCI_ideas: "Nicene Ideas"
 NCI_ideas_start: "Nicene Traditions"
 NCI_ideas_bonus: "Nicene Ambition"
 nci_first: "Greek Spirit"
 nci_first_desc: "As the Greek identity is once more fostered in the hearts of every Hellene, we must not falter in our recapture of the homeland, be it from the Bulgars, Turks or even the so-called “Rhomanoi” across the Bosphorus. The Greek mainland will be restored to its proper rulers, and every setback will only make our resolve stronger!"
 nci_second: "Stratocratic Government"
 nci_second_desc: "Our government is not a monarchy in the traditional sense. In place of the nobility and feudal lords that fell so in the past, we have rule with the consent of the Strategoi, the most learned generals of our realm. Every “noble” is a Strategos, and every “province” is more akin to the theme system of old. House Gabras is no exception to this, and our dynasty was responsible for some of the greatest military minds of Byzantine history. Fighting is in House Gabras’ blood, and it shows in every stroke of the royal pen!"
 nci_third: "Battle for the Bosphorus"
 nci_third_desc: "At the centre of the Hellenic world lies the Bosphorus strait. A critical artery of trade and military utility since antiquity, we cannot afford for it to be in the hands of anyone but Hellenes. Our navy will be instrumental in the Bosphorus’ capture, and when the time comes, we must be assured they will not fail in their duties!"
 nci_fourth: "Spartan Training"
 nci_fourth_desc: "The proud military tradition of the Greek people dates back to before Christ, and has served our people well for many years after. Our holy duty to recapture Anatolia from the Turks calls for the reconstruction of this proud warrior ethos. Mithridates and Leonidas look to our future conquests with baited breath!"
 nci_fifth: "Nicene Councils"
 nci_fifth_desc: "The Council of Nicaea, the first ecumenical debate held by the early Christian church, concludes with the establishment of the doctrine of the Holy Trinity. Convened by Roman Emperor Constantine I in May, the council also deemed the Arian belief of Christ as inferior to God as heretical, thus resolving an early church crisis. The council established the equality of the Father, the Son, and the Holy Spirit in the Holy Trinity and asserted that only the Son became incarnate as Jesus Christ. The Arian leaders were subsequently banished from their churches for heresy. Emperor Constantine presided over the opening of the council and contributed to the discussion."
 nci_sixth: "House of Gabras"
 nci_sixth_desc: "Unlike the weak, effeminate “Roman” Emperors in Constantinople, the House of Gabras has never faltered in its defence of Anatolia from the Turkish onslaught, even when they were abandoned by the cowardly Angelids! What legitimacy we lack in noble blood or divine right to rule we more than make up for in our actions, and the world knows it."
 nci_seventh: "Restore the Hellenosphere"
 nci_seventh_desc: "Once, in the days before the accursed Romans stole our legacy and trampled on our culture, our people and their customs held much sway over the civilised world, well beyond our borders. We must once more restore our hegemony over the Mediterranean and beyond, but this time with sword and musket in hand!"

 HLE_ideas: "Hellenic Ideas"
 HLE_ideas_start: "Hellenic Traditions"
 HLE_ideas_bonus: "Hellenic Ambition"
 HLE2_ideas: "Hellenic Ideas"
 HLE2_ideas_start: "Hellenic Traditions"
 HLE2_ideas_bonus: "Hellenic Ambition"
 hle_first: "Greek Spirit"
 hle_first_desc: "As the Greek identity is once more fostered in the hearts of every Hellene, we must not falter in our recapture of the homeland, be it from the Bulgars, Turks or even the so-called “Rhomanoi” across the Bosphorus. The Greek mainland will be restored to its proper rulers, and every setback will only make our resolve stronger!"
 hle_second: "Stratocratic Government"
 hle_second_desc: "Our government is not a monarchy in the traditional sense. In place of the nobility and feudal lords that fell so in the past, we have rule with the consent of the Strategoi, the most learned generals of our realm. Every “noble” is a Strategos, and every “province” is more akin to the theme system of old. House Gabras is no exception to this, and our dynasty was responsible for some of the greatest military minds of Byzantine history. Fighting is in House Gabras’ blood, and it shows in every stroke of the royal pen!"
 hle_third: "Battle for the Bosphorus"
 hle_third_desc: "At the centre of the Hellenic world lies the Bosphorus strait. A critical artery of trade and military utility since antiquity, we cannot afford for it to be in the hands of anyone but Hellenes. Our navy will be instrumental in the Bosphorus’ capture, and when the time comes, we must be assured they will not fail in their duties!"
 hle_fourth: "Spartan Training"
 hle_fourth_desc: "The proud military tradition of the Greek people dates back to before Christ, and has served our people well for many years after. Our holy duty to recapture Anatolia from the Turks calls for the reconstruction of this proud warrior ethos. Mithridates and Leonidas look to our future conquests with baited breath!"
