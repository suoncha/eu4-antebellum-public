### LATIN EMPIRE ###
# Countries #
 LAT: "Latin Empire"
 LAT_ADJ: "Latin"

# Ideas #
 LAT_ideas: "Latin Ideas"
 LAT_ideas_start: "Latin Traditions"
 LAT_ideas_bonus: "Latin Ambitions"
 lat_first: "Latin Patriarchate"
 lat_first_desc: "Prior to our conquest, the Ecumenical Patriarchate of Constantinople was the highest and most important religious authority in all of Eastern Christianity. The Latin Patriarchate of Jerusalem was established by the Kingdom of Jerusalem as a way of strengthening papal authority in the Holy Land. As we have now expelled this heretical Patriarch, we are in a position to establish our own patriarchate - one which is loyal to Rome and the Supreme Pontiff."
 lat_second: "Crusader State"
 lat_second_desc: "Our young Empire's military is that of a divine one. Crusading knights, devout to the one true God, have abandoned their old lives in the far corners of Christianity in order to serve the call to arms against the heathens plaguing the holy land. This militaristic fervour, which we have enjoyed throughout the Crusades, will aid us well in our future conquests."
 lat_third: "Crown of Thorns"
 lat_third_desc: "The Crown of Thorns, worn by the Son of Christ himself during his crucifixion, had been held in Constantinople for centuries. After our Crusader armies sacked the city, it was discovered and we have now acquired the holy relic. It is our duty, and our privilege, to protect one of the instruments of passion. Deus Vult!"
 lat_fourth: "Latinokratia"
 lat_fourth_desc: "A new chapter in history has begun for Greece. Under our rulership, the Aegean Sea and the rest of the Greek world will find prosperity and wealth instead of plundering and death seen in the last few centuries."
 lat_fifth: "Western Administration"
 lat_fifth_desc: "The old bureaucratic system of Byzantium was a complicated mess, somehow surviving the test of time against all odds. As our ruling class hails from the nobility of Western Europe, we have the ability to bring over advisors, merchants, and bureaucrats from the west in order to further improve our administrative capabilities and maintain a stable bureaucracy."
 lat_sixth: "Establish the Orders"
 lat_sixth_desc: "The Christian world is home to many Holy Orders, all of which have their own capabilities, interests, and intent in serving God. Some of these Orders such as the Cistercians, the Dominicans and the Franciscans have shown their willingness to assist our cause in the East and we shall gladly accept them."
 lat_seventh: "Mend the Schism"
 lat_seventh_desc: "After the Carolingians asserted their claim as the heirs of Rome, the rift between Eastern and western Christianity has only grown larger and larger over the centuries, climaxing in our conquest of Constantinople. Even so, if Christianity is to survive in these trying times, then the schism must be mended and harmony between the two sects must return. If not us, then who will?"

# Reforms #
 lat_latinokratia: "Latin Empire"
 lat_latinokratia_desc: "Greek for the ‘Rule of the Latins’, the Latinokratia is the distinct form of Crusader State governance observed by solely the Latin Empire. Highly theocratic and warlike, the Latin state is structured around the perpetuation of the Catholic faith and spread of Franco-Italian culture through force of arms and zealous missionary work."
 lat_podestas: "Podesta"
 lat_podestas_desc: "With the growing need for financial backing from abroad, the Latins have turned to appointing prominent merchant families as ‘Podestas’, or magistrates, of regions within the Empire. They answer first to the Doge of Venice, with the Latin Emperor an afterthought."
 lat_cavalry: "Crusader Cavalry"
 lat_cavalry_desc: "The Latin Empire’s nobility are by and large members of the various holy orders, with many more descended from participants in the Crusades. Their prowess in battle as heavy cavalry is the envy of the world, with even Byzantine cataphracts having second thoughts before battle."
 mechanic_on_province_converted_gain_papal_influence_yes: "Converted §Yprovinces§! grant an extra §G0.1§! §YPapal Influence§! per point of §Ydevelopment§!"
 monthly_latin_zealotry: "Monthly Zealotry"
 LAT_10_ZEALOTRY: "Gain §G10§! £zealotry£ Zealotry"
 ability_latin_zealotry_mechanic: "Zealotry"
 LAT_MAX_ZEALOTRY: "Triple manpower increase in religious wars."
 latin_zealotry: "Zealotry"
 latin_zealotry_desc: "The failure of the Byzantine Empire and crusader states to contain the Muslim threat has brought ruin to Christendom. In order to restore the rule of the Cross over the Eastern Mediterranean, our Last Crusade will be fueled by the zeal of our fearless armies.\n\n£zealotry£ §YZealotry§! can be earned by:\n - Converting provinces to §YCatholic§! (§G+0.25§!)\n - Winning battles against §YHeretics§! and §YHeathens§! (§G+0.5§!)\n\n£zealotry£ §YZealotry§! can be lost by:\n - Losing battles against §YHeretics§! and §YHeathens§! (§R-1§!)\n - Having less than §Y50%§! Religious Unity (§R-0.25§! per month)\n\n"

# Decisions #
 form_latin_empire_title: "Proclaim the Latin Empire"
 form_latin_empire_desc: "With Constantinople in Catholic hands and the Byzantine Empire dismantled, we shall proclaim Latin rule over eastern churches. May this victory seal the wound of the Great Schism and unite the Christian world at last."
 establish_podesta_title: "Establish the Podesta of Constantinople"
 establish_podesta_desc: "Latin rule has at last come to the heretical Greeks, although with the City of the World’s Desire little more than depopulated, smouldering rubble, it may be prudent to appoint an emissary of the Doge of Venice as the Podesta of Constantinople, effectively giving a total monopoly over the merchant quarters to our Italian backers in exchange for a significant boost to our economy."

# Events #
 ab_latin.1.t: "Fall of Constantinople"
 ab_latin.1.d: "The Angelos dynasty had ruled the Eastern Roman Empire complacently for many years, assuming that the failure of the Venetians to seize Constantinople marked the final effort. They were, as always, proven dead wrong recently. What was once thought impossible has now been made a reality; the City of the World’s desire has fallen. Latin troops bearing the Cross breached the Theodosian Walls and overwhelmed the defending garrison, fuelled by what the scant few survivors thought to be a hellish furor. A carnival of looting and pillaging ensued, with nothing spared. Everywhere the Latins went, bloodshed followed. Not even the civilians or imperial mausoleum were spared from the massacre. Constantinople has been brought to its lowest point in Byzantine history, with not even the Justinian Plague’s body count comparable. With Latins in control of the city, there are few doubts in anybody’s mind that the final death of Byzantium is upon us."
 ab_latin.1.a: "Is nothing sacred anymore..?"
 ab_latin.2.t: "Proclamation of the Latin Empire"
 ab_latin.2.d: "On this day, the Catholic world rejoices. For the longest time, it has been one of Catholicism’s dreams to unite the Christian world, and in doing so prove that it is the one true Church. Though Constantinople is barely a shadow of its former self, it shall regardless serve as the capital of the new state which has emerged from the ashes. The Latin Empire, Christendom’s first line of defence in Eastern Europe, is now the torchbearer. With the Byzantines resigned to memory and the Orthodox Church violently shaken, many now look to this new state as the latest source of hope. Of course, not everything is well in paradise. The Latin ruling class are at best a minority group within the Empire, greatly outnumbered by Greeks, Slavs, and Turks, and many bear ill will over Venice’s failed invasion in 1204. Furthermore, there are still those who stubbornly cling onto the Orthodox faith, though it is only a matter of time until they are rooted out or brought into the light. Whatever the future may have in store, one thing is certain: this is likely the dawn of a new era in the Old World. May the Latin Empire bring about eternal peace and prosperity for her friends, and the wrath of God upon her foes."
 ab_latin.2.a: "Deus Vult!"
 ab_latin.3.t: "Latin Patriarchate of Alexandria"
 ab_latin.3.d: "Established in the 14th Century as an attempt to subvert Orthodoxy and Greek influence in Christendom, the Latin Patriarchates nevertheless were unable to properly establish themselves. Indeed, the Latin Patriarchate of Alexandria especially never existed as anything more than a ceremonial position. Although the Holy See granted Bishops this title, not one of them ever sat in their designated Patriarchate; Rome would house these bishops instead. With the fall of the Nizzarid heathens, who had refused the Catholic Church’s legitimate, well-balanced request to oust the Orthodox and Miaphysite heretics, we can now install a Latin Patriarch loyal to the Vicar of Christ. The Nile belongs to the Legions of the Cross for the first time since the reign of Heraclius. Henceforth, Egypt’s future shall be a Latin one."
 ab_latin.3.a: "The Patriarch is titular no more!"
 ab_latin.4.t: "Podesta of Constantinople"
 ab_latin.4.d: "Venice may have failed miserably in their efforts to seize Constantinople many years prior, yet that hasn’t stopped their merchants from discreetly subverting those within the City of the World’s Desire to our cause, and better yet, showing us the weak points of the Theodosian Walls. In order to show our appreciation for their truly outstanding support, it has been suggested that we allow them full control over the Venetian Quarter, and even the Merchant districts at large. They would be completely separate from the Latin administration, which will no doubt score the ire of our own people, but we will also receive a great deal of commerce and trade taxes - no doubt! The Lord of One Fourth and One Half of the Empire, as the title shall be styled, might just give Constantinople that extra push to help restore her to the glory days before our admittedly rather cruel takeover. All that’s left is the Emperor’s signature, and the office will be established."
 ab_latin.4.a: "The Lord of One Fourth and One Half, eh?"
 ab_latin.4.b: "Those slimy bastards will rob us blind!"
 ab_latin.5.t: "Jerusalem in Latin Hands"
 ab_latin.5.d: "The Holy City of Jerusalem, arguably Christianity’s most important city bar Rome, is now under Latin rule. As the seat of the Kings of Jerusalem since the First Crusade, the constant threat of Islamic takeovers haven’t harmed the population of this fortress-city as they did with other regions of the Holy Land, at least as significantly. With the Empire’s banners flying from the walls and a large boost to morale, it will only be a matter of time until the rest of the Near East returns to the Christian fold. The Emperor, with the Pope’s blessing, has promised to continue the reconquest of former Christian lands until not a single heathen holds rule over the Old World, much to the fanfare of the Catholics. It seems that peace won’t return to the region for some time, though many are holding onto hope for Latin unification to change this perpetually."
 ab_latin.5.a: "The cross is triumphant once more!"
 ab_latin.6.t: "Alexandrian Restoration"
 ab_latin.6.d: "The most venerable Alexandria returns to the fold, having been under the Islamic fist for far too long. The Latin Empire’s forces sacked the city after breaching the walls, perhaps spurred on by the sheer amount of Hellenistic remnants still dominating several districts, though with far less carnage than Constantinople’s fall. Artefacts were pocketed, larger treasures were pulled from their fittings and sent back to Constantinople, and the Sultan’s palace put to the torch. Even the prominent Soma, Alexander the Great’s tomb, was desecrated by zealous Latins seeking a little fame, but his remains were nowhere to be found; evacuated to safety by the Coptic community according to rumours. As the chaos dies down and order is once more restored, the Empire’s forces turn their gaze to lands beyond the horizon. For the glory of God!"
 ab_latin.6.a: "The Fifth Crusade avenged!"
 ab_latin.7.t: "The Last Crusade"
 ab_latin.7.d: "The Emperor of the Latins has proclaimed that the Last Crusade has been called by His Holiness the Pope, and that it is the duty of every man and boy fit enough to hold a sword to take up the banner of the Cross. Already, swarms of the faithful have flocked to Constantinople in the hopes of securing a place in Heaven and forgiveness for all their sins in life, with the added bonus of taking some Saracens down with them. The drums of war beat louder than ever before, and many fear that the Latins - still high off their victory against Byzantium - can be easily stirred into a rabid frenzy from which little more than disaster may follow. Those concerned also mention that the supposed call to arms by the Pope is dubious at best, and most likely forged by one of the Emperor’s agents. Either way, nothing has come from the Holy See to confirm or deny such claims and the many skeptics find themselves lynched or chased into hiding by mobs of riled up glory-seekers. The cries for peace from the meek and otherwise non-militant Christians are now drowned out by church bells and chanting, their pleas falling on eyes and ears closed to all but the will of God. Latin armies amass in preparation for a grand campaign, one which may take multiple generations and span half a continent. The world waits with bated breath, the uncertainty overwhelming and concern palpable. May God have mercy on all life the Latins lay their eyes upon, for a tidal wave of doom is nigh upon us."
 ab_latin.7.a: "This is what God would have willed!"
 ab_latin.8.t: "Emperor of the Latins"
 ab_latin.8.d: "With the destruction of those Greek barbarians and the capture of Constantinople, our men have reached an impasse as to who the ruler of the Latin Christians shall be. As per the Crusader tradition, prominent leaders of the Faithful who participated have been considered for the role, with their dynasty likely to cement itself without dissent should they take up the mantle. The issue lies in who will claim this lofty position, for many distinguished warriors of noble blood have made their mark under the Banner of the Cross. Especially important to consider is that several of them hold direct blood ties to the Crusader Kingdoms of the Holy Land. Whichever is to become our sovereign, may they be in God’s good graces throughout their reign."
 ab_latin.8.a: "A descendant of Baldwin IV?! Why, of course!"
 ab_latin.8.b: "Improving Cypriot ties may do wonders"
 ab_latin.8.c: "Interesting… de Chatillon’s line persists…"
 ab_latin.8.de: "Let the de Courtenays shine for once!"
 ab_latin.8.e: "We can fall back on the reliable de Flandre line"
 ab_latin.9.t: "The Fate of Mecca"
 ab_latin.9.d: "The Last Crusade had taken years, decades even, but all it brought was desolation and a whole heap of gold. With guilt-laden memories of the razing at Medina still crushing his heart and mind with its sheer weight, the Emperor of the Latins knew what he had to do. Grant new purpose, a second life, to the city of Mecca and her people. It may not secure his place in Heaven, for what good is an act of Charitas if preceded by acts of Ira numbering in perhaps the millions? Nonetheless, he set his plans in motion. In the honour of Saint Baldwin the Great, the hero-king who single-handedly saved Jerusalem from the incursions of Saladin, Mecca shall be reborn. A final mark upon the world by the Latin Empire’s Last Crusade, one which has incurred many mixed responses from all corners of the known world. Many are livid at the blatant idolatry and cult of personality, and yet others are nonetheless relieved to know that the Latins’ inhuman viciousness and zealotry may have finally been tempered. The Last Crusade, for all the pain it has wrought, is now at an end. The world will never be the same and the countless injuries inflicted can never fully heal, though in time old wounds may yet scar over. May God forevermore preserve us from the shafts of war."
 ab_latin.9.a: "Is this truly what God would have willed..?"
 ab_latin.10.t: "The False Empire"
 ab_latin.10.d: "Many things can be noted as synonymous with the Holy Roman Empire. The most well-known, at least amongst Latin circles, is that this false pretender to the true Imperium Romanum is a fundamental failure on every conceivable level. Ill-managed by German barbarians falsely claiming to be civilised, and polluted to its very core by adoration of the Antichrist as well as every sin and vice imaginable, the Emperor and Pope have both agreed that something must be done. This mutilated, bloated corpse of Charlemagne’s true Catholic realm is an affront to God and all good Christians of the world, thus it must be destroyed - no matter the cost. While the Latin people may be hesitant about striking down fellow Christians, they must understand that it is for the good of all that is Holy. When, and only when, the Latin Empire stands triumphant atop the carcasses of the Prince-Electors and Emperor of All Evils, may Europe see itself free from tyranny. While even the French, our countrymen, are denouncing this divine cause as “insane” and “inherently un-Christian”, this only shows that the False Empire’s roots are spread further than the unpious expect. It is up to us now. For the Grace and the Might of the Lord!"
 ab_latin.10.a: "Kill them all! The Lord knows those who are His!"
 ab_latin.11.t: "The Desolation of Medina"
 ab_latin.11.d: "Medina, the burial place of the Prophet Muhammad and one of the three holiest cities in the Islamic world, is no more. Its capture has been a critical objective of the Latin Empire’s “Last Crusade” right from the start, with special plans drawn up regarding its fate post-invasion. If anything is to be said, none could have possibly comprehended the sheer cruelty and hatred sweeping through every street and corner from the moment the defences were breached. Little remains, to the point where even the Emperor was rumoured to have collapsed from revulsion and guilt at the sight. No Christian warrior left the ruins with their innocence intact, with many not even retaining their sanity. His Holiness’ Papal Emissary has utterly decried the barbarism in a scathing report sent to the Holy See, denouncing the Latin forces as a horde of beasts to which the Saracen cannot ever hope to compare. With word of the Enlightened City’s harrying spreading like wildfire across the known world, even Christians - often hostile towards their Muslim counterparts - have united in protest against the Latin Empire’s cruelty. It seems that, despite supposedly carrying out the will of God, salvation is something which the Latins may never receive."
 ab_latin.11.a: "What have we done..? Oh God, why?!"
 ab_latin.12.t: "The Lights of Cordoba, Extinguished"
 ab_latin.12.d: "Considered to be one of the beacons of Islam in the West, the great city of Cordoba demonstrated time and again to be a breeding ground of malicious intent against the Righteous Crusade of the Latins. The Umayyad Dynasty is no stranger to putting Christendom into a stranglehold, as demonstrated with their cruel victory at Valencia so many years ago. With the inevitable encroachment of the Cross, though, the heathens’ hopes for victory have been dashed. Islam’s throat now finds a dagger plunged deep within, as the Latin Empire walks away with entire caravans of plunder; countless artefacts and treasures shipping back to Jerusalem. The city, deprived of its splendour for the first time in history, may soon be doomed to lie in everlasting decay; a fate embodied by the still-smouldering husk of the Great Mosque of Cordoba. The Catholic world, albeit horrified by the unspeakable brutality demonstrated by the Latins, still rejoices at the death-blow dealt to one of its most dogged foes. Andalusia likely won’t last much longer if the Latin Empire keeps up the offensive, though should they grow complacent and fail to press the advantage, it may eventually be Jerusalem under Muslim occupation instead."
 ab_latin.12.a: "I long for the vanished gardens of Cordoba…"
 ab_latin.13.t: "Byzantine Court Traditions"
 ab_latin.13.d: "We may have toppled the previous, Greek-ruled administration, who had foolishly clung onto the Roman titles and styles, yet much of the population is still hostile to our rule. One way in which we could try and endear the people - or at the very least those who matter: merchants, bureaucrats, and landed nobility - is to re-establish the Byzantine court traditions. While disgustingly decadent and overcomplicated, if we were to add a Latin touch to things, the Empire would probably benefit from a smoother cultural transition. Of course, we can always establish a full-blown feudal court system, but there would likely be overwhelming hostility from all within Constantinople as well as a high chance of insurrection. Those stubborn Greeks, if anything, do care about their heritage…"
 ab_latin.13.a: "Very well, adopt the court customs"
 ab_latin.13.b: "We are servants of God, not Greeks!"
 ab_latin.14.t: "Saint Baldwin"
 ab_latin.14.d: "Baldwin IV de Anjou, Crusader-King of Jerusalem in the late 12th and early 13th Centuries, was without a doubt the greatest of his kind in all of history. Readily defeating the Saracens time and again, he was the only man known to have beaten the great heathen Saladin in battle. His popularity was so great that the Christians of the Holy Land took to demanding that he become a household saint, and yet the Catholic Church has done nothing to canonise this great man. With the Faithful’s grip over Rome as secure as we could hope, there is little shock at the mention that His Holiness the Pope may be “convinced” to see to Baldwin the Great’s elevation of status. After all, he was the one responsible for Christianity’s survival in the Near East even well after his death. What better way to honour such a great role model than this?"
 ab_latin.14.a: "May he rest easy, knowing all was not in vain"

