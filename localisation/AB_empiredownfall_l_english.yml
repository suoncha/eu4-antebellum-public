# Ideas #
 lot_fifth: "Colonial Ambition"
 lot_fifth_desc: "News of this so-called New World has reached our court for years now, confirming that there exists land across the Atlantic ripe for conquest. Now many kingdoms like ourselves hunger for these unclaimed riches. Like our rivals, we will set out to claim vast territories for our people to fund our grander campaigns in Europe."
 lot_first: "Imperial Entrance"
 lot_first_desc: "In order to weaken the Carolingian West Francia, the Ottonians have detached the Lotharingian realm from Francia and removed it from the Frankish suzerainty. Under the mighty Hohenstaufen dynasty, we shall re-enter the empire and claim our rightful place as the emperors!"
 LOT2_ideas: "Lotharingian Ideas"
 LOT2_ideas_start: "Lotharingian Traditions"
 LOT2_ideas_bonus: "Lotharingian Ambition"
 lot2_european_empire: "Europa Universalis Imperii"
 lot2_european_empire_desc: "Charlemagne briefly united much of Europe under his sway. Our destiny is to complete what he started and restore the unity last seen in the days of Rome to Europe."

# Reforms #
 lotfmelish: "Professionalise Flemish Pikemen"
 lotfmelish_desc: "The Flemish pike militias of the low countries have proven their use as an effective fighting force, particularly against the landed nobility. By modernizing and professionalizing them we can create a new loyal and strong pike army free of noble intervention."
 lotreform: "Reform the Missus Dominicus"
 lotreform_desc: "The Missus Dominicus is an old Carolingian official who is centrally appointed to supervise the administration and judicial goings-on of a province. Given our precarious geopolitical situation, we need to retain more control over the old noble magnates. By reestablishing the old office, we can hope to reduce corruption and increase our revenues."
 lotdutch: "Dutch Regiments"
 lotdutch_desc: "With our wealth limitless and our enemies encircling us, we must always evolve and adapt to defend our realm. The Dutch to our north have developed highly effective firing tactics and organization. By integrating these Dutch regiments into our army, we can continue to adapt and keep up with our rivals."
 lotculture: "Lotharingian Court Culture"
 lotculture_desc: "Situated on the crossroads of many cultures and empires, a unique culture amongst our elite has evolved. They speak an amalgamation of Dutch, Flemish, French, German, and English while being uniquely Lotharingian. By promoting this new culture we can not only strengthen our cohesion, but also communicate better with our neighbors."
 lotprinces: "The Merchant Princes"
 lotprinces_desc: "With staggering amount of wealth flowing into the low countries from the New World and Asia a new wealthy class has emerged. These new nobility have made their fortunes abroad and bought into the noble class. By using them as officials and Governors we can hope their entrepreneur spirit will rub off on our administration."
 lotbannum: "Revive the Bannum"
 lotbannum_desc: "Although we are more decentrilized state then we would like to admit, we do need a way to centralize power in case of a crisis. By reviving the Carolingian bannum, or imperial ban, we can create enough executive power to take charge should dire circumstances arise."
 lotstates: "Confederation of States"
 lotstates_desc: "We must embrace our identity as an amalgimation of many faiths, languages, feifdoms, and cities. By officially accepting this nature and signing into law a bill of federation, we can hope to strengthen ourselve internally through tolerance and unity."
 mechanic_flemish_mercenaries_no_professionalism_yes: "The §YFlemish Company§! mercenary company costs no §YArmy Professionalism§!"
 mechanic_trade_buildings_dev_yes: "Provinces with a §YMarketplaces§!, §YTrade Depots§!, §YStock Exchanges§!, or §YGreat Markets§! have a §G10%§! chance of granting §G1§! additional £dip£ development when increasing the £dip£ development"

# Decisions #
 form_middle_francia_title: "Form Middle Francia"
 form_middle_francia_desc: "This decision allows you to form the cosmetic tag of Middle Francia."

# Events #
 ab_lot.2.t: "The Hohenstaufen Dynasty"
 ab_lot.2.d: "The powerful House Hohenstaufen has ruled the Lotharingian state for decades. The dynasty was presumed to have died out but it now seems that there still exists a member, although their claim to the throne is considered weak. Since [Root.Monarch.GetName] currently lacks an heir, should we perhaps acknowledge this Habsburg as a legitimate heir?"
 ab_lot.2.a: "The House of Hohenstaufen must return!"

# Modifiers # 
 lom_diplomacy: "Italian League"
 lot_arelat: "Arelat Restoration"
 lot_ascendant: "Bane of the Carolingians"
 lot_emperorship: "Imperator Romanorum"
 lot_enter: "Imperial Entrance"
 lot_evolving_modifier: "Europa Universalis Imperii"
 lot_hohenstaufen: "Uniting Hohenstaufen Possessions"
 lot_lion: "Claimed the Lion's Throne"
 lot_middle: "Restore Middle Francia"
 lot_naval: "Naval Dominance"
 lot_nether: "Lotharingian Netherlands"
 lot_war: "War Preparations"
 hohenstaufen_century: "Hohenstaufen Century"

# Missions #
 lot_aachen_title: "Imperial Capital"
 lot_aachen_desc: "Aachen was the glorious capital of Charlemagne's Empire. Now it is just a small village, unworthy of its great history. We must renovate Aachen to be a city of splendor, prestige and glory!"
 lot_bohemia_title: "Return of the Hussites"
 lot_bohemia_desc: "The overthrow of the Hohenstaufens in Bohemia is downright scandalous! Jiri z Podebrad has no right to their throne! It is time for us to claim Bohemia's throne for ourselves and execute this heretic for his ludicrous actions!"
 lot_calais_title: "Recover Calais"
 lot_calais_desc: "Calais is a province of extreme value due to the amount of trade and money that flows through it. We must acquire it before the Frankish do. Besides, the Angelcynn have no place in continental European affairs!"
 lot_czech_throne_title: "The Lion's Throne"
 lot_czech_throne_desc: "Through war we have managed to reclaim Bohemia's throne for the Hohenstaufen dynasty! The Personal Union we have enforced on the Bohemians can only help us in our ambitions."
 lot_emperor_title: "Imperator Romanorum"
 lot_emperor_desc: "Through some masterful diplomacy, we have been able to coerce the Imperial Electorate to vote for us! We are now the Emperor of the Holy Roman Empire. We shall try to keep this prestigious position as long as possible."
 lot_francia_title: "Control West Francia"
 lot_francia_desc: "The struggle between our nation and our rival to the west has finally come to an end - Lotharingia stands victorious! The Carolingians are no more - we are the sole power of the region!"
 lot_holland_title: "Conquer Holland"
 lot_holland_desc: "The land of the Dutch is just what we need to weaken the Angelcynn economy! The more we take, the further they fall!"
 lot_lowlands_title: "Invade the Low Countries"
 lot_lowlands_desc: "Our entry into the Holy Roman Empire has removed the complications that came with attacking the nations of the Lowlands. Only smaller, petty states now stand in the way of restoring Middle Francia!"
 lot_lwb_title: "Conquer Cisjurania"
 lot_lwb_desc: "With our annexation of Upper Burgundy in past years, the dreams of a united Arles under the Welf have been shattered. It is time for us to strike the final nail into the Welf coffin!"
 lot_paris_title: "The Empire's Downfall"
 lot_paris_desc: "Francia has buckled under the pressure of our fire and steel. Paris, the Imperial Capital, is ours! A great blow has been struck upon the Frankish. We are triumphant! And now is the perfect time to integrate ourselves into the Empire that surrounds us."
 lot_prepare_title: "Prepare for War"
 lot_prepare_desc: "There has never been a better time to expand our national boundaries than now! The Frankish are weak and tired due to Lothair III's foolishness! It is time for us to muster our forces and prepare to fight!"
 lot_rhineland_title: "Rhenish Advance"
 lot_rhineland_desc: "Our conquest of Aachen has expanded our possibilities in the Rhineland. The industrious land in the East of the Rhine river is ours to claim!"
 lot_rivalry_title: "English Naval Rivalry"
 lot_rivalry_desc: "The Angelcynn are known as one of the great naval powers of Europe, but with the amount of ducats we are getting from Channel trade, we might be able to throw our own navy into ring. Lotharingian naval dominance will be another great blow to the Angelcynn, leaving them stranded on their muddy island!"
 lot_swabia_title: "Claim Swabia"
 lot_swabia_desc: "Now that we have the Rheinland and Bohemia under our control, it only makes sense to unite all Hohenstaufen lands. The king of Swabia is too stubborn to realize the greatness that this entails, so we will have to show it to him forcefully. Gather the men!"
 lot_tide_title: "Turn the Tide"
 lot_tide_desc: "With each year, the Frankish fall off of their pedestal of power ever so slightly. Their Succesion Crisis has brought them ruin and damnation, and to us it has brought gifts most wonderful."
 lot_trade_title: "Secure Channel Trade"
 lot_trade_desc: "The Angelcynn have had a monopoly on Channel trade for centuries, but it would seem that we are slowly dislodging their grasp on it. If we continue on like this, we might be able to significantly weaken their economy and place ourselves in the center of all Channel trade."
 lot_upb_title: "Claim Upper Burgundy"
 lot_upb_desc: "The bickering of the Welfs is nothing more than pathetic. It is time for us to intervene in this whole affair - we shall annex Upper Burgundy into Lotharingia and stop this feud once and for all!"

