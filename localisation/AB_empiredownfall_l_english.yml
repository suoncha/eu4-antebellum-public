# Ideas #
 FRC_ideas: "Frankish Ideas"
 FRC_ideas_start: "Frankish Traditions"
 FRC_ideas_bonus: "Frankish Ambition"
 FRC2_ideas: "Frankish Ideas"
 FRC2_ideas_start: "Frankish Traditions"
 FRC2_ideas_bonus: "Frankish Ambition"
 FRC3_ideas: "Frankish Ideas"
 FRC3_ideas_start: "Frankish Traditions"
 FRC3_ideas_bonus: "Frankish Ambition"
 frc_first: "Exercise the Bannum"
 frc_first_desc: "Bannum is the right to rule and command our territories, raise armies and exercise justice. We must make use of Bannum in order to retain our ability to command the army and retain our general authority to order and punish."
 frc_second: "Reconquest of the Eastern Empire"
 frc_second_desc: "The Carolingian dynasty lost the German throne in the early 10th century. The ambitions of our rulers and generals must push us forward so that we may eventually reunite the empire that was broken so many years ago."
 frc_sixth: "Capitularies"
 frc_sixth_desc: "Capitularies are written records of all decisions undertaken by our Emperors. They are one of the most important sources for the governance of the Frankish realm."
 frc_third: "Reform the Salic Law"
 frc_third_desc: "Salic law provides written codification of both civil law, such as the statutes governing inheritance, and criminal law, such as the punishment for murder. We must reform it to ensure that it is up to date with our rapidly changing society."
 frc_fourth: "Carolingian Dynasty"
 frc_fourth_desc: "The Carolingian dynasty is the most powerful noble house of Europe. At its peak, the thrones of five separate kingdoms belonged to the members of our dynasty. We shall restore the glory of our house and perhaps even start a new golden century!"
 frc_fifth: "Lords of Europe"
 frc_fifth_desc: "The Franks have established the largest empire in Europe since the fall of the Western Roman Empire. The fact that it has endured for 900 years just proves our right and legitimacy to rule."
 frc_fifth2: "Lords of Europe"
 frc_fifth2_desc: "The Franks have established the largest empire in Europe since the fall of the Western Roman Empire. The fact that it has endured for 900 years just proves our right and legitimacy to rule."
 frc_seventh: "Imperial Court"
 frc_seventh_desc: "To maintain our reputation and good relations with our subjects, we have established the Frankish Imperial Court - a place where the lords of Francia and the numerous princes of the Holy Roman Empire gather to talk and negotiate about important matters and decisions."

 BOU_ideas: "Bourbon Ideas"
 BOU_ideas_start: "Bourbon Traditions"
 BOU_ideas_bonus: "Bourbon Ambition"
 bou_first: "Dynastic Links"
 bou_first_desc: "Members of the House of Bourbon married into the greatest and most powerful royal houses in all of Europe, thus gaining invaluable diplomatic power."
 bou_second: "Strategic Geography"
 bou_second_desc: "The central geography of Bourbon in France, bordering important political entities such as Aquitaine, Auvergne, Burgundy, and Savoy made Bourbon important politically. "
 bou_third: "Elevation to Duchy"
 bou_third_desc: "The elevation of Louis I de Clermont to Duke indispensably elevated Bourbon's place in French society. The elevation made Bourbon equal or even higher in rank than some of the traditional peers of the French Kingdom, surpassing even the counts of Toulouse and Flanders, historically the most powerful and prestigious vassals to the kingdom."
 bou_fourth: "Kings of France"
 bou_fourth_desc: "Of all the royal houses in Europe, it was that of the House of Bourbon which made the correct strategic royal marriages that allowed its members to become Kings of France following the extinction of the Carolingians. The position brings much power and glory and showcases the success of our family, the very same goal countless other members of European royalty like the English tried but failed to achieve."
 bou_fifth: "Bourbon Empire"
 bou_fifth_desc: "By the French Revolution, members of the House of Bourbon were ruling over France, Iberia, Italy, and vast colonial holdings in the New World and Asia. Few other royal houses with a story and background such as ours can say the same things."
 bou_sixth: "Le Roi Soleil"
 bou_sixth_desc: "Under the rule of Louis XIV, the power of the French monarchy expanded significantly. The nobles of France lost most of their power during those decades and as a result Louis XIV possessed powers French kings did not have since the beginning of the Middle Ages. But with those powers France could muster new levels of political and military prowess. Time can only tell about the rise of France."
 bou_seventh: "Lessons of the Revolution"
 bou_seventh_desc: "After the Bourbon Restoration in 1814, Louis XVIII reigned under a constitutional monarchy, unlike his absolutist Bourbon predecessors. The king allowed for the creation of a constitution, granted freedom of press and religion, rule of law, property rights, and guaranteed the public debt, knowing that the French public would easily revolt in a repeat of the Revolution. Those changes are for the better."

# Reforms #
 frankish_crown: "Frankish Monarchy"
 frankish_crown_desc: "Even though Feudalism had not caused the Western Frankish Kingdom to fragment as much as the Eastern Empire had, the bonds of vassalage and granting of fiefs still plays an important role in Frankish society. A ruler has to have the support of the feudal lords and the most powerful of them are there to keep his power in check."
 frapalatium: "Palatium"
 frapalatium_desc: "Historically, the Frankish Emperors relied on Palatium, a shifting assemblage of family members, trusted lay and ecclesiastical companions, and assorted hangers-on, which constituted an itinerant court following the king as he carried out his military campaigns and sought to take advantage of the income from widely scattered royal estates. Members of this circle, some with titles suggesting primitive administrative departments, performed on royal orders various functions related to managing royal resources, conducting military campaigns and diplomatic missions, producing written documents required to administer the realm, undertaking missions across the kingdom to enforce royal policies, rendering justice, conducting religious services, and counseling the king."
 fracavalry: "Frankish Knights"
 fracavalry_desc: "The strong cavalry traditions of our armies date back to the times of Charles Martel. Even the mighty Emperor Charlemagne used large numbers of cavalry during his campaigns of conquest. We must further strengthen the position of cavalry in our armed forces and equip them with the newest weaponry so that they may wreak havoc on the battlefield."
 frcoriflamme: "Institute the Porte-Oriflamme"
 frcoriflamme_desc: "The practice of using standards in warfare dates all the way back to the time of the Romans, with regiments rallying behind their standard and generals using this to organize armies more efficiently. Recently, however, each Duke and Noble in the Kingdom has their own system of standards, making it difficult for us to organize a cohesive army. Instead, let us create a uniform standard system for our regiments, allowing for cohesion and unity between ranks."
 frcfeudalism: "Strengthen Frankish Feudalism"
 frcfeudalism_desc: "The Frankish realm has always relied on the loyalty of Dukes and Nobles to keep the state together. We should further expand this and grant more autonomy to our vassals. This allows us to not have to directly handle the burden of managing their land and ensures that the nobles stay loyal. Of course this weakens the central authority of the King, but earning the loyalty of our vassals is worth it."
 mechanic_unlocks_strong_duchies_privilege_yes: "§GUnlocks§! the §YStrong Duchies§! privilege."
 frcassembly: "Imperial Assembly"
 frcassembly_desc: "The Imperial Assemblies and Diets have constantly changed purpose and organization over the past few centuries. Originally serving as an advisory and law-making body for Charlemagne, the Assembly slowly but surely weakened the power of the Emperor over time in favor of the Princes. It is now time for us to reform this system into something that fits our interest more. This new Imperial Assembly will serve as a confirmation of Frankish supremacy across the Empire, and allow us to return powers delegated to the Princes."
 mechanic_gain_dip_on_emperor_reelection_yes: "Grants §G100§! £dip£ upon each successive Imperial re-election."
 frcstate: "State Catholicism"
 frcstate_desc: "The Catholic Church and the Franks have always had a deep history together. Starting with the Baptism of Clovis and the conversion of the Franks, to the coronation of Charlemagne, to the Crusades in the Levant and Iberia, The King and the Church have always had a special relationship. It is time we further solidify this relationship into law, making Catholicism our official state religion and persecuting heretics and heathens alike. Grand Dieu Sauve le Roi!"
 frcrepresentatives: "Representatives of the Empire"
 frcrepresentatives_desc: "The Holy Roman Empire is a diverse and complicated mess of Princes, clergymen, and a growing burgher class. If we are to effectively rule over such a mess, it must be organized to prevent conflicts and bloodshed between these estates. We will create a department entirely dedicated to handling the disputes between Princes to keep the Empire together."
 frcrenaissance: "Second Carolingian Renaissance"
 frcrenaissance_desc: "Before the reign of Charlemagne, Europe was going through a dark age in its history. Literacy, law, order, arts, and culture had all disappeared with the fall of the Western Roman Empire. It was not until the rule of Charlemagne and his descendants that these ideas would return and flourish in the Frankish Empire. The Renaissance in Italy is not unlike the Caroligian one that took place centuries earlier, and we should strive to fund the arts and sciences to create a new Carolingian Renaissance centered around Francia."

# Decisions #
 form_carribean_title: "Unite the Caribbean"
 form_carribean_desc: "Our people have endured years of foreign meddling, subjugation, incursions, and our lands divided... Enough! The time has come to liberate and unite our people under one banner, and write our own destiny."
 frankish_empire_title: "Form the Frankish Empire"
 frankish_empire_desc: "For centuries, Carolingian have held both the Crown of West Francia and the Imperial crown of the Holy Roman Empire. However, the eastern Empire turned into a chaotic complex that is too difficult to govern. The time has come to reunite our Empire, not by politics but by force. The Holy Roman Empire must be dismantled and the German princes must bend the knee before the new Emperor of the Frankish Empire."
 cosmetic_tag_info: "§R Country formed by this decision is a cosmetic tag. It does not change your national ideas or missions.§!"
 frc_move_capital_title: "Move the Capital to Aachen"
 frc_move_capital_desc: "The city of Charlemagne has become nothing but a shadow of its former glory. It is time we renovate Aachen to match and extend its past splendour as our new capital city."
 rename_west_francia_title: "Rename the country to West Francia"
 rename_west_francia_desc: "This decision allows you to change the name of your country to West Francia."
 AB_TURN_CNS_INTO_PRESET_CNS: "All our §YGeneric Colonial Nations§! will be changed into their equivalent §YPre-set Colonial Nations§!"

# Events #
 ab_francia.1.t: "Reclamation of Calais"
 ab_francia.1.d: "With the surrender of the English garrison, the trading hub which had mockingly been dubbed “Calen” for so long has finally returned to its rightful owners! Renamed to Calais once again, the royal standard flies from every government building in the city and jubilant soldiers parade in the streets. Frankish merchants have even begun to re-enter and greatly boost commerce. There is one massive thorn in Francia’s side, however. In the centuries since its capture, the population of Calais was most cruelly displaced as the vile invaders spread into the streets and festered. What was left behind was a gaping wound in the empire’s former staple port. This shall stand no longer, if the merchants have anything to say about it. The English have been bad for business, and worst of all, they refuse to submit to our sovereignty! Several plans have been drawn up which may assist in dealing with the English question, and forcing them off the continent - at least for the time being."
 ab_francia.1.a: "Eye for an Eye! Tooth for a tooth! Rid Calais of the English pestilence!"
 ab_francia.1.b: "Perhaps we can invite the Calaisien diaspora to return"
 ab_francia.1.c: "Given time, they will come to see our splendour"
 ab_francia.2.t: "Fall of Cordoba"
 ab_francia.2.d: "The heathen Umayyad dynasty plagued the Iberian Peninsula for what seemed like an eternity. That was, at least, until recent strokes of good fortune saw the Andalusian Caliphate on the back foot. The Christian reconquest of what were once the Visigothic kingdoms has perhaps saved the Cross from being shattered in the West, if only for a time. The city of Cordoba - a sight so magnificent that even His Holiness’ legates marveled at what the Moors had built - now rests in Christian hands, where it shall now remain for all time, God permitting. This did not come without significant cost, however, as the victory of the Cross could at best be described as heroic, but more cynically as pyrrhic. Following weeks of skirmishes and several artillery barrages, Umayyad forces amassed outside the battered gates, unwilling to let the heart of the Caliphate be tarnished by blood and steel. Indeed, the hearts of Francia’s finest wavered upon seeing such a great host muster. Were it not for the siege commander’s rallying cry and subsequent charge into the Caliph’s ranks, the battle may have turned into a rout. The Frankish army, which failed at Valencia all those years ago, has at last found its redemption."
 ab_francia.2.a: "I bid you stand, Men of the West!"
 ab_francia.3.t: "The Price of Education"
 ab_francia.3.d: "With the lack of revenue coming into the state due to both the failing economy and ongoing crisis, even much of the royal treasury has been pawned off to try and cover some of the costs. This disaster has proven to be a dismal affair for the learned men of Francia, especially those in the universities and administration. Having been unpaid for months on end, the literate have resorted begun emigrating to other corners of the Holy Roman Empire in search of new – hopefully wealthy – employers. Even much of the royal court has started to walk out, as only the most important advisors have been given any sort of financial compensation over the past year. The matter at hand is dire, for little can be done when funds would be better redirected into maintaining the levies at maximum capacity. Some have opted to stay in court, with the fleeting hope that they might make a convincing enough case to have incomes restored."
 ab_francia.3.a: "Aren't these just their tuition fees?!"
 ab_francia.3.b: "A necessary sacrifice, if we’re to win"
 ab_francia.4.t: "In the Search for Revenue"
 ab_francia.4.d: "The devastation caused by the disastrous crusade in Andalusia has seen Francia fall into a deep recession. With the realm’s coffers empty and thousands of men – who would have otherwise worked the fields – never returning from the war, tax revenue has dropped to a mere trickle of what it once was. It doesn’t help that, in order to appease the nobles, taxes were eased to “compassionate levels” for their “unfathomable losses”. It is clear now that such a decision failed to do anything but give the barons carte blanche to pay as little tax as possible, and Francia as a whole suffers for their greed. The threat of famine now seems all too real without men working the fields or the income to import food from abroad. Some of the more daring courtiers have suggested that the taxes be increased once again in order to help rebuild the kingdom’s economy and countryside, but nobody will be too keen about seeing the sheriffs making the rounds once more."
 ab_francia.4.a: "If they cannot pay, we all suffer"
 ab_francia.4.b: "Their contributions are appreciated"
 ab_francia.4.c: "We're saving them from their greed!"
 ab_francia.4.ce: "Bleed them dry!"
 ab_francia.5.t: "An Ignoble Concession"
 ab_francia.5.d: "The Andalusian Crusade was, in its build up, a highly popular matter amongst the commons and nobles of Francia alike. Many contributions were donated to the coffers of the crusading army, including extensive loans from a number of eminent barons within the realm. The barons were promised reimbursement in the form of tribute which would be offered to them in annual payments by the Andalusian Caliphate, in the event of a Crusader victory. Unfortunately, the massacre of the emperor and much of the nobility at Valencia - and the attrition suffered by the survivors - saw a crushing defeat for the Catholics which has spiraled Francia into crippling debt. Now, one of the barons who had promised the old sovereign a loan for the crusade has demanded that he be compensated immediately, as many of his men failed to return and his lands are falling on hard times. It would certainly be a great boon to keep the barons on side, but Francia’s coffers are sorely depleted. The case is clear: cave to a subordinate’s demands, embarrassing the crown in the process, or face open rebellion, sowing the seeds of further trouble."
 ab_francia.5.a: "Here, I hope you choke on it!"
 ab_francia.5.b: "Throw feed to a bird, and more will flock"
 ab_francia.5.c: "The debt is forfeit, as are this traitor’s lands!"
 ab_francia.6.t: "Enemies Abroad"
 ab_francia.6.d: "Lotharingia, that failed state held together by vile traitors and Hohenstaufen nepotism, has decided to take advantage of our inconvenienced disposition to launch a series of raids against Frankish border towns, looting and burning as they go. While the emperor would have launched an immediate and righteously brutal response in fairer winds, the tempest Francia is swept up in refuses to die down. As much as the people may lose confidence at Francia’s inability to react to hostile intent, they ought to realise that, in these trying times, battles must be chosen. This humiliation will not be forgotten, that much is assured. If the increasing number of totally desolate villages is anything to go by, the Lotharingians know their day of reckoning will come. No matter how quickly the succession crisis is resolved, the time for retribution will not come soon enough for those treacherous curs."
 ab_francia.6.a: "Some day, we'll skewer them like pigs!"
 ab_francia.7.t: "Enemies at Home"
 ab_francia.7.d: "With the ongoing chaos bringing Francia to its knees, it was perhaps inevitable that many of the downtrodden and frankly malcontent peasantry would see the rebelling barons as a sign that the paradigms were soon to shift in their favour. Whether to garner support from who they believe to be the future rulers of France, or just to spite the system, reports have come in from sheriffs and magnates that sizeable groups of serfs have been proclaiming opposition towards their rightful liege. While disobedient commoners is bad enough, matters have been made worse by word that droves of young men have entered the service of the rebel forces, evidently trying to bring about the Empire’s downfall. Little can be done, as the state’s resources and manpower are diverted elsewhere, leaving a number of villages almost entirely lacking in able-bodied men of fighting age. The days ahead look grim for Francia, for the people are losing faith."
 ab_francia.7.a: "We should’ve clapped the peasantry in irons!"
 ab_francia.8.t: "Lothair's Heir"
 ab_francia.8.d: "Perhaps finally coming to acknowledge the true gravity of his predicament, Emperor Lothair has seen fit to, amidst the raging civil war, introduce one of his numerous suspected bastards to the court as his legitimate heir. Everyone has had their suspicions about who the Last Carolingian’s progeny might be – especially given that, to this point, the fact that he has numerous concubines throughout the realm was an ill-kept secret at best. Many more bastards likely remain anonymous to the realm, and may potentially be oblivious to their illegitimate heritage, but it is clear that a slapdash effort at grooming the so-called “true heir” was made in recent years – if not months or weeks. This has obviously caused tremendous uproar amongst not just the aristocracy, most of whom had wished for Lothair to shrivel up and die, but also the clergy, as they had neither legitimised nor approved of this child born out of wedlock. While the Carolingian line might be able to preserve itself in a greatly weakened state now that Lothair has a confirmed son, the ramifications for the dynasty’s place in the Frankish realm will be felt well after the revolt has ended – regardless of which side wins. Indeed, this rash choice may have even bolstered the barons’ cause, as few would willingly bend the knee to an until-recently unheard-of upstart."
 ab_francia.8.a: "In time, they will love him as they love me!"
 ab_francia.8.b: "A bastard as king? I'd sooner be Andalusian!"
 ab_francia.9.t: "Imperial Reinforcements"
 ab_francia.9.d: "Loyal supporters of the Emperor from Germany have arrived to the capital where they have reaffirmed their loyalty and have sworn to fight the traitors who are attempting to overthrow the last Carolingian."
 ab_francia.9.a: "They will bolster our ranks!"
 ab_francia.9.b: "We will use them elsewhere"
 ab_francia.10.t: "The Birth of a Permanent Taxation System"
 ab_francia.10.d: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] remodeled Frankish finances, established heavy taxation, particularly through the taille, a direct land tax. Extracting the wealth of the land has always been a tough nut to crack for the centralizing Frankish kings. To tap the vast riches of the Frankish lands new and improved taxation methods were needed time after time. Throughout history the methods used became more and more rationalized to optimize gains for the treasury. The Birth of a Permanent Taxation Systems was a major step towards this aim."
 ab_francia.10.a: "Issue it"
 ab_francia.11.t: "The State takes control of the Guilds"
 ab_francia.11.d: "The word gilde, or ghilde, is but one of many terms used formerly in Francia and in the Low Countries to denote what the more modern word corporation stands for. In Francia and the Low Countries a guild was originally a sort of fraternity for common support, protection, and amusement. The members paid each a certain contribution to the common fund. After the end of the fifteenth century, under the despotic rule of the Frankish kings, the guilds ceased to be a means of protection for a majority of their members. Their privileges became a means of filling the royal coffers at the expense of the employers."
 ab_francia.11.a: "Take Control of the Guilds"
 ab_francia.11.b: "Do not mess with the Guilds"
 ab_francia.11.c: "Give more control to the Guilds"
 ab_francia.15.t: "The Valencian Centenary"
 ab_francia.15.d: "Who could ever have believed that a full century has passed since that fateful day in 1443, at Valencia. Addressing the crowd in Paris, the king vividly describes the events which took place in the bloody Battle of Valencia, capturing their attention. From the near-capitulation of the city’s Umayyad garrison, to a mass charge by Umayyad cavalry sweeping aside much of the Frankish vanguard, it was almost as though the king was there himself. He sang the praises of the heroic German mercenaries and Iberian Christians, who - though overwhelmed - fought to the bitter end in order to buy the other Crusaders time, while also condemning the Italians, who had fled prior to battle without alerting the Franks to the approaching Umayyad host. Even admitting respect for Valencia’s crafty garrison commander, who led the remaining defenders in a final sally against the Imperial besiegers and catching them off guard, drew mutual agreement from those in attendance. The most poignant tribute was, of course, to the valiant last stand of Emperor Robert IV, who had along with his retinue fought their way to the Caliph’s honour guard, but were ultimately cut down after a final holdout. Robert the Blessed, as he is known to the people of the Holy Roman Empire, would have been survived by his only child, Crown Prince Louis, had he not also been slain in the battle; cut down while trying to retrieve his father’s standard. The king made pertinent use of the ensuing Carolingian Succession Crisis as a warning that one should never overestimate their own abilities if their position is precarious in nature, but concluded the speech with a solemn vow to ensure that Christendom will be avenged for its staggering losses, for a repeat of Valencia was out of the question. Ending the ceremony with a memorial parade around the centre of Paris and the laying of a wreath at the tomb of Blessed Robert, the sight of several thousand Parisians - noble and commoner alike - performing hymns of praise and commemoration was a stirring moment to behold. The promise of reclaiming lost honour lingered amongst the populace until the next day, by which point everything returned to the way it was two days prior."
 ab_francia.15.a: "Lest we forget"
 ab_francia.16.t: "Army Deserters"
 ab_francia.16.d: "The morale of our troops, devastated by the loss in the Andalusian Crusade has been steadily sinking and groups of deserters have been spotted joining the rebel ranks. If this continues, there is no way we can stop our soldiers from deserting."
 ab_francia.17.t: "Lothair Accuses the Barons"
 ab_francia.17.d: "The emperor committed an absolute faux pas today in front of the court and his subjects. Angered by the result of the recent events, Lothair accused his vassals of plotting against him and supporting the rebels who are attempting to overthrow the last Carolingian. Many of the barons left the council without saying a word, which in turn only strengthened Lothair's conviction that he is right about their treachery."
 ab_francia.17.a: "Traitors will be hanged!"
 ab_francia.18.t: "The Valencian Centenary"
 ab_francia.18.d: "The world as it is now bears little resemblance to how it was at the time of not just the Andalusian Crusade, but also the First Centenary in 1543. The rapid technological, social, and cultural paradigm shifts have regularly swept away traces of the old world at unprecedented scale, but there is still one thing which will be forevermore etched into the hearts and minds of the French people: the memory of the Battle of Valencia. Such a ruinous occasion, yet also full of many chivalrous anecdotes, the occasion has become near-legendary. It is for this reason that, even centuries after the battle took place, the people of France will readily gather for a solemn day of memorial to honour those who perished during the Andalusian Crusade. Little about the ceremony - outside of the kings’ speeches - have changed over the years, emphasising just how culturally impactful the Battle of Valencia’s lingering spectre is. Promises of peace made at these occasions never last long, but even then, the hope included is enough to hold on to. Whatever happens in the future, on this day the people are reminded of one thing: Never another Valencia."
 ab_francia.18.a: "Eternal peace for the glorious dead!"
 ab_francia.20.t: "Troubles in England"
 ab_francia.20.d: "The English nobility are troubled by the current state of their country. Since the coronation of their current king, the country has been in shambles and the discontent towards the throne is higher than ever. In these dire times, a message from the English nobles has reached our royal court, requesting military help in return for certain concessions. While many believe that this is a perfect opportunity to bind England to Francia, others warn that such an action could have very negative outcome and we are perhaps not even capable of providing any sufficient help."
 ab_francia.20.a: "We wont get a better chance"
 ab_francia.20.b: "There is nothing we can do"
 ab_francia.21.t: "Pretender Rebellion"
 ab_francia.21.d: "The nobles of England have risen in an open rebellion against the crown, blaming the monarch for his incompetence and current troubling state of the country. What is even more shocking is that they must have receive both financial and military support from the Carolingian Francia, since their goal is to replace our monarch with a member of the Carolingian dynasty!"
 ab_francia.21.a: "Carolingians, prepare for another Valencia!"
 frc_refused_membership: "Refused the Imperial Membership"
 ab_francia.29.t: "Fate of Iberia"
 ab_francia.29.d: "Taking advantage of the Andalusian crisis, the Frankish king has proposed that we join the Holy Roman Empire.  Our position in the region is precarious: should Andalusia emerge from their crisis,  we would risk death by their hands at a moment's notice. We would therefore benefit greatly from the emperor’s protection against the Islamic pagans. More importantly – with the empire's ressources at our disposal - we could turn the tide, save the Catholic regions of Iberia, and perhaps even destroy the Islamic caliphate for good! However, we would also lose our political independence, and become little more than vassals of the Franks. Not to mention that the Carolingians have already shown their incompetence in the disaster at Valencia."
 ab_francia.29.a: "There is no other way"
 ab_francia.29.b: "We will not become mere vassals of the Empire!"
 ab_francia.30.t: "Timed Mission Unlocked"
 ab_francia.30.d: "We have unlocked 'Safeguard Iberia' timed mission! We will be able to invite the Iberian kingdoms to join the Holy Empire and should we succeed, we will be able to complete the mission. Should they refuse the invitation or be conquered by Andalusia, the mission will be §Rpermanently removed§! from our mission tree."
 ab_francia.30.a: "Understood"
 ab_francia.31.t: "Fate of Iberia"
 ab_francia.31.d: "Finally, we have secured the succession of the Frankish kingdom. Although Francia will not fully recover for many years to come, it has so-far returned to stability and prosperity. On the other hand, Andalusia is still plagued by internal unrest, and the unity of the Caliphate is under threat. With the legitimacy of the Caliph reduced to nothing, we have the unique opportunity to fulfill our duty as Rex Christianissimus: we should offer protection to Iberia,  the bulwark of the true faith, through membership in the Holy Roman Empire. This would be nothing less than proper vengeance for the Battle of Valencia!"
 ab_francia.31.a: "God wills it!"
 ab_francia.32.t: "[From.GetName] Refuses the Invitation"
 ab_francia.33.t: "Timed Mission Failed"
 ab_francia.33.d: "We have failed to complete the timed mission either due to the Iberian kingdoms refusing our invitation or them being conquered by Andalusia. 'Safeguard Iberia' timed mission will be §Rremoved§! from our mission tree and replaced with 'Retain the Crown' mission."
 ab_francia.33.a: "Unfortunate"
 ab_francia.34.t: "Timed Mission Failed"
 ab_francia.34.d: "We have failed to complete the timed mission either due to the Iberian kingdoms refusing our invitation or them being conquered by Andalusia. 'Safeguard Iberia' timed mission will be §Rremoved§! from our mission tree and replaced with 'Retain the Crown' mission."
 ab_francia.34.a: "Unfortunate"
 ab_francia.35.t: "[From.GetName] Accepts the Invitation"
 ab_francia.35.d: "It is a great day for Christianity! [From.GetName] has officially joined the Holy Roman Empire. Let us prepare our armies for the final crusade, and begin the Reconquista. Tomorrow, we will fight together for God, and for Christendom!"
 ab_francia.35.a: "We shall avenge Valencia!"

 frankish_succession_crisis: "Frankish Succession Crisis"
 ab_frc_disaster_event.0.t: "Frankish Succession Crisis"
 ab_frc_disaster_event.0.d: "The Frankish realm is in dire straits, with the economy in tatters and the nobles squabbling amongst themselves. The Carolingian dynasty has sat upon the Frankish throne since the reign of Pepin the Short, ushering in a safe and secure society for their new empire - for a time. Though met with numerous crises before, many handled worse than anticipated, there is little doubt that the coming storm may prove to be the most catastrophic in Francia’s long and well-documented history. \n \nThe troubles began with the Andalusian Crusade, led by the Frankish emperor himself in an effort to liberate the Christians under Umayyad oppression. Sadly, despite making strong gains in the first few months, both he and his sole male heir met their end in the brutal Battle of Valencia. Much of the royal treasury had been put into funding this campaign, and many men were called off to war despite it nearing harvesting season. Thus, when the tattered remnants of the once-proud royal retinue entered the gates of Paris, it was clear that all the Frankish people had been banking on was lost. \n \nLothair, the late emperor’s estranged uncle, may not have been popular with the subjects, but as the last male Carolingian his claim was the strongest. This cruel new King of the Franks has done little more than embezzle the money owed to his own barons, inflict cruel and unusual punishments upon his enemies, and engage in utterly reprehensible acts of debauchery which have accrued further debt. His ignorance to the suffering of his own subjects and refusal to intervene in the economy have finally found the final nail needed to strike into Lothair’s coffin: his notable lack of any legitimate heir. Despite his many concubines in each of the royal residences, little evidence actually exists of Lothair having children - let alone male ones. Thus, fearing that the aging monarch’s lack of issue might spur a succession war the likes of which hasn’t been seen since the Ottonian Era, the nobles have presented Lothair with two options: to step down and enter self-imposed exile with a royal allowance, or face open rebellion."
 ab_frc_disaster_event.0.a: "The Estates General will not decide my fate!"
 ab_frc_disaster_event.0.b: "Throw my crown to the wolves, why don't you?!"
 ab_frc_disaster_event.1.t: "Frankish Succession Crisis"
 ab_frc_disaster_event.1.d: "Emperor Lothair was propped up on the Imperial Throne in the aftermath of the bloody Battle of Valencia by the nobility, however the Frankish courtiers’ hopes that he would prove a pliable and easily corruptible puppet-king have been dashed. Lothair is cruel and greedy, though he has proven himself utterly uncooperative and poses a serious risk to the position of the Frankish realms within Europa. The excesses and arbitrary attitude of Lothair have proven to be the last piece of kindling on his funeral pyre. The aristocrats of Francia have taken up arms against their liege. Claiming to be united under the banner of avenging the “criminal mismanagement” of the Empire’s dwindling finances, most of which had been lost in the wake of the Andalusian Crusade’s postwar economic crash, it appears the Carolingian dynasty’s days are numbered."
 ab_frc_disaster_event.1.a: "Blighted traitors!"
 ab_frc_disaster_event.2.t: "End of the Crisis"
 ab_frc_disaster_event.2.d: "What were once lush green fields are now desiccated and scorched hellscapes. Villages have been thoroughly plundered, towns razed, and cities filled to the brim with desperate refugees. Disease and poverty run rampant, the suffering far from over, but it is no small consolation to the people of Francia that - at the very least - the war has ended. Though hated by many and loved by few, the victors have prevailed over all hurdles thrown their way. Strategic thinking and good fortune saw the glorious armies stand victorious on the battlefield, with the opposition collapsing due to their petty hedonism and squabbles. With the last hostile stronghold capitulating, albeit begrudgingly, in the face of the triumphant party's supremacy as the sun rose overhead, the exhausted soldiers took it as a sign from the Heavens. Wary of the instability this war has caused, it appears that Francia's leadership has begun cracking down on suspected rivals and paying off potential allies, for rebellious sentiment can now only be upheld through backroom deals. Violent purges are likely to continue behind closed doors for the foreseeable future, yet all the unscathed dissenters and pretenders can do now is stare in horror, mouths agape, as they impatiently pray for their next shot at seizing power. An opportunity which may never arise again."
 ab_frc_disaster_event.2.a: "Peace in our time!"
 ab_frc_disaster_event.3.t: "End of an Era"
 ab_frc_disaster_event.3.d1: "Lothair Carolingian, the last of his bloodline, has accepted the merciful offer of the aristocracy, and will soon be led into exile with an armed escort of loyal retainers and household attendants. Faced with a national crisis based around his failure to remedy Francia’s woes and lack of legitimate issue, Lothair - for once - took the path of least bloodshed. Though there is still the threat of Lothair potentially siring a legitimate male heir while in exile, thus continuing the Carolingian dynasty, it would likely be nigh on impossible for any future claimants to garner enough support for their cause. Whatever the case may be, the current issue rests on which of the noble houses shall succeed to the throne in post-Carolingian France. It is an unenviable position, despite the allure of absolute authority, though the role must be filled. Whichever baron ascends to the throne will have made an enemy out of the others, and may be faced with a worse fate than Lothair’s as a consequence. Let the decision be made swiftly, for hostile forces lie abroad as well as within!"
 ab_frc_disaster_event.3.d2: "- The blood of many thousands of young men flows down the River Seine, as it has for the past several months. After the Imperial forces collapsed following the fall of the Royal Capital in Paris, the rebel armies sacked the city for several days and nights. In the confusion, it appears that Emperor Lothair had attempted to escape, caked in makeup and stuffed inside his concubine’s frilly multicoloured dress. Immediately alerted to a strange man stumbling around the castle, Lothair was immediately captured. Clapped in irons while awaiting trial in the castle, word of Lothair’s imprisonment has brought about a calm which had been unheard of since the start of the revolt. Many breathed a sigh of relief upon hearing the news, knowing that the tyrant who plunged the kingdom into such a dreadful state will soon face justice. A new day dawns on Francia, and the victorious nobles have been revelling in their unexpected victory all night. The festivities will likely continue until the new king is placed in power, though much rebuilding is to be done if Francia wishes to recover..."
 ab_frc_disaster_event.3.d3: "As though by an act of God, Lothair III Carolingian was found dead in his chambers by his servants, slumped over his desk and face-down in a pool of blood. An examination of the body found no sign of foul play, shutting down rampant rumours of regicide. Indeed, the late Emperor had been complaining of severe headaches since shortly before he took the throne in 1443. Whatever the case, Lothair has passed in the middle of a succession crisis without legitimate issue, meaning that the main Carolingian line has become extinct, and Francia is without a sovereign. Celebration and public displays of joy trailed closely behind news of the loathsome monarch’s unexpected demise, sweeping Francia like wildfire. The sudden realisation that they would face an impending power vacuum was not lost, however, on the aristocrats. Ever since Lothair’s refusal to abdicate sparked the civil war raging on until today, many noble families had aspired to assume the mantle of kingship upon the deposition of Lothair, following a peer vote. Of course, legal recognition of kingship will have to wait until a new pretender can even come out atop the others. All that’s left in the god-forsaken succession crisis is a mad dash to the capital, Paris, where the treasury and crown lie in wait. The first warlord to reach the city will likely be able to proclaim themselves king, but this will not be taken lightly. Deep-set rifts between the nobles already exist, and usurpation of the crown during an interregnum will be met with hostility on all sides. Though peace will not come easily, this is the only way for Francia to move forward. The only question now is, who will seize the capital from under their rivals’ noses?" 
 ab_frc_disaster_event.3.a: "Carolingus is dead! Long live the House of Bourbon!"
 ab_frc_disaster_event.3.b: "The House of de Anjou makes a convincing case!"
 ab_frc_disaster_event.3.c: "Lord de Valois has the Assembly’s full confidence!"
 ab_frc_disaster_event.3.ce: "Duke of Orléans shall become the king!"
 ab_frc_disaster_event.3.e: "The blood of our great founders, even diluted, shall prevail!"
 ab_frc_disaster_event.3.f: "Après moi, le déluge!"

