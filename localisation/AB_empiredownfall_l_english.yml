# Ideas #
 BNV_ideas: "Beneventan Ideas"
 BNV_ideas_start: "Beneventan Traditions"
 BNV_ideas_bonus: "Beneventan Ambition"
 bnv_first: "Resurgent Benevento"
 bnv_first_desc: "Ever since the Muslim invasion of Southern Italy, the entire Duchy of Benevento became a subject of the Sultans of Sicily. Now that the Christendom has struck a devastating blow and the Muslim rule in Italy is falling apart, the Duchy's sovereignty shall be restored!"
 bnv_second: "Reclaim Langobardia Minor"
 bnv_second_desc: "Langobardia Minor was the name that, in early Middle Ages, was given to the Lombard dominion in central-southern Italy, corresponding to the duchies of Spoleto and Benevento. After the conquest of the Lombard kingdom by Charlemagne in 774 it remained under Lombard control, later completely falling under the control of Sicily. As an independent state and heir to the legacy of Lombard power in Southern Italy, we must reclaim the lands of our ancestors."
 bnv_third: "Beneventan Chant"
 bnv_third_desc: "Beneventan chant is a liturgical plainchant repertory of the Roman Catholic Church, used primarily in the orbit of the southern Italian ecclesiastical centres of Benevento and Monte Cassino distinct from Gregorian chant and related to Ambrosian chant. It was officially supplanted by the Gregorian chant of the Roman rite in the 11th century, although a few Beneventan chants of local interest remained in use."
 bnv_fourth: "Frankish Reconciliation"
 bnv_fourth_desc: "Centuries ago, our Duchy and the Carolingian Francia were anything but friends. It is time we forget the old hatreds and set ourselves on the path of reconciliation, perhaps even accepting the Frankish suzerainty and officially joining the Holy Roman Empire."
 bnv_fifth: "Beneventan Script"
 bnv_fifth_desc: "The beneventan script was a medieval script which originated in the Duchy of Benevento in southern Italy. It was also called Langobarda, Longobarda, Longobardisca (signifying its origins in the territories ruled by the Lombards), or sometimes Gothica. The script could be reintroduced and widely taught again, significantly increasing the literacy of our people."
 bnv_sixth: "Restore the Rule of the Cross"
 bnv_sixth_desc: "Most of Southern Italy already belongs to our Duchy; however, centuries of Muslim rule had caused the conversion of the locals to Islam. With the help of the clergy, we shall make sure that this conversion is reverted and all of Italy is brought under the rule of the Cross once again."
 bnv_seventh: "Trinacrian Ambition"
 bnv_seventh_desc: "The crusade against the heathens shall see the birth of a new kingdom; the Kingdom of Trinacria ruled by us!"

 API_ideas: "Apulian Ideas"
 API_ideas_start: "Apulian Traditions"
 API_ideas_bonus: "Apulian Ambition"
 api_first: "Legacy of the Exarchate"
 api_first_desc: "Once, our ancestors lorded over much of Italy, from Apulia in the south to Ravenna in the north. Now that the Byzantines have been crippled, our humble state is the only one with a hope of reclaiming the Exarchate of Italy for our people. This dream is what motivates our tireless countrymen - Roman rule in Italy once more!"
 api_second: "Tolerate the Latins"
 api_second_desc: "When we were subjects of the Byzantines, we took a more pragmatic approach to religion than our masters in Constantinople. A Christian is a Christian, be they Greek, Lombard, or Norman - and with Magna Graecia under the despotic boot of heathens it is clear we have bigger problems on our hands than petty theological squabbles."
 api_third: "Beat Back the Heathen"
 api_third_desc: "The Normans, as fearsome and proud as they were, ultimately failed to protect us from the Saracen onslaught. By the grace of Providence, we have been given a chance to succeed where they failed - and when our time comes, our brave soldiers will be ready."
 api_fourth: "Integrate the Norman Regiments"
 api_fourth_desc: "During Byzantine and even Arab rule Normans, particularly their knights, were highly sought after as mercenary contingents. Now that we are free, however, we have an opportunity to go a step further and offer these skilled men a permanent, lead role in our armies, in exchange for tolerating their heretical views and given small plots of land to call their own in Sicily. They will only boost our martial prowess!"
 api_fifth: "Promote Griko Dialect in Court"
 api_fifth_desc: "Our dialect was looked at back home with disdain, when we were subjects to the haughty knavel-gazers in Constantinople. Now that we have carved out a respectable position in the world, it is time our language and culture were promoted in our courts over Athenian Greek and Lombard - only then will others learn to respect us."
 api_sixth: "Host Byzantine Exiles"
 api_sixth_desc: "Some things never change. Power-hungry pretenders rise up in Constantinople, they are inevitably crushed, and they seek a place to live out the rest of their years in exile. These men are not fools - most of them anyway, and could serve as valuable advisors, noblemen, and diplomats - so long as they are made to understand how indebted to us they are once they arrive."
 api_seventh: "The Patriarch of Rome"
 api_seventh_desc: "Much like our Lombard and Norman countrymen, we too venerate the Patriarch of Rome, and are sick of being lorded over in theological matters by foreigners in Constantinople. By Bringing the Bishop of Rome under our influence, and promoting it as our head church while not outwardly questioning the supremacy of the Patriarch in Constantinople, we can gain more religious independence from our old homeland - and look legitimate in the eyes of our subjects."

 CAP_ideas: "Capuan Ideas"
 CAP_ideas_start: "Capuan Traditions"
 CAP_ideas_bonus: "Capuan Ambition"
 cap_first: "Corsairs of Christ"
 cap_first_desc: "Since the fall of Trinacria in the 14th Century, the Norman dukes of Capua have taken to the seas once again. Though not an honourable profession, it is extremely profitable. What's more, His Holiness doesn't complain if Saracen merchants vanish…"
 cap_second: "De Hauteville's Court"
 cap_second_desc: "The court of Capua is incredibly diverse despite the uneasy situation in Southern Italy; one would assume all of Christendom is gathered here. From French chroniclers to German engineers, and even Byzantine defectors - our small realm has the brightest minds of Christendom gathered under a Hauteville roof."
 cap_third: "Sellswords of Saint Peter"
 cap_third_desc: "With such an oversaturated market, one might assume that tiny Capua would fail to profit from mercenary ventures. Luckily, His Holiness is wise enough to employ the Norman elite as Papal shock troops. Their fierce reputation makes even the most drunken Landsknecht think twice before battle!"
 cap_fourth: "Legacy of Robert Guiscard"
 cap_fourth_desc: "Yes, it is true that Capua's rulers are Normans by descent. That fact cannot and will not be denied, for the Duchy's sovereigns are proud descendants of Robert Guiscard! De Hauteville's legacy as a fox-like warlord persists, and to this day, his dynasty's standard is carried onto the field!"
 cap_fifth: "Bread and Circuses"
 cap_fifth_desc: "In the early 15th Century, Rufus III de Hauteville, Duke of Capua, began construction of a grand amphitheatre on the site of the ancient Roman Amphitheatre of Capua - among the largest and oldest in Italy. Completed by Rufus’ son, the “Mad Duke” Robert XI, it rose to infamy due to the reintroduction of bloodsports shortly thereafter. The “panem et circenses” policy of the Norman rulers has proven extraordinarily popular with the Capuan people to this day, helping to distract them from the looming threats to the north and south. Innumerable crowds flock to witness and bet on great mock-battles, performances, sporting competitions, and even parades on a near-weekly basis."
 cap_sixth: "Castello dei Principi Normanni"
 cap_sixth_desc: "The 11th Century Castello dei principi Normanni, or Castle of the Norman Princes, stands as a symbol of victory against overwhelming odds. During the Saracen onslaught of the 1350s, the overwhelmed Normans sought refuge in the castle, having fled from Naples not long prior. When all hope seemed lost, Hubert de Hauteville, the last king of Trinacria, sallied out with his knights under the shroud of darkness. In a daring yet unanticipated night attack, the Norman cavalry forced the Sicilians into full retreat. Hubert’s pyrrhic victory preserved Capua’s independence, and won the Hauteville line recognition as its hereditary Dukes."
 cap_seventh: "The Return of the King"
 cap_seventh_desc: "Trinacria's throne has been occupied by a Saracen brute since the 1350s, banishing us to the rump state of Capua. No more! The kingdom of Trinacria is our birthright, as it has been since we drove those Byzantine snakes from our shores. We will return, and shall restore Christian rule to our rightful subjects!"

 TRC_ideas: "Trinacrian Ideas"
 TRC_ideas_start: "Trinacrian Traditions"
 TRC_ideas_bonus: "Trinacrian Ambition"
 TRC2_ideas: "Italian Ideas"
 TRC2_ideas_start: "Italian Traditions"
 TRC2_ideas_bonus: "Italian Ambition"
 TRC3_ideas: "Italian Ideas"
 TRC3_ideas_start: "Italian Traditions"
 TRC3_ideas_bonus: "Italian Ambition"
 trc_first: "Victory of Christendom"
 trc_first_desc: "After centuries of conflicts and destructive wars between Christendom and the Saracens, we have finally restored Christian rule to Southern Italy. This is a glorious victory for Christom, one that our people shall remember for ages to come."
 trc_second: "Liberators of the South"
 trc_second_desc: "We are known as the liberators of the south, for we are the ones that finally threw off the Muslim yoke. We brought freedom and enlightenment to the Southern Italians, so that they will never have to be chained as slaves to the previous Muslim overlords."
 trc_third: "Trinacrian School"
 trc_third_desc: "The Trinacrian School, also known as the Sicilian school, is a prized product of the centuries of Southern Italian culture and literary traditions, an intricate mingling of the Norman, Greek, and Latin languages that produced various masterpiece works. We shall expand upon this school to make it a cultural centre of all Europe."
 trc_fourth: "Defeat the Corsairs"
 trc_fourth_desc: "The Corsair barbary pirates have long caused problems for Southern Italians. After we pushed back the Muslims, these corsairs are one of the last remaining threats to the peace of our state. If we are to let our people live peaceful lives, if we are to let them be able to sleep at night, then we must destroy the corsairs."
 trc_fourth2: "Defeat the Corsairs"
 trc_fourth2_desc: "The Corsair barbary pirates have long caused problems for Southern Italians. After we pushed back the Muslims, these corsairs are one of the last remaining threats to the peace of our state. If we are to let our people live peaceful lives, if we are to let them be able to sleep at night, then we must destroy the corsairs."
 trc_fifth: "The Two Capitals"
 trc_fifth_desc: "Due to the unique historical development of the Southern Italian region, our nation has two capitals. Palermo and Naples, the two shining jewels of Sicily; we must adorn them with crowns and jewels and develop them to their fullest extent to demonstrate the newfound strength of our nation."
 trc_sixth: "University of Palermo"
 trc_sixth_desc: "A modern nation state requires a modern system of education. The University of Palermo shall lay the foundation of future education in our nation by providing the brightest with the best."
 trc_sixth2: "University of Palermo"
 trc_sixth2_desc: "A modern nation state requires a modern system of education. The University of Palermo shall lay the foundation of future education in our nation by providing the brightest with the best."
 trc_seventh: "Sicilian Silk"
 trc_seventh_desc: "The region of Sicily has been known for its high-quality silk. This provides us with lucrative silk trading opportunities that will generate immense wealth for our nation. The importance of trading with us due to our silk also forces some of our neighbours to be more cooperative with us."
 trc_seventh2: "Sicilian Silk"
 trc_seventh2_desc: "The region of Sicily has been known for its high-quality silk. This provides us with lucrative silk trading opportunities that will generate immense wealth for our nation. The importance of trading with us due to our silk also forces some of our neighbours to be more cooperative with us."

 SLR_ideas: "Salernitan Ideas"
 SLR_ideas_start: "Salernitan Traditions"
 SLR_ideas_bonus: "Salernitan Ambition"
 SLR_medical_school: "Schola Medica Salernitana"
 SLR_medical_school_desc: "The Salerno Medical School has been a core part of Salerno’s scholarly tradition for the better part of 500 years. With access to Classical and Islamic records on medicine and practice, our doctors have been practising the trade better than most other doctors around the world."
 SLR_relics: "Relics of Saint Matthew"
 SLR_relics_desc: "Even when our city was under the control of the Sicilian Emirate, we still kept close to our catholic heritage. The safekeeping of the Relics of Saint Matthew within the Salerno Cathedral is our proof of that, and with our newly found independence, we shall maintain our adherence to the one true faith."
 SLR_opulenta: "Opulenta Salernum"
 SLR_opulenta_desc: "Before our defeat at the hands of the Saracen, our kingdom’s coins travelled across the Mediterranean, signed and sealed with our insignia, carrying our legacy of wealth and prestige across the seas. We must regain that status if we hope to survive in this new age."
 SLR_mercenaries: "Salerno Mercenary Tradition"
 SLR_mercenaries_desc: "We have long since relied on mercenaries for our protection. Through this, we have forged ties and connection to the roaming mercenary bands of Italy, allowing us to haggle for lower costs for more men, as they know that the city of Salerno will always pay their debts."
 SLR_charlamagne: "Courting Charlemagne’s Heirs"
 SLR_charlamagne_desc: "While we at one point sought to evade the armies of Charlemagne when they first came through, we now turn to them for protection. The heirs of Charlemagne carry with them weapons and men – and we shall need these in spades if we are to remain free from both our neighbours and the lingering Saracen threat."
 SLR_legacy_of_war: "Legacy of the Wars"
 SLR_legacy_of_war_desc: "As detailed in the Chronicon Salernitanum, our city first found freedom in the flames of civil war. Ever since then, even with the Sicilian invasions, we have always fiercely defended our home, willing to fight off all incoming invaders; be it in the fields or on the city walls, we shall defend our home with our very lives!"
 SLR_legacy_of_saracen: "Legacy of the Saracen Era"
 SLR_legacy_of_saracen_desc: "The Saracen Era has left with us a burning desire to defend our homes, and to do so we must make sure that our borders are defended with fortifications so strong that no army will pass through!"

# Decisions #
 form_trinacria_title: "Form Trinacria"
 form_trinacria_desc: "The reclamation of lands from the Sicilian menace has ended a centuries-long reign of terror in Southern Italy, and ensured the survival of Christendom on the peninsula. Under the Greco-Latin triskeles, the Kingdom of Trinacria shall emerge proud and victorious!"

# Events #
 ab_capua.1.t: "The Mad Duke of Capua"
 ab_capua.1.d: "Robert XI de Hauteville, known by most as the ‘Mad Duke’, wasn’t always the monster that now strikes terror into the hearts of Saracen and subject alike. Though he had always been an eccentric, if not delinquent, character since his childhood, Robert’s insanity and innate cruelty were made manifest during the latter years of his father’s reign. While on an expedition to the Greek-held splinter state of Epirus under orders of the Duke, Robert was intercepted and overpowered by a Sicilian flotilla, and was taken captive for an extended period of time. Unspeakable horrors are presumed to have been endured by the young Norman aristocrat, for he emerged from the dungeons of Naples a broken mockery of his former self. From his experiences were born a deep-seated hatred of all things Saracen, and a murderous intent to match. Transforming the fighting pits his father had constructed into a sizeable amphitheatre, in pale imitation of the Roman style, Robert would offer his people bloodsports and vast displays of the Capuan corsairs’ war trophies in exchange for support in future endeavours. To add further fuel to the fire, Robert had received a “vision” in his last days of imprisonment; one in which he was the true heir to Romulus as Rex of the Romans. Indeed, the Mad Duke now proclaims himself to be the living reincarnation of the legendary founder, struggling against the winds of change to revive the ancient Roman culture and language. Every day, after forcing courtiers to dance and improvise songs to his new lyre compositions, Robert gazes longingly in the direction of the Eternal City. Rome tragically lies in the crusty and geriatric hands of his suzerain, the Pontifex Maximus, but the Rex-to-be seeks to bring about the Return of the King. While most see his claim as nothing more than the ravings of a madman, Robert and his most zealous lackies believe that the Seven Hills are rightfully theirs - for who else but Romulus and his sons can lay claim to them?"
 ab_capua.1.a: "Be prepared for the coup of the century!"
 ab_capua.2.t: "The Mad King of Rome"
 ab_capua.2.d: "Robert XI de Hauteville, believing himself to be the last Roman, has long desired to hold the capital of his Papal suzerain; the Eternal City of Rome. Such spurious claims had caused little concern for the Vatican, who saw Robert as nothing more than a delusional madman. That was, at least, until the Norman warlord abandoned his oath and marched north, scoring a crushing and total victory against the Papal State. Having imprisoned the Pope and College of Cardinals under the threat of a gladiatorial debut, the Mad Duke was hastily sworn in as Rex Romanorum and presented a signet ring presumably belonging to a Roman statesman of old. With the madman actually accomplishing what was assumed to be an impossible feat, many of the rulers across Europe now look on with concern, wondering if, perhaps, Robert isn't quite so erratic as once thought."
 ab_capua.2.a: "I just can’t wait to be king!"
 ab_capua.3.t: "The Lords of Rome"
 ab_capua.3.d: "Robert XI de Hauteville, believing himself to be the last Roman, had long desired to hold the capital of his Papal suzerain; the Eternal City of Rome. Such spurious claims had caused little concern for the Vatican, who saw Robert as nothing more than a delusional madman, and their beliefs were reaffirmed upon his passing. Nonetheless, Capua has managed to twist the ludicrous claims of its most infamous Duke into legitimate reason for war. Casting off the burden of vassalage, the Normans marched to battle and scored the victory of the century; the fall of Rome, into their hands. Having imprisoned the Pope and College of Cardinals under the threat of a gladiatorial debut, a tradition which has lingered since the Mad Duke’s days, the Capuan ruler was presented with a signet ring presumably belonging to a Roman statesman of old. Although the madman failed in his impossible feat, many of the rulers across Europe now look on with concern, wondering if, perhaps, his descendants will carry his legacy beyond Italy."
 ab_capua.3.a: "Vae Victis!"
 ab_capua.4.t: "The Court of the Crimson King"
 ab_capua.4.d: "Now labelled the Antichrist, or Crimson King, for the utter bloodshed brought about by his reign, Robert XI de Hauteville is considered an enemy of all Christendom by vengeful Papists. As it turns out, betraying and invading the Papal States has alienated Capua from the rest of Europe - something which the Mad Duke has failed to take into account. His madness, however, has only played into the reputation as a demon in the shape of a man. In response to his excommunication and condemnation, the Norman warlord has had a great many Cardinals and other clergymen thrown into the Amphitheatre of Capua. Robert XI, Rex Romanorum and Duke of Capua, sees himself as a Neronian artist; cruelty and hedonism without bound litter his kingdom of vices. The house of cards is so precarious that Robert’s fall could bring down everything else around him, but for now he is the king undisputed; respected and saluted. Esoteric madness and eccentricity unchained now slowly turn the grinding wheel..."
 ab_capua.4.a: "...in the Court of the Crimson King"
 ab_capua.5.t: "The Roman Rebirth"
 ab_capua.5.d: "The capture of Rome and re-establishment of the Regnum has elevated Capua to an unanticipated level of infamy and patronage from all across Europe. Grifters and imbeciles with rich benefactors seeking to ooze their way into the Eternal City flock to her Norman overlords, blindly throwing money and talent at the Hauteville throne in expectance of the favour being returned through political clout. Among these charlatans, however, lie a few genuine souls who seek to make use of Rome’s resources for mutual gain - on a cultural level, at least. These self-described ‘Hellenists’ are well-learned scholars and artisans from the decaying Byzantine Empire, those sleazy imitators of true Roman glory. No doubt, they seek to flee the rampaging Bulgars or, circumstances permitting, merely observe the world from outside the sheltered Constantinopolitan bubble. With the innate interests in Hellenistic teachings and art still lingering in no small part thanks to the Mad Duke’s influence on Capuan court life, it only made sense to grant the brightest among the Hellenists a Royal Commission in exchange for their services. From the bookish, Romano-Capuan learning will accelerate the literacy of the realm, and from the creative shall come a golden age of art and for this soon-to-be marble world! Indeed, this city of timber and brick will be restored to Augustan marble, and Rome shall be reborn once more as the centre of the world!"
 ab_capua.5.a: "A shining new era is tiptoeing nearer"
 ab_capua.6.t: "Il Porco Rosso"
 ab_capua.6.d: "Il Porco Rosso, the Red Pig, is the grandest vessel ever put to sea by the Normans of Capua. Ornately-decorated but incredibly well-armed and swift for a vessel of her class, the new flagship is the envy of all Italy. Duke Robert’s grand vision of restoring the Capuan navy, following a decade of neglect, has finally become a reality. The pride and joy of the Mad Duke, Porco Rosso will have a critical role to play in the Italian naval arms race from this point forward. It is not known what inspired Duke Robert to christen the ship with such a bizarre name, but then again, the inner machinations of his mind are an enigma. Already having her prowess tested in a mock-naval battle against captured Sicilians, the Duke is most impressed by Porco Rosso’s current performance. He is, even now, running around like a giddy child, eagerly anticipating the day when he can lead a real sortie from the Capuan flagship’s bridge. The days when Normans ruled the Mediterranean, the pirates of Capua striking fear into Saracen merchantmen, are no longer a nostalgic memory. Once more, they set sail for war!"
 ab_capua.6.a: "Bygone days no more"
 ab_capua.7.t: "No One Like Gaston"
 ab_capua.7.d: "Everyone’s favourite guy, nobody comes close to being as admired as Prince Gaston de Hauteville, nephew of the Mad Duke Robert XI. The dashing young rogue awes and inspires everyone he comes across, from the lowest street urchin to the greatest of Europe’s kings, and it’s not very hard to see why. Extremely manly, he is a perfect and pure paragon to all around him. Indeed, as a specimen Gaston is intimidating, for he excels in wrestling matches and no one matches wits like him either. Furthermore, Gaston has a mighty appetite which often puts a strain on his treasury due to the sheer amount of eggs he consumes daily. This has, however, merely strengthened Gaston, as the Capuan prince’s heroic stature makes him roughly the size of a barge. As well as this, Prince Gaston shoots more accurately than even the most skilled German Welsh marksman, so it is only natural for him to be an avid big game hunter. Indeed, the garish tastes of Gaston include a liberal application of antlers in decorating and art, as well as codpieces and form-fitting shirts. While the laughing stock of extremely hypocritical French and German nobility who wear much of the same attire, numerous sculptures of the Prince posing as heroes from Greco-Roman myth are being produced every year. This has become enough of a booming trend, thanks to Gaston, that a brand new romantic art style has been named in his honour; Herculo-Gastonian Neo Romanticism. With all of these accolades under his belt, it is no wonder that Prince Gaston is Duke Robert XI’s favourite, thus also Capua’s heir-presumptive. He also has promising career opportunities in both the army and navy, should he wish to defer rule to one of Robert’s direct line, although even the Mad Duke’s children are less loyal to the Capuan cause than this super success."
 ab_capua.7.a: "No one fights like Gaston"
 ab_capua.7.b: "Pilots ships like Gaston"
 ab_capua.7.c: "No one jousts and outwits gallant Knights like Gaston"
 ab_capua.8.t: "Norman Opera"
 ab_capua.8.d: "With the cultural revitalisation of the Italian Peninsula in full swing, even amidst the constant warfare across the known world, a new musical and theatrical innovation has been sweeping the aristocracy into a frenzy over the past several years. This loud, melodramatic, and extravagant mixture of the performing arts is referred to as “Opera”, and already boasts several major hits such as Monteverdi’s “L’Orfeo” and Peri’s “Dafne”. These operatic productions have been observed as a romanticised effort to resurrect the long-forgotten Greek theatre of old, of course with numerous liberties taken for the staging and source material. Among those most impressed by it are the Norma de Hauteville family, notorious for encouraging Mediterranean piracy and providing state-sponsored bloodsports to the unwashed masses. Indeed, a rather cruel and unusual punishment has been undertaken by the Pirate-Kings of the Mediterranean; captured Saracens and merchants are forced to either compose and perform an opera, or fight in the pits. It is of course an absurd fantasy to expect impromptu spectacles of such magnitude from the majority of the Capuan captives, but the alternative is even less enticing than public humiliation to many. The introduction of this theatre of cruelty, or “mockera” to the survivors, has inevitably increased the appeal of such entertainment to the commoners - a genuine desire for theatrical patronage by the ruling family has been put forth via petition. Alas, those who do well in the mockera are now forced to compose and perform state opera to entertain rabble and high nobility alike. Truly a bizarre turn of events on the Italian peninsula."
 ab_capua.8.a: "The Vulgar Art"
 ab_capua.9.t: "Turandot, or How a Turk Revolutionsed Opera"
 ab_capua.9.d: " Facing mass-ridicule or near-certain death to appease the bloodthirsty masses in the Capuan hippodrome, a Perso-Turkish merchant in the Hautevilles’ captivity has managed to blow everybody away with a most stunning impromptu mockera performance. Dubbed “Turandokhtar”, or Turandot to the Normans and Turandotta to the Italians, the opera is derived from a number of Middle and Far Eastern influences; from the foothills of Persia to the desolate wastelands of Manchuria. The narrative focuses on a Turkic prince exiled from his homeland, following the Great Yuan’s invasion, who has been struck by love at first sight of the callous yet beautiful daughter of the Khagan. A thoroughly emotive (and likely desperate) performance as the Turkish prince has seen the merchant receive an official pardon from the Norman aristocracy, as well as a standing ovation from the entire audience within the amphitheatre. Perhaps expecting failure, he had collapsed after being overwhelmed by such reception and was ennobled as the Court Dramatist in an equally public display some hours later, evidently from pressure by the arbitrary Lord of Capua. A handwritten copy of the standout aria, Nessun Dorma, has been framed within the royal palace’s Hall of Curiosities, which was established by the Mad Duke himself so long ago. The shockwaves of this improvised masterpiece have torn throughout Europe and the Near East, and now countless Frenchmen, Germans, and even fellow Turks have been attempting to create equally-impactful imitations but to no avail. Nonetheless, Turandokhtar has changed the face of opera forever, and even if his name is forgotten to time, this ex-merchant’s contribution to the cultural zeitgeist of Europe is among the greatest in recent years."
 ab_capua.9.a: "All’alba, vincero! Vincero! Vincero"
 ab_capua.10.t: "Duke Robert’s Sanity"
 ab_capua.10.d: "Robert XI de Hauteville’s madness is no secret, having been the root cause of countless diplomatic incidents for Capua. However, his tactical genius and charisma manage to carry the Norman-ruled rump state into constant victories against foes which beset them. It is perhaps for this reason that the Mad Duke hasn’t been deposed and replaced by one of his kinsmen, although things may be taking a turn for the worse. Advisors have witnessed a marked decline in their already cruel and erratic sovereign’s behaviour, with increasingly common bouts of paranoia and eccentricities. During a recent trial of a noble charged with conspiracy to commit regicide, for example, Robert XI’s mood flipped from ire at a supposed traitor, to fearfully accusing the court of siding against him, to sentencing them all to a week of jury duty. Following half an hour of bewildered silence, the Mad Duke promptly declared that the Virgin Mary had scolded him before storming back to his palace. The doors to his chambers had to be broken down following several days without Duke Robert reemerging, with servants fearing the worst, only to see him drawing the plans for a ship-mounted flame projector on a priceless contemporary portrait of Alexios Komnenos, the great Byzantine Emperor. Since then, Robert has been trying to force the Osman & Sons Trading Company representative in Capua to purchase a patent for these scrawlings, but to no avail. In light of how utterly bizarre his recent actions have been, Robert’s chancellor has increased surveillance on the Duke in case he does something irreversibly damaging."
 ab_capua.10.a: "This bodes ill for the future"
 ab_capua.11.t: "Robert’s Downfall"
 ab_capua.11.d: "Already beginning to enter a decline of stability, Robert de Hauteville is acting alarmingly more eccentric than previously, having already embarrassing himself and others. He has just been stopped from attempting to turn a visiting Papal Legate into a human candle, with witnesses claiming the Mad Duke had been singing about Hellfire, Blessed Mary, and something not being his fault while frightening the poor man immensely. After being restrained and calmed down with an alchemical remedy, the Duke appeared to have regained his senses briefly. Alas, this was not meant to be, for Robert XI is now proclaiming that God has ordered an immediate Crusade against Egypt to rescue Alexander the Great from captivity. Courtiers are now frightful that the beginning of the end is nigh, for the Norman warlord is struggling to distinguish reality from his twisted fantasy world."
 ab_capua.11.a: "Mea Maxima Culpa!"
 ab_capua.12.t: "The Lights Dim"
 ab_capua.12.d: "Robert de Hauteville, Duke of Capua and 11th of his name, has managed to lapse into an unhinged state for an extended period of time. Problems began when he had received word of foreign agents in the capital, which saw a bloody purge of non-Norman nobility occur when they were thrown to the lions in Capua’s amphitheatre. Robert, in a manic state, was led out of the royal booth under armed escort when a Saracen attempted to run the Mad Duke through with a knife, only to stumble and leave a gaping wound on his target’s waist. It appears that the shock of such an event finally broke the Capuan ruler, for he had been ranting about enemies on all sides for the better part of the ensuing month. Indeed, before locking himself within the Ducal Palace once again, the navy was ordered to bring back one thousand chests of sea shells, much like Caligula. Meanwhile, the army was dispatched to intercept invading forces which never existed outside of the ailing Duke’s imagination, and after returning without having fought a battle, was ordered to swim to the coast of Sicily and establish a military colony atop Mount Stromboli. Suffering an apoplexy upon learning that his soldiers didn’t even accomplish that, Robert threatened to throw everyone to the lions. Robert was then dragged away, after trying to attack the French ambassador, who was struggling to stifle his laughter at the predicament. The Duke has since then been kept under watch, by the orders of his nephew Prince Gaston. In the coming months, provided the Mad Duke’s condition does not improve, the state’s executive powers will be gradually handed over to the privy council. Even with numerous remedies proposed by alchemists, from ice treatment, to mercury tonics, to removing the lead lining from his clothing, Robert’s condition is in rapid decline. The Mad Duke is assumed by many to have reached the point of no return."
 ab_capua.12.a: "My Little Dark Age…"
 ab_capua.13.t: "Thus Saith The Lord"
 ab_capua.13.d: "It appears that the court’s fears are intensifying, for Duke Robert XI de Hauteville is gravely ill with an as-of-yet unidentified sickness. Bedridden, deathly pallid, and drenched in a cold sweat, the Mad Duke is barely responding to his attendants. With the privy council in charge of state affairs, Capua’s operations are running smoothly, for the most part. Although the lack of their sovereign’s tactical genius is putting a damper on campaign season, it is probably for the best that the world stand still for a moment longer. There is one thing which alarms the physicians and alchemists more so than the Duke’s downward spiral, however. Each time he lapses back into consciousness, Robert XI has been muttering the chant “Thus Saith The Lord” with little pause. It is unknown what kind of internal battle is raging within Robert’s dreams, but the clergy appear to think that the Duke is being exorcised of a demonic entity. To the more sceptical among the Normal elite, though, all that can be done is wait for the inevitable…"
 ab_capua.13.a: "Thus Saith The Lord..?"
 ab_capua.14.t: "Apotheosis"
 ab_capua.14.d: "A miracle! Yes, a miracle has occurred! His Highness, Robert XI de Hauteville, Duke of Capua and Rex Romanorum lives! Feared to be terminally ill with an unidentified wasting disease, preparations were hastily made to transfer power to the privy council. The Ducal advisors would then assume control over Capua until a successor could be chosen. However, this seems to prove neither necessary nor welcome. Bursting out of his chambers, stark naked and full of energy, the Mad Duke proceeded to run around the palace grounds proclaiming that he had returned to Earth as a living God. Duke Robert, while never the most stable fellow, claims to be an immortal avatar of the heathen deity Sol Invictus, and wishes for everyone in his realm to know it! Much to the ire of his clerical ministers, Robert now refuses to even acknowledge the presence of others, unless he is addressed as the Unvanquished Sun; the Lord and Bringer of Light. Immediately succeeding his nude parade was issued the official proclamation of the Made Duke’s divinity, and its institution into law. For failing to acknowledge the Norman pirate king as the Bright Lord, Sanctus Robertus Sol Invictus XI de Hauteville, Rex Romanorum et Princeps Senatus, a number of high ranking clergymen and other administrators were lit up in a “Bonfire of Purgatory.” Furthermore, there has been severe retaliation against the “treasonous usurpation” of Robert’s throne. Although an emergency measure undertaken during his near-fatal sickness, it was done without the Mad Duke’s consent. He has thus ordered that everyone involved in the “conspiracy”, save for blood relatives, are to be “purified by the Sun’s healing light”; his lack of clarification has allowed the court officials to be released early by dumbfounded guards and judges unanimously. The Mad Duke’s reign of terror has resumed in full force, with an intense and almost inhuman fervour never before seen. Even Caligula, Nero, and Elagabalus would blush at the utter insanity unfolding before the Capuan people’s very eyes. The self-proclaimed immortal god-duke believes himself unstoppable, invincible, and seeks to spread his word across the Italian Peninsula."
 ab_capua.14.a: "Ave Sanctus Robertus...?"
 ab_capua.15.t: "Sooner or Later…"
 ab_capua.15.d: "Disaster! Easily-preventable tragedy! Or yet another miracle! It’s entirely a matter of perspective in this situation! Self-proclaimed Sun God, and immortal God-King of Rome and Capua, Robert XI de Hauteville, is deceased. The Mad Duke was leading a procession through the streets, to consecrate a shrine dedicated to his honour as part of the new sun cult, when a ringing church bell broke loose. The bell brought itself, and the steeple it was suspended in, crashing down onto the paved streets below, causing widespread chaos. The falling bell crushed the Mad Duke on the spot when he failed to react beyond pointing and staring, mouth agape. Alas, the impact of the bell caused the street to collapse, and Robert’s body was swept out to sea through the city’s sewer system. His cadaver was picked up by a Sicilian merchant ship, the crew of which was crucified for attempting to demand ransom for the late Duke’s repatriation. Robert XI de Hauteville now lies in state, following a lengthy bath, although his remains are extremely well-preserved and with minimal signs of the fate which befell him. In fact, the absolute serenity on his face has been compared to that of a statue from the Hellenistic Era and Roman Principate. Most of the faithful Christians within Capua’s sphere believe God himself intervened, striking down the blasphemous tyrant for his excessive hubris and sinful ways. Others, however, would instead argue that the Mad Duke was merely a victim of shoddy construction and maintenance techniques, and may have survived if he had actually stepped out of the way. In any case, the late Robert had dictated a (partially coherent) will, in order to avoid the debacle following his sickness. Those who petitioned him to do so were still fed to the lions, as the Norman lord feared another plot, but now the transition of power can take place without major hiccups. A legacy of insanity and success against the odds survives Robert XI, and it is unlikely that the world will see his likeness ever again. Shine on, you crazy diamond."
 ab_capua.15.a: "...God’ll Cut You Down"
 ab_capua.16.t: "Trinacria Resurgent!"
 ab_capua.16.d: "Despite being the only true Kings of Trinacria, the Norman de Hauteville dynasty languished and withered in the city-state of Capua for well over a century. Humiliated immensely by the last de jure King of Trinacria’s surrender and abdication to the heathen Emir of Sicily in the 14th Century, the Norman clan was forced into servitude under the corrupt and weak Papal States, acting as privateers and soldiers of fortune to eke out their living. That ends on this day, however. A glorious victory greets the eternally-redeemed Italo-Norman forces, marking the latest triumph of the Cross against the Crescent. Through immense feat of arms and a stunning reversal of their situation, the Dukes of Capua can once again claim to be Kings of Trinacria in more than just name. The vile Saracen is driven back, slithering off into its dark hiding place, and surrendering to the Hautevilles their ancestral birthright. Vowing to never again falter against the hordes of enemies which surround them on all sides, the Trinacrian sovereign is heralded by many as the saviour of Latin Christendom. Eternal glory awaits Trinacria, as the resurgent power assumes its rightful seat as hegemon of Southern Italy. Deus Vult!"
 ab_capua.16.a: "Now light our darkest hour!"

