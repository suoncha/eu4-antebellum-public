# Ideas #
 legacy_of_breton_independence: "Legacy of Breton Independence"
 legacy_of_breton_independence_desc: "Brittany has never been a true part of the Franks. Though we have been ravaged by Franks, Vikings, and the Anglo-Saxons in the past, we have...thus far, maintained our identity as a people apart. Let all of our neighbours be aware that Brittany will remain free, the last home of true Gallic traditions."
 towards_gallia: "Gallic Revival"
 towards_gallia_desc: "Our ancestors and people today are of Celtic blood and culture hailing from the lands of Britannia, where the Anglo-Saxon dogs now reign as Kings. Those lands and times however are behind our meagre nation and with our celtic blood and nature the east lies weak with the Frankish Emperor being hastily crowned. Our time and opportunities lay at our feet to strike and revive a true Gallic nation."
 breton_march: "Breton March"
 breton_march_desc: "The old kings of Francia called the militarised frontier between their lands and Brittany the Breton March. At the time, they wanted it to keep us out. Let us revive the fortifications of the Breton March, this time to keep our enemies out."
 breton_catholicism: "Breton Catholicism"
 breton_catholicism_desc: "The Frankish may have claimed to be the 'eldest daughter of the Church' since the days of Clovis, but their observance is spotty and their fealty to Rome only evident when it suits them. The Breton doesn't hide his veneration of the Blessed Virgin or his loyalty to the teachings of His Holiness and the one true Catholic Church."
 breton_blood: "Meriadoc's Legacy"
 breton_blood_desc: "Conan Meriadoc founded this brave and prosperous Breton realm. Hailing from the lands of Britannia he and his soldiers were sent by a Roman usurper to conquer these lands in his name, though that was not to occur. Conan and his soldiers later settled these lands and created the Breton-Gallic Identity and created the Breton realm. Our ancestors are descendents of these pioneers and the pride of it aids the Breton soldiers in battle."
 linguistic_revival: "Revival of the Breton Language"
 linguistic_revival_desc: "The Breton language hails as a dying language due to the influx of the Franks into our lands and the spread of the languages, but our history does not lay out as Franks. Our history lays out in our books as Bretons and Bretons to last and this means reviving our language. The Breton language, one of Brythonic origins boasts the most speakers of all and it hails as the most prime and beautiful of all Celtic languages taking the pedestal for Celtic languages and cultures."
 cultural_revival: "Cultural Awakening"
 cultural_revival_desc: "In 1464, Jehan Lagadeuc wrote the first trilingual dictionary, which contained words in Latin, Breton, and French. This amazing book was the first dictionary in either the Breton or the French language. By distributing copies of the Catholicon, we can show that Breton is just as superior as a culture as those of the French and nearby Andalusians. This shows that we too can play a major part in the history of literature."

 GLL_ideas: "Gallic Ideas"
 GLL_ideas_start: "Gallic Traditions"
 GLL_ideas_bonus: "Gallic Ambition"
 GLL_first: "Destroy the Frankish Hegemony"
 GLL_first_desc: "It is clear that the Franks are the true enemy, and we must tolerate them no longer! For their crimes against the Gallic people, Francia shall be brought to its knees!"
 GLL_second: "Gallic Restoration"
 GLL_second_desc: "This land is the ancestral birthright of the Gallic people, and it rests in Celtic hands for the first time in over a thousand years. With Gaul restored, we now march forward to our destiny! Glory to Gallia!"
 GLL_third: "Celtic Endurance"
 GLL_third_desc: "Even prior to their wars against Caesar, the Gallic people demonstrated a warrior's spirit; indomitable and enduring, even in defeat. Gaul's enemies feared the Celtic war cry, and respected their tactical brilliance. This spirit carried on through the ages, and now survives in the hearts and minds of our people!"
 GLL_fourth: "Cultural Rebirth"
 GLL_fourth_desc: "The Gallic revival began with, of all things, a Breton-Latin-Gallic dictionary, but has rapidly encompassed a full-scale revivalist movement. Integrating Celtic traditions with Latin legalism and Germanic martial structure, the Gallic people have seen an unprecedented cultural rebirth! From art to architecture, and even court customs, the Neo-Gallic culture stands strong."
 GLL_fifth: "Gallic Pride"
 GLL_fifth_desc: "It has been a long time since anyone called themselves a Gaul, but times have changed, and the Gallo-Latin people have been reborn in the crucible of conquest. In reverence to the old ways and the new, our people are proud to call themselves Gauls once more!"
 GLL_sixth: "Restore the Oppidum System"
 GLL_sixth_desc: "The Oppida were hill forts around which the Gauls built their society. Centralising our administration around fortified centres will refine the bureaucracy into an efficient political  machine, and aid in coordinating defences while under siege."
 GLL_seventh: "Revive the Legions"
 GLL_seventh_desc: "During the Crisis of the Third Century, the Roman Gallic Empire was established by Postumus with the support of his Legions. This created a deep bond between the Emperor and his armies which is sadly lacking in the standing armies of our time. The Legion and its unwavering devotion to the cause ought to be replicated within our own ranks, lest we fall to treason by an apathetic military."

# Reforms #
 brirevive: "Revive the Celtic Nobility"
 brirevive_desc: "For centuries, we have been resisting the harsh Latinization which is being pushed on us by the Carolingian Francia. It is time we put an end to this process and revive our own Celtic nobility!"
 brifishing: "Expand the Fishing Ports"
 brifishing_desc: "Our region enjoys a strong and diverse maritime economy including active ports of trade and fishing. An investment into the expansion of the ports would go to waste."
 brifarm: "Grow the Agricultural Sector"
 brifarm_desc: "The northern and western parts of our territory rely on a pastoral farming economy; the south-east enjoyed warmer and conducts mixed-arable and pastoral farming, based around small holdings. Ensuring that those estates are well funded will bring prosperity to all Bretons."
 bricolonial: "Establish the Colonial Office"
 bricolonial_desc: "Our proximity to the World Ocean and the fact that we are not being navally blocked by any country gives us an amazing opportunity to establish our own colonial office and set sail to the New World."
 bricavalry: "Adopt the Frankish Cavalry"
 bricavalry_desc: "Even though we are bitter rivals of the Frankish Latinization which is being imposed upon us, we should be more open to the positive aspects of their realm; such as their masterful use of heavy cavalry. Adopting their tactics would greatly benefit our armies and increase the effectivenness of the cavalry on the battlefield."
 briparliament: "Parliament of Brittany"
 briparliament_desc: "Even if our policies are rightful, our subjects look for representation. Lest discontent boil into open rebellion, we may consider devolving the monarch's absolute authority by drafting a constitution which, among other things, would grant the commons their own legislative assembly."

# Events #
 ab_brittany.1.t: "Gallic Restoration"
 ab_brittany.1.d: "An ancient people crushed under Caesar long ago, the Gauls were once thought to have disappeared from memory; dispersed and integrated into the dominant Latin and Germanic populations of Western Europe. It would appear, however, that court chroniclers thought wrong. Indeed, an ever-expanding Breton realm has laid waste to the French countryside, claiming the legacy of both the Gauls and Britons. Yes, these descendants of the Romano-British, who had fled to Roman Gallia during the Saxon Invasion, are promising a pan-Celtic identity for the European continent. Union between the Bretons, Aquitainians, and many others is their master plan. Although their languages may now be heavily influenced by the French of their neighbours, the Celtic roots of these overlooked peoples are as tough as steel. Nothing could have prepared the Latins for what was to come; neither the crushing defeat of the French, nor of a miniscule duchy rapidly overwhelming Western Europe. The emergent Gallic state hoists its banner high up from the cathedral spires and fortress battlements across France. Gallic emissaries now insist that the old name of Gallia be restored, for use in correspondence and cartography, and are gleefully browbeating neighbours into recognition. What the future holds for the new Gallic realm is unknown as of yet, though many in what is left of the Empire now fear that they will be next."
 ab_brittany.1.a: "Witness us, Vercingetorix!"
 ab_brittany.2.t: "Sack of Rome"
 ab_brittany.2.d: "Rome is reduced to cinders, the ashes of her glory and pride scattered to the winds. Just as on that fateful 18th of July in 397 BC, a Gallic warband has laid waste to the city on the seven hills once more, channelling the furor of Brennus' Senonii. With rallying cries calling upon those first Gaul to bring Rome to her knees, and of the tragic king and hero Vercingetorix, few could have anticipated such a potent threat. The very heart of Italy and the Latins is crushed in Gallia's steely grip; the Eternal City's ruination serves as much of a propaganda victory as it does a spiritual and moral one. Flames spreading from hill to hill spare only the Vatican, but the millennia-long legacy of Rome exists no more, by the Tiber at least. Furthermore, the Gallic sovereign has made preparations to conduct a reenactment of Brennus' own tribute-collecting and subjugation of Rome, sealing the total and utter humiliation of the once-proud nucleus of Europe. At long last, Gaul's dream of vengeance has come to fruition, with the Romans now understanding the terror they sowed at Alesia."
 ab_brittany.2.a: "Woe unto the conquered, Romans!"

