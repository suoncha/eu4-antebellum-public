### ARLES ###
# Countries #
 LWB: "Lower Burgundy"
 LWB_ADJ: "Lower Burgundian"
 UPB: "Upper Burgundy"
 UPB_ADJ: "Upper Burgundian"
 ARS: "Arles"
 ARS_ADJ: "Arelat"

# Ideas #
 ARS_ideas: "Arelat Ideas"
 ARS_ideas_start: "Arelat Traditions"
 ARS_ideas_bonus: "Arelat Ambition"
 ARS1_ideas: "Arelat Ideas"
 ARS1_ideas_start: "Arelat Traditions"
 ARS1_ideas_bonus: "Arelat Ambition"
 ARS2_ideas: "Arelat Ideas"
 ARS2_ideas_start: "Arelat Traditions"
 ARS2_ideas_bonus: "Arelat Ambition"
 ars_first: "Legacy of Otto the Just"
 ars_first_desc: "For Arles, Otto the Just was a symbol of brilliant military acumen. Without his contributions to the Arelat legacy, we may have withstood the test of time - it was no accident that the internal power struggles only flared up with his passing in Barcelona."
 ars_second: "Reforge the Kingdom of Arles"
 ars_second_desc: "The Arelat realm was fractured in an attempt to ensure the unworthy would not be able to debilitate the lands any further. Now reinforced with capable leadership, we have undisputable claims over the remainder of the former lands."
 ars_third: "Burgundian Knights"
 ars_third_desc: "The Burgundian Knights, the chevaliers of France, were the mightiest across jousting tournaments across Europe. They bring their might and chivalry alike, to the lands and battles where they are needed most."
 ars_fourth: "The House of Welf"
 ars_fourth_desc: "The House of Welf were the most potent diplomats, enabling the second reunification of Arles without drawing swords with any of their neighbours. In more peaceful times, this will be a great standard to uphold."
 ars_fifth: "Restitue Franciam Mediam"
 ars_fifth_desc: "The Kingdom of Arles, much like the Lotharingians, have been the crossroads of the centralising Frankish realms. As the heartland of once Middle Francia, it is our birthright to re-establish its glory!"
 ars_sixth: "The Game of Thrones"
 ars_sixth_desc: "The devastation across Europe brought by conflict and disease alike leaves many houses extinct or on their last legs. We can make the most of our strong and healthy house to take advantage of this..."
 ars_sixth2: "The Game of Thrones"
 ars_sixth2_desc: "The devastation across Europe brought by conflict and disease alike leaves many houses extinct or on their last legs. We can make the most of our strong and healthy house to take advantage of this..."
 ars_seventh: "Multicultural Empire"
 ars_seventh_desc: "The legacy of Arles and the prestige of Middle Francia is not bound just to the Burgundian heartlands west of the Alps. Many of our neighbours were once under our protection, and they have earned the right to be recognised as our equals."

# Reforms #
 arssalic: "Reform Salic Succession Laws"
 arssalic_desc: "Our current succession laws have only brought us fragmentation and ruin, we need to reform them in order to consolidate power and modernise."
 arsitalian: "Italian Bureaucrats"
 arsitalian_desc: "The blooming Italian renaissance has led to lots of qualified men leaving their home states and working abroad, for right price, they can help us improve our administration."
 arspiedmont: "Piedmontese Chevaliers"
 arspiedmont_desc: "The Piedmont valley has a strong cavalry tradition. By expanding our influence in the region, we can combine this natural cavalry prowess with tradtional french tactics, allowing us to create some of the most feared chaveliers in Europe."
 arssystem: "The Capitation System"
 arssystem_desc: "Centralizing our feudal realm has been a major problem for us. We need to extract more resources from our lands, while also easing the burden on struggling areas if we wish to thrive. By establish a system of regular surveys on land, crops, revenue and the economy, we can hope to create an accurate and modern adminstration."
 arscouncil: "Kings Council"
 arscouncil_desc: "It is clear with the rising complexity of a modern government, our king cannot make all the decisions alone. We must establish a council of nobles, merchants, and clergy too help guide the king in running an effective administration."
 arsgovernment: "Laissez-Faire Government"
 arsgovernment_desc: "Recent history has shown that a hands off approach to government can produce a great amount of economic growth. By establishing limits on the central government's power, we can hope to create an independent and adaptable economy that will allow us to compete with the major powers of the world."
 arsresurgence: "Burgundian Resurgence"
 arsresurgence_desc: "Although Arles started as a patchwork of French, German, and Italian cultures and realms, we have lasted long enough to create our own unique history. By drawing on the ancient Burgundians as inspiration for our long and prosperous history. It is time to create a new empire."

# Decisions # 
 arles_diplomatically_title: "Reunite Arles Diplomatically"
 arles_diplomatically_desc: "We have secured the throne of the other Burgundy. The lands of our father are finally reunited. The time has come to formally unite the Burgundies and restore the Kingdom of Arles!"
 arles_by_force_title: "Reunite Arles by Force"
 arles_by_force_desc: "The might of our army has secured us a triumphant victory in the war against the pretenders. The lands of our father are finally reunited. The time has come to formally unite the Burgundies and restore the Kingdom of Arles!"
 ars_move_capital_title: "Move the Capital to Arles"
 ars_move_capital_desc: "Before the division of the old kingdom, the city of Arles was the capital. The new states have moved their courts elsewhere, though as we reunited the shattered realm, it would be a wise decision to move the court back to Arles."

# Events #
 ab_arles.1.t: "The Reunification of Arles"
 ab_arles.1.d: "Today is a day worthy of celebration across Arles. The Kingdom of Arles was once a unified realm until the death of Emperor Charles the Fat. Infighting between the Burgundian lords due to dynastic claims weakened and separated the realm, and even though it was reunified later the kingdom was still contested between two major power centers. This era of division was only strengthened following the death of Otto the Just in Barcelona. Yet today, despite all odds, the Arelat was reunified and restored to its former glory. May our kingdom never see a single day of division ever again!"
 ab_arles.1.a: "Long live the Kingdom of Arles!"

# Modifiers #
 ars_reunited: "Reunited the Burgundies"

### LOTHARINGIA ###
# Countries #
