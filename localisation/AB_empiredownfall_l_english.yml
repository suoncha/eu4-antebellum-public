# Ideas #
 SXC_ideas: "Saxon Count Ideas"
 SXC_ideas_start: "Saxon Count Traditions"
 SXC_ideas_bonus: "Saxon Count Ambition"
 sxc_first: "Siege Warfare Tactics"
 sxc_first_desc: "Owing to the numerous fortified estates that dot Western Saxony, siege warfare is frequently practised, and expected to be understood by each count."
 sxc_second: "Westphalian Cloth Industry"
 sxc_second_desc: "Westphalia is home to various regions that specialise in making fabric, we should encourage their production over the disgusting furs from beyond the sea."
 sxc_third: "Ever-Shifting Alliances"
 sxc_third_desc: "Frequent conflicts have often seen just frequent making and breaking of alliances. Perhaps it is time to look further afield for allies?"
 sxc_fourth: "Extravagant Court Parties"
 sxc_fourth_desc: "Diplomacy in Saxony, is just as extravagant as its wars. The various noble houses seek to make, or reform new ties as prospective marriage partners also show up to take part in the festivities, be it from inside or outside the region."
 sxc_fifth: "Saxon War Veterans"
 sxc_fifth_desc: "Saxon Wars, often inconclusive, have given rise to new tactics from those who survive. Our armies shall seek to outmanoeuvre any foe that clumsily tries to face us."
 sxc_sixth: "Churches of Saxony"
 sxc_sixth_desc: "Westphalia is noted to be a land of many churches. Regardless of whether we still follow the Pope, these churches are still important to our faithful and keep them at ease."
 sxc_seventh: "Nobility Court Reform"
 sxc_seventh_desc: "As the years have dragged on a state that relies on its scheming nobility has its downsides. To remedy this, reforms along a more meritorious line allows for at least a less incompetent court."

### AUSTRIA ###
# Ideas #
 sty_first: "Protectors of the Realm"
 sty_first_desc: "For centuries, the Dukes of Styria were amongst the most valued lords of the Holy Roman Empire as they guarded its eastern borders from invaders."
 sty_second: "Rapid Mobilization"
 sty_second_desc: "In times of need, we have to make sure that our men are prepared for combat as soon as possible."
 sty_third: "Maintain the Fortifications"
 sty_third_desc: "Eastern parts of our realm are hugely on the plains of Transdanubia, providing a terrain advantage to us. We need to build strong fortifications in those regions and make sure that they are maintained."
 sty_fourth: "Military Tradition"
 sty_fourth_desc: "Most of our nobles and soldiers are strong men, forged in battle. Our army is strongly militarised and the military tradition must be preserved."
 sty_fifth: "Forged in Battle"
 sty_fifth_desc: "Styrians fought countless battles to protect the borders of the Empire from outside threats. Our experiences from battles allows us to keep high morale and stability throughout the entire country even after initial drawbacks."
 sty_sixth: "Conquest in the Name of the Emperor"
 sty_sixth_desc: "Our conquest of neighbouring lands is legitimised by the Emperor himself. The land that we conquer and attach to the fiefs of the Empire is rightfully ours."
 sty_seventh: "Iron Formations"
 sty_seventh_desc: "Our soldiers fight in the formations that are hardly ever broken, even by the shocking and unexpected movements performed by our enemies on the battlefield."
 STY_ideas: "Styrian Ideas"
 STY_ideas_start: "Styrian Traditions"
 STY_ideas_bonus: "Styrian Ambition"

### BOHEMIA ###
# Countries #
 RENAME_CZECHIA: "Czechia"
 RENAME_CZECHIA_ADJ: "Czech"

# Reforms #
 wenceslas: "Crown of St. Wenceslas"
 wenceslas_desc: "The estates of Bohemia hold immense power and are the ones who elect the future Bohemian king. Even though the dynasties of Premyslids and Luxembourgs made the election seem hereditary, it was mostly done by granting various privileges to the estates or buying enough votes. We must be cautious and do not enrage the estates if we wish to keep our dynasty on the throne."
 bohmining: "Reform Bergordnung"
 bohmining_desc: "The mining laws and regulations should be reviewed and if needed, reformed and modernized. If we manage to create a good environment for the miners, all of Bohemia will prosper!"
 bohelection: "Support of the Nobles"
 bohelection_desc: "The election of a king in Bohemia is largely controlled by the estates of our lands. If we wish to retain the throne for our dynasty, we must ensure that the estates are always backing our candidate."
 bohsnem: "Zemsky Snem"
 bohsnem_desc: "The growth of our realm requires an establishment of a new constitutional body. The new Bohemian Diet will ensure that the lords and peasants of the lands of the Bohemian crown have an extensive share in the political sphere."

# Decisions #
 boh_wenceslas_title: "Abolish the Bohemian Elective Monarchy"
 boh_wenceslas_desc: "As our dynasty has secured its strong position and the country of Bohemia is under our full control, we can finally abolish the elective monarchy and become hereditary rulers of the Czech lands."

# Events #
 ab_bohemia.1.t: "Return of the Hussites"
 ab_bohemia.1.d: "In the wake of the Hussite wars, Rudolf II Hohenstaufen was installed as Bohemian King. Victors of the Hussite wars seeked to adopt recatholisation measures and bring the Czech people back to the true faith. Despite numerous attempts to settle the conflict, the peace between Hussites and Catholics have broken down. Jiri z Podebrad, leader of the Hussite faction captured Prague and killed the rightful King of Bohemia. That traitor with no legitimacy proclaimed himself the king and is now seeking to secure religious freedom for the followers of Hus. Adoption of a heretic faith is a serious outlawry and treachery, threatening to weaken and destabilize the Empire. Archbishop-Electors are demanding that we take action and place Bohemia under an Imperial ban, revoking their seat at the electoral college and causing them to be thrown into a political isolation. What should we do?"
 ab_bohemia.1.a: "Issue an Imperial Ban"
 ab_bohemia.1.b: "Imperial Ban would solve nothing"
 ab_bohemia.2.t: "Emperor Revokes the Bohemian Electorate"
 ab_bohemia.2.d: "An envoy from the Imperial court has arrived, informing our King that the Emperor has decided to place the Kingdom of Bohemia under an Imperial Ban, revoking our electorate and placing our country into even greater political isolation. They have declared us the enemies of the faith and the Empire."
 ab_bohemia.2.a: "Well then..."

 flavor_boh.14.t: "Hussite Isolation"
 flavor_boh.14.d: "Following our conversion to the Hussite faith, the Pope has condemned our country and the Christian countries are slowly turning their backs on us. This will tarnish our reputation for ages."
 flavor_boh.14.a: "Their opinion is irrelevant!"
 flavor_boh.15.t: "Protestant Reformation and the Hussites"
 flavor_boh.15.d: "The events of theProtestant Reformation caused turmoil within the Catholic church. New movement poses a religious and political challenge to the Roman Catholicism - and Papal authority in particular. With this unexpected chain of events, we are no longer the only country challenging the Roman church and the Papal condemnation of Bohemia has lost its value."
 flavor_boh.15.a: "It was only a question of time..."

