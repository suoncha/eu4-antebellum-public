### SLOVENIA ###
# Countries #
 SLV: "Carniola"
 SLV_ADJ: "Carniolan"
 SLC: "Carantania"
 SLC_ADJ: "Carantanian"
 RENAME_SLOVENIA: "Slovenia"
 RENAME_SLOVENIA_ADJ: "Slovenian"

# Ideas #
 SLV_ideas: "Slovenian Ideas"
 SLV_ideas_start: "Slovenian Traditions"
 SLV_ideas_bonus: "Slovenian Ambition"
 slv_unite_slovene_lands: "Unite the Slovene Lands"
 slv_unite_slovene_lands_desc: "By the tenth century, the expanding Germanic tribes conquered vast territories that belonged to our ancestors, reducing our realm only to present day Carniola. Our nation should primarily focus on retaking what was lost and restoring the former glory of our people. Those lands are rightfully ours!"
 slv_march_carinthia: "March of Carinthia"
 slv_march_carinthia_desc: "Following the subjugation of our nation, we have served the Holy Roman Emperors as protectors of their realm, guarding the eastern borders from Hungarians and Croats. This mission to protect the Empire created a military tradition which lives in us to this day."
 slv_ljubljana: "Archdiocese of Ljubljana"
 slv_ljubljana_desc: "Since 811, our lands have been under the ecclesiastical territory of the Patriarch of Aquileia. By establishing the Archdiocese of our own, we would achieve relative freedom from the neighbouring German and Italian jurisdictions. Our Archdiocese of Ljubljana will be subject only and directly to the Holy See!"
 slv_julian_alps: "Julian Alps"
 slv_julian_alps_desc: "Our western borders are guarded by the mighty Julian Alps, making it very difficult for enemies to lead a successful invasion of our country. This natural barrier gives us terrain advantage and would be very helpful in a case of defensive war."
 slv_slovene_language: "Standardised Slovenian Language"
 slv_slovene_language_desc: "Continuous Germanization of the Slovene Lands may lead to extinction of our language. As of now, our language is mainly a language of peasantry, while German and Italian are languages of nobility. Under the foreign influences, our language will remain forgotten, therefore we should standardise it and spread it not only amongst our peasantry, but the nobility as well!"
 slv_baroque: "Slovenian Baroque"
 slv_baroque_desc: "In the late 17th century, many Italian Baroque artists, mainly architects and musicians, settled in Slovene Lands and contributed greatly to the development of the local culture."
 slv_legacy_carantania: "Legacy of Carantania"
 slv_legacy_carantania_desc: "Even though the country of Carantania disintegrated centuries ago, it is a proof of our nation's strength and gives us legitimacy to retake our ancient lands from the hands of Germanic invaders!"

# Decisions #
 rename_slovenia_title: "Rename the Country to Slovenia"
 rename_slovenia_desc: "This decision allows you to embrace a more modern name of your country."
 form_carantania_title: "Form Carantania"
 form_carantania_desc: "Our ancestors once ruled a mighty realm of Carantania - stretching from the Adriatic coast to the Moravian kingdom. We must banish the Germanic invaders from our ancestral lands and restore this glorious kingdom!" 

### PRUSSIA ###
# Countries #
 NRD: "Nordmark"
 NRD_ADJ: "Nordmarker"
 DRE: "Dresden"
 DRE_ADJ: "Dresdener"

# Ideas #
 NRD_ideas: "Nordmarker Ideas"
 NRD_ideas_start: "Nordmarker Traditions"
 NRD_ideas_bonus: "Nordmarker Ambition"
 nrd_first: "Expand the Marches"
 nrd_first_desc: "The Northern March seeks to do what the Thuriginans have failed to do, subjugate the pagans. With each conquest we add to the growing march lands."
 nrd_second: "Land of Border Conflicts"
 nrd_second_desc: "Our northern and eastern are filled with heathen raiders. Over time, we have adopted new methods and tactics which allow us to effectively raise a new military unit once such a raid happens."
 nrd_third: "Fierce Leadership"
 nrd_third_desc: "The pagan enemies we face are fierce combatants. Ferocity shall be meant with ferocity, for we shall overcome them. "
 nrd_fourth: "War Against the Heathens"
 nrd_fourth_desc: "We do not face nations, but mere tribes, we shall take their vaunted lands, and bring God and civilization."
 nrd_fifth: "Nordmark Drill"
 nrd_fifth_desc: "Our armies aren't numerous due to the smaller size of our realm. Our warriors must be well trained even if they are to return to their arms."
 nrd_sixth: "Lessons of Wars Past"
 nrd_sixth_desc: "Every conflict tells its own story. From these stories we teach how we have succeeded or failed to future generations, to respectively repeat or overcome such lessons."
 nrd_seventh: "An Ever Growing March"
 nrd_seventh_desc: "Our March stretches from the coasts near Lubeck to the lands of the Prussian in the distant east. We shall build a true northern march in these lands."

 dre_first: "Conciliatory Administration"
 dre_first_desc: "Our interactions with heathens - ranging from barbaric Baltic mercenaries to humble Slavic peoples - have given us a degree of tolerance. Their strange ways no longer offend or disgust us as much as they used to. Thus, we rule over their disorderly masses with greater ease."
 dre_second: "Exploiting New Trade"
 dre_second_desc: "These strange lands are not without ripe river systems and dazzling business opportunities. Amber, fish, timber and more await us - and with brave enough soldiers and wily enough merchants, we may establish many a monopoly over the brave new lands we conquer."
 dre_third: "Crossroad of Religions"
 dre_third_desc: "Eastern Germania has and always will be a peculiar place. The German world meets the Slavic world here. Many vile Norsemen may come by, not necessarily to do evil deeds, but to conduct good commerce and clever diplomacy. As a result, we come by many new servants of the state with ease, including merchants."
 dre_fourth: "Friends Across Faiths"
 dre_fourth_desc: "In these harsh and uncertain times, alliances of necessity come about. We have had to develop a certain shrewdness in diplomacy - and much as we dislike it, we have found many worthy allies of different faiths and creeds."
 dre_fifth: "New Tax Codes"
 dre_fifth_desc: "If we are to exploit these new frontiers to their fullest, we must not practise undue leniency. Those peasants who settle within our new acquisitions must live by rigid and firm tax codes to provide the state with all the income it needs."
 dre_sixth: "Sponsor New Towns"
 dre_sixth_desc: "We cannot expect these unruly masses to erect cities on their own. No, we must streamline the development process - funnel gold, manpower and resources into burgeoning new settlements and struggling destitute towns. Our new acquisitions won't remain backwaters forever - they shall soon be integral lands."
 dre_seventh: "Dominating the River Trade"
 dre_seventh_desc: "With the rivers of Germany falling under our grasp, we may very well end up gatekeepers of the Baltic Sea. We would be fools to ignore this opportunity. With some mercantile cunning, we may establish total control over the region's trade, or at the very least dominate its ebb and flow with our ruthless tactics."

# Decisions #
 form_brandenburg_title: "Form Brandenburg"
 form_brandenburg_desc: "Having pushed our borders into Wendish lands, we brought vast territories under imperial control. Let us take the role of margraves and protect the imperial lands west of Oder river."

# Events #
 ab_brapru.3.t: "The German Confederation"
 ab_brapru.3.d: "With our dominant position within the region of Germany, our advisors have proposed that we invite the remaining German states into a confederation with us. We must abandon the Holy Roman Empire and lead the German nation towards its unification. The dream of a unified Germany is within sight!"
 ab_brapru.3.a: "Send the invitations"
 ab_brapru.4.t: "Invitation to the German Confederation"
 ab_brapru.4.d: "The [From.GetTitle] of [From.GetName] has requested that we join the Prussian led Confederation of Germany. By giving up our sovereignty to them, we could ensure our nation's prosperity and protection."
 ab_brapru.4.a: "Join the Confederacy"
 ab_brapru.4.b: "Accept their rule"
 ab_brapru.4.c: "We will not participate in this confederacy"
 ab_brapru.6.t: "[From.GetName] joins the State"
 ab_brapru.6.d: "[From.GetName] has requested their entry directly into our state"
 ab_brapru.6.a: "Welcome brothers!"
 ab_brapru.7.t: "[From.GetName] declines the invitation"
 ab_brapru.7.d: "The fools in [From.GetName] have refused our invitation to join the German Confederation"
 ab_brapru.7.a: "They have chosen"
 ab_brapru.8.t: "The Burning of Arkona"
 ab_brapru.8.d: "For centuries, the isle of Rügen served as one of the most sacred holy sites of the Pagan Slavs. The temple of Arkona on the island was a home to the High Priest of Veleti, who held authority over the Slavic tribes. With our expansion into the Polabian region, we have burned every single place of Pagan worship that we have stumbled upon. The burning of Arkona will be the greatest achievement and a proof of our triumphant victory in the Wendish Crusade."
 ab_brapru.8.a: "Burn it!"

# Modifiers # 
 pru_expansion: "German Expansionism"
 pru_west: "Westphalian Campaign"
 bra_confederation: "German Confederation"

# Missions #
 nrd_brandenburg_title: "Proclaim Brandenburg"
 nrd_brandenburg_desc: "Following our conquests of the Wendish lands, it has earned us great prestige amongst our imperial peers. We should take the opportunity to proclaim the Duchy of Brandenburg, for we are no longer a march, we are something greater now. Let people remember Brandenburg as one of the honoured defenders of Christendom, and let other Christians in trouble learn from us."
 nrd_convert_title: "Convert the Pagans"
 nrd_convert_desc: "One of our primary goals of subjugating the pagans is to spread Christianity to them. Let us not forget this goal and make haste to convert all the pagans to our religion, the one true Christian faith."
 nrd_obotrites_title: "Dismantle the Obotrites"
 nrd_obotrites_desc: "One of the most powerful pagan tribes is the Obotrites. They must be dismantled and conquered immediately before they pose a threat to the imperial borderlands."
 nrd_protectors_title: "Protectors of the Empire"
 nrd_protectors_desc: "We are special among the princes. We are the protectors of the empire, the protectors of Christendom in this corner of the world, and a force that defends the German people from the barbaric behaviours of the pagan Slavs."
 nrd_veleti_title: "Wendish Heartland"
 nrd_veleti_desc: "Our conquest of the Obotrites bring us to the heartland of the Wendish pagans. It is now our duty, as an imperial march, to subjugate the region and spread both our more civilised way of life amongst the barbarians and to spread the word of God amongst the pagans."
 bra_arkona_title: "Burn Arkona"
 bra_arkona_desc: "In order to break down the spirit of Slavic resistance, we should destroy   the pagan temple at Cape Arkona. Only with their faith shattered shall they kneel."
 bra_build_manufactories_title: "Industrialize the Country"
 bra_build_manufactories_desc: "Our economy largely depends on the gold. We should industrialize ourselves and build plantations because if the gold ever runs our, we will face a crisis."
 bra_north_title: "North German Confederation"
 bra_north_desc: "Northern Germany shall be reorganised into a Confederation in which we reign supreme with an iron, but fair, fist. Soon, there will be nothing to stand in our way."
 bra_push_title: "Push into Germany"
 bra_push_desc: "The conquest of Lower Saxony and the surrounding area shall serve as our very own Rubicon, from which we shall march into the pages of military history!"
 bra_rhine_title: "Claim the Rhineland"
 bra_rhine_desc: "The Rhineland has been eyed greedily by the great powers of Europe for many an age due to its wealth. Aside from revenue, it is perfectly situated as a springboard for our ambitions."
 bra_show_title: "A Show of Strength"
 bra_show_desc: "Before we can stake a claim to any great swathes of land in Germany, we must first demonstrate to the Princes that we are a force to be reckoned with."
 bra_west_title: "Westphalian Conquest"
 bra_west_desc: "The Westphalian region may not inspire the same envy as the Rhineland, however it will nonetheless prove an excellent mustering ground for further conquests westwards."

# Mission Tooltips #
 BRA_CONFEDERATION: "§RCompleting this mission will cause you to vassalize or directly annex all the remaining independent German countries. Keep in mind that vassalized countries do take a diplomatic relation slot!§!\n \n"

### HANSA ###
# Countries #
 HAS: "Hansa"
 HAS_ADJ: "Hanseatic"

# Ideas #
 HAS_ideas: "Hanseatic Ideas"
 HAS_ideas_start: "Hanseatic Traditions"
 HAS_ideas_bonus: "Hanseatic Ambition"
 HAS2_ideas: "Hanseatic Ideas"
 HAS2_ideas_start: "Hanseatic Traditions"
 HAS2_ideas_bonus: "Hanseatic Ambition"
 hsa_second2: "Hanseatic Leifland Company"
 hsa_second2_desc: "Leifland, the vast land known by the Norse, could prove to be valuable. A new Leifland company should be established to settle these lands."
 hsa_first: "Generous Contracts"
 hsa_first_desc: "Owing to its status as a union of the Cities the Hanseatic league does not have much of an army outside of militia, to remedy this the Hansa paid Mercenaries more when it came to the defence of their cities."
 hsa_second: "Hanseatic Leifland Company"
 hsa_second_desc: "Leifland, the vast land known by the Norse, could prove to be valuable. A new Leifland company should be established to settle these lands."
 hsa_third: "Improve the Hansestadt Defences"
 hsa_third_desc: "The fortifications that surround Hamburg and Bremen must be expanded to resist the advent of cannon fire. If successful they can be used in other fortifications."
 hsa_fourth: "Encourage the New World Leagues"
 hsa_fourth_desc: "As our colonial companies have taken on a life of their own, they too are starting to form their own leagues of towns and small cities. We should encourage this as a testament to freedoms afforded by the Hansa."
 hsa_fifth_desc: "Our ships dominate from the Baltic to Brutzel-land. Can it really be called pride if our ship’s crews are the finest in the world  "
 hsa_sixth_desc: "As galleys are worthless on the high seas, we have been incentivized to adopt new tactics. These new Adler ships based on the Alder von Bremen emphasise broadsides of overwhelming power to destroy any foe."
 hsa_seventh_desc: "Our ships travel the distant seas and are synonymous with opportunity. Because our merchants are welcomed almost everywhere. "
 hsa_fifth: "Pride of the Northern Seas"
 hsa_sixth: "Adler Ship Tactics"
 hsa_seventh: "Hanseatic Ships on Distant Shores"

# Reforms #
 hansahansetag: "Hansetag"
 hansahansetag_desc: "The Hansetag is a parlament esque body of representatives, each representing one of the many cities of the Hanseatic League, the Hansetag is called each time an issue encompasses multiple League cities, during the meeting the issue is addressed and hopefully resolved. \n \n The Hansetag has served us wonderfully so far, promoting unity within the league while also guaranteeing autonomy and rights to every city, if we want our league to prosper we should encourage and expand the Hansetag."
 hansacentralize: "Centralize the League"
 hansacentralize_desc: "As new cities become integrated into the League a massive problem arises, the massive decentralization makes it impossible to effectively govern them all, we simply cannot cater to every need and whim of every single city withouth creating problems for other cities or without exhausting our bureaucracy, a new controversial approach is needed. \n \n If we centralize our grip over the many autonomous cities we can resolve the many issues they face with much more independence and without the fear of upsetting some stuck up merchant family in another city 300km away. \n \n This will be a very controversial move that will no doubt inspire many protests from the autonomous cities, some even argue that centralizing our rule might kill the soul and purpose of the League, but with this reform we can focus on much more important matters then petty squables between cities while also guaranteeing their true rights and autonomy."
 hansaleifland: "Expand the Leifland Company"
 hansaleifland_desc: "The New World has so much untapped economic potential it is almost unbelievable that so little of it is utilized, sugar, coffee, some of the most fertile land in the world, tobbacco, corn, so many new fruits and mountains upon mountains of gold, it seems as If the continent not so long ago discovered is a land of milk and honey, but most importantly profit. \n \n The vast pools of resources sitting on this empty land almost beg to be used. \n \n So far the Leifland Company has asisted us in the colonization of these rich lands, the brains of the company allowed us to tap into these riches, making the ports of North Germany an entry for all these goods to the rest of central europe, but if we want to truly exploit all that God has laid down for us just one ocean away, we will need to massively expand the company's operation."
 hansacolonial: "Colonial Governors"
 hansacolonial_desc: "Our power lies in the New World where rich colonies produce massive amounts of money, the colonies indeed became so massive and rich that their issues outgrew the issues of League Cities in their importance, maybe the League at first was to cater to German city states in the north, but as of right now the League mainly exists to transport new world goods to the German cities, from which they spread across the rest of europe, it is time to acknowledge reality and stop clinging upon our old ideals, the League should be redesigned in a way that gives colonial governors true control over it, so that the whims of little cities in Germany no longer holds the League back."

