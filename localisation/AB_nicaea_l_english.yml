 #New events
 ab_nicaea.12.t: "Gemistos Plethon"
 ab_nicaea.12.d: "Our court has recently been approached by Gemistos Plethon, a man whose speeches have drawn large crowds and stirred heated debate. He claims that [Root.GetName] must cast aside the lingering shadow of Roman legacy embraced by the Byzantines and return fully to the ancient spirit of the Hellenes. While many of our advisors already despise the decadent Roman traditions of Constantinople, many fear that Plethon may be going too far."
 ab_nicaea.12.a: "Let him remain at our court."
 ab_nicaea.12.b: "His radical teachings must be silenced!"
 ab_nicaea.12.a.tt: "This option will lead to more events about the §YHellenic§! faith."
 ab_nicaea.13.t: "Spread of Plethon's Ideas"
 ab_nicaea.13.d: "Plethon, known for a certain silver tongue and a charm not dissimilar from that boasted by philosophers of old, has wormed his way into the pocket of many a nobleman. Whilst touring the towns and estates under which they lord, he has purportedly been engaging members of the public by promise of free bread and wine. During these idle gatherings, he and his more affluent followers have taken to disseminating their Pagan ideas - planting the seeds of curiosity, watered by social restlessness, as well as a pervasive mistrust of the Orthodox Church, of which we can only blame our Byzantine predecessors. Religious fractures are beginning to beset our society at the behest of this thinker's teachings - and they are becoming ever more tangible by the day."
 ab_nicaea.13.a: "What a curious development."
 ab_nicaea.13.b: "Crush this in the cradle."
 ab_nicaea.13.a.tt: "This option will lead to more events about the §YHellenic§! faith."
 ab_nicaea.14.t: "Hellenism Spreads Throughout the Nation"
 ab_nicaea.14.d: "Plethon has been growing ever more embedded in our court, and the effect is no longer unnoticeable. Courtesy of the favour he has been currying with mercantile figures, nobles of import and lauded commanders, his influence has begun penetrating the provinces themselves. What began as philosophical diatribes on the greatness of our forefathers, confined initially to academic sparring and drunken rambling, has become a rapidly-disseminated movement picking up exponential pace. Plethon's sermons have even become punctuated by significant feasts - sponsored by his newfound allies - reminiscent of the Pagan days of old. Murmurs of fledgling cults now breathe through town and countryside alike - leaving churches, in some localities, suspiciously barren, much to the growing unease of the clergy."
 ab_nicaea.14.a: "These are excellent developments!"
 ab_nicaea.14.b: "This has gone too far - send in the troops!"
 ab_nicaea.22.t: "Hellenism Makes Its Way to [Root.Capital.GetName]"
 ab_nicaea.22.d: "The Old Gods are making leaps and bounds across provinces that have not known their names for over a thousand years. Cities in particular have been drawn to the cause - social alienation, stemming from rapid urbanisation, has created a burgeoning underclass of restless peasants dissatisfied with the hollow comforts of the church. Desperate for a new sense of community bolstered by a refreshing modern morality, many a disenfranchised peasant has wandered into a local Hellenic sermon, swiftly becoming entranced by the ritualism and kinship. This process has seemingly accelerated as of late - [Root.Capital.GetName] has seen a particular concentration of uprooted peasantry, and their subsequent desperation for belonging has become insatiable. The new Hellenism seems to be spreading like wildfire amidst the populace - representing a perhaps irreversible tipping point in our country's newfound transformation."
 ab_nicaea.22.a: "Nothing can stop this now."
 ab_nicaea.22.b: "Enough! Rout these heathens!"
 ab_nicaea.23.t: "[Root.Monarch.GetName] Embraces Hellenism"
 ab_nicaea.23.d: "The Hellenic tide has become an inevitability. Churches once bustling lay abandoned - some have even been mutilated, desecrated, cast to smithereens by the disenfranchised hordes of Hellenic converts. Others have taken to repurposing old clerical infrastructure for the faith. The transformation has transcended the spiritual - it has now begun changing the very face of our nation, materially and logistically. To fight this great change is akin to holding back the tide with one's bare hands - thus, it seems [Root.Monarch.GetName] has no other choice but to join his countrymen in the new faith." 
 ab_nicaea.23.a: "The time has come."
 ab_nicaea.23.b: "This has been a grave mistake..."
 ab_nicaea.24.t: "Annihilation of Rome"
 ab_nicaea.24.d: "The siege weapons churn, the warriors bellow and the sky darkens with amassing terror. The countryside surrounding Rome has become a wasteland akin to the Underworld itself - the sheer destruction, courtesy of our prolonged siege with its ruthless foraging and brutal suppression of native Romans, has become a fixture upon the landscape. Farms lay blackened, families lay massacred and ancient monuments once standing revered now crumble in the shade of our amassing forces. As the city gates fall at last to our hammers of war, one question remains - shall Rome be struck from the face of the world, forever, relegated to history by a cataclysm of blade and fist, or shall it become but another prize within our possessions?"  
 ab_nicaea.24.a: "Roma delenda est."
 ab_nicaea.24.b: "Spare them."
 
 ab_nicaea.25.t: "The Light of Allah"
 ab_nicaea.25.d: "In the stillness of the night, [Root.Monarch.GetName] was overtaken by a vision unlike any other. A radiant light pierced the darkness, and from it came a voice that was calm, commanding, and absolute. It was the voice of Allah.\n\nIn this dream, the truth of the world was unveiled: the oneness of Allah, the finality of His revelation, and the error of all who had strayed from His path. Was this a divine revelation meant to guide not only him, but all his people?"
 ab_nicaea.25.a: "The entire nation will see the Light of Allah!"
 ab_nicaea.25.b: "This is madness..."
 
 ab_nicaea.27.t: "Seleucid Restoration"
 ab_nicaea.27.d: "For the first time in over a thousand years, wholly Greek rulers, unbound by Roman flagellation, dominate the Levant. Once more does our tongue proliferate, coursing through local administration and marketplaces alike. This trend shall only grow, but not without resistance. To ensure the Levant becomes an integral part of the Hellenic world once more, it requires dedicated oversight. A number of suggestions have arisen - including the formation of a new regime outright, somewhat autonomous, named after the Seleucid rump of old."
 ab_nicaea.27.a: "We shall rule the region directly."
 ab_nicaea.27.b: "A governong shall rule it in the name of the Crown."
 ab_nicaea.27.c: "The Basileus of Hellas shall also be the Basileus of Seleucia!"
 ab_nicaea.27.de: "We shall become the governors of Seleucia"
 ab_nicaea.27.e: "We will rule Seleucia in the name of Basileus"
 ab_nicaea.28.t: "Revival of Greco-Bactria"
 ab_nicaea.28.d: "A somewhat obscure fixture of our Hellenic past was the existence of Greco-Bactria - a bastion of Hellenic identity embedded deep in the east. Long has it since faded from memory. With our resurgent strength and the subsequent influx of Hellenic settlement, however, the question has arisen as to whether we should relegate the region to an obedient vassal regime or rule it directly."
 ab_nicaea.28.a: "We shall rule the region directly."
 ab_nicaea.28.b: "A governong shall rule it in the name of the Crown."
 ab_nicaea.28.c: "The Basileus of Hellas shall also be the Basileus of Bactria!"
 ab_nicaea.28.de: "We shall become the governors of Bactria"
 ab_nicaea.28.e: "We will rule Bactria in the name of Basileus" 
 
 # Personalities #
 grand_tactician_personality: "Grand Tactician"
 desc_grand_tactician_personality: "This ruler is a Grand Tactician. Our monarch possesses an exceptional understanding of the battlefield. Through careful maneuver, disciplined formations, and an eye for opportunity, they consistently place our armies in positions where victory becomes inevitable."
 grand_tactician_personality_die_desc: "The mind that guided our armies with such precision has fallen silent."
 
 #NIs
 bactria_ideas: "Bactrian Ideas"
 bactria_ideas_start: "Bactrian Traditions"
 bactria_ideas_bonus: "Bactrian Ambition"
 bactria_ideas_1:0 "Basileia tes Baktrianes"
 bactria_ideas_1_desc: "Secluded far from our forefathers deep in the Orient, we must fight if we are to survive. Originally a satrapy under Seleucid control, our illustrious progenitor Diodotus rebelled against their tyranny and forged a powerful eastern kingdom in Bactria."
 bactria_ideas_2:0 "Land of a Thousand Cities"
 bactria_ideas_2_desc: "Long known as the Land of a Thousand Cities, we rule over an extremely Hellenized and prosperous empire. Some of the greatest cities of the Hellenic world lie under our control, and our wealth astonishes all who see it."
 bactria_ideas_3:0 "Phrourion"
 bactria_ideas_3_desc: "The phrouria, or military forts that dot our landscape, serve two purposes. First, they serve as regional settlements for the many Greek immigrants in our empire. Second, they defend against the multitude of ferocious steppe warriors to our north. Under this system of regional defense, we can hope to survive where our ancestors did not."
 bactria_ideas_4:0 "Elephantarch"
 bactria_ideas_4_desc: "Originally established by Alexander the Great, the Lord of Elephants was a role designed to procure and lead our ample stocks of war elephants on the field. We should look to reforge this position, given our close proximity to India, so we can once again terrorize our enemies with our might."
 bactria_ideas_5:0 "Silk Road Wealth"
 bactria_ideas_5_desc: "Situated at the crossroads of Asia, we have ample access to the lucrative silk routes between East and West. Not only does this provide us with great wealth, but it also allows us to maintain good relations across all of Asia, from Syria to China."
 bactria_ideas_6:0 "Greco-Buddhist Syncretism"
 bactria_ideas_6_desc: "Many religious and cultural concepts from India have penetrated our realm, in no small part due to our close proximity to the Indus. This has sparked a massive syncretic movement among our populace and allows for an extremely tolerant realm."
 bactria_ideas_7:0 "Eucratid Ambition"
 bactria_ideas_7_desc: "Long ago, the successors of Diodotus penetrated deep into India, becoming local hegemons of the region. With the rajas of India weakened by centuries of infighting, the time has come to take up the banner of Menander and march across the Indus once more."
 gegypt_ideas: "Egyptian Ideas"
 gegypt_ideas_start: "Egyptian Traditions"
 gegypt_ideas_bonus: "Egyptian Ambition"
 gegypt_ideas_1:0 "Greek Pharaohs"
 gegypt_ideas_1_desc:0 "We are kings of both Greeks and Pharaohs of Egypt. As such the combination of Greek and Egyptian bureaucracy allows for an extremely adaptable and effective governing apparatus. "
 gegypt_ideas_2:0 "Kleruchoi"
 gegypt_ideas_2_desc:0 "Greek military settlers holding royal lands, in exchange for their continued service in our armies. Since they have ample help cultivating their wealthy lands, they are well equiped, supplied, and trained. They form the backbone of our armies."
 gegypt_ideas_3:0 "Basilikon"
 gegypt_ideas_3_desc:0 "The Basilikon or royal monopoly gives the king complete ownership of virtually all major goods produced by the people. This lucrative system has allowed Egypt and its ruler to remain spectacularly wealthy for eons. It also helps provide an effective income stream for its it state and army. "
 gegypt_ideas_4:0 "Mouseion"
 gegypt_ideas_4_desc:0 "The library of Alexandria is renowned throughout the world as the foremost center of cultural and education. Directly funded by the state, we have access to the brightest minds of the Hellenistic world."
 gegypt_ideas_5:0 "Alexandrian Naval Might"
 gegypt_ideas_5_desc:0 "The dockyards of Alexandria have allowed Aegyptus to field one of the largest fleets in the whole of the Mediterranean. Through this we are able to control the islands surrounding us, and make sure trade flows freely into our lands. "
 gegypt_ideas_6:0 "Telonia"
 gegypt_ideas_6_desc:0 "The Telonia are our customs system along the coast. Our official state supervised trading network allows us the regulate the market to suit our needs. This system has cemented Alexandria as one of the economic capitals of the world. "
 gegypt_ideas_7:0 "Macedonian Heritage"
 gegypt_ideas_7_desc:0 "Since the days of Alexandros, the backbone of our armies have always been infantry, armed and heavily armored in the tradition ways. While we always must adapt to the changing tides of warfare, our infantry will never lose sight of who they are."
 seleucid_ideas: "Seleucid Ideas"
 seleucid_ideas_start: "Seleucid Traditions"
 seleucid_ideas_bonus: "Seleucid Ambition"
 seleucid_ideas_1:0 "Katoikia Settlements"
 seleucid_ideas_1_desc:0 "Our state is reliant on the foundation of newly established greek cities to sustain itself. We are the great city builders of the east, and must continue this trend if we are to survive."
 seleucid_ideas_2:0 "Elephants and Cataphracts"
 seleucid_ideas_2_desc:0 "The core of our military prowess comes from our extensive use of war elephants and heavily armored cataphracts, which have played the decisive factor in many battles. Often called the elephant kings, the Seleucid charge strikes fear into the hearts of her enemies."
 seleucid_ideas_3:0 "Nomismatokopeia"
 seleucid_ideas_3_desc:0 "Our royal mints form a key factor in the success of our empire, and the monetization of the near east as a whole. The allow for a strong and exploitable enconomy from sea to sea."
 seleucid_ideas_4:0 "Argyraspides"
 seleucid_ideas_4_desc:0 "The silver shields the most elite soldiers of our army, tracing their origins back to Alexandros himeself. Armed with the highest levels of equipment wealth can buy, they form the bulwark of our army."
 seleucid_ideas_5:0 "Odyssey of Seleucus"
 seleucid_ideas_5_desc:0 "The odyssey of Seleucus, is the core narrative of our state, a longing to return back home from Alexander's conquests. While Seleucus was killed before he could finish his homecoming, we have not forgetten and we seek to return back to Macedonia, where it all started."
 seleucid_ideas_6:0 "The Royal Road"
 seleucid_ideas_6_desc:0 "The royal road is carry over of the old Persian infrastructure, and their mobile administration. We are always on the move, and as such our realm has some of the best roads in the world."
 seleucid_ideas_7:0 "Satrapia"
 seleucid_ideas_7_desc:0 "The semi-autonomous satrapies of the Persians are a remarkable governing system. It allows us to effectively administer large swaths of land, and continue to thrive for centuries to come."