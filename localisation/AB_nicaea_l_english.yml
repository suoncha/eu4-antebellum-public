 #Missions
 nicene_the_balkan_frontier_title: "The Balkan Border"
 nicene_the_balkan_frontier_desc: "Althought the Balkans are not historically recognized as a part of the Hellenic world, the nations of the peninsula have previously attempted to threaten Byzantium. We must push the border further from our heartland and establish a military frontier there that would keep us safe from their incursions."
 nci_branching1_title: "Branching Mission"
 nci_branching1_desc: "This mission can be unlocked by completing the '§YFaith of the Hellenes§!' mission."
 nci_branching2_title: "Branching Mission"
 nci_branching2_desc: "This mission can be unlocked by completing the '§YFaith of the Hellenes§!' mission."
 NCI_MISSIONS_BRANCHING: "This mission can be unlocked by completing the '§YFaith of the Hellenes§!' mission."
 nicene_court_title: "Infiltrate the Decadent Court"
 nicene_court_desc: "Across the Bosphorus, the treacherous Byzantines languish in a quagmire of their own creation. Once a court to draw the envy of the Mediterranean, it is now a snake-pit of backstabbing jesters and monarchs as interchangeable as robes. With ease, we may penetrate its inner-workings - perhaps they are so dim and careless, we may simply walk straight into their gates, with sufficient cunning!"
 nicene_bulwark_of_christianity_title: "Bulwark of Christianity"
 nicene_bulwark_of_christianity_desc: "In the battle-hardened, war-scarred landscape of Anatolia and the greater theatre of Asia, the heavy duty of defending eastern Christendom falls upon our shoulders. We are the last stand against the assorted Saracen and Pagan hordes."
 nicene_battle_for_the_bosphorus_title: "Battle for the Bosphorus"
 nicene_battle_for_the_bosphorus_desc: "The Bosphorus links two worlds - the east and the west. Since time immemorial, the Romans have done well to sit upon it, and not only has it made them rich, but it has become their last line of defence, which they snivel and whimper upon whenever a besieging army befalls them. We must subdue this mighty feature of theirs with naval dominance - the Bosphorus shall be ours!"
 nicene_challenge_the_pretenders_title: "Downfall of the Pretenders"
 nicene_challenge_the_pretenders_desc: "There are many things that the Byzantines claim to be which they are not, and many which they are, which when rightfully mentioned, they recoil from like whimpering dogs. Pretenders, vipers, liars, lepers, fiends, betrayers, connivers - we must cast down their pride, obliterate it with sheer force, until they have naught save those terms to adorn them!"
 nicene_phoenix_title: "Phoenix Shall Not Rise Again"
 nicene_phoenix_desc: "Time and time again has the phoenix risen from the ashes. Time and time again has a force seemingly vanquished the old Roman ghost, occupied the Eternal City, only for some bumbling idiot farmer from Morea to wander back in, assume the crown and proclaim himself Basileus. This occurrence has blighted the Aegean countless times over. We must ensure it never does so again, and this phoenix is laid to rest."
 nicene_nicene_legions_title: "Nicene Legions"
 nicene_nicene_legions_desc: "Hardened by the violence of war-torn Anatolia, our people possess a unique spirit for conflict. While they still have this taste for blood, we must institute an army unlike anything seen before in the region, and dominate it once and for all."
 nicene_reclaim_tauris_title: "Reclaim Tauris"
 nicene_reclaim_tauris_desc: "Centuries ago, Tauris, better known as Crimea now, was a tranquil colony on the verge of the wild steppe sea of Scythia. Our ancestors founded humble colonies, gathering unique, exotic wealth via the hinterland trade routes. In recent times, these hinterlands have become barren, inhospitable plains blighted by steppe marauders. Tauris however remains not only a wealthy vestige, but also a vantage point. Reclaim it!" 
 nicene_latins_title: "Deal With the Latins"
 nicene_latins_desc: "The westerners - Franks, Latins, Italians, whatever contemptible title happens to befall them - have meddled in our affairs for too long. Countless cities razed, innumerable churches desecrated, plentiful rites interrupted - their disrespect must cease at once. Banish the Latins from the Aegean, for good!"
 nicene_empire_of_the_hellenes_title: "Empire of the Hellenes"
 nicene_empire_of_the_hellenes_desc: "At last, it may be at hand that the Hellenic world - that which remains of it, pitifully so - will be united anew. Under our banner, the Hellenes will be free from foreign oppression and assimilation once more - and our neighbours, treacherous ill-gotten fiends, will fear our name! Unlike the Byzantines of old, clinging to some pathetic notion of Roman identity, we shall be an empire Hellenic!"
 nicene_the_last_bastion_title: "The Last Bastion"
 nicene_the_last_bastion_desc: "The Romans cling stubbornly yet to a smidgeon on the coast of Asia Minor - Smyrna. We must smite the spiteful garrison there and remind the city of its rightful place - beneath our heel."
 nicene_liberate_greece_title: "Integrate Greece"
 nicene_liberate_greece_desc: "Bulgarians, Latins, Albanians - for too long they have attempted to lay claim to Greece proper, the heartland of our culture. The insipid Romans, with their pathetic leadership, have permitted this travesty - we must be the ones to correct it."
 nicene_restore_byzantion_title: "Restore Byzantion"
 nicene_restore_byzantion_desc: "The history of the Eternal City did not begin with Constantine. Prior, a town ancient, a town proud, Byzantion, existed in peace, bridging two ancient worlds, a testament to Hellenic longevity. To shed the constrictive, humiliating burden of Roman identity, we must restore Byzantion to its rightful place as a Greek metropolis, rather than a Roman tumor. The Roman Error, the Byzantine Blight, centuries long as it has endured, may finally be forgotten."
 nicene_push_the_frontier_title: "Push the Frontier"
 nicene_push_the_frontier_desc: "Anatolia has not yet fallen! The Turks have done grave damage, yes, but this state of affairs is not irreversible. We must push back, instigate a counteroffensive, if we have any hope to survive this onslaught."
 nicene_avenge_manzikert_title: "Avenge Manzikert"
 nicene_avenge_manzikert_desc: "Centuries ago now, our very culture was humiliated at Manzikert. The flailing Roman leadership, not dissimilar from that of some dopey donkey, made the simple mistake of not making a single intelligent decision, and in one fell swoop, lost a vast swathe of territory which has never been recovered. Now, we shall be the ones to vindicate our ancestors."
 nicene_secure_asia_minor_title: "Secure Asia Minor"
 nicene_secure_asia_minor_desc: "Asia Minor cannot be permitted autonomy in any fashion - its totality must belong to us. Our array of neighbours must bend, and break, until they are bowing before us, and Asia Minor is irrevocably ours."
 nicene_hellespont_title: "Secure the Hellespont"
 nicene_hellespont_desc: "The Hellespont has been an incredibly important corridor for all purposes, cross-continental trade most of all. A terminus of the Silk Road, any trader worth their salt will ensure lucrative deals are done in the bazaars of Byzantion. Unrivalled control of the Hellespont will mean everlasting prosperity for our rule."
 nicene_queen_cities_title: "The Queen of Cities"
 nicene_queen_cities_desc: "The combined efforts of the citizens, artisans, traders and intellectuals over time built Constantinople up  into the queen of cities, the most prosperous in all of Europe and Asia Minor. While they suffered stagnation under a long period of Roman decay, the city can now flourish once more with our support."
 nicene_megalopolis_title: "Byzantion the Megalopolis"
 nicene_megalopolis_desc: "Years upon years of tireless support and investment has built Byzantion into the largest city on this planet, with an economy and prosperity to rival those of entire sovereign states. The city itself has evolved to become a palace within an empire, showcasing to the world that we are at the forefront of everything."
 nicene_osmans_title: "Deals with the Ottomans"
 nicene_osmans_desc: "The Osman & Sons Company have always been greedy folk. From helping magnates selling watermelons to displaying exotic textiles at exorbitant prices, the inept and corrupt Byzantine market inspectors always turned a blind eye at the drop of a coin. Under our supervision, they may re-open - but under our terms and without their embezzlement."
 nicene_walls_title: "Theodosian Walls"
 nicene_walls_desc: "The Theodosian Walls were once the most impenetrable fortifications in the known world. It was only when the Roman emperors prioritised lavish parties, self-obsessed construction projects and overall mismanagement of the economy that cracks began to show. With a functioning and efficient administration back in charge of Byzantion, it will once more ward off even the most formidable opponents."
 nicene_resettle_sicily_title: "Resettle Sicily"
 nicene_resettle_sicily_desc: "The Grikos, descendants of Magna Graecia have remained one of the more prosperous diasporas of Greek heritage - mainly attributed to the volatile nature of control over Southern Italy. From Romans to Goths to Normans and Arabs, there has never been a long enough period for any southern Italians to adopt the culture of the court. As such, we already have a large advantage in resettling the region, starting with Sicily."
 nicene_destroy_rome_title: "Destroy Rome"
 nicene_destroy_rome_desc: "The Romans were a desiccated corpse left to rot in the Mediterranean sun, ruined by a spiralling descent into decadence and madness. With their sovereigns oft slain by those once charged to protect them, the foolish Romans left themselves to the vultures. The Latin inhabitants may stay, but any Roman vestiges must be eradicated!"
 nicene_nations_of_caucasia_title: "Nations of Caucasia"
 nicene_nations_of_caucasia_desc: "The Caucasian Greeks are distant relatives of Greek culture, owing to the fall of the Pontic states to the Turks and subsequent migration of Pontic Greeks into the Caucasus mountains. While they may not have inherited the Hellenistic ideals of the Nicaean people, we can still extend an olive branch to those willing to join us."
 nicene_march_on_babylon_title: "March on Babylon"
 nicene_march_on_babylon_desc: "When Alexander first tread on Mesopotamian lands, he saw the fertile crescent and incredible civil works, ruled by good men who happened to stand in the way of his vision. Now, the same Babylonian legacy is now governed by fraudulence, nobles who came to power in the absence of it. Alexander would want us to fix this problem, and restore one of the great cities of antiquity."
 nicene_restore_seleucia_title: "Restore Seleucia"
 nicene_restore_seleucia_desc: "Alexander made few mistakes in his short life - one was the decree for the rulership 'to the strongest'. The devolution of his empire into civil war for succession created the Diadochi, of which the Ptolemaic and Seleucid lines lasted the longest. The memory of the Seleucids is still fresh in the mind of the Iranian states, and we can take advantage of this."
 nicene_faith_title: "Faith of the Hellenes"
 nicene_faith_desc: "While we have inherited the Orthodox clergy as a result of Leon Gabras' plans to maintain stability across the Exarchate, there have been some murmurings of reviving our old faiths, of those that oversaw our homeland during the age of heroes. There have been many influential voices, none other than Gemistos Plethon who have called for dialogue of faith."
 nicene_shatter_the_roman_illusion_title: "[Root.GetPreviewColorNCI_RELIGION]Shatter the Roman Illusion[Root.GetPreviewColorNCI_RELIGION_end]"
 nicene_shatter_the_roman_illusion_desc: "Centuries ago, our Greek ancestors embraced the Rhomaioi illusion that has only grown hollow and burdensome. While guarding this fading identity, the Hellenic world fractured and fell under the sword of Islam. The Romans always believed that no matter how inept their rulers, how corrupt their armies and how tactless their diplomats were, that they could always return from the ashes of their own flames. The Romans must be crushed, and their legacy eradicated from this earth. Let us no longer be prisoners of a name that binds us to failure and instead reclaim the spirit of ancient Hellas. Its vigor, intellect, and unyielding cultural pride, tempered with the truth of the Holy Orthodoxy will see the rise of a renewed Greece."
 nicene_a_new_patriarchate_title: "[Root.GetPreviewColorNCI_RELIGION]A New Patriarchate[Root.GetPreviewColorNCI_RELIGION_end]"
 nicene_a_new_patriarchate_desc: "The Patriarchate of old stood as a universal institution, heir to an ecumenical vision that no longer reflects the needs of our people. Let us reform the Patriarchate into a pillar of our national revival. It shall become an instrument of unity, discipline, and purpose. Faith and state, intertwined, will guide our nation forward."
 nicene_return_of_the_pantheon_title: "[Root.GetPreviewColorNCI_RELIGION]Return of the Pantheon[Root.GetPreviewColorNCI_RELIGION_end]"
 nicene_return_of_the_pantheon_desc: "When the Roman invaders torched Greece in their hatred for defiance, they usurped our pantheon, bastardising them for their own use before casting them aside for the rapidly spreading Christianity. Ironically, this bastardisation has allowed pockets of domestic Hellenic faith to re-emerge rapidly with Plethonist assistance, even as far as the Pillars of Herakles."
 nicene_the_hellenic_reformation_title: "[Root.GetPreviewColorNCI_RELIGION]The Hellenic Reformation[Root.GetPreviewColorNCI_RELIGION_end]"
 nicene_the_hellenic_reformation_desc: "As much as Plethon's herculean effort has ensured stability in faith during our Hellenic reformation, we have still played it cautiously and only maintained cults of Zeus, Hera and Athena as a coincidental remnant of the Capitoline triad. By now, we should incorporate the greater Olympian pantheon, to encompass and ensure divine guidance for all trades and walks of life."
 nicene_chaldian_deposits_title: "Chaldian Deposits"
 nicene_chaldian_deposits_desc: "Since about the sixth century AD, the Pontic mountains of Chaldia have been known for their rich mineral deposits of lead, silver, and gold. For centuries, there were few attempts to mine them as the mountains are very inaccessible, but we should make efforts to open new mines in the mountains and extract these valuable raw materials for ourselves."
 nicene_secure_jerusalem_title: "Secure Jerusalem"
 nicene_secure_jerusalem_desc: "The fall of Jerusalem to the Persians and then the Arabs was the first stain on the illustrious record of the old Roman empire. Our duty as Christians is to recover the Holy City and safeguard it, so that it may never fall under heathen hands again."
 nicene_return_to_aegyptos_title: "Return to Aegyptos"
 nicene_return_to_aegyptos_desc: "Egypt, an epicentre of civilisation since time immemorial. The fall of the Nile marked the beginning of an inevitable decline for the Roman empire, and its return under Greek hands will certainly mark the rise of the Greek phoenix. While these lands may have changed dramatically in their time under Muslim dominion, our reconquest is certain to rekindle memories of its ancient past."
 nicene_rebuild_the_library_title: "Rebuild the Library"
 nicene_rebuild_the_library_desc: "The Library of Alexandria was a beacon of learning for centuries, until its destruction by the short-sightedness of Roman bishops. The teachings of the Renaissance and the Enlightenment, as well as the preservation work that Arab luminaries have endowed us with, will help us replenish this scholarly site."
 nicene_ptolemaic_restoration_title: "Ptolemaic Restoration"
 nicene_ptolemaic_restoration_desc: "The kingdom of Ptolemy, which administrated Egypt for three centuries before Rome's conquest, was a nearly perfect product of the Classical Age, melding the cultural wealth of Asia and the Mediterranean into a beautifully organised state. Bringing Egypt up to speed would be one thing, but we must endeavour to make it once again as avantgarde as it once was, as the strength of the Nile will make for excellent fuel in our upcoming conquests."
 nicene_granary_of_the_mediterranean_title: "Granary of the Mediterranean"
 nicene_granary_of_the_mediterranean_desc: "The loss of Egypt doomed Rome into a cycle of deterioration, as the loss of its breadbasket meant it could no longer sustain impressive standing armies and it was, for eight centuries, forced to rely purely on foreign mercenaries. Not only must we protect our newly conquered province, to ensure that it may never be lost again, but we should also make the most of it now that it is back in our hands. As we turn our bells into guns, we will turn our swords to plowshares."
 nicene_invasion_of_mashriq_title: "Invasion of Mashriq"
 nicene_invasion_of_mashriq_desc: "Antiochs and Damascus, now strong bulwarks of Islam, were once vibrant cities in the Grecian sphere of influence, forcibly militarised by Rome's old wars with Persia and her new ones with the Arab Caliphates. Recovering the Syrian province and making our way into the Levant won't just be a restoration of our Roman border, but perhaps the beginning of something grander."
 nicene_heart_of_persia_title: "Heart of Persia"
 nicene_heart_of_persia_desc: "The smouldering remains of the Mongol Empire left Iran at the mercy of warlords and petty kings, giving us a prime opportunity to end the millennia of the Greek and Persian feud. We have once walked in arms along these ancient roads, and we can walk them again."
 nicene_triumph_over_the_crescent_title: "Triumph Over the Crescent"
 nicene_triumph_over_the_crescent_desc: "The empires of Islam are at our knees. Not Rome nor Persia, but a resurgent Greece has reversed the fortunes of the Rashidun Caliphs, broken their swords and voided their law. The distant peripheries may cling on for a little longer, but the beating heart pumping Mohammad's visions across Asia is now vanquished. Only we remain."
 nicene_macedonian_restoration_title: "Macedonian Restoration"
 nicene_macedonian_restoration_desc: "The fleeting image of empire that our forefathers once carved across three continents is now once again realised! Our swordarms were enough to undo millennia of humiliation at the hands of the Persians, Romans and Arabs, creating a state that can now proudly call itself Greek and Macedonian. All of our efforts, our struggles and our brilliance, all has been leading up to this moment. Though we must not rest on our laurels, our warriors may sleep soundly knowing that they have made Alexander proud."
 nicene_revive_bactria_title: "Revive Greco-Bactria"
 nicene_revive_bactria_desc: "The plateaus of Central Asia were once home to a civilisation of Hellenes, who cleverly used the highway of the Silk Road to make itself wealthy and sophisticated. The Greek and Bactrian Kingdom has long since disappeared into history; however, our grandiose actions have awakened more than one ancient light into the world already. If we use our resources accordingly, Bactrian horsemen may soon travel to Chang'an, make their expertise known again and return loaded with silver."
 nicene_vengeace_for_hydaspes_title: "Hero for the Hydaspes"
 nicene_vengeace_for_hydaspes_desc: "Punjab, the last frontier. The last of the Persian army retreated beyond the Khyber Pass, and Alexander gave chase into the vast Indus river valley. New kings have come and gone in these lands, which have since managed to repel even the mighty Mongols. The Macedonians crossed this river to do battle. We must cross it to wage war."
 nicene_dismantle_hre_title: "The Last of the Romans"
 nicene_dismantle_hre_desc: "While the fires of Constantine are long extinguished, the feeble light kindled by that fraud Charlemagne still shines meekly in the West, insisting on calling itself Roman. This pretension will be their downfall, and this light must be snuffed out once and for all. The past may have been Roman, but the future belongs to the Greeks!"
 nicene_surpass_alexander_title: "Surpass Alexander"
 nicene_surpass_alexander_desc: "Alexander wrote his last will in the stars because he knew his earthly legacy would be cancelled. He died young and powerless to prevent his vast empire's dismemberment, leaving the fruits of his labour to be swept away by history. The tragedy that has befallen the Greeks since his passing has been reversed with gusto, and now we find ourselves where he was when he decided to turn back. By claiming India for ourselves, fulfilling the last wish of the first emperor, we will forge our own legacy - one that will shine bright enough for him to see it from the stars."
 nicene_cultural_renaissance_title: "Cultural Renaissance"
 nicene_cultural_renaissance_desc: "The strength of Hellenism was its ability to channel innovations and traditions from thousands of cultures, turning the Greek language into a highway of learning and technology across the old world. Restoring the political unity that Alexander created gives us the opportunity to reopen this highway, and replicating the miracle will be yet another sign of our unchallenged cultural supremacy."
 nicene_revive_greek_philosophy_title: "Revive Greek Philosophy"
 nicene_revive_greek_philosophy_desc: "The state of Greek philosophy endured for centuries a lasting depression, during which scholarly works meant to last the ages were lost by careless errors and myopic zealotry. Now that the Greeks are  in control of their destiny again, we can shed the layers of corruption and return to the works of the old masters, using them as a basis for a new dawn of thinking."
 nicene_restore_the_hellenosphere_title: "Restore the Hellenosphere"
 nicene_restore_the_hellenosphere_desc: "There was a time when a Greek speaker could walk from Delphi to the Oxus River and walk back to Egypt while never leaving his homeland. That time is now. If they wish to keep up with us or keep from being destroyed, no state can ever exist that does not know the language of the masters. The dream of our greater Greek sphere will expand to the point where that sphere will coincide with the very Earth itself. (cursive:) And Alexander smiled, for there were yet more worlds to conquer."
 nicene_modern_statecraft_title: "Modern Statecraft"
 nicene_modern_statecraft_desc: "Since time immemorial, the Greek and Roman world has found unending pride in the modernity of its governance, and the upkeep of our administration demands progress. Shedding the decaying institutions of Constantinople, our resources must be spent to favour a new generation of bureaucrats."
 nicene_educate_the_nation_title: "Educate the Nation"
 nicene_educate_the_nation_desc: "The principal difference between a lowly peasant and a high-ranking officer, aside from blood, is their formation. Our society was founded on the novelty of public libraries, but the needs of our administration require full universities as well."
 nicene_connect_the_realm_title: "Connect the Realm"
 nicene_connect_the_realm_desc: "Ours is a geographically diverse realm: the fertile shores of Bithynia quickly give way to Anatolia's mountains and plateaus. If we wish to restore the economic primacy of our core regions, we must first make them whole again, so that our great cities don't find themselves alone in their time of need."
 nicene_greek_metropolises_title: "Greek Metropolises"
 nicene_greek_metropolises_desc: "The emperors of Constantinople were forced by happenstance to trade the vibrant poleis of their classical past for isolated fortress towns. Now that our enemies have been dispelled and our homelands are secured, it has become clear that Greek cities are long overdue for a new golden age."
 nicene_revitalize_the_economy_title: "Revitalize the Economy"
 nicene_revitalize_the_economy_desc: "The old empire had succumbed to the German folly of feudalism, a system incapable of producing more than it needs to stay afloat. If we wish to catch up to the West's progress again, we must learn what they have been doing different. We have the necessary surplus to diversify our production, allowing us to meet the standards of a modern industrialised economy."
 nicene_engines_of_the_empire_title: "Engines of the Empire"
 nicene_engines_of_the_empire_desc: "The point of trade is production, and the point of production is trade. The Greeks have long been masters of both, but our traditional systems of production have been driven to near extinction by foreign trade, and foreign production margins have been similarly deadly to our merchants. The spoils of war will pay for our own manufactories, on the scale of our western rivals, and the means of our old economic domination could be set back into motion overnight."
 nicene_fires_of_nationalism_title: "Fires of Nationalism"
 nicene_fires_of_nationalism_desc: "For centuries now, Rome has been nothing but a pallid dream, claiming the progress and accomplishments of Greeks in the name of some atavic conquest. The good people of Nicaea, having ridden themselves of Constantinople's shackles, wish for something more befitting of their standing. We would do good to stoke these popular ambitions, and ride them farther than we ever could the Byzantine mirage."
 nicene_autocrator_of_the_hellenes_title: "Autokrator of the Hellenes"
 nicene_autocrator_of_the_hellenes_desc: "Gone are the days where the mirage of Rome conditioned the foreign policy of our emperors. The Greek world is reunited under our banners, and the legacy of Alexander the Great shines bright upon our accomplishment. If we should re-enter the Tiberine city, it would no longer be as timid pretenders, but accompanied by the vengeful spirit of the Hellenes!"
 nicene_economic_behemoth_title: "Economic Behemoth"
 nicene_economic_behemoth_desc: "Centuries ago, under the wise kings of Pergamon, the land of the Ionians was once the epicentre of Eurasian commerce. Despite the many attempts by the Romans to subdue our spirit, now the fire of our beacons has been reignited; the highways of the Aegean and the Mediterranean belong to our merchants, who are capable of spreading the fruits of our industries far and wide."
 nicene_architects_title: "Architects of the Civilization"
 nicene_architects_desc: "Hegias, Phydias, Lysippos, Eumenes Soter. The Greek world has always been accompanied by larger than life builders, who made the abstract greatness of our culture material through wonders of their creation. We are now beholden to an opposite task; the impressive empire that we have built must reproduce an equally impressive identity, able to recreate and surpass the heights of our ancient masters."
