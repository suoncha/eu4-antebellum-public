### DENMARK ###
# Countries #
 DNK: "Denmark"
 DNK_ADJ: "Danish"

# Cultures #
 anglodanish: "Anglo-Danish"

# Reforms #
 viking_kingdom: "Viking Kingdom"
 viking_kingdom_desc: "The concept of the 'Viking' - the overseas trader, traveler, and raider - has existed since at least the 700s, and the Danish people themselves are even older. The concept of a 'Viking kingdom', in contrast, is much younger; even so, we have managed to integrate this idea both into Danish society and into Danish government."
 danthralls: "Abolish the Thrall Caste"
 danthralls_desc: "The thralls are a caste of slaves that once existed throughout the Norse kingdoms. While our Swedish brethren - those traitorous swines - may have abolished thralldom upon their conversion to Christianity, both Norway and our own kingdom have not done so yet, given how useful thralls are for rowing our ships. Of course, once thralldom is outlawed, we'll actually have to pay our sailors - for better and for worse."
 dankarls: "Empower the Ceorls"
 dankarls_desc: "In order to ensure a balance of power against the nobles and the warriors, we must entrust more rights and privileges to the ceorls - free citizens within Danish and Viking society. By using these well-educated and hard-working freemen, we shall manage to maintain the political status quo against the nobility of our kingdom."
 danlongships: "Modernize the Longships"
 danlongships_desc: "The longships - otherwise known as the best ships in the entire world - have been, admittedly, relatively outdated for more than three hundred years now. Given that longships compose the bulk of our navy and waterborne transportation, the fact that these ships are obsolete to such a degree is, to say the least, an issue. We must modernize the longship, and we must do so promptly."
 danberserkir: "Reform the Berserkir"
 danberserkir_desc: "The berserkirs are Norse warriors who are known for their ferocity and combat prowess. Unfortunately, these warriors are sometimes so blinded by their own rage that they are unable to tell friend from foe, and are more of a threat to their allies than to their enemies. These issues, combined with their lack of discipline, have had a serious impact on our army. While we cannot completely abolish the berserkir status quo altogether, we must still find ways to enforce greater discipline among them."
 danvikingtrade: "Restore the Old Trade Routes"
 danvikingtrade_desc: "The memories of once-extensive Viking trade routes - renowned for having been some of the most extensive across the entire continent - still linger in the minds of our people. Unfortunately, our traders have been locked out of these routes for quite some time now; clearly, this situation needs to change, and our old trade routes must be restored. Expeditions will be sent out to do so, and our traders will once more reach Constantinople, Baghdad, Kyjev, the Isles, and all of Europe!"#Italy
 dancadre: "Military Cadre"
 dancadre_desc: "With conquests and raiding being the heart of the Kingdom, our government and King must reflect this in his ruling. The military cadre of Denmark were advisors to the King to advise him on such military matters and to be some of the best Danish military leaders in the Kingdom."
 danelective: "The Danish Elective"
 danelective_desc: "The Danish elective dates back to the ideals of the Scandinavian electives, all alike. Nobles voted for the heir to their kingdom, fiefdom, or lesser titles. Empowering this institution could lead to better rulers, and placate our largest factions: the free citizens, the military, and the nobility."
 danempower: "Empower the Danish Elective"
 danempower_desc: "The Danish Elective has little control in the eyes of the people, but with the expansion of its power and the King's control the institution looks more legitimate in the eyes of the people. This legitimacy aids in his rule over large swathes of land and people that are within his liability and responsibility, but most importantly it makes the king more legitimate in the eyes of the nobles and people which hold immense power."
 danrigsdagen: "Found the Rigsdagen"
 danrigsdagen_desc: "The Rigsdagen is a foundation of a political basis for the Kingdom's debates and laws to be made. The Rigsdagen is overlooked by the King and has an elective representative elected by the Ceorls. The formation of such an institution is to solidify the separation of power between the King, the people, and the nobility."

# Events #
 ab_denmark.1.t: "Scanian Catholic Uprising"
 ab_denmark.1.d: "Over the past few decades, the Danes of Scania have been converting to Catholicism under the influence of neighbouring Sweden. Now that their numbers have grown significantly, they have taken up arms and have risen in an uprising against our state and our faith. We must act quickly."
 ab_denmark.1.a: "This rebellion will be crushed!"
 ab_denmark.2.t: "Rediscovery of Vinland"
 ab_denmark.2.d: "Ancient Danish sagas speak of faraway land beyond the waves of the Atlantic ocean. Brave Vikings have discovered this mystic land centuries ago and named it Vinland. Since then, no man has set foot on this land, but the news from our explorers have reached us with the message that they have discovered an uncharted land in the far Atlantic. Could it be Vinland?"
 ab_denmark.2.a: "It has to be Vinland!"
 ab_denmark.3.t: "Unity by Faith"
 ab_denmark.3.d: "Under the influence of Sweden, and possibly even the financial aid of the Papal States, many Danes of Scania converted to Catholicism. Since that time, we have vigorously pursued our effort to root out this false religion from our land, and today, we have finally succeeded. The region of Scania has been restored to Norse faith!"
 ab_denmark.3.a: "We are unified once again"
 ab_denmark.4.t: "Anti-Swedish Alliance"
 ab_denmark.4.d: "Our diplomats have achieved great success. We have entered an alliance with our Norwegian brothers so that we can better protect our citizens from the Crusader tendencies of the Swedes."
 ab_denmark.4.a: "This alliance will serve us well"
 ab_denmark.5.t: "Strenghtening the Baltic Fleet"
 ab_denmark.5.d: "The strength of our fleet is vital for the protection of our trade interests and oversea provinces held by our crown. With the growing number of our galleys, some have suggested that the state should provide further financial aid in order to strengthen our navy and provide a better training for our sailors."
 ab_denmark.5.a: "Great idea!"
 ab_denmark.5.b: "We can not afford that..."
 ab_denmark.6.t: "The Question of Faith"
 ab_denmark.6.d: "For centuries, we have been living near the borders of the Christian world, resisting their influences as best as we could. Despire our efforts, Christianity has found its way to Denmark, and has been embraced by a large portion of our population. Our kingdom is under constant pressure from both the Holy Roman Empire and the Swedish crusaders, and perhaps, the time has come to finally give in and accept Christianity as our new official faith and align ourselves with the west. Our nation stands at a crossroads: to forsake our ancient ways and form a proper empire, or shall we honor our ancestors’ traditions to obtain even more glory?"
 ab_denmark.6.a: "We shall drop the axe and pick up the quill"
 ab_denmark.6.b: "We shall not halt the way of our ancestors"
 ab_denmark.7.t: "Westernization of Denmark"
 ab_denmark.7.d: "After a century of existence within the borders of the Holy Roman Empire, our nation has drifted far away from the Old Norse traditions of our ancestors. Some people already see themselves as a part of the Western world, while others would prefer Denmark to maintain its unique culture. The decision must be made."
 ab_denmark.7.a: "We must strive for further integration"
 ab_denmark.7.b: "We shall preserve our traditions"
 AB_DENMARK_CATHOLIC_MISSIONS: "§GUnlocks§! §YCatholic§! branching missions."
 AB_DENMARK_NORSE_MISSIONS: "§GUnlocks§! §YNorse§! branching missions."
 ab_denmark.15.t: "The Burning of Arkona"
 ab_denmark.15.d: "The siege of the city was long, starvation and disease were rampant amongst both the defenders and our army. Our men were antsy with anticipation, the long months were finally about to pay off as with a final crack, the walls of the city fell. Soon our men pour out into the streets of the city, as the wails of mercy ring out across the impromptu battlefield. The entire Arkona, including the Holy Temple of Svatovid is now in our hands. What shall we do with this heathen place of worship?"
 ab_denmark.15.a: "Burn it to ash!"
 ab_denmark.15.b: "Show them mercy"
 ab_denmark.16.t: "Fall of England"
 ab_denmark.16.d: "The long back and forth between the rightful land of the Danelaw and the ever troublesome English crown has been drawn out for a century. No longer would that be the case. With the English army routed and shattered, no one can contest over the rule of the isles. The cinders of what remains of Winchester are still hot, all memory of the English crown will soon be lost to annals of history."  
 ab_denmark.16.a: "A new force shall reign over the isles!"
 DAN_REMAIN_EAST: "Our technology group will stay §YEastern§!"

