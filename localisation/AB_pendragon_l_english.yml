# Ideas #
 NSE_ideas: "Nordic Ideas"
 NSE_ideas_start: "Nordic Traditions"
 NSE_ideas_bonus: "Nordic Ambition"
 NSE2_ideas: "Nordic Ideas"
 NSE2_ideas_start: "Nordic Traditions"
 NSE2_ideas_bonus: "Nordic Ambition"
 nse_first: "Viking Longships"
 nse_first_desc: "The Longship is the pride of our navy. An ancient tradition of the North Germanic peoples, the longship has brought us an age of unprecedented naval dominance, and allowed us to spread our influence far and wide."
 nse_second: "Odin's Fury"
 nse_second_desc: "The world has changed, with Christianity and Islam becoming the dominant religions of Europe, however we must have faith in Odin, for only through Odin may we be granted victory. Let us bring forth Odin's fury upon the unbelievers and show them the power of the allfather!"
 nse_third: "Claim Vinland"
 nse_third_desc: "Vinland was once a Nordic colony, however as time went by and due to our unsophisticated technology back then we were forced out of it. Now the time has come for us to retake Vinland, to retake what is rightfully ours."
 nse_fourth: "The Jomsviking Code"
 nse_fourth_desc: "The Jomsviking were bands of Nordic mercenaries who fought for foreign or domestic employers. We should set up a code of conduct for these mercenaries in order to promote honour and valiance amongst the Jomsviking."
 nse_fifth: "Valhalla Awaits"
 nse_fifth_desc: "We are not afraid of death for we know that if we die an honourable death in battle, Valhalla, the place where honourable warriors are rewarded, awaits us; and for that cause, we shall fight relentlessly for our nation, for Odin!"
 nse_fifth2: "Valhalla Awaits"
 nse_fifth2_desc: "We are not afraid of death for we know that if we die an honourable death in battle, Valhalla, the place where honourable warriors are rewarded, awaits us; and for that cause, we shall fight relentlessly for our nation, for Odin!"
 nse_sixth: "Norse Mythology"
 nse_sixth_desc: "Norse Mythology is a valuable part of our culture and of our national identity. Stories told in the sagas inspire thousands across our realm and it is also tied to our Norse religion. We must preserve and expand upon it."
 nse_seventh: "Berserkir"
 nse_seventh_desc: "The berserkers are elite military units that fight in a trance-like rage that instils fear into our enemies. They shall spearhead our armies and bring destruction to our enemies."

