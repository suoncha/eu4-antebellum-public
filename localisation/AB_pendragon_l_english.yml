 west_germanic: "West Germanic"

# Ideas #
 eng_first: "Wooden Wall"
 eng_first_desc: "With the destruction and bloodshed caused by the nordic Vikings still fresh in the consciousness of our people, it has become painfully obvious that to protect ourselves from foreign invaders we must first prevent them from dominating us on our waters. Our ships will act as a wall that guards our coasts and sink any foolish army that wishes to plunder our lands."
 eng_second: "Witenagemot"
 eng_second_desc: "While our ruler's word is the law, their word is sometimes not just their own. For centuries kings of Ængland have been advised by the Witenagemot that is composed of important noblemen in our realm. This important institution has greatly benefited us by making sure that our ruler is properly aware of the current state of their Kingdom and more importantly how to suitably act in most courts in Europe."
 eng_third: "Royal Navy"
 eng_third_desc: "As our history has shown, a large navy can be equally as strong as a large army. Ever since we started to expel the Vikings from our lands our navy has grown significantly to prevent another invasion. Now the time has come for us to use our navy beyond the British Isles and like our old enemies use our navy to subjugate weaker kingdoms. Our Royal navy shall sink any fleet that dares to challenge our naval superiority."
 eng_fourth: "Burhs"
 eng_fourth_desc: "The Burhs are old fortifications that were constructed to defend against the Viking invasions centuries ago. Even though most of the Vikings have been expelled from the British isles, the Burhs are still being maintained and renovated to keep up with modern siege tactics. These fortifications will make sure that if an army ever sets foot on our island, they will be swiftly pushed back into the sea."
 eng_fifth: "Fyrd"
 eng_fifth_desc: "A fyrd is an army that is mobilised from freemen to defend their land against an invading enemy. Like most of our other defences, this system was designed as a reaction to the first Viking invasions. During our many wars with the Vikings our generals made a very useful observation regarding the success of the Fyrds, men fight harder if they are fighting for their own home."
 eng_sixth: "Unite the British Isles"
 eng_sixth_desc: "Except for the Kingdom of Scotland, there is no strong power in the British Isles able to withstand invasions from overseas invaders. This is likely the reason the Vikings were able to subjugate much of the Isles on so many occasions. The final step in securing our homeland from foreign invasions is by eliminating those weak kingdoms that could be exploited by a stronger power. The British Isles are only fit to be ruled by one kingdom, namely ours."

 gbr_second: "Rex Britanniae et Hiberniae"
 gbr_second_desc: "The ruler of Albion is the ruler of the united kingdoms of England, Scotland, Wales, Cornwall, and Ireland. Though these different peoples have fought against each other since civilization first reached these islands, we have now put our differences aside and united under our great ruler who is blessed by the heavens. Whoever holds the title of Rex Britanniae et Hiberniae is the most powerful man in the world, a modern Emperor able to bring the world under British domination."
 gbr_seventh: "Naval Superpower"
 gbr_seventh_desc: "Now that Britannia is united under one kingdom we need to go beyond the isles to expand our power and influence. This is the reason our navy is one of, if not The greatest in the world, striking fear into enemies and awe among our subjects. Joining the navy is seen as the most prestigious position for a person to achieve in our kingdom and patriotic songs frequently include the greatness of the navy. One phrase that has become popular with our subject is Praeesset fluctus Britanniae, or Britannia rule the waves."
 GBR2_ideas: "British Ideas"
 GBR2_ideas_start: "British Traditions"
 GBR2_ideas_bonus: "British Ambition"
