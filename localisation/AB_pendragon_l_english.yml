# Reforms #
 norcolonize: "Heritage of Exploration"
 norpatronage: "Patronage of the Elders"
 norsanction: "Sanctioning of Churches"
 northralls: "Improve the Condition of Thralls"
 norvarangian: "Veterans of the Varangian Guard"
 norjvikings: "Restore the Jomsviking Order"
 noralthing: "Adopt the Althing"
 norcolonize_desc: "The Norwegian people have made a name for ourselves as explorers, navigators, and seafarers. The quest for new lands is our national imperative. When we set sail, it is on the backs of the great Viking explorers that came before us."
 norpatronage_desc: "Respect for the eldest and wisest in our society is paramount to the Norwegian people. Let us ensure that we have the guidance of our progenitors in mind when it comes to the governance of our kingdom."
 norsanction_desc: "The Christian kingdom of Sweden threatens our very way of life with its proximity. The Norwegian people must not be made to forget the Aesir!"
 northralls_desc: "Thralls, the lowest class in our society, have long been exploited and abused by the nobility. Despite their diminutive status, we must establish legal protections for them to assure their loyalty."
 norvarangian_desc: "The Varangians, elite Viking mercenaries tasked with protecting the Emperor of the Romans, often return to Norway after their tenure in his stead. These invaluable veterans can be re-employed in service of the king of their own nation."
 norjvikings_desc: "The Saga of the Jomsvikings tells the story of a band of nigh-invincible norse mercenaries who lent their services to great kings both foreign and domestic. True students of history understand this Saga to be more than a story, but instead a record of historical fact! The restoration of the Jomsviking order will provide a prestigious upper echelon for our soldiers to strive towards, and those members of it will be the finest warriors in the land."
 mechanic_unlocks_jomsvikings_yes: "§GUnlocks§! the §YJomsvikings§! mercenary company"
 noralthing_desc: "The Althing was a kind of parliament established by Icelandic residents many years ago. This representative body was an outlet for the common people to voice their concerns and ideas regarding the nation's governance. Perhaps by adopting a similar governmental body, we could smooth our transition from a highly stratified society into a much more egalitarian structure."

# Decisions #
 form_north_sea_empire_title: "Form the North Sea Empire"
 form_north_sea_empire_desc: "Our mighty ships control the waters of the northern seas and our fierce berserkers wreak havoc upon the heathens of Europe. Let them tremble before the power of the North Sea Empire!"

# Events #
 ab_norway.1.t: "Avenging Stamford Bridge"
 ab_norway.1.d: "Though many long years have passed since that fateful day in 1066, Norway remembers the crushing defeat at Stamford Bridge all the same. Ballads were sung, and tales told, of Harald Hardrada's heroic end, and of the sole Norseman who blocked the English advance before falling to an act of dishonour. The Norwegians have mourned this loss for an age, clinging tightly to the desire to exact retribution upon those perfidious Angles and Saxons. Such a lust for revenge has at long last been sated, much to the rapturous victory cries of the bloodied Norwegian army, many of whom were descended from the survivors of the first Battle of Stamford Bridge. Now that the Norsemen stand victorious upon a battlefield littered with dead Englishmen, their general sacrificed to honour the gods for granting victory, the skalds back home are sure to eternalise the moment in folklore, and it shall linger in the Sagas forevermore as a triumph which paved the way to further glory. Hardrada is now avenged, but much work is still to be done, for this victory must be capitalised upon."
 ab_norway.1.a: "The axe shall be swung against the throat of England"
 ab_norway.2.t: "Siege of Paris"
 ab_norway.2.d: "The city of Paris has long been a prime target for Viking raids, but the Pearl of Francia had stood strong against even the Norman progenitor Rollo! Alas for those perfidious Franks, the Norwegians - many of whom were sellswords in the Carolingian wars - have tested their mettle once again. For the first time since Ragnar Lodbrok carved a bloody path up the Seine in the 9th Century, Norsemen stand triumphant atop the city walls. Unlike then, however, no amount of ransom can spare the city from the wrath of the Old Gods. For too long have the Norwegians been regarded as petty mercenaries and bandits by the West, but with the destruction of their precious heartland, this so-called civilised world shall prostrate themselves before the might of the North!"
 ab_norway.2.a: "Take that, Karlings!"
 ab_norway.3.t: "The Birth of the North Sea Empire"
 ab_norway.3.d: "Under the Danish tyrant Cnut the Great, Norway suffered terribly, but nevertheless, they share something in common: the dream of uniting the lands of Scandinavia and Britain. Now, the world that all Norsemen have envisioned will finally become a reality, and soon, northern Europe shall know peace. We shall never fall to the same mistakes which destroyed the first North Sea Empire, but rather, we men of the north will overcome them, and ascend as one!"
 ab_norway.3.a: "Four Kingdoms, One Crown!"
 ab_norway.4.t: "Conquest of Miklagard"
 ab_norway.4.d: "As he stood before the Hagia Sophia, the King took in his surroundings, savouring the serenity around him whilst chaos tore through the streets below. From the vantage point outside this hallowed temple, he could see his men tearing running amok in the palatial district, dragging off captives, setting buildings ablaze, and running off with piles of loot in their arms. The sounds of skirmishing across the last few contested positions blended vividly with the smell of smoke blanketing the lower quarters, having been engulfed in flames mere hours prior. The City of the World's Desire has been reduced to a smouldering husk, the legendary Miklagard is now tamed by those Varangians who had once been in its employ. Pivoting back towards the Hagia Sophia's gilded doors, the King triumphantly made his way inside, his retinue dispersing to tear down the mosaics and other decorations, all the while wondering: why would the Greeks worship a God who has abandoned them, in their most desperate hour? Not that it mattered, really. The Old Gods now reign in these halls."
 ab_norway.4.a: "Torch what you can't carry to the ships!"
 ab_norway.6.t: "Restoration of Jomsborg"
 ab_norway.6.d: "Jomsborg - the legendary viking stronghold from whence the Jomsvikings came from - has fallen into disrepair. It has even stopped existing on the surface apart from a few key runestones! The home of the fearsome Jomsviking was fading into obscurity... \n\n ... But that has changed. Our workers are not yet ready, but the city is slowly coming back to life. Walls of mighty wood along with well-crafted longhouses and huts have been made. The runestones of yore are now located in the new citycenter, and the city will be rebuilt."
 ab_norway.6.a: "From the neverending woods to the bottomless lakes, Jomsborg will have no rivals!"
 ab_norway.6.b: "We have to concentrate our resources elsewhere"
 ab_norway.7.t: "Walrus Ivory"
 ab_norway.7.d: "Greenland is a thoroughly undeveloped area, and no one can claim otherwise. But it has something that all the rest of Scandinavia lacks - a trading good that is considered a luxury all across the known world. Walrus ivory is the greatest export Greenland has, but it has fallen into disrepair. With the return of the vikings it is our duty to ensure that Greenland's vikings will not feel neglected ever again. We need to reward them for wanting to exist in such inhospitable lands, and motivate them to harvest more tusks from the walruses."
 ab_norway.7.a: "The ivory must flow"
 ab_norway.8.t: "The High King of Ireland"
 ab_norway.8.d: "In the past, the great Vikings of old invaded the emerald isle. Dubgall, Rognvald, Ivar, and many other sailed to this land, conquering territory and establishing the great cities of Dublin and Cork. However, our victories were cut short by the Gaelic High Kings, who drove us out under the name of their God and with their armies of clansmen. While we always wished to one day return, to reclaim what was ours, we had far greater matters to attend to across the seas, and let Ireland slip further and further away. However, during their peasant uprisings of the late 14th Century against the English, those who were descendants of the Norsemen yet worshipped the Christian God came to us. They begged for help, insisting upon the bonds of our forefathers that we must send aid; we obliged, sending weapons and supplies to these revolts, and watched as Dublin, Waterford, and Cork successfully threw off their Marcher lords. \n \n This reminded us, invigorated us, and emboldened our Chieftains to look back on the island as a home for the Norse people. We prepared our invasion, even as the doddering old fool of a High King in Connacht tried to stand against us and unite the isle. Now the High King of Ireland lays defeated at our feet; he begs for mercy from the great heathen army, but he shall receive none. With his death, our great [Root.Monarch.GetTitle] claims the title of High King for [Root.Monarch.GetHerselfHimself]. [Root.Monarch.GetSheHeCap] organized for the mass migration of Norsemen to the island; if we are to maintain our control over Ireland, we must fill it with those who are willing and ready to serve us. We must grant Ireland her rightful rulers: the Norsemen."
 ab_norway.8.a: "All hail the High King, [Root.Monarch.GetName]!"
 ab_norway.9.t: "Jomsborg, the Jewel of the Baltic Sea"
 ab_norway.9.d: "Jomsborg has reached a brand new glory. Though it took many lives, the city has finally turned into a worthy successor to what it was before its desolation! Grand walls capable of fending off the modern Christian and Baltic hordes have been made erect around the city. It has been turned into the southernmost and most magnificent center of trade in all of the Baltic Sea. The runestones of yore are now located in a center filled with marketplaces, and foreign goods and wealth flow into the city."
 ab_norway.9.a: "In the Baltic, Jomsborg is mightiest"
 ab_norway.10.t: "Raid on Alexandria"
 ab_norway.10.d: "My Lord, what tidings I have for ye! For naught a fortnight ago did we make our daring expedition upon the Jewel of the Mediterranean, that vainly named city whose conqueror you shall no doubt eclipse in your time. We seized upon the city at night, whence the Sultan sleeps and his guards are only so much more alert. Upon the coast of the port we seized the lighthouses and guard towers, to slow response to our raiders. We extinguished the warning flames and then wreaked havoc upon the city, utterly dark save our fearsome torches. From Alexandria we seized the greatest treasures of the Orient: fine Jewels, Dates, Silk, Rugs, Spices, Coffee, even some of the lovely ladies of the Sultan's Harem! Our greatest seizure, if I might be so bold to say, is purportedly the body of Alexander the Great, or at least that's what the natives who I killed claimed when I took it from them. Though for now a burnt crisp it really was a lovely town, perhaps you should come back and give it your name, sir?"
 ab_norway.10.a: "Beautiful Alexandria, your treasures are mine!"
 ab_norway.11.t: "Raid on Venice"
 ab_norway.11.d: "The Norns shape the destiny of all men, weaving the threads of fate. If there was ever a city the Norns fated to be pillaged it would be Venice: a city built on water and navigated by ships gave little resistance to our longboats. Those guards which garrisoned in the city were not allowed to concentrate in opposition, for as soon as they would pop their heads cannon and rifle fire mowed them down or otherwise scattered. Such great ease we had pilfering the city that we captured the Venetian Senate and began subjecting its senators to all sorts of humiliations. We took from them the loot which they had themselves stolen in their participation in the Crusades, making any objection to our repossession utterly hypocritical. Some individuals, in mockery of Venetian traditions, cut off the faces of some captured patricians and wore them as masks whilst drinking their wine. Venice being a center of mediterranean trade has quarters for peoples as diverse as the Turks, Greeks, Persians and Moors, and so when we captured it so did we gain hostages from all over the world. We shall take our time bartering ransom of these prisoners, whilst lounging on Italian coaches and drinking their espresso."
 ab_norway.11.a: "Mamma Mia!"
 ab_norway.12.t: "Raid on Palermo"
 ab_norway.12.d: "In their arrogance, the Mohammedans thought that we Nords would never set sail for ports. Like the haughty Romans before them, who never suspected our longboats would breach the great walls of Miklagard, the Sicilians thought their one god ‘Allah’ would protect them and their hoards of treasure. Like the Romans before them, they were mistaken. As our warriors ran up the shores and laid waste to their pathetic garrison, their weak Allah seemed content to watch as we pillaged their mosques, razed their farms, and had our way with their wives. Where our Norman brothers failed after embracing the cross we, who stayed true to the old ways, to the strong gods of our ancestors, succeeded. While their so-called king stayed pent up in his citadel, powerless to do anything to stop us. So our king [Root.Monarch.GetName] says to them, pray to that Allah that you worship, because only a god can stop us from coming back!"
 ab_norway.12.a: "Muslim or Christian, their blood spills the same!"
 ab_norway.13.t: "Raid on Rome"
 ab_norway.13.d: "Take that you blighter! You, King of Christians, who in your arrogance snubbed us in trade and commerce. Who in our defense of our way of life labeled us heathens and barbarians. Who launched great unholy wars in which you who call yourselves shepards sent your sheep to kill us and take our land and religion. When you were strong you sent cross and sword into our lands to burn and destroy all in your sight. Yet now, as the tides are turning to our favor, when the gods grant us victory after victory, you attempt to appeal to our mercy? What mercy did you ever offer us? I shall not alter the course of my fleet and give no quarter: after this letter my next correspondence will be an ax to your skull. That is my mercy to you because many others shall suffer much worse. My predecessors the Goths and Vandals sacked that shadow of a once great city and so shall I. I shall take your gold extracted from your flock so greedily, I shall kill your priests who spread only lies, I shall anule your nuns' marriage to your God and I shall burn down all but the old temples of the Romans who worshiped altered icons of the true gods. There shall be naught left in your hallowed halls and your God will let me do it, for he knows that you are in fact the greatest sinner of them all. I'm coming for your hat Pope!"
 ab_norway.13.a: "Signed, [Root.Monarch.GetTitle] [Root.Monarch.GetName]"
 ab_norway.14.t: "Raid on Malacca"
 ab_norway.14.d: "As our captain looked over the great port of Malacca, he motioned to us to be careful. He knelt down beside us on our longships, pointing to the city as he began to inform us of the plan. Malacca was wealthy, this was true, but it was not without risk. It was at the heart of the east Asian trade, the port by which spices, tea, and silk sailed to Europe. While there was bounty to be made, it also had robust and effective defensive measures. Not only were there canons along the city walls, but there were also hundreds of trade ships patrolling the seas, waiting to catch pirates that might sail by. He smirked and continued to tell us of the plan he had in mind. But all I could do was stare at the city in trepidation; this could be our riskiest raid yet. \n \n The city was glowing in a bright orange haze, as fire leapt from one building to another. The captain had hired some Orang Laut pirates to sail ships filled with explosives and gunpowder into the city under the cover of night and get the explosives next to the tightly crowded shantytowns. When ignited, the fire would spread throughout the city, and while their defenses were too busy putting out the flames, we would sail in and take all their relics. I rushed through the city and began to ransack houses, markets, anything that I could find. If a soldier got in-between me and a target, I would cut him down, simple as. However, I stopped when I saw a mosque, recognizing it from a raid we pulled on Alexandria. I rushed in, looking for valuables, but as I did, I stopped to think about how Islam, a faith practiced in Egypt, even got all the way over in this corner of the world. After harassing a local preacher, I retreated from the city with my loot, content. \n \n The next morning, while we performed ritual offerings to the Gods, I talked with our captain. I told him about what I learned: the faith came to this land on the backs of trade ships. If we could establish communities in the region, perhaps even our traditions of worship and praise could spread to these far-flung communities? The captain liked what I had to say and ordered me to speak with the rest of the Jarls when we returned to the homeland; we would establish Norse communities across the world!"
 ab_norway.14.a: "It is time to spread the Norsemen across the globe!"
 ab_norway.15.t: "Raid on Canton"
 ab_norway.15.d: "Our presence in south eastern asia has not been unnoticed by the indigenous oriental powers: in comparison to christians and muslims we stand in stark contrast, perhaps most similar in fact to Hindus though still quite distinct. Our reputation for piracy and plunder precedes us, so perhaps it should not be surprising that we would be approached by these Kingdoms for trade and diplomacy to save themselves from desolation. Yet a proposition from the Emperor of China was far from expected, especially in his bizarre request. It seems the ruler of the city of Canton has been a stubbornly sovereign citizen who has ceased to pay proper tribute to the Son of Heaven. This inconvenience has led to his Majesty approaching us: he has commanded that we extract that tribute from this brigand and in return we would be allowed to keep a part of the spoil and be relieved of our own obligation to give tribute to the rightful ruler of the world. Ignoring the pathological condescension of the Chinese, this deal was quite sweet, for the Middle Kingdom provided several resources invaluable to the successful raid, namely skilled engineers who had familiarity with the architecture of southern cities. With these warrior bureaucrats we successfully exploited a structural fault of the Canton walls to slip through the provincial defenses. As swift as a coursing river, we swept through with the force of a great typhoon. Truly did we rarely come about a trove as rich as that of this chinese town: of the great wonders we had taken in the years of our ascension here was it multiplied thousands fold. Even having to share it with the Forbidden city there was more than enough to share amongst the men and return to the capital with bounteous reward. Paradoxically it seems this violent incursion has improved our relationship with the Imperial Court and we may one day reap ripe fruits from the seeds sown today."
 ab_norway.15.a: "I hope you brought me a fortune cookie"
 ab_norway.16.t: "Raid on Settsu"
 ab_norway.16.d: "Screaming of Bandits. \n \n Clashing of Waves and of Wind. \n \n A Blood-Stained City. \n \nAs our brave raiders landed on the foreign isles, we had our sights set on the province of Settsu, specifically the city of Sakai. It had grown fat off the Chinese-Japanese trade, and we were here to reap the benefits by sacking not only the city, but the temples and shrines nearby as well. While we plundered and ransacked the region, we came across a strange group of soldiers. These warriors, who called themselves samurai, had recently codified a doctrine called Bushido. This doctrine of wisdom, discipline, and honor had spoken to some of our raiders; not in its calls for peace and tranquility, but in the calls for self-sacrifice, honor, and duty. Captains who took part in the raid, the same ones that found scrolls and texts about this code in Settsu, took this message to heart, implementing it within their ranks. Eventually this pseudo-bushido code spread like wildfire throughout our military, with each soldier making their own interpretation of the texts as they heard of it. It is said a few even began practicing their own form of Zen Buddhism, but this was heavily debated as many would be seen practicing meditation of martial arts, yet still give offerings to Odin and Thor."
 ab_norway.16.a: "If it makes them better warriors..."

