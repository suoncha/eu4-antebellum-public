# Ideas #
 ANG_ideas: "English Ideas"
 ANG_ideas_start: "English Traditions"
 ANG_ideas_bonus: "English Ambition"
 ang_first: "Mandatory Longbow Drills"
 ang_first_desc: "The Longbow is a powerful weapon which was used to great effect by the Welsh in their past wars against England. Of course, we would be foolish to allow such potential to be squandered in the hands of our enemy. Therefore, every able-bodied man and boy shall be expected to practise their marksmanship daily, for in God's good time all of England shall march to war for the king."
 ang_second: "Castellation of England"
 ang_second_desc: "The Anglo-Saxon Heptarchs lacked the necessary forts to protect England from invasion. This problem presented itself once more for them during the Third Anglo-Norman War, with our armies facing few obstacles. In order to assert the new regime, it would be best to begin mass-construction of castles across the realm's major lifelines, lest we too succumb to foreign invaders."
 ang_third: "Anglo-Norman Nobility"
 ang_third_desc: "England is a foreign land to us who hail from Norman stock, but so too do we appear as barbarians to the Ealdormen and Heptarchs of the old regime. For us to tear down this barrier and truly unite the realms, and though it pains us greatly, we must make a concerted effort to integrate the English nobility into our own feudal structure - even if some compromises prove necessary."
 ang_fourth: "The Wooden Wall"
 ang_fourth_desc: "For many centuries the Ænglish Channel has been restlessly guarded by the Wooden Wall; the enormous fleet of warships in service of England's sovereign. Such a seafaring tradition must be upheld for the defence of the realm and to forge common ground, thus we proudly proclaim: Heart of oak are our ships, heart of oak are our men! We'll fight and we'll conquer again and again!"
 ang_fifth: "Dominate the Channel"
 ang_fifth_desc: "The greatest natural defence England possesses, the Channel, is also its most vital economic artery. Were our enemies to pry this stretch of water from us, we would surely be doomed! As such, it is imperative that we use whatever means prove necessary to ensure our continued dominance of the Ænglish Channel's trade lanes."
 ang_sixth: "The Invisible Hand"
 ang_sixth_desc: "The invisible hands of the state bear great power in the realm. Our industrious labourers may find themselves granted a subsidy in order to aid domestic production, whilst the corrupt banker finds their wealth has vanished overnight. The Crown giveth just as readily as the Crown taketh; this is the way it has been since our rule was established, and this is how it shall always be."
 ang_seventh: "Royal Redcoats"
 ang_seventh_desc: "His Majesty's Armed Forces have made great strides in becoming a truly professional New Model Army since the Saxon days as a levied Hyrd. One such reform has been the introduction of a scarlet uniform, so that our troops may tell themselves apart from the enemy, and to let the knavish foe know when to run. When our boys are marching over the hills and far away, the Redcoats shall fight, win, and die wearing only their best!"
 ANG2_ideas: "English Ideas"
 ANG2_ideas_start: "English Traditions"
 ANG2_ideas_bonus: "English Ambitions"

 DLM_ideas: "Anglo-French Ideas"
 DLM_ideas_start: "Anglo-French Traditions"
 DLM_ideas_bonus: "Anglo-French Ambition"
 dlm_first: "Union of Two Crowns"
 dlm_first_desc: "None could ever have foreseen that the Englisc and French would overcome their countless differences, and forge a nation-building bond. The Acts of Union have forevermore bound the destinies of the people, crown, and country as one. God save the Cyng-Empereur!"
 dlm_second: "Elan!"
 dlm_second_desc: "Some say that the combined might of Englisc footmen and French cavalry is a force of nature; even these rumours fall short of the truth. The élan of the Royal and Imperial Army is such that we can maintain the initiative on any battlefield, with simply a warcry and a heroic charge."
 dlm_third: "Control the Channel"
 dlm_third_desc: "The Ænglish Channel is the terminus of all trade headed to Western Europe, and even if foreign merchants protest, we must treat these waters as if they are within our sovereign borders. From Dover to Calais and beyond, we hold the monopoly."
 dlm_fourth: "By Saint George!"
 dlm_fourth_desc: "The traditional patron-saints of England were the Anglo-Saxon kings Edward the Martyr and Edward the Confessor. With the cultural osmosis brought about by the Union, though, both kingdoms have taken a liking to Saint George, the Dragon-Slayer. How fitting that it is he who tamed the Englisc wyvern."
 dlm_fifth: "Dieu et mon Droit!"
 dlm_fifth_desc: "Each of our Sovereigns reign supreme over this great Empire by the Grace of God, and their rightful claim to the throne. Thus, we proudly proclaim for all to hear: Dieu et mon droit!"
 dlm_sixth: "Imperium Sine Fine"
 dlm_sixth_desc: "This blessed realm has far surpassed any and all competition, standing alone as the one and only Empire without end. Truly, the sun shall never set upon this green and pleasant land."
 dlm_seventh: "Royal and Imperial Navy"
 dlm_seventh_desc: "Without complete dominance of our rugged coastline, our enemies - weak they may be - would surely attempt to cut the Empire in half. To combat any potential threat, the Crown has established a Royal and Imperial Navy, ensuring total dominion over the seas."
 DLM2_ideas: "Anglo-French Ideas"
 DLM2_ideas_start: "Anglo-French Traditions"
 DLM2_ideas_bonus: "Anglo-French Ambition"

# Government Names #
 RENAME_ANGEVIN: "Angevin Empire"
 RENAME_ANGEVIN_ADJ: "Angevin"
 DUQUE: "Duque"
 DUQUESA: "Duquesa"

# Reforms #
 ducal_ring: "Ducal Ring of Normandy"
 ducal_ring_desc: "The Ducal Ring of Normandy was created after Rollo's raid on the Kingdom of West Francia during Charles the Fat's reign. This ring for a time was a symbol of the Duke's absolute power and feudal ideology over his nobles, but the duke was not the only sign of authority in his own realm. The Church was the second most powerful within the realm and the ducal ring allowed for the Normans to call upon some of the best knights from these ecclesiastical vassals."
 english_feudal: "English Feudal Monarchy"
 english_feudal_desc: "English Feudalism is a term to consist for the Norman adherence to feudalism brought into the new Norman Kingdom of England. This form of feudalism persists much like the way the Frankish do it, but like in Normandy the power of the nobility is heavily checked by both the power of the crown's estates and the church's estates."
 ang_robertian: "Robertian Reforms"
 ang_robertian_desc: "Robert IV and Robert the V had important impacts to the structure of the Norman military which followed suit into the English military. These reforms became known as the Robertian Structure. This military structure in battle helped the infantry form deadly formations. The Robertian Military Structure was widely regarded as one of the largest and most complex structures of military command in Western Europe and was far superior than the Frankish structure when the Robertian structure was at it's height. Though the structure may fall out of order it still stands as one of the best within Europe. Having generals from afar serving  service while also having a unique infantry, artillery, and officer corp."
 ang_placate: "Retain Anglisc Common Law"
 ang_placate_desc: "Upon our landing in England and our conquest, we have found that most of the nobility and subjects remain Anglo-Saxons. This cultural divide between the Norman nobility and the Anglo-Saxon nobles has led to multiple conflicts within our realm. These conflicts caused threw the King into a dire position. With his realm to his back he has decreed his support with the Anglo-Saxons to lead a more unified Kingdom under a Norman led realm."
 ang_relocate: "Normanisation of the Ealdormen"
 ang_relocate_desc: "With the swift conquest of England our realm lies in tatters between the Old Anglo-Saxons and the new Normans. These two cultures have had rough relations in the past years, with the Anglo-Saxon nobility threatening our position in the Kingdom a decree has been called for the stability of the realm. The Anglo-Saxon nobility must be reduced and this calls for relocating and placating of the Norman Nobility."
 ang_chancery: "Courts of Chancery and Exchequer"
 ang_chancery_desc: "Our government continues to grow and expand beyond what we thought was possible. From our humble duchy of Normandy to the Kingdom of England our realm has found itself in adminsitrative defecits. With the centralization/decentralization of our state we have found that our state has grown too large to be governed effectively by only fiefs and the Royalty. With the Establishment of the Chancery, the King's personal advisors, and documentors the realm shall be able to be governed more efficiently in a greater state allowing the realm to be more prosperous and innovative."
 ang_rule: "Rule Britannia"
 ang_rule_desc: "Our realm is isolated via the English channel, it is fact; However the channel has allowed us to seperate and distance ourselves from Europe with little quarrels. The Channel and Seas on our coast being the first line of defense has required our navy to be top of the line unlike our predecessors. The Anglo-Saxons may have built a 'wooden wall', but it was not the epitome of what it could have been. With the knowledge of history and the finests woods from beyond the seas, and from our backyard, our ships and our navy shall be equipped with the best ships possible along with the best trained sailors we shall train."
 ang_academy: "Royal Military Academy"
 ang_academy_desc: "The Robertian Military Structure served our nation well in the past and with the future rapidly approaching with new technologies and abilities furthering the complexities of warfare this system was rapidly outdated. The General staff of our nation being educated in the largest military acadamey in England, the London School of Warfare/The London Academy of War have produced some of the finest generals in Western European history. The academy also known for updated the outdated Robertian structure also leads in Naval Officers and Naval structures to date, yet the war academy remains one of the most fit in Europe for future generals."
 ang_mixing: "Anglo-Norman Unity"
 ang_mixing_desc: "With the mixing of both the Norman and Anglo-Saxon cultures our advisors the nobility, administrative cadre, and the King's Household have been improved for the administration, economic, and military benefits of the realm. Diplomacy also enhanced for the better projection of our culture as a dominant force worldwide."
 ang_representation: "English Representation"
 ang_representation_desc: "With the idea of populist representation in parliament and the passing of laws through a parlimentary body, the realm has prospered. While of course Military and Diplomatic affairs remain that of the King/Queen skills, the English monarchy have aided in keeping their Kingdom together. The people now allowed to represent their rights has caused most of the noble backlash to be silences as the civilians revel in freedoms and the lower class soon dominating over the noble class in diplomatic sway. Whether for better or worse the effects has been dealt and the parliament has allowed for diplomatic stability. The Representation of our people unifies our realm under one government with multiple forms of representation."
 ang_consolidation: "Consolidation of Power"
 ang_consolidation_desc: "England stands united under the reforms our regime has implemented be it they are unified under fear, love, admiration, or whatever motive they entail our realm is still united. This unity has allowed us to consolidate our power rather quickly making the King the central head of authority within the realm. While this has caused backlash, it allows for less infigting between politics and more importantly it implements the idea: 'one king one state.'"
 ang_charter: "The Royal Charter"
 ang_charter_desc: "With the the Realm united, the realm stands under the king and its people. The road was difficult and the realm once split under two ideologies still stands. The King at the helm with his advisors at hand has lead the nation to glory. The Kingdom of England wether centralized or decentralized through code of law doesn't matter, what matters is that the Monarchy remains adaptable and with many paths to steer forward from. The English law flexible yet strong have been enforced through peace, blood, and honor with the King at the helm and the Judges leading the trials. The law unshakable and the realm so too unshakable the English realm is left guided for the future flexible as always,but No matter the path of which England goes certain ideals remain. The most important ideals that remain with England and her people firmly is, 'Brittania Rules the Waves. Pride guides the English.'"

# Decisions #
 form_england_title: "Form England"
 form_england_desc: "The Norman conquest was a success. Our armies have crushed the English and captured their capital. The time has come to crown ourselves as the new Kings of England. The era of Norman Britain has begun."
 rename_angevin_empire_title: "Proclaim the Angevin Empire"
 rename_angevin_empire_desc: "This is a cosmetic decision allowing you to change the name of your country."
 assemble_house_lords2_title: "Assemble the House of Lords"
 assemble_house_lords2_desc: "The Domesday Book was nothing short of a saving grace for this regime, with administrative functions becoming more efficient by the year. That being said, our aristocracy on both sides of the Channel are more marginalised than is befitting their rank under the current system. Let us assemble a House of Lords, thus allowing them to participate more formally in matters of state as representatives of their subjects."
 assemble_house_lords_title: "Assemble the House of Lords"
 assemble_house_lords_desc: "The Magna Carta and its consequences have been a disaster for the Anglo-Norman people. If we're to move forward, and overcome our enemies, we must repeal this blight upon the King's Peace. The nobles may be irate at first, but on occasion we must remove the velvet glove and bring down the iron fist. At the very least, the barons will still hold an important place within His Majesty's government as life peers in the House of Lords."

# Events #
 ab_norman_england.2.t: "Avenging Hastings"
 ab_norman_england.2.d: "In 1066, the illegitimate Anglo-Saxon king and his peasant horde came down upon our proudest fighters in a dishonourable and unjust slaughter on the fateful hills of Hastings. Their cowardly rabble scored a bizarre and undeserved victory against a mixture of infantry, cavalry and archers, hailing from lands in Brittany, Flanders and Normandy alike. Countless brave young men died that day, for nothing - their blood staining an ill-gotten, unworthy marsh, their trusted blades laying discarded amidst the untamed vegetation, lost to time.\n\n That fruitless venture echoes on in Norman minds. Throughout our long and arduous campaign, we have fought valiantly to ensure strategic superiority, wielding the lands of the Anglo-Saxons themselves against them. Our efforts have paid off - with several hard-earned victories and treaties, we have secured a foothold on the southern coast and thus revived our claim to the throne, announcing ourselves as a serious threat to the illegitimate rule presiding over the island."
 ab_norman_england.2.a: "Victory at any cost!"
 ab_norman_england.3.t: "Fall of Paris"
 ab_norman_england.3.d: "For centuries the Carolingians have bullied our humble realm - eyeing it hungrily, wishing to incorporate it directly into their realm or, worse, the Holy Roman Empire. No more, we say - with the Loire Valley under our wing, the provinces of Greater Paris and the likes of the city itself have fallen before our banners, pushed into our welcoming embrace following the merciful treaties bestowed upon the grovelling Franks. A great death blow has been dealt to the French realm - the echoes of which have been heard all across Europe, announcing our ascendant superiority and claim to all of France proper."
 ab_norman_england.3.a: "Off with the serpent's head!"
 ab_norman_england.4.t: "The Dual Monarchy"
 ab_norman_england.4.d: "We have achieved what great kings before us have only dared dream of. Not since the time of the Romans have both Gaul and Britannia in their entirety bowed before a singular banner, pledging all of their life, blood and gold to a sole king's services. This achievement does not come without difficulty, however. Our bountiful realm contains within a myriad of tongues, most prominently the 'colourful' myriad of France and the uncouth masses of England (not to mention the Celtic enclaves in both - which oftentimes prove to be even more unruly). To slight and dishonour the nobles of either realm is a folly - to honour and consider them as equals is a far more preferable notion, to ensure both administrative straightforwardness and internal diplomacy. \n\n With this in mind, we proclaim today the Dual Monarchy - an administration spanning two realms, two tongues and two broad cultures, with the intent to integrate both into the fold of our nation. By introducing a standardised form of French as the lingua franca, as well as buttering up and honouring French and Anglo Saxon nobility alike, we shall combine both wealthy possessions into one, seamlessly melding their matters together, robbing them blind of the hope of cultural autonomy and enriching our coffers, wallets, pockets and garrisons forevermore!"
 ab_norman_england.4.a: "Imperium Sine Fine!"
 ab_norman_england.5.d: "The Universities of Oxford and Cambridge are among the most prestigious in all the Known World, and by far the most elite within our own realm. Each decade a Great Symposium is held, in which the greatest minds of academia unite to discuss and disseminate research and speculation. Much of the knowledge imparted at these gatherings can of course prove greatly beneficial to the realm, and so we pray they never end."
 ab_norman_england.5.a: "Absolutely smashing!"
 ab_norman_england.6.t: "Native Opposition"
 ab_norman_england.6.d: "It would appear that those Saxon mongrels have refused to acknowledge the Duke of Normandy as their rightful sovereign yet. Maladjusted to a civilised way of life under the feudal system, and bitter about being forced to toil away under merciful lords who refuse to speak their vulgar tongue, many Anglisc have taken up arms against Norman rule. Across several shires and counties, dissidents favouring their Heptarchs to our Barons now wage a bloody campaign in a desperate bid to pry off the Norman Yoke. This cannot be allowed to stand. They cannot win. God would not allow it!"
 ab_norman_england.6.a: "Stamp out the traitors!"
 ab_norman_england.7.t: "The Western Rebellion"
 ab_norman_england.7.d: "Across the West Midlands, traitorous princes of the House of Hwicce, Heptarch pretenders to the old English throne, have sown the seeds of rebellion. Evidently displeased with out crackdown on Saxon excesses, and the loss of much of their land to the Crown, those loyal to one of England's oldest great houses now attempt to strike while the iron is hot. We mustn't fail in putting them back in their place."
 ab_norman_england.7.a: "Unacceptable!"
 ab_norman_england.8.t: "The Northern Rebellion"
 ab_norman_england.8.d: "The North has a long memory, and bears grudges for even longer. Always the most distant and unruly of our new conquests, the House of Bamburgh fomented anti-Norman sentiments even while the other Heptarchs fell to their knees and begged for peace and mercy. Forever dreaming of kingship, but only ever snatching defeat from the jaws of victory, they seem to believe their fortunes can change today. We cannot guarantee victory against them, but we will certainly send those base curs to Hell - even if it costs us the kingdom!"
 ab_norman_england.8.a: "Face only the Bamburghs!"
 ab_norman_england.8.b: "Kill everything from Derby to Durham!"
 ab_norman_england.9.t: "The Coronation Day Massacre"
 ab_norman_england.9.d: "What should've been a joyous and most splendid day for all subjects of the realm has been forever blackened in the annals of history. The unpopularity of our takeover amongst the Anglo-Saxons has been made abundantly clear, and our regime is still shaky due to the shifting balance of power, but still... Even still... For the King's guard to mistake the cheers of the Anglisc crowds during the coronation for a riot..! And then, to begin massacring the crowd outside Westminster Cathedral as if it were a sport! The jubilant streets and now pierced by the confused and bloodcurdling cries of anguish and bewilderment, and soon all of England will know what foul deeds our noble knights have wrought upon their own subjects. The only question now is how to handle the inevitable fallout. At this rate, a real riot seems inevitable, and an insurrection even more likely than first anticipated."
 ab_norman_england.9.a: "Clearly the Saxons started it"
 ab_norman_england.9.b: " I can't see them, they can't see me"
 ab_norman_england.9.c: "Offer an apology and compensation"
 ab_norman_england.10.t: "Magna Carta"
 ab_norman_england.10.d: "The Baron's War has not necessarily developed to our advantage. That being said, the traitors who dared to raise their swords against the king have at least enough wisdom to negotiate. They know the king is the key to ruling England, and without him they cannot exist. Therefore, provided he keeps his head and dignity intact, a great many executive powers and privileges are to be signed over to the nobles. Of course, the king, as God's representative on Earth, may choose to overrule the barons at any point. But he wouldn't want to destabilise the realm, would he..?"
 ab_norman_england.10.a: "We will rise again"
 ab_norman_england.11.t: "The Domesday Book"
 ab_norman_england.11.d: "With the insurrections finally brought under control, in large part due to the diligent efforts of our Lord Marshal, England now has ample time to heal. In order to properly survey the land, so that it may be brought under our complete control, and also to receive fairer taxation, England's first royal survey shall be conducted immediately. The results of the gathered data shall afterwards be compiled into the Domesday Book, an extensive document which may serve as a foundational charter for the new English state."
 ab_norman_england.11.a: "Doomsday for the taxpayer"
 ab_norman_england.12.t: "Eastern Rebellion"
 ab_norman_england.12.d: "In East Anglia, those inhuman mange-ridden lepers of House Godwin now claim our rule to be illegitimate! Arming themselves and throwing out Norman sheriffs across their territory, these traitors seek to install one of their own onto the English throne, for the first time since the reign of that serpent Harold II! We shall cut down every last Godwin who stood against us on this day, and clap the rest in irons; it's the least they deserve for the murder of our Duke William in AD 1066!"
 ab_norman_england.12.a: "Spare only the dogs and cattle!"
 ab_norman_england.13.t: "Unrest in Wessex"
 ab_norman_england.13.d: "Loyalists of the old king and his dynasty, the House of Wessex, have taken it upon themselves to throw our men back into the sea, comparing our sovereign unfavourably to the Great Heathen Army of our Viking forebears. What of it? We're simply finishing what Ivar couldn't, and putting Alfred's bloodline to the sword in the process. The remaining Heptarchs will know their place soon enough."
 ab_norman_england.13.a: "Unleash Norman fury unto the battlefield!"
 ab_norman_england.14.t: "The Disafforestation Act" 
 ab_norman_england.14.d: "While royal forests were a ubiquitous sight in Normandy, the Anglo-Saxon commoners that we have conquered have turned out to be less than pleased at the idea of hunting rights across large swathes of their land being reserved exclusively for the Norman nobility that now rule over them. Indeed, illegal hunting by peasants has become a constant problem in the royal forests, and there are more poachers in the forests than can be handled by all of our rangers and foresters.\n\nWhile the royal forests are a long and beloved tradition of the Norman aristocracy, it seems increasingly apparent that the practice might be incompatible with the kingdom and the people that we have conquered. Some of [Root.Monarch.GetName]’s advisors have suggested an act to abolish the royal forests altogether, allowing the Anglo-Saxon commoners free rein to hunt in the wilds as they please - within reason, of course. This will no doubt be a boon to our kingdom’s economy as hunters are granted a new, abundant source of meats and hides. But it will also result in the aristocracy losing significant amounts of land, with their private forests becoming public property, ultimately owned by the crown.\n\nThe nobility will no doubt be unhappy if the Disafforestation Act is passed, and it will require administrative effort in order to do so, but the final decision is up to [Root.Monarch.GetName] as to whether the cost is worth the possible benefit."
 ab_norman_england.14.a: "We cannot afford to upset the aristocracy. Keep the royal forests." #keep them 
 ab_norman_england.14.b: "The nobility has more important things to do. Abolish the royal forests." #abolish them
 ab_norman_england.15.t: "The Ambition of Duke [Root.Monarch.GetName]"
 ab_norman_england.15.d: "Four centuries ago, our forefathers crossed the Channel to press their claim on the English throne, but the untimely death of Duke William at the Battle of Hastings forced us back to Normandy. Ever since, the Dukes of Normandy have been dreaming of vengeance, but the political situation never allowed us to cross the Channel again and retake what is rightfully ours. However, with the Franks embroiled in a civil war, and the English crumbling under the incompetence of Witenagemot, Duke [Root.Monarch.GetName] has been considering rebuilding the fleet and exploiting this unique chance to dethrone the usurpers and claim the English throne for our dynasty."
 ab_norman_england.15.a: "We shall avenge Hastings!"
 ab_norman_england.15.b: "This is completely out of question"

