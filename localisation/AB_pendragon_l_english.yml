### CORNWALL ###
# Countries #
 DMA: "Dumnonia"
 DMA_ADJ: "Dumnonian"
 CLT: "Celtica"
 CLT_ADJ: "Celtic"

# Cultures #
 norse_gael: "Norse-Gaelic"
 briton: "Brittonic"

# Ideas #
 DMA_ideas: "Dumnonian Ideas"
 DMA_ideas_start: "Dumnonian Traditions"
 DMA_ideas_bonus: "Dumnonian Ambition"
 DMA2_ideas: "Dumnonian Ideas"
 DMA2_ideas_start: "Dumnonian Traditions"
 DMA2_ideas_bonus: "Dumnonian Ambition"
 DMA_first: "The Archbishop of Kernow"
 DMA_first_desc: "The lands of Cornwall and Devon were Christianized centuries prior, during the so called low-roman period. Ever since then, the area has had a strong Christian tradition, and a distinct one from the Anglo-Saxon practice. More orthodox, more akin to the insular tradition of Ireland, even during our period of subjugation under the Anglo-Saxon we still retained our own sense of self and practice. Now, with the flourishing state of Dumnonia raking in the wealth of both the Isles and the New World, we can subsidize the creation of new churches and monasteries across the Kingdom, giving the Archbishop and the Church the respect that they deserve."
 DMA_second: "Riders at Mount Babon"
 DMA_second_desc: "It is said that during King Arthur’s defense against the mighty Anglo-Saxon invasions, he made a stand at Mount Babon, pushing back all those who attempted to press into his homeland. That Arthurian romanticism that birthed the Kingdom carries through here: We shall drive the Anglo-Saxon away, taking back our lands and rule as the sole dominating force over the isles!"
 DMA_third: "University of Exeter"
 DMA_third_desc: "In the heart of the modern metropolis of Exeter lies a great university, bustling with students and scholars alike. As technology advances with every passing year, the Kingdom of Dumnonia must remain at the forefront if it wishes to retain its status as a global power. Through extensive research grants and subsidies from the crown, the University of Devon is a wonderous place for scientific achievement and philosophical dialogues."
 DMA_fourth: "A Modern Senedh"
 DMA_fourth_desc: "Having spent several centuries under the Anglo-Saxons, we have taken their concept of a parliament and modified it to our liking. Instead of a single parliament under a unitary government, we shall establish smaller, local parliaments in each of our vassals so that they might also share the political freedom that is granted to us through the Senedh."
 DMA2_fourth: "A Modern Senedh"
 DMA2_fourth_desc: "Having spent several centuries under the Anglo-Saxons, we have taken their concept of a parliament and modified it to our liking. Instead of a single parliament under a unitary government, we shall establish smaller, local parliaments in each of our vassals so that they might also share the political freedom that is granted to us through the Senedh."
 DMA_fifth: "Charters to the New World"
 DMA_fifth_desc: "The lands of America call to us; their fertile fields, their vast open plains, their gold-filled cities all combine with our innate sense to explore and discover. We must establish colonial settlements across the new continent; to do this, we shall establish a new colonial administration division, that will grant charters to all those willing to take the voyage into the great beyond…"
 DMA_sixth: "Layys a Dumnonia"
 DMA_sixth_desc: "As the reformation sweeps across our continent, many of our princes are converting to the new faiths that arise in its stead. While we have been fierce defenders of the Catholic faith for centuries, our lawmakers and advisors have proposed that it would be beneficial to create wiggle room in the law, granting protection for those of these heretical faiths within our state to avoid the chaos and pandemonium that is rocking Europe. As such, Dumnonia is a place free from political persecution, welcome to all scholars, craftsmen, and soldiers of protestant and catholic faith alike!"
 DMA_seventh: "Pax Brythonek"
 DMA_seventh_desc: "The Brythonic people had been nearly wiped out by the Anglo Saxon and Gaelic peoples. However, thanks to our timely rise to power, the age of the Britons has returned to the isles! Our new state shall take a page out of the old Roman laws, that through servitude in the military, anyone can be considered a Briton. This will not only bolster our ranks, but also allow us to inspire a sense of loyalty across our new dominion."

# Reforms #
 crn_society: "Militarized Society"
 crn_society_desc: "In an attempt to both distance themselves from their Anglo-Saxon oppressors and to create the fighting force that would be necessary to defend against them - not to mention to reclaim the British Isles from the Germanic tyrants eventually - the rulers of Cornwall have looked to the period of Roman rule of Britain for inspiration. Civil administration will be mixed with military command, and the magistrates of Cornish towns and villages will be expected to serve as militia commanders simultaneously. To ensure the defence and survival of the Cornish state, every community within the realm must be ready to muster arms and men at a moment’s notice, for none can know when the perfidious Angles will attack."
 crn_tinbaron: "Tin Barons"
 crn_tinbaron_desc: "Though deprived of the military leadership that most nobles across Europe enjoy, Cornish aristocrats have not found themselves entirely without influence and power. Many valuable tin deposits exist on land owned by Cornish nobles, granting them great wealth and prestige. Rather than being entrusted with control over the military, the aristocrats of Cornwall have increasingly relied upon for matters of industry, instead."
 crn_divide: "Divide et Impera"
 crn_divide_desc: "As Cornwall prepares to expand her borders, it once more looks to Rome as an example of how to handle newly conquered territories. For example, Cornwall would never be able to control the entirety of the island of Great Britain if it maintained the existing, massive polities of England and Scotland - they are simply too large for the much smaller Cornwall ever to hope to rein them in as-is. However, if Cornwall were to formally break England up into the Heptarchy or to break Scotland into local clans, these smaller entities would be much easier to govern. Such an example must be used no matter where Cornwall stakes its claim, lest the great territories she seeks to conquer overwhelm her ability to manage them."
 crn_foreign: "Foreign Bureaucrats"
 crn_foreign_desc: "There is too much land and not enough Cornishmen to administer all of it. The Brythonic people have been reduced in number over the centuries. The result is that the Cornish people are increasingly a minority among the population that Cornwall claims sovereignty over. No other choice is available. Cornwall must adapt its bureaucracy to allow its non-Cornish subjects to take civil and military positions, albeit under the watchful eye of their Cornish superiors. Maybe - if they learn the Cornish language and Cornish customs - they might even be allowed to be counted among proper Cornishmen?"
 crn_nothing: "Nothing Outside the Country"
 crn_nothing_desc: "There is no sovereign, nor are there commoners. There is no noble, nor are there peasants. There is no priest, nor are there merchants. There is only Cornwall and the citizens that serve her."
 crn_general: "The General Staff"
 crn_general_desc: "The Cornish sovereign exists for one reason, and for one reason only: to lead the Cornish military to victory and glory. Everything else is secondary. While God has divinely appointed the Cornish sovereign to fulfil that duty… Sometimes, the heavenly roll of the dice turns up a little bit short. The leading generals of the Cornish army will be granted the power to take control from the sovereign or overrule his decisions, depending upon the circumstances. No matter how much holy grace he has been blessed with, one man should be allowed to sink the Cornish ship of state all on his own."

# Decisions #
 dumnonia_decision_title: "Form the Kingdom of Dumnonia"
 dumnonia_decision_desc: "The domination of the English complete and the ancient territories of the Dumnonii now under our control. Fueled by Arthurian Romanticism, calls to create a new state around both the ideals of the past and hopes for the future are loud and ever-present. We shall, on this day, found the Kingdom of Dumnonia!"
 celtic_union_title: "Form the Celtic Union"
 celtic_union_desc: "For the last millennium, the remainder of Celts in Europe was on decline. We shall unite our brethren and form a union between all Celtic nations for the glory and better future of us all!"

# Events #
 ab_cornwall.1.t: "Timed Mission Unlocked"
 ab_cornwall.1.d: "You have just unlocked a timed mission - §GShatter England§!. You will only be able to complete this mission during your next war with England. If you fail, the mission will be §Rpermanently removed§! from your mission tree."
 ab_cornwall.1.a: "Understood"
 ab_cornwall.3.t: "Timed Mission Failed"
 ab_cornwall.3.d: "You have failed to complete the §GShatter England§! mission. The mission will be §Rpermanently removed§! from your mission tree."
 ab_cornwall.3.a: "Understood"
 ab_cornwall.4.t: "The Disintegration of England" 
 ab_cornwall.4.d: "The Kingdom of England, much like the Danes and Romans before them, have been an invasive parasite on our native soil. The land itself despises their arrogance and treachery. Like all invaders of the isles, their fortune turned sour and we have once again claimed the upper hand. No more would the petty English king be high ruler of this land, but instead the political instability of his kingdom shall boil over and shatter the crown." 
 ab_cornwall.4.a: "Let their chaos be our opportunity!" 
 ab_cornwall.5.t: "The Unification of the Isles" 
 ab_cornwall.5.d: "We have felled many, much larger foes than us. The English shattered, the Welsh subdued, the Danes and Norse banished, the Scots under our banner and the Irish High King brought to bend the knee. Our position has been secured upon the isles and no longer shall we be under the threat of foreign invasion. This is the beginning, the isles being a springboard for our ever growing ambitions." 
 ab_cornwall.5.a: "Our birthright has been fulfilled!"
 ab_cornwall.6.t: "The Birth of the Celtic Union" 
 ab_cornwall.6.d: "Long ago, our people, our ancient tribes, were broken and shattered, meant to live on scraps of land and subjugated by foreign peoples. No longer! Our people will be protected under our banner. No Celtic blood shall ever be spilled by a English sword or a French lance. We are no longer simply Cornish, Welsh, or Irish, we are all Celts!" 
 ab_cornwall.6.a: "Reunited at long last!"

