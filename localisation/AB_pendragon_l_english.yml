# Ideas #
 SCO_ideas1: "Alba Ideas"
 SCO_ideas1_start: "Alba Traditions"
 SCO_ideas1_bonus: "Alba Ambition"
 alba_first: "Union of Clans"
 alba_first_desc: "The clans of Alba were united under the rule of the Dunkeld clan for more than 200 years. During that time, equal representation was given to all the different families and peoples of the realm, with the Kings of Alba protecting and supporting even the weaker vassals within their kingdom. While this may seem to be a recipe for a powerful magnate to overthrow the Dunkelds, in truth it inspired loyalty and obedience among the different houses and clans within Alba."
 alba_second: "Highland Infantry"
 alba_second_desc: "The Gaelic peoples of northern Alba are strong and powerful. Their men fought and ruled over their territory for centuries before we subjugated them, and as such, we have integrated their impressive armies into our own forces. Now all who dare to resist our  might will face the wrath of the Highlands!"
 alba_third: "Rein in the Clans"
 alba_third_desc: "The clans of Alba have a history of being rowdy and disloyal. And as with any mutt, they must be reminded that they are to be disciplined and brought to heel. So, it is common tradition for a new King of Alba to be crowned in front of all the clans and noblemen of the country, who then bow and kneel to their new master."
 alba_fourth: "Logarithmic Tables"
 alba_fourth_desc: "In this new era, it is not just blood and steel that define the masters of the world. It is science, technology, and innovation. Being able to calculate and predict profits, population, and harvests can turn a country from a mere economic power to a global hegemon in production and capacity."
 alba_fifth: "The First Bank of Alba"
 alba_fifth_desc: "Alba is a land of entrepreneurs. We have crafted a system by which many can safely store and loan large sums of gold coins and paper money, allowing business ventures to be both secure and profitable. This has increased our own revenue tenfold, and we cannot wait to see what this new era of finance and business shall bring for Alba!"
 alba_sixth: "Alban Bombards"
 alba_sixth_desc: "The cannons of Alba roar loudly over the battlefield, slamming into fort and man alike, tearing through flesh and stone as if it were paper. We shall continue to innovate and adapt with siege and barrage technology, to ever improve our army’s capabilities."
 alba_seventh: "Alexander's Tower"
 alba_seventh_desc: "While the Dunkelds initially ruled from their traditional holdings of Dunfermline, they migrated to the city of Edinburgh in the early 15th Century, as the city was the new economic and population hub of Scotland. When he arrived, Alexander the IV constructed a brand new wing to the already magnificent Edinburgh Castle, from which he could observe his domain."
 alba_first1: "Union of Clans"
 alba_first1_desc: "The clans of Alba were united under the rule of the Dunkeld clan for more than 200 years. During that time, equal representation was given to all the different families and peoples of the realm, with the Kings of Alba protecting and supporting even the weaker vassals within their kingdom. While this may seem to be a recipe for a powerful magnate to overthrow the Dunkelds, in truth it inspired loyalty and obedience among the different houses and clans within Alba."
 SCO_ideas2: "Alba Ideas"
 SCO_ideas2_start: "Alba Traditions"
 SCO_ideas2_bonus: "Alba Ambition"

 HSC_ideas1: "Highlander Ideas"
 HSC_ideas1_start: "Highlander Traditions"
 HSC_ideas1_bonus: "Highlander Ambition"
 HSC_ideas2: "Highlander Ideas"
 HSC_ideas2_start: "Highlander Traditions"
 HSC_ideas2_bonus: "Highlander Ambition"
 hsc_highland_charge2: "Highland Charge"
 hsc_highland_charge2_desc: "Gunpowder weapons have revolutionised the battlefield, and the warriors of the Highlands must adapt. An aggressive new shock tactic has been developed by our generals. Our soldiers will run, preferably downhill, straight into the first enemy volley, firing as they go. After shooting, they will draw more traditional weapons and enter the melee. The speed required for this tactic necessitates that our warriors wear very little in the way of clothing however."

 ABO_ideas: "Albionian Ideas"
 ABO_ideas_start: "Albionian Traditions"
 ABO_ideas_bonus: "Albionian Ambition"
 ABO_first: "The Royal Highlander Infantry"
 ABO_first_desc: "The Highlanders, hailing from the ancient Gaelic tribes, are known for their ability to fight in the ragged and rough terrain of northern Alba. While the nation was once at odds with the Highlander identity, our Kings, now lords of both Lowlander and Highlander equally, honour these brave warriors, creating regiments and special tasks just for them to showcase their amazing battlefield abilities."
 ABO_second: "The Edinburgh Scientific Society"
 ABO_second_desc: "Edinburgh, being one of the major cities of Europe, attracts some of the smartest minds on the continent. With our increased focus and attention on matters of scientific endeavour, it is no wonder why they’ll risk a perilous journey across the North Sea just to land in the gleaming ports of Lothian. In the hallowed halls of the Edinburgh Scientific Society, these men and women of science further our understanding of the natural world, not just for Albion, but for all mankind."
 ABO_third: "Imperial Ambitions"
 ABO_third_desc: "Our empire was forged through the conquest and subjugation of the Anglo-Saxon. We have established ourselves as an empire that is not only powerful, but is hungry. We shall continue our expansion into the continent, to the new world, and even to the distant shores of Africa and Asia."
 ABO_fourth: "Industrial Pioneers"
 ABO_fourth_desc: "From textile mills to the steam engine, Albion has been called a nation of production by those on the mainland. Every shop can produce goods faster, more efficiently, and at greater quantities than even the most laborious of factories across the world."
 ABO_fifth: "The Scots Regiments"
 ABO_fifth_desc: "The Scots of the Lowlands are one of the most populous groups on the isle of Britain. As such, we fill our regiments to the brim with them, but not as cannon fodder - nay, these brave men fight voluntarily, for the glory of Albion!"
 ABO_sixth: "The Kirk of Albion"
 ABO_sixth_desc: "The Reformation has taken its toll on Europe, turning state against citizen, nation against nation, and brother against brother. Yet, through it all, Albion remains strong. The strength of our Church is a unifying force across the Empire, and all who live within our Kingdom stand united against division and subversion from foreign religious sentiments."
 ABO_seventh: "The Dockyards of Argyll"
 ABO_seventh_desc: "Once our greatest source of shame as the site where Alexander III lost the Battle of Largs, now is a national treasure. The ships that come from this site have their wood taken from the great forests of Ireland, have men sailing them from Birmingham to Orkney, and nautical instruments crafted in the workshops of Edinburgh. From Argyll, our nation sails to the New World and beyond - forever ruling the waves."

# Estates #
 unlock_privilege_estate_burghers_highland_rights_tt: "§GUnlocks§! the '§YHighland Merchant Assistance§!' [Root.GetBurghersName] Estate Privilege, giving the following effects:\n§G-15%§! Local Development Cost in all §YHighlands§! provinces.\n§G-20%§! Local Development Cost in all §YHills§! provinces."
 unlocked_privilege_estate_burghers_highland_rights: "Completed Mission §YImprove the Economy§!"
 estate_burghers_highland_rights_gt: "§G-15%§! Local Development Cost in all §YHighlands§! provinces\n§G-20%§! Local Development Cost in all §YHills§! provinces"
 estate_burghers_highland_rights: "Highland Merchant Assistance"
 estate_burghers_highland_rights_desc: "We must provide assistance for the marketplaces and developing industries within the Highlands of our great nation."
 estate_burghers_highland_rights_revoke: "§YHighland Merchant Rights§! will be removed from every owned province."

# Reforms #
 scottish_lawmaker_AB: "Scottish Landowners"
 scottish_lawmaker_AB_desc: "We must decide upon a land owning policy."
 scottish_lawmaker_1_AB: "Scottish Landowners"
 scottish_lawmaker_1_AB_desc: "With our successful integration of the Celtic peoples, we have decided upon a land owning and renting policy that not only benefits the rich and powerful within our Kingdom, but also those who we have recently conquered. They receive fair compensation for their land and support from the state in their integration process."
 scottish_lawmaker_2_AB: "Scottish Landowners"
 scottish_lawmaker_2_AB_desc: "We have  found that the best course of action when controlling new land is to immediately work on building up the manufactoring capabilities that it has, and increase the revenue that might come from the province. As such, our laws give priority to private companies and government owned enterprises when taking over new land."
 scottish_lawmaker_AB_TT: "The Mechanic for this reform will be §Tdynamic§! depending on how we complete the §YCeltic Submission§! Mission."
 scottish_lawmaker_AB_1_TT: "Gain §G-2§! §YYears of Seperatism§! in a province when a §YCourthouse§! or §YTown Hall§! is built in it."
 scottish_lawmaker_AB_2_TT: "Gain §G+1§! §YBase Production§! in a province when a §YWorkshop§! or §YCounting House§! is built in it." 
 scomonarchy: "Scots Monarchy"
 scomonarchy_desc: "The King of Scots, while a monarch, does not rule alone. The Parliament, made up of the three estates; the Nobility, the Clergy and the Burghers, advises the sovereign in matters of war, justice, and legislation. Likewise the King cannot levy taxes without the Parliament’s Approval, and its sister institution, the General Council, also plays a vital role in the running of the Kingdom, especially during times of royal incapacity."
 scolairds: "Suppress the Lairds"
 scolairds_desc: "For centuries, the rowdy Highlander nobility has been a continual thorn in the Kingdom’s side, maintaining far too much autonomy from the state. This unseemly situation has been allowed to go on for too long. To curb their influence, many influential clans have had their lands seized and titles given to Lowland nobles, far more loyal to central authority."
 scoschiltron: "Modernising the Schiltron"
 scoschiltron_desc: "There is nothing that quite puts fear in the hearts of an English soldier like the lockstep march of a Scottish Schiltron. But, as gunpowder changes the face of warfare in Europe and elsewhere, the Schiltron requires adaptation to gunpowder tactics. By melding the Schiltron with pike-and-shot tactics, we can ensure the safety of our arquebusiers on the field of battle and ensure the tradition of the Schiltron lives on for many years to come."
 scopower: "Ecclesiastical Power"
 scopower_desc: "The clergy of Scotland have long had an influential, albeit unofficial, role in our administration. Making this relationship official, and extending further secular power to our Bishops and Archbishops will please them immensely, whilst allowing the state greater oversight over our powerful religious institutions."
 scoconvention: "Convention of the Estates"
 scoconvention_desc: "The General Council, the sister institution to the Parliament, has long had overlapping powers with them, and contests between the two bodies over jurisdiction have often caused administrative deadlock. By reforming the General Council into the Convention of the Estates, we can ensure the primacy of Parliament, while allowing the Estates to convene as a separate advisory board."
 sconemo: "Nemo Me Impune Lacessit"
 sconemo_desc: "Over time, Parliament has grown ever more powerful at the expense of the Crown. The Monarch cannot become a figurehead and by balancing the power of the King and Parliament, we can ensure that representatives do not overstep their bounds and trample on the royal prerogative."
 scocourt: "High Court of Justiciary"
 scocourt_desc: "To oversee our enormous judicial system, we have implemented two supreme courts. The first deals with criminal matters, and the second with civil cases. Both have oversight on matters of great public and constitutional importance, acting as the final say on the interpretation of the law to ensure that the justice system is efficient and legitimate."
 albadual: "Alban Dual Monarchy"
 albadual_desc: "The King of Alba is, in truth, the King of two distinct nations; the Kingdom of the Gaels and the Kingdom of the Scots. To unite the two peacefully, we have taken measures to allow distinct autonomy regarding their respective legal systems and obligations to the Crown. Alba additionally has three capitals: Scone, where the King is crowned; Dunfermline, where the royal residence is; and Edinburgh, where Parliament convenes.\n\n§YSpecial Mechanic:§!\n§GUnlocks§! Tanistry Heir Selection."
 albalaw: "Scots and Gaelic Law"
 albalaw_desc: "In the conception of Alba under Edgar II, the Gaels and Scots were ruled under entirely separate legal systems. Unfortunately, this has proven relatively inefficient; instead, we have created a unified judicial code for all Alba while leaving allowances for regional differences."
 albahigh: "Highlander Regiments"
 albahigh_desc: "Despite its smaller population, the Highlands provide the bulk of Alba’s manpower. In addition, the Gaels have a unique martial culture that we will foster by having separate Highlands and Lowlands regiments."
 albaunified: "Unified Parliament"
 albaunified_desc: "In the system of our Dual Monarchy, the Highlanders have had the privilege of electing the Tanist, while the Lowlanders have had the privilege of making up the parliamentary body. This has increasingly caused friction between the two; instead, we have united the two in Parliament, establishing parliamentary seats in the Highlands and transferring the election of the Tanist to parliament, so that both Gaels and Scots might have a say on the matter."
 albaunion: "Union of the Crowns"
 albaunion_desc: "Previously the King of Alba’s official title has been King of Scots and Gaels, designating the two peoples as disparate nations. As time has marched on, however, the two peoples have, despite their differences, begun to see themselves as only one people; the Albans. This has now become official, as the King is now known only as the King of Alba."
 albtricameral: "Tricameral Parliament"
 albtricameral_desc: "Many nations’ legislatures are split into distinct chambers; most, however, are split in two. For a long time, this has been true of Alba, with the House of Commons as the lower chamber and the House of Lords as the upper chamber. To break down the separation between the nobles and commons, a third House has been established that consists of the members of both the Upper and Lower chambers."
 gaelmonarchy: "Gaelic Monarchy"
 gaelmonarchy_desc: "The Gaelic King is not simply an office passed from father to son as is practised in other European monarchies. All male members of the reigning clan are entitled to put themselves forward for nomination as the Tanist, the heir to the throne. This position is elected by large swathes of the nobility, ensuring the legitimacy of the monarch and allowing for some measure of meritocracy in the government.\n\n§YSpecial Mechanic:§! §GUnlocks§! Tanistry heir selection"
 gaelclan: "Strengthening the Clan System"
 gaelclan_desc: "The system of Clans is the bedrock that our government is built upon, and unfortunately, it is largely defined by vague precedent and interpersonal oaths rather than well-defined law. It is high time for this to change. We will set out a well-defined set of privileges and responsibilities for the different clans, and ensure that no more squabbling over border disputes is allowed to take place."
 gaelgallow: "Modernising the Gallowglass"
 gaelgallow_desc: "With the advent of gunpowder as a primary feature of warfare, we must ensure that the Gallowglass regiments that make up the bulk of our army are well-trained in the use of firearms. Many who have served as mercenaries on the continent have already been familiarised with gunpowder weaponry, and they will lead the charge in training in the use of firearms."
 gaelcruinneachadh: "Cruinneachadh"
 gaelcruinneachadh_desc: "For much of Gaelic history the Chiefs of various clans, both major and minor, have played an important role in advising the King and building consensus on matters of government. Cruinneachadh, the gathering of the Chiefs, will be legally formalised as an advisory body to the King."
 gaelaon: "Aon Eaglais, Aon Righ, Aon Rioghachd"
 gaelaon_desc: "One Church, One King, One Kingdom. The King rules not only by the assent of the Clans, through the Tanistry, but by the grace of God. Once the King has been chosen by the Clans, it is not then the privilege of the Clans to tell the King what he can and cannot do with the power they have vested in him, only to advise and obey."
 gaeautonomy: "Autonomy of the Clans"
 gaeautonomy_desc: "The power of the King in matters of national governance, foreign policy, and warfare is unquestioned. It remains true, however, that no man rules alone. By allowing the Chiefs autonomy in the management of their own lands and clans, we can alleviate the burden of local administration from the crown, and ensure that matters relevant on the local level are managed on the local level."

# Decisions #
 ab_pendragon_ireland_title: "Establish the March of Ireland"
 ab_pendragon_ireland_desc: "This decision allows us to establish Ireland as our march in the whole of Ireland."
 alba_rename_title: "Kingdom of Alba Rename"
 alba_rename_desc: "This decision will rename our country to Alba."

# Events #
 ab_scottish.1.t: "The Dunkeld Legacy"
 ab_scottish.1.d: "As Alexander V Dunkeld walks the halls of his father’s palace in Edinburgh, he moves towards his son Edgar’s chambers; there is much to discuss. The Kingdom of Alba resides in a period of change and growth. The Monastic Revolution of the 14th Century saw the adoption of feudalism and the centralization of the state, but a shift of power from the Highland clans to the Lowland Scots. Alexander’s rule was one of balance, where attempts to manage the concerns of the clans, who feared their relevance dwindled, to the demands of lowland lords, who’s Anglo-Saxon influence brought with them great power and a sense of arrogance. Revolts from the northern clans, raids from the Norse, and pretenders backed by the knights of England have pressed Alexander up against the wall, and rumors of fell tidings has him anxious and paranoid. While he attempted to balance all the factions in the empire, he had only let it grow more divided, refusing to put down rivals in the name of peace. He needed to make sure Edgar was firm in his beliefs, well connected with allies, and strong enough to take a stance on the future of this great kingdom. Alexander’s final lesson to Edgar would be for him to walk his own path. As such, Alexander asked his son who would be best to educate him and guide him on the way forward."
 ab_scottish.1a: "He asked that I give him a lesson personally on the legacy of Alba."
 ab_scottish.1b: "He asked that I hire a tutor from the house of Argyll."
 ab_scottish.1c: "He asked that I request a tutor from the university of Oxford."
 ab_scottish.2.t: "The Heir of Alba"
 ab_scottish.2.d: "As Alexander entered his son’s room, he spoke with him about these different powers, the different factions and forces driving apart the Kingdom of Alba. However, the great king said that the Kingdom of Alba shall be best run by uniting all the clans and peoples of their realm, not by excluding any. Edgar the II recited this speech to his personal guard, only a few moments after his father was found with a dagger plunged into his back. Those that wished to tear down his father’s dream have thrown down the gauntlet, and as a pretender rose in the countryside to take his place, the young king martialled his troops, rallied his soldiers, and prepared to ride out to meet them. \n \n”For Glory! For God!” For Alba! cried the Young Lion, racing into the battlefield atop his steed."
 ab_scottish.2a: "Hail Edgar, King of Alba!"
 ab_scottish.3.t: "The Heir of the Highlands"
 ab_scottish.3.d: "After listening to his father’s words, Edgar II requested a tutor from the Highlands, to learn more about the Gaelic world. The legends and tales of Clan Campbell that he heard from his most trusted advisor Afraig, Edgar made his decision. His realm has to be one that reflects the true heritage of his people, not foreign traditions and customs. He would be High King of all the Clans, not some petty prince to the growing power of the English or Francia. When news of his father’s death at the order of an Anglo noble from Dumfries, Edgar knew what he must do. Riding out with his brave soldiers, they would hunt down the traitors to the crown and once more raise the Gaelic people to their spot of prominence and power! \n \n”For Glory! For God! For Gaeldom!” Cried the Young Lion, racing into the battlefield atop his steed."
 ab_scottish.3a: "Hail Edgar, High King of Gaeldom!"
 ab_scottish.4.t: "The Heir of the Lowlands"
 ab_scottish.4.d: "His father’s words left Edgar II in a wreck. He was targeted on all sides by encroaching powers, and he had no clue how to fend them off. Luckily for him, his most trusted advisor, Cedric of Oxford, was a wise man. He told him of the great innovations and wonders that the English state has, that despite all the chaos that has befallen the English during the Anarchy, it still remains the most powerful kingdom of the Isles. Cedric taught the boy English, he taught the boy of the Witenagemont, and taught him the names of English lords and ladies that might be willing to support his claim. So, when his father died at the hands of a Gaelic assassin, Edgar rode off on his horse, calling upon his soldiers and preparing them for war as a Gaelic pretender rose in the north of Perth. \n \n”For Glory! For God! For Scotland!” Cried the Young Lion, racing into the battlefield atop his steed."
 ab_scottish.4a: "Hail Edgar, King of Scotland!"
 SCO_ALB: "When §YEdgar II§! succeeds to the throne, the §OHeir of Alba§! branching missions will be selected."
 SCO_GAE: "When §YEdgar II§! succeeds to the throne, the §OHeir of the Highlands§! branching missions will be selected."
 SCO_SCO: "When §YEdgar II§! succeeds to the throne, the §OHeir of the Lowlands§! branching missions will be selected."
 ab_scottish.5.t: "The Fate of the Isles"
 ab_scottish.5.d: "The Kingdom of the Isles lies just beyond the North Channel, a symbol of the decline of the Alban crown. Not 200 years ago, at the Battle of Largs, our ancestor Alexander the III lost to the overwhelming heathen army and was forced to sign a humiliating truce, acknowledging that the Hebrides and the Isle of Mann was rightful Norwegian territory. This humiliation remains with us to this day, as many within our bishops still demand we sail out to the Kingdom of the Isles, claiming it for Christendom once more to save our souls from the fires of damnation. Our nobles provide a more…pressing, concern. The Norsemen use the land as a staging ground for raids and excursions on our holdings. We must regain that these lands so that we will never be threatened again!"
 ab_scottish.5a: "Demand the isles from the heathens!"
 ab_scottish.5b: "Offer some sort of payment for the matter."
 ab_scottish.6.t: "The Hebrides Demand"
 ab_scottish.6.d: "We have received an offer from the Kingdom of the Scots, demanding that we turn over the territories of the Hebrides to them. While it would seem like a ludicrous demand, a joke at best, the diplomat who boldly recited his lord’s words were anything but. We must consider this offer carefully, with tact and grace. If we decline, this could mean war. If we accept, this could be a growing sign of our weakness."
 ab_scottish.6a: "They shall pry it from our cold, dead hands!"
 ab_scottish.6b: "We cannot risk a conflict. Give the isles away."
 ab_scottish.6c: "If they are offering payment, then we accept."
 ab_scottish.7.t: "The Norse Response"
 ab_scottish.7.d: "The Norse diplomat stood in the great hall of [Root.Monarch.GetName], in his hands a parchment with the words of the Great [NOR.Monarch.GetName]. All held their breath as the diplomat boldly yelled the reply of the Norsemen, one which could mean war and death or peace and victory."
 ab_scottish.7a: "They deny us our land? Then we shall drive them into the sea!"
 ab_scottish.7b: "They have seen the light of reason. The Isles are ours!"
 ab_scottish.7c: "Pay the price, and the Isles shall be ours!"
 PAYMENT_SCO: "We will pay a fee of 200 Ducats to the Norse for the Isles."
 invade_isles_SCO: "Crusading Scotts" 
 ab_scottish.8.t: "The Unification of Britain"
 ab_scottish.8.d: "The island of Britain has been unified under our banner."
 ab_scottish8.a: "The Dream of Albion has been accomplished!"
 ab_scottish8.b: "The Goidelic Union stands triumphant!"
 ab_scottish8.c: "The British Empire dominates all!"
 ab_scottish.11.t: "The [Root.GetAdjective] Reformation"
 ab_scottish.11.d: "In the 16th Century, the Church of [Root.GetName] was going through a crisis. As the reformation continued to sweep through Europe, [Root.GetName]’s fair shores became host to refugees from both religious and political persecution. Christians of all walks, Lutherans, Calvanists, Anabatists, and many more arrived on trade ships, hoping to escape the persecution that was found on the mainland. However, the [Root.GetAdjective] had already been struggling with their own identity towards the Church for the past few centuries. During the succession crisis of Edgar II, debates around the role of the Church were already starting to become common along with the debates on the Scottish identity, and now they were resurfacing as these refugees integrated into Scottish society. Figures such as John Knox argued for a complete restructuring of the Church into a modern institution, away from the decrepit and ageing medieval Catholic model. The Kirks of the era went back and forth in arguing for both independence from the Church and for loyalty to the Vatican. In the end, the decision fell back to politics; the choice on whether or not to change the state religion fell upon the lords of [Root.GetName], whose decision would echo through [Root.GetAdjective] history forever."
 ab_scottish.11a: "We shall remain loyal to the Papacy."
 ab_scottish.11b: "The Lutheran doctrine is the path for us!"
 ab_scottish.11c: "We shall establish a new Anglican Church!"
 ab_scottish.11d: "We shall establish a new Gaelic Church!"
 ab_scottish.11e: "Evangelize the Gaelic Church to the world!"
 ab_scottish.12.t: "Election of the Tanist"
 ab_scottish.12.d: "Debate has worn on deep into the gloaming hours, and much of it has been uncivil. Lairds both great and lesser have met once again in Scone Palace to setter the matter of choosing the Tanist, heir apparent to the throne and deputy to the King. The electors have a breadth of choices from among the Righdamhna, with all adult men of the Dunkeld clan eligible to put themselves forward for the position.\n\nAs the lesser candidates have slowly been weeded out of the election, three candidates of royal pedigree remain for the electors to choose from, all three men offering differing skills and talents that they might bring to the throne."
 ab_scottish.12.a: "The Lairds choose the Mormaer of Dumfries"
 ab_scottish.12.b: "The King’s younger brother wins the day"
 ab_scottish.12.c: "The King’s second cousin is chosen"

