# Reforms #
 saxon_england: "Witenagemot"
 saxon_england_desc: "The Ænglish Monarchy is a representative monarchy, with a parliament called regularly by the ruling monarch. It is based on the privileges defined in Witangemot Reformation."
 witenred: "Witenred"
 witenred_desc: "The Witenagemot was much too burdensome a beast to handle, with many centuries worth of turmoil that bears burden of proof. Thus, His Majesty put into effect what is arguably Ængland's first Constitution. A charter of basic liberties and rights of the nobility and commonfolk has been codified into Crown Law, as well as the establishment of the Witenred; the Wisemen's Council. Replacing the Witenagemot, this is a permanent legislative body which convenes around the Great Round Table at Wintanceastre on a regular basis. By determining matters of state under the guidance of the Cyning or his proxy and enforcing greater regulations to curb aristocratic autonomy, a degree of accountability is to be upheld."
 enghousecarls: "Housecarls"
 enghousecarls_desc: "The Housecarls have long served as bodyguards for Ængland's royalty, ever since the days of Svein Forkbeard and Cnut the Great, and thus hold a significant level of prominence among High Society. From the lowest street urchin to the most pampered son of an Earl, the chance to have His Majesty's ear, a plot of land, and a fixed salary is nothing to be scoffed at. Veterans of the Varangian Guard returning to Ængland are granted the closest seats to the Cyning due to their combat experience, with the tradition of gaining combat experience as a mercenary abroad taking precedence over simple recruitment or post-army specialisation. This ensures that most Housecarls are well and truly ready to thwart any threat to their liege, no matter how overwhelming it may be."
 engenglisc: "Standardized Ænglish"
 engenglisc_desc: "The Ænglish language is rapidly evolving, with an ever-expanding number of loan words from across the Channel, the Scots, and beyond. In order to prevent mutually unintelligible dialects in the future, and to better accomodate diplomatic and administrative tasks, a common tongue must be constructed. The Cyning's Ænglish will be considered mandatory to learn by the educated classes, eventually overtaking the churls' many spoken Ænglish variants. No more shall there be an Ænglaland, Ænglalond, and Ængland, nor an Anglisc, Ænglisc, and Ængelisc. Henceforth, there will always be an Ængland, which speaks and writes the Cyning's Ænglish."
 engchronicle: "Church Chroniclers"
 engchronicle_desc: "The Ængelcynn Church is one of the most important institutions within Ængland, overseeing ecclesiastical matters under the Cyning's oversight. The best-educated of the people of Ængland, short of the nobility, the clergymen are responsible for documenting every aspect of the realm for both posterity and improvement. Their role shall be expanded so that travelling scholars will receive Crown funding, in exchange for adding to the Anglo-Saxon Chronicle with information both historical and political. Furthermore, the most learned men will be kept in the Cyning's company, so as to note down every facet of court life and the duties of rulership during each reign. Although such court chroniclers have been around for an untold many years, their role is now more vital than ever for capturing the essence of what is Ængland, and they have a fancy new title to show for it."
 engheptarch: "The Late Heptarchy"
 engheptarch_desc: "The Heptarchs are the most powerful men of Ængland, each ruling over one of the seven administrative divisions of the country as theoretical equals to one another while swearing fealty to the Cyning. What works on paper, however, rarely if ever does so in practice. The Heptarchs have grown too powerful and too dangerous, each knowing full well that any one of them could be the next Cyning of Ængland. Despite this, they have also fallen into a great deal of debt to the Crown. By leveraging the economically dire straits of the six lords not on the throne, a number of laws can be instituted by which they shall be brought under heel. Deprived of the right to field their own military forces and police, forced to pay annual taxes to the Crown once again, and ceding all lands not directly part of residential estates to the Crown, the Heptarchs will no longer be a conceivable danger to anyone. That is, to anyone but themselves."
 engcyning: "The Cyning's Witan"
 engcyning_desc: "Semi-constitutional monarchy has served its purpose in Ængland well enough, but outstayed its welcome nonetheless. The Crown's power gradually devolved yet again, albeit this time into the hands of the Earls, Yeomen, and Churls rather than Heptarchs. Through lessons learnt, it is clear that all the power of the state must be concentrated into the Cyning's authority. The Witen shall no longer hold legislative duties as they did in the Gemot or the Red which succeeded it; their post is to be one of an advisory nature, but permanent through and through. His Majesty shall rule with an iron, but fair, fist and the people shall celebrate him all the more for it. An enlightened monarch in an enlightened time, surrounded by enlightened men. God Save the Cyning!"
 enghereditary: "The Hereditary Succession Act"
 enghereditary_desc: "The Ænglish throne has never officially been a hereditary post, with the monarchical candidates being derived from the Heptarchs upon the death of the Cyning-regnant. This of course has its benefits, but a most notable increase in political turmoil leading up to Coronation Day is not helped by the lack of defined succession. The ever-growing irrelevance of the Witen outside of their role as royal advisors has also made the tradition of selecting a Cyning's successor somewhat of a humiliating affair for all involved. A radical new bill known as the Hereditary Succession Act shall abolish the last vestiges of the Witen's influence and furthermore the bastardised elective system within Ængland. No more shall riled churls question whether they, too, could reign if it is succession by vote. There is only one bloodline fit to sit on the throne, and its right to rule has been ordained by both the law and God's will."
 mechanic_disables_witenagemot_elections_yes: "Disables Witenagemot Elections."
 engwarships: "Ængelcynn Warships"
 engwarships_desc: "Our warships were made to rule the waves across the seven seas. We must ensure that they are in a good condition and put even greater emphasis on their further modernization."
 engoak: "Hearts of Oak"
 engoak_desc: "As Ængland's first line of defence and the first military force to be made permanent, by royal edict after the Ænglo-Frankish War, the Royal Navy has proven itself most venerable. Drawing recruits largely from the rugged coastal settlements, there have never been hardier men in all the realm to stand vigilant against foreign aggression. This can be supplemented even further by modernising warship designs and further refining maritime training; for the Wooden Wall to spread from Dover to Calen. Both man and ship shall have unwavering hearts of oak, so they may fight and conquer time and again."
 engcompany: "Ænglish Colonial Companies"
 engcompany_desc: "The New World is a land of untapped potential, undoubtedly harbouring many of its riches from our intrepid expeditions and perfidious rivals. By granting charters to prospective colonial ventures, perhaps with some additional permanent aid in exchange for a cut of the profits, Ængland's dominance across the seas is all but assured. His Majesty's heirs shall preside over an empire on which the sun will never set!"
 eng_marine_reform: "Commando Training"
 eng_marine_reform_desc: "Marines are armed to conquer, armed to protect, armed to kill - tantamount to the soldiers in our armies. Thus they should be trained as such - as soldiers, pillars of professionalism, hard as iron and sharp as a razor’s edge."
 eng_marine_reform_negate: "§YReform Mechanics:§!\nNegate the §R+10.00%§! Shock Damage received by §TMarines§!."

# Decisions #
 abolish_witan_title: "Reform the Witenagemot"
 abolish_witan_desc: "The Witenagemot has proven itself time and again to be unreliable in its current state. While it will surely anger the nobility, we have no choice but to swiftly yet surely reform it from the ground up."
 ABOLISH_WITAN_TT: "\nReplacing the Witenagemot with the Witenred will greatly reduce the power of the §YHeptarchs§!. §RThey won't find this new arrangement acceptable...§!"
 gbr_act_title: "The Act of Union"
 gbr_act_desc: "The kingdoms of Great Britain were already united into a single nation. Let us now elevate the Irish realm into an equal partner and proclaim the United Kingdom of Britannia and Ireland!"
 form_albion_title: "Form Britannia"
 form_albion_desc: "As we now rule over the dominions of Ængland and Scotland, people urge us to form a new kingdom symbolizing our unity. From the legends of king Arthur, we shall proclaim the Great Britannia!"
 england_prison_title: "Clear Out the Debtor's Prisons"
 england_prison_desc: "Because of, and perhaps contributing to, urban overpopulation, there aren't enough jobs or homes for all of the lower classes. As many of these impoverished labourers have nowhere else to go, they wind up in crippling debt - which they can't repay - and are consequently thrown into debtor's jail for months at a time. Rather than letting this cycle persist, we should perhaps give the destitute and indebted of England a chance at a fresh start in one of our colonies."
 ENG_30_YEARS: "You can enact this decision every §Y30§! years."

# Events #
 antebellum_england.1.t: "The Witenagemot Convenes"
 antebellum_england.1.d: "The Witenagemot has served as England's advisory council and governing body, on behalf of the Crown, for centuries. Composed of the most powerful magnates and aristocrats within the English realm, this council is the de facto “kingmaker”, as a monarch’s legitimacy stems from the approval of the Witan - the wise men on the council. As our previous cyning passed away, the Witenagemot assembles once again to choose our next ruler."
 antebellum_england.1.a: "We will retain a descendant of Alfred!"
 antebellum_england.1.b: "Give the Godwinsons another chance!"
 antebellum_england.1.de: "Let's see how the Midlanders rule!"
 antebellum_england.1.e: "The North will shake things up a bit!"
 antebellum_england.1.c: "I'm sure the [Root.Monarch.Dynasty.GetName] will do just fine on the throne!"
 antebellum_england.1.f: "Allow [Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName] as [Root.Monarch.GetTitle] until the [Root.Heir.Dynasty.GetName] is of age."
 antebellum_england.1.g: "Allow [Root.Monarch.GetName] as regent until the [Root.Heir.Dynasty.GetName] is of age."
 ENG_CURRENT_DYNASTY_CONSORT: "Our [Root.Monarch.GetTitle] will care for the throne until the ruler is of age."
 ENG_CURRENT_DYNASTY_REGENT: "Our regent will care for the throne until the ruler is of age."
 antebellum_england.2.t: "Uprising of Lord Aerthos"
 antebellum_england.2.d: "Lord Aerthos, the head of the house Godhelming, one of the most powerful and influential houses of Essex has gathered his subjects and started an open rebellion against the crown! He declared that the king is an incompetent ruler as has to be removed from power for the good of England."
 antebellum_england.2.a: "He must de dealt with!"
 antebellum_england.4.t: "Marine Drill of [GetDate]" 
 antebellum_england.4.d: "His Majesty's Corps of Royal Marines are among the most elite branches of our armed forces, often deciding the difference between defeat or victory in the heat of battle. To maintain their fearsome reputation, however, regular - and particularly gruelling - drills are essential. The Royal Marine Depots across the realm host the majority of the exercises, with the rest taking place in the northern Moors. In order to maximise their skill in combat, it is ideal to ensure the marines are specialised in a particular field, lest they become a jack of all trades yet a master of none. On the agenda are potential courses for disciplined disembarking from our transports, sapper training to aid in sieges, and delaying actions to hurt the enemy vanguard in battle." 
 antebellum_england.4.a: "Focus on orderly disembarkation" 
 antebellum_england.4.b: "Focus on siege warfare" 
 antebellum_england.4.c: "Focus on skirmishing tactics"
 antebellum_england.6.t: "The Danegeld"
 antebellum_england.6.d: "Historically, the Danegeld was raised when the kingdom was under the threat of a Norse invasion. The finances collected through this taxation were used to pay off the tribute to the Nordic kingdoms and thus, it protected the English kingdom from subjugation. Lately, many members of the Witan have been suggesting to raise this tax once more, however, this time the tax would be used to finance the revitalization of our armies and an attempt to cleanse England of the Danish influence forever. If such tax is raised, then it is pretty much guaranteed that the population won't be very fond of it."
 antebellum_england.6.a: "We need more finances"
 antebellum_england.6.b: "We cant afford to upset the population"
 antebellum_england.9.t: "Fall of the Danelaw"
 antebellum_england.9.d: "In the year 1395, the Danish King and his great heathen army descended onto England at our weakest time. Seizing all of York and plundering all the wealth in the region; but there was some good to come from this. If it was not for the invasion, England might have destroyed itself in the Heptarch War. The Heptarchs and King put aside their differences and formed a loose coalition against the Danes. One thing was in agreement, once the last Danish viking is either kicked off England or slaughtered, then the conflict between King and Heptarch could be resumed.\n\nWith internal conflicts partially resolved, the Heptarchs and the King of England would slowly begin the reclamation of our lost land. 50 years of small skirmishes and long sieges had reduced the Danes to the city of Hull. The fortress in Hull remained under firm Danish control until its recent fall to the coalition. The Danelaw has finally been destroyed, and with it, any attempt of viking conquest of Britain. Once more, England is free!"
 antebellum_england.9.a: "Cast the Heathen into the sea!"
 antebellum_england.10.t: "Remembering Haestingas"
 antebellum_england.10.d: "In the fateful year of 1066, the Normans almost cast their yoke upon our people, but Duke William was a fool, and his trampling at Haestingas spared England from a ruinous fate.\n\nTo that end, it was only fair that His Majesty's Finest pay the old enemy across the Channel a visit, putting an end to Anglo-Norman hostilities once and for all.\n\nFollowing several decisive engagements, the Norman flotilla lay wrecked upon the coast, while the Duke's army was beaten into flight by the formidable shield wall, leaving yet another liege trampled in the field.\n\nFollowing a brief period of suppression in the aftermath of this lightning occupation, the royal retinue made their jubilous return to rugged England, bearing the Ducal seal as proof that the Cyning had avenged those lost in at Haestingas, Calen, and Normandy.\n\nCelebrations were held all across the land in memory of these pivotal battles, especially Haestingas, which had become mythologised in the cults of Harold Godwinson and Edgar Atheling; a glorious last stand atop a weathered hill, beating back savage blows from daybreak 'til dusk, then dawn once again, emerging from night's pale shadows in splendid triumph.\n\nPlaying into the legend of the Great Battle, the Cyning's victorious forces paraded through every city from Dover to Durham, attempting to retrace much of Harold II's route from the capital to Stamford Bridge, then his rapid march back down to Haestingas.\n\n Indeed, the entire kingdom entered a full month of festivities, greatly depleting the plunder seized from Rouen's Ducal Treasury. It was deemed a necessary sacrifice, however, as the remembrance of Haestingas following such immaculate victory is a monumental occasion worth every scilling.\n\nA days-long festival was held at Haestingas upon the Cyning's arrival, with every pub, inn, and tavern within the country supplying beer after the royal stock depleted. Ballads and sagas were sung in the glow of a thousand bonfires, while effigies of William the Bastard were ritually stomped upon and set ablaze.\n\nEngland may have suffered much over the centuries, and not all of the kingdom's scars have healed over. Today, though, and just today, is one in which every man, woman, and child of good English stock can band together in celebration of freedom from foreign tyranny, and remembrance of the glorious dead."
 antebellum_england.10.a: "Thus falls Perfidious Normandy!"
 antebellum_england.11.t: "The Acts of Union"
 antebellum_england.11.d: "The assembly hall was packed to the brim with delegates, representatives, and grifting parliamentarians from every constituency and corner of England, and her many dependencies across the British Isles. For years, it has been a logistical and bureaucratic nightmare to not just travel between, but also reign over, the multitude of realms held in union under English rule.\n\nEach emissary has brought forward their own local laws and customs, many of which do not line up with those from even a shire over. The Cyning’s right to levy taxes in England, furthermore, is legislated and enforced completely differently in Scottish and Irish territories.\n\nThe myriad of issues surrounding the prior, and long lasting autonomy of, the subordinate realms has rendered a naturally occurring and united British culture near impossible to cultivate. Now, though, a genuine and herculean effort has been undertaken to truly unite the realms, with a universal legal code and common language based primarily upon the English one.\n\nEach participant was made to present their case before the Cyning and his Witenred, ensuring that every successive policy to be contained within the new royal charter received absolute, albeit equal, consideration. After all the laws were set in place, and innumerable compromises had been negotiated between quarreling parties, all that was left was to sign the impending Acts of Union.\n\nIt took nearly a day for each delegate to sign it, then have it ratified or amended by each party present, but once the Cyning impressed his seal onto the venerable document, all was well in Britannia. The once separate crowns now stand as one; whole and indivisible.\n\nMay the sun never set on great Britannia!"
 antebellum_england.11.a: "This was their Finest Hour"
 ab_heptarch_wars.1.t: "The Heptarch Wars"
 ab_heptarch_wars.1.d: "For several centuries the English monarchy has chafed under the buckling weight of the Witenagemot's dominance. Comprised of the kingdom's leading men, its most powerful clique consists of the Heptarchy; petty kings who rule de jure over England's seven constituent realms. Although their numbers have been reduced to a meagre four, of the Houses Westseaxe, Godwine, Hwicce, and Bamburgh, they exercise considerable influence over state affairs. Only a Heptarch is eligible to be elected Cyning by the Witan, and although the Wessex line has maintained their grasp on the throne since Edgar II's reign in the late 11th Century, his death in AD 1127 marked the beginning of the Heptarch Wars. Wessex's rivals all covet the throne, and have made several attempts to seize power, but each time the Crown has prevailed over its would-be usurpers. Some had hoped that the Peace of Eoforwic in AD 1395 would have returned England to the status quo, which it did - for a time. The Heptarchs were thwarted once before but Wessex, too, has atrophied much over the years. The Cyning's meddling in administrative affairs and attempts at reform have not gone unnoticed, and now the hourglass runs empty. Those envious magnates of Anglia, Mercia, and Northumbria grow ever more desperate for power, now that their precious Witenagemot is at stake. Taking up arms against what they believe to be royalist tyranny, chroniclers will write of this Third Heptarch War as the 'time Christ and His angels were asleep'."
 ab_heptarch_wars.1.a: "The Cyningrice is in peril!"
 ab_heptarch_wars.2.t: "End of the Heptarch Wars"
 ab_heptarch_wars.2.d: "All across England, villages lie silent - desolate - as the sun rises. Fields are littered with the dead and dying; the vanquished were deemed traitors unfit for proper burial. Where once the crashing and thunder of battle echoed throughout the foggy moors, an oppressive silence now lingers. Nary a sound but the rustle of the wind can be heard as it sweeps through the burnt-out husks of homesteads and forts. This is the sound of peace, of triumph. A hard-fought war against kith and kin, followed by the most bitter harvest. The victorious Heptarch now parades in his bejewelled and elaborate armour, prancing about through every burgh and city which backed him as the royal retinue makes its way to Wintanceastre, the capital of the Cyningrice and the Pearl of Britannia. How long it will take to recover, nobody knows. Nor can it be divined as to when things may return to 'normal' - whatever that means in these dark times. What can be said, at least, is that England's times of internal trouble are now coming to an anticlimactic end. For better or for worse, the Heptarchy - and the realm as a whole - will never be the same again."
 ab_heptarch_wars.2.a: "Quoth the Cyning: Nevermore"
 ab_heptarch_wars.3.t: "The Heptarch Wars"
 ab_heptarch_wars.3.d: "The once powerful Kingdom of England has fallen into civil war! Many states, subrealms, duchies and other polities have seceded from the English crown and are now fighting for control over the country. This is a moment that we have waited for a long time, for we have always wanted an opportunity to weaken England. We can choose to support one of the rival heptarchs to further our agenda."
 ab_heptarch_wars.3.a: "We will support the rebels militarily"
 ab_heptarch_wars.3.b: "We will send an expeditionary force"
 ab_heptarch_wars.3.c: "We will fund the rebels financially"
 ab_heptarch_wars.3.de: "This is their internal matter"
 ab_heptarch_wars.4.t: "Mercia Declares Independence"
 ab_heptarch_wars.4.d: "Mercia has seceded! What was historically one of the most powerful heptarch kingdoms established on the British Isles following the Anglo-Saxon migration and settlement, they were unified under the English crown following the proclamation of the Kingdom of England however a sense of regional identity vaguely persisted through the ages. Whatever the reason, Mercia has seceded from the English crown and is now fighting against us, something must be done."
 ab_heptarch_wars.4.a: "The Hwicces are no challenge for the crown!"
 ab_heptarch_wars.4.b: "There is nothing we can do"
 ab_heptarch_wars.5.t: "Revolt of the Westseaxes"
 ab_heptarch_wars.5.d: "Westseaxe has seceded! The region of Westseaxe contains some of the most prosperous cities, containing many commercial ports and military bases. As one of the original heptarchs, a regional identity in Westseaxe persisted through the ages, and now during a time of civil war, they have broken free. We need to convene our council and decide what to do about this."
 ab_heptarch_wars.5.a: "They stand no chance!"
 ab_heptarch_wars.5.b: "There is nothing we can do"
 ab_heptarch_wars.6.t: "The Northern Uprising"
 ab_heptarch_wars.6.d: "Northumbria has seceded! One of the original heptarch kingdoms prior to the unification of England. The region was subjected to heavy fighting between English and Nordic forces who kept on establishing control over the region. This secession might cause Nordic powers to eye this region hungrily once again, we should do something about this."
 ab_heptarch_wars.6.a: "The North will pay!"
 ab_heptarch_wars.6.b: "There is nothing we can do"
 ab_heptarch_wars.7.t: "The Godwins Challenge the Crown"
 ab_heptarch_wars.7.d: "East Anglia has seceded! One of the first regions to be settled by the Germanic tribe of the Anglo-Saxons, hence the name East Anglia. Therefore, this region holds significant cultural value to the Kingdom of England. The secession has caused some panic amongst our generals due to its close proximity to our capital, we should do something about this."
 ab_heptarch_wars.7.a: "They will pay for their treachery!"
 ab_heptarch_wars.7.b: "There is nothing we can do"
 ab_heptarch_wars.8.t: "The Great Scottish Uprising"
 ab_heptarch_wars.8.d: "The Scottish people have always been unruly under English control. We spent a long time trying to subjugate their people and now they have taken advantage of the ongoing chaos in England and launched a massive rebellion in an effort to establish an independent Scottish state once more. Our armies are overextended from dealing with rebellions in other places, however losing Scotland is not something we can afford due to the region's economic and military importance."
 ab_heptarch_wars.8.a: "The Scots are not prepared to face our wrath!"
 ab_heptarch_wars.9.t: "Unrest in Wales"
 ab_heptarch_wars.9.d: "The Welsh people are known to be an independent bunch and they will launch a war for their independence if given the chance. Fortunately for them and unfortunately for us, this opportunity came recently with the massive civil war and national distress England has fallen into. Taking advantage of the ongoing chaos, several Welsh nationalist movements have declared independence from England in order to reestablish a Welsh state. Something must be done about this."
 ab_heptarch_wars.9.a: "We will crush their rebellion!"
 ab_heptarch_wars.10.t: "The Irish Insurrection"
 ab_heptarch_wars.10.d: "The isle of Ireland is not subject to the same level of centralised governing unlike the provinces on the mainland due to its geographical location. The Irish clans that used to rule over the various polities of Ireland have launched revolts in the past but we were mostly able to keep them down with ease. However this time due to the ongoing national state of chaos, the clans have risen once again trying to break free. Something must be done about this."
 ab_heptarch_wars.10.a: "Blighted traitors!"
 SUPPORTED_HEPTARCH: "The English will suffer additional negative events and face more rebellions."
 heptarch_wars: "Heptarch Wars"
 ENG_HEPTARCH_RIVAL: "\nOur §Yrivals§! can involve themselves in the §YHeptarch Wars§! and §Rsupport§! the pretender rebels."

